<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="version" content="1.0.0">
<title>MDA Metadata Capture — Digital Zambia Acceleration Project</title>
<style>
  :root{
    --blue:#13395e; --blue2:#1d4e7e; --accent:#2f80c2; --accent2:#e8f1fa;
    --ink:#1b2733; --muted:#5b6b7b; --line:#d8e0e8; --bg:#f3f6f9; --card:#ffffff;
    --yellow:#fff7d6; --yellowline:#e9d68a; --good:#1a7f4b; --warn:#b25e00; --bad:#b32036;
    --chip:#eef3f8; --radius:10px; --shadow:0 1px 3px rgba(16,40,70,.08),0 1px 2px rgba(16,40,70,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
  h1,h2,h3,h4{margin:0 0 .3em;line-height:1.25}
  a{color:var(--accent)}
  /* ---- top bar ---- */
  header.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--blue),var(--blue2));
    color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
  .topbar .brand{font-weight:700;font-size:16px;letter-spacing:.2px;white-space:nowrap}
  .topbar .sub{font-size:11.5px;opacity:.8;white-space:nowrap}
  .topbar .spacer{flex:1}
  .verbadge{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
    padding:3px 9px;border-radius:999px;font-size:11.5px;white-space:nowrap}
  .btn{background:#fff;color:var(--blue);border:1px solid rgba(255,255,255,.4);
    padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn:hover{background:#eef4fa}
  .btn.ghost{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.35)}
  .btn.ghost:hover{background:rgba(255,255,255,.18)}
  .btn.sm{padding:4px 9px;font-size:12px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap}
  /* ---- layout ---- */
  .wrap{display:flex;min-height:calc(100vh - 54px)}
  nav.side{width:270px;flex:none;background:var(--card);border-right:1px solid var(--line);
    padding:14px 10px;overflow-y:auto;position:sticky;top:54px;height:calc(100vh - 54px)}
  nav .group{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:14px 8px 6px;font-weight:700}
  nav .navitem{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
  nav .navitem:hover{background:var(--accent2)}
  nav .navitem.active{background:var(--blue);color:#fff}
  nav .navitem .code{font-weight:700;font-size:12px;min-width:26px}
  nav .navitem .lbl{font-size:12.5px;flex:1}
  nav .navitem .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
  nav .navitem .dot.part{background:var(--warn)}
  nav .navitem .dot.done{background:var(--good)}
  main{flex:1;padding:22px 26px 80px;overflow-x:hidden;max-width:1100px}
  /* ---- dataset bar ---- */
  .dsbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
  .dsbar label{font-size:12px;color:var(--muted);font-weight:600}
  select,input[type=text],input[type=date],input[type=email],textarea{
    font-family:inherit;font-size:13px;color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:7px 9px;background:#fff;width:100%}
  select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  textarea{resize:vertical;min-height:62px}
  .fill input,.fill textarea,.fill select{background:var(--yellow);border-color:var(--yellowline)}
  /* ---- cards & help ---- */
  .page-h{margin-bottom:6px}
  .page-h h2{font-size:21px;color:var(--blue)}
  .page-h .tag{display:inline-block;font-size:11px;color:#fff;background:var(--accent);border-radius:6px;padding:2px 8px;margin-left:8px;vertical-align:middle}
  .lead{color:var(--muted);margin:0 0 16px;max-width:820px}
  .infobox{background:#f0f6fc;border:1px solid #cfe0f0;border-left:4px solid var(--accent);
    border-radius:8px;padding:12px 14px;margin:0 0 18px}
  .infobox h4{color:var(--blue);font-size:13px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.4px}
  .infobox p{margin:6px 0 0;font-size:13px}
  .infobox details{margin-top:8px}
  .infobox summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:12.5px}
  .infobox .why{margin-top:8px;font-size:12.5px;color:var(--ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .req{display:grid;grid-template-columns:72px 1fr;gap:4px 14px;padding:14px 0;border-top:1px solid var(--line)}
  .req:first-child{border-top:none}
  .req .code{font-weight:800;color:var(--blue);font-size:15px}
  .req .ob{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
  .req .ob.block{color:var(--bad);font-weight:700}
  .req .rname{font-weight:700;font-size:14.5px}
  .req .provide{font-size:12.5px;color:var(--muted);margin:3px 0 8px}
  .req .accept{font-size:12px;color:var(--muted);font-style:italic;margin-top:2px}
  .exline{margin-top:7px}
  .ex{background:#eef7f0;border:1px solid #c7e6cf;border-radius:7px;padding:8px 10px;font-size:12.5px;margin-top:6px;display:none}
  .ex.show{display:block}
  .ex b{color:var(--good)}
  .ex-btn{background:none;border:none;color:var(--good);font-weight:600;cursor:pointer;font-size:12px;padding:0}
  .ex-btn:hover{text-decoration:underline}
  .row2{display:grid;grid-template-columns:1fr 190px;gap:10px;align-items:start}
  .row3{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{margin:8px 0}
  .field>label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:4px}
  .field .hint{font-size:11.5px;color:var(--muted);margin:0 0 5px}
  .prov-wrap label{font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px}
  /* ---- tables ---- */
  table.grid{width:100%;border-collapse:collapse;font-size:12.5px}
  table.grid th{background:var(--chip);text-align:left;padding:7px 8px;border:1px solid var(--line);
    font-size:11px;color:var(--blue);vertical-align:top;position:relative}
  table.grid th .th-help{display:block;font-weight:400;color:var(--muted);font-size:10.5px;margin-top:2px;max-width:160px}
  table.grid td{border:1px solid var(--line);padding:3px;vertical-align:top}
  table.grid td input,table.grid td textarea,table.grid td select{border:none;border-radius:0;padding:6px;background:var(--yellow)}
  table.grid td input:focus,table.grid td textarea:focus{outline:2px solid var(--accent);outline-offset:-2px}
  table.grid td.rowtools{background:#fafcfe;width:34px;text-align:center}
  .delrow{background:none;border:none;color:var(--bad);cursor:pointer;font-size:15px;line-height:1}
  .addrow{margin-top:8px}
  .refwrap{overflow-x:auto}
  /* ---- readiness ---- */
  .ready{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600}
  .pill{border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700}
  .pill.ok{background:#e4f5ea;color:var(--good)}
  .pill.part{background:#fdefdc;color:var(--warn)}
  .pill.no{background:#fbe4e8;color:var(--bad)}
  .blocklist{margin:10px 0 0;font-size:12.5px}
  .blocklist li{margin:3px 0}
  .counter{font-variant-numeric:tabular-nums;font-weight:800;color:var(--blue)}
  /* ---- reference viewer ---- */
  .domaincard{border:1px solid var(--line);border-radius:8px;margin:8px 0;overflow:hidden}
  .domaincard summary{padding:9px 12px;background:var(--chip);cursor:pointer;font-weight:600;color:var(--blue);display:flex;gap:8px;align-items:center}
  .scope{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700}
  .scope.inx{background:#e4f5ea;color:var(--good)}
  .scope.out{background:#eef1f4;color:var(--muted)}
  .domaincard ul{margin:8px 16px 12px;columns:2;font-size:12.5px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);z-index:100;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  footer.ft{border-top:1px solid var(--line);padding:14px 26px;color:var(--muted);font-size:11.5px;
    display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--card)}
  .mini{font-size:11px;color:var(--muted)}
  .pct{display:inline-block;min-width:38px;text-align:right}
  @media print{
    header.topbar,nav.side,.dsbar .toolbar,.no-print{display:none!important}
    .wrap{display:block}main{max-width:none;padding:0}
    .ex{display:none!important}
  }
  @media(max-width:860px){nav.side{display:none}.row2,.row3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div>
    <div class="brand">MDA Metadata Capture</div>
    <div class="sub">Digital Zambia Acceleration Project · ZM-SZ-466193-CS-QBS · Modelware Systems</div>
  </div>
  <div class="spacer"></div>
  <div class="toolbar">
    <button class="btn ghost sm" onclick="loadExamplePack()" title="Populate a fully worked TPIN dataset">Load worked example</button>
    <button class="btn ghost sm" onclick="pickFile()">Open project…</button>
    <button class="btn ghost sm" onclick="saveProject()">Save project (.json)</button>
    <button class="btn sm" onclick="exportReadinessJSON()">Export JSON</button>
    <button class="btn sm" onclick="exportXLSX()">Export Excel pack</button>
    <button class="btn ghost sm" onclick="window.print()">Print / PDF</button>
  </div>
  <span class="verbadge">v<span id="appVersion"></span> · <span id="buildStamp"></span></span>
</header>

<div class="wrap">
  <nav class="side" id="sidenav"></nav>
  <main id="main"></main>
</div>

<footer class="ft">
  <span>MDA Metadata Capture <b>v<span id="appVersionFt"></span></b></span>
  <span class="mini">Build <span id="buildStampFt"></span></span>
  <span class="mini">Pack last edited: <span id="updatedStamp">—</span></span>
  <span class="mini">Autosaves to this browser. Use <b>Save project</b> to keep a file.</span>
  <span class="spacer" style="flex:1"></span>
  <span class="mini">The DM Artefact Metamodel &amp; pack structure © Modelware Systems</span>
</footer>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".json" style="display:none" onchange="onFilePicked(event)">

<script>
"use strict";
/* ============================================================================
   MDA METADATA CAPTURE  —  self-contained capture app for the MDA Metadata Pack
   Version source of truth = <meta name="version">.  Build stamp below.
   ========================================================================== */
const APP_BUILD = "2026-11-27";
const APP_VERSION = document.querySelector('meta[name="version"]').content;
document.getElementById('appVersion').textContent = APP_VERSION;
document.getElementById('appVersionFt').textContent = APP_VERSION;
document.getElementById('buildStamp').textContent = APP_BUILD;
document.getElementById('buildStampFt').textContent = APP_BUILD;

/* ---------------------------------------------------------------------------
   1. STATIC CONFIG — requirements, help text, column specs, governed vocab
   ------------------------------------------------------------------------- */

// Part A — About the dataset (D1–D13). example = TPIN worked response.
const PART_A = [
 {c:"D1",n:"Dataset identity",ob:"Mandatory",block:false,
  p:"The dataset's official name, any other names it's known by, a short plain description, and an identifier if it has one.",
  a:"Stable name/ID and understandable description supplied.",
  ex:"Taxpayer Register (TPIN). Alias: Taxpayer Master. ID: ZRA-TPIN-001."},
 {c:"D2",n:"Purpose and mandate use",ob:"Mandatory",block:false,
  p:"A few sentences on what the dataset is for, which service or process uses it, and who the main users are.",
  a:"Purpose and supported process are explicit.",
  ex:"Registers all taxpayers for assessment & collection (VAT, PAYE, CIT). Consumers: ZRA Domestic Taxes; MoFNP revenue forecasting."},
 {c:"D3",n:"Nomination rationale",ob:"Mandatory",block:false,
  p:"Why you chose this dataset for the pilot, how important it is to your mandate and what makes it a good example.",
  a:"MDA explains relevance to mandate and pilot diversity.",
  ex:"High priority; core to the revenue mandate; representative large administrative transactional dataset."},
 {c:"D4",n:"Ownership and contacts",ob:"Mandatory",block:true,
  p:"Names and contact details for the Data Owner, the person who looks after it day-to-day (steward/custodian), and a technical contact.",
  a:"Named organisational roles and reachable contacts.",
  ex:"Data Owner: Director Domestic Taxes. Business Data Steward: J. Mwale (j.mwale@zra.org.zm). Technical contact: DBA team."},
 {c:"D5",n:"Source and authoritativeness",ob:"Mandatory",block:true,
  p:"Where the data comes from (which system), who owns that system, and whether this is the original record or a copy/derived version.",
  a:"Source and authority status are stated and internally consistent.",
  ex:"Authoritative system of record, TaxOnline (ZRA). Not a copy or derived product."},
 {c:"D6",n:"Subject/entity coverage",ob:"Mandatory",block:false,
  p:"What the data is about, the main things, people or events it records, and the fields that identify each one.",
  a:"Scope and key fields can be understood.",
  ex:"Subjects: taxpayers (natural persons & legal entities). Events: registration, returns, assessments. Business key: TPIN."},
 {c:"D7",n:"Structure and schema",ob:"Mandatory",block:false,
  p:"A list of the fields with, for each, its name, meaning, type, and whether it is a key (a data dictionary or annotated field list).",
  a:"At minimum: field name, meaning, datatype and key indicators.",
  ex:"See 03 Schema & Dictionary, 8 fields with meaning, datatype and keys.",evid:"SCHEMA-01"},
 {c:"D8",n:"Representation and volume",ob:"Mandatory",block:false,
  p:"The file format and roughly how big it is, number of rows/records and size.",
  a:"Format and approximate scale documented.",
  ex:"CSV, UTF-8, ~4.2M rows, ~1.1 GB, partitioned by tax year."},
 {c:"D9",n:"Coverage and history",ob:"Mandatory (N/A allowed)",block:false,na:true,
  p:"The time period it covers, how far back it goes, the areas/organisations included, and anything deliberately left out.",
  a:"Boundaries and material exclusions stated.",
  ex:"Covers 2015-2025, national; grain: individual taxpayer; excludes pre-2015 archived records."},
 {c:"D10",n:"Origination",ob:"Mandatory",block:false,
  p:"How the data is collected or produced, for example captured at application, from a survey, or derived from another system.",
  a:"Originating activity and major upstream input identified.",
  ex:"Captured at e-registration / e-filing; upstream input: taxpayer self-service portal."},
 {c:"D11",n:"Refresh and timeliness",ob:"Mandatory",block:false,
  p:"How often it is updated, when it was last updated, and any expected delay between an event and it appearing in the data.",
  a:"Frequency, currency date and known delays documented.",
  ex:"Updated nightly; last refresh 2026-10-24; published monthly."},
 {c:"D12",n:"Representative sample",ob:"Mandatory",block:true,
  p:"A safe sample extract with a short README, or, if raw data can't be shared, a masked/redacted/synthetic version plus the reason, approved by the owner.",
  a:"Usable extract/substitute, period, record count, masking and approval stated.",
  ex:"Masked 1,000-row extract (TPIN hashed), 2025 data, approved by Data Owner 2026-10-20; README included.",evid:"EXTRACT-01"},
 {c:"D13",n:"Sharing and dependency context",ob:"Mandatory (N/A allowed)",block:false,na:true,
  p:"Who you receive this data from and who you send it to, by what method (file, API), how often, and any agreements involved.",
  a:"Material exchanges and dependency direction documented.",
  ex:"Receives NRC data from Dept of National Registration; exports monthly aggregates to ZamStats via SFTP (MOU in place)."}
];

// Part B — About the metadata (M1–M10)
const PART_B = [
 {c:"M1",n:"Business metadata",ob:"Mandatory",block:false,
  p:"A clear, plain-language description of the dataset that a non-technical colleague would understand.",
  a:"Clear, non-circular description with business context.",
  ex:"Plain description present (see D1/D2), non-circular, with purpose, subjects and consumers."},
 {c:"M2",n:"Technical metadata",ob:"Mandatory",block:false,
  p:"The technical details needed to read the data: schema, field types, keys, format, encoding and any constraints.",
  a:"Schema and sample align materially.",
  ex:"Schema in 03 tab aligns materially with the sample extract.",evid:"SCHEMA-01"},
 {c:"M3",n:"Operational metadata",ob:"Mandatory",block:false,
  p:"Its current operational state: source, update schedule, last update, size, and version/status.",
  a:"Current-state values or documented unknowns supplied.",
  ex:"Source TaxOnline; nightly refresh; last 2026-10-24; ~4.2M rows; version 2025.3."},
 {c:"M4",n:"Governance / stewardship",ob:"Mandatory",block:false,
  p:"Who is accountable for the dataset, owner, steward, custodian, approver, and how to reach them with an issue.",
  a:"Roles and contact route present.",
  ex:"Owner / steward / custodian / approver named (see D4); issues to dataquality@zra.org.zm."},
 {c:"M5",n:"Data sensitivity classification",ob:"Mandatory",block:true,
  p:"The confidentiality level 1–4 on the Government harm-based scale, with your own label; tick any flag (personal, sensitive, health, critical, exchanged over public networks); access/handling/sharing restrictions. Capture detail on the 05 Classification tab.",
  a:"Level 1-4 assigned with a label held as metadata; flags set; restrictions stated.",
  ex:"Confidentiality Level 3 (Confidential); label held as metadata. Personal = Yes; sensitive/health/critical/public-network = No. Statutory basis: ZRA Act s.21 (tax secrecy). See 05 Classification.",evid:"CLASS-01"},
 {c:"M6",n:"Data-quality metadata",ob:"Mandatory",block:false,
  p:"Anything you already know about data quality, known issues, existing checks or rules, thresholds, and any quality reports.",
  a:"Issues/rules documented or explicitly stated as unavailable.",
  ex:"Known issue: ~2% missing addresses pre-2018. Validity check on TPIN format. DQ report Q3-2026 attached.",evid:"DQ-01"},
 {c:"M7",n:"Lifecycle / retention",ob:"Mandatory",block:false,
  p:"The retention or disposal rule that applies (or a reference to the schedule) and the next review date, or 'not determined'.",
  a:"Existing requirement/reference, or \"not determined\", is recorded.",
  ex:"Retention per ZRA records schedule RS-07 (10 years); next review 2027-01."},
 {c:"M8",n:"Reference / master / identifier",ob:"Mandatory (N/A allowed)",block:false,na:true,
  p:"Any code lists, classifications or identifier schemes the data uses, and where those come from, with versions.",
  a:"Applicable standards and owners/sources identified.",
  ex:"Code lists: Tax Type, Taxpayer Category (ZRA ref v3). Identifier scheme: TPIN. See 10a–10d and 11."},
 {c:"M9",n:"Interoperability / exchange",ob:"Mandatory (N/A allowed)",block:false,na:true,
  p:"Details of any data exchanges: interface name, who it is with, format, mapping, the standard used, and frequency.",
  a:"Material exchange metadata is present.",
  ex:"Exchange with ZamStats: monthly CSV, agreed field mapping, SFTP."},
 {c:"M10",n:"Provenance / lineage",ob:"Mandatory",block:false,
  p:"A high-level picture of where the data originates and the main steps it goes through to reach its current form.",
  a:"High-level source-to-dataset lineage is intelligible.",
  ex:"Origin e-registration → validation → register; high-level lineage diagram attached. See 07 Lineage / 08 Provenance.",evid:"LINEAGE-01"}
];

// Part C — Compliance & interoperability (C1–C5)
const PART_C = [
 {c:"C1",n:"Privacy and DPC readiness",ob:"Mandatory (N/A allowed)",block:false,na:true,
  p:"For personal, sensitive or health data: evidence against the Data Protection Act 2021 duties — registration, record of processing, DPIA, a named DPO, a breach procedure and a retention basis.",
  a:"DPA items evidenced (derived checklist; official DPC checklist pending).",
  ex:"Personal data (NRC, name, address). DPA registration under way; record of processing held; DPO designated; 24h breach process. Derived DPC checklist in CLASS-01.",evid:"CLASS-01"},
 {c:"C2",n:"Hosting / data residency",ob:"Mandatory (N/A allowed)",block:false,na:true,
  p:"Where the data and its backups are hosted, and confirmation it is in Zambia for personal or critical data.",
  a:"Hosting location evidenced; in-country for personal/critical data.",
  ex:"Hosted in ZRA's data centre in Lusaka; backups in-country. Meets in-country storage for personal data (DPA s.70)."},
 {c:"C3",n:"Machine-readable + metadata",ob:"Mandatory (N/A allowed)",block:false,na:true,
  p:"For data exchanged over public networks: that it is machine-readable and that metadata travels with it (e-Gov Act s.18).",
  a:"Machine-readable format and accompanying metadata evidenced.",
  ex:"Shared as CSV and XML with an accompanying data dictionary; machine-readable with metadata."},
 {c:"C4",n:"Data-sharing basis",ob:"Mandatory (N/A allowed)",block:false,na:true,
  p:"For each institution you share with: the agreement (DSA / MoU / SLA), the lawful basis and the coordinating officer.",
  a:"Sharing basis documented per flow.",
  ex:"ZamStats: MoU and DSA, monthly aggregate CSV. Dept of National Registration: inbound NRC under a data-sharing agreement."},
 {c:"C5",n:"Statutory registers maintained",ob:"Mandatory (N/A allowed)",block:false,na:true,
  p:"The registers your institution keeps under written law, each with the section that requires it (e-Gov Act s.2).",
  a:"Registers listed with section citations.",
  ex:"Taxpayer register maintained under the ZRA Act and Income Tax Act; not open to public inspection."}
];

const PROVIDED_OPTS = ["","Provided","Provided (restricted)","Not applicable (explain)","Not yet available (explain)"];

// Tab guide narrative (from the Tabs Guide) — what it is / why it matters / what it tells us
const TAB_GUIDE = {
 "02":{what:"The heart of the pack: one copy per dataset. Parts A (about the dataset, D1–D13), B (about the metadata, M1–M10), C (compliance, C1–C5) and D (catalog placement). Fill the yellow response cells, set the Provided? status, and put an evidence code when an answer is backed by a file on 06.",
   why:"This schedule is what an assessor reads first. A few items are blocking — ownership (D4), source & authoritativeness (D5), sensitivity classification (M5), a representative sample (D12) and a reachable stakeholder. If a blocking item is missing, the dataset is held at Not ready.",
   tells:"Completed well, it turns a nominated dataset from a file only its own team understands into a described, trusted, catalogued national data asset."},
 "03":{what:"A field-level data dictionary: one row per field in the dataset — name, business meaning, data type, length, nullability, key, the governed code list it points to, and notes.",
   why:"The dictionary is the contract for reading the data. It lets an assessor confirm the data matches its description and lets another system join to or reuse it without guessing. It is the evidence behind D7 (structure) and M2 (technical metadata).",
   tells:"Without it, a column named Status or Type is opaque. It tells us exactly how each field is defined and constrained, so correct data can be told from broken data."},
 "05":{what:"The sensitivity of the data and how it must be handled: an existing label, the harm if the data is exposed/altered/unavailable, handling rules, the Government confidentiality level (1–4) and the flags that drive the compliance checks.",
   why:"Classification decides who may see, hold and share the data, and which Part C duties apply. A personal, sensitive or health flag brings in the privacy and in-country hosting checks. It is the evidence behind M5 and drives the privacy gate.",
   tells:"It tells us the risk the data carries and the legal basis for handling it, so the dataset can be used lawfully and in proportion to its sensitivity — neither over-locked nor exposed by accident."},
 "06":{what:"A register of every file attached to the pack, each with a short reference code. It ties the claims made in the 02 schedule to real artefacts.",
   why:"The index makes the pack auditable. Every answer in 02 that rests on a document points to a reference here. It lets an assessor check a claim rather than take it on trust.",
   tells:"It tells us what proof exists for each claim and where to find it, so readiness rests on evidence we can inspect, not on statements we have to believe."},
 "07":{what:"The data's flow: where it comes from and where it goes. One row per dataset/node, listing upstream sources, downstream consumers and the transformation between.",
   why:"Lineage shows the data's supply chain. It lets an assessor trace an error to its source, judge the impact of a change before it is made, and see who depends on the data. It is the evidence behind M10 at the flow level.",
   tells:"It tells us the path the data travels, so problems can be traced to source, dependencies are visible, and a change in one place can be understood before it breaks another."},
 "08":{what:"The record of origin: who or what produced the data, from what inputs, by which activity, and when. Where lineage shows the path, provenance shows the source and the responsibility.",
   why:"Provenance establishes whether the data is authoritative and who is accountable. It is the difference between the original record and a copy. It supports D5 (authoritativeness) and M10.",
   tells:"It tells us the data's origin and the authority behind it, so we know whether to treat it as a trustworthy source or a derived extract that must point back to one."},
 "09":{what:"The agreed meaning of the business terms the dataset uses. One row per term, with its definition, synonyms, related terms, domain, steward and status.",
   why:"The glossary gives shared meaning. The same word can mean different things to different institutions; a dataset cannot be combined with another safely until the terms line up. It supports M1 (business metadata).",
   tells:"It tells us the institution's own agreed definitions, so data from different sources can be understood and joined without silent misinterpretation."},
 "10":{what:"The governed code lists behind coded fields — each list governs one field (e.g. Town, TaxpayerType, PrimaryTaxType, Status). Same structure, with a Valid-to date for retired codes. 03 Schema points each coded field at its list.",
   why:"Code lists keep coded data interpretable and joinable. A field that stores C or VAT is meaningless without the list that defines its allowed values. It supports M8 and the code-list reference in 03.",
   tells:"The lists tell us the permitted values and their meanings, which values are retired, and where the list is governed, so coded fields can be validated, understood and joined rather than guessed at."},
 "11":{what:"The shared, high-value entities the dataset points to — such as Party (person/organisation) and Location. A summary row per domain plus a fuller profile covering identity, ownership and how duplicates are resolved.",
   why:"Master data is the set of core entities many datasets refer to. If every dataset keeps its own version of a person or place, the same entity multiplies and data cannot be joined reliably. It names the authoritative entity, its key and the survivorship rule.",
   tells:"It tells us the core entities, their keys and their system of record, so records about the same person or place can be connected across government instead of multiplying into mismatched copies."},
 "12":{what:"The governed vocabulary that places the dataset in the national information model: 14 business domains and 95 subject areas from the Zambia Government Operating Model. Reference only — it drives the Business domain and Subject area dropdowns in Part D.",
   why:"Subject areas give every dataset a common place in the national picture. One governed vocabulary, rather than each institution inventing labels, is what lets datasets be grouped, compared and found.",
   tells:"It tells us where the dataset belongs in government's information landscape, so related data across MDAs can be seen together and the national data picture holds together."}
};

 try{localStorage.setItem(LS_KEY,JSON.stringify(pack));}catch(e){}
 document.getElementById('updatedStamp').textContent=new Date(pack.meta.updatedISO).toLocaleString();
}
function set(path,val){ // path like "transmittal.mdaName"
 const parts=path.split('.');let o=pack;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts[parts.length-1]]=val;persist();
}

function cur(){return active.dsIndex>=0?pack.datasets[active.dsIndex]:null;}

function renderSide(){
 const nav=document.getElementById('sidenav');let h="";
 TABS.forEach(t=>{
   if(t.grp){h+=`<div class="group">${t.grp}</div>`;return;}
   const on=active.tab===t.id?"active":"";
   let dot="";
   if(PER_DATASET.has(t.id)&&cur()){const st=tabStatus(t.id,cur());dot=`<span class="dot ${st}"></span>`;}
   h+=`<div class="navitem ${on}" onclick="go('${t.id}')">
        <span class="code">${t.code}</span><span class="lbl">${t.lbl}</span>${dot}</div>`;
 });
 nav.innerHTML=h;
}
function tabStatus(tab,ds){
 // returns '', 'part', 'done' for the little dot
 let filled=0,total=0;
 const count=(v)=>{total++;if(v&&String(v).trim())filled++;};
 if(tab==="02"){[...PART_A,...PART_B].forEach(x=>count(ds['part'+(x.c[0]==='D'?'A':'B')][x.c].response));}
 else if(tab==="03")return ds.schema.length?'done':'';
 else if(tab==="05")count(ds.classification.level);
 else if(["06","07","08","09","11"].includes(tab)){const map={"06":"evidence","07":"lineage","08":"provenance","09":"glossary","11":"master"};return ds[map[tab]].length?'done':'';}
 if(total===0)return '';
 if(filled===0)return '';
 return filled>=total?'done':'part';
}

function renderMain(){

   case"05":h+=page05();break;

   case"07":h+=pageTable("lineage","07","Lineage","Where the data flows from and to. One row per dataset/node.");break;

function dsBar(active_needed){
 const opts=pack.datasets.map((d,i)=>`<option value="${i}" ${i===active.dsIndex?'selected':''}>${esc(d.title||('Dataset '+(i+1)))}</option>`).join('');

 return `<div class="dsbar">

function switchDs(i){active.dsIndex=+i;renderSide();renderMain();}

function removeDataset(){

}

/* ---- readiness ---- */
function readinessWidget(ds){
 const r=readiness(ds);
 const cls=r.status==='Ready'?'ok':(r.status==='Partly ready'?'part':'no');
 return `<div class="ready" style="margin-left:auto">
   <span>Readiness:</span><span class="pill ${cls}">${r.status}</span>
   <span class="mini">${r.mandProvided}/${r.mandTotal} mandatory provided</span></div>`;
}
function readiness(ds){
 const all=[...PART_A,...PART_B,...PART_C];
 let mandTotal=0,mandProvided=0;
 all.forEach(x=>{
   const part=x.c[0]==='D'?'partA':(x.c[0]==='M'?'partB':'partC');
   const cell=ds[part][x.c];const v=(cell.provided||'');
   mandTotal++;
   if(v==='Provided'||v==='Provided (restricted)'||v.startsWith('Not applicable'))mandProvided++;
 });
 // blocking: D4,D5,M5,D12 provided + a reachable stakeholder (nomination contact or D4)
 const block=['D4','D5','M5','D12'];
 const missing=[];
 block.forEach(c=>{
   const part=c[0]==='D'?'partA':'partB';const v=ds[part][c].provided||'';
   if(!(v==='Provided'||v==='Provided (restricted)'))missing.push(c+' '+({D4:'Ownership & contacts',D5:'Source & authoritativeness',M5:'Sensitivity classification',D12:'Representative sample'}[c]));
 });
 const nom=pack.nominations.find(n=>n.title===ds.title);
 const stakeholder=(ds.partA.D4.response&&ds.partA.D4.response.trim())||(nom&&nom.contact);
 if(!stakeholder)missing.push('A reachable stakeholder (D4 / nomination contact)');
 let status='Ready';
 if(missing.length)status='Not ready';
 else if(mandProvided<mandTotal)status='Partly ready';
 return {status,mandProvided,mandTotal,missing};
}

/* ---- generic guide box ---- */
function guideBox(tab){
 const g=TAB_GUIDE[tab];if(!g)return'';
 return `<div class="infobox"><h4>What this tab is</h4><p>${g.what}</p>
   <details><summary>Why it matters &amp; what it tells us about the data</summary>
   <div class="why"><b>Why it matters.</b> ${g.why}</div>
   <div class="why"><b>What it tells us.</b> ${g.tells}</div></details></div>`;
}

/* ---- generic table page + table html ---- */
function pageTable(key,tab,title,lead){
 const ds=cur();const data=ds[key];
 let h=`<div class="page-h"><h2><span class="tag">${tab}</span> ${title} — ${esc(ds.title)}</h2></div>`;
 h+=guideBox(tab);
 h+=`<p class="lead">${lead}</p>`;
 h+=tableHtml(key,data,"cur()."+key);
 h+=`<button class="btn addrow" style="color:#13395e" onclick="addRow('${key}','cur')">+ Add row</button>`;
 // example toggle
 const exMap={schema:'03',evidence:'06',lineage:'07',provenance:'08',glossary:'09'};
 h+=`<div class="card" style="margin-top:14px"><button class="ex-btn" onclick="loadExampleTable('${key}')">▸ Fill this tab with the TPIN example rows</button>
   <span class="mini" style="margin-left:10px">Adds the worked-example rows so you can see the expected level of detail (then edit or delete them).</span></div>`;
 return h;
}
function tableHtml(key,data,pathExpr){
 const cols=COLS[key];
 let h=`<div class="refwrap card" style="padding:0"><table class="grid"><thead><tr><th class="rowtools"></th>`;
 cols.forEach(c=>h+=`<th>${c.h}<span class="th-help">${c.help}</span></th>`);
 h+=`</tr></thead><tbody>`;
 if(!data.length)h+=`<tr><td class="rowtools"></td><td colspan="${cols.length}" style="padding:12px;color:#5b6b7b;font-size:12.5px">No rows yet. Use "+ Add row".</td></tr>`;
 data.forEach((row,ri)=>{
   h+=`<tr><td class="rowtools"><button class="delrow" title="Delete row" onclick="delRow('${key}','${pathExpr}',${ri})">×</button></td>`;
   cols.forEach(c=>{
     const v=row[c.k]||'';
     let inp;
     if(c.sel)inp=`<select onchange="rowSet('${pathExpr}',${ri},'${c.k}',this.value)">${c.sel.map(o=>`<option ${v===o?'selected':''}>${o||'—'}</option>`).join('')}</select>`;
     else if(c.wide)inp=`<textarea style="min-height:40px" oninput="rowSet('${pathExpr}',${ri},'${c.k}',this.value)">${esc(v)}</textarea>`;
     else inp=`<input type="text" value="${esc(v)}" oninput="rowSet('${pathExpr}',${ri},'${c.k}',this.value)">`;
     h+=`<td ${c.wide?'style="min-width:220px"':''}>${inp}</td>`;
   });
   h+=`</tr>`;
 });
 h+=`</tbody></table></div>`;
 return h;
}

/* ---------------------------------------------------------------------------
   5. Mutators used by inline handlers
   ------------------------------------------------------------------------- */
function setDs(path,val){const ds=cur();const parts=path.split('.');let o=ds;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts[parts.length-1]]=val;persist();if(path==='title')renderSide();}
function setCell(part,code,field,val){cur()[part][code][field]=val;persist();if(field==='provided'){renderSide();}}
function setClass(k,val){cur().classification[k]=val;persist();}
function rowSet(pathExpr,ri,k,val){const arr=evalPath(pathExpr);arr[ri][k]=val;persist();}
function evalPath(expr){ // "cur().schema" or "pack.refLists[0].rows" or "pack.nominations"
 if(expr.startsWith('cur()'))return cur()[expr.split('.')[1]];
 return eval(expr); // trusted internal expressions only
}
function addRow(key,mode){
 const arr=mode==='cur'?cur()[key]:pack[key];
 const row={_id:uid()};COLS[key].forEach(c=>row[c.k]="");
 arr.push(row);persist();renderMain();
}
function delRow(key,pathExpr,ri){const arr=evalPath(pathExpr);arr.splice(ri,1);persist();renderMain();}
function toggleEx(id){const e=document.getElementById(id);if(e)e.classList.toggle('show');}
function loadExampleTable(key){
 const ex=exampleDataset()[key];
 cur()[key]=cur()[key].concat(ex.map(x=>Object.assign({},x,{_id:uid()})));
 persist();renderMain();toast("Example rows added");
}

/* ---------------------------------------------------------------------------
   6. Example pack / project load-save
   ------------------------------------------------------------------------- */
function loadExamplePack(){
 if(pack.datasets.length && !confirm("Load the worked TPIN example? It will be added as a new dataset and reference lists."))return;
 pack.transmittal={mdaName:"Ministry of Finance & National Planning / Zambia Revenue Authority",
   rep:"J. Mwale, Business Data Steward",
   contacts:"J. Mwale, Business Data Steward, j.mwale@zra.org.zm, +260 ...",
   submissionDate:"2026-10-24",
   restrictions:"The representative extract is masked. No raw personal or financial values are shared.",
   declaration:pack.transmittal.declaration,
   signature:"J. Mwale",dateSigned:"2026-10-24"};
 const ds=exampleDataset();
 pack.datasets.push(ds);
 pack.nominations.push(r({title:"Taxpayer Register (TPIN)",identifier:"ZRA-TPIN-001",mandate:"Core to the revenue mandate",priority:"High",rationale:"Representative large administrative transactional dataset; underpins VAT/PAYE/CIT",contact:"J. Mwale, Business Data Steward, j.mwale@zra.org.zm"}));
 if(!pack.refLists.length)pack.refLists=exampleRefLists();

function saveProject(){
 const name=(pack.transmittal.mdaName||'MDA').replace(/[^\w]+/g,'_').slice(0,40);
 download(JSON.stringify(pack,null,2),`MDA_Metadata_Pack_${name}_v${APP_VERSION}_${todayStamp()}.json`,'application/json');
 toast("Project saved");
}
function pickFile(){document.getElementById('fileInput').click();}
function onFilePicked(e){
 const f=e.target.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=()=>{try{const p=JSON.parse(rd.result);
   if(!p.datasets||!p.meta){alert("That doesn't look like an MDA pack file.");return;}
   pack=p;active.dsIndex=pack.datasets.length?0:-1;active.tab='instructions';
   persist();renderSide();renderMain();toast("Project opened");
 }catch(err){alert("Could not read that file: "+err.message);}};
 rd.readAsText(f);e.target.value='';
}

/* ---------------------------------------------------------------------------
   7. Export — readiness JSON
   ------------------------------------------------------------------------- */
function exportReadinessJSON(){
 const out={
   schema:"mda-readiness-pack/1.0.0",
   generatedBy:"MDA Metadata Capture v"+APP_VERSION,
   generatedISO:new Date().toISOString(),
   project:{code:"ZM-SZ-466193-CS-QBS",name:"Digital Zambia Acceleration Project"},
   transmittal:pack.transmittal,
   nominations:strip(pack.nominations),
   referenceData:pack.refLists.map(rl=>({name:rl.name,governsField:rl.field,codes:strip(rl.rows)})),
   subjectAreasVocabulary:SUBJECT_AREAS,
   datasets:pack.datasets.map(ds=>{
     const rd=readiness(ds);
     return {
       id:ds.id,title:ds.title,identifier:ds.identifier,
       readiness:{status:rd.status,mandatoryProvided:rd.mandProvided,mandatoryTotal:rd.mandTotal,blockingMissing:rd.missing},
       partA:mapReq(ds.partA,PART_A),
       partB:mapReq(ds.partB,PART_B),
       partC:mapReq(ds.partC,PART_C),
       catalogPlacement:ds.partD,
       schema:strip(ds.schema),
       classification:stripOne(ds.classification),
       evidenceIndex:strip(ds.evidence),
       lineage:strip(ds.lineage),
       provenance:strip(ds.provenance),
       glossary:strip(ds.glossary),
       masterDataDomains:strip(ds.master)
     };
   })
 };
 download(JSON.stringify(out,null,2),`MDA_Readiness_${(pack.transmittal.mdaName||'MDA').replace(/[^\w]+/g,'_').slice(0,30)}_${todayStamp()}.json`,'application/json');
 toast("Readiness JSON exported");
}
function mapReq(obj,defs){const o={};defs.forEach(x=>{const c=obj[x.c];o[x.c]={requirement:x.n,obligation:x.ob,response:c.response,provided:c.provided,evidenceRef:c.evidenceRef};});return o;}
function strip(arr){return arr.map(stripOne);}
function stripOne(o){const c=Object.assign({},o);delete c._id;return c;}

/* ---------------------------------------------------------------------------
   8. Export — XLSX (self-contained writer: zip STORE + OOXML inline strings)
   ------------------------------------------------------------------------- */
function exportXLSX(){
 const sheets=buildWorkbook();
 const blob=writeXlsx(sheets);
 const name=`MDA_Metadata_Pack_${(pack.transmittal.mdaName||'MDA').replace(/[^\w]+/g,'_').slice(0,30)}_${todayStamp()}.xlsx`;
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
 toast("Excel pack exported");
}
// Build [{name, rows:[[...],[...]]}] mirroring the pack workbook
function buildWorkbook(){
 const S=[];
 S.push({name:"Instructions",rows:[
   ["MDA Dataset & Metadata Pack — generated"],
   ["Digital Zambia Acceleration Project · ZM-SZ-466193-CS-QBS"],
   ["Generated by","MDA Metadata Capture v"+APP_VERSION,"",new Date().toISOString()],
   [],
   ["This workbook was produced from the MDA Metadata Capture app. One 02 schedule per dataset; shared reference tabs follow."]
 ]});
 const t=pack.transmittal;
 S.push({name:"00 Transmittal",rows:[
   ["00, Transmittal & Completeness Declaration"],
   ["MDA (institution) name",t.mdaName],
   ["Nominated representative (name & title)",t.rep],
   ["Authorised contact(s)",t.contacts],
   ["Submission date",t.submissionDate],
   ["Number of datasets nominated",pack.datasets.length],
   ["Restrictions summary",t.restrictions],
   ["Completeness declaration",t.declaration],
   ["Signature / name",t.signature],
   ["Date signed",t.dateSigned]
 ]});
 S.push(tableSheet("01 Nominations",["No.","Official title","Identifier","Mandate relevance","Priority","Nomination rationale","Proposed contact"],
   pack.nominations.map((n,i)=>[i+1,n.title,n.identifier,n.mandate,n.priority,n.rationale,n.contact]),"01, Dataset Nominations (one row per nominated dataset)"));

 // Per dataset: one 02 sheet + supporting sheets, suffixed by index when >1
 pack.datasets.forEach((ds,idx)=>{
   const sfx=pack.datasets.length>1?` (${idx+1})`:"";
   S.push(sheet02(ds,sfx));
   S.push(tableSheet("03 Schema"+sfx,["Field name","Business meaning / definition","Data type","Length","Nullable (Y/N)","Key (PK/FK/BK/none)","Code list / reference","Notes"],
     ds.schema.map(x=>[x.field,x.meaning,x.type,x.length,x.nullable,x.key,x.codelist,x.notes]),"03, Schema & Data Dictionary — "+ds.title));
   S.push(sheet05(ds,sfx));
   S.push(tableSheet("06 Evidence"+sfx,["Evidence ref","File name","Description","Owner","Date / Version","Linked requirement (D/M)","Restriction"],
     ds.evidence.map(x=>[x.ref,x.file,x.desc,x.owner,x.dateVer,x.linkedReq,x.restriction]),"06, Evidence Index — "+ds.title));
   S.push(tableSheet("07 Lineage"+sfx,["Dataset / node","Upstream sources","Downstream consumers","Transformation / activity","Notes"],
     ds.lineage.map(x=>[x.node,x.upstream,x.downstream,x.transformation,x.notes]),"07 Lineage — "+ds.title));
   S.push(tableSheet("08 Provenance"+sfx,["Entity / dataset","Created by (agent/role)","Derived from (sources)","Produced by (activity)","Created date","Notes"],
     ds.provenance.map(x=>[x.entity,x.createdBy,x.derivedFrom,x.producedBy,x.createdDate,x.notes]),"08 Provenance — "+ds.title));
   S.push(tableSheet("09 Glossary"+sfx,["Term","Definition","Synonyms","Related terms","Domain","Steward","Status"],
     ds.glossary.map(x=>[x.term,x.def,x.synonyms,x.related,x.domain,x.steward,x.status]),"09 Business Glossary — "+ds.title));
   S.push(sheet11(ds,sfx));
 });
 // Reference code lists (shared)
 pack.refLists.forEach(rl=>{
   S.push(tableSheet(safeName(rl.name),["Code","Label","Description","Status","Valid from","Valid to","Owner / Steward","External standard / source"],
     rl.rows.map(x=>[x.code,x.label,x.desc,x.status,x.validFrom,x.validTo,x.owner,x.source]),
     (rl.name||"Reference Data")+(rl.field?(" — governs "+rl.field):"")));
 });
 // 12 Subject areas
 const saRows=[];SUBJECT_AREAS.forEach(s=>s.areas.forEach(a=>saRows.push([s.no,s.domain,a,s.scope==='in'?'in-scope':'out-of-scope'])));
 S.push(tableSheet("12 Subject Areas",["Domain no.","Business domain","Subject area","In assessment scope"],saRows,"12 Subject Areas (governed vocabulary)"));
 return S;
}

 const rows=[["02, Dataset Metadata Schedule — "+ds.title],
   ["Dataset title",ds.title,"Identifier",ds.identifier],
   ["MDA",pack.transmittal.mdaName,"Prepared by",pack.transmittal.rep],
   [],
   ["Code","Requirement","Obligation","Your response","Provided?","Evidence ref (06)"],
   ["PART A — ABOUT THE DATASET (D1-D13)"]];
 PART_A.forEach(x=>{const c=ds.partA[x.c];rows.push([x.c,x.n,x.ob,c.response,c.provided,c.evidenceRef]);});
 rows.push(["PART B — ABOUT THE METADATA (M1-M10)"]);
 PART_B.forEach(x=>{const c=ds.partB[x.c];rows.push([x.c,x.n,x.ob,c.response,c.provided,c.evidenceRef]);});
 rows.push(["PART C — COMPLIANCE & INTEROPERABILITY (C1-C5)"]);

}

function sheet11(ds,sfx){
 const rows=[["11 Master Data Domains — "+ds.title],
   ["Domain","Core entity","System of record","Steward","Related reference lists","Related dataset fields"]];
 ds.master.forEach(m=>rows.push([m.domain,m.coreEntity,m.systemOfRecord,m.steward,m.relatedRefLists,m.relatedFields]));

function tableSheet(name,header,bodyRows,title){
 const rows=[];if(title)rows.push([title]);rows.push(header);bodyRows.forEach(r=>rows.push(r));
 return {name:safeName(name),rows};
}
function safeName(n){return (n||"Sheet").replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31);}

/* ---------- minimal XLSX writer (no dependencies) ---------- */
function writeXlsx(sheets){
 const enc=new TextEncoder();
 const files=[];
 const colLetter=(n)=>{let s="";n++;while(n>0){let m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;};
 const xmlesc=(s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
 // worksheets
 const sheetXmls=sheets.map((sh)=>{
   let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
     '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
   sh.rows.forEach((row,ri)=>{
     x+=`<row r="${ri+1}">`;
     row.forEach((cell,ci)=>{
       if(cell===null||cell===undefined||cell==="")return;
       const ref=colLetter(ci)+(ri+1);
       if(typeof cell==='number'&&isFinite(cell)){x+=`<c r="${ref}"><v>${cell}</v></c>`;}
       else{x+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlesc(cell)}</t></is></c>`;}
     });
     x+='</row>';
   });
   x+='</sheetData></worksheet>';
   return x;
 });
 // content types
 let ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
   '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
   '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
   '<Default Extension="xml" ContentType="application/xml"/>'+
   '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>';
 sheets.forEach((s,i)=>ct+=`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`);
 ct+='</Types>';
 // root rels
 const rootRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
   '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
   '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
 // workbook + rels
 let wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
   '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';
 sheets.forEach((s,i)=>wb+=`<sheet name="${xmlesc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`);
 wb+='</sheets></workbook>';
 let wbRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
   '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
 sheets.forEach((s,i)=>wbRels+=`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`);
 wbRels+='</Relationships>';
 files.push(["[Content_Types].xml",ct]);
 files.push(["_rels/.rels",rootRels]);
 files.push(["xl/workbook.xml",wb]);
 files.push(["xl/_rels/workbook.xml.rels",wbRels]);
 sheetXmls.forEach((x,i)=>files.push([`xl/worksheets/sheet${i+1}.xml`,x]));
 // zip (STORE)
 return zipStore(files.map(([n,c])=>[n,enc.encode(c)]));
}
// CRC32
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(buf){let c=0xFFFFFFFF;for(let i=0;i<buf.length;i++)c=CRC_TABLE[(c^buf[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
 const enc=new TextEncoder();
 let local=[],central=[],offset=0;
 const u16=n=>[n&255,(n>>8)&255];const u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
 files.forEach(([name,data])=>{
   const nameB=enc.encode(name);const crc=crc32(data);const sz=data.length;
   const lh=[].concat([0x50,0x4b,0x03,0x04],u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(sz),u32(sz),u16(nameB.length),u16(0));
   local.push(new Uint8Array(lh),nameB,data);
   const cd=[].concat([0x50,0x4b,0x01,0x02],u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(sz),u32(sz),u16(nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
   central.push(new Uint8Array(cd),nameB);
   offset+=lh.length+nameB.length+sz;
 });
 const centralSize=central.reduce((a,b)=>a+b.length,0);
 const localSize=offset;
 const eocd=new Uint8Array([].concat([0x50,0x4b,0x05,0x06],u16(0),u16(0),u16(files.length),u16(files.length),u32(centralSize),u32(localSize),u16(0)));
 const parts=[...local,...central,eocd];
 let total=parts.reduce((a,b)=>a+b.length,0);
 const out=new Uint8Array(total);let p=0;parts.forEach(b=>{out.set(b,p);p+=b.length;});
 return new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

/* ---------------------------------------------------------------------------
   9. helpers
   ------------------------------------------------------------------------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function download(text,name,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}
function todayStamp(){const d=new Date();return d.toISOString().slice(0,10);}
let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1800);}

/* ---------------------------------------------------------------------------
   10. boot
   ------------------------------------------------------------------------- */
document.getElementById('updatedStamp').textContent=pack.meta.updatedISO?new Date(pack.meta.updatedISO).toLocaleString():'—';
if(pack.datasets.length)active.dsIndex=0;
renderSide();renderMain();
</script>
