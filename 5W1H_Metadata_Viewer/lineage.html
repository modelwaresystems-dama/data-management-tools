const $=(s,r=document)=>r.querySelector(s);

$("#kind").textContent="data lineage · "+(D.sourceKind||"generic");

const VER=((document.querySelector('meta[name="version"]')||{}).content)||"";

const C=D.counts||{};
[["nodes","Nodes"],["edges","Flows"],["sources","Sources"],["sinks","Sinks"],["activities","Activities"],["agents","Agents"]]
 .filter(([k])=>(C[k]||0)>0||k==="nodes").forEach(([k,l])=>$("#tiles").append(el("div",{class:"t"},el("div",{class:"n"},String(C[k]||0)),el("div",{class:"l"},l))));

// adjacency
const outAdj={}, inAdj={}; NODES.forEach(n=>{outAdj[n.id]=[];inAdj[n.id]=[];});

// ---------- Graph
addPanel("graph","Lineage graph",p=>{
  if((D.warnings||[]).length) p.append(el("div",{class:"banner"},D.warnings.join("  ")));
  if(!NODES.length){p.append(el("div",{class:"empty"},"No lineage nodes."));return;}
  p.append(el("div",{class:"legend"},
    el("span",{},el("span",{class:"sw",style:"background:var(--ds-soft);border-color:var(--ds)"}),"dataset / entity"),
    el("span",{},el("span",{class:"sw",style:"background:var(--act-soft);border-color:var(--act)"}),"activity"),
    el("span",{},el("span",{class:"sw",style:"background:var(--agent-soft);border-color:var(--agent)"}),"agent"),
    el("span",{class:"muted"},"click a node to trace its upstream and downstream")));
  const search=el("input",{type:"search",placeholder:"find a node…"});
  const zin=el("button",{},"+"),zout=el("button",{},"−"),zfit=el("button",{},"fit"),fscr=el("button",{},"⤢ full screen");
  const chip=el("span",{class:"chip",hidden:"",}); const info=el("div",{class:"sp"});
  p.append(el("div",{class:"toolbar"},search,zout,zin,zfit,fscr,chip,info));
  const box=el("div",{class:"scroll graphbox"});
  const svg=sv("svg",{}); const defs=sv("defs",{});
  const mk=sv("marker",{id:"arr",viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
  mk.append(sv("path",{d:"M0,0 L10,5 L0,10 z",fill:"var(--fg-faint)"})); defs.append(mk);
  const mkh=sv("marker",{id:"arrh",viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
  mkh.append(sv("path",{d:"M0,0 L10,5 L0,10 z",fill:"var(--accent)"})); defs.append(mkh);
  svg.append(defs);
  const g=sv("g",{}); svg.append(g); box.append(svg); p.append(box);

  // layout: columns by layer; order within each layer by barycenter to reduce crossings
  const COLW=244, ROWH=66, BW=178, BH=42, MX=28, GUT=COLW-BW;
  const layers={}; let maxLayer=0;
  NODES.forEach(n=>{const L=n.layer||0; (layers[L]=layers[L]||[]).push(n); if(L>maxLayer)maxLayer=L;});
  const layerKeys=Object.keys(layers).map(Number).sort((a,b)=>a-b);
  const order={}; layerKeys.forEach(L=>order[L]=layers[L].slice());
  const lyr=id=>(byId[id]||{}).layer||0;
  // edges that skip a column (>=2) ride an over-the-top lane; back/same-layer ride a bottom lane
  const skipEdges=EDGES.filter(e=>lyr(e.to)-lyr(e.from)>=2);

      order[L].forEach((node,i)=>{pos[node.id]={x:MX+L*COLW, y:MY+(i+off)*ROWH};});});
  }
  layoutY();
  function bary(node,useIn){const nb=useIn?inAdj[node.id]:outAdj[node.id];
    if(!nb||!nb.length)return pos[node.id].y;let s=0,c=0;nb.forEach(m=>{if(pos[m]){s+=pos[m].y;c++;}});return c?s/c:pos[node.id].y;}
  for(let pass=0;pass<4;pass++){const dir=pass%2===0;const ks=dir?layerKeys:layerKeys.slice().reverse();
    ks.forEach(L=>{order[L].sort((a,b)=>bary(a,dir)-bary(b,dir));layoutY();});}
  const W=MX*2+maxLayer*COLW+BW, H=MY+Math.max(1,maxRows)*ROWH+28+BOT;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("width",W); svg.setAttribute("height",H);

  // orthogonal routing: edges travel only in node-free gutters and top/bottom lanes
  const dist=(x0,y0,x1,y1)=>Math.hypot(x1-x0,y1-y0);
  const toward=(x,y,tx,ty,r)=>{const d=dist(x,y,tx,ty)||1;return [x+(tx-x)/d*r, y+(ty-y)/d*r];};

    const lbl=sv("text",{x:10,y:18}); lbl.textContent=(n.label||n.id).slice(0,27)+((n.label||n.id).length>27?"…":""); grp.append(lbl);
    const sub=sv("text",{class:"badge",x:10,y:32}); sub.textContent=(n.kind||"")+(n.type?(" · "+n.type).slice(0,20):""); grp.append(sub);
    const tt=sv("title",{}); tt.textContent=(n.label||n.id)+(n.description?("\n"+n.description):""); grp.append(tt);
    grp.addEventListener("click",ev=>{ev.stopPropagation();focus(n.id);});

  function clear(){Object.values(nodeEls).forEach(x=>x.classList.remove("dim"));edgeEls.forEach(x=>{x.classList.remove("dim","hot");x.setAttribute("marker-end","url(#arr)");if(x._lab){x._lab.style.opacity="";x._lab.classList.remove("hot");}});chip.hidden=true;info.textContent=`${NODES.length} nodes · ${EDGES.length} flows`;}
  function focus(id){const up=reach(id,inAdj),dn=reach(id,outAdj);const keep=new Set([id,...up,...dn]);

  // zoom — the viewBox does the scaling (no g transform, so no double-scale/clipping)
  let scale=1; function applyZoom(){svg.setAttribute("width",(W*scale).toFixed(0));svg.setAttribute("height",(H*scale).toFixed(0));}
  zin.onclick=()=>{scale=Math.min(3,scale*1.2);applyZoom();}; zout.onclick=()=>{scale=Math.max(.2,scale/1.2);applyZoom();};
  function fit(){const bw=Math.max(80,box.clientWidth-26),bh=Math.max(80,box.clientHeight-26);scale=Math.max(.2,Math.min(2,bw/W,bh/H));applyZoom();box.scrollLeft=0;box.scrollTop=0;}
  zfit.onclick=fit;

  const body=el("tbody",{});
  NODES.slice().sort((a,b)=>(a.layer-b.layer)||a.label.localeCompare(b.label)).forEach(n=>{
