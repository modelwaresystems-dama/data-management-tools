      h("div", { text: cov.openDeals === 0
        ? "No open deals yet. Add your first one, or import a CSV in Settings."
        : cov.openDeals + " open deal" + (cov.openDeals===1?"":"s") + ", all with a next step." }),
      h("div", { class:"note", text:"Coverage, not congratulation — this line tells you the pipeline is scheduled, not that the work is done." })
    ));
    return;
  }

  App.rows = [];
  var od = b.overdue.map(function (f){ var r = followupRow(f, "overdue"); App.rows.push(r); return r; });
  var dt = b.dueToday.map(function (f){ var r = followupRow(f, "today");   App.rows.push(r); return r; });
  var nn = b.noNextStep.map(function (d){ var r = noNextStepRow(d);        App.rows.push(r); return r; });

  el.appendChild(band("band-overdue", "Overdue", b.overdue.length, od,
    b.overdue.length ? null : "Nothing late."));
  el.appendChild(band("band-today", "Due today", b.dueToday.length, dt,
    b.dueToday.length ? null : "Nothing scheduled for today."));
  el.appendChild(band("band-none", "No next step", b.noNextStep.length, nn,
    b.noNextStep.length ? null : "Every open deal has a next step."));

  if (b.noNextStep.length)
    el.appendChild(h("div", { class:"note",
      text:"An open deal with no next step is a defect, not a gap in your day. " +
           "It is drawn as an absence because that is what it is." }));
}

/* ---------------- row actions ---------------- */

function completeFollowup(f, rowEl){
  emit("followup.completed", { followupId:f.id, completedAt:App.today });
  var afterwards = function (){
    var stillOpen = f.subjectType === "deal" ? C.openFollowupsFor(App.st, f.subjectId) : [];
    var deal = f.subjectType === "deal" ? App.st.deals[f.subjectId] : null;
    if (deal && deal.status === "open" && stillOpen.length === 0){
      var anchor = $("#content") || document.body;
      nextStepPopover(anchor, deal, null, { reason:"Done — what's next on " + deal.name + "?" });
    } else render();
  };
  if (rowEl && !window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    rowEl.classList.add("done");
    var head = rowEl.closest(".band") && rowEl.closest(".band").querySelector(".band-head .n");
    if (head){
      var n = parseInt(String(head.textContent).replace(/\D/g,""), 10);
      if (!isNaN(n)) head.textContent = "· " + Math.max(0, n - 1);
    }
    setTimeout(afterwards, 280);
  } else afterwards();
  toast("Done — " + f.what, null, { label:"Undo", fn:function (){
    emit("followup.updated", { followupId:f.id });         // no-op guard
    App.events = App.events.filter(function (e){
      return !(e.type === "followup.completed" && e.payload && e.payload.followupId === f.id);
    });
    if (App.workspace === "team")
      App.pending = App.pending.filter(function (e){
        return !(e.type === "followup.completed" && e.payload && e.payload.followupId === f.id);
      });
    persist(); refold(); render();
  }});
}

function deferPopover(anchor, f){
  var box = h("div");
  box.appendChild(h("h4", { text:"Defer — " + f.what }));
  var quick = h("div", { class:"quick" });
  [[1,"Tomorrow","1"],[3,"+3 days","3"],[7,"+7 days","7"],[14,"+14 days","14"]].forEach(function (q){
    var to = C.deferBy(App.today, q[0]);
    quick.appendChild(h("button", { class:"btn btn-sm", type:"button",
      title:q[1] + " → " + C.fmtFull(to) + (C.isWeekend(C.addDays(App.today, q[0])) ? " (weekend skipped)" : ""),
      onclick:function (){ doDefer(f, to); } },
      h("span", { text:q[1] }), " ", h("span", { class:"kbd", text:q[2] })));
  });
  box.appendChild(quick);
  var inp = h("input", { type:"text", placeholder:"or type: fri · +21 · 3 sep · 2026-09-03",
                         "aria-label":"Defer to a typed date" });
  var preview = h("div", { class:"note", text:"Typed dates land exactly as typed — weekends are not skipped." });
  inp.addEventListener("input", function (){
    var d = C.parseDateInput(inp.value, App.today);
    preview.textContent = inp.value.trim()
      ? (d ? "→ " + C.fmtFull(d) : "Not a date I recognise.")
      : "Typed dates land exactly as typed — weekends are not skipped.";
  });
  inp.addEventListener("keydown", function (e){
    if (e.key === "Enter"){
      var d = C.parseDateInput(inp.value, App.today);
      if (d) doDefer(f, d); else toast("Not a date I recognise — try 'fri', '+21' or '3 sep'.", "err");
    }
  });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Pick a date" }), inp));
  box.appendChild(preview);
  if (f.pushCount > 0)
    box.appendChild(h("div", { class:"note",
      text:"Already pushed " + f.pushCount + "× · originally due " + C.fmtDayYear(f.originalDue) +
           ". Deferring is never blocked, only counted." }));
  openPopover(anchor, box);
}

function doDefer(f, to){
  if (!to) return;
  emit("followup.rescheduled", { followupId:f.id, from:f.dueDate, to:to });
  closeLayers("pop");
  render();
  var n = (App.st.followups[f.id] || {}).pushCount || 0;
  toast("Moved to " + C.fmtFull(to) + (n > 1 ? " · pushed " + n + "×" : ""));
}

function rowKeys(e, ctx){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key;
  if (ctx.followup){
    if (k === "d"){ e.preventDefault(); completeFollowup(ctx.followup, ctx.row); return; }
    if (k === "1" || k === "3" || k === "7"){ e.preventDefault(); doDefer(ctx.followup, C.deferBy(App.today, +k)); return; }
    if (k === "4"){ e.preventDefault(); doDefer(ctx.followup, C.deferBy(App.today, 14)); return; }
    if (k === "e"){ e.preventDefault(); deferPopover(ctx.row.querySelector(".acts .btn:last-child") || ctx.row, ctx.followup); return; }
  }
  if (k === "Enter" || k === " "){
    e.preventDefault();
    if (ctx.deal) openDeal(ctx.deal.id); else if (ctx.followup) openSubject(ctx.followup);
  }
  if (k === "l" && ctx.deal){ e.preventDefault(); logPopover(ctx.row, ctx.deal); }
}

/* ============================================================
   THE DISCIPLINE LOOP (C5 · C6 · C8)
   The log saves immediately. The prompt follows; it never blocks.
   ============================================================ */

function nextStepPopover(anchor, deal, contextFollowup, opts){
  opts = opts || {};
  var box = h("div");
  box.appendChild(h("h4", { text: opts.reason || ("Next step — " + deal.name) }));

  var what = h("input", { type:"text", value:"", placeholder:"What happens next?",
                          "aria-label":"What happens next" });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"What" }), what));

  var chosen = { date: C.deferBy(App.today, 7) };
  var quick = h("div", { class:"quick" });
  var btns = [];
  [[1,"Tomorrow","1"],[3,"+3","3"],[7,"+7","7"],[14,"+14","4"]].forEach(function (q){
    var to = C.deferBy(App.today, q[0]);
    var b = h("button", { class:"btn btn-sm", type:"button",
      onclick:function (){ chosen.date = to; paint(); } },
      h("span", { text:q[1] }), " ", h("span", { class:"kbd", text:q[2] }));
    b.dataset.date = to;
    btns.push(b); quick.appendChild(b);
  });
  box.appendChild(quick);

  var typed = h("input", { type:"text", placeholder:"or type: fri · 3 sep · 2026-09-03",
                           "aria-label":"Or type a date" });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"When" }), typed));
  var preview = h("div", { class:"note" });
  box.appendChild(preview);

  function paint(){
    btns.forEach(function (b){ b.classList.toggle("primary", b.dataset.date === chosen.date); });
    preview.textContent = "Due " + C.fmtFull(chosen.date);
  }
  typed.addEventListener("input", function (){
    var d = C.parseDateInput(typed.value, App.today);
    if (d){ chosen.date = d; paint(); }
    else if (typed.value.trim()) preview.textContent = "Not a date I recognise.";
  });
  paint();

  function save(){
    var text = what.value.trim() || "Follow up";
    emit("followup.created", { followupId:C.uid("fu"), subjectType:"deal", subjectId:deal.id,
      owner:deal.owner || App.me, dueDate:chosen.date, what:text });
    closeLayers("pop"); render();
    toast("Next step set — " + C.fmtFull(chosen.date));
  }
  function decline(){
    emit("followup.declined", { subjectType:"deal", subjectId:deal.id });
    closeLayers("pop"); render();
    toast(deal.name + " has no next step — it will sit in band three until it does.");
  }

  box.appendChild(h("div", { class:"note",
    text:"Nothing here is required. Choosing “no next step yet” is honest — it puts the deal in band three where you can see it." }));
  box.appendChild(h("div", { class:"pop-foot" },
    h("button", { class:"btn btn-sm quiet", type:"button", onclick:decline }, "No next step yet"),
    h("button", { class:"btn btn-sm primary", type:"button", onclick:save }, "Set")));

  box.addEventListener("keydown", function (e){
    if (e.target === typed) { if (e.key === "Enter"){ e.preventDefault(); save(); } return; }
    if (e.key === "Enter"){ e.preventDefault(); save(); return; }
    if (e.target === what) return;
    if (e.key === "1"){ chosen.date = C.deferBy(App.today,1); paint(); }
    if (e.key === "3"){ chosen.date = C.deferBy(App.today,3); paint(); }
    if (e.key === "7"){ chosen.date = C.deferBy(App.today,7); paint(); }
    if (e.key === "4"){ chosen.date = C.deferBy(App.today,14); paint(); }
  });
  var pop = openPopover(anchor, box);
  what.focus();
  return pop;
}

var KINDS = [["call","Call"],["email","Email"],["meeting","Meeting"],["note","Note"]];

function logPopover(anchor, deal, prefill){
  prefill = prefill || {};
  var box = h("div");
  box.appendChild(h("h4", { text:"Log — " + deal.name }));

  var kind = prefill.kind || "call";
  var kwrap = h("div", { class:"quick" });
  var kbtns = [];
  KINDS.forEach(function (k){
    var b = h("button", { class:"btn btn-sm" + (k[0] === kind ? " primary" : ""), type:"button",
      onclick:function (){ kind = k[0]; kbtns.forEach(function (x){ x.classList.toggle("primary", x.dataset.k === kind); }); } }, k[1]);
    b.dataset.k = k[0]; kbtns.push(b); kwrap.appendChild(b);
  });
  box.appendChild(kwrap);

  var when = h("input", { type:"text", value: prefill.occurredAt || App.today,
                          "aria-label":"When it happened" });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"When" }), when));

  var summary = h("textarea", { rows:"3", placeholder:"What was said, in one line.",
                                "aria-label":"Summary" });
  summary.value = prefill.summary || "";
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Summary" }), summary));

  function save(){
    var d = C.parseDateInput(when.value, App.today) || App.today;
    emit("interaction.logged", { interactionId:C.uid("ix"), subjectType:"deal", subjectId:deal.id,
      kind:kind, occurredAt:d, summary:summary.value.trim() || "(no summary)",
      contactId: prefill.contactId || null });
    closeLayers("pop");
    render();
    toast("Logged.");
    // the prompt FOLLOWS the save — it never blocks it
    var live = App.st.deals[deal.id];
    if (live && live.status === "open")
      setTimeout(function (){
        nextStepPopover($("#content") || document.body, live, null,
                        { reason:"Logged. What's next on " + live.name + "?" });
      }, 30);
  }
  box.appendChild(h("div", { class:"note", text:"Saves immediately. The next-step prompt comes after." }));
  box.appendChild(h("div", { class:"pop-foot" },
    h("button", { class:"btn btn-sm quiet", type:"button", onclick:function (){ closeLayers("pop"); } }, "Cancel"),
    h("button", { class:"btn btn-sm primary", type:"button", onclick:save }, "Save")));
  var pop = openPopover(anchor, box);
  summary.focus();
  return pop;
}

/* ---------------- paste-to-log (C9): parsed in-browser, raw text never committed ---------------- */

function pastePopover(anchor){
  var box = h("div", { style:"width:100%" });
  box.appendChild(h("h4", { text:"Paste an email thread" }));
  var ta = h("textarea", { rows:"7", placeholder:"Paste the email here. Headers are enough.",
                           "aria-label":"Paste email" });
  box.appendChild(ta);
  var out = h("div", { class:"note", text:"Nothing is saved until you confirm." });
  box.appendChild(out);
  var act = h("div", { class:"pop-foot", style:"border-top:0" });
  box.appendChild(act);

  ta.addEventListener("input", function (){
    clear(act);
    var p = C.parseEmailPaste(ta.value);
    if (!p.ok){ out.textContent = "Nothing recognisable yet — paste the From / Date / Subject lines."; return; }
    var m = C.matchContact(App.st, p.from, p.fromName);
    var target = m.deal;
    var lines = [];
    lines.push("From " + (p.fromName ? p.fromName + " <" + p.from + ">" : p.from || "unknown"));
    if (p.occurredAt) lines.push("on " + C.fmtFull(p.occurredAt));
    lines.push(target ? "→ " + target.name : (m.company ? "→ " + m.company.name + " (no open deal)" : "→ no match found"));
    out.textContent = lines.join(" · ");
    if (target){
      act.appendChild(h("button", { class:"btn btn-sm primary", type:"button", onclick:function (){
        var raw = ta.value; ta.value = "";                       // raw is dropped here, deliberately
        closeLayers("pop");
        logPopover($("#content") || document.body, target, {
          kind:"email", occurredAt:p.occurredAt || App.today,
          summary:p.suggestedSummary, contactId:m.contact ? m.contact.id : null });
        raw = null;
      }}, "Use this"));
    }
  });
  box.insertBefore(h("div", { class:"note",
    text:"The pasted text is parsed in your browser and discarded. Only the date, sender, deal link and the one-line summary you approve are ever written." }), act);
  var pop = openPopover(anchor, box, { width:420 });
  ta.focus();
  return pop;
}

/* ---------------- new deal ---------------- */

function newDeal(anchor){
  var box = h("div");
  box.appendChild(h("h4", { text:"New deal" }));

  var coNames = Object.keys(App.st.companies).map(function (k){ return App.st.companies[k]; })
                  .sort(function (a,b){ return a.name < b.name ? -1 : 1; });
  var listId = "co-list-" + C.uid("dl");
  var co = h("input", { type:"text", list:listId, placeholder:"Company",
                        "aria-label":"Company" });
  var dl = h("datalist", { id:listId });
  coNames.forEach(function (c){ dl.appendChild(h("option", { value:c.name })); });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Company" }), co, dl));

  var nm = h("input", { type:"text", placeholder:"What are you selling them?", "aria-label":"Deal name" });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Deal" }), nm));

  var stage = h("select", { "aria-label":"Stage" });
  (App.config.stages||[]).forEach(function (s){ stage.appendChild(h("option", { value:s.id }, s.label)); });

  var owner = h("select", { "aria-label":"Owner" });
  users().forEach(function (u){ owner.appendChild(h("option", { value:u.id }, u.name)); });
  owner.value = App.me;
  box.appendChild(h("div", { class:"row2" },
    h("label", { class:"fld" }, h("span", { text:"Stage" }), stage),
    h("label", { class:"fld" }, h("span", { text:"Owner" }), owner)));

  var val = h("input", { type:"text", placeholder:"0", "aria-label":"Value" });
  var cur = h("select", { "aria-label":"Currency" });
  (App.config.currencies || ["ZAR"]).forEach(function (c){ cur.appendChild(h("option", { value:c }, c)); });
  cur.value = App.config.defaultCurrency || "ZAR";
  box.appendChild(h("div", { class:"row2" },
    h("label", { class:"fld" }, h("span", { text:"Value" }), val),
    h("label", { class:"fld" }, h("span", { text:"Currency" }), cur)));

  var close = h("input", { type:"text", placeholder:"e.g. 30 sep", "aria-label":"Expected close" });
  var first = h("input", { type:"text", placeholder:"First next step", "aria-label":"First next step" });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Expected close" }), close));
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"First next step" }), first));
  var due = h("input", { type:"text", value:C.deferBy(App.today, 7), "aria-label":"First next step due" });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Due" }), due));

  function save(){
    var coName = co.value.trim();
    if (!coName && !nm.value.trim()){ toast("A company or a deal name is the minimum.", "err"); return; }
    var existing = coNames.filter(function (c){ return c.name.toLowerCase() === coName.toLowerCase(); })[0];
    var coId = existing ? existing.id : C.uid("co");
    if (!existing && coName) emit("company.created", { companyId:coId, name:coName });
    var dealId = C.uid("dl");
    var v = val.value.replace(/[^\d.\-]/g, "");
    emit("deal.created", { dealId:dealId, companyId:coName ? coId : null,
      name:nm.value.trim() || coName, owner:owner.value, stage:stage.value,
      value: v === "" ? null : +v, currency:cur.value,
      expectedCloseDate: C.parseDateInput(close.value, App.today) });
    var d = C.parseDateInput(due.value, App.today) || C.deferBy(App.today, 7);
    emit("followup.created", { followupId:C.uid("fu"), subjectType:"deal", subjectId:dealId,
      owner:owner.value, dueDate:d, what: first.value.trim() || "Make first contact" });
    closeLayers("pop"); render();
    toast("Deal created with a next step on " + C.fmtFull(d) + ".");
    openDeal(dealId);
  }
  box.appendChild(h("div", { class:"note",
    text:"A new deal always gets a next step. That is the invariant, not a nag." }));
  box.appendChild(h("div", { class:"pop-foot" },
    h("button", { class:"btn btn-sm quiet", type:"button", onclick:function (){ closeLayers("pop"); } }, "Cancel"),
    h("button", { class:"btn btn-sm primary", type:"button", onclick:save }, "Create")));
  var pop = openPopover(anchor || $("#content") || document.body, box, { width:360 });
  co.focus();
}

        h("div", { style:"margin-top:9px" },
          h("button", { class:"btn btn-sm primary", type:"button",
            onclick:function (e){ nextStepPopover(e.currentTarget, d, null); } }, "Set next step")))));
    if (d.declinedNextStepAt)

        text:"You chose “no next step yet” on " + C.fmtDayYear(d.declinedNextStepAt) + "." }));

          (f.pushCount ? " · pushed " + f.pushCount + "× · originally " + C.fmtDay(f.originalDue) : "") +
          (App.scope === "team" || f.owner !== App.me ? " · " + userName(f.owner) : "") })),

        onclick:function (){ completeFollowup(f, null); render(); openDeal(d.id); } }, "Done"),

      h("div", { class:"what", text:x.summary })));
  });
  body.appendChild(h("section", { class:"sec" },
    h("h4", { text:"History" }),
    h("div", { style:"margin-bottom:9px;display:flex;gap:6px" },
      h("button", { class:"btn btn-sm", type:"button",
        onclick:function (e){ logPopover(e.currentTarget, d); } }, "Log an interaction"),
      h("button", { class:"btn btn-sm", type:"button",
        onclick:function (e){ pastePopover(e.currentTarget); } }, "Paste an email")),
    tl));

  /* contacts */
  var cts = Object.keys(App.st.contacts).map(function (k){ return App.st.contacts[k]; })
              .filter(function (c){ return c.companyId === d.companyId; });
  if (cts.length){
    var list = h("div");
    cts.forEach(function (c){
      list.appendChild(h("div", { style:"padding:6px 0;border-bottom:1px solid var(--line)" },
        h("div", { style:"font-size:13px" }, c.name + (c.role ? " · " + c.role : "")),
        h("div", { class:"t2", style:"font-family:var(--mono);font-size:11.5px;color:var(--muted)" },
          c.email ? h("a", { href:"mailto:" + c.email + "?subject=" + encodeURIComponent(d.name) }, c.email) : "",
          c.phone ? " · " + c.phone : "")));
    });
    body.appendChild(h("section", { class:"sec" }, h("h4", { text:"Contacts" }), list));
  }

  panel.appendChild(body);
  layerEl().appendChild(scrim);
  layerEl().appendChild(panel);
  panel.focus();
  panel.addEventListener("keydown", function (e){
    if (e.key === "Escape"){ closePanel(); }
    if (e.key === "l" && e.target === panel){ e.preventDefault(); logPopover(panel, d); }
  });
}

function closeDeal(d, outcome, reason){
  emit("deal.closed", { dealId:d.id, outcome:outcome, reason:reason || "" });
  C.openFollowupsFor(App.st, d.id).forEach(function (f){
    emit("followup.cancelled", { followupId:f.id, reason:"deal " + outcome });
  });
  closeLayers(); render();
  toast(d.name + " marked " + outcome + ". The next-step invariant is released.");
}
function closeDealPrompt(anchor, d){
  var box = h("div");
  box.appendChild(h("h4", { text:"Mark lost — " + d.name }));
  var r = h("input", { type:"text", placeholder:"Why? (optional)", "aria-label":"Reason" });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Reason" }), r));

    h("button", { class:"btn btn-sm quiet", type:"button", onclick:function (){ closeLayers("pop"); } }, "Cancel"),
    h("button", { class:"btn btn-sm danger", type:"button",

}

function editDeal(anchor, d){
  var box = h("div");

  box.appendChild(h("div", { class:"row2" },
    h("label", { class:"fld" }, h("span", { text:"Value" }), val),
    h("label", { class:"fld" }, h("span", { text:"Currency" }), cur)));
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Expected close" }), close));
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Owner" }), owner));

    h("button", { class:"btn btn-sm quiet", type:"button", onclick:function (){ closeLayers("pop"); } }, "Cancel"),
    h("button", { class:"btn btn-sm primary", type:"button", onclick:function (){
      var v = val.value.replace(/[^\d.\-]/g, "");
      emit("deal.updated", { dealId:d.id, name:nm.value.trim() || d.name,
        value: v === "" ? null : +v, currency:cur.value, owner:owner.value,
        expectedCloseDate: close.value.trim() ? C.parseDateInput(close.value, App.today) : null });
      closeLayers(); render(); openDeal(d.id);
    }}, "Save")));
  openPopover(anchor, box);
}

var ALL_FLAGS = ["Never contacted","No next step","Overdue","Pushed 3+","Silent 30d","Stalled","Close date passed"];

function viewPipeline(el){
  var filterBar = h("div", { style:"display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:16px" },
    h("span", { class:"band-head", style:"margin:0", text:"Filter" }));
  ALL_FLAGS.forEach(function (f){
    var n = 0;
    for (var k in App.flags) if ((App.flags[k]||[]).indexOf(f) >= 0){
      var d = App.st.deals[k];
      if (App.scope === "team" || (d && d.owner === App.me)) n++;
    }
    var b = h("button", { class:"chip filter " + (C.FLAG_TONE[f]||""), type:"button",
      title:C.flagRule(f, App.config),
      onclick:function (){ App.pipeFilter = App.pipeFilter === f ? null : f; render(); } },
      C.flagLabel(f, App.config) + " " + n);
    b.setAttribute("aria-pressed", App.pipeFilter === f ? "true" : "false");
    if (!n) b.disabled = true;
    filterBar.appendChild(b);
  });
  if (App.pipeFilter)
    filterBar.appendChild(h("button", { class:"btn btn-sm quiet", type:"button",
      onclick:function (){ App.pipeFilter = null; render(); } }, "Clear"));
  el.appendChild(filterBar);

  var board = h("div", { class:"board" });
  var deals = C.openDeals(App.st).filter(function (d){
    if (App.scope !== "team" && d.owner !== App.me) return false;
    if (App.pipeFilter && (App.flags[d.id]||[]).indexOf(App.pipeFilter) < 0) return false;
    return true;
  });

  (App.config.stages||[]).forEach(function (s){
    var mine = deals.filter(function (d){ return d.stage === s.id; });
    var totals = {};
    mine.forEach(function (d){ if (d.value) totals[d.currency||"ZAR"] = (totals[d.currency||"ZAR"]||0) + d.value; });
    var col = h("div", { class:"col" },
      h("div", { class:"h" },
        h("span", { text:s.label }),
        h("span", { class:"n", text:String(mine.length) }),
        h("span", { class:"spacer" }),
        h("span", { class:"mono", style:"font-size:10px;text-transform:none;letter-spacing:0",
          text: Object.keys(totals).map(function (c){ return C.fmtMoney(totals[c], c); }).join(" · ") })));
    var drop = h("div", { class:"drop", data:{ stage:s.id } });
    drop.addEventListener("dragover", function (e){ e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", function (){ drop.classList.remove("over"); });
    drop.addEventListener("drop", function (e){
      e.preventDefault(); drop.classList.remove("over");
      var id = e.dataTransfer.getData("text/plain");
      var d = App.st.deals[id];
      if (d && d.stage !== s.id){
        emit("deal.stage_changed", { dealId:id, from:d.stage, to:s.id });
        render();
        toast(d.name + " → " + s.label);
      }
    });
    mine.sort(function (a,b){ return (b.value||0) - (a.value||0); }).forEach(function (d){
      drop.appendChild(dealCard(d));
    });
    if (!mine.length) drop.appendChild(h("div", { class:"note", style:"padding:8px", text:"—" }));
    col.appendChild(drop);
    board.appendChild(col);
  });
  el.appendChild(board);

  var closed = Object.keys(App.st.deals).map(function (k){ return App.st.deals[k]; })
    .filter(function (d){ return d.status !== "open" && (App.scope === "team" || d.owner === App.me); })
    .sort(function (a,b){ return a.closedAt < b.closedAt ? 1 : -1; }).slice(0, 12);
  if (closed.length){
    var t = h("table", { class:"tbl" }, h("thead", null, h("tr", null,
      h("th", { text:"Company" }), h("th", { text:"Deal" }), h("th", { text:"Outcome" }),
      h("th", { text:"Closed" }), h("th", { class:"num", text:"Value" }))));
    var tb = h("tbody");
    closed.forEach(function (d){
      var co = App.st.companies[d.companyId];
      tb.appendChild(h("tr", { onclick:function (){ openDeal(d.id); } },
        h("td", { text:co ? co.name : "" }), h("td", { text:d.name }),
        h("td", { text:d.outcome === "won" ? "Won" : "Lost" + (d.lossReason ? " · " + d.lossReason : "") }),
        h("td", { class:"num", text:C.fmtDayYear(d.closedAt) }),
        h("td", { class:"num", text:d.value == null ? "—" : C.fmtMoney(d.value, d.currency) })));
    });
    t.appendChild(tb);
    el.appendChild(h("section", { style:"margin-top:26px" },
      h("div", { class:"band-head" }, h("span", { text:"Recently closed" })), t));
  }
}

function dealCard(d){
  var co = App.st.companies[d.companyId];
  var ofs = C.openFollowupsFor(App.st, d.id);
  var nx = ofs[0];
  var late = nx ? C.daysBetween(App.today, nx.dueDate) : null;
  var card = h("div", { class:"card", draggable:"true", tabindex:"0", data:{ deal:d.id },
                        onclick:function (){ openDeal(d.id); } },
    h("div", { class:"co", text:co ? co.name : "—" }),
    h("div", { class:"nm", text:d.name }),
    h("div", { class:"val", text: d.value == null ? "—" : C.fmtMoney(d.value, d.currency) +
      (d.expectedCloseDate ? "  ·  " + C.fmtDay(d.expectedCloseDate) : "") }),
    nx
      ? h("div", { class:"next" + (late < 0 ? " od" : ""),
          title:nx.what + " — due " + C.fmtFull(nx.dueDate),
          text: (late < 0 ? "▸ " + (-late) + "d late · " : late === 0 ? "▸ today · " : "▸ " + C.fmtDay(nx.dueDate) + " · ") + nx.what })
      : h("div", { class:"next none", text:"▸ no next step" }),
    h("div", { class:"foot" }, chipsFor(d.id, 3),
      h("span", { class:"spacer" }),
      h("span", { class:"chip owner", text:initials(d.owner), title:userName(d.owner) })));
  card.addEventListener("dragstart", function (e){
    e.dataTransfer.setData("text/plain", d.id);
    e.dataTransfer.effectAllowed = "move";
    card.classList.add("dragging");
  });
  card.addEventListener("dragend", function (){ card.classList.remove("dragging"); });
  card.addEventListener("keydown", function (e){
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openDeal(d.id); }
    if (e.key === "l"){ e.preventDefault(); logPopover(card, d); }
  });
  return card;
}

function viewCompanies(el){
  var q = h("input", { type:"text", placeholder:"Filter companies and contacts", "aria-label":"Filter",
                       style:"max-width:340px;margin-bottom:14px" });
  el.appendChild(q);
  var host = h("div");
  el.appendChild(host);

  function paint(){
    clear(host);
    var term = q.value.trim().toLowerCase();
    var cos = Object.keys(App.st.companies).map(function (k){ return App.st.companies[k]; })
      .sort(function (a,b){ return a.name < b.name ? -1 : 1; });
    var any = false;
    cos.forEach(function (co){
      var deals = Object.keys(App.st.deals).map(function (k){ return App.st.deals[k]; })
        .filter(function (d){ return d.companyId === co.id; });
      var cts = Object.keys(App.st.contacts).map(function (k){ return App.st.contacts[k]; })
        .filter(function (c){ return c.companyId === co.id; });
      var hay = (co.name + " " + co.domain + " " + cts.map(function(c){ return c.name + " " + c.email; }).join(" ")).toLowerCase();
      if (term && hay.indexOf(term) < 0) return;
      any = true;

      var open = deals.filter(function (d){ return d.status === "open"; });
      var tot = {};
      open.forEach(function (d){ if (d.value) tot[d.currency||"ZAR"] = (tot[d.currency||"ZAR"]||0) + d.value; });
      var lastIx = null;
      deals.forEach(function (d){ var l = C.lastContact(App.st, d.id); if (l && (!lastIx || l > lastIx)) lastIx = l; });

      var sec = h("section", { class:"pane", style:"margin-bottom:14px" },
        h("div", { style:"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap" },
          h("h3", { text:co.name }),
          co.domain ? h("span", { class:"mono", style:"font-size:11.5px;color:var(--muted)", text:co.domain }) : null,
          h("span", { class:"spacer" }),
          h("span", { class:"mono", style:"font-size:12px",
            text: Object.keys(tot).map(function (c){ return C.fmtMoney(tot[c], c); }).join(" · ") || "—" })),
        h("div", { class:"note", style:"margin-bottom:10px",
          text: open.length + " open deal" + (open.length===1?"":"s") + " · " +
                (lastIx ? "last contact " + C.fmtDayYear(lastIx) : "never contacted") }));

      if (deals.length){
        var t = h("table", { class:"tbl" }, h("thead", null, h("tr", null,
          h("th", { text:"Deal" }), h("th", { text:"Stage" }), h("th", { text:"Next step" }),
          h("th", { text:"Owner" }), h("th", { class:"num", text:"Value" }))));
        var tb = h("tbody");
        deals.sort(function (a,b){ return a.status === b.status ? (a.name < b.name ? -1:1) : (a.status === "open" ? -1 : 1); })
          .forEach(function (d){
            var nx = C.openFollowupsFor(App.st, d.id)[0];
            var late = nx ? C.daysBetween(App.today, nx.dueDate) : null;
            tb.appendChild(h("tr", { onclick:function (){ openDeal(d.id); } },
              h("td", null, h("div", { text:d.name }), chipsFor(d.id, 3)),
              h("td", { text: d.status === "open" ? C.stageLabel(App.config, d.stage)
                                                  : (d.outcome === "won" ? "Won" : "Lost") }),
              h("td", { style: nx ? (late < 0 ? "color:var(--overdue)" : "") : "color:var(--muted)",
                        text: nx ? C.fmtDay(nx.dueDate) + " · " + nx.what
                                 : (d.status === "open" ? "— no next step" : "—") }),
              h("td", { text:userName(d.owner) }),
              h("td", { class:"num", text:d.value == null ? "—" : C.fmtMoney(d.value, d.currency) })));
          });
        t.appendChild(tb);
        sec.appendChild(t);
      }

      if (cts.length){
        var cl = h("div", { style:"margin-top:12px;display:flex;flex-wrap:wrap;gap:8px" });
        cts.forEach(function (c){
          cl.appendChild(h("div", { style:"border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:190px" },
            h("div", { style:"font-size:13px", text:c.name }),
            h("div", { class:"mono", style:"font-size:11px;color:var(--muted)", text:c.role || "" }),
            c.email ? h("div", { style:"font-size:11.5px" },
              h("a", { href:"mailto:" + c.email }, c.email)) : null,
            c.phone ? h("div", { class:"mono", style:"font-size:11px;color:var(--muted)", text:c.phone }) : null));
        });
        sec.appendChild(cl);
      }
      host.appendChild(sec);
    });
    if (!any) host.appendChild(h("div", { class:"empty", text: term ? "Nothing matches that." : "No companies yet." }));
  }
  q.addEventListener("input", paint);
  paint();
}

   WEEK (C14a) — retrospective first, then forecast

function viewWeek(el){
  var thisMon = C.startOfWeek(App.today);
  var lastMon = C.addDays(thisMon, -7), lastSun = C.addDays(thisMon, -1);
  var r = C.weekRetro(App.events, App.st, App.config, lastMon, lastSun, scopeOpts());
  var fc = C.forecast(App.st, App.config, App.today, scopeOpts());

  var halves = h("div", { class:"halves" });

  /* --- last week --- */
  var left = h("section", { class:"pane" },
    h("h3", { text:"Last week" }),
    h("div", { class:"sub", text:C.fmtDayYear(lastMon) + " → " + C.fmtDayYear(lastSun) }));
  function stat(lab, v, hot, title){
    left.appendChild(h("div", { class:"stat", title:title || "" },
      h("span", { class:"lab", text:lab }),
      h("span", { class:"v" + (hot ? " hot" : ""), text:String(v) })));
  }
  stat("Follow-ups completed", r.completed);
  stat("Interactions logged", r.logged, false, "Every flag on this page is computed from these.");
  stat("Follow-ups pushed", r.pushes, r.pushes > r.completed,
       "Rescheduling is never blocked. It is counted.");
  stat("Deals that lost their next step", r.declined, r.declined > 0,
       "Times someone chose “no next step yet”.");
  stat("New follow-ups created", r.created);
  stat("Won", r.won);
  stat("Lost", r.lost, r.lost > 0);
  if (Object.keys(r.wonValue).length)
    left.appendChild(h("div", { class:"stat" },
      h("span", { class:"lab", text:"Won value" }),
      h("span", { class:"v", text:Object.keys(r.wonValue).map(function (c){
        return C.fmtMoney(r.wonValue[c], c); }).join(" · ") })));

  var b = C.bands(App.st, App.config, App.today, scopeOpts());
  left.appendChild(h("div", { class:"trust" },
    r.pushes > r.completed
      ? h("span", null, h("strong", { text:"More was pushed than finished last week." }),
          " That is the number this page exists to show.")
      : h("span", null, h("strong", { text:"More was finished than pushed." }), " The discipline held."),
    h("div", { style:"margin-top:6px",
      text: b.noNextStep.length
        ? b.noNextStep.length + " open deal" + (b.noNextStep.length===1?"":"s") + " currently has no next step at all."
        : "Every open deal currently has a next step." })));
  halves.appendChild(left);

  /* --- forecast --- */
  var right = h("section", { class:"pane" },
    h("h3", { text:"Forecast" }),
    h("div", { class:"sub", text:"Open deals × fixed stage probability · currencies never converted" }));

  if (!fc.length){
    right.appendChild(h("div", { class:"note", text:"No open deals with a value." }));
  }
  fc.forEach(function (cur){
    right.appendChild(h("div", { class:"band-head", style:"margin-top:14px" },
      h("span", { text:cur.currency }),
      h("span", { class:"n", text:"· " + cur.count + " deal" + (cur.count===1?"":"s") })));
    var t = h("table", { class:"tbl" }, h("thead", null, h("tr", null,
      h("th", { text:"Close month" }), h("th", { class:"num", text:"Deals" }),
      h("th", { class:"num", text:"Gross" }), h("th", { class:"num", text:"Weighted" }))));
    var tb = h("tbody");
    cur.monthList.forEach(function (m){
      tb.appendChild(h("tr", null,
        h("td", null, h("span", { text:C.fmtMonth(m.key) }),
          m.passed ? h("span", { class:"chip hot", style:"margin-left:6px",
            title:C.flagRule("Close date passed", App.config),
            text: m.key === "none" ? "no date" : m.passed + " passed" }) : null),
        h("td", { class:"num", text:String(m.count) }),
        h("td", { class:"num", text:C.fmtMoney(m.gross, cur.currency) }),
        h("td", { class:"num", text:C.fmtMoney(m.weighted, cur.currency) })));
    });
    tb.appendChild(h("tr", null,
      h("td", null, h("strong", { text:"Total" })),
      h("td", { class:"num", text:String(cur.count) }),
      h("td", { class:"num", text:C.fmtMoney(cur.gross, cur.currency) }),
      h("td", { class:"num" }, h("strong", { text:C.fmtMoney(cur.weighted, cur.currency) }))));
    t.appendChild(tb);
    right.appendChild(t);

    right.appendChild(h("div", { class:"trust" },
      h("span", null,
        h("strong", { text:cur.atRiskPct + "%" }),
        " of this " + cur.currency + " weighted total (" + C.fmtMoney(cur.atRiskWeighted, cur.currency) +

      h("div", { style:"margin-top:6px",

  halves.appendChild(right);
  el.appendChild(halves);
}

   SETTINGS
   ============================================================ */

function viewSettings(el){
  /* workspace */
  var ws = h("section", { class:"pane", style:"margin-bottom:16px" },
    h("h3", { text:"Workspace" }),
    h("div", { class:"sub", text: App.workspace === "demo"
      ? "Demo — everything here is invented and lives only in this browser."
      : "Team — synced to your private repo." }));
  var seg = h("div", { class:"seg" });
  [["demo","Demo"],["team","Team"]].forEach(function (w){
    var btn = h("button", { type:"button", onclick:function (){ switchWorkspace(w[0]); } }, w[1]);
    btn.setAttribute("aria-pressed", App.workspace === w[0] ? "true" : "false");
    seg.appendChild(btn);
  });
  ws.appendChild(seg);

  if (App.workspace === "demo"){
    ws.appendChild(h("div", { style:"margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap" },
      h("button", { class:"btn", type:"button", onclick:function (){
        lsDel(LS.demoEv); loadWorkspace(); render(); toast("Demo reset to its baked-in state.");
      }}, "Reset demo data"),
      h("span", { class:"note", text:"The real workspace has no reset button at all, by ruling. Wiping five people's pipeline should require a deliberate git operation." })));
    var who = h("select", { style:"max-width:200px", onchange:function (e){
      App.me = e.target.value; lsSet(LS.me + ".demo", App.me); render();
    }});
    users().forEach(function (u){ who.appendChild(h("option", { value:u.id }, u.name)); });
    who.value = App.me;
    ws.appendChild(h("label", { class:"fld", style:"margin-top:12px;max-width:260px" },
      h("span", { text:"Act as (demo only) — try the Mine / Team toggle" }), who));
  }
  el.appendChild(ws);

  /* github */
  var gh = h("section", { class:"pane", style:"margin-bottom:16px" },
    h("h3", { text:"Team sync" }),
    h("div", { class:"sub", text:"Private repo · each person appends only to their own event file, so two writers never collide." }));
  var f = {};
  function field(key, label, type, ph, note){
    f[key] = h("input", { type:type || "text", value:App.gh[key] || "", placeholder:ph || "", "aria-label":label });
    gh.appendChild(h("label", { class:"fld" }, h("span", { text:label }), f[key],
      note ? h("span", { class:"note", text:note }) : null));
  }
  gh.appendChild(h("div", { class:"row2" },
    (function (){ f.owner = h("input", { type:"text", value:App.gh.owner||"", placeholder:"modelwaresystems-dama", "aria-label":"Repo owner" });
       return h("label", { class:"fld" }, h("span", { text:"Repo owner" }), f.owner); })(),
    (function (){ f.repo = h("input", { type:"text", value:App.gh.repo||"", placeholder:"crm-data", "aria-label":"Repo name" });
       return h("label", { class:"fld" }, h("span", { text:"Private repo" }), f.repo); })()));
  gh.appendChild(h("div", { class:"row2" },
    (function (){ f.branch = h("input", { type:"text", value:App.gh.branch||"main", "aria-label":"Branch" });
       return h("label", { class:"fld" }, h("span", { text:"Branch" }), f.branch); })(),
    (function (){ f.user = h("input", { type:"text", value:App.gh.user||"", placeholder:"howard", "aria-label":"Your user id" });
       return h("label", { class:"fld" }, h("span", { text:"Your user id" }), f.user); })()));
  field("token", "Fine-grained personal access token", "password", "github_pat_…",
        "Contents: read & write, scoped to this one repo. Stored in this browser only, never sent anywhere but api.github.com.");

  var status = h("div", { class:"note", text:syncLabel() });
  gh.appendChild(h("div", { style:"display:flex;gap:8px;flex-wrap:wrap;align-items:center" },
    h("button", { class:"btn primary", type:"button", onclick:async function (){
      App.gh = { owner:f.owner.value.trim(), repo:f.repo.value.trim(),
                 branch:f.branch.value.trim() || "main", user:f.user.value.trim(),
                 token:f.token.value.trim() };
      lsSet(LS.gh, App.gh);
      if (!ghConfigured()){ toast("Owner, repo, user id and token are all needed.", "err"); return; }
      App.workspace = "team"; lsSet(LS.ws, "team");
      try {
        await pullTeam();
        await flushPending();
        App.me = App.gh.user; lsSet(LS.me, App.me);
        render(); toast("Connected. Pulled " + App.events.length + " events.");
      } catch (err){
        setSync("error", String(err.message||err));
        toast("Could not connect: " + (err.message||err), "err");
        status.textContent = syncLabel();
      }
    }}, "Connect & pull"),
    h("button", { class:"btn", type:"button", onclick:async function (){
      try { await pullTeam(); await flushPending(); render(); toast("Pulled."); }
      catch (err){ toast("Pull failed: " + (err.message||err), "err"); }
    }}, "Pull now"),
    h("button", { class:"btn", type:"button", onclick:async function (){
      try { await flushPending(); render(); toast(App.pending.length ? "Still " + App.pending.length + " waiting." : "All pushed."); }
      catch (err){ toast("Push failed: " + (err.message||err), "err"); }
    }}, "Push now"),
    status));
  gh.appendChild(h("div", { class:"note", style:"margin-top:10px",
    text:"Expected repo layout — config.json at the root, and events/<your-user-id>.jsonl per person. The app creates your own file on first push; it never writes anyone else's." }));
  el.appendChild(gh);

  /* import / export */
  var io = h("section", { class:"pane", style:"margin-bottom:16px" },
    h("h3", { text:"Import & export" }),
    h("div", { class:"sub", text:"One-time CSV import at setup · CSV export whenever you like. No lock-in: the event log is plain JSONL." }));

  var file = h("input", { type:"file", accept:".csv,text/csv", "aria-label":"CSV file" });
  var report = h("div", { class:"note" });
  io.appendChild(h("label", { class:"fld" }, h("span", { text:"Import a CSV of companies, contacts and deals" }), file));
  io.appendChild(report);
  file.addEventListener("change", function (){
    var fl = file.files && file.files[0]; if (!fl) return;
    var rd = new FileReader();
    rd.onload = function (){
      var res = C.importCSV(String(rd.result), App.config, { actor:App.me, today:App.today });
      clear(report);
      if (res.errors.length) res.errors.forEach(function (e){ report.appendChild(h("div", { style:"color:var(--overdue)", text:e })); });
      if (!res.events.length){ report.appendChild(h("div", { text:"Nothing to import." })); return; }
      report.appendChild(h("div", { text:"Ready: " + res.summary.deals + " deals · " +
        res.summary.companies + " companies · " + res.summary.contacts + " contacts · " +
        res.summary.followups + " follow-ups, from " + res.summary.rows + " rows." }));
      report.appendChild(h("div", { style:"margin-top:8px" },
        h("button", { class:"btn primary btn-sm", type:"button", onclick:function (){
          res.events.forEach(function (e){
            e.actor = App.me; e.ts = new Date().toISOString(); e.seq = App.seq++;
            App.events.push(e); if (App.workspace === "team") App.pending.push(e);
          });
          persist(); refold(); render();
          toast("Imported " + res.summary.deals + " deals.");
          go("pipeline");
        }}, "Commit the import")));
    };
    rd.readAsText(fl);
  });

  io.appendChild(h("div", { style:"margin-top:14px;display:flex;gap:8px;flex-wrap:wrap" },
    h("button", { class:"btn", type:"button", onclick:function (){
      download("crm-deals-" + App.today + ".csv", C.exportCSV(App.st, App.config, App.today), "text/csv");
    }}, "Export deals as CSV"),
    h("button", { class:"btn", type:"button", onclick:function (){
      download("crm-events-" + App.today + ".jsonl",
        C.sortEvents(App.events).map(function (e){ return JSON.stringify(e); }).join("\n") + "\n",
        "application/x-ndjson");
    }}, "Export the raw event log"),
    h("button", { class:"btn", type:"button", onclick:function (e){ pastePopover(e.currentTarget); } },
      "Paste an email to log")));
  el.appendChild(io);

  /* config, read-only */
  var cfg = h("section", { class:"pane" },
    h("h3", { text:"Active configuration" }),
    h("div", { class:"sub", text:"Read-only here on purpose. Change it in config.json in the repo." }));
  var t = h("table", { class:"tbl" }, h("thead", null, h("tr", null,
    h("th", { text:"Stage" }), h("th", { class:"num", text:"Forecast probability" }))));
  var tb = h("tbody");
  (App.config.stages||[]).forEach(function (s){
    tb.appendChild(h("tr", null, h("td", { text:s.label }),
      h("td", { class:"num", text:Math.round(s.probability * 100) + "%" })));
  });
  t.appendChild(tb); cfg.appendChild(t);
  var th = App.config.thresholds || {};
  cfg.appendChild(h("div", { class:"note", style:"margin-top:10px",
    text:"Thresholds — pushed " + th.pushedCount + "+ · silent " + th.silentDays +
         " days · stalled " + th.stalledDays + " days. Currencies: " +
         (App.config.currencies||[]).join(", ") + ", never converted into one another." }));
  cfg.appendChild(h("div", { class:"note",
    text:"Team: " + users().map(function (u){ return u.name; }).join(", ") + "." }));
  el.appendChild(cfg);

  /* keyboard reference */
  el.appendChild(h("section", { class:"pane", style:"margin-top:16px" },
    h("h3", { text:"Keyboard" }),
    h("div", { class:"note", style:"line-height:1.9" },
      h("div", { text:"n  new deal   ·   l  log on the focused deal   ·   /  search   ·   g then t p c w s  navigate" }),
      h("div", { text:"On a Today row:  d  done   ·   1  tomorrow   ·   3  +3 days   ·   7  +7 days   ·   4  +14 days   ·   e  defer with a typed date" }),
      h("div", { text:"j / k or arrow keys move between rows. Esc closes whatever is open." }),
      h("div", { text:"Quick-defer keys skip weekends. A date you type lands exactly as typed." }))));
}

function switchWorkspace(w){
  if (w === App.workspace) return;
  App.workspace = w; lsSet(LS.ws, w);
  loadWorkspace(); App.view = "today"; render();
  toast(w === "demo" ? "Demo workspace — invented data, nothing leaves this browser."
                     : "Team workspace.");
}

function download(name, text, mime){
  var blob = new Blob([text], { type:(mime||"text/plain") + ";charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = h("a", { href:url, download:name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function (){ URL.revokeObjectURL(url); }, 1500);
}

/* ============================================================
   SEARCH
   ============================================================ */

function openSearch(){
  closeLayers("search");
  var results = h("div", { class:"results", role:"listbox" });
  var inp = h("input", { type:"text", placeholder:"Search deals, companies, contacts…",
                         "aria-label":"Search", autocomplete:"off" });
  var box = h("div", { class:"searchbox" }, inp, results);
  var wrap = h("div", { class:"searchwrap", data:{ kind:"search" },
                        onclick:function (e){ if (e.target === wrap) closeLayers("search"); } }, box);
  layerEl().appendChild(wrap);
  var sel = 0, current = [];

  function paint(){
    clear(results);
    current = C.search(App.st, App.config, inp.value, 12);
    if (!current.length){
      results.appendChild(h("div", { class:"r", style:"cursor:default;color:var(--muted)",
        text: inp.value.trim() ? "Nothing matches." : "Type to search." }));
      return;
    }
    current.forEach(function (r, i){
      var row = h("div", { class:"r", role:"option", onclick:function (){ pick(i); } },
        h("span", { class:"k", text:r.kind }),
        h("div", null, h("div", { text:r.title }),
          h("div", { style:"font-size:11.5px;color:var(--muted)", text:r.sub })));
      row.setAttribute("aria-selected", i === sel ? "true" : "false");
      results.appendChild(row);
    });
  }
  function pick(i){
    var r = current[i]; if (!r) return;
    closeLayers("search");
    if (r.kind === "deal") openDeal(r.id);
    else go("companies");
  }
  inp.addEventListener("input", function (){ sel = 0; paint(); });
  inp.addEventListener("keydown", function (e){
    if (e.key === "ArrowDown"){ e.preventDefault(); sel = Math.min(sel+1, current.length-1); paint(); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); sel = Math.max(0, sel-1); paint(); }
    else if (e.key === "Enter"){ e.preventDefault(); pick(sel); }
    else if (e.key === "Escape"){ e.preventDefault(); closeLayers("search"); }
  });
  paint(); inp.focus();
}

/* ============================================================
   GLOBAL KEYBOARD (C10)
   ============================================================ */

var gPending = false, gTimer = null;

function isTyping(t){
  return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
}

document.addEventListener("keydown", function (e){
  if (e.metaKey || e.ctrlKey || e.altKey){
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); openSearch(); }
    return;
  }
  if (isTyping(e.target)) return;

  if (gPending){
    gPending = false; clearTimeout(gTimer);
    var map = { t:"today", p:"pipeline", c:"companies", w:"week", s:"settings" };
    if (map[e.key]){ e.preventDefault(); go(map[e.key]); return; }
  }
  switch (e.key){
    case "g": gPending = true; gTimer = setTimeout(function (){ gPending = false; }, 1200); break;
    case "/": e.preventDefault(); openSearch(); break;
    case "n": e.preventDefault(); newDeal(null); break;
    case "Escape": closeLayers(); App.openDealId = null; break;
    case "j": case "ArrowDown": if (App.view === "today"){ e.preventDefault(); moveSel(1); } break;
    case "k": case "ArrowUp":   if (App.view === "today"){ e.preventDefault(); moveSel(-1); } break;
    default: break;
  }
});

function moveSel(delta){
  var rows = Array.prototype.slice.call(document.querySelectorAll("#content .item"));
  if (!rows.length) return;
  var idx = rows.indexOf(document.activeElement);
  var next = idx < 0 ? (delta > 0 ? 0 : rows.length - 1) : Math.max(0, Math.min(rows.length - 1, idx + delta));
  rows.forEach(function (r){ r.classList.remove("sel"); });
  rows[next].classList.add("sel");
  rows[next].focus();
  rows[next].scrollIntoView({ block:"nearest" });
}

/* ============================================================
   BOOT
   ============================================================ */

function boot(){
  loadWorkspace();
  render();

  if (App.workspace === "team" && ghConfigured()){
    pullTeam().then(function (){ return flushPending(); })
              .then(function (){ render(); })
              .catch(function (err){ setSync("error", String(err.message||err)); });
  }
  if (App.workspace === "demo" && !lsGet(LS.seenIntro, false)){
    lsSet(LS.seenIntro, true);
    setTimeout(function (){
      toast("This is the Demo workspace — invented data, no token needed. Settings switches to your team repo.",
            null, { label:"Settings", fn:function (){ go("settings"); } });
    }, 700);
  }

  // roll over at local midnight so an overnight tab is not lying about "today"
  setInterval(function (){
    var t = C.todayISO();
    if (t !== App.today){ refold(); render(); }
  }, 60000);

  // opportunistic sync
  window.addEventListener("online", function (){ if (App.workspace === "team" && App.pending.length) flushPending(); });
  window.addEventListener("beforeunload", function (e){
    if (App.workspace === "team" && App.pending.length && ghConfigured()){
      e.preventDefault(); e.returnValue = "";
    }
  });
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

/* exposed for the regression harness */
globalThis.CRMApp = { App:App, emit:emit, refold:refold, render:render,
                      completeFollowup:completeFollowup, doDefer:doDefer, rowKeys:rowKeys };

})();
</script>
