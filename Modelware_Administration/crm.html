      storBody.appendChild(t);
    }

    storBody.appendChild(h("div", { style:"margin-top:12px;display:flex;gap:8px;flex-wrap:wrap" },
      h("button", { class:"btn primary", type:"button", onclick:exportEverything }, "Export everything"),
      h("button", { class:"btn", type:"button", onclick:function (){
        lsDel(LS.demoEv);
        toast("Demo workspace data cleared from this browser.");
        if (App.workspace === "demo"){ loadWorkspace(); render(); } else paintStorage();
      }}, "Clear demo data"),
      h("button", { class:"btn", type:"button", onclick:function (){
        var n = 0;
        try {
          var doomed = [];
          for (var i = 0; i < localStorage.length; i++){
            var k = localStorage.key(i);
            if (k.indexOf("crm.") !== 0) doomed.push(k);
          }
          doomed.forEach(function (k){ localStorage.removeItem(k); n++; });
        } catch (e){}
        toast(n ? "Removed " + n + " item" + (n===1?"":"s") + " left by other pages." :
                  "Nothing else is using this page's storage.");
        paintStorage();
      }}, "Free space used by other pages"),
      h("button", { class:"btn", type:"button", onclick:paintStorage }, "Re-check")));

    storBody.appendChild(h("div", { class:"note", style:"margin-top:8px",
      text:"\u201cFree space used by other pages\u201d only removes items that are not this app's. " +
           "On a normal web address there will be none; opened from a file, there may be a great deal." }));
  }
  paintStorage();
  el.appendChild(stor);

  /* who is on which version — the question you cannot answer by asking people */
  if (App.workspace === "team"){
    var vers = h("section", { class:"pane", style:"margin-bottom:16px" },
      h("h3", { text:"Who's on which version" }),
      h("div", { class:"sub", text:"Recorded when someone opens a build for the first time. Stale rows mean an old copy, not an absent person." }));
    var mine = buildInfo();
    var seen = App.st.clients || {};
    var roster = users();
    var t = h("table", { class:"tbl" }, h("thead", null, h("tr", null,
      h("th", { text:"Person" }), h("th", { text:"Version" }),
      h("th", { text:"Build" }), h("th", { text:"First opened" }))));
    var tb = h("tbody");
    var anyStale = false;
    roster.forEach(function (u){
      var c = seen[u.id];
      var stale = c && mine.id && c.build !== mine.id;
      if (stale) anyStale = true;
      tb.appendChild(h("tr", null,
        h("td", null,
          h("span", { class:"chip owner", style:"margin-right:7px", text:initials(u.id) }),
          u.name + (u.id === App.me ? " (you)" : "")),
        h("td", { class:"mono", style: stale ? "color:var(--overdue);font-weight:600" : "",
                  text: c ? (c.version ? "v" + c.version : "—") : "never opened" }),
        h("td", { class:"mono", text: c ? String(c.build).slice(0,8) : "—" }),
        h("td", { class:"mono", text: c ? C.fmtDayYear(String(c.seenAt).slice(0,10)) : "—" })));
    });
    /* somebody logging events who is not in the roster still deserves a row */
    Object.keys(seen).forEach(function (id){
      if (roster.some(function (u){ return u.id === id; })) return;
      tb.appendChild(h("tr", null,
        h("td", { text:id + " — not in config.json" }),
        h("td", { class:"mono", text:seen[id].version ? "v" + seen[id].version : "—" }),
        h("td", { class:"mono", text:String(seen[id].build).slice(0,8) }),
        h("td", { class:"mono", text:C.fmtDayYear(String(seen[id].seenAt).slice(0,10)) })));
    });
    t.appendChild(tb);
    vers.appendChild(t);
    vers.appendChild(h("div", { class:"note", style:"margin-top:9px",
      text: anyStale
        ? "Someone is on a different build to yours. Ask them to reload the page — a hard reload (Ctrl+Shift+R) if it does not shift."
        : "Everyone who has opened it is on the same build as you." }));
    vers.appendChild(h("div", { class:"note",
      text:"A row only appears once that person has opened the app while connected to the team workspace." }));
    el.appendChild(vers);
  }

  /* config, read-only */
  var cfg = h("section", { class:"pane" },
    h("h3", { text:"Active configuration" }),
    h("div", { class:"sub", text:"Read-only here on purpose. Change it in config.json in the repo." }));
  var t = h("table", { class:"tbl" }, h("thead", null, h("tr", null,
    h("th", { text:"Stage" }), h("th", { class:"num", text:"Forecast probability" }))));
  var tb = h("tbody");
  (App.config.stages||[]).forEach(function (s){
    tb.appendChild(h("tr", null, h("td", { text:s.label }),
      h("td", { class:"num", text:Math.round(s.probability * 100) + "%" })));
  });
  t.appendChild(tb); cfg.appendChild(t);
  var th = App.config.thresholds || {};
  cfg.appendChild(h("div", { class:"note", style:"margin-top:10px",
    text:"Thresholds — pushed " + th.pushedCount + "+ · silent " + th.silentDays +
         " days · stalled " + th.stalledDays + " days. Currencies: " +
         (App.config.currencies||[]).join(", ") + ", never converted into one another." }));
  cfg.appendChild(h("div", { class:"note",
    text:"Team: " + users().map(function (u){ return u.name; }).join(", ") + "." }));
  el.appendChild(cfg);

  /* keyboard reference */
  el.appendChild(h("section", { class:"pane", style:"margin-top:16px" },
    h("h3", { text:"Keyboard" }),
    h("div", { class:"note", style:"line-height:1.9" },
      h("div", { text:"l  log an interaction — from anywhere   ·   n  new deal   ·   /  search   ·   g then t p c w s  navigate" }),
      h("div", { text:"On a Today row:  d  done   ·   1  tomorrow   ·   3  +3 days   ·   7  +7 days   ·   4  +14 days   ·   e  defer with a typed date" }),
      h("div", { text:"j / k or arrow keys move between rows. Esc closes whatever is open." }),
      h("div", { text:"Quick-defer keys skip weekends. A date you type lands exactly as typed." }))));
}

function switchWorkspace(w){
  if (w === App.workspace) return;
  App.workspace = w; lsSet(LS.ws, w);
  loadWorkspace(); announceBuild(); App.view = "today"; render();
  toast(w === "demo" ? "Demo workspace — invented data, nothing leaves this browser."
                     : "Team workspace.");
}

/* The escape hatch when the browser will not keep anything: get it out of the
   browser entirely, in the format the repo itself uses. */
function exportEverything(){
  var payload = C.sortEvents(App.events).map(function (e){ return JSON.stringify(e); }).join("\n") + "\n";
  download("crm-" + App.workspace + "-events-" + App.today + ".jsonl", payload, "application/x-ndjson");
  toast(App.events.length + " events exported. Keep this file — it is your whole workspace.");
}

function download(name, text, mime){
  var blob = new Blob([text], { type:(mime||"text/plain") + ";charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = h("a", { href:url, download:name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function (){ URL.revokeObjectURL(url); }, 1500);
}

/* ============================================================
   SEARCH
   ============================================================ */

function openSearch(){
  closeLayers("search");
  var results = h("div", { class:"results", role:"listbox" });
  var inp = h("input", { type:"text", placeholder:"Search deals, companies, contacts…",
                         "aria-label":"Search", autocomplete:"off" });
  var box = h("div", { class:"searchbox" }, inp, results);
  var wrap = h("div", { class:"searchwrap", data:{ kind:"search" },
                        onclick:function (e){ if (e.target === wrap) closeLayers("search"); } }, box);
  layerEl().appendChild(wrap);
  var sel = 0, current = [];

  function paint(){
    clear(results);
    current = C.search(App.st, App.config, inp.value, 12);
    if (!current.length){
      results.appendChild(h("div", { class:"r", style:"cursor:default;color:var(--muted)",
        text: inp.value.trim() ? "Nothing matches." : "Type to search." }));
      return;
    }
    current.forEach(function (r, i){
      var row = h("div", { class:"r", role:"option", onclick:function (){ pick(i); } },
        h("span", { class:"k", text:r.kind }),
        h("div", null, h("div", { text:r.title }),
          h("div", { style:"font-size:11.5px;color:var(--muted)", text:r.sub })));
      row.setAttribute("aria-selected", i === sel ? "true" : "false");
      results.appendChild(row);
    });
  }
  function pick(i){
    var r = current[i]; if (!r) return;
    closeLayers("search");
    if (r.kind === "deal") openDeal(r.id);
    else go("companies");
  }
  inp.addEventListener("input", function (){ sel = 0; paint(); });
  inp.addEventListener("keydown", function (e){
    if (e.key === "ArrowDown"){ e.preventDefault(); sel = Math.min(sel+1, current.length-1); paint(); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); sel = Math.max(0, sel-1); paint(); }
    else if (e.key === "Enter"){ e.preventDefault(); pick(sel); }
    else if (e.key === "Escape"){ e.preventDefault(); closeLayers("search"); }
  });
  paint(); inp.focus();
}

/* ============================================================
   GLOBAL KEYBOARD (C10)
   ============================================================ */

var gPending = false, gTimer = null;

function isTyping(t){
  return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
}

document.addEventListener("keydown", function (e){
  if (e.metaKey || e.ctrlKey || e.altKey){
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); openSearch(); }
    return;
  }
  if (isTyping(e.target)) return;

  if (gPending){
    gPending = false; clearTimeout(gTimer);
    var map = { t:"today", p:"pipeline", c:"companies", w:"week", s:"settings" };
    if (map[e.key]){ e.preventDefault(); go(map[e.key]); return; }
  }
  switch (e.key){
    case "g": gPending = true; gTimer = setTimeout(function (){ gPending = false; }, 1200); break;
    case "/": e.preventDefault(); openSearch(); break;
    case "n": e.preventDefault(); newDeal(null); break;
    case "l": {
      e.preventDefault();
      /* if a deal is already in front of you, skip the picker */
      var open = App.openDealId && App.st.deals[App.openDealId];
      if (open && document.querySelector(".panel")) logPopover($(".panel"), open);
      else quickLog(null);
      break;
    }
    case "Escape": closeLayers(); App.openDealId = null; break;
    case "j": case "ArrowDown": if (App.view === "today"){ e.preventDefault(); moveSel(1); } break;
    case "k": case "ArrowUp":   if (App.view === "today"){ e.preventDefault(); moveSel(-1); } break;
    default: break;
  }
});

function moveSel(delta){
  var rows = Array.prototype.slice.call(document.querySelectorAll("#content .item"));
  if (!rows.length) return;
  var idx = rows.indexOf(document.activeElement);
  var next = idx < 0 ? (delta > 0 ? 0 : rows.length - 1) : Math.max(0, Math.min(rows.length - 1, idx + delta));
  rows.forEach(function (r){ r.classList.remove("sel"); });
  rows[next].classList.add("sel");
  rows[next].focus();
  rows[next].scrollIntoView({ block:"nearest" });
}

/* ============================================================
   BOOT
   ============================================================ */

function boot(){
  loadWorkspace();
  render();

  if (App.workspace === "team" && ghConfigured()){
    /* A failed READ must never block the WRITE. Work sitting unpushed in this
       browser is the work most at risk of being lost, and chaining the flush
       onto the pull's success stranded it — silently, on every single load,
       for as long as the pull kept failing. Pull, then push regardless. */
    pullTeam()
      .then(function (){ announceBuild(); })
      .catch(function (err){
        setSync("error", String(err.message || err));
        toast("Could not read the team repo: " + (err.message || err) +
              " Anything you have not pushed yet is still in this browser, and " +
              "I will still try to push it.", "err");
      })
      .then(function (){ return flushPending(); })
      .catch(function (){})
      .then(function (){ render(); });
  }
  if (App.workspace === "demo" && !lsGet(LS.seenIntro, false)){
    lsSet(LS.seenIntro, true);
    setTimeout(function (){
      toast("This is the Demo workspace — invented data, no token needed. Settings switches to your team repo.",
            null, { label:"Settings", fn:function (){ go("settings"); } });
    }, 700);
  }

  // roll over at local midnight so an overnight tab is not lying about "today"
  setInterval(function (){
    var t = C.todayISO();
    if (t !== App.today){ refold(); render(); }
  }, 60000);

  // opportunistic sync
  window.addEventListener("online", function (){ if (App.workspace === "team" && App.pending.length) flushPending(); });
  window.addEventListener("beforeunload", function (e){
    if (App.workspace === "team" && App.pending.length && ghConfigured()){
      e.preventDefault(); e.returnValue = "";
    }
  });
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

/* exposed for the regression harness */
globalThis.CRMApp = { App:App, emit:emit, refold:refold, render:render,
                      completeFollowup:completeFollowup, doDefer:doDefer, rowKeys:rowKeys,
                      ghUrl:ghUrl, ghPrefix:ghPrefix, ghRelPath:ghRelPath,
                      testConnection:testConnection, ghExplain:ghExplain,
                      openDeal:openDeal, deleteDeal:deleteDeal, restoreDeal:restoreDeal };
globalThis.__test_diag = testConnection;
globalThis.__test_pull = pullTeam;

})();
</script>
