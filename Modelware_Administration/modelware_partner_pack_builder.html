<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelware Partner Pack Builder</title>
<!-- Modelware Partner Pack Builder — v1.10.2 — build 2026-08-31 16:10 SAST -->
<style>
:root{
  --ink:#12212b; --ink-2:#3d5361; --line:#d8e2e8; --line-2:#eef3f6;
  --bg:#f4f7f9; --panel:#ffffff; --accent:#0f6d8c; --accent-2:#0b566f;
  --warm:#c2571f; --good:#1c7a54; --warn:#a8730c;
  --shadow:0 1px 2px rgba(18,33,43,.06),0 6px 20px rgba(18,33,43,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Segoe UI",Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5;overflow-x:hidden}
header.app{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
header.app .brand{font-weight:700;letter-spacing:.2px;font-size:15px}
header.app .sub{font-size:12px;opacity:.72}
/* Who is open. The name is the thing you look at, so it is the thing that is
   readable; the app name above it shrinks to a label once a partner is loaded. */
header.app .who{min-width:0;flex:0 1 auto;max-width:26ch}
@media (min-width:1280px){header.app .who{max-width:36ch}}
@media (min-width:1600px){header.app .who{max-width:52ch}}
header.app .who.on .brand{font-size:10.5px;font-weight:600;opacity:.55;letter-spacing:.07em;text-transform:uppercase}
header.app .pname{font-size:15.5px;font-weight:700;letter-spacing:.1px;line-height:1.24;margin-top:1px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
header.app .pmeta{font-size:11.5px;opacity:.74;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.app .pmeta .dot{opacity:.45;padding:0 5px}
header.app .pmeta b{font-weight:600;opacity:.95}
header.app .spacer{flex:1}
header.app .ver{font-size:11px;font-family:var(--mono);background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:4px 10px;letter-spacing:.02em;white-space:nowrap}
.doc .stamp{font-size:10.5px;color:#8d9ea8;font-family:var(--mono);margin-top:3px}
.aboutbox{font-size:11.5px;color:var(--ink-2);background:#fbfdfe;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.aboutbox .v{font-family:var(--mono);font-weight:700;color:var(--ink)}
.aboutbox ul{margin:8px 0 0;padding-left:18px}
.aboutbox li{margin-bottom:4px}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid transparent;border-radius:6px;padding:8px 14px;cursor:pointer;background:var(--accent);color:#fff}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.light{background:#fff;color:var(--accent);border-color:var(--line)}
.btn.light:hover{background:var(--line-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.layout{display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr);gap:0;height:calc(100vh - 53px);max-width:100%;overflow:hidden}
.pane{overflow:auto;min-width:0;padding:18px 20px 60px}
.pane.left{border-right:1px solid var(--line);background:var(--panel)}
.pane.right{background:var(--bg)}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h2.sec:first-child{margin-top:4px}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.field .hint{font-size:11px;font-weight:400;color:#7c8f9a}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(15,109,140,.28);border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.models{display:grid;gap:8px}
.model-opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:7px;padding:10px;cursor:pointer;background:#fff}
.model-opt:hover{border-color:var(--accent)}
.model-opt.on{border-color:var(--accent);background:#f0f8fb;box-shadow:inset 0 0 0 1px var(--accent)}
.model-opt input{margin-top:3px}
.model-opt>span{display:block}
.model-opt .t{display:block;font-weight:700;font-size:13px}
.model-opt .d{display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--line-2);border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:11.5px;display:flex;align-items:center;gap:6px}
.chip button{border:0;background:none;cursor:pointer;color:var(--ink-2);font-size:13px;line-height:1;padding:0}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding-top:2px;z-index:5}
.tab{font:inherit;font-size:12.5px;font-weight:600;border:1px solid transparent;border-bottom:0;background:none;color:var(--ink-2);padding:8px 12px;border-radius:6px 6px 0 0;cursor:pointer}
.tab:hover{color:var(--accent)}
.tab.on{background:var(--panel);border-color:var(--line);color:var(--ink)}
.doc{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:44px 52px;max-width:860px;margin:0 auto 24px}
.doc h1{font-size:19px;margin:0 0 4px;letter-spacing:.2px}
.doc .docmeta{font-size:11.5px;color:#7c8f9a;margin-bottom:22px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.doc h2{font-size:14px;margin:22px 0 7px;color:var(--ink)}
.doc h3{font-size:12.5px;margin:16px 0 5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.doc p{margin:0 0 9px;text-align:justify}
.doc ul,.doc ol{margin:0 0 10px;padding-left:22px}
.doc li{margin-bottom:5px}
.doc table{border-collapse:collapse;width:100%;table-layout:auto;margin:6px 0 14px;font-size:12.5px}
.doc th,.doc td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.doc th{background:var(--line-2);font-weight:700}
.doc .note{background:#fff8e8;border-left:3px solid var(--warn);padding:9px 12px;font-size:12px;margin:0 0 16px;color:#5c4708}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:26px}
.doc .sigbox{border-top:1px solid var(--ink);padding-top:6px;font-size:12px;margin-top:44px}
.sheetwrap{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
  margin-bottom:18px;max-width:100%;width:fit-content;overflow:hidden}
.sheetscroll{overflow-x:auto;overflow-y:hidden;max-width:100%}
.sheethint{font-size:11px;color:#93a3ad;padding:6px 12px;border-top:1px solid var(--line-2)}
/* natural width, scrolling inside its own box — never squeezed until words break */
table.sheet{border-collapse:collapse;font-size:12px;width:max-content;max-width:none;table-layout:auto}
table.sheet th{white-space:nowrap;vertical-align:bottom}
table.sheet th,table.sheet td{border:1px solid var(--line);padding:5px 9px;vertical-align:top;
  white-space:normal;overflow-wrap:break-word;word-break:normal;hyphens:none;
  min-width:64px;max-width:300px}
table.sheet td.dt{white-space:nowrap;text-align:left;min-width:88px}
table.sheet td.num{white-space:nowrap;font-variant-numeric:tabular-nums;min-width:70px}
table.sheet td.fx{font-family:var(--mono);font-size:10.5px;color:#5d7280;max-width:260px;white-space:nowrap}
/* the key/value shape used for a single record */
table.sheet.kv{width:auto;max-width:100%}
table.sheet.kv td:first-child{min-width:180px;max-width:260px;font-weight:600;color:var(--ink-2);background:#fbfdfe}
table.sheet.kv td:last-child{max-width:560px}
/* Every value on every screen and every table starts at the same left edge.
   No exceptions — not numbers, not currency, not percentages, not dates. */
table.sheet th,
table.sheet td,
table.sheet td.num,
table.sheet td.dt,
table.sheet td.fx,
.doc th, .doc td{text-align:left}
table.sheet th{background:var(--ink);color:#fff;font-weight:600;text-align:left;position:sticky;top:0}
table.sheet tr.grp td{background:var(--line-2);font-weight:700}
.sheettitle{font-size:13px;font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);background:#fbfdfe}
.sheettitle .lead{display:block;font-weight:400;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.sheetfoot{font-size:11px;color:#7c8f9a;padding:8px 12px;border-top:1px solid var(--line-2);background:#fbfdfe;
  max-width:760px;overflow-wrap:anywhere}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--line-2);
  color:var(--ink-2);border:1px solid var(--line);max-width:100%;overflow-wrap:anywhere}
.pill.hard{background:#fdeceb;color:#9c2a20;border-color:#f3c9c5}
.pill.soft{background:#eaf6f1;color:var(--good);border-color:#c4e5d7}
.msg{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:7px;font-size:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;z-index:60;max-width:380px}
.msg.on{opacity:1;transform:none}
.msg.err{background:#8e2a20}
.disclaimer{background:#fff8e8;border:1px solid #f0dfb4;border-radius:7px;padding:10px 12px;font-size:11.5px;color:#5c4708;margin-bottom:14px}
.exportgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
details.adv{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:11px;background:#fbfdfe}
details.adv summary{font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer}
details.adv .body{padding-top:9px}
.overlay{position:fixed;inset:0;background:rgba(18,33,43,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:60px 20px;overflow:auto}
.dialog{background:#fff;border-radius:10px;max-width:520px;width:100%;padding:24px 26px;box-shadow:0 12px 40px rgba(18,33,43,.28)}
.dialog h3{margin:0 0 4px;font-size:17px}
.dialog .sub{font-size:12.5px;color:var(--ink-2);margin:0 0 18px}
.dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.flow{display:flex;gap:0;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.flow .step{flex:1 1 0;padding:9px 12px;border-right:1px solid var(--line-2);min-width:0}
.flow .step:last-child{border-right:0}
.flow .step .n{font-size:10px;font-weight:700;letter-spacing:.08em;color:#93a3ad;text-transform:uppercase}
.flow .step .t{font-size:12.5px;font-weight:700;margin-top:1px}
.flow .step .d{font-size:11px;color:var(--ink-2);margin-top:1px;line-height:1.35}
.flow .step.on{background:#f0f8fb;box-shadow:inset 0 -3px 0 var(--accent)}
.flow .step.on .n{color:var(--accent)}
.flow .step.done .t{color:#7c8f9a}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;margin-bottom:14px;box-shadow:var(--shadow)}
.filters input[type=text]{flex:1 1 260px;min-width:180px}
.filters select{flex:0 0 auto;width:auto;min-width:130px}
.filters .count{margin-left:auto;font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.rowacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stage{margin-bottom:16px}
.stage h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin:0 0 6px;display:flex;gap:8px;align-items:center}
.stage h3 .c{background:var(--line-2);border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;letter-spacing:0;text-transform:none}
.ghstatus{font-size:11.5px;padding:7px 9px;border-radius:5px;background:var(--line-2);color:var(--ink-2);border:1px solid var(--line);margin-top:8px;word-break:break-word}
.ghstatus.ok{background:#eaf6f1;color:#14603f;border-color:#c4e5d7}
.ghstatus.err{background:#fdeceb;color:#8e2a20;border-color:#f3c9c5}
.lineedit{border:1px solid var(--line);border-radius:7px;background:#fbfdfe;padding:2px 12px 10px;margin-bottom:11px}
.syncwrap{max-width:900px;padding:4px 2px}
.chkstub{display:flex;gap:12px;align-items:center;justify-content:space-between;
  border:1px solid #efdcb4;border-left:3px solid #a8730c;border-radius:7px;background:#fdf9ef;
  padding:11px 12px;margin-bottom:12px;font-size:12px;color:#5d7280}
.chkstub.err{border-color:#e2b3a2;border-left-color:#a1442a;background:#fdf4f1}
.chkstub .hint{font-size:11px;color:#8a7a5e}
.chkstub.err .hint{color:#a1442a}
.dialog.wide{max-width:640px}
.chklist{max-height:min(58vh,520px);overflow-y:auto;margin:4px -4px 0;padding:0 4px}
.chkitem{border:1px solid var(--line);border-left-width:3px;border-radius:7px;padding:11px 13px;margin-bottom:9px;background:#fff}
.chkitem.err{border-color:#e2b3a2;border-left-color:#a1442a}
.chkitem.warn{border-color:#efdcb4;border-left-color:#a8730c}
.chkitem .cq{font-size:14px;font-weight:700;color:#12212b;margin-bottom:3px}
.chkitem .ct{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#a1442a;margin-bottom:5px}
.chkitem.warn .ct{color:#a8730c}
.chkitem .cm{font-size:12.5px;color:#5d7280;line-height:1.55;margin-bottom:9px}
.chkf{display:block;margin-bottom:9px}
.chkf>span{display:block;font-size:11.5px;font-weight:600;color:#42586a;margin-bottom:4px}
.chkf input,.chkf select{width:100%;font:inherit;font-size:14px;padding:8px 10px;
  border:1px solid var(--line);border-radius:6px;background:#fff;color:#12212b}
.cact{display:flex;gap:7px;flex-wrap:wrap}
.chkdone{text-align:center;padding:14px 0 4px}
.chkdone .ok{font-size:15px;font-weight:700;color:#1c7a54;margin-bottom:4px}
.chkbadge{display:inline-block;min-width:17px;padding:0 5px;margin-left:6px;border-radius:9px;
  background:#a1442a;color:#fff;font-size:10.5px;font-weight:700;line-height:17px;text-align:center}
.chkbadge.warn{background:#a8730c}
.grp.flash{box-shadow:0 0 0 2px #0f6d8c inset;transition:box-shadow .3s}
.issues{margin-bottom:12px}
.issue{border:1px solid var(--line);border-left-width:3px;border-radius:6px;padding:8px 11px;margin-bottom:7px;font-size:12px}
.issue.err{border-color:#e2b3a2;border-left-color:#a1442a;background:#fdf4f1}
.issue.warn{border-color:#efdcb4;border-left-color:#a8730c;background:#fdf9ef}
.issue .it{font-weight:700;color:#42586a;margin-bottom:2px}
.issue.err .it{color:#a1442a}
.issue .im{color:#5d7280;line-height:1.5}
.grpbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.grphint{font-size:11px;color:#8ea0ab;margin-left:auto}
.grp{border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:9px;overflow:hidden}
.grp.off{background:#fbfcfd}
.grphead{display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;
  font:inherit;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:#42586a;background:#f5f9fa;border:0;border-bottom:1px solid var(--line);padding:10px 12px}
.grp.off .grphead{border-bottom:0;background:#fff}
.grphead:hover{background:#eef4f7}
.grphead .chev{flex:0 0 auto;width:0;height:0;border-left:5px solid #7c8f9a;
  border-top:4px solid transparent;border-bottom:4px solid transparent;transform:rotate(90deg);transition:transform .12s}
.grp.off .grphead .chev{transform:rotate(0deg)}
.grphead .gtitle{flex:1 1 auto;min-width:0}
.gcount{flex:0 0 auto;font-size:10.5px;font-weight:600;letter-spacing:0;text-transform:none;
  color:#7c8f9a;background:#eef3f6;border-radius:10px;padding:2px 8px}
.gcount.full{color:#1c7a54;background:#e6f5ee}
.grpbody{padding:12px 12px 2px}
.grp.off .grpbody{display:none}
.flow .step{display:flex;flex-direction:column}
.flow .stepgo{margin-top:auto;align-self:flex-start}
.flow .stepgo[disabled]{opacity:.45;cursor:not-allowed}
.syncstub{display:flex;gap:12px;align-items:center;justify-content:space-between;
  border:1px solid var(--line);border-radius:7px;background:#f7fbfc;padding:11px 12px;margin-bottom:12px;font-size:12px}
.syncstub.on{background:#eefaf4;border-color:#bfe6d4}
.syncstub .hint{font-size:11px;color:#7c8f9a}
.syncpanel{border:1px solid var(--line);border-radius:9px;background:#fff;padding:14px 16px 16px;margin-bottom:12px}
.synclede{font-size:11.5px;color:#7c8f9a;margin:-4px 0 12px}
.synchint{font-size:11.5px;color:#7c8f9a;margin:-4px 0 12px;line-height:1.55}

.syncbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.syncstamp{font-size:11.5px;color:#7c8f9a;margin-left:2px}

.syncstatus.ok{background:#eefaf4;border-color:#bfe6d4;color:#1c7a54}
.syncstatus.err{background:#fdf4f1;border-color:#e2b3a2;color:#a1442a}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c3d2da;margin-left:4px}
.tab .dot.ok{background:#1c7a54}
.refbar{display:flex;gap:10px;align-items:center;justify-content:space-between;

  font-size:11.5px;color:#5d7280}
.refbar.frozen{border-color:#b9c7cf;background:#f4f7f9;color:#3f5561}

.refbar.clash{border-color:#e2b3a2;background:#fdf4f1;color:#a1442a;font-weight:600}
.voltbl{border:1px solid var(--line);border-radius:7px;background:#fbfdfe;overflow-x:auto;margin-bottom:8px}
.voltbl table{border-collapse:collapse;width:max-content;min-width:100%;font-size:12px}
.voltbl th,.voltbl td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.voltbl th{font-weight:600;color:#42586a;background:#f2f7f9}

.voltbl tr.under td{color:#a1442a;background:#fdf4f1}
.voltbl tr.here td{background:#eef7fa;font-weight:600}

.lerow:first-child{border-top:0}
.lerow.off{opacity:.5}
.lerow.tot{border-top:1px solid var(--line);padding-bottom:4px}
.lehead2{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lename{font-size:12.5px;font-weight:600;line-height:1.3}
.letot{font-size:12.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.legrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:7px}
.legrid label{display:block;min-width:0}
.legrid label span{display:block;font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;color:#93a3ad;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legrid label span em{font-style:normal;font-weight:400;text-transform:none;letter-spacing:0}
.legrid input{width:100%;font-size:12.5px;padding:6px 7px}

<script>
"use strict";
/* ============================================================================
   MODELWARE PARTNER PACK BUILDER
   Single-file, fully offline. No external libraries, no network, no storage.
   Generates: partner account workbook (.xlsx), contract set (.docx + .pdf),
   and a combined .zip pack.
   ========================================================================= */

/* ------------------------------------------------------- version and build */
var APP_NAME    = "Modelware Partner Pack Builder";
var APP_VERSION = "1.29.2";
var APP_BUILD   = "2026-09-06 11:00 SAST";   /* set when this file is generated */
var APP_CHANGELOG = [
  ["1.29.2","2026-09-06","Onboarding step B1 now says which kind of site to create: a communication site, not a Teams site. A Teams site is group-connected, so it brings a Microsoft 365 group, a mailbox, a calendar and a chat space, and group membership grants access to all of it \u2014 two overlapping membership systems to unpick on the day you are withdrawing access."],
  ["1.29.1","2026-09-06","The header now says who you have open. The partner\u2019s legal name sits where the strapline used to be, with the agreement reference, the operating model and the stage on the line beneath, and the app name shrinks to a label above it. With nothing loaded it says so and points at + New partner. It follows the record, so switching partner or changing the model updates it immediately, and it narrows rather than pushing the buttons off the row."],
  ["1.29.0","2026-09-06","Online delivery is now ours to control. Schedule F4 requires every online delivery to run in a meeting hosted on the Modelware tenant and organised by a Modelware account \u2014 which is the enforcement, because a trainer who joins as a presenter cannot open Meeting options at all. The schedule prints the settings: presenters limited to the organiser, recording off, transcription off, attendee screen share off, everyone signs in, lobby on, and no third-party notetaker or AI assistant admitted. Turning any of those on now raises a prompt that says what it costs you. And a Courseware Protection Onboarding Checklist per partner, in seven stages from paperwork through provisioning to a test that a removed trainer can no longer open the deck \u2014 as a document in the pack and as a live sheet in the workbook that counts what is still open and answers whether the partner is ready for a first delivery. Nothing is provisioned before Schedule F is signed, which is the whole point of the ordering."],
  ["1.28.0","2026-09-06","Licensed content is now managed, not assumed. A Licensed content section records which courses and versions each partner may teach and which named individuals may open the facilitator material, with a course catalogue to pick from. Two new documents come out of it: Schedule F \u2014 Licensed Content and Access, which lists the courses, the people, how access is provided and exactly what withdraws it and when; and an Access Withdrawal Runbook, which is internal, never goes in the partner\u2019s folder, and sets out the order to switch things off on the day \u2014 accounts before files, because accounts are what grant access. A Licensed Content workbook sheet carries the same lists, an access log and the checklist. New checks flag no courses licensed, nobody named, no library address, and an offline validity long enough that a former trainer keeps opening the deck for a week after termination."],
  ["1.27.0","2026-09-05","Reframed the account so a partner reads it as help, not a loan. It is now Deferred set-up costs, and clause 5 opens with the purpose: to defer, rather than waive, the costs of establishing the Territory. It then says plainly that this is not a loan and not a credit facility \u2014 no money advanced, no interest, no security, capped at what was actually spent \u2014 that Modelware carries the cost and the risk of a slow start, that nothing is payable while the deferral runs, and that recovery is not intended to interrupt trading, with instalments available and a schedule being met never treated as a default. The trigger is now something the partner controls and can see coming: a confirmed booking of eight or more delegates, or a cumulative revenue figure if you set one, whichever is first \u2014 and repayment starts at that or the Phase 1 date, whichever comes first. The workbook sheet is the Deferred Cost Account, logs bookings by delegate count, names which limb met the trigger, and answers Payable now? in words."],
  ["1.26.1","2026-09-05","Reverted the write-off. Modelware does not absorb the set-up cost: the account is credited with the initial fee, royalties, the marketing contribution and any override as they are received, and a shortfall when it closes is a debt due by the partner, payable within the recovery period or set off against future royalties by agreement. The revenue trigger stays, as a third way the account can close alongside full recovery and the Phase 1 end date \u2014 so it now closes on the earliest of the three. Shortfall recoverable is back on the form and defaults to yes; turning it off raises a prompt naming the amount Modelware would be absorbing. The workbook tracks the credit side and the partner\u2019s revenue separately, and reports which of the three closed the account."],
  ["1.26.0","2026-09-04","Fourteen open questions settled, and the pack now says what you decided. The IP Licence tier is withdrawn \u2014 it was sold on anonymity, which the attribution rules rule out \u2014 and a record still on it is moved to Authorised Delivery Partner and says so. The set-up account no longer has a credit side: it accrues our costs, stops on the earlier of a revenue trigger and the Phase 1 end date, and the balance is then written off, never recovered. Minimum royalty runs from year 1. Publications and examination coupons are bought direct from DAMA and the publisher, so nothing is added per delegate. Franchise fees are per partner with nothing published. Reseller territories are non-exclusive unless you say otherwise, and the band true-up now runs both ways. The 2% is named as a Marketing and Brand Fund with permitted uses, an annual statement and carry-forward. Reseller sales staff get a Sales Enablement Session instead of a seat in the room. Supplementary material stays the partner\u2019s, and a Contributed Material Library pays them a fixed fee for every delivery another partner makes with it. Contract references freeze at Contracting with a recorded unlock. Contracts refuse to export while a red check stands \u2014 everything else still exports, stamped DRAFT. Cyber cover dropped; Schedule D now carries professional indemnity and public liability limits."],
  ["1.25.0","2026-09-04","The pre-send checks are now a dialog you answer rather than a block of text you read. Each one is put as a question \u2014 how is this partner constituted, when should Phase 1 end \u2014 with the field to answer it right there, a one-click fix where there is an obvious answer, and Show me in the form to jump to the section with the field focused. Answering removes the question in front of you. A Checks button in the header carries a count, red when something would produce a contradictory contract, and the form shows a single prompt above the sections instead of the old list."],
  ["1.24.0","2026-09-04","Acting on the review of Melissa\u2019s pack. Schedule B asserted no minimum annual royalty whatever the record said, so an agreement setting one contradicted its own schedule \u2014 both now render the actual figure and the year it starts, which is a new setting. A Phase 1 end date on or before commencement is ignored, and one less than ninety days out is refused, with a Before you send this pack panel listing every such problem. Partners are no longer all described as incorporated companies: a legal-form field drives the preamble for an individual, sole proprietor, freelance licence or free zone entity. Added marketing-fund governance with an annual statement, the partner\u2019s right to the calculation behind any figure, cyber liability insurance alongside PI and public liability, and a cross-border transfer section naming the UAE PDPL position."],
  ["1.23.0","2026-09-04","Every section in the left pane now folds. Each header carries a count of how many of its fields are filled, turning green when the section is done, and a line at the top says how many sections there are, how many are complete and how many are open. Collapse all and Expand all are there, the choice is remembered between sessions, and on a first run everything is folded except the operating model, so the pane reads as a contents page rather than a wall of fields."],
  ["1.22.0","2026-09-04","Two gaps closed. The workbook cites facilitator slide numbers but never slide content, so the agreement now says the slide reference licenses nothing, and bars annotating the workbook to fill the gap in or reconstructing the deck from attendance, notes or recall. And a new clause on who may learn: enrolments are for genuine third-party clients, a partner may not put its own people through a course or sit them in without written consent, attendance confers no right to teach, a delegate register is kept for every engagement, and a twelve-month non-circumvention follows termination. A reseller sells the Services and is not granted a route to learn them."],
  ["1.21.0","2026-09-04","Training materials split into two classes, because the risk is not the same. Facilitator Materials \u2014 decks, facilitator guides, teaching notes, model answers, marking schemes, question banks \u2014 are accessed on the platform by named trainers, time-limited, never downloaded or held: that set is what would let a partner walk away and run the course. Learner Materials \u2014 workbook, exercises, handouts, datasets \u2014 may be printed by the partner for the delegates enrolled on a booked engagement, exactly as issued, with surplus and superseded copies destroyed. Schedule C carries a side-by-side table of the two rules."],
  ["1.20.0","2026-09-04","Four rules settled. Attribution: every delivery, listing, joining instruction and certificate is powered by and administered by Modelware, whatever the model, and certificates are issued by Modelware alone. Training materials are now accessed from the platform and never held \u2014 no downloading, printing or local storage, delegate copies issued by Modelware direct, trainer access named and time-limited, and nothing to hand back on exit because nothing was distributed. Partners are encouraged to write their own supplementary material for local law and examples, keep ownership of it and licence it back, provided it stays separate and never merges into ours. Translations are produced and owned by Modelware however they are funded. The IP Licence tier no longer trades on anonymity."],
  ["1.19.0","2026-09-04","Training material and accreditation locked down. Every agreement now carries a Training Materials clause \u2014 one controlled source, delivered exactly as issued, no editing, translating, re-branding or extracting, no exposure to any AI system or third-party repository, delegate copies only for a booked engagement, an audit right, and alteration as a non-remediable breach. A new Accreditation clause holds the DAMA International REP with Modelware: no partner may claim it, marks are used only as authorised, examination integrity is absolute, and conduct that puts the REP at risk suspends delivery immediately. Schedule C replaces the old localisation permission with a permitted / not permitted table and a DAMA REP section. Cross-references now resolve in a second pass, so a clause may point at one further down the agreement without printing a question mark."],
  ["1.18.1","2026-09-03","The Agreement Summary reported a Phase 1 end date, a set-up investment and a recoverable shortfall on a Training Reseller, which has none of those. It now shows the band price, the weeks and trips, the travel and payment terms, and says plainly that no inventory account applies."],
  ["1.18.0","2026-09-03","The five steps across the top now do their own step. Each carries its button \u2014 new partner, download the questionnaire, open their return, export the pack, push to the repository \u2014 and a step you cannot do yet is disabled with the reason on hover. The questionnaire also has a button in the header. It was previously only at the bottom of the left form, which is why nobody could find it."],
  ["1.17.0","2026-09-03","Team sync moved out of the bottom of the form and onto its own tab, laid out like the CRM panel: owner, repo, branch, your user id, folder, token, then Test connection, Connect and pull, Pull now and Push now with a synced stamp and links straight to the folder, the ledger and the register. Test connection reports what it can see without writing anything, the user id is stamped on every commit and every reference claim, and the tab carries a dot showing whether it is connected."],
  ["1.16.0","2026-09-03","Contract references can no longer be duplicated across partners. The repository now holds a reference ledger that every save claims against, written with the sha it was read at, so two people allocating at the same moment collide instead of both succeeding. The reference field says who else holds a number, Allocate next finds the first free one, the new-partner dialog opens with it, and Check references audits every partner on file."],
  ["1.15.0","2026-09-03","Fixed the price ladder not following the weeks forecast \u2014 only the money was being rewritten, so the applies marker, the dimming and the saving note stayed on the old band. The whole row is now rewritten. Added the payment plan: travel and accommodation in cleared funds before the trainer departs, course delivery within 14 days of each week, with the trip set out in the order money actually moves, in the form, in Schedule B and on the pricing sheet."],
  ["1.14.0","2026-09-03","Travel is now bought per trip, not per course week. One trip covers up to three consecutive weeks, which is the sweet spot and also the cap \u2014 a longer consecutive run for one trainer needs prior written agreement. Grouping eight weeks into three trips takes travel from 25,600 to 9,600 and lifts the year margin from 52,800 to 68,800. The form, Schedule B and the Volume Model sheet all show trips, and what grouping is worth."],
  ["1.13.0","2026-09-03","The volume model now runs a full year as well as a single course. A new Volume Model workbook sheet carries the per-course grids, the year table, annual margin by weeks against class size, and what Modelware collects in the same year \u2014 all live formulas off one input block. The form shows the year beside the course, and Schedule B carries the same year table."],
  ["1.12.0","2026-09-03","Reseller volume model: the week price does not move with class size, so cost per delegate falls as the class grows, and the annual band compounds with it. Publications and exam coupons are per delegate and do not scale down; travel is per course and does. The grid names the break-even class size and marks every row below it, in the form, in Schedule B and in the workbook."],
  ["1.11.0","2026-09-03","Fifth operating model: Training Reseller. The partner sources the engagement and buys delivery at a fixed price per course week, falling with annual volume. No initial fee, no royalty, no minimum and no inventory account — a price ladder and an engagement log instead, with its own agreement clauses, Schedule B pricing terms, intake questions and workbook sheet."],
  ["1.10.2","2026-08-31","Typing in a cost-line box no longer jumps the page to the top or scrambles the number: the totals update in place instead of rebuilding the form under the cursor."],
  ["1.10.1","2026-08-31","Cost lines redrawn: name and total on one line, three captioned boxes beneath, and the duplicated basis text removed. Nothing is squeezed in the narrow pane any more."],
  ["1.10.0","2026-08-31","Every inventory line is now quantity x unit price x rate, so a course reads as delegates x price per delegate x 25%. Two delegates at 1,300 gives a royalty of 650."],
  ["1.9.0","2026-08-31","Inventory account now works in quantity and unit price, with every amount calculated. Lines are marked Budget or Actual, and a budget line stops counting the moment an actual is logged for the same category, so the course royalty can start from the budget and be replaced course by course."],
  ["1.8.0","2026-08-31","Authorised Delivery Partner reworked: no initial fee, no minimum annual royalty, and six named cost lines feeding the inventory account. Course royalty excludes DMBOK and CDMP exam coupons, the CDMP line switches off where the partner is already a Master, and Schedule B carries its own fee schedule."],
  ["1.7.0","2026-08-31","Finding a partner made easy: connecting lands on the list, records missing from the register are read straight from the repository, and the list can be searched and filtered by stage and model. Contracts and the full pack download from the row itself, without leaving the list."],
  ["1.6.1","2026-08-31","Fixed ampersands rendering as an escaped entity in the inventory account labels, and widened the pre-delivery check to catch any escaped entity in visible text, field values, placeholders and tooltips."],
  ["1.6.0","2026-08-31","Inventory account: both sides' set-up costs tracked in a live ledger that closes on full recovery or the Phase 1 end date, whichever comes first, with any shortfall recoverable from the partner under a new agreement clause and Schedule B section."],
  ["1.5.6","2026-08-31","A typed country can no longer be lost: Enter, the Add button, a comma or simply clicking away all commit it."],
  ["1.5.5","2026-08-31","Every value on every screen and every table is left-aligned. No exceptions."],
  ["1.5.3","2026-08-31","Readable tables: the Partner Register shows as a field-and-value record instead of forty squeezed columns, headings never break mid-word, and wide sheets scroll inside their own box."],
  ["1.5.2","2026-08-31","Layout tightened: tables size to their content instead of stretching, and nothing forces the page to scroll sideways."],
  ["1.5.1","2026-08-31","Fixed escape sequences that were showing as literal text in the questionnaire's due diligence and compliance questions."],
  ["1.5.0","2026-08-31","Flow made explicit: a New partner starting point, a five-step strip on every screen, a Pipeline tab grouping every partner by stage, questionnaires that state the model being offered and adapt their questions to it, and returns that merge into the matching record instead of duplicating it."],
  ["1.4.1","2026-08-31","The onboarding questionnaire now exports as partner_intake_v<version>.html, so the file itself says which question set it is."],
  ["1.4.0","2026-08-31","Fixed the connection failure: an unsupported request header made every GitHub call fail CORS before it was sent. Added a Folder in repo field so partner data can share a repository with other apps."],
  ["1.3.0","2026-08-31","Onboarding: a standalone questionnaire the candidate fills in offline and returns as JSON that loads straight into the builder, plus an Onboarding checklist sheet with dates calculated from the agreement."],
  ["1.2.0","2026-08-31","Version number and SAST build stamp shown in the app and carried into every contract, workbook, pack and repository record."],
  ["1.1.0","2026-08-31","Private GitHub sync: Repository tab, one JSON record per partner, generated register.json and README.md, sha-guarded writes."],
  ["1.0.0","2026-08-31","First build: four operating models, eight contract documents in .docx and .pdf, five-sheet partner account workbook, offline export engines."]
];
/* South Africa is UTC+02:00 year round — no daylight saving, so a fixed shift is correct. */
function sastNow(){
  var t=new Date(Date.now()+2*3600000).toISOString();
  return t.slice(0,10)+" "+t.slice(11,16)+" SAST";
}
function versionLine(){ return "v"+APP_VERSION+" · built "+APP_BUILD; }
function buildStamp(){ return APP_NAME+" v"+APP_VERSION+" · build "+APP_BUILD+" · generated "+sastNow(); }

   here on load, and the app says so rather than silently changing the deal.

<script>

  return Number(n).toFixed(dp).replace(/\B(?=(\d{3})+(?!\d))/g,","); }
function money(cur,n,dp){ return cur+" "+num(n,dp===undefined?0:dp); }

function words(n){ var w=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
  return (n>=0&&n<=12)?w[n]:String(n); }
function esc(s){ return String(s===null||s===undefined?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fb(v,ph){ return (v===null||v===undefined||String(v).trim()==="") ? ("["+ph+"]") : String(v).trim(); }

function phase1EndComputed(d){

function phase1DateInvalid(d){
  var t=(d.inventory&&d.inventory.phase1EndDate)||"";

}
function lineApplies(d,l){

  return true;
}

function lineQty(d,l){ return Number(l.qty)||0; }
function lineUnit(d,l){ return Number(l.rate)||0; }
function linePct(d,l){ return (l.pct===undefined||l.pct===null||l.pct==="") ? 100 : (Number(l.pct)||0); }

function lineBasis(d,l){

function invLines(d){

}
function invTotal(d,side){

/* ---------------------------------------------------- reseller price ladder
   A band is matched on weeks delivered in the contract year, not on weeks
   committed in advance. bandFor(0) returns the first band so an empty forecast
   still prices at the standard rate rather than at nothing. */
function resBands(d){
  var r=(d&&d.reseller)||{};
  var bs=(r.bands||[]).slice().filter(function(b){ return Number(b.from)>0; });
  bs.sort(function(a,b){ return Number(a.from)-Number(b.from); });
  return bs;
}
function bandLabel(b){
  var f=Number(b.from)||0, t=Number(b.to)||0;
  if(!t) return f+" weeks or more";
  if(t===f) return f+(f===1?" week":" weeks");
  return f+" to "+t+" weeks";
}
function bandFor(d,weeks){
  var bs=resBands(d), w=Number(weeks)||0, hit=null;
  for(var i=0;i<bs.length;i++){
    var f=Number(bs[i].from)||0, t=Number(bs[i].to)||0;
    if(w>=f && (!t || w<=t)) hit=bs[i];

  return hit || bs[0] || {from:1,to:0,price:(d.reseller&&d.reseller.basePrice)||0};
}
function resPrice(d,weeks){ return Number(bandFor(d,weeks).price)||0; }
function resBase(d){ return Number((d.reseller||{}).basePrice)||0; }
function resSaving(d,weeks){ return resBase(d)-resPrice(d,weeks); }
function resWeeks(d){ return Number((d.reseller||{}).forecastWeeks)||0; }

function resTravel(d){ return tripsFor(d,resWeeks(d))*travelUnit(d); }
function resInvoiced(d){ return resDelivery(d)+resTravel(d); }

  var cur=d.commercial.currency, w=resWeeks(d), hit=bandFor(d,w);
  return resBands(d).map(function(b){
    var sav=resBase(d)-(Number(b.price)||0);

/* -------------------------------------------------- class-size volume model

function resPaxSteps(d){
  var r=(d&&d.reseller)||{}, v;
  if(typeof r.paxStepsText==="string") v=r.paxStepsText.split(/[,;\s]+/);
  else v=r.paxSteps||[];              /* records saved before 1.12 */
  v=v.map(Number).filter(function(n){ return n>0; });
  v.sort(function(a,b){ return a-b; });

/* Publications and examination coupons are bought by the delegate or the

function resExtrasPerPax(d){ return 0; }
/* One trip covers up to tripWeeks consecutive course weeks. Unclustered, every
   week is its own trip and its own airfare. */
function tripWeeks(d){ return Math.max(1, Number((d.reseller||{}).tripWeeks)||1); }
function isClustered(d){ return !!(d.reseller||{}).clustered; }
function travelUnit(d){ return Number((d.reseller||{}).travelEstimate)||0; }
function tripsFor(d,weeks){
  var w=Number(weeks)||0;
  if(w<=0) return 0;
  return isClustered(d) ? Math.ceil(w/tripWeeks(d)) : w;
}
/* What one course week carries of a trip's travel. */
function travelPerWeek(d){ return travelUnit(d)/(isClustered(d)?tripWeeks(d):1); }
function resPerPax(d,weeks,pax){ return pax>0 ? resPrice(d,weeks)/pax : 0; }
function resTruePerPax(d,weeks,pax){
  return pax>0 ? resPerPax(d,weeks,pax)+resExtrasPerPax(d)+(travelPerWeek(d)/pax) : 0;
}
function resSavingPerPax(d,weeks,pax){ return resMarket(d)-resTruePerPax(d,weeks,pax); }

function resBreakEven(d,weeks){

function resPaymentSchedule(d){

function resWeeksToNextBand(d,weeks){

/* The revenue limb of the accrual stop. Where no trigger is set, the Phase 1
   End Date is the only stop, and the clause must say so rather than printing a
   zero threshold that is met on day one. */
function invRevTrigger(d){ return Number(d.inventory&&d.inventory.revTrigger)||0; }
function invTriggerPax(d){ return Number(d.inventory&&d.inventory.triggerDelegates)||0; }
/* The Viability Trigger has two limbs and either one satisfies it. The booking
   limb is the one a partner can see coming: fill a course and you have shown
   the business works. The cumulative-revenue limb is optional. */
function invTriggerLimbs(d){
  var out=[], px=invTriggerPax(d), t=invRevTrigger(d);
  if(px>0) out.push("the "+roleName(d.modelKey)+" confirms a single engagement of "+words(px)+" ("+px+") or more Delegates");
  if(t>0) out.push(String(d.inventory.revTriggerBasis||"cumulative Gross Revenue since commencement").charAt(0).toLowerCase()+
                   String(d.inventory.revTriggerBasis||"cumulative Gross Revenue since commencement").slice(1)+
                   " first equals or exceeds "+money(d.commercial.currency,t));
  return out;
}
/* Reads after "is met on ". */
function invTriggerText(d){
  var L=invTriggerLimbs(d), R=roleName(d.modelKey);
  if(!L.length) return "the date on which the Parties agree in writing that the "+R+" is trading at a level that can carry the costs";
  if(L.length===1) return "the date on which "+L[0];
  return "the earlier of the date on which "+L[0]+" and the date on which "+L[1];
}
function invTriggerShort(d){
  var px=invTriggerPax(d), t=invRevTrigger(d), bits=[];
  if(px>0) bits.push("a booking of "+px+"+ delegates");
  if(t>0) bits.push("cumulative revenue of "+money(d.commercial.currency,t));
  return bits.length?bits.join(", or "):"by written agreement";
}

  var tn=0; function cl6(x){ tn++; b.push(p(cn("attr")+"."+tn+" "+x)); }
  cl6("Every delivery of the Services carries the Attribution. The Services are presented as powered by and administered by "+F.brand+", in the form and placement set out in Schedule C, and that presentation does not change with the operating model, the territory or the "+R+"'s own branding.");

  cl3("The "+R+" will not upload, submit or expose the Training Materials to any artificial intelligence system, model, agent or service, or to any repository, learning platform, file-sharing service or content library other than the Platform, whether for training, indexing, summarising, translating or any other purpose.");
  cl3("Materials issued to a delegate are for that delegate\u2019s own learning. The "+R+" will impose that restriction in writing before they are issued, and will not permit recording, streaming or photography of a delivery without the "+O+"'s prior written consent.");
  cl3("Updates are published to the Platform with a version number and an effective date, and take effect for engagements delivered after that date.");
  cl3("The "+O+" may audit the "+R+"'s compliance with this clause on reasonable notice, including Platform access logs, the devices and systems used for delivery, and the "+R+"'s records of what was printed and issued to whom. The "+R+" will give reasonable access and assistance.");
  cl3("A breach of "+cx("mat",2)+", "+cx("mat",3)+", "+cx("mat",8)+", "+cx("mat",11)+" or "+cx("mat",13)+" is a material breach that is not capable of remedy for the purposes of "+cx("term2")+", and the "+O+" may suspend Platform access immediately on written notice pending investigation.");

  sec("learn","Who may learn, and what learning does not confer");
  var ln=0; function cl7(x){ ln++; b.push(p(cn("learn")+"."+ln+" "+x)); }
  cl7("Enrolments are for genuine third-party clients: every person enrolled must be a Delegate. The "+R+" will not enrol, or procure the enrolment of, its own directors, employees, contractors, agents or affiliates, or any person acting on its behalf, as a delegate on any engagement, and will not permit any such person to attend, observe, sit in on or receive a recording of a delivery, without the "+O+"'s prior written consent.");
  cl7("The "+O+" will not withhold that consent unreasonably where the purpose is genuine capability building, and may attach conditions. Consent is given in writing, names the individuals, and is recorded by the "+O+".");
  cl7("A person admitted under "+cx("learn",2)+" is treated as a Delegate for that engagement and attends for their own learning only. They acquire no right to access the Facilitator Materials, to teach the course, to train others, or to assist in doing so, and the "+R+" acquires no such right through them.");
  cl7("Attending a delivery, completing a course, or holding a certificate confers no right to teach the Services. The right to deliver arises only under this Agreement, and only where the "+R+" holds the operating model that permits delivery and the trainer is certified under Schedule D.");
  cl7("During the Term and for twelve (12) months afterwards, the "+R+" will not use the Training Materials, or knowledge of them gained through attendance, access or delivery, to develop, deliver, market, assist or endorse any training course that is substantially derived from or substitutable for the Services. This clause survives termination and applies to any person the "+R+" caused to attend.");
  cl7("The "+R+" will keep a delegate register for every engagement, recording each Delegate's name, employer and email, will make it available to the "+O+" on request, and warrants that every person on it is a Delegate.");
  cl7("The "+R+" needs to understand the Services in order to sell them, and this clause is not intended to prevent that. The "+O+" will, on request and at no charge, run a Sales Enablement Session for the "+R+"'s commercial staff: a commercial briefing on course scope, outcomes, audience, positioning and objections. It is delivered from sales collateral only. No Facilitator Materials, no Learner Materials, no workbook, no exercise, no assessment and no recording of a delivery form part of it, no certificate is issued, and attendance is not attendance at a course for the purposes of "+cx("learn",1)+".");
  cl7("A Sales Enablement Session is the route by which the "+R+"'s own people learn about the Services. It is not a route by which they learn the Services, and "+cx("learn",4)+" applies to anyone who attends one.");
  cl7("A breach of "+cx("learn",1)+" or "+cx("learn",5)+" is a material breach that is not capable of remedy for the purposes of "+cx("term2")+".");

  sec("supp","Supplementary Material and translation");
  var sn=0; function cl5(x){ sn++; b.push(p(cn("supp")+"."+sn+" "+x)); }
  cl5("The "+R+" is encouraged to create Supplementary Material addressing local law, local regulation, local market practice and local worked examples, and to deliver it alongside the Training Materials. Local relevance is a benefit to delegates and the "+O+" supports it.");
  cl5("Supplementary Material is separate from the Training Materials. It is presented as the "+R+"'s own, clearly distinguished from the "+O+"'s material, and is not merged into, inserted within, or presented as part of the Training Materials.");
  cl5("Supplementary Material may not contradict, replace or dilute the Training Materials, may not alter the learning outcomes, the module sequence or any assessment, and may not be used to deliver a shortened or substituted version of a course.");
  cl5("Supplementary Material is submitted to the "+O+" before first use and is deemed accepted if the "+O+" does not object within ten (10) business days. The "+O+" may object where the material is inaccurate, conflicts with the Training Materials, or would put the Accreditation at risk, and may require its withdrawal at any time on the same grounds.");
  cl5("The "+R+" owns the Supplementary Material it creates independently, and warrants that it has the right to use it. Ownership stays with the "+R+" throughout, and nothing in this Agreement transfers it. Any material that reproduces, adapts or incorporates any part of the Training Materials is not Supplementary Material; it is a derivative work and "+cx("ip",2)+" applies to it.");
  cl5("The "+R+" may contribute Supplementary Material to the Contributed Material Library, which the "+O+" maintains and offers to other partners in the programme. Contribution is voluntary and is made by written notice identifying the material. The "+R+" may withdraw material from the Library on ninety (90) days' written notice, which takes effect for engagements booked after the notice expires.");
  cl5("Where another partner uses contributed material in a delivery, that partner pays the "+R+" a contribution fee of "+contribFeeText(d)+", collected by the "+O+" with its own fees and paid over to the "+R+" within "+d.commercial.paymentDays+" days of receipt, with a statement identifying each delivery. The "+O+" takes no share of the contribution fee and no commission on it.");
  cl5("The "+R+" grants the "+O+" a non-exclusive, worldwide licence to hold contributed material in the Library, to show it to other partners for the purpose of deciding whether to use it, and to sub-licence it to a partner that agrees to pay the contribution fee. The licence carries attribution to the "+R+" as the author wherever the material is used. The "+O+" may itself use contributed material in its own direct deliveries on the same terms and at the same fee.");
  cl5("The "+R+" may use material contributed by another partner on the same terms, and is bound to pay that partner's contribution fee for each delivery in which it is used. The "+O+" is not liable for the accuracy of material contributed by another partner, and the contributing partner warrants its accuracy and its right to licence it.");
  cl5("Translation of the Training Materials is carried out by the "+O+" or by a translator it appoints. Where the "+R+" identifies a need, it asks the "+O+", which may produce a translation at its discretion. Every translation, however commissioned, funded or produced, is the property of the "+O+", is published to the Platform, and is subject to this Agreement in the same way as the material it translates. The "+R+" acquires no right in a translation by paying for it or by contributing to it.");

  sec("accred","Accreditation and the DAMA International REP");
  var an=0; function cl4(x){ an++; b.push(p(cn("accred")+"."+an+" "+x)); }
  cl4("The Accreditation is held by the "+O+" and not by the "+R+". Nothing in this Agreement grants the "+R+" any accreditation, registration or endorsement of its own, and none is implied by the appointment.");
  cl4("The "+R+" will not state or imply that it is a DAMA International Registered Education Provider, that it is accredited, endorsed, certified or approved by DAMA International or any chapter, or that it holds any status it does not hold. Where the Services are delivered under the "+O+"'s Accreditation, the "+R+" will describe the position accurately and in the form the "+O+" supplies.");
  cl4("The "+R+" will not use the DAMA International name, the DAMA REP mark, chapter names or any related logo except in the exact form and context the "+O+" authorises in writing, and will discontinue any such use immediately on request.");
  cl4("The "+R+" will comply with the requirements of the Accreditation as notified to it from time to time, including trainer qualification, delivery hours, attendance records, assessment integrity and reporting. The "+O+" will notify the "+R+" of those requirements and of any change to them.");
  cl4("Examination vouchers and coupons are supplied for named delegates of a booked engagement only. The "+R+" will not resell, transfer or stockpile them, and will not assist, procure or condone any conduct that compromises the integrity of an examination, including disclosure of examination content or answers.");
  cl4("The "+R+" will notify the "+O+" within two (2) business days of anything that could reasonably affect the Accreditation, including a complaint to an accreditation body, a challenge to a certification issued, a regulatory contact, or any suspected breach of examination integrity.");
  cl4("Because the Accreditation is held for the benefit of every partner and every delegate, conduct by the "+R+" that places it at risk entitles the "+O+" to suspend delivery rights immediately on written notice, and to terminate under "+cx("term2")+" where the risk is not resolved to the "+O+"'s reasonable satisfaction.");
  cl4("The "+O+" will maintain the Accreditation in good standing for the Term so far as it is within its control, and will tell the "+R+" promptly if the Accreditation is suspended, withdrawn or materially changed.");

  sec("conf","Confidentiality");
  b.push(p(cn("conf")+".1 Each Party will keep the other's confidential information secret, use it only for the purposes of this Agreement, and disclose it only to personnel who need it and who are bound by equivalent obligations. The Mutual Non-Disclosure Agreement executed between the Parties applies to this Agreement and survives its termination for five (5) years."));

  sec("dp","Data protection and AI ethics");
  b.push(p(cn("dp")+".1 Each Party will comply with "+GOVERNING_LAW.dataAct+" and with any data protection law applicable in the Territory. Where the "+R+" processes personal information on behalf of the "+O+", it does so only on documented instructions and subject to the Data Protection and AI Ethics Addendum."));
  b.push(p(cn("dp")+".2 The "+R+" will apply the "+F.brand+" AI ethics standards when using artificial intelligence in the preparation or delivery of Services, including disclosure of AI-assisted content, human review of AI output used with clients, and prohibition of client personal information in public AI tools."));

  sec("liab","Warranties, liability and insurance");
  b.push(p(cn("liab")+".1 Each Party warrants that it has the authority to enter into this Agreement and that it will comply with all laws applicable to its performance."));
  b.push(p(cn("liab")+".2 Neither Party is liable to the other for indirect or consequential loss, or for loss of profit, revenue, anticipated saving or goodwill, however arising."));
  b.push(p(cn("liab")+".3 Save for liability that cannot lawfully be limited, and save for breach of clauses "+cn("ip")+", "+cn("conf")+" or "+cn("dp")+" or the "+R+"'s payment obligations, each Party's total liability in any twelve month period is limited to the total fees paid or payable by the "+R+" to the "+O+" in that period."));
  b.push(p(cn("liab")+".4 The "+R+" will maintain, with a reputable insurer, professional indemnity insurance and public liability insurance, each appropriate to the Services and the Territory, and each of not less than the limits notified by the "+O+" from time to time and set out in Schedule D. The "+R+" will provide evidence of cover on request and on each renewal, and will notify the "+O+" if cover lapses or is materially reduced."));
  b.push(p(cn("liab")+".5 The "+R+" indemnifies the "+O+" against claims arising from the "+R+"'s delivery of Services, its misuse of the Brand or Courseware, or its breach of "+cx("dp")+"."));

  sec("term2","Termination");
  b.push(p(cn("term2")+".1 Either Party may terminate on "+d.term.terminationNoticeMonths+" months' written notice where the other commits a material breach and fails to remedy it within "+d.term.cureDays+" days of written notice specifying the breach."));
  b.push(p(cn("term2")+".2 The "+O+" may terminate immediately on written notice where the "+R+": (a) misrepresents its credentials, accreditation or relationship with the "+O+", or holds itself out as accredited when it is not; (b) commits a serious breach of the Brand, IP or confidentiality obligations; (c) alters the Training Materials, keeps or makes its own copy of the Facilitator Materials, reproduces the Learner Materials beyond the delegates enrolled, delivers materials not obtained from the Platform, or exposes the Training Materials to an artificial intelligence system or third-party repository; (c-bis) removes or obscures the Attribution, or presents the Services as its own product or certification; (c-ter) enrols or admits its own people without consent, or reconstructs the Facilitator Materials from any source; (d) places the Accreditation at risk, or compromises the integrity of an examination; (e) suffers an insolvency event; (f) is convicted of, or credibly implicated in, conduct involving dishonesty, bribery or a serious ethics breach; or (g) fails a hard gate under Schedule E after a documented remediation period."));
  b.push(p(cn("term2")+".3 Persistent underperformance that does not amount to material breach is dealt with first by a written remediation plan of not less than ninety (90) days, then by conversion to non-exclusive status or Territory reduction, and only then by termination."));

  sec("conseq","Consequences of termination");
  b.push(ol([
    "The "+R+" ceases all use of the Brand, the Courseware and the systems immediately, and removes the Brand from all premises, websites, profiles and materials within thirty (30) days.",
    "Platform access ends immediately. The "+R+" destroys every remaining copy of the Learner Materials, including print files and surplus printed stock, and a director certifies in writing within thirty (30) days that the "+R+" holds no copy of the Facilitator Materials in any form, that all Learner Materials have been destroyed, and that all confidential information has been irretrievably deleted from every device, system, backup and third-party service.",
    "The "+R+" may continue to use its own Supplementary Material, which remains its property, provided it contains no part of the Training Materials and carries no Attribution, Brand or reference to the "+O+" or to the Accreditation.",
    "The "+R+" ceases every reference to the "+O+"'s Accreditation and to DAMA International, and removes the DAMA REP mark from all materials, sites and profiles within thirty (30) days.",
    "All accrued fees, royalties and reports become immediately due.",
    "The "+R+" completes any training course or client engagement already contracted and paid for, under the "+O+"'s supervision, or transfers it to the "+O+" or a nominated partner with the client's consent, so that no client is prejudiced.",
    "The "+R+" hands over the client and learner records relating to the Territory that are necessary for continuity, subject to applicable data protection law.",
    "The "+R+" will not, for twelve (12) months after termination, deliver training or advisory services in the Territory that are substantially derived from the Courseware."
  ]));

  sec("law","Governing law and disputes");
  b.push(p(cn("law")+".1 This Agreement, and any dispute arising out of or in connection with it, is governed by "+GOVERNING_LAW.law+", regardless of the location of the Territory or of the Parties."));
  b.push(p(cn("law")+".2 The Parties will first attempt to resolve any dispute by good faith discussion between senior representatives within thirty (30) days of written notice of the dispute."));
  b.push(p(cn("law")+".3 Failing resolution, the dispute is referred to arbitration under the rules of "+GOVERNING_LAW.arbitration+", by one arbitrator, seated in "+GOVERNING_LAW.seat+", conducted in English. The award is final and binding, and may be enforced in any court of competent jurisdiction."));
  b.push(p(cn("law")+".4 Nothing in this clause prevents either Party from seeking urgent interim relief from "+GOVERNING_LAW.courts+" or from any court with jurisdiction over the other Party or its assets, in particular to protect the Brand or confidential information."));
  b.push(p(cn("law")+".5 The "+R+" acknowledges that mandatory provisions of the law of the Territory may apply irrespective of "+cx("law",1)+", and the Parties will negotiate in good faith any amendment required for compliance without altering the commercial balance of this Agreement."));

  sec("gen","General");
  b.push(p(cn("gen")+".1 This Agreement, together with its Schedules, the Mutual Non-Disclosure Agreement and the Data Protection and AI Ethics Addendum, is the entire agreement between the Parties and supersedes all prior discussions, term sheets and letters of intent."));
  b.push(p(cn("gen")+".2 No amendment is effective unless in writing and signed by both Parties. No waiver of a breach waives any later breach."));
  b.push(p(cn("gen")+".3 The "+R+" may not cede, assign or delegate any right or obligation without the "+O+"'s prior written consent. The "+O+" may assign this Agreement to a group company or to a purchaser of its business."));
  b.push(p(cn("gen")+".4 If any provision is held invalid or unenforceable, it is severed and the remainder continues in force."));
  b.push(p(cn("gen")+".5 Notices are given in writing to the addresses and email addresses in the preamble, quote the Agreement Reference, and are deemed received on delivery or, for email, on the next business day after transmission."));
  b.push(p(cn("gen")+".6 This Agreement may be signed in counterparts and by electronic signature, each of which is an original."));
  b.push(sig(d));
  docs.push({id:"AGREEMENT", code:"01", title:M.agreementTitle,
             subtitle:refBase+" — "+partyName(d)+" — "+terr, stamp:buildStamp(), blocks:xrefResolve(b)});

  /* ====================================================== SCHEDULE A */
  b=[];
  b.push(h1("SCHEDULE A — TERRITORY, EXCLUSIVITY AND CHANNELS"));
  b.push(p("This Schedule forms part of the "+M.agreementTitle+" bearing reference "+refBase+" between "+F.legalName+" and "+partyName(d)+"."));
  b.push(h2("A1. Territory"));
  b.push(tbl(["Item","Detail"],[
    ["Territory", terr],
    ["Countries in scope", d.territory.countries.length? d.territory.countries.join(", ") : "[list countries]"],
    ["Basis of appointment", d.territory.exclusivity],
    ["Sub-licensing / sub-partners", M.flags.subLicence ? "Permitted under "+cx("appoint",3)+", subject to approval of the sub-agreement template" : "Not permitted without prior written consent"],
    ["Authorised channels", fb(d.territory.channels,"channels")],
    ["Operating model", M.name]
  ]));
  b.push(h2("A2. Scope of the appointment"));
  b.push(p("A2.1 The "+R+" is appointed on a "+d.territory.exclusivity.toLowerCase()+" basis for the Territory. The "+R+" may market and deliver the Services only to clients whose place of business or delivery location is within the Territory, except with the "+O+"'s prior written consent."));
  b.push(p("A2.2 Online and virtual delivery is permitted where the learners are located in the Territory. Public open-cohort courses that are marketed beyond the Territory require prior written consent and may carry a revenue split with the affected partner."));
  b.push(p("A2.3 Enterprise clients headquartered outside the Territory but with operations inside it are handled as house accounts: the "+O+" coordinates the relationship and allocates delivery and revenue between partners in writing before the engagement starts."));
  if(d.territory.exclusivity==="Exclusive"){
    b.push(h2("A3. Conditions attaching to exclusivity"));
    b.push(p("A3.1 Exclusivity is granted in consideration of the minimum performance thresholds in Schedule E and is reviewed at each hard gate."));
    b.push(p("A3.2 The "+O+" retains the right, at all times and without breaching exclusivity, to: (a) supply its own existing global accounts; (b) sell digital or self-paced products directly; (c) deliver certification examinations and accreditation services; and (d) publish, market and sell its own content in the Territory."));
    b.push(p("A3.3 Where the "+R+" misses a minimum threshold for two consecutive review periods, the "+O+" may convert the appointment to non-exclusive, reduce the Territory, or open a defined segment to another partner, on thirty (30) days' written notice."));
  } else {
    b.push(h2("A3. Non-exclusive appointment"));
    b.push(p("A3.1 The appointment is non-exclusive. The "+O+" may appoint other partners in the Territory and may itself market and deliver the Services there."));
    b.push(p("A3.2 The "+R+" may apply for exclusivity in a defined segment or sub-territory once it has met the Year 1 targets in Schedule E; any grant of exclusivity requires a written addendum."));
  }
  b.push(h2("A"+(d.territory.exclusivity==="Exclusive"?"4":"4")+". Territory development"));
  b.push(p("A4.1 The "+R+" will maintain a rolling twelve month territory plan covering target segments, planned public course calendar, marketing activity and capacity, and will review it with the "+O+" at each checkpoint in Schedule E."));
  b.push(p("A4.2 Any expansion of the Territory, addition of a country, or grant of multi-site rights requires a written addendum signed by both Parties and may carry an additional fee."));
  docs.push({id:"SCH-A", code:"02", title:"Schedule A — Territory, Exclusivity and Channels", subtitle:refBase+" — "+partyName(d), stamp:buildStamp(), blocks:xrefResolve(b)});

  /* ====================================================== SCHEDULE B */
  b=[];
  b.push(h1("SCHEDULE B — COMMERCIAL TERMS"));
  b.push(p("This Schedule forms part of the "+M.agreementTitle+" bearing reference "+refBase+"."));
  if(d.modelKey==="RESELLER"){
    var RS=d.reseller||{}, w=resWeeks(d), bnd=bandFor(d,w);
    b.push(h2("B1. Price per course week"));
    b.push(p("No initial fee, no royalty, no marketing contribution and no minimum annual commitment are payable. The "+R+" buys delivery from the "+O+" at a fixed price for each course week, and sells to its own clients at prices of its own choosing."));
    b.push(tbl(["Course weeks in a contract year","Price per week","Saving against the standard price","Applies"], resLadderRows(d)));
    b.push(p("A course week is five consecutive delivery days, or such other duration as the parties agree in writing for a particular engagement, priced pro rata."));
    b.push(h2("B2. Class size and what a delegate costs"));
    b.push(p("The price in B1 is for the course week and does not change with the number of delegates. The cost of a delegate to the "+R+" is therefore the week price divided by the class, plus the per-delegate items in B3 and a share of the travel in B5. There is no upper limit on the reduction, and no minimum class size."));
    b.push(p("The table below is illustrative at the band in force and the travel estimate in B5. The "+O+" makes no representation about what the "+R+" can charge its own clients; the market price column is the "+R+"'s own assumption."));
    b.push(tbl(["Delegates","Delivery per delegate","True cost per delegate","Assumed market price","Margin per delegate","Margin on the course","Note"], resVolumeRows(d)));
    b.push(note("At the band and travel estimate shown, a course must carry at least "+resBreakEven(d,resWeeks(d))+" delegates before it makes the "+R+" any money at the assumed market price. Smaller classes are permitted, and remain the "+R+"'s commercial decision."));
    b.push(h2("B2.3 Over a contract year"));
    b.push(p("At "+num(resPaxPlan(d))+" delegates a course, and on the assumptions above, a contract year works out as follows. Weeks delivered set the band, so the rate improves as the year fills."));
    b.push(tbl(["Course weeks","Price per week","Delegates","Client revenue","Delivery","Travel","Per-delegate items","Total cost","Margin","Margin %","Note"], resYearRows(d)));
    b.push(note("Client revenue and margin depend on the "+R+"'s own price to its clients, which the "+O+" neither sets nor sees. The columns the "+O+" is party to are Price per week, Delivery and Travel."));
    b.push(h2("B3. Publications and examination coupons"));
    b.push(p("These are not bought from the "+O+" and are not part of the price per course week. The "+R+" or the delegate procures them direct."));
    b.push(tbl(["Item","Bought from","Basis"],[
      ["DMBOK and other DAMA publications", "DAMA International or the publisher, direct", "The "+R+" or the delegate buys direct, at the published price. The "+O+" neither supplies nor invoices them and adds no handling charge."],
      ["CDMP examination coupons", "DAMA International, direct", "Bought direct by the "+R+" or the delegate. The "+O+" will confirm what a course requires and how to order, but is not a party to the purchase."],
      ["What this means for the price", "\u2014", "The price per course week in B1 is the whole of what the "+R+" pays the "+O+" for delivery. Nothing is added per delegate."]
    ]));
    b.push(h2("B4. What the price includes"));
    b.push(tbl(["Included","Not included"],[
      ["One trainer for the course week, nominated by the "+O, "Travel, accommodation and subsistence for the trainer"],
      ["Courseware, delegate materials and certificates", "Venue, catering, equipment and local logistics"],
      ["Delegate registration and results administration", "DMBOK publications and CDMP examination coupons \u2014 bought direct from DAMA International or the publisher, see B3"],
      ["Content updates current at the date of delivery", "Local marketing, lead generation and client entertainment"],
      ["Trainer preparation and post-course reporting", "Visas, permits, inoculations and any Territory-specific compliance cost"]
    ]));
    b.push(h2("B5. Travel and accommodation"));
    b.push(p("Travel is bought per trip, not per course week. One trip covers up to "+words(tripWeeks(d))+" ("+tripWeeks(d)+") consecutive course weeks, and consecutive scheduling is the single largest saving available to the "+R+" on this Agreement."));
    b.push(tbl(["Item","Term"],[
      ["Basis", fb(RS.travelBasis,"At cost, with receipts, per trip")],
      ["Planning estimate", money(cur,RS.travelEstimate)+" per trip"],
      ["Weeks covered by one trip", "Up to "+tripWeeks(d)+", where they run consecutively"],
      ["Effective cost per course week when consecutive", money(cur,travelPerWeek(d))],
      ["Maximum consecutive weeks for one trainer", tripWeeks(d)+". A longer consecutive run requires the "+O+"'s prior written agreement, which will not be unreasonably withheld but may require a second trainer or a rest week."],
      ["Confirmed", "Quoted per engagement once the venue and the trainer's departure point are known"],
      ["Evidence", "Receipts or supplier invoices accompany every recharge; no margin or handling uplift is added"],
      ["Approval", "Any recharge more than 20% above the confirmed quote requires the "+R+"'s prior written approval"],
      ["Non-consecutive weeks", "Each separate visit is a separate trip and carries its own travel"]
    ]));
    b.push(h2("B5.1 What consecutive scheduling is worth"));
    b.push(p("The table shows the same year scheduled two ways: courses grouped into trips of up to "+tripWeeks(d)+" consecutive weeks, against every week flown separately."));
    b.push(tbl(["Course weeks","Trips when grouped","Travel when grouped","Trips when separate","Travel when separate","Saved by grouping"], resTripRows(d)));
    b.push(note("The cap exists for the trainer, not for pricing: more than "+tripWeeks(d)+" consecutive weeks away degrades delivery quality. It is a scheduling constraint agreed in advance, not a discount that keeps improving with length."));
    b.push(note("The planning estimate is for budgeting only. Actual travel depends on where the nominated trainer flies from and is not a fixed price."));
    b.push(h2("B6. How the band is set"));
    b.push(ol([
      "The band is determined by course weeks actually delivered in the contract year, not by weeks forecast or committed.",
      "Engagements are invoiced during the year at the band applicable to weeks delivered to date.",
      fb(RS.trueUp,"Annually, on course weeks actually delivered in the contract year")+". The true-up runs in both directions and is settled within "+d.commercial.paymentDays+" days of year end.",
      "Where weeks actually delivered reach a better band than the one invoiced during the year, the "+O+" issues a credit note for the difference.",
      "Where weeks actually delivered fall short of the band invoiced during the year, the "+O+" invoices the difference between the amounts charged and the amounts that the actual band would have produced. The "+R+" is charged for what it delivered, not for what it forecast.",
      "Only one reconciliation is run for a contract year, on delivered weeks, and it is the final determination of the band for that year.",
      "Weeks delivered by the "+R+"'s own certified trainers under B7 do not count towards the band."
    ]));
    b.push(h2("B7. Payment plan"));
    b.push(p("There are two streams, and they are paid at different times. Travel is committed before anyone flies, so it is paid before departure. Delivery is earned week by week, so it is paid within "+words(payDeliveryDays(d))+" ("+payDeliveryDays(d)+") days of each week."));
    b.push(tbl(["Stream","Basis","Invoiced","Payable","Amount","Notes"], resPaymentRows(d)));
    b.push(h2("B7.1 A trip, in order"));
    b.push(p("The sequence below is a single trip of up to "+tripWeeks(d)+" consecutive course weeks at the band currently in force."));
    b.push(tbl(["When","What","Amount","Terms"], resPaymentSchedule(d)));
    b.push(note("No trainer departs against an unpaid travel invoice. That is not a credit judgement about the "+R+" — it is that the "+O+" cannot recover a cancelled airfare."));
    b.push(h2("B7.2 Ordering and general payment terms"));
    b.push(tbl(["Item","Term"],[
      ["Booking", "Confirmed in writing at least 30 days before the first delivery day, subject to trainer availability"],
      ["Delivery invoice", fb((d.reseller||{}).deliveryInvoice,"On completion of each course week")],
      ["Delivery payable", "Within "+payDeliveryDays(d)+" days of invoice"],
      ["Travel invoice", "When the trip is confirmed"],
      ["Travel payable", payTravelBefore(d)+" days before departure, in cleared funds"],
      ["Currency", cur+" — all amounts payable free of deduction"],
      ["Late payment interest", pct(d.commercial.latePct)+" per month, compounded"],

  docs.push({id:"SCH-D", code:"05", title:"Schedule D — Quality, Certification and Support", subtitle:refBase+" — "+partyName(d), stamp:buildStamp(), blocks:xrefResolve(b)});

  /* ====================================================== SCHEDULE F */
  b=[];
  b.push(h1("SCHEDULE F \u2014 LICENSED CONTENT AND ACCESS"));
  b.push(p("This Schedule forms part of the "+M.agreementTitle+" bearing reference "+refBase+"."));
  b.push(note("This Schedule is the definitive list of what the "+R+" may teach and who may open the material. A course that is not on it is not licensed, and a person who is not on it has no access. It is maintained by the "+O+" and reissued on each change; the current version supersedes all earlier ones."));

  b.push(h2("F1. Courses licensed to the "+R));
  if(ctActiveItems(d).length){
    b.push(tbl(["Code","Course","Version","Licensed from","Licensed until","Status"],
      ctActiveItems(d).map(function(it){
        var c=courseByCode(it.code)||{};
        return [it.code||"", it.title||c.title||"", it.version||c.version||"",

      })));
