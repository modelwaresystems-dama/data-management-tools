<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Quality Statistical Methods &amp; Tools - Training Deck</title>
<style>
:root{
  --ink:#14202B; --paper:#F7F8F6; --card:#FFFFFF;
  --rule:#D7DDDA; --rule-soft:#E8ECEA; --graphite:#5A6A72;
  --incontrol:#1F6F5C; --incontrol-tint:#E9F2EF;
  --outofcontrol:#B3402E; --outofcontrol-tint:#F7EAE7;
  --sig:#8A6D2F;
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Segoe UI",Inter,-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0E1720;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}

#stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
.slide{position:absolute;width:1280px;height:720px;background:var(--paper);display:none;
  padding:56px 72px 56px;flex-direction:column;transform-origin:center center}
.slide.on{display:flex}

.kicker{font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--graphite)}
.slide h2{font-size:42px;line-height:1.06;letter-spacing:-.022em;font-weight:650;margin:12px 0 0}
.lede{font-size:21px;line-height:1.42;max-width:62ch;margin-top:18px}
.foot{position:absolute;left:72px;right:72px;bottom:22px;display:flex;align-items:center;gap:16px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);
  border-top:1px solid var(--rule);padding-top:10px}
.foot .grow{flex:1}

.slide.title{background:var(--ink);color:var(--paper);justify-content:center}
.slide.title .kicker{color:#8FA3AC}
.slide.title h1{font-size:64px;line-height:1.03;letter-spacing:-.03em;font-weight:650;margin:20px 0 22px;max-width:19ch}
.slide.title p{font-size:21px;color:#C9D5D1;max-width:62ch;line-height:1.45}
.slide.title .rule{width:96px;height:3px;background:var(--sig);margin-bottom:8px}
.slide.title .stats{display:flex;gap:52px;margin-top:40px;border-top:1px solid #35434E;padding-top:22px}
.slide.title .stats div span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8FA3AC;margin-bottom:5px}
.slide.title .stats div b{font-size:26px;font-weight:600}

.slide.section{background:var(--ink);color:var(--paper);justify-content:center}
.slide.section .num{font-family:var(--mono);font-size:92px;font-weight:600;color:var(--sig);letter-spacing:-.03em;line-height:1}
.slide.section h2{color:var(--paper);font-size:50px;max-width:20ch;margin-top:14px}
.slide.section p{font-size:21px;color:#C9D5D1;max-width:58ch;margin-top:18px;line-height:1.45}
.slide.section .foot{color:#7C8F98;border-top-color:#35434E}

.toc{display:grid;grid-template-columns:1fr 1fr;gap:0 48px;margin-top:24px}
.toc div{display:flex;gap:16px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--rule-soft)}
.toc .n{font-family:var(--mono);font-size:14px;color:var(--sig);flex:0 0 26px}
.toc .t{font-size:19px;font-weight:600}

.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;margin-top:24px;flex:1;min-height:0}
ul.pts{list-style:none}
ul.pts li{position:relative;padding:0 0 15px 26px;font-size:19px;line-height:1.45}
ul.pts li:before{content:"";position:absolute;left:0;top:11px;width:9px;height:2px;background:var(--sig)}
.box{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--ink);padding:22px 24px}
.box h3{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--graphite);font-weight:500;margin-bottom:12px}
.box p{font-size:18px;line-height:1.48}
.box p+p{margin-top:11px}
.fig{font-family:var(--mono);font-size:17px;background:var(--rule-soft);padding:2px 6px;border-radius:2px;white-space:nowrap}
.verdict{margin-top:13px;padding-top:12px;border-top:1px solid var(--rule);font-size:18px;line-height:1.45;color:var(--incontrol);font-weight:600}

/* ---- introduction slide ---- */
.introcols{display:grid;grid-template-columns:1.22fr 1fr;gap:38px;margin-top:22px;flex:1;min-height:0}
.why{border-left:3px solid var(--sig);padding-left:24px}
.why h3,.what h3{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--graphite);font-weight:500;margin-bottom:13px}
.why p{font-size:19px;line-height:1.5}
.why p+p{margin-top:13px}
.what{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--ink);padding:20px 22px}
.what ul{list-style:none}
.what li{position:relative;padding:0 0 10px 22px;font-size:17px;line-height:1.4}
.what li:last-child{padding-bottom:0}
.what li:before{content:"";position:absolute;left:0;top:9px;width:8px;height:2px;background:var(--sig)}
.outcome{margin-top:20px;border-top:1px solid var(--rule);padding-top:14px;font-size:18px;line-height:1.42;color:var(--ink)}
.outcome b{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--incontrol);font-weight:500;display:block;margin-bottom:6px}

/* ---- formula slide ---- */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin-top:18px;flex:1;min-height:0;align-content:start}
.fcard{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--sig);padding:11px 16px 12px}
.fname{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite);margin-bottom:7px}
.fexpr{font-family:var(--mono);font-size:19px;color:var(--ink);line-height:1.25;display:flex;align-items:center;flex-wrap:wrap;gap:2px;min-height:26px}
.fnote{font-size:13.5px;line-height:1.35;color:var(--graphite);margin-top:7px}
.fwhere{margin-top:14px;border-top:1px solid var(--rule);padding-top:11px;font-size:14.5px;line-height:1.45;color:var(--graphite)}
.fwhere b{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);font-weight:500;margin-right:10px}
.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 5px;font-size:.86em}
.fr>span:first-child{padding:0 7px 3px}
.fr>span:last-child{border-top:1.6px solid currentColor;padding:3px 7px 0}
.sq{display:inline-flex;align-items:flex-start;margin:0 2px}
.sq:before{content:"\221A";font-size:1.05em;line-height:1}
.sq>span{border-top:1.6px solid currentColor;padding:2px 4px 0 3px}

/* ---- visual slide ---- */
.viz{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--ink);
  margin-top:18px;padding:16px 20px 10px;flex:1;min-height:0;display:flex;flex-direction:column}
.viz svg{width:100%;height:100%;display:block}
.caption{margin-top:14px;font-size:19px;line-height:1.42;max-width:104ch;color:var(--ink)}
.caption b{font-weight:650}

.slide.trap h2{max-width:24ch}
.trapgrid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:26px}
.panel{padding:24px 26px;border:1px solid var(--rule)}
.panel.bad{background:var(--outofcontrol-tint);border-color:var(--outofcontrol);border-left-width:4px}
.panel.good{background:var(--incontrol-tint);border-color:var(--incontrol);border-left-width:4px}
.panel h3{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:500;margin-bottom:12px}
.panel.bad h3{color:var(--outofcontrol)}
.panel.good h3{color:var(--incontrol)}
.panel p{font-size:19px;line-height:1.45}
.tested{margin-top:24px;border-top:1px solid var(--rule);padding-top:15px;font-size:18px;line-height:1.45;color:var(--graphite);max-width:96ch}
.tested b{color:var(--ink);font-weight:650}

.slide.close{background:var(--ink);color:var(--paper);justify-content:center}
.slide.close h2{color:var(--paper);font-size:44px}
.slide.close ul{list-style:none;margin-top:26px}
.slide.close li{font-size:20px;line-height:1.5;padding:10px 0 10px 30px;position:relative;color:#C9D5D1;border-bottom:1px solid #26333D;max-width:78ch}
.slide.close li:before{content:"";position:absolute;left:0;top:19px;width:11px;height:2px;background:var(--sig)}
.slide.close li b{color:var(--paper);font-weight:650}
.slide.close .foot{color:#7C8F98;border-top-color:#35434E}

#bar{position:fixed;left:0;bottom:0;height:3px;background:var(--sig);width:0;z-index:20;transition:width .18s ease}
#hud{position:fixed;right:16px;bottom:14px;z-index:21;display:flex;gap:6px;align-items:center}
#hud button{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.1);color:#C9D5D1;border:1px solid rgba(255,255,255,.2);padding:6px 10px;border-radius:2px;cursor:pointer}
#hud button:hover{background:rgba(255,255,255,.22);color:#fff}
#hud span{font-family:var(--mono);font-size:11px;color:#8FA3AC;letter-spacing:.1em;padding-right:6px}

#grid{position:fixed;inset:0;background:rgba(14,23,32,.97);z-index:30;display:none;overflow:auto;padding:36px}
#grid.on{display:block}
#grid h4{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8FA3AC;margin-bottom:18px;font-weight:500}
.gitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.gitem{background:#1B2833;border:1px solid #2C3B47;padding:12px 14px;cursor:pointer}
.gitem:hover{border-color:var(--sig);background:#22303C}
.gitem .gn{font-family:var(--mono);font-size:10px;color:var(--sig);letter-spacing:.1em}
.gitem .gt{font-size:13.5px;margin-top:5px;line-height:1.35;color:#E4EAE8}
.gitem.iscur{border-color:var(--sig)}

@media print{
  @page{size:1280px 720px;margin:0}
  html,body{background:#fff;height:auto}
  #stage{position:static;display:block;overflow:visible}
  #bar,#hud,#grid{display:none!important}
  .slide{display:flex!important;position:relative;transform:none!important;page-break-after:always;break-after:page}
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"></div>
<div id="hud">
  <span id="count"></span>
  <button id="bGrid">Slides</button>
  <button id="bFull">Full screen</button>
</div>
<div id="grid"><h4>Jump to slide - press O or Escape to close</h4><div class="gitems" id="gitems"></div></div>

<script>
/* =========================================================
   SVG DRAWING HELPERS
   ========================================================= */
const C={ink:"#14202B",gr:"#5A6A72",sig:"#8A6D2F",ok:"#1F6F5C",bad:"#B3402E",
         rule:"#D7DDDA",soft:"#E8ECEA",okT:"#E9F2EF",badT:"#F7EAE7",paper:"#F7F8F6"};
const SANS='Segoe UI,Inter,sans-serif', MONO='SFMono-Regular,Consolas,monospace';

const T=(x,y,t,o={})=>`<text x="${x}" y="${y}" font-family="${o.m?MONO:SANS}" font-size="${o.s||14}" `+
  `fill="${o.f||C.gr}" text-anchor="${o.a||"start"}" font-weight="${o.w||400}"`+
  (o.ls?` letter-spacing="${o.ls}"`:"")+`>${t}</text>`;
const L=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c||C.rule}" `+
  `stroke-width="${o.w||1}"`+(o.d?` stroke-dasharray="${o.d}"`:"")+(o.op?` opacity="${o.op}"`:"")+`/>`;
const R=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.f||C.ink}"`+
  (o.s?` stroke="${o.s}" stroke-width="${o.sw||1}"`:"")+(o.op?` opacity="${o.op}"`:"")+(o.r?` rx="${o.r}"`:"")+`/>`;
const Cr=(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.f||C.ink}"`+
  (o.s?` stroke="${o.s}" stroke-width="${o.sw||1.4}"`:"")+(o.op?` opacity="${o.op}"`:"")+`/>`;
const P=(d,o={})=>`<path d="${d}" fill="${o.f||"none"}" stroke="${o.c||C.ink}" stroke-width="${o.w||1.5}"`+
  (o.d?` stroke-dasharray="${o.d}"`:"")+(o.op?` opacity="${o.op}"`:"")+`/>`;
const ARROW=`<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
  <path d="M0,0 L7,3 L0,6 z" fill="${C.gr}"/></marker>
  <marker id="ahs" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
  <path d="M0,0 L7,3 L0,6 z" fill="${C.sig}"/></marker></defs>`;
const TAG=(x,y,t,col)=>R(x,y-14,t.length*7.4+16,22,{f:col,r:2})+T(x+8,y+2,t,{f:"#fff",s:12,m:1,ls:".06em"});
const SVG=(inner,vb="0 0 1100 400")=>`<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet">${ARROW}${inner}</svg>`;

/* normal curve path */
function bell(cx, spread, base, height, x0, x1){
  let d="";
  for(let x=x0; x<=x1; x+=4){
    const y = base - height*Math.exp(-Math.pow((x-cx)/spread,2)/2);
    d += (d?" L ":"M ")+x.toFixed(1)+" "+y.toFixed(1);
  }
  return d;
}

/* =========================================================
   CHARTS - one per module
   ========================================================= */
const VIZ = [];

/* 01 · mean, median, mode, standard deviation on a skewed distribution */
VIZ[0] = () => {
  const bins=[3,10,26,44,58,66,62,52,42,33,26,21,17,14,11,9,8,6,5,4,4,3,3,2,2,2,1,1,1,1];
  const x0=90,x1=1010,base=300,bw=(x1-x0)/bins.length;
  let s=L(x0,base,x1,base,{c:C.ink});
  bins.forEach((v,i)=>{ s+=R(x0+i*bw+1, base-v*3.2, bw-2, v*3.2, {f:C.ink,op:.16}); });
  const mode=x0+5.5*bw, med=x0+7.6*bw, mean=x0+10.6*bw, sd=5.4*bw;
  const mark=(x,lab,col,dy)=>L(x,base,x,base-236,{c:col,w:2,d:"5 4"})+
    TAG(x-lab.length*3.7-8, 76+dy, lab, col);
  s+=mark(mode,"MODE",C.gr,0)+mark(med,"MEDIAN",C.ok,34)+mark(mean,"MEAN",C.sig,68);
  s+=L(mean-sd,336,mean+sd,336,{c:C.ink,w:1.6});
  s+=L(mean-sd,328,mean-sd,344,{c:C.ink,w:1.6})+L(mean+sd,328,mean+sd,344,{c:C.ink,w:1.6});
  s+=T(mean,364,"one standard deviation either side of the mean",{a:"middle",s:14});
  s+=P(`M ${x1-280} 206 C ${x1-210} 206 ${x1-210} 244 ${x1-140} 246`,{c:C.gr,w:1.2,d:"4 4"});
  s+=T(x1-6,250,"the long right tail that",{s:13.5,a:"end"})+T(x1-6,268,"drags the mean upward",{s:13.5,a:"end"});
  s+=T(x0,388,"Values, low to high",{s:13,m:1,ls:".08em"});
  return SVG(s);
};

/* 02 · cardinality, selectivity and a sentinel spike */
VIZ[1] = () => {
  let s=L(550,20,550,380,{c:C.rule});
  // left: near-constant status column
  s+=T(70,34,"CARDINALITY = 6 DISTINCT VALUES",{m:1,s:12.5,ls:".1em",f:C.ink,w:600});
  const base=300,x0=70;
  const vals=[["ACTIVE",99.7],["CLOSED",.15],["SUSPD",.08],["PEND",.04],["MERGED",.02],["UNK",.01]];
  vals.forEach((v,i)=>{
    const h=Math.max(3, v[1]*2.1), x=x0+i*72;
    s+=R(x,base-h,46,h,{f:i===0?C.ink:C.bad});
    s+=T(x+23,base+18,v[0],{a:"middle",s:11,m:1});
    s+=T(x+23,base-h-8,v[1]+"%",{a:"middle",s:11.5,m:1,f:i===0?C.ink:C.bad});
  });
  s+=L(x0-8,base,x0+440,base,{c:C.ink});
  s+=T(70,346,"Selectivity = 6 ÷ 4,200,000 - the column barely discriminates.",{s:14});
  s+=T(70,368,"The five rare values are where the defects live.",{s:14,f:C.bad});
  // right: sentinel spike
  s+=T(600,34,"FREQUENCY DISTRIBUTION - DATE OF BIRTH",{m:1,s:12.5,ls:".1em",f:C.ink,w:600});
  const dx0=600,dw=(1030-600)/34;
  for(let i=0;i<34;i++){
    const h = i===2 ? 150 : 14+Math.round(9*Math.sin(i*.9)+9);
    s+=R(dx0+i*dw+1, base-h, dw-2, h, {f:i===2?C.bad:C.ink, op:i===2?1:.18});
  }
  s+=L(dx0-8,base,1035,base,{c:C.ink});
  s+=P(`M ${dx0+3*dw} 118 C ${dx0+9*dw} 92 ${dx0+13*dw} 92 ${dx0+15*dw} 110`,{c:C.bad,w:1.3,d:"4 4"});
  s+=T(dx0+15*dw+8,102,"6% of rows on 1900-01-01",{s:13.5,f:C.bad,w:600});
  s+=T(600,346,"A valid date, in a valid format, passing every validity rule.",{s:14});
  s+=T(600,368,"Only the frequency count exposes it as a sentinel.",{s:14,f:C.bad});
  return SVG(s);
};

/* 03 · IQR fence vs three sigma, and masking */
VIZ[2] = () => {
  const x0=80,x1=1020,axis=250;
  let s=L(x0,axis,x1,axis,{c:C.ink});
  const bulk=[]; for(let i=0;i<66;i++) bulk.push(x0+50+((i*37)%230)+((i*11)%40));
  bulk.forEach(x=> s+=Cr(x, axis-1-((x*7)%26), 3.4, {f:C.ink,op:.35}));
  const outs=[700,742,790,835,884];
  outs.forEach(x=> s+=Cr(x, axis-12, 5, {f:C.bad}));
  // box plot
  const q1=x0+90,q3=x0+250,med=x0+160;
  s+=R(q1,axis-98,q3-q1,44,{f:"#fff",s:C.ink,sw:1.5});
  s+=L(med,axis-98,med,axis-54,{c:C.ok,w:2.4});
  s+=L(x0+40,axis-76,q1,axis-76,{c:C.ink})+L(q3,axis-76,q3+110,axis-76,{c:C.ink});
  s+=T(med,axis-108,"median",{a:"middle",s:12,m:1,f:C.ok});
  s+=T((q1+q3)/2,axis-30,"interquartile range - middle 50%",{a:"middle",s:12.5});
  // fences
  const fence=q3+150, sigma=940;
  s+=L(fence,60,fence,axis+34,{c:C.ok,w:2,d:"6 4"})+TAG(fence-88,50,"IQR FENCE",C.ok);
  s+=L(sigma,60,sigma,axis+34,{c:C.bad,w:2,d:"6 4"})+TAG(sigma-96,50,"3-SIGMA LIMIT",C.bad);
  s+=P(`M ${fence+8} 96 L ${sigma-8} 96`,{c:C.gr,w:1.2,d:"4 4"});
  s+=T((fence+sigma)/2,88,"the outliers themselves pushed it out here",{a:"middle",s:13,f:C.bad});
  s+=T(fence+8,axis+50,"catches all five outliers",{s:13.5,f:C.ok});
  s+=T(sigma-8,axis+50,"catches none - masking",{s:13.5,f:C.bad,a:"end"});
  s+=T(x0,336,"Every extreme value also inflates the standard deviation that defines the 3-sigma boundary.",{s:15,f:C.ink});
  s+=T(x0,360,"Quartiles are positional, so the IQR fence does not move when the tail gets longer.",{s:15,f:C.ink});
  s+=T(x0,392,"Reading value",{s:13,m:1,ls:".08em"});
  return SVG(s);
};

/* 04 · run of nine, all inside the limits */
VIZ[3] = () => {
  const x0=90,x1=1030,mid=200,ucl=90,lcl=310;
  const v=[0,-22,15,-8,26,-30,10,-16,4,20,-12,  18,34,26,44,30,52,38,58,46];
  let s=L(x0,ucl,x1,ucl,{c:C.bad,w:1.6,d:"6 4"})+L(x0,lcl,x1,lcl,{c:C.bad,w:1.6,d:"6 4"})
       +L(x0,mid,x1,mid,{c:C.ink,w:1.4});
  s+=T(x0-8,ucl+5,"UCL",{a:"end",s:12.5,m:1,f:C.bad})+T(x0-8,lcl+5,"LCL",{a:"end",s:12.5,m:1,f:C.bad})
    +T(x0-8,mid+5,"CL",{a:"end",s:12.5,m:1});
  const step=(x1-x0)/(v.length-1);
  s=R(x0+step*10.5,ucl,step*8.5,mid-ucl,{f:C.sig,op:.13})+s;
  let d="";
  v.forEach((y,i)=>{ const px=x0+i*step, py=mid-y*1.9; d+=(d?" L ":"M ")+px+" "+py; });
  s+=P(d,{c:C.ink,w:1.4,op:.55});
  v.forEach((y,i)=>{ const px=x0+i*step, py=mid-y*1.9;
    s+=Cr(px,py,5.2,{f:i>=11?C.sig:C.ink}); });
  s+=TAG(x0+step*11.6,58,"NINE CONSECUTIVE POINTS ABOVE THE CENTRELINE",C.sig);
  s+=T(x0+step*15.5,352,"Not one point has breached a limit.",{a:"middle",s:15,f:C.ink,w:600});

/* =========================================================
   FORMULAS - included only where a formula genuinely applies
   ========================================================= */
const FORMULAS = [
[{title:`Measures of centre`,cards:[{n:`Mean`,e:`x&#772; = <span class="fr"><span>&Sigma;x</span><span>n</span></span>`,d:`Add every value, divide by how many there are. Uses all the data, so extremes drag it.`},{n:`Median`,e:`value at position <span class="fr"><span>n + 1</span><span>2</span></span>`,d:`Sort first. With an even count, average the two middle values. Extremes barely move it.`},{n:`Mode`,e:`the most frequently occurring value`,d:`There may be none, one or several. Useful on categories, unstable on continuous data.`}],where:`x&#772; = sample mean &middot; n = number of values &middot; mean above median is the signature of a long right tail`},{title:`Measures of spread`,cards:[{n:`Range`,e:`R = max - min`,d:`The crudest spread measure, built entirely from the two least reliable observations.`},{n:`Variance`,e:`s&sup2; = <span class="fr"><span>&Sigma;(x - x&#772;)&sup2;</span><span>n - 1</span></span>`,d:`Average squared distance from the mean. In squared units, so it is rarely reported directly.`},{n:`Standard deviation`,e:`s = <span class="sq"><span>s&sup2;</span></span>`,d:`The typical distance from the mean, back in the original units of the data.`},{n:`Coefficient of variation`,e:`CV = <span class="fr"><span>s</span><span>x&#772;</span></span> &times; 100`,d:`Spread as a percentage of the centre. Unit-free, so it compares across different scales.`}],where:`s = sample standard deviation &middot; the n - 1 divisor is the sample correction (Bessel's)`}],
[{title:`The formulas`,cards:[{n:`Cardinality`,e:`C = | distinct(column) |`,d:`A count of unique values. Says nothing about how often each one occurs.`},{n:`Selectivity`,e:`S = <span class="fr"><span>C</span><span>N</span></span>`,d:`Cardinality against row count. Near 1 is a candidate key; near 0 is a weak filter.`},{n:`Uniqueness constraint`,e:`C = N`,d:`A declared key must satisfy this exactly. There is no tolerance band on uniqueness.`},{n:`Relative frequency`,e:`f(v) = <span class="fr"><span>count(v)</span><span>N</span></span> &times; 100`,d:`The share of rows carrying one value. A single value near 100% is the sentinel signature.`}],where:`C = cardinality &middot; N = total row count &middot; count(v) = rows holding value v`}],
[{title:`The formulas`,cards:[{n:`Interquartile range`,e:`IQR = Q&#8323; - Q&#8321;`,d:`The width of the middle half of the sorted data. Positional, so skew does not inflate it.`},{n:`Tukey fences`,e:`Q&#8321; - 1.5&times;IQR &nbsp; Q&#8323; + 1.5&times;IQR`,d:`The standard outlier boundary. Values beyond it are flagged for investigation.`},{n:`Far-out fences`,e:`Q&#8321; - 3&times;IQR &nbsp; Q&#8323; + 3&times;IQR`,d:`A stricter boundary, used when the 1.5 fence flags more than stewards can work.`},{n:`Z-score`,e:`z = <span class="fr"><span>x - x&#772;</span><span>s</span></span>`,d:`Distance from the mean in standard deviations. The usual rule flags |z| greater than 3.`},{n:`Three-sigma bounds`,e:`x&#772; &plusmn; 3s`,d:`Assumes rough normality, and both terms are distorted by the outliers themselves.`}],where:`Q&#8321;, Q&#8323; = first and third quartiles &middot; x&#772; = mean &middot; s = standard deviation`}],
[{title:`The formulas`,cards:[{n:`Run on one side`,e:`P = ( &frac12; )&#8319;`,d:`The chance of n consecutive points on the same side of the centreline. At n = 9, about 1 in 512.`},{n:`Run on either side`,e:`P = 2 &times; ( &frac12; )&#8319;`,d:`Covering a run above or below. At n = 9 that is roughly 1 in 256, improbable enough to act on.`},{n:`False alarm on one point`,e:`&alpha; &asymp; 0.0027`,d:`Three-sigma limits capture 99.73% of a stable process, so about 1 point in 370 breaches by chance.`}],where:`n = length of the run &middot; the common-versus-special judgement is what the chart supports, not a calculation`}],
[{title:`The formulas`,cards:[{n:`p-chart, proportion defective`,e:`p&#772; &plusmn; 3<span class="sq"><span>p&#772;(1 - p&#772;) / n&#7522;</span></span>`,d:`Limits recalculate for each subgroup, which is what handles varying batch sizes.`},{n:`np-chart, count defective`,e:`np&#772; &plusmn; 3<span class="sq"><span>np&#772;(1 - p&#772;)</span></span>`,d:`Same family as the p-chart, but it requires a constant subgroup size.`},{n:`c-chart, defect count`,e:`c&#772; &plusmn; 3<span class="sq"><span>c&#772;</span></span>`,d:`For defects counted over a constant area of opportunity.`},{n:`u-chart, defects per unit`,e:`u&#772; &plusmn; 3<span class="sq"><span>u&#772; / n&#7522;</span></span>`,d:`For defects per unit where the area of opportunity varies between subgroups.`},{n:`X-bar chart`,e:`X&#772;&#772; &plusmn; A&#8322; R&#772;`,d:`For continuous measurements in rational subgroups. A&#8322; is a table constant on subgroup size.`},{n:`Individuals, I-MR`,e:`x&#772; &plusmn; 2.66 &times; MR&#772;`,d:`One value per period, no subgroup. 2.66 is the constant for a moving range of two.`}],where:`p&#772; = average proportion &middot; n&#7522; = size of subgroup i &middot; R&#772; = average range &middot; MR&#772; = average moving range`}],
[{title:`The formulas`,cards:[{n:`Centreline`,e:`CL = x&#772;`,d:`The process average across the baseline period, and nothing more than that.`},{n:`Control limits`,e:`UCL, LCL = CL &plusmn; 3&sigma;&#770;`,d:`Calculated from the process's own variation. Nothing about the requirement enters here.`},{n:`Estimating sigma`,e:`&sigma;&#770; = <span class="fr"><span>R&#772;</span><span>d&#8322;</span></span>`,d:`Estimated from within-subgroup variation rather than the overall spread. d&#8322; is a table constant.`},{n:`Specification limit`,e:`USL, LSL = set by requirement`,d:`Deliberately no formula. This is the one line on the chart that is agreed, not calculated.`}],where:`&sigma;&#770; = estimated process standard deviation &middot; R&#772; = average subgroup range &middot; d&#8322; = table constant`}],
[{title:`The formulas`,cards:[{n:`Process capability`,e:`Cp = <span class="fr"><span>USL - LSL</span><span>6&sigma;</span></span>`,d:`Could the spread fit inside the tolerance? Ignores where the process is centred.`},{n:`Upper and lower capability`,e:`Cpu = <span class="fr"><span>USL - x&#772;</span><span>3&sigma;</span></span> Cpl = <span class="fr"><span>x&#772; - LSL</span><span>3&sigma;</span></span>`,d:`Distance from the mean to each specification limit, in three-sigma units.`},{n:`Capability index`,e:`Cpk = min ( Cpu , Cpl )`,d:`The nearer limit governs. Below 1.0 means out-of-tolerance results are being produced now.`},{n:`Centring factor`,e:`Cpk = Cp (1 - k)`,d:`k measures how far the mean sits from the tolerance midpoint. At k = 0 the two indices match.`}],where:`USL, LSL = specification limits &middot; &sigma; = process standard deviation &middot; Cpk of 1.33 puts the nearer limit four sigma out`}],
[{title:`The formulas`,cards:[{n:`Sample size for a proportion`,e:`n = <span class="fr"><span>Z&sup2; p (1 - p)</span><span>E&sup2;</span></span>`,d:`Use p = 0.5 when the rate is unknown; it gives the largest and therefore safest sample.`},{n:`Finite population correction`,e:`n&#8336;&#8339;&#11388; = <span class="fr"><span>n</span><span>1 + (n - 1) / N</span></span>`,d:`Only worth applying when the sample is a large fraction of the population.`},{n:`Margin of error`,e:`E = Z <span class="sq"><span>p (1 - p) / n</span></span>`,d:`The half-width of the interval at the confidence level you chose.`},{n:`Precision scaling`,e:`E &prop; <span class="fr"><span>1</span><span><span class="sq"><span>n</span></span></span></span>`,d:`Halving the margin of error takes roughly four times the sample.`},{n:`Expected defects in a sample`,e:`D = n &times; p`,d:`For rare defects this is the number that governs the design, not n on its own.`}],where:`Z = 1.96 at 95% confidence &middot; p = expected proportion &middot; E = margin of error &middot; N = population size`}],
[{title:`The formulas`,cards:[{n:`Interval for a proportion`,e:`p&#770; &plusmn; Z <span class="sq"><span>p&#770;(1 - p&#770;) / n</span></span>`,d:`The standard form for a data quality rate such as completeness or validity.`},{n:`Interval for a mean`,e:`x&#772; &plusmn; Z <span class="fr"><span>s</span><span><span class="sq"><span>n</span></span></span></span>`,d:`Used when the measure is continuous rather than a pass rate.`},{n:`Z by confidence level`,e:`1.645 &middot; 1.96 &middot; 2.576`,d:`For 90%, 95% and 99%. Demanding higher confidence widens the interval.`},{n:`Interval width`,e:`W = 2E`,d:`Two estimates whose intervals overlap substantially are not evidence of a change.`}],where:`p&#770; = observed sample proportion &middot; s = sample standard deviation &middot; n = sample size &middot; E = margin of error`}],
[{title:`The formulas`,cards:[{n:`Pooled proportion`,e:`p&#772; = <span class="fr"><span>x&#8321; + x&#8322;</span><span>n&#8321; + n&#8322;</span></span>`,d:`The combined rate assumed under the null hypothesis of no difference.`},{n:`Two-proportion test`,e:`z = <span class="fr"><span>p&#770;&#8321; - p&#770;&#8322;</span><span><span class="sq"><span>p&#772;(1 - p&#772;)(1/n&#8321; + 1/n&#8322;)</span></span></span></span>`,d:`The standard test for whether a remediation actually moved the defect rate.`},{n:`Decision rule`,e:`reject H&#8320; if p &lt; &alpha;`,d:`That is the whole of the test. It says nothing about whether the difference matters.`},{n:`Effect size`,e:`d = p&#770;&#8321; - p&#770;&#8322;`,d:`The plain difference in rates. This is the number the business decision should rest on.`},{n:`Expected false positives`,e:`F = m &times; &alpha;`,d:`Across m tests at level &alpha;. Forty rules at 0.05 yields about two by chance alone.`},{n:`Bonferroni correction`,e:`&alpha;&#8336;&#8339;&#11388; = <span class="fr"><span>&alpha;</span><span>m</span></span>`,d:`The simplest guard against multiple comparisons. Conservative, but easy to defend.`}],where:`&alpha; = significance level &middot; m = number of tests &middot; H&#8320; = null hypothesis &middot; x = defect count &middot; n = sample size`}],
[{title:`The formulas`,cards:[{n:`Pearson correlation`,e:`r = <span class="fr"><span>&Sigma;(x - x&#772;)(y - y&#772;)</span><span><span class="sq"><span>&Sigma;(x - x&#772;)&sup2; &Sigma;(y - y&#772;)&sup2;</span></span></span></span>`,d:`Strength and direction of a linear association. Swap x and y and the value is identical.`},{n:`Covariance form`,e:`r = <span class="fr"><span>cov(x, y)</span><span>s&#8339; s&#8342;</span></span>`,d:`The same quantity, scaled by both standard deviations so it carries no units.`},{n:`Coefficient of determination`,e:`r&sup2;`,d:`The share of variance in one variable explained by the other. Explained, not caused.`},{n:`Bounds`,e:`-1 &le; r &le; +1`,d:`Sign gives direction, magnitude gives strength. Neither gives you a causal arrow.`}],where:`s&#8339;, s&#8342; = standard deviations &middot; cov = covariance &middot; no value of r establishes causation`}],
[{title:`The formulas`,cards:[{n:`Category share`,e:`share&#7522; = <span class="fr"><span>count&#7522;</span><span>&Sigma;count</span></span> &times; 100`,d:`Each bar's contribution to the total, which is what sets the descending order.`},{n:`Cumulative percentage`,e:`cum&#7522; = <span class="fr"><span>&Sigma;&#8321;..&#7522; count</span><span>&Sigma;count</span></span> &times; 100`,d:`The line running left to right. Read where it crosses 80% to find the vital few.`},{n:`Impact weighting`,e:`weight&#7522; = count&#7522; &times; cost&#7522;`,d:`Re-ranks the chart on consequence rather than volume. Use it whenever costs differ.`},{n:`Weighted share`,e:`share&#7522; = <span class="fr"><span>weight&#7522;</span><span>&Sigma;weight</span></span> &times; 100`,d:`The same chart rebuilt on the outcome that actually matters to the business.`}],where:`count&#7522; = occurrences in category i &middot; cost&#7522; = business impact per occurrence &middot; a flat profile means no vital few here`}],
null,
[{title:`The formulas`,cards:[{n:`Defects per unit`,e:`DPU = <span class="fr"><span>D</span><span>U</span></span>`,d:`The average number of defects carried by each record.`},{n:`Defects per opportunity`,e:`DPO = <span class="fr"><span>D</span><span>U &times; O</span></span>`,d:`Dividing by opportunities is what makes complex and simple processes comparable.`},{n:`Defects per million`,e:`DPMO = DPO &times; 1,000,000`,d:`The reporting scale. 4,500 defects over 1,500,000 opportunities gives 3,000.`},{n:`Rolled throughput yield`,e:`RTY = e&#8315;&#7488;&#7472;&#7512;`,d:`The probability that a record passes every check with no defect at all.`},{n:`Sigma level`,e:`read from DPMO, with a 1.5&sigma; shift`,d:`The convention behind six sigma being quoted at 3.4 DPMO rather than 2 per billion.`}],where:`D = total defects found &middot; U = units inspected &middot; O = opportunities for a defect within each unit`}],
[{title:`The formulas`,cards:[{n:`Run on one side`,e:`P = ( &frac12; )&#8319;`,d:`Nine consecutive points on one side of the centreline works out at about 1 in 512.`},{n:`Monotonic trend`,e:`P = <span class="fr"><span>2</span><span>n !</span></span>`,d:`Seven successively rising or falling points: 2 / 5040, roughly 1 in 2,500.`},{n:`Average run length`,e:`ARL = <span class="fr"><span>1</span><span>&alpha;</span></span> &asymp; 370`,d:`A stable process throws a false signal about once every 370 plotted points.`},{n:`Two-point comparison`,e:`P(red tile) &asymp; 0.5`,d:`Comparing this month to last on a stable process flags roughly half the time.`}],where:`n = points in the pattern &middot; n ! = factorial &middot; &alpha; = 0.0027 for three-sigma limits`}],
[{title:`The formulas`,cards:[{n:`Risk Priority Number`,e:`RPN = S &times; O &times; D`,d:`Three ordinal ratings multiplied together, producing a value between 1 and 1,000.`},{n:`Bounds`,e:`1 &le; RPN &le; 1000`,d:`Each rating runs 1 to 10. Identical totals can be built from very different components.`},{n:`Criticality`,e:`CN = S &times; O`,d:`Severity against frequency, ignoring detection. Closer to true risk than RPN is.`},{n:`Action Priority`,e:`AP = f ( S, O, D )`,d:`A severity-first table lookup rather than a product. Deliberately not a single number.`}],where:`S = severity &middot; O = occurrence &middot; D = detection, scored in reverse (1 = caught, 10 = escapes)`}]
];

/* =========================================================
   SLIDE ASSEMBLY
   ========================================================= */
const pad = n => String(n).padStart(2,"0");
const slides = [];

slides.push({nav:"Title", cls:"title", html:`
  <div class="rule"></div>
  <p class="kicker">Modelware Systems · CDMP Data Quality Specialist</p>
  <h1>Data Quality Statistical Methods &amp; Tools</h1>
  <p>A working session on the sixteen method families the specialist exam draws from - what each technique measures, what it looks like, and the misconception that makes its distractors so tempting.</p>
  <div class="stats">
    <div><span>Modules</span><b>16</b></div>
    <div><span>Worked visuals</span><b>16</b></div>
    <div><span>Slides</span><b>101</b></div>
    <div><span>Companion questions</span><b>80</b></div>
    <div><span>Suggested duration</span><b>Half day</b></div>
  </div>`});

slides.push({nav:"How to use this deck", cls:"", html:`
  <p class="kicker">Before we start</p>
  <h2>How this session runs</h2>
  <div class="cols">
    <ul class="pts">
      <li>Each module follows the same four beats: an <b>introduction</b> setting out why the family matters and what it covers, then <b>the idea</b>, <b>the formulas</b>, <b>seeing it</b>, and <b>the trap</b> the exam sets around it.</li>
      <li>The visual slide is where the concept becomes concrete - every chart is drawn from the same numbers used in the companion quiz.</li>
      <li>Work the two associate questions for a category immediately after its module, then attempt the practitioner and master questions as a set.</li>
      <li>Plain language throughout. Where the exam uses a specific term, it appears in bold the first time it is defined.</li>
    </ul>
    <div class="box">
      <h3>Running the deck</h3>
      <p><span class="fig">→</span> or <span class="fig">Space</span> - next slide<br>
         <span class="fig">←</span> - previous slide<br>
         <span class="fig">O</span> - slide index, jump anywhere<br>
         <span class="fig">F</span> - full screen<br>
         <span class="fig">Ctrl</span>+<span class="fig">P</span> - print or save as PDF</p>
      <div class="verdict">One file, no installation, works offline.</div>
    </div>
  </div>`});

for (let h = 0; h < 2; h++){
  const part = MODULES.slice(h*8, h*8+8);
  slides.push({nav:`Contents ${h+1} of 2`, cls:"", html:`
    <p class="kicker">Contents · modules ${h*8+1}–${h*8+part.length}</p>
    <h2>${h===0 ? "Describing and controlling the data" : "Testing, prioritising and ranking risk"}</h2>
    <div class="toc">
      ${part.map((m,i) => `<div><span class="n">${pad(h*8+i+1)}</span><span class="t">${m.cat}</span></div>`).join("")}
    </div>`});
}

MODULES.forEach((m, i) => {
  const n = pad(i+1);
  slides.push({nav:`${n} · ${m.cat}`, cls:"section", html:`
    <p class="kicker">Module ${n} of 16</p>
    <div class="num">${n}</div>
    <h2>${m.cat}</h2>
    <p>${m.blurb}</p>`});

  slides.push({nav:`${n} · Introduction`, cls:"", html:`
    <p class="kicker">${n} · ${m.cat} · introduction</p>
    <h2>Why it matters, and what it covers</h2>
    <div class="introcols">
      <div class="why">
        <h3>Why this belongs in the toolkit</h3>
        ${INTRO[i].why.map(w => `<p>${w}</p>`).join("")}
      </div>
      <div class="what">
        <h3>What this module covers</h3>
        <ul>${INTRO[i].what.map(w => `<li>${w}</li>`).join("")}</ul>
      </div>
    </div>
    <p class="outcome"><b>By the end of this module</b>${INTRO[i].can}</p>`});

  slides.push({nav:`${n} · The idea`, cls:"", html:`
    <p class="kicker">${n} · ${m.cat}</p>
    <h2>The idea</h2>
    <p class="lede">${m.lede}</p>
    <div class="cols">
      <ul class="pts">${m.pts.map(p => `<li>${p}</li>`).join("")}</ul>
      <div class="box">
        <h3>${m.ex.h}</h3>
        ${m.ex.p.map(p => `<p>${p}</p>`).join("")}
        <div class="verdict">${m.ex.v}</div>
      </div>
    </div>`});

  (FORMULAS[i] || []).forEach(pg => slides.push({nav:`${n} · ${pg.title}`, cls:"", html:`
    <p class="kicker">${n} · ${m.cat} · formulas</p>
    <h2>${pg.title}</h2>
    <div class="fgrid">
      ${pg.cards.map(c => `<div class="fcard">
        <div class="fname">${c.n}</div>
        <div class="fexpr">${c.e}</div>
        <div class="fnote">${c.d}</div>
      </div>`).join("")}
    </div>
    <p class="fwhere"><b>Where</b>${pg.where}</p>`}));

  slides.push({nav:`${n} · Seeing it`, cls:"", html:`
    <p class="kicker">${n} · ${m.cat} · seeing it</p>
    <h2>${m.vizT}</h2>
    <div class="viz">${VIZ[i]()}</div>
    <p class="caption">${m.cap}</p>`});

  slides.push({nav:`${n} · The trap`, cls:"trap", html:`
    <p class="kicker">${n} · ${m.cat} · common misconception</p>
    <h2>${m.trapT}</h2>
    <div class="trapgrid">
      <div class="panel bad"><h3>What people say</h3><p>${m.bad}</p></div>
      <div class="panel good"><h3>What is actually true</h3><p>${m.good}</p></div>
    </div>
    <p class="tested">${m.test}</p>`});
});

slides.push({nav:"Closing", cls:"close", html:`
  <p class="kicker">Carry these out of the room</p>
  <h2>Eight things worth remembering</h2>
  <ul>
    <li><b>Centre and spread are different questions.</b> Never report one without the other.</li>
    <li><b>Control limits come from the process; specification limits come from the requirement.</b></li>
    <li><b>Patterns inside the limits carry information.</b> Run rules exist because single-point limits miss sustained shifts.</li>
    <li><b>An outlier is not a defect.</b> Distance from the centre is a reason to investigate, not a verdict.</li>
    <li><b>Significance is not materiality.</b> On a large enough sample, everything is significant.</li>
    <li><b>Correlation is symmetric.</b> No coefficient, however large, points at a cause.</li>
    <li><b>Rank by impact, not by count</b>, whenever the consequences are asymmetric.</li>
    <li><b>Equal RPNs are not equal risks.</b> Severity is the dimension controls cannot reduce.</li>
  </ul>`});

/* =========================================================
   RENDER + NAVIGATION
   ========================================================= */
const stage = document.getElementById("stage");
stage.innerHTML = slides.map((s,i) =>
  `<section class="slide ${s.cls}" data-i="${i}">${s.html}
     <div class="foot"><span>Modelware Systems</span><span class="grow"></span>
     <span>${s.nav.replace(/&/g,"&amp;")}</span><span>${pad(i+1)} / ${slides.length}</span></div>
   </section>`).join("");

const els = [...document.querySelectorAll(".slide")];
let cur = 0;

function fit(){
  const s = Math.min(innerWidth/1280, innerHeight/720) * 0.955;
  els.forEach(e => e.style.transform = `scale(${s})`);
}
function show(i){
  cur = Math.max(0, Math.min(slides.length-1, i));
  els.forEach((e,j) => e.classList.toggle("on", j===cur));
  document.getElementById("bar").style.width = ((cur+1)/slides.length*100) + "%";
  document.getElementById("count").textContent = pad(cur+1) + " / " + slides.length;
  [...document.querySelectorAll(".gitem")].forEach((g,j) => g.classList.toggle("iscur", j===cur));
  location.hash = cur+1;
}

document.getElementById("gitems").innerHTML = slides.map((s,i) =>
  `<div class="gitem" data-i="${i}"><div class="gn">${pad(i+1)}</div><div class="gt">${s.nav.replace(/&/g,"&amp;")}</div></div>`).join("");
document.querySelectorAll(".gitem").forEach(g =>
  g.addEventListener("click", () => { show(+g.dataset.i); toggleGrid(false); }));

function toggleGrid(on){
  const g = document.getElementById("grid");
  g.classList.toggle("on", on === undefined ? !g.classList.contains("on") : on);
}

addEventListener("keydown", e => {
  const k = e.key;
  if (k === "ArrowRight" || k === " " || k === "PageDown"){ e.preventDefault(); show(cur+1); }
  else if (k === "ArrowLeft" || k === "PageUp"){ e.preventDefault(); show(cur-1); }
  else if (k === "Home"){ show(0); }
  else if (k === "End"){ show(slides.length-1); }
  else if (k === "o" || k === "O"){ toggleGrid(); }
  else if (k === "Escape"){ toggleGrid(false); }
  else if (k === "f" || k === "F"){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
addEventListener("resize", fit);
document.getElementById("bGrid").addEventListener("click", () => toggleGrid());
document.getElementById("bFull").addEventListener("click", () =>
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
stage.addEventListener("click", e => { if (!e.target.closest("#hud")) show(cur+1); });

fit();
show(Math.max(0, (parseInt(location.hash.slice(1),10) || 1) - 1));
</script>
</body>
</html>
