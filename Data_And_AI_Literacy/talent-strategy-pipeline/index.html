<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="version" content="1.7.0">
<meta name="mw-asset" content="true">
<meta name="ontology-src" content="gh:modelwaresystems-dama/modelware_app_storage/Data_And_AI_Literacy/Ontology/database">
<title>Talent Strategy Pipeline</title>
<style>
  :root{
    --bg:#f6f7f9;--panel:#fff;--panel2:#fbfcfd;--ink:#15181d;--muted:#5c6673;
    --line:#e3e7ec;--line2:#eef1f4;--accent:#2f5bd0;--accent-ink:#1b3a8f;--accent-bg:#eaf0fc;
    --chip:#eef1f6;--chip-ink:#3a4452;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(20,24,29,.06),0 2px 10px rgba(20,24,29,.05);--radius:12px;
    --warn:#b23b2e;--ok:#12946a;
    --s1:#2f5bd0;--s2:#1f6f8b;--s3:#7c3aed;--s4:#0f7b5a;--s5:#b23b2e;--s6:#b8742a;--s7:#8a5a1a;--s8:#12946a;
    --human:#2f5bd0;--agent:#7c3aed;--gate:#b23b2e;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0f1216;--panel:#171b21;--panel2:#1b2027;--ink:#e9edf2;--muted:#9aa5b2;
    --line:#272d36;--line2:#20262e;--accent:#6f97ff;--accent-ink:#9db8ff;--accent-bg:#17223c;
    --chip:#232a33;--chip-ink:#c3ccd7;--shadow:0 1px 2px rgba(0,0,0,.4),0 2px 12px rgba(0,0,0,.35);
    --warn:#e0725f;--ok:#39c08c;
    --s1:#6f97ff;--s2:#5aa0cf;--s3:#b49bf0;--s4:#43c494;--s5:#e0725f;--s6:#d99a52;--s7:#d9a56a;--s8:#39c08c;
    --human:#6f97ff;--agent:#b49bf0;--gate:#e0725f;
  }}
  :root[data-theme="dark"]{
    --bg:#0f1216;--panel:#171b21;--panel2:#1b2027;--ink:#e9edf2;--muted:#9aa5b2;
    --line:#272d36;--line2:#20262e;--accent:#6f97ff;--accent-ink:#9db8ff;--accent-bg:#17223c;
    --chip:#232a33;--chip-ink:#c3ccd7;--warn:#e0725f;--ok:#39c08c;
    --s1:#6f97ff;--s2:#5aa0cf;--s3:#b49bf0;--s4:#43c494;--s5:#e0725f;--s6:#d99a52;--s7:#d9a56a;--s8:#39c08c;
    --human:#6f97ff;--agent:#b49bf0;--gate:#e0725f;
  }
  *{box-sizing:border-box}html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--accent-ink)}
  /* top bar */
  .top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;position:sticky;top:0;z-index:30}
  .top .ttl{font-weight:800;font-size:15.5px;letter-spacing:-.01em}
  .top .sub{font-size:12px;color:var(--muted)}
  .badge{font:700 11px var(--mono);background:var(--accent-bg);color:var(--accent-ink);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  .legend{display:flex;gap:12px;margin-left:auto;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .layertog{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
  .layertog button{border:none;background:var(--panel2);color:var(--muted);font:700 12px -apple-system,system-ui,sans-serif;padding:7px 13px;cursor:pointer}
  .layertog button.on{background:var(--accent);color:#fff}
  .layertog button:not(.on):hover{color:var(--ink)}
  .src{font:700 9.5px var(--mono);border-radius:5px;padding:1px 6px;white-space:nowrap}
  .src.ext{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted);border:1px solid var(--line)}
  .src.loc{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
  .glosswrap{padding:14px 16px 50px;max-width:900px}
  .glsearch{width:100%;max-width:420px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:9px 12px;font:inherit;font-size:14px;margin:4px 0 16px}
  .glsearch:focus{outline:none;border-color:var(--accent)}
  .glcat{font:800 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
  .glcount{font:700 11px var(--mono);color:var(--muted);background:var(--chip);border-radius:999px;padding:1px 8px}
  .glterm{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;background:var(--panel)}
  .gltl{font-weight:800;font-size:14px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .glabbr{font:700 10px var(--mono);background:var(--accent-bg);color:var(--accent-ink);border-radius:5px;padding:1px 6px}
  .glns{font:700 9.5px var(--mono);border-radius:5px;padding:1px 6px}
  .glns.ext{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted);border:1px solid var(--line)}
  .glns.loc{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
  .gldef{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.5}
  .hlp{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:999px;border:1.3px solid var(--muted);color:var(--muted);font:700 10px var(--mono);cursor:help;margin-left:5px;vertical-align:middle;flex:0 0 auto}
  .hlp:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
  #defpop{display:none;position:absolute;z-index:60;background:var(--panel);border:1.5px solid var(--accent);border-radius:11px;box-shadow:var(--shadow);padding:12px 14px}
  #defpop .dpt{font-weight:800;font-size:13.5px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-.01em}
  #defpop .dpd{font-size:12.5px;color:var(--muted);line-height:1.55}
  .search{position:relative}
  .search input{width:220px;max-width:50vw;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:7px 11px;font:inherit;font-size:13px}
  .search input:focus{outline:none;border-color:var(--accent)}
  .results{position:absolute;top:38px;right:0;width:320px;max-height:340px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:40;display:none}
  .results.show{display:block}
  .results .r{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line2);font-size:13px}
  .results .r:hover{background:var(--panel2)}
  .results .r .ty{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
  /* loop */
  .loopwrap{padding:16px 16px 6px;overflow-x:auto}
  .loop{display:flex;align-items:stretch;gap:0;min-width:min-content}
  .stagecard{position:relative;flex:1 1 0;min-width:138px;background:var(--panel);border:1.5px solid var(--line);border-top:4px solid var(--sc,var(--accent));border-radius:12px;padding:11px 12px 12px;cursor:pointer;transition:transform .12s,box-shadow .12s;margin-right:22px}
  .stagecard:last-of-type{margin-right:0}
  .stagecard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
  .stagecard.on{border-color:var(--sc,var(--accent));box-shadow:0 0 0 2px var(--sc,var(--accent)) inset,var(--shadow)}
  .stagecard .no{position:absolute;top:-13px;left:12px;width:24px;height:24px;border-radius:999px;background:var(--sc,var(--accent));color:#fff;font:800 12px var(--mono);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
  .stagecard .snm{font-weight:800;font-size:13px;margin:2px 0 4px;letter-spacing:-.01em}
  .stagecard .scount{font:800 20px var(--mono);color:var(--sc,var(--accent))}
  .stagecard .scount small{font:600 11px -apple-system,sans-serif;color:var(--muted)}
  .stagecard .stypes{margin-top:6px;display:flex;flex-wrap:wrap;gap:3px}
  .stagecard .tt{font:600 10px var(--mono);background:var(--chip);color:var(--chip-ink);border-radius:5px;padding:1px 5px}
  .arrow{position:absolute;right:-22px;top:50%;width:22px;height:2px;background:var(--line);transform:translateY(-50%)}
  .arrow:after{content:"";position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left-color:var(--line)}
  .refresh{display:flex;align-items:center;gap:8px;justify-content:center;margin:2px 16px 0;padding:7px 12px;border:1.5px dashed var(--line);border-radius:999px;font-size:12px;color:var(--muted);background:var(--panel2)}
  .refresh b{color:var(--ink)}
  .govbar{margin:12px 16px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 13px;border:1.5px solid var(--line);border-left:4px solid var(--gate);border-radius:10px;background:var(--panel);cursor:pointer}
  .govbar.on{box-shadow:0 0 0 2px var(--gate) inset}
  .govbar .glbl{font-weight:800;font-size:12.5px}
  .govbar .gnote{font-size:12px;color:var(--muted)}
  .govbar .gcount{font:800 15px var(--mono);color:var(--gate);margin-left:auto}
  /* main split */
  .main{display:grid;grid-template-columns:minmax(320px,1fr) minmax(300px,420px);gap:0;align-items:start;padding:8px 0 40px}
  .col{padding:8px 16px}
  .col.recs{border-right:1px solid var(--line)}
  .colhd{display:flex;align-items:baseline;gap:9px;margin:8px 2px 12px}
  .colhd h2{font-size:15px;margin:0;letter-spacing:-.01em}
  .colhd .ct{font:700 12px var(--mono);color:var(--muted)}
  .colhd .sc{width:11px;height:11px;border-radius:4px;display:inline-block}
  .stagedesc{font-size:12.5px;color:var(--muted);margin:-4px 2px 14px;line-height:1.5}
  /* record card */
  .rec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;cursor:pointer}
  .rec:hover{border-color:var(--accent)}
  .rec.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
  .rec .rh{display:flex;align-items:flex-start;gap:8px}
  .rec.step{position:relative}
  .rec.step:not(:last-child)::after{content:"";position:absolute;left:23px;bottom:-9px;height:9px;width:2px;background:var(--line)}
  .stepno{flex:0 0 22px;width:22px;height:22px;border-radius:999px;background:var(--accent);color:#fff;font:800 11px var(--mono);display:flex;align-items:center;justify-content:center;margin-top:-1px}
  .tag.toggle{cursor:pointer;background:var(--accent-bg);color:var(--accent-ink);border:1px solid var(--line)}
  .tag.toggle:hover{border-color:var(--accent)}
  .tkids{margin:-4px 0 9px 24px;border-left:2px solid var(--line);padding-left:11px}
  .tkids .rec{margin-bottom:6px}
  /* full outline — whole pipeline on one page */
  .outline{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,420px);gap:0;align-items:start}
  .outcol{padding:10px 16px 60px;min-width:0}
  .outdet{position:sticky;top:var(--toph,56px);align-self:start;border-left:1px solid var(--line);background:var(--panel);max-height:calc(100vh - var(--toph,56px));overflow:auto}
  .outdetinner{padding:16px}
  .ostage{margin:0 0 10px;padding:14px 0 6px;border-top:2px solid var(--sc,var(--line));scroll-margin-top:calc(var(--toph,56px) + 12px)}
  .ostage:first-child{border-top:none}
  .ostagehd{display:flex;align-items:center;gap:10px;margin-bottom:4px;position:sticky;top:var(--toph,56px);background:var(--bg);padding:6px 0;z-index:2;cursor:pointer;border-radius:8px}
  .ostagehd:hover{background:var(--chip)}
  .ostagehd.sel{box-shadow:inset 0 0 0 2px var(--sc,var(--accent))}
  .ochips{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 8px}
  .gchip{font:600 11px var(--mono);border-radius:6px;padding:3px 8px;cursor:pointer;white-space:nowrap;border:1px solid transparent}
  .gchip.gate{background:rgba(99,102,241,.12);color:var(--gate);border-color:rgba(99,102,241,.35)}
  .gchip.fb{background:var(--chip);color:var(--chip-ink)}
  .gchip:hover{filter:brightness(.96);text-decoration:underline}
  .ostagehd .on{width:24px;height:24px;border-radius:999px;background:var(--sc,var(--accent));color:#fff;font:800 12px var(--mono);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ostagehd .onm{font-weight:800;font-size:15.5px;letter-spacing:-.01em;flex:1}
  .ostagehd .oct{font:800 12px var(--mono);color:var(--muted);background:var(--chip);border-radius:999px;padding:2px 10px}
  .ostagedesc{font-size:12.5px;color:var(--muted);margin:0 2px 11px;line-height:1.5}
  .ostage.flash{animation:flashhd 0.9s ease}
  @keyframes flashhd{0%,25%{box-shadow:inset 3px 0 0 var(--sc,var(--accent)),-3px 0 0 var(--sc,var(--accent))}100%{box-shadow:none}}
  @media(max-width:820px){.outline{grid-template-columns:1fr}.outdet{position:static;max-height:none;border-left:none;border-top:1px solid var(--line)}}
  .rec .rl{font-weight:700;font-size:13.5px;flex:1;letter-spacing:-.01em}
  .rec .tag{font:600 10px var(--mono);border-radius:5px;padding:1px 6px;white-space:nowrap;background:var(--chip);color:var(--chip-ink)}
  .wf{font:700 10px var(--mono);border-radius:5px;padding:1px 6px;white-space:nowrap}
  .wf.human{background:color-mix(in srgb,var(--human) 16%,transparent);color:var(--human)}
  .wf.agent{background:color-mix(in srgb,var(--agent) 18%,transparent);color:var(--agent)}
  .rec .ra{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px 10px}
  .rec .ra .kv{font-size:11.5px;color:var(--muted)}
  .rec .ra .kv b{color:var(--ink);font-weight:700}
  .empty{color:var(--muted);font-size:13px;padding:20px 4px}
  .rgrp{margin-bottom:8px}
  .rgrphdr{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;cursor:pointer;user-select:none}
  .rgrphdr:hover{border-color:var(--accent)}
  .rgrphdr.open{border-bottom-left-radius:0;border-bottom-right-radius:0}
  .rgrphdr .cv{font-size:11px;color:var(--muted);width:11px}
  .rgrphdr .gl{font-weight:800;font-size:13px;flex:1}
  .rgrphdr .gc{font:800 12px var(--mono);color:var(--muted);background:var(--chip);border-radius:999px;padding:1px 9px}
  .rgrpbody{border:1px solid var(--line);border-top:none;border-radius:0 0 9px 9px;padding:9px 9px 3px}
  /* detail */
  .dhd{font-size:16px;font-weight:800;letter-spacing:-.01em;margin:4px 0 2px}
  .dmeta{font-size:12px;color:var(--muted);margin-bottom:10px}
  .ddef{font-size:13px;line-height:1.55;margin:0 0 14px;padding:10px 12px;background:var(--panel2);border-radius:9px;border:1px solid var(--line2)}
  .sec{font:800 10.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 7px}
  table.attr{width:100%;border-collapse:collapse;font-size:12.5px}
  table.attr td{padding:5px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
  table.attr td.k{color:var(--muted);width:44%;font-weight:600}
  table.attr td.v{color:var(--ink);font-weight:600}
  .lnk{display:flex;align-items:center;gap:7px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--panel)}
  .lnk:hover{border-color:var(--accent);background:var(--panel2)}
  .lnk .verb{font:700 10px var(--mono);color:var(--accent-ink);background:var(--accent-bg);border-radius:5px;padding:1px 6px;white-space:nowrap}
  .lnk .verb.in{color:var(--muted);background:var(--chip)}
  .lnk .lt{font-size:12.5px;font-weight:700;flex:1}
  .lnk .ls{font:600 9.5px var(--mono);color:var(--muted)}
  .anchor{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:0 6px 6px 0}
  .anchor .ad{width:8px;height:8px;border-radius:999px;background:var(--ok)}
  .tracebtn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--accent);background:var(--accent-bg);color:var(--accent-ink);border-radius:9px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-top:4px}
  .tracebtn:hover{filter:brightness(1.04)}
  /* thread view */
  .thread{padding:4px 16px 50px}
  .threadhd{display:flex;align-items:center;gap:10px;margin:8px 0 4px;flex-wrap:wrap}
  .threadhd h2{font-size:15px;margin:0}
  .closex{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer}
  .tstage{margin:14px 0 2px;display:flex;align-items:center;gap:8px}
  .tstage .tn{width:21px;height:21px;border-radius:999px;background:var(--sc,var(--accent));color:#fff;font:800 11px var(--mono);display:flex;align-items:center;justify-content:center}
  .tstage .tnm{font-weight:800;font-size:12.5px}
  .tstage .tl{flex:1;height:1px;background:var(--line)}
  .trow{margin:5px 0 5px 29px;padding:8px 11px;border:1px solid var(--line);border-left:3px solid var(--sc,var(--accent));border-radius:8px;background:var(--panel);cursor:pointer}
  .trow:hover{border-color:var(--accent)}
  .trow.focusnode{box-shadow:0 0 0 2px var(--accent-bg)}
  .trow .tll{font-weight:700;font-size:13px}
  .trow .tty{font:600 10px var(--mono);color:var(--muted)}
  /* status / diagnostics (shared with explorer) */
  .status{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .status .box{max-width:620px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px 24px}
  .status h3{margin:0 0 4px;font-size:16px}
  .status p{margin:0 0 12px;color:var(--muted);font-size:13px}
  .diag{font:12px/1.55 var(--mono);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;max-height:300px;overflow:auto;white-space:pre-wrap;color:var(--ink)}
  .diag .ok{color:var(--ok)}.diag .bad{color:var(--warn)}.diag .warn{color:#b8742a}.diag .dim{color:var(--muted)}
  .verdict{margin-top:12px;font-size:13px;padding:11px 13px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
  .verdict.bad{border-color:var(--warn);color:var(--warn)}.verdict.ok{border-color:var(--ok);color:var(--ok)}
  #tokenBox{margin-top:12px}
  #tokenBox input{width:100%;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:9px 12px;font:inherit;font-size:13px}
  .statusBtns{display:flex;gap:8px;margin-top:12px}
  .statusBtns button{border:1.5px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:8px 15px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .statusBtns button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  @media(max-width:760px){
    .main{grid-template-columns:1fr}
    .col.recs{border-right:none;border-bottom:1px solid var(--line)}
    .stagecard{min-width:150px;flex:0 0 auto}
  }
</style>
</head>
<body>
  <div class="top">
    <div>
      <div class="ttl">Data &amp; AI Talent Strategy <span class="badge" id="ver">v1.0.0</span></div>
      <div class="sub">Reusable 8-stage framework · closed loop · live from the CA&amp;I ontology</div>
    </div>
    <div class="layertog" id="layertog">
      <button data-layer="template" class="on">Framework template</button>
      <button data-layer="example">Worked example</button>
      <button data-layer="glossary">Glossary</button>
    </div>
    <div class="search">
      <input id="q" type="text" placeholder="Search…" autocomplete="off">
      <div class="results" id="results"></div>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="loopwrap"><div class="loop" id="loop"></div></div>
  <div class="refresh" id="refresh"></div>
  <div class="govbar" id="govbar"></div>

  <div id="app"></div>
  <div id="defpop"></div>

  <div class="status" id="status"><div class="box">
    <h3 id="statusTitle">Loading pipeline…</h3>
    <p id="statusMsg">Connecting to the private repository…</p>
    <pre id="diagLog" class="diag" aria-live="polite"></pre>
    <p id="verdict" class="verdict" style="display:none"></p>
    <div id="tokenBox" style="display:none">
      <input id="tokenIn" type="password" placeholder="Paste your fine-grained PAT (Contents: Read)">
      <div class="statusBtns"><button id="tokenSave">Connect &amp; load</button></div>
    </div>
    <div class="statusBtns" id="diagBtns" style="display:none">
      <button id="retryBtn">Retry</button>
      <button id="copyBtn" class="ghost">Copy diagnostics</button>
      <button id="tokenToggle" class="ghost">Change token</button>
    </div>
  </div></div>

<script>
document.getElementById('ver').textContent='v'+document.querySelector('meta[name="version"]').content;
// keep the sticky detail panel and stage headers tucked BELOW the sticky toolbar (its height varies when it wraps)
function syncTopVar(){ const t=document.querySelector('.top'); if(t)document.documentElement.style.setProperty('--toph',Math.round(t.getBoundingClientRect().height)+'px'); }
syncTopVar(); window.addEventListener('resize',syncTopVar);
if(window.ResizeObserver){ const ro=new ResizeObserver(syncTopVar); const tb=document.querySelector('.top'); if(tb)ro.observe(tb); }
const TOKEN_KEY=(new URLSearchParams(location.search).get('tokenKey'))||'mdaReadiness.ghpat';
const SRC=(new URLSearchParams(location.search).get('data'))||((document.querySelector('meta[name="ontology-src"]')||{}).content||'');

function getToken(){try{return localStorage.getItem(TOKEN_KEY)||'';}catch(e){return'';}}
function resolveSrc(base){
  if(base.indexOf('gh:')===0){
    var r=base.slice(3),ref='main',at=r.lastIndexOf('@');if(at>0){ref=r.slice(at+1);r=r.slice(0,at);}
    var a=r.split('/'),ow=a.shift(),rp=a.shift(),pa=a.join('/');
    return {gh:true,owner:ow,repo:rp,ref:ref,path:pa};
  }
  return {gh:false,base:base.replace(/\/$/,'')};
}
const SRCINFO=resolveSrc(SRC);
function fileUrl(file){
  if(SRCINFO.gh){ return 'https://api.github.com/repos/'+SRCINFO.owner+'/'+SRCINFO.repo+'/contents/'+SRCINFO.path+'/'+file+'?ref='+encodeURIComponent(SRCINFO.ref); }
  return SRCINFO.base+'/'+file;
}
function ghHeaders(raw){
  var tk=getToken(), h={'Accept':raw?'application/vnd.github.raw':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(tk)h['Authorization']='Bearer '+tk; return h;
}
async function probe(url,opts){
  var out={url:url,ok:false,status:0,threw:false,error:'',body:'',json:null};
  try{
    var r=await fetch(url,opts);
    out.status=r.status; out.ok=r.ok;
    var txt=await r.text(); out.body=txt;
    try{out.json=JSON.parse(txt);}catch(e){}
  }catch(e){ out.threw=true; out.error=(e&&e.message)||String(e); }
  return out;
}

// ---------- model ----------
const M={ent:new Map(),type:new Map(),rtype:new Map(),facet:new Map(),out:new Map(),inc:new Map()};
function buildModel(ds){
  (ds.entityTypes.items).forEach(t=>M.type.set(t.id,t));
  (ds.relationshipTypes.items).forEach(t=>M.rtype.set(t.id,t));
  ((ds.facets&&ds.facets.items)||[]).forEach(f=>M.facet.set(f.id,f));
  (ds.entities.items).forEach(e=>{M.ent.set(e.id,e);M.out.set(e.id,[]);M.inc.set(e.id,[]);});
  (ds.relationships.items).forEach(r=>{ if(M.out.has(r.sourceEntityId))M.out.get(r.sourceEntityId).push(r); if(M.inc.has(r.targetEntityId))M.inc.get(r.targetEntityId).push(r); });
}
const labelOf=id=>{const e=M.ent.get(id);return (e&&e.preferredLabel)||id;};
const typeOf=id=>{const e=M.ent.get(id);return e?e.entityTypeId:null;};
const typeLabel=tid=>{const t=M.type.get(tid);return t?t.label:(tid||'').replace(/^type:/,'');};
const rtypeLabel=rid=>{const t=M.rtype.get(rid);return (t&&t.label)||(rid||'').replace(/^rel:/,'').replace(/-/g,' ');};
// an INCOMING edge reads in the inverse direction: X --precedes--> this  ⇒  this "follows" X
const rtypeInverse=rid=>{const t=M.rtype.get(rid);return (t&&(t.inverseLabel||t.label))||(rid||'').replace(/^rel:/,'').replace(/-/g,' ');};

// ---------- talent domain ----------
const FACET='facet:talent-strategy';
const hasFacet=(e,f)=>Array.isArray(e.facetIds)&&e.facetIds.indexOf(f)>=0;
const MEMBER=()=>[...M.ent.values()].filter(e=>hasFacet(e,FACET));
const STAGE_META={
  '1':{nm:'Data & AI Strategy Inputs',sc:'--s1',desc:'Strategic objectives, target outcomes and the operating-model, risk and technology context that drive the talent plan.'},
  '2':{nm:'Work Decomposition',sc:'--s2',desc:'Objectives become outcomes, value streams, portfolio initiatives, deliverables and tasks/activities.'},
  '3':{nm:'Talent Requirements',sc:'--s3',desc:'Tasks generate the role families, skills/behaviours, SFIA proficiency, experience, required capacity (effort-hours at SFIA level) and sourcing constraints needed.'},
  '4':{nm:'Current Talent Baseline',sc:'--s4',desc:'Today’s role coverage, skill distribution, validated evidence, availability, career level and attrition/retention risk.'},
  '5':{nm:'Gap Engine',sc:'--s5',desc:'Required minus current — the Capacity Gap, the Capability Gap, and the Prioritised Gap Register that ranks them.'},
  '6':{nm:'Desired Development Plan',sc:'--s6',desc:'Target role profile, goals, learning pathway, stretch work, rotations, mentoring, certification, evidence and review gates.'},
  '7':{nm:'Intervention Portfolio',sc:'--s7',desc:'Build, hire, contract, redeploy, retain, redesign or automate/augment — each closing a prioritised gap.'},
  '8':{nm:'Outcome & Refresh',sc:'--s8',desc:'Capability and critical-role coverage, time-to-capability, progression, mobility, retention, intervention effectiveness and business contribution — feeding the loop back.'}
};
// relationship types that are genuine traceability edges (exclude stage membership)
const TRACE_SKIP={'rel:contains':1};
function traceOut(id){return (M.out.get(id)||[]).filter(r=>!TRACE_SKIP[r.relationshipTypeId]);}
function traceIn(id){return (M.inc.get(id)||[]).filter(r=>!TRACE_SKIP[r.relationshipTypeId]);}
function stageOfId(id){ // find the stage number via inbound rel:contains
  const r=(M.inc.get(id)||[]).find(x=>x.relationshipTypeId==='rel:contains');
  if(r){const s=M.ent.get(r.sourceEntityId);const m=s&&(s.id.match(/stage:(\d+)/));if(m)return m[1];}
  const e=M.ent.get(id);if(e&&e.attributes&&e.attributes.stage)return String(e.attributes.stage);
  return null;
}
const isGate=id=>typeOf(id)==='type:governance-gate';
const wfOf=e=>{const w=(e.attributes||{}).workforce;if(w==='Human')return'human';if(w==='Agent')return'agent';
  const t=e.entityTypeId;if(t==='type:agent-role'||t==='type:autonomy-level')return'agent';return null;};

// ---------- state ----------
const S={stage:'1',rec:null,thread:null,layer:'template',openGroups:new Set(),openSteps:new Set()};
const layerOf=e=>(e.attributes||{}).layer;

// ---------- render: loop ----------
// Template layer = the reusable framework (stage --has-step--> element). Example layer = the FNOL worked example (stage --contains--> instance).
function stageRecords(n){
  const st=M.ent.get('e:ts:stage:'+n); if(!st)return [];
  const relId = S.layer==='template' ? 'rel:has-step' : 'rel:contains';
  const recs=(M.out.get(st.id)||[]).filter(r=>r.relationshipTypeId===relId).map(r=>M.ent.get(r.targetEntityId)).filter(Boolean)
    .filter(e=>S.layer==='template' ? layerOf(e)==='template' : layerOf(e)==='example');
  // template steps are SEQUENTIAL — order by ord, never alphabetically
  if(S.layer==='template') recs.sort((a,b)=>((a.attributes||{}).ord||0)-((b.attributes||{}).ord||0));
  return recs;
}
function councils(){return MEMBER().filter(e=>e.entityTypeId==='type:ts-council');}
function exampleGates(){return MEMBER().filter(e=>e.entityTypeId==='type:governance-gate'||e.entityTypeId==='type:control');}
// which governance council gates this stage (G1→1, G2→3, G3→6, G4→7)
function gateForStage(n){ const r=(M.inc.get('e:ts:stage:'+n)||[]).find(x=>x.relationshipTypeId==='rel:gates-stage');
  if(!r)return null; const c=M.ent.get(r.sourceEntityId); return c?{id:c.id,label:c.preferredLabel,gate:(c.attributes||{}).gate}:null; }
// feedback-loop edges on a stage: stage 8 refines 1 & 3; 1 & 3 are refined by 8
function feedbackForStage(n){ const st='e:ts:stage:'+n;
  const out=(M.out.get(st)||[]).filter(x=>x.relationshipTypeId==='rel:refines').map(x=>x.targetEntityId);
  const inc=(M.inc.get(st)||[]).filter(x=>x.relationshipTypeId==='rel:refines').map(x=>x.sourceEntityId);
  return {out,inc}; }
const stageNum=id=>{const m=(id||'').match(/^e:ts:stage:(\d+)$/);return m?m[1]:null;};
function renderLoop(){
  const loop=document.getElementById('loop'); loop.innerHTML='';
  for(let i=1;i<=8;i++){
    const recs=stageRecords(i), meta=STAGE_META[i];
    const types={}; recs.forEach(e=>{const tl=typeLabel(e.entityTypeId);types[tl]=(types[tl]||0)+1;});
    const c=document.createElement('div'); c.className='stagecard'+(S.stage===String(i)&&!S.thread&&S.gov!==true?' on':''); c.style.setProperty('--sc','var('+meta.sc+')');
    c.dataset.stage=i;
    const unit=S.layer==='template'?'step':'record';
    c.innerHTML='<div class="no">'+i+'</div>'+(i<8?'<div class="arrow"></div>':'')+
      '<div class="snm">'+meta.nm+'</div>'+
      '<div class="scount">'+recs.length+' <small>'+unit+(recs.length===1?'':'s')+'</small></div>'+
      (S.layer==='template'
        ? '<div class="stypes">'+recs.map(e=>'<span class="tt">'+esc(e.preferredLabel)+'</span>').join('')+'</div>'
        : '<div class="stypes">'+Object.entries(types).map(([k,v])=>'<span class="tt">'+k+' '+v+'</span>').join('')+'</div>');
    loop.appendChild(c);
  }
  // refresh / feedback band
  const ref=document.getElementById('refresh');
  ref.innerHTML='↻ &nbsp;<b>Feedback loop</b>&nbsp; — Stage 8 outcomes feed back to <b>Stage 1</b> (update strategy inputs) and <b>Stage 3</b> (refine talent requirements)';
  // governance band — councils (template) or worked-example gates (example)
  const gb=document.getElementById('govbar');
  gb.className='govbar'+(S.gov===true?' on':'');
  if(S.layer==='template'){
    gb.innerHTML='<span class="glbl">⚖ Governance gates</span><span class="gnote">four approval councils — Strategy &amp; Portfolio (G1) · Data &amp; AI Capability (G2) · Workforce / Talent (G3) · Risk / Finance (G4)</span><span class="gcount">'+councils().length+'</span>';
  }else{
    gb.innerHTML='<span class="glbl">⚖ Agent governance &amp; controls</span><span class="gnote">worked example · cross-cutting approval gates + agent control domains (design, deployment, autonomy, controls/evidence)</span><span class="gcount">'+exampleGates().length+'</span>';
  }
}

// ---------- render: records column ----------
function attrLine(e){
  const a=e.attributes||{}; const keys=Object.keys(a).filter(k=>k!=='stage'&&k!=='ka');
  const pick=keys.slice(0,4);
  return pick.map(k=>'<span class="kv">'+humanKey(k)+' <b>'+esc(String(a[k]))+'</b></span>').join('');
}
function humanKey(k){return k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()).replace(/Fte/,'FTE').replace(/Kpi/,'KPI');}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function recCard(e,sel){
  const wf=wfOf(e); const a=e.attributes||{};
  if(e.entityTypeId==='type:ts-element'){
    const ext=a.termSource==='external';
    const kids=(M.out.get(e.id)||[]).filter(r=>r.relationshipTypeId==='rel:has-step').length;
    const note=(e.definition||'').replace(/^— /,'');
    const ord=a.ord?('<span class="stepno">'+a.ord+'</span>'):'';
    return '<div class="rec step'+(sel?' sel':'')+'" data-rec="'+e.id+'">'+
      '<div class="rh">'+ord+'<span class="rl">'+esc(e.preferredLabel)+hlp({elId:e.id,label:e.preferredLabel})+'</span>'+
      (ext?'<span class="src ext">external</span>':'<span class="src loc">local</span>')+
      (kids?'<span class="tag">'+kids+' factors</span>':'')+'</div>'+
      (note?'<div class="ra"><span class="kv">'+esc(note)+'</span></div>':'')+'</div>';
  }
  return '<div class="rec'+(sel?' sel':'')+'" data-rec="'+e.id+'">'+
    '<div class="rh"><span class="rl">'+esc(e.preferredLabel)+'</span>'+
    (wf?'<span class="wf '+wf+'">'+(wf==='human'?'Human':'Agent')+'</span>':'')+
    '<span class="tag">'+typeLabel(e.entityTypeId)+hlp({typeId:e.entityTypeId})+'</span></div>'+
    '<div class="ra">'+attrLine(e)+'</div></div>';
}
// collapsible grouping of the record column. Example layer → group by type; template → flat (matches the image).
// a template step that has has-step children (e.g. the Prioritised Gap Register → 7 factors) renders expandable, children nested.
function renderTemplateStep(e,sel,expandAll){
  const a=e.attributes||{};
  const kids=(M.out.get(e.id)||[]).filter(r=>r.relationshipTypeId==='rel:has-step').map(r=>M.ent.get(r.targetEntityId)).filter(Boolean)
    .sort((x,y)=>((x.attributes||{}).ord||0)-((y.attributes||{}).ord||0));
  if(!kids.length) return recCard(e,e.id===sel);
  const open=expandAll||S.openSteps.has(e.id)||kids.some(k=>k.id===sel);
  const ext=a.termSource==='external'; const note=(e.definition||'').replace(/^— /,''); const ord=a.ord?('<span class="stepno">'+a.ord+'</span>'):'';
  return '<div class="rec step'+(e.id===sel?' sel':'')+'" data-rec="'+e.id+'">'+
      '<div class="rh">'+ord+'<span class="rl">'+esc(e.preferredLabel)+hlp({elId:e.id,label:e.preferredLabel})+'</span>'+
      (ext?'<span class="src ext">external</span>':'<span class="src loc">local</span>')+
      '<span class="tag toggle" data-step="'+e.id+'">'+(open?'▾':'▸')+' '+kids.length+' factors</span></div>'+
      (note?'<div class="ra"><span class="kv">'+esc(note)+'</span></div>':'')+'</div>'+
    '<div class="tkids"'+(open?'':' style="display:none"')+'>'+kids.map(k=>recCard(k,k.id===sel)).join('')+'</div>';
}
function renderRecList(recs, sel, ctx, expandAll){
  if(!recs.length) return '<div class="empty">No records here.</div>';
  if(S.layer!=='example'){ return recs.map(e=>renderTemplateStep(e,sel,expandAll)).join(''); }
  const m=new Map(); recs.forEach(e=>{const k=typeLabel(e.entityTypeId); if(!m.has(k))m.set(k,[]); m.get(k).push(e);});
  const groups=[...m.entries()];
  if(groups.length<=1){ return recs.map(e=>recCard(e,e.id===sel)).join(''); }
  return groups.map(([label,items])=>{
    const key=ctx+'|'+label;
    const open=expandAll||S.openGroups.has(key)||items.some(e=>e.id===sel);
    return '<div class="rgrp"><div class="rgrphdr'+(open?' open':'')+'" data-grp="'+esc(key)+'"><span class="cv">'+(open?'▾':'▸')+'</span><span class="gl">'+esc(label)+'</span><span class="gc">'+items.length+'</span></div>'+
      '<div class="rgrpbody"'+(open?'':' style="display:none"')+'>'+items.map(e=>recCard(e,e.id===sel)).join('')+'</div></div>';
  }).join('');
}
// Full outline: every stage (and governance) on ONE page, everything expanded. Clicking a node only updates the detail.
function stageSection(n){
  const meta=STAGE_META[n]; const recs=stageRecords(n); const stageId='e:ts:stage:'+n;
  const body = recs.length ? renderRecList(recs, S.rec, 's'+n, true) : '<div class="empty">No records.</div>';
  // governance gate + feedback-loop chips, shown inline on the stage header (template layer carries these)
  let chips='';
  if(S.layer==='template'){
    const g=gateForStage(n);
    if(g) chips+='<span class="gchip gate" data-rec="'+g.id+'" title="Governance gate before this stage">⚖ '+esc(g.gate||'Gate')+' · '+esc(g.label)+'</span>';
    const fb=feedbackForStage(n);
    if(fb.out.length) chips+='<span class="gchip fb" data-rec="'+fb.out[0]+'" title="Feedback loop — this stage feeds back">↻ feeds back → '+fb.out.map(t=>'Stage '+stageNum(t)).join(', ')+'</span>';
    if(fb.inc.length) chips+='<span class="gchip fb" data-rec="'+fb.inc[0]+'" title="Feedback loop — refined by later outcomes">↻ refined by '+fb.inc.map(t=>'Stage '+stageNum(t)).join(', ')+'</span>';
  }
  const hdSel = S.rec===stageId ? ' sel' : '';
  return '<div class="ostage" id="ostage-'+n+'" style="--sc:var('+meta.sc+')">'+
    '<div class="ostagehd'+hdSel+'" data-rec="'+stageId+'" title="Open this stage — see its gate, sequence and feedback links"><span class="on">'+n+'</span><span class="onm">'+esc(meta.nm)+'</span><span class="oct">'+recs.length+'</span></div>'+
    (chips?'<div class="ochips">'+chips+'</div>':'')+
    '<div class="ostagedesc">'+meta.desc+'</div>'+body+'</div>';
}
function govSection(){
  let recs,title,desc;
  if(S.layer==='template'){ recs=councils().sort((a,b)=>((a.attributes||{}).gate||'').localeCompare((b.attributes||{}).gate||''));
    title='Governance councils'; desc='Four stage-approval councils gate the loop (G1–G4).'; }
  else { recs=exampleGates().sort((a,b)=>a.id.localeCompare(b.id)); title='Governance & controls'; desc='Cross-cutting approval gates + agent control domains.'; }
  if(!recs.length) return '';
  return '<div class="ostage" id="ostage-gov" style="--sc:var(--gate)"><div class="ostagehd"><span class="on">⚖</span><span class="onm">'+title+'</span><span class="oct">'+recs.length+'</span></div>'+
    '<div class="ostagedesc">'+desc+'</div>'+recs.map(e=>recCard(e,e.id===S.rec)).join('')+'</div>';
}
function renderApp(){
  const app=document.getElementById('app');
  if(S.thread){ renderThread(); return; }
  let left=''; for(let n=1;n<=8;n++) left+=stageSection(n); left+=govSection();
  app.className=''; app.innerHTML=
    '<div class="outline">'+
      '<div class="outcol">'+left+'</div>'+
      '<div class="outdet"><div class="outdetinner" id="outdetinner">'+renderDetail(S.rec)+'</div></div>'+
    '</div>';
}

// ---------- render: detail ----------
const ANCHOR_NOTE={
  'e:strat':'CA&I · Business Strategy',
  'e:bcap':'CA&I · Business Capability',
  'e:role':'CA&I · Role concept',
  'e:cai':'CA&I · Continuous Assessment & Improvement',
  'e:outcome':'CA&I · Strategy Outcome',
  'e:mscale':'CA&I · Mastery Scale',
  'e:mastery-concept':'CA&I · Mastery concept'
};
function renderDetail(id){
  if(!id) return '<div class="empty">Select a record to see its attributes and how it traces through the loop.</div>';
  const e=M.ent.get(id); if(!e) return '<div class="empty">Not found.</div>';
  const wf=wfOf(e); const stg=stageOfId(id);
  let h='<div class="dhd">'+esc(e.preferredLabel)+'</div>';
  h+='<div class="dmeta">'+typeLabel(e.entityTypeId)+hlp({typeId:e.entityTypeId,elId:e.id})+(stg?' · Stage '+stg+' · '+STAGE_META[stg].nm:(isGate(id)?' · Governance (cross-cutting)':''))+(wf?' · '+(wf==='human'?'Human workforce':'Agent workforce'):'')+'</div>';
  if(e.definition) h+='<div class="ddef">'+esc(e.definition)+'</div>';
  // attributes (hide internal layer bookkeeping)
  const a=e.attributes||{}; const HIDE={stage:1,layer:1,ord:1};
  const keys=Object.keys(a).filter(k=>!HIDE[k]);
  if(keys.length){
    h+='<div class="sec">Attributes</div><table class="attr">'+keys.map(k=>'<tr><td class="k">'+humanKey(k)+hlp({label:humanKey(k)})+'</td><td class="v">'+esc(String(a[k]))+'</td></tr>').join('')+'</table>';
  }
  // links
  const isStage=!!stageNum(id); // a stage's has-step children are the steps shown inline below — don't repeat them here
  const out=traceOut(id).filter(r=>!(isStage&&r.relationshipTypeId==='rel:has-step'));
  const inc=traceIn(id);
  const traceLinks=[], anchors=[];
  out.forEach(r=>{ const t=r.targetEntityId;
    if(ANCHOR_NOTE[t]||!hasFacet(M.ent.get(t)||{},FACET)&&!isGate(t)){
      if(ANCHOR_NOTE[t]) anchors.push(t);
      else traceLinks.push({dir:'out',verb:rtypeLabel(r.relationshipTypeId),to:t});
    } else traceLinks.push({dir:'out',verb:rtypeLabel(r.relationshipTypeId),to:t});
  });
  inc.forEach(r=>{ traceLinks.push({dir:'in',verb:rtypeInverse(r.relationshipTypeId),to:r.sourceEntityId}); });
  if(anchors.length){
    h+='<div class="sec">Anchored to the CA&I roadmap</div>';
    h+=anchors.map(t=>'<span class="anchor"><span class="ad"></span>'+esc(labelOf(t))+' <span class="ls">'+(ANCHOR_NOTE[t]||'')+'</span></span>').join('');
  }
  const navLinks=traceLinks.filter(l=>M.ent.get(l.to));
  if(navLinks.length){
    h+='<div class="sec">Traceability</div>';
    h+=navLinks.map(l=>{
      const te=M.ent.get(l.to);
      return '<div class="lnk" data-rec="'+l.to+'"><span class="verb'+(l.dir==='in'?' in':'')+'">'+(l.dir==='in'?'← ':'→ ')+esc(l.verb)+'</span><span class="lt">'+esc(te.preferredLabel)+'</span><span class="ls">'+typeLabel(te.entityTypeId)+'</span></div>';
    }).join('');
  }
  // "Trace the full thread" only makes sense on the worked-example instances (they carry the cross-stage chain)
  if(layerOf(e)==='example'){
    h+='<div style="margin-top:16px"><button class="tracebtn" data-trace="'+id+'">⛓ Trace the full thread</button></div>';
  }
  return h;
}

// ---------- thread (full connected trace, ordered by stage) ----------
function computeThread(seed){
  const seen=new Set([seed]), q=[seed];
  while(q.length){ const cur=q.shift();
    traceOut(cur).forEach(r=>{ const t=r.targetEntityId; const te=M.ent.get(t);
      if(te&&(hasFacet(te,FACET)) && !seen.has(t)){seen.add(t);q.push(t);} });
    traceIn(cur).forEach(r=>{ const s=r.sourceEntityId; const se=M.ent.get(s);
      if(se&&(hasFacet(se,FACET)) && !seen.has(s)){seen.add(s);q.push(s);} });
  }
  return [...seen];
}
function renderThread(){
  const app=document.getElementById('app');
  const seed=S.thread, ids=computeThread(seed);
  // group by stage (gates separate)
  const byStage={}; const gates=[];
  ids.forEach(id=>{ if(isGate(id)){gates.push(id);return;} const s=stageOfId(id)||'?'; (byStage[s]=byStage[s]||[]).push(id); });
  let h='<div class="thread"><div class="threadhd"><h2>Thread through the loop</h2><button class="closex" id="closeThread">✕ Close thread</button></div>'+
    '<div class="stagedesc">Every record connected to <b>'+esc(labelOf(seed))+'</b> by a traceability link, laid out in loop order. Click any record to inspect it.</div>';
  for(let i=1;i<=8;i++){ const g=byStage[String(i)]; if(!g||!g.length)continue;
    const meta=STAGE_META[i];
    h+='<div class="tstage"><span class="tn" style="background:var('+meta.sc+')">'+i+'</span><span class="tnm">'+meta.nm+'</span><span class="tl"></span></div>';
    h+=g.sort((a,b)=>a.localeCompare(b)).map(id=>{const e=M.ent.get(id);
      return '<div class="trow'+(id===seed?' focusnode':'')+'" style="--sc:var('+meta.sc+')" data-rec="'+id+'"><span class="tll">'+esc(e.preferredLabel)+'</span> <span class="tty">'+typeLabel(e.entityTypeId)+'</span></div>';}).join('');
  }
  if(gates.length){
    h+='<div class="tstage"><span class="tn" style="background:var(--gate)">⚖</span><span class="tnm">Governance gates</span><span class="tl"></span></div>';
    h+=gates.map(id=>{const e=M.ent.get(id);return '<div class="trow" style="--sc:var(--gate)" data-rec="'+id+'"><span class="tll">'+esc(e.preferredLabel)+'</span> <span class="tty">'+typeLabel(e.entityTypeId)+'</span></div>';}).join('');
  }
  h+='</div>';
  app.innerHTML=h;
  document.getElementById('closeThread').addEventListener('click',()=>{S.thread=null;renderLoop();renderApp();});
}

// ---------- interaction ----------
function selectRec(id){
  if(S.thread){ S.thread=id; renderThread(); return; }
  S.rec=id;
  // outline mode: update ONLY the detail panel + highlight — never re-render the tree, so scroll/context is kept
  const di=document.getElementById('outdetinner');
  if(di){ di.innerHTML=renderDetail(id);
    const panel=di.closest('.outdet'); if(panel)panel.scrollTop=0; // always show the title, never leave it scrolled past
    document.querySelectorAll('#app .sel').forEach(x=>x.classList.remove('sel'));
    document.querySelectorAll('#app .rec[data-rec="'+CSS.escape(id)+'"], #app .ostagehd[data-rec="'+CSS.escape(id)+'"]').forEach(el=>el.classList.add('sel'));
    return;
  }
  renderApp();
}
document.getElementById('layertog').addEventListener('click',ev=>{const b=ev.target.closest('button[data-layer]');if(!b)return;
  if(S.layer===b.dataset.layer)return; S.layer=b.dataset.layer; S.rec=null; S.thread=null; S.openGroups.clear(); S.openSteps.clear();
  [...document.querySelectorAll('#layertog button')].forEach(x=>x.classList.toggle('on',x.dataset.layer===S.layer));
  renderAll();});
// the loop band is now a MAP of the one-page outline: a click scrolls to the section, it never re-renders (so you keep context)
function scrollToSection(sel){ const t=document.querySelector(sel); if(!t)return; t.scrollIntoView({behavior:'smooth',block:'start'}); t.classList.add('flash'); setTimeout(()=>t.classList.remove('flash'),900); }
document.getElementById('loop').addEventListener('click',ev=>{const c=ev.target.closest('.stagecard');if(!c)return;
  if(S.thread||S.layer==='glossary'){S.thread=null;if(S.layer==='glossary'){S.layer='template';[...document.querySelectorAll('#layertog button')].forEach(x=>x.classList.toggle('on',x.dataset.layer==='template'));}renderAll();}
  S.stage=c.dataset.stage; renderLoop(); scrollToSection('#ostage-'+c.dataset.stage);});
document.getElementById('govbar').addEventListener('click',()=>{
  if(S.thread||S.layer==='glossary'){S.thread=null;if(S.layer==='glossary'){S.layer='template';[...document.querySelectorAll('#layertog button')].forEach(x=>x.classList.toggle('on',x.dataset.layer==='template'));}renderAll();}
  S.gov=true; renderLoop(); scrollToSection('#ostage-gov');});
document.getElementById('app').addEventListener('click',ev=>{
  const hp=ev.target.closest('.hlp'); if(hp){ ev.stopPropagation(); showDef(hp.dataset.def,hp); return; }
  // collapse/expand in place — flip the sibling container + chevron, never re-render (keeps scroll position)
  const st=ev.target.closest('[data-step]'); if(st){ ev.stopPropagation(); const card=st.closest('.rec'); const body=card&&card.nextElementSibling;
    if(body&&body.classList.contains('tkids')){ const show=body.style.display==='none'; body.style.display=show?'':'none'; st.textContent=st.textContent.replace(/^[▾▸]/,show?'▾':'▸'); } return; }
  const gh=ev.target.closest('[data-grp]'); if(gh){ const body=gh.nextElementSibling; if(body&&body.classList.contains('rgrpbody')){ const show=body.style.display==='none'; body.style.display=show?'':'none'; gh.classList.toggle('open',show); const cv=gh.querySelector('.cv'); if(cv)cv.textContent=show?'▾':'▸'; } return; }
  const tr=ev.target.closest('[data-trace]'); if(tr){S.thread=tr.dataset.trace;renderLoop();renderThread();return;}
  const rc=ev.target.closest('[data-rec]'); if(rc){selectRec(rc.dataset.rec);}
});
// dismiss the definition popover on any outside click
document.addEventListener('click',ev=>{ if(!ev.target.closest('.hlp')&&!ev.target.closest('#defpop')){ const p=document.getElementById('defpop'); if(p)p.style.display='none'; } });

// ---------- search ----------
const q=document.getElementById('q'), results=document.getElementById('results');
q.addEventListener('input',()=>{ const v=q.value.trim().toLowerCase(); if(!v){results.classList.remove('show');return;}
  const hits=MEMBER().filter(e=>e.preferredLabel.toLowerCase().indexOf(v)>=0||(e.id.toLowerCase().indexOf(v)>=0)).slice(0,30);
  results.innerHTML=hits.map(e=>'<div class="r" data-rec="'+e.id+'">'+esc(e.preferredLabel)+'<div class="ty">'+typeLabel(e.entityTypeId)+(stageOfId(e.id)?' · Stage '+stageOfId(e.id):'')+'</div></div>').join('')||'<div class="r">No matches</div>';
  results.classList.add('show');
});
results.addEventListener('click',ev=>{const r=ev.target.closest('[data-rec]');if(r){S.thread=null;selectRec(r.dataset.rec);results.classList.remove('show');q.value='';}});
document.addEventListener('click',ev=>{if(!ev.target.closest('.search'))results.classList.remove('show');});

function renderLegend(){
  const el=document.getElementById('legend'); if(!el)return;
  if(S.layer==='glossary'){ el.innerHTML=''; return; }
  el.innerHTML = S.layer==='template'
    ? '<span><i class="src loc" style="width:auto;height:auto;padding:1px 5px;border-radius:5px">local</i>Enterprise-local</span><span><i class="src ext" style="width:auto;height:auto;padding:1px 5px;border-radius:5px">ext</i>External (SFIA/standard)</span><span><i style="background:var(--gate)"></i>Council gate</span>'
    : '<span><i style="background:var(--human)"></i>Human</span><span><i style="background:var(--agent)"></i>Agent</span><span><i style="background:var(--gate)"></i>Governance gate</span>';
}
function glossaryTerms(){return [...M.ent.values()].filter(e=>e.entityTypeId==='type:glossary-term');}
// ---------- glossary help lookup (?) ----------
const GLOSS={byType:new Map(),byEl:new Map(),byLabel:new Map(),built:false};
const normDef=s=>String(s).toLowerCase().replace(/\([^)]*\)/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function buildGloss(){ if(GLOSS.built)return; GLOSS.built=true;
  glossaryTerms().forEach(t=>{ const a=t.attributes||{};
    if(a.definesType) GLOSS.byType.set(a.definesType,t);
    const base=t.preferredLabel.split(/[—–\-]\s*[A-Z]{2,6}$/)[0].trim();
    const k=normDef(base); if(k&&!GLOSS.byLabel.has(k))GLOSS.byLabel.set(k,t);
    if(a.abbr){const ak=String(a.abbr).toLowerCase(); if(!GLOSS.byLabel.has(ak))GLOSS.byLabel.set(ak,t);}
  });
  [...M.ent.values()].forEach(e=>{const gid=(e.attributes||{}).glossaryTerm; if(gid&&M.ent.get(gid))GLOSS.byEl.set(e.id,M.ent.get(gid));});
}
function defFor(o){ buildGloss();
  if(o.elId&&GLOSS.byEl.has(o.elId))return GLOSS.byEl.get(o.elId);
  if(o.typeId&&GLOSS.byType.has(o.typeId))return GLOSS.byType.get(o.typeId);
  if(o.label){ let k=normDef(o.label); if(GLOSS.byLabel.has(k))return GLOSS.byLabel.get(k);
    k=k.replace(/s$/,''); if(GLOSS.byLabel.has(k))return GLOSS.byLabel.get(k); }
  return null;
}
const cleanDef=d=>String(d||'').replace(/^—\s*/,'').trim();
const GENERIC_DEF=/^A factor in the |^A .* element of the reusable |^A skill in the /;
function hlp(o){ const t=defFor(o);
  if(t) return '<span class="hlp" data-def="'+t.id+'" title="What is this?">?</span>';
  // fallback — the element carries its own substantive definition even when no glossary term matches
  if(o.elId){ const e=M.ent.get(o.elId); const d=cleanDef(e&&e.definition);
    if(d && d.length>=20 && !GENERIC_DEF.test(d)) return '<span class="hlp" data-def="'+o.elId+'" title="What is this?">?</span>'; }
  return ''; }
function showDef(termId,anchor){ const t=M.ent.get(termId); if(!t)return; const pop=document.getElementById('defpop');
  const a=t.attributes||{}; const ns=a.namespace;
  pop.innerHTML='<div class="dpt">'+esc(t.preferredLabel)+(ns?'<span class="glns '+(ns==='SFIA'?'ext':'loc')+'">'+esc(ns)+'</span>':'')+'</div><div class="dpd">'+esc(cleanDef(t.definition))+'</div>';
  pop.style.display='block';
  const r=anchor.getBoundingClientRect(); const pw=Math.min(320,window.innerWidth-24);
  pop.style.width=pw+'px';
  let left=r.left; if(left+pw>window.innerWidth-12)left=window.innerWidth-12-pw;
  pop.style.left=Math.max(12,left)+'px'; pop.style.top=(r.bottom+6+window.scrollY)+'px';
}
function renderGlossary(){
  const app=document.getElementById('app');
  const q=(S.glq||'').toLowerCase();
  let terms=glossaryTerms();
  if(q) terms=terms.filter(e=>e.preferredLabel.toLowerCase().includes(q)||(e.definition||'').toLowerCase().includes(q));
  // group by category (attributes.catOrd / category)
  const groups=new Map();
  terms.sort((a,b)=>((a.attributes||{}).catOrd||9)-((b.attributes||{}).catOrd||9)||a.preferredLabel.localeCompare(b.preferredLabel));
  terms.forEach(e=>{const c=(e.attributes||{}).category||'Other'; if(!groups.has(c))groups.set(c,[]); groups.get(c).push(e);});
  let h='<div class="glosswrap"><div class="colhd"><span class="sc" style="background:var(--s3)"></span><h2>Pipeline glossary</h2><span class="ct">'+glossaryTerms().length+' governed terms</span></div>'+
    '<div class="stagedesc">Definitions for every term in the Human + Agent workforce pipeline, with their namespace (Enterprise-local, SFIA, NICE). Search filters term and definition.</div>'+
    '<input id="glq" class="glsearch" placeholder="Filter terms…" value="'+esc(S.glq||'')+'">';
  [...groups.entries()].forEach(([cat,items])=>{
    h+='<div class="glcat">'+esc(cat)+' <span class="glcount">'+items.length+'</span></div>';
    items.forEach(e=>{const ns=(e.attributes||{}).namespace; const ab=(e.attributes||{}).abbr;
      h+='<div class="glterm"><div class="gltl">'+esc(e.preferredLabel)+(ab?' <span class="glabbr">'+esc(ab)+'</span>':'')+(ns?'<span class="glns '+(ns==='SFIA'?'ext':'loc')+'">'+esc(ns)+'</span>':'')+'</div><div class="gldef">'+esc(e.definition||'')+'</div></div>';
    });
  });
  if(!terms.length) h+='<div class="empty">No terms match.</div>';
  h+='</div>';
  app.innerHTML=h;
  const gi=document.getElementById('glq');
  if(gi){ gi.addEventListener('input',()=>{S.glq=gi.value;const pos=gi.selectionStart;renderGlossary();const n=document.getElementById('glq');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}}); }
}
function renderAll(){
  const gl=S.layer==='glossary';
  ['loopwrap','refresh','govbar'].forEach(id=>{const el=document.querySelector('.'+id)||document.getElementById(id);});
  document.querySelector('.loopwrap').style.display=gl?'none':'';
  document.getElementById('refresh').style.display=gl?'none':'';
  document.getElementById('govbar').style.display=gl?'none':'';
  document.querySelector('.search').style.display=gl?'none':'';
  if(gl){ renderLegend(); renderGlossary(); return; }
  renderLegend(); renderLoop(); renderApp();
}

// ---------- boot / connection diagnostics (shared with explorer) ----------
(function(){
  const st=document.getElementById('status'), msg=document.getElementById('statusMsg'),
        title=document.getElementById('statusTitle'), diag=document.getElementById('diagLog'),
        verdict=document.getElementById('verdict'), tokenBox=document.getElementById('tokenBox'),
        diagBtns=document.getElementById('diagBtns');
  const esc2=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  function log(html){ diag.innerHTML += html+'\n'; diag.scrollTop=diag.scrollHeight; }
  function line(label,cls,detail){ log('<span class="'+(cls||'dim')+'">'+esc2(label)+'</span>'+(detail?'  <span class="dim">'+esc2(detail)+'</span>':'')); }
  function setVerdict(text,cls){ verdict.textContent=text; verdict.className='verdict '+(cls||''); verdict.style.display='block'; }
  const DATASETS=['index.json','entity-types.json','relationship-types.json','facets.json','entities.json','relationships.json'];

  async function go(){
    diag.innerHTML=''; verdict.style.display='none'; tokenBox.style.display='none'; diagBtns.style.display='none';
    title.textContent='Connecting…'; msg.textContent='Running connection diagnostics against GitHub.';
    const tk=getToken();
    if(!SRCINFO.gh){ line('Source  : '+SRCINFO.base+' (plain URL, no token)','dim'); }
    else{
      line('Scheme  : gh:  (GitHub Contents API)','dim');
      line('Owner   : '+SRCINFO.owner,'dim'); line('Repo    : '+SRCINFO.repo,'dim');
      line('Branch  : '+SRCINFO.ref,'dim'); line('Path    : '+SRCINFO.path,'dim');
      line('Token   : '+(tk?('present ('+tk.length+' chars, '+tk.slice(0,4)+'…'+tk.slice(-2)+')'):'(none stored)'), tk?'ok':'warn');
    }
    log('');
    if(SRCINFO.gh){
      line('① Reach api.github.com …','dim', 'GET https://api.github.com/zen');
      const net=await probe('https://api.github.com/zen',{cache:'no-store'});
      if(net.threw){ line('   ✗ network error — '+net.error,'bad'); setVerdict('Cannot reach api.github.com at all — a browser extension (ad/privacy blocker), a firewall, or a corporate proxy is blocking GitHub. Try another browser or disable blockers for this page.','bad'); return finish(false); }
      line('   ✓ reachable — HTTP '+net.status,'ok');
      line('② Repo visibility …','dim','GET /repos/'+SRCINFO.owner+'/'+SRCINFO.repo);
      const repo=await probe('https://api.github.com/repos/'+SRCINFO.owner+'/'+SRCINFO.repo,{headers:ghHeaders(false),cache:'no-store'});
      if(repo.threw){ line('   ✗ network error — '+repo.error,'bad'); setVerdict('Repo request failed at the network layer: '+repo.error,'bad'); return finish(false); }
      if(repo.status===401){ line('   ✗ HTTP 401 — token rejected','bad'); setVerdict('GitHub rejected the token (401). The PAT is invalid, expired, or malformed. Paste a current fine-grained PAT with Contents: Read on '+SRCINFO.owner+'/'+SRCINFO.repo+'.','bad'); return finish(false,true); }
      if(repo.status===404){ line('   ✗ HTTP 404 — repo not visible','bad'); setVerdict('The repo '+SRCINFO.owner+'/'+SRCINFO.repo+' is not visible (404). The fine-grained PAT needs Contents: Read on exactly this repo — or the owner/repo in the page is wrong.','bad'); return finish(false,true); }
      if(!repo.ok){ line('   ✗ HTTP '+repo.status,'bad'); setVerdict('Unexpected response checking the repo: HTTP '+repo.status+'.','bad'); return finish(false,true); }
      const dflt=repo.json&&repo.json.default_branch;
      line('   ✓ repo visible — HTTP '+repo.status+(dflt?'  (default branch: '+dflt+')':''),'ok');
      line('③ Ontology folder on "'+SRCINFO.ref+'" …','dim','GET /contents/'+SRCINFO.path+'?ref='+SRCINFO.ref);
      const folder=await probe('https://api.github.com/repos/'+SRCINFO.owner+'/'+SRCINFO.repo+'/contents/'+encodeURI(SRCINFO.path)+'?ref='+encodeURIComponent(SRCINFO.ref),{headers:ghHeaders(false),cache:'no-store'});
      if(folder.status===404){ line('   ✗ HTTP 404 — folder not found','bad'); setVerdict(SRCINFO.path+'/ does not exist on branch "'+SRCINFO.ref+'" (404). Push the ontology database folder to that branch.','bad'); return finish(false); }
      if(folder.ok&&Array.isArray(folder.json)){ const names=folder.json.map(x=>x.name); line('   ✓ folder found — '+names.length+' file(s)','ok'); const missing=DATASETS.filter(d=>names.indexOf(d)<0); if(missing.length) line('   ! missing: '+missing.join(', '),'warn'); }
      else if(folder.ok){ line('   ✓ path resolved','ok'); }
      else { line('   ✗ HTTP '+folder.status,'bad'); setVerdict('Could not list the ontology folder: HTTP '+folder.status+'.','bad'); return finish(false); }
    }
    log(''); line((SRCINFO.gh?'④':'①')+' Fetch datasets …','dim');
    // facets (classification tags) and index (version metadata) are NON-critical — the pipeline renders without them.
    const CRITICAL={'entity-types.json':1,'relationship-types.json':1,'entities.json':1,'relationships.json':1};
    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
    // GitHub's Contents API 500/502/503s transiently on a single blob — retry a couple of times before giving up.
    async function fetchData(f){ let p; for(let a=0;a<3;a++){
        p=await probe(fileUrl(f),{headers:SRCINFO.gh?ghHeaders(true):undefined,cache:'no-store'});
        if(!p.threw&&p.ok&&p.json!=null) return p;
        if(p.threw||p.status>=500||p.status===0){ if(a<2){ line('   … '+f+' — '+(p.threw?('network: '+p.error):('HTTP '+p.status))+', retrying ('+(a+1)+'/2)','warn'); await sleep(500*(a+1)); continue; } }
        break; } return p; }
    const data={}; let failed=null, degraded=[];
    for(const f of DATASETS){
      const p=await fetchData(f);
      const why=p.threw?('network error: '+p.error):(!p.ok?('HTTP '+p.status):(p.json==null?'not valid JSON':null));
      if(why){
        if(CRITICAL[f]){ line('   ✗ '+f+' — '+why,'bad'); failed=failed||(f+': '+why); }
        else { line('   ⚠ '+f+' — '+why+' · skipped (non-critical)','warn'); degraded.push(f); }
        continue;
      }
      const n=(p.json.count!=null?p.json.count:(Array.isArray(p.json.items)?p.json.items.length:'?'));
      line('   ✓ '+f+' — HTTP '+p.status+'  ('+n+' items)','ok'); data[f]=p.json;
    }
    if(failed){ setVerdict('A core dataset failed to load — '+failed+'. (Non-core files can be skipped, but this one is required.)','bad'); return finish(false); }
    try{
      buildModel({ entityTypes:data['entity-types.json'], relationshipTypes:data['relationship-types.json'], facets:data['facets.json'], entities:data['entities.json'], relationships:data['relationships.json']});
      const idx=data['index.json']||{};
      const mem=MEMBER().length;
      line('','dim'); line('✓ Loaded ontology v'+(idx.version||'?')+'  —  '+mem+' talent-strategy records','ok');
      if(!mem){ setVerdict('Ontology loaded, but it has no talent-strategy records yet (facet:talent-strategy is empty). Deploy ontology v0.9.0 or later.','bad'); return finish(false); }
      if(degraded.length) line('   ⚠ loaded without: '+degraded.join(', ')+' — rendering anyway','warn');
      setVerdict(degraded.length?('Connected (skipped '+degraded.join(', ')+'). Rendering…'):'Connected. Rendering…','ok');
      setTimeout(()=>{ st.style.display='none'; renderAll(); },degraded.length?700:200);
    }catch(e){ line('   ✗ build error: '+((e&&e.message)||e),'bad'); setVerdict('Data loaded but failed to build the model: '+((e&&e.message)||e),'bad'); return finish(false); }
  }
  function finish(okFlag,showToken){ title.textContent=okFlag?'Connected':'Not connected'; msg.innerHTML=okFlag?'':'The pipeline could not load. The trace above shows exactly where it stopped.'; diagBtns.style.display='flex'; if(showToken) tokenBox.style.display='block'; }
  document.getElementById('tokenSave').addEventListener('click',()=>{const t=document.getElementById('tokenIn').value.trim();if(t){try{localStorage.setItem(TOKEN_KEY,t);}catch(e){}}go();});
  document.getElementById('retryBtn').addEventListener('click',go);
  document.getElementById('tokenToggle').addEventListener('click',()=>{ tokenBox.style.display = tokenBox.style.display==='none'?'block':'none'; });
  document.getElementById('copyBtn').addEventListener('click',()=>{ const t=diag.textContent+'\n'+(verdict.style.display!=='none'?('VERDICT: '+verdict.textContent):''); try{navigator.clipboard.writeText(t);document.getElementById('copyBtn').textContent='Copied';setTimeout(()=>document.getElementById('copyBtn').textContent='Copy diagnostics',1200);}catch(e){} });
  go();
})();
</script>
