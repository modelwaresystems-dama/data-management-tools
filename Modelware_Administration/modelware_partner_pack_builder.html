function sheetsToHtml(sheets){
  var h="";
  sheets.forEach(function(s){
    /* title and note rows are prose, not data — keeping them in the table stretches
       the first column and forces horizontal scrolling, so lift them out */
    var rows=s.rows.slice(), lead=[], tail=[];
    function isProse(r){ return r && r.length && r[0] && (r[0].s===1 || r[0].s===10); }
    function isBlank(r){ return !r || !r.length; }
    while(rows.length && (isProse(rows[0]) || isBlank(rows[0]))){
      var t=rows.shift(); if(isProse(t)) lead.push(t[0].v);
    }
    while(rows.length && (isProse(rows[rows.length-1]) || isBlank(rows[rows.length-1]))){
      var b=rows.pop(); if(isProse(b)) tail.unshift(b[0].v);
    }
    h+='<div class="sheetwrap"><div class="sheettitle">'+esc(s.name)+
       (lead.length?'<span class="lead">'+lead.map(esc).join(' &middot; ')+'</span>':'')+'</div>';

    /* A sheet that is one wide row per partner reads as a record on screen.
       Forty columns squeezed into a pane is unreadable; turn it on its side. */
    if(s.preview==="record"){
      var hdrRow=null, dataRow=null, rest=[];
      rows.forEach(function(r){
        if(!r||!r.length) { if(hdrRow&&dataRow) rest.push(r); return; }
        if(!hdrRow && r[0] && r[0].s===2){ hdrRow=r; return; }
        if(hdrRow && !dataRow){ dataRow=r; return; }
        if(hdrRow && dataRow) rest.push(r);
      });
      if(hdrRow && dataRow){
        h+='<div class="sheetscroll"><table class="sheet kv">';
        hdrRow.forEach(function(hc,i){
          var dc=dataRow[i];
          h+='<tr><td>'+esc(hc?hc.v:"")+'</td>'+cellHtml(dc,true)+'</tr>';
        });
        h+='</table></div>';
        if(rest.length) h+=blockTable(rest);
        h+=(tail.length?'<div class="sheetfoot">'+tail.map(esc).join('<br>')+'</div>':'')+'</div>';
        return;
      }
    }
    h+='<div class="sheetscroll"><table class="sheet">';
    rows.forEach(function(r){
      if(!r||!r.length){ h+='<tr><td style="height:6px;border:0"></td></tr>'; return; }
      var isHead=r[0]&&r[0].s===2, isGrp=r[0]&&r[0].s===8;
      h+='<tr'+(isGrp?' class="grp"':'')+'>';
      r.forEach(function(c){
        if(!c){ h+="<td></td>"; return; }
        var v=c.v, cls="";
        if(c.t==="f"){ v="= "+c.v; cls=' class="fx"'; }
        else if(c.t==="n"){
          if(v===null||v===""){ v=""; }
          else if(c.s===5){ v=(Number(v)*100).toFixed(1)+"%"; }
          else if(c.s===6){ v=new Date(Date.UTC(1899,11,30)+Number(v)*86400000).toISOString().slice(0,10);
                            cls=' class="dt"'; }
          else { v=num(v, c.s===9?1:0); cls=' class="num"'; }
          if(c.s===5) cls=' class="num"';
        }
        h+=(isHead?"<th>":"<td"+cls+">")+esc(v)+(isHead?"</th>":"</td>");
      });
      h+="</tr>";
    });
    h+='</table></div>'+
       (tail.length?'<div class="sheetfoot">'+tail.map(esc).join('<br>')+'</div>':'')+
       '</div>';
  });
  return h;
}

var PIPE={q:"",status:"",model:"",sort:"name"};
function pipeRows(){
  var openSlug=partnerSlug(D), openNamed=String(D.partner.legalName||"").trim()!=="";
  var rows=GH.files.map(function(fr){
    var e=GH.entries[fr.slug]||{slug:fr.slug,legalName:fr.slug,status:""};
    return {slug:fr.slug, e:e, status:e.status||"Unfiled", open:fr.slug===openSlug};
  });
  if(openNamed && !rows.filter(function(r){ return r.slug===openSlug; }).length){
    rows.push({slug:openSlug, unsaved:true, open:true, status:D.status||"Prospect",
      e:{legalName:D.partner.legalName, model:(MODELS[D.modelKey]||MODELS.ADP).name,
         modelKey:D.modelKey, territory:territoryText(D), exclusivity:D.territory.exclusivity,
         countries:D.territory.countries, status:D.status}});
  }
  var q=PIPE.q.trim().toLowerCase();
  var out=rows.filter(function(r){
    var e=r.e;
    if(PIPE.status && r.status!==PIPE.status) return false;
    if(PIPE.model && e.modelKey!==PIPE.model) return false;
    if(!q) return true;
    var hay=[e.legalName,e.tradingName,r.slug,e.territory,e.model,e.status,e.ref,
             (e.countries||[]).join(" "),e.contactName,e.contactEmail].join(" ").toLowerCase();
    return hay.indexOf(q)>-1;
  });
  out.sort(function(a,b){
    if(PIPE.sort==="gate"){
      var ga=(a.e.nextGateDate||"9999"), gb=(b.e.nextGateDate||"9999");
      if(ga!==gb) return ga<gb?-1:1;
    }
    if(PIPE.sort==="updated"){
      var ua=(a.e.updatedAt||""), ub=(b.e.updatedAt||"");
      if(ua!==ub) return ua>ub?-1:1;
    }
    var na=(a.e.legalName||a.slug).toLowerCase(), nb=(b.e.legalName||b.slug).toLowerCase();
    return na<nb?-1:(na>nb?1:0);
  });
  return {all:rows, shown:out};
}

           esc(ghWebUrl(ghPathFor(PARTNER_DIR)))+'">Open on GitHub</a>':'')+
        (GH.connected?'<button class="btn light sm" id="btnGhRefresh2">Refresh</button>':'')+
        '</div>';
  h+='<div id="ghStatus2" class="ghstatus'+(GH.statusKind==="ok"?" ok":(GH.statusKind==="err"?" err":""))+'">'+esc(GH.status)+'</div>';
  h+='<div style="height:14px"></div>';
  if(!GH.connected){
    h+='<div class="repolist"><div class="empty">Enter the repository details and a fine-grained token in the form on the left, then press <strong>Connect</strong>.<br><br>'+
       'The token needs <strong>Contents: Read and write</strong> on this repository and nothing else.<br>'+
       'Everything except these calls works with no network at all.</div></div>';
    return h;
  }
  h+='<div class="repolist">';
  if(!GH.files.length){
    h+='<div class="empty">No partner records in <code>'+esc(ghPathFor(PARTNER_DIR))+'/</code> yet. Fill in a partner and press <strong>Save partner to GitHub</strong> — the folder, the register and the README are created for you.</div>';
  } else {
    GH.files.forEach(function(fr){
      var e=GH.entries[fr.slug];
      var sub = e ? (e.model+" · "+e.territory+" · "+e.exclusivity+(e.status?" · "+e.status:""))
                  : (PARTNER_DIR+"/"+fr.name);
      h+='<div class="rowitem"><div><div class="nm">'+esc(e?(e.legalName||fr.slug):fr.slug)+'</div>'+
         '<div class="sub">'+esc(sub)+'</div></div>'+
         '<button class="btn light sm" data-ghopen="'+esc(fr.slug)+'">Open</button></div>';
    });

  h+='</div>';

     '<div class="sub">One JSON record per partner in <code>'+esc(ghPathFor(PARTNER_DIR))+'/</code>, plus a generated <code>'+esc(ghPathFor("register.json"))+'</code> and <code>'+esc(ghPathFor("README.md"))+'</code> table. '+
     'Contracts and workbooks are not stored — they are regenerated from these records.</div></div><div></div></div></div>';
  return h;
}
function toast(m,err){

<script>
"use strict";
/* ============================================================== EXPORTS */
function packBase(){
  return safeName(D.partner.legalName||D.partner.tradingName||"Partner")+" - "+safeName(MODELS[D.modelKey].short);
}
function docFileBase(doc){ return doc.code+" "+safeName(doc.title); }
function footerFor(doc){
  return D.franchisor.brand+" | "+fb(D.ref,"ref")+" | "+doc.title+" | "+fb(D.partner.legalName,"Partner")+
         " | Draft for legal review | v"+APP_VERSION;
}
function exportIntake(){
  var html=buildIntakeHtml(D);

}
function exportXlsx(){

  download(packBase()+" - Partner Account Workbook.xlsx", bytes,
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  toast("Workbook exported.");
}
/* Contracts are refused while a red check stands: a red check means the pack
   would contradict itself, and a contradictory agreement is worse than a late
   one. Everything else still exports, stamped DRAFT — NOT FOR SIGNATURE. */
function contractsBlocked(){ return redIssues(D).length>0; }
function refuseContracts(what){
  var n=redIssues(D).length;
  toast(what+" not exported \u2014 "+n+" check"+(n===1?"":"s")+" would put a contradiction in the contract.",true);
  checksDialog();
}
function contractFiles(kind, which){
  var docs=buildDocs(D).filter(function(doc){
    return which==="internal" ? !!doc.internal : !doc.internal;
  }), files=[];
  docs.forEach(function(doc){
    if(kind==="docx") files.push({name:docFileBase(doc)+".docx", data:blocksToDocx(doc)});
    else files.push({name:docFileBase(doc)+".pdf", data:blocksToPdf(doc,footerFor(doc))});
  });
  return files;
}
function exportContracts(kind){
  if(contractsBlocked()){ refuseContracts("Contract set"); return; }
  var files=contractFiles(kind).map(function(f){ return {name:packBase()+"/"+f.name, data:f.data}; });
  download(packBase()+" - Contracts ("+kind.toUpperCase()+").zip", zipMake(files), "application/zip");
  toast("Contract set exported as "+kind.toUpperCase()+".");
}
function exportAll(){
  var base=packBase(), files=[];
  files.push({name:base+"/"+base+" - Partner Account Workbook.xlsx", data:buildXlsx(buildWorkbook(D))});
  var blocked=contractsBlocked();
  if(!blocked){
    contractFiles("docx").forEach(function(f){ files.push({name:base+"/Contracts (Word)/"+f.name, data:f.data}); });
    contractFiles("pdf").forEach(function(f){ files.push({name:base+"/Contracts (PDF)/"+f.name, data:f.data}); });
  } else {
    files.push({name:base+"/Contracts (WITHHELD).txt", data:u8(
      "CONTRACTS WITHHELD\n"+
      "==================\n\n"+
      draftBanner(D)+"\n\n"+
      "The agreement and its schedules were not written into this pack. Each item below would\n"+
      "produce a contract that contradicts itself or the record behind it. Answer them in the\n"+
      "builder (the Checks button in the header) and export the pack again.\n\n"+
      redIssues(D).map(function(x,i){ return (i+1)+". "+x.t+"\n   "+x.m+"\n"; }).join("\n")+"\n"+
      "Everything else in this pack was produced and is marked DRAFT - NOT FOR SIGNATURE.\n")});
  }
  contractFiles("docx","internal").forEach(function(f){
    files.push({name:base+"/Internal - do not send to the partner/"+f.name, data:f.data}); });
  contractFiles("pdf","internal").forEach(function(f){
    files.push({name:base+"/Internal - do not send to the partner/"+f.name, data:f.data}); });
  files.push({name:base+"/Onboarding/"+intakeFileName("html",D), data:u8(buildIntakeHtml(D))});
  files.push({name:base+"/partner-data.json", data:u8(JSON.stringify(partnerRecord(D),null,2)+"\n")});
  files.push({name:base+"/READ ME.txt", data:u8(
    "MODELWARE PARTNER PACK\n"+
    "======================\n\n"+
    "Builder:        "+APP_NAME+" v"+APP_VERSION+"\n"+
    "Builder build:  "+APP_BUILD+"\n"+
    "Pack generated: "+sastNow()+"\n\n"+
    "Partner:        "+fb(D.partner.legalName,"Partner")+"\n"+
    "Operating model:"+MODELS[D.modelKey].name+"\n"+
    "Territory:      "+territoryText(D)+"\n"+
    "Reference:      "+fb(D.ref,"ref")+"\n"+
    (blocked ? "\nSTATUS:         "+draftBanner(D)+"\n                The contracts were withheld. See Contracts (WITHHELD).txt.\n\n" : "\n")+
    
    "CONTENTS\n"+
    "  Partner Account Workbook.xlsx  Agreement summary, partner register, commercial model,\n"+
    "                                 lifecycle gate tracker and KPI scorecard.\n"+
    "  Onboarding/                    "+intakeFileName("html",D)+" — send this to the candidate. They fill it in\n"+
    "                                 offline and return a JSON you load with \"Open data\".\n"+
    "  Contracts (Word)/              Editable drafts for redlining.\n"+
    "  Internal - do not send/        The access withdrawal runbook. Ours, not theirs.\n"+
    "  Contracts (PDF)/               Issue copies with signature blocks.\n"+
    "  partner-data.json              Reload this in the builder to reproduce or amend the pack.\n\n"+
    "IMPORTANT\n"+
    "  These contracts are drafts generated from a template. They are governed by South African\n"+
    "  law and must be reviewed by a qualified legal practitioner, and checked against mandatory\n"+
    "  local law in the partner's territory, before signature.\n")});
  download(base+" - Partner Pack.zip", zipMake(files), "application/zip");
  if(blocked){ toast("Pack exported without the contracts \u2014 "+redIssues(D).length+" check"+(redIssues(D).length===1?"":"s")+" outstanding.",true); checksDialog(); }
  else toast("Full partner pack exported.");
}
function exportOne(kind){
  var docs=buildDocs(D), doc=docs.filter(function(x){return x.id===activeTab;})[0];
  if(!doc){ toast("Open a contract tab first.",true); return; }
  if(contractsBlocked() && !doc.internal){ refuseContracts(doc.title); return; }
  if(kind==="docx") download(packBase()+" - "+docFileBase(doc)+".docx", blocksToDocx(doc),
    "application/vnd.openxmlformats-officedocument.wordprocessingml.document");

}

/* ================================================================ WIRING */
/* renderForm() replaces the whole left pane, which throws away focus, the caret and
   the scroll position — so typing in a field jumped the page to the top. Put all three
   back after every rebuild. */
/* Rewrites only the money on the cost-line rows. Rebuilding the form on each
   keystroke destroyed the input under the cursor and scrambled what was typed. */
function updateLineTotals(){
  var rows=document.querySelectorAll(".lineedit .lerow");
  var lines=(D.inventory&&D.inventory.lines)||[];
  for(var i=0;i<lines.length && i<rows.length;i++){
    var t=rows[i].querySelector(".letot");
    if(t) t.textContent=money(D.commercial.currency, lineAmount(D,lines[i]));
  }
  var totRow=document.querySelector(".lineedit .lerow.tot .letot");
  if(totRow) totRow.textContent=money(D.commercial.currency, invTotal(D,"mws"));
}
/* Same rule for the price bands: rewrite the money, leave the input alone. */
function updateBandTotals(){
  var rows=document.querySelectorAll(".lineedit .bandrow");
  var bands=(D.reseller&&D.reseller.bands)||[];
  var cur=D.commercial.currency, w=resWeeks(D), live=bandFor(D,w);
  for(var i=0;i<bands.length && i<rows.length;i++){
    var bd=bands[i], on=(bd===live), sav=resBase(D)-(Number(bd.price)||0);
    rows[i].className = "lerow bandrow"+(on?"":" off");
    var nm=rows[i].querySelector(".lename");
    if(nm) nm.innerHTML = esc(bandLabel(bd))+(on?' &middot; applies':'');
    var t=rows[i].querySelector(".letot");
    if(t) t.textContent=money(cur, Number(bd.price)||0);
    var nt=rows[i].querySelector(".lenote");
    if(nt) nt.textContent = sav>0 ? ("Saves "+money(cur,sav)+" a week against the standard price.") : "";
  }
  var lab=document.getElementById("ladtot"), trips=tripsFor(D,w);
  if(lab) lab.innerHTML = esc(w)+" weeks in "+esc(num(trips))+" trip"+(trips===1?"":"s")+" &middot; delivery, plus travel";
  var totRow=document.querySelector(".lineedit .lerow.tot .letot");
  if(totRow) totRow.textContent=money(cur, resInvoiced(D));
}
/* Derived money in the volume grid, rewritten without rebuilding the pane. */
function updateVolumeTable(){
  var tb=document.querySelector("#voltbl tbody"); if(!tb) return;
  var cur=D.commercial.currency, w=resWeeks(D), be=resBreakEven(D,w);
  var steps=resPaxSteps(D), rows=tb.querySelectorAll("tr");
  for(var i=0;i<steps.length && i<rows.length;i++){
    var pax=steps[i], td=rows[i].querySelectorAll("td"), under=pax<be;
    rows[i].className = under ? "under" : "";
    td[0].innerHTML = pax + (under ? ' &middot; below break-even' : '');
    td[1].textContent = money2(cur, resPerPax(D,w,pax));
    td[2].textContent = money2(cur, resTruePerPax(D,w,pax));
    td[3].textContent = money2(cur, resSavingPerPax(D,w,pax));
    td[4].textContent = money(cur, resCourseMargin(D,w,pax));
  }
}
/* The year table is derived the same way, so it is patched the same way. */
function updateYearTable(){
  var tb=document.querySelector("#yeartbl tbody"); if(!tb) return;
  var cur=D.commercial.currency, wPlan=resWeeks(D), pPlan=resPaxPlan(D);
  var steps=resWeekSteps(D), rows=tb.querySelectorAll("tr");
  for(var i=0;i<steps.length && i<rows.length;i++){
    var w=steps[i], m=yrMargin(D,w,pPlan), here=(w===wPlan), td=rows[i].querySelectorAll("td");
    rows[i].className = (m<0) ? "under" : (here ? "here" : "");
    td[0].innerHTML = w + (here ? ' &middot; planned' : '');
    td[1].textContent = num(tripsFor(D,w));
    td[2].textContent = money(cur, yrTravel(D,w));
    td[3].textContent = num(yrDelegates(D,w,pPlan));
    td[4].textContent = money(cur, yrRevenue(D,w,pPlan));
    td[5].textContent = money(cur, yrCost(D,w,pPlan));
    td[6].textContent = money(cur, m);
    td[7].textContent = pct(Math.round(yrMarginPct(D,w,pPlan)*10)/10);
  }
}
/* The payment schedule carries the day counts in its own labels, so those have
   to be rewritten too — the ladder bug was exactly this, one table over. */
function updatePayTable(){
  var tb=document.querySelector("#paytbl tbody"); if(!tb) return;
  var rows=tb.querySelectorAll("tr"), data=resPaymentSchedule(D);
  for(var i=0;i<data.length && i<rows.length;i++){
    var td=rows[i].querySelectorAll("td");
    td[0].textContent=data[i][0];
    td[1].textContent=data[i][1];
    td[2].textContent=data[i][2];
  }
}
/* Section badges are derived from the field values, so they go stale the moment
   you type — the pane is patched in place rather than rebuilt. Recount here. */
function updateGroupCounts(){
  var secs=document.querySelectorAll("#form .grp");
  if(!secs.length) return;
  var doneN=0, openN=0;
  secs.forEach(function(sec){
    if(!sec.classList.contains("off")) openN++;
    var badge=sec.querySelector(".gcount"); if(!badge) return;
    var seen={}, total=0, done=0;
    sec.querySelectorAll(".grpbody [data-p]").forEach(function(el){
      var p=el.dataset.p; if(seen[p]) return; seen[p]=1; total++;
      var v=get(p);
      if(v===true) done++;
      else if(v!==null && v!==undefined && String(v).trim()!=="" && String(v)!=="0") done++;
    });
    if(!total){ badge.textContent=""; return; }
    badge.textContent=done+" / "+total;
    badge.classList.toggle("full", done>=total);
    if(done>=total) doneN++;
  });
  var hint=document.getElementById("grphint");
  if(hint) hint.textContent=secs.length+" sections \u00b7 "+doneN+" complete \u00b7 "+openN+" open";
}
function fieldKey(el){
  if(!el || !el.dataset) return null;
  if(el.dataset.p) return "p|"+el.dataset.p;
  if(el.dataset.line!==undefined) return "l|"+el.dataset.line+"|"+el.dataset.lf;
  if(el.dataset.tier!==undefined) return "t|"+el.dataset.tier+"|"+el.dataset.tf;
  if(el.dataset.band!==undefined) return "b|"+el.dataset.band+"|"+el.dataset.bf;
  if(el.id) return "i|"+el.id;
  return null;
}
function findByKey(k){
  if(!k) return null;
  var a=k.split("|");
  if(a[0]==="p") return document.querySelector('[data-p="'+a[1]+'"]');
  if(a[0]==="l") return document.querySelector('[data-line="'+a[1]+'"][data-lf="'+a[2]+'"]');
  if(a[0]==="t") return document.querySelector('[data-tier="'+a[1]+'"][data-tf="'+a[2]+'"]');
  if(a[0]==="i") return document.getElementById(a[1]);
  return null;
}
function refresh(){
  var ae=document.activeElement, key=fieldKey(ae), selS=null, selE=null;
  try{ if(ae && ae.selectionStart!==null && ae.selectionStart!==undefined){
         selS=ae.selectionStart; selE=ae.selectionEnd; } }catch(e){}
  var L=document.querySelector(".pane.left"), Rp=document.querySelector(".pane.right");
  var sl=L?L.scrollTop:0, sr=Rp?Rp.scrollTop:0;

  renderVersionChip(); renderForm(); render();

  var L2=document.querySelector(".pane.left"), R2=document.querySelector(".pane.right");
  if(L2) L2.scrollTop=sl;
  if(R2) R2.scrollTop=sr;
  var el=findByKey(key);
  if(el){
    el.focus({preventScroll:true});
    try{ if(selS!==null && el.setSelectionRange) el.setSelectionRange(selS,selE); }catch(e){}
  }
}
document.addEventListener("input", function(e){
  var t=e.target;
  if(t.dataset && t.dataset.p){
    var path=t.dataset.p, val;
    if(t.type==="checkbox") val=t.checked;
    else if(t.type==="number") val=(t.value===""?"":Number(t.value));
    else val=t.value;
    set(path,val);
    /* Reaching Contracting locks the reference. Done here rather than at save
       time so the field goes read-only in front of whoever changed the stage. */
    if(path==="status" && refFreezeIfDue(D)){
      refresh();
      toast("Reference "+D.ref+" is now locked. Unlock it deliberately if it has to change.");
      return;
    }
    /* The ladder's money is derived from these fields but lives in the left pane,
       which render() does not rebuild — so patch it here or it goes stale. */
    if(path.indexOf("reseller.")===0 || path==="commercial.currency") updateBandTotals();
    if(path==="reseller.paxStepsText" || path==="reseller.weekStepsText" ||
       path==="reseller.tripWeeks" || path==="reseller.clustered"){ refresh(); return; }
    if(path.indexOf("reseller.")===0){ updateVolumeTable(); updateYearTable(); updatePayTable(); }
    updateGroupCounts();
    var ovr=document.getElementById("chkOverlay");
    if(ovr){
      var inDialog = t.dataset && t.dataset.p && ovr.contains(t);
      if(!inDialog || t.tagName==="SELECT") checksDialog();
    }
    render(); return;
  }
  if(t.id==="pipeQ"){ PIPE.q=t.value; render();
    var q=document.getElementById("pipeQ");
    if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } return; }
  if(t.dataset && t.dataset.gh){
    var g=t.dataset.gh;
    if(g==="remember"){ GH.remember=t.checked; ghSaveCfg(); refresh(); }
    else {
      GH[g]=t.value.trim();
      if(g!=="token") ghSaveCfg(); else if(GH.remember) ghSaveCfg();
      if(g==="owner"||g==="repo"||g==="folder"||g==="branch"||g==="userId") render();
    }
    return;
  }
  if(t.dataset && t.dataset.line!==undefined){
    var li=Number(t.dataset.line), lf=t.dataset.lf;
    if(D.inventory.lines[li] && lf!=="qtyPct"){
      D.inventory.lines[li][lf]=(t.value===""?0:Number(t.value));
      updateLineTotals();      /* patch the figures in place — never rebuild the field being typed in */
      render();
    }
    return;
  }
  if(t.dataset && t.dataset.band!==undefined){
    var bi=Number(t.dataset.band), bf=t.dataset.bf;
    if(D.reseller && D.reseller.bands[bi]){
      D.reseller.bands[bi][bf]=(t.value===""?0:Number(t.value));
      updateBandTotals(); updateVolumeTable(); updateYearTable(); updatePayTable();  /* patch in place — never rebuild the field being typed in */
      render();
    }
    return;
  }
  if(t.dataset && t.dataset.ci!==undefined){
    var cidx=Number(t.dataset.ci), cf=t.dataset.cf;
    if(D.content.items[cidx]){ D.content.items[cidx][cf]=t.value;
      /* a status change dims the row and moves the count, so redraw the form */
      if(t.tagName==="SELECT") refresh(); else render(); }
    return;
  }
  if(t.dataset && t.dataset.ti!==undefined){
    var tidx=Number(t.dataset.ti), tnf=t.dataset.tnf;
    if(D.content.trainers[tidx]){ D.content.trainers[tidx][tnf]=t.value;
      if(t.tagName==="SELECT") refresh(); else render(); }
    return;
  }
  if(t.dataset && t.dataset.tier!==undefined){
    var i=Number(t.dataset.tier), fld=t.dataset.tf;
    D.commercial.tiers[i][fld]=Number(t.value)||0; render(); return;
  }
});
document.addEventListener("change", function(e){
  var t=e.target;
  /* a committed answer in the dialog: re-ask what is left */
  var ovr2=document.getElementById("chkOverlay");
  if(ovr2 && t.dataset && t.dataset.p && ovr2.contains(t)){ checksDialog(); return; }
  if(t.id==="pipeStatus"){ PIPE.status=t.value; render(); return; }
  if(t.id==="pipeModel"){ PIPE.model=t.value; render(); return; }
  if(t.id==="pipeSort"){ PIPE.sort=t.value; render(); return; }
  if(t.name==="mk"){ D.modelKey=t.value; applyModelDefaults(D,t.value); activeTab=activeTab==="WB"?"WB":"AGREEMENT"; refresh(); }
});
/* A typed country must never be lost. Enter, the Add button, a comma, or simply
   clicking away all commit it — requiring one specific keystroke silently threw
   the entry away, which is exactly how a territory went missing. */
function addCountries(raw, refocus){
  var added=0;
  String(raw||"").split(/[,;\n]+/).forEach(function(x){
    var v=x.trim();
    if(v && D.territory.countries.indexOf(v)===-1){ D.territory.countries.push(v); added++; }
  });
  var el=document.getElementById("countryIn"); if(el) el.value="";
  if(added){
    refresh();
    if(refocus){ var el2=document.getElementById("countryIn"); if(el2) el2.focus(); }
    toast(added===1?"Country added.":added+" countries added.");
  }
  return added;
}
document.addEventListener("keydown", function(e){
  if(e.target.id==="countryIn" && e.key==="Enter"){ e.preventDefault(); addCountries(e.target.value,true); }
});
document.addEventListener("focusout", function(e){
  if(e.target && e.target.id==="countryIn"){ addCountries(e.target.value,false); }
});
document.addEventListener("click", function(e){
  var t=e.target, id=t.id;
  if(id==="npOverlay"){ t.remove(); return; }
  if(t.dataset && t.dataset.rm!==undefined){ D.territory.countries.splice(Number(t.dataset.rm),1); refresh(); return; }
  if(t.dataset && t.dataset.tierrm!==undefined){ D.commercial.tiers.splice(Number(t.dataset.tierrm),1); refresh(); return; }
  if(t.dataset && t.dataset.tab){ activeTab=t.dataset.tab; render(); return; }
  if(t.dataset && t.dataset.chkfix!==undefined){
    var fx=(packIssues(D)[Number(t.dataset.chkfix)]||{}).fix;
    if(fx && fx.set){ Object.keys(fx.set).forEach(function(p){ set(p, fx.set[p]); }); refresh(); checksDialog(); }
    return;
  }
  if(t.dataset && t.dataset.chkgo){
    var slug=t.dataset.chkgo, ov=document.getElementById("chkOverlay"); if(ov) ov.remove();
    GRP[slug]=false; grpSave(); renderForm();
    var sec=document.querySelector('.grp[data-grp="'+slug+'"]');
    if(sec){
      sec.scrollIntoView({block:"center",behavior:"smooth"});
      sec.classList.add("flash"); setTimeout(function(){ sec.classList.remove("flash"); }, 1400);
      var first=sec.querySelector(".grpbody [data-p]"); if(first) first.focus();
    }
    return;
  }
  var gt=t.closest?t.closest("[data-grptoggle]"):null;
  if(gt){
    var sl=gt.dataset.grptoggle;
    GRP[sl]=!GRP[sl]; grpSave();
    /* toggle in place — rebuilding the pane would lose the scroll position */
    var sec=document.querySelector('.grp[data-grp="'+sl+'"]');
    if(sec){
      sec.classList.toggle("off", !!GRP[sl]);
      gt.setAttribute("aria-expanded", GRP[sl]?"false":"true");
      updateGroupCounts();
    }
    return;
  }
  if(t.dataset && t.dataset.cirm!==undefined){
    D.content.items.splice(Number(t.dataset.cirm),1); refresh(); return;
  }
  if(t.dataset && t.dataset.tirm!==undefined){
    D.content.trainers.splice(Number(t.dataset.tirm),1); refresh(); return;
  }
  if(id==="pipeClear"||id==="pipeClear2"){ PIPE.q=""; PIPE.status=""; PIPE.model=""; render(); return; }
  if(t.dataset && t.dataset.one){ exportOne(t.dataset.one); return; }
  if(t.dataset && t.dataset.ghopen){ ghOpen(t.dataset.ghopen); return; }
  if(t.dataset && t.dataset.ghdocx){ ghOpenThen(t.dataset.ghdocx, function(){ exportContracts("docx"); }); return; }
  if(t.dataset && t.dataset.ghpack){ ghOpenThen(t.dataset.ghpack, function(){ exportAll(); }); return; }
  switch(id){
    case "btnAddCountry": {
      var ci=document.getElementById("countryIn");
      if(ci && !addCountries(ci.value,true)) toast("Type a country first.",true);
      break; }
    case "btnAddTier": D.commercial.tiers.push({from:0,pct:Number(D.commercial.royaltyPct)||10}); refresh(); break;
    case "btnCtAdd": {
      var sel=document.getElementById("ctAdd"), code=sel?sel.value:"";
      var cat=courseByCode(code);
      if(!cat){ toast("Pick a course first.",true); break; }
      if(ctItems(D).filter(function(x){ return x.code===code; }).length){
        toast(cat.title+" is already licensed to this partner.",true); break; }
      D.content.items.push({code:cat.code, title:cat.title, version:cat.version,
        granted:D.term.commencementDate||todayISO(), expires:"", status:"Active"});
      refresh(); toast(cat.title+" licensed.");
      break; }
    case "btnTnAdd":
      D.content.trainers.push({name:"", email:"", certifiedTo:"", added:todayISO(), status:"Active"});
      refresh(); break;
    case "btnAddBand": {
      var bs=resBands(D), last=bs.length?bs[bs.length-1]:null;
      var from=last?(Number(last.to)||Number(last.from)||0)+1:1;
      D.reseller.bands.push({from:from,to:0,price:last?Number(last.price)||resBase(D):resBase(D)});
      refresh(); break;
    }
    case "btnApplyDefaults": applyModelDefaults(D,D.modelKey); refresh(); toast("Commercial terms reset to model defaults."); break;
    case "btnIntake": case "flowIntake": case "btnIntakeTop": exportIntake(); break;
    case "flowNew": newPartnerDialog(); break;
    case "flowOpen": document.getElementById("fileIn").click(); break;
    case "flowPack": exportAll(); break;
    case "flowPush":
      if(!GH.connected){ activeTab="SYNC"; render(); toast("Connect to the repository first.",true); break; }
      ghSave(); break;
    case "btnXlsx": exportXlsx(); break;
    case "btnDocxAll": exportContracts("docx"); break;
    case "btnPdfAll": exportContracts("pdf"); break;
    case "btnZip": case "btnExportAll": exportAll(); break;
    case "btnLoadDemo": D=demoData(); activeTab="WB"; refresh(); toast("Example partner loaded — press + New partner to start a real one."); break;
    case "btnNewPartner": newPartnerDialog(); break;
    case "npCancel": { var ov=document.getElementById("npOverlay"); if(ov) ov.remove(); break; }
    case "npCreate": {
      var nm=(document.getElementById("npName")||{}).value||"";
      if(!nm.trim()){ toast("Give the partner a legal name.",true); break; }
      var typedRef=(document.getElementById("npRef")||{}).value||"";
      if(GH.connected && typedRef.trim()){
        var clash=refHolders(typedRef, slugify(nm.trim()));
        if(clash.length){
          toast("Reference "+typedRef.trim()+" is already held by "+(clash[0].legalName||clash[0].slug)+".",true);
          break;
        }
      }
      newPartner({ name:nm.trim(),
        countries:(document.getElementById("npCountries")||{}).value||"",
        ref:(document.getElementById("npRef")||{}).value||"",
        modelKey:(document.getElementById("npModel")||{}).value,
        status:(document.getElementById("npStatus")||{}).value });
      var ov2=document.getElementById("npOverlay"); if(ov2) ov2.remove();
      break; }
    case "btnGhSave2": ghSave(); break;
    case "btnRefNext": {
      if(!GH.connected){ toast("Connect to the repository first.",true); break; }
      ghLoadRefs().then(function(){
        D.ref=refNextFree(D.ref);
        refresh();
        toast("Allocated "+D.ref+".");
      }).catch(function(e){ toast(e.message||String(e),true); });
      break; }
    case "btnRetiredOk": D.retiredNote=""; D.retiredFrom=D.retiredFrom||""; refresh(); break;
    case "btnRefUnlock": {
      var why=window.prompt("Unlocking "+D.ref+".\n\nThis reference froze at "+(D.refFrozenAt||"an earlier stage")+
        " because the record reached "+FREEZE_AT_STATUS+". Anything already issued carries it.\n\nWhy is it changing?");
      if(why===null) break;
      if(!String(why).trim()){ toast("Give a reason \u2014 it is written to the ledger.",true); break; }
      refUnlock(D, why);
      refresh();
      toast("Reference unlocked. The reason is recorded and goes to the ledger on the next push.");
      break; }
    case "btnRefAudit": {
      if(!GH.connected){ toast("Connect to the repository first.",true); break; }
      ghLoadRefs().then(function(){ return ghLoadRegister(); }).then(function(){
        var d=refDuplicates();
        if(!d.length){
          ghSetStatus("No duplicate contract references. "+Object.keys(refClaims()).length+
                      " reference"+(Object.keys(refClaims()).length===1?"":"s")+" in use across "+
                      GH.files.length+" partner"+(GH.files.length===1?"":"s")+".","ok");
          toast("No duplicate references.");
        } else {
          ghSetStatus("Duplicate contract reference on file: "+ghDuplicateWarning()+
                      ". Open one of them and allocate a new reference.","err");
          toast(d.length+" duplicate reference"+(d.length===1?"":"s")+" found.",true);
        }
        refresh();
      }).catch(function(e){ ghSetStatus(e.message||String(e),"err"); });
      break; }
    case "btnSaveJson":
      download(packBase()+" - partner-data.json", u8(JSON.stringify(partnerRecord(D),null,2)+"\n"), "application/json");
      toast("Data saved."); break;
    case "btnLoadJson": document.getElementById("fileIn").click(); break;
    case "btnChecks": case "btnChecksTop": checksDialog(); break;
    case "chkClose": { var ov3=document.getElementById("chkOverlay"); if(ov3) ov3.remove(); break; }
    case "btnGoSync": activeTab="SYNC"; render(); break;
    case "btnGrpCollapse":
      document.querySelectorAll("#form .grp").forEach(function(s){ GRP[s.dataset.grp]=true; });
      grpSave(); renderForm(); break;
    case "btnGrpExpand":
      GRP={}; grpSave(); renderForm(); break;
    case "btnGhTest": ghTest(); break;
    case "btnGhConnect": ghConnect(); break;
    case "btnGhRefresh": case "btnGhRefresh2": ghRefresh(false); break;
    case "btnGhSave": ghSave(); break;
    case "btnGhForget": ghForgetToken(); refresh(); break;
  }
});
/* which already-negotiated values a returned questionnaire would overwrite */
function overwriteWarnings(base,answers){
  var out=[];
  Object.keys(answers||{}).forEach(function(k){
    if(!/^(commercial|term|targets)\./.test(k)) return;
    var old=pGet(base,k);
    if(old===undefined||old===null||String(old).trim()==="") return;
    if(String(old)===String(answers[k])) return;
    out.push(k.split(".").pop()+": "+old+" \u2192 "+answers[k]);
  });
  return out;
}
function loadPayload(txt){
  var obj=JSON.parse(txt);
  var isIntake = obj && obj.schema===SCHEMA_INTAKE && obj.answers;
  if(!isIntake){
    D=mergeIntoBlank(recordToData(obj));
    activeTab="WB"; refresh(); toast("Partner data loaded.");
    return;
  }
  var answers=obj.answers, issued=obj.issued||{};
  var name=answers["partner.legalName"]||issued.slug||"partner";
  var slug=slugify(name)||issued.slug||"partner";
  function apply(base,where,warn){
    var d=intakeToData(answers, base);
    if(issued.modelKey && MODELS[issued.modelKey]) d.modelKey=issued.modelKey;   /* the model we offered wins */
    if(issued.ref && !d.ref) d.ref=issued.ref;
    d.slug=slug;
    D=d; activeTab="WB"; refresh();
    ghSetStatus(where+(warn&&warn.length?"  Overwrote agreed values — "+warn.join("; "):""), warn&&warn.length?"err":"ok");
    toast(where + (warn&&warn.length?" ("+warn.length+" agreed value(s) changed — see the Pipeline tab)":""));
  }
  var inRepo = GH.connected && GH.files.filter(function(x){ return x.slug===slug; })[0];
  if(inRepo){
    ghSetStatus("Matching "+name+" against the record already in the repository…","");
    ghReadPartner(inRepo.path).then(function(existing){
      if(existing) apply(existing, "Return from "+name+" merged into the existing repository record.", overwriteWarnings(existing,answers));
      else apply(blankModel(), "Return from "+name+" loaded — the repository copy could not be read, so a fresh record was used.");
    });
    return;
  }
  if(partnerSlug(D)===slug && String(D.partner.legalName||"").trim()){
    apply(D, "Return from "+name+" merged into the open record.", overwriteWarnings(D,answers));
    return;
  }
  apply(blankModel(), "New partner record created from "+name+"'s returned questionnaire.");
}
document.getElementById("fileIn").addEventListener("change", function(e){
  var file=e.target.files[0]; if(!file) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{ loadPayload(fr.result); }
    catch(err){ toast("Could not read that file: "+err.message,true); }
  };
  fr.readAsText(file);
  e.target.value="";
});
