<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="version" content="1.0.0">
<meta name="updated" content="2026-10-27 12:40 SAST">
<title>Data Dictionary Viewer</title>
<style>
  :root{
    --bg:#f6f4ef;--surface:#fffdf9;--surface-2:#efece4;--line:#ddd7cb;
    --fg:#211f1b;--fg-soft:#5a564d;--fg-faint:#8a847a;--accent:#1f6f6b;--accent-soft:#dff0ec;
    --pii:#9a3030;--pii-soft:#f3dada;--cls:#9a4f1b;--cls-soft:#f0e0d1;--type:#4a5a7a;--type-soft:#dde2ec;--warn:#9a6a1b;--warn-soft:#f0e5cf;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--disp:"Fraunces",Georgia,serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#16151a;--surface:#1f1e24;--surface-2:#27262d;--line:#36343d;--fg:#eceaf2;--fg-soft:#b4b0bd;--fg-faint:#827e8c;--accent:#58b8b0;--accent-soft:#15302e;
    --pii:#e88;--pii-soft:#3a1f1f;--cls:#d79156;--cls-soft:#3a2a1b;--type:#9fb2d8;--type-soft:#20273a;--warn:#d6a24e;--warn-soft:#352b17;color-scheme:dark;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;font-size:15px}
  .wrap{max-width:1160px;margin:0 auto;padding:0 18px}
  h1,h2,h3{font-family:var(--disp);font-weight:560;line-height:1.15;margin:0}
  code{font-family:var(--mono);font-size:.84em;background:var(--surface-2);padding:.08em .4em;border-radius:4px}
  a{color:var(--accent)}
  header{padding:28px 0 16px;border-bottom:1px solid var(--line)}
  header .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  header h1{font-size:clamp(1.5rem,4vw,2.1rem)}
  header .files{font-family:var(--mono);font-size:.78rem;color:var(--fg-faint);margin-top:6px}
  header .ver{font-family:var(--mono);font-size:.72rem;color:var(--fg-faint);margin-top:4px}
  .tiles{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:18px 0}
  .tiles .t{background:var(--surface);padding:11px 16px;flex:1;min-width:92px}
  .tiles .t .n{font-family:var(--disp);font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1}
  .tiles .t .l{font-size:.72rem;color:var(--fg-soft);margin-top:2px}
  nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:4px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
  nav button{font:inherit;font-size:.86rem;background:transparent;border:1px solid transparent;color:var(--fg-soft);padding:7px 13px;border-radius:8px;cursor:pointer}
  nav button:hover{background:var(--surface-2)}
  nav button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);font-weight:600}
  main{padding:22px 0 80px}
  .panel{display:none}.panel.on{display:block}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 14px}
  .card h3{font-size:1.05rem}
  .muted{color:var(--fg-soft)}.small{font-size:.84rem}
  table{border-collapse:collapse;width:100%;font-size:.86rem}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-faint);font-weight:600}
  td.n,th.n{font-variant-numeric:tabular-nums}
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  pre{font-family:var(--mono);font-size:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;max-height:70vh}
  .banner{border-radius:10px;padding:12px 15px;margin:0 0 14px;font-size:.88rem;background:var(--warn-soft);color:var(--warn)}
  .pill{display:inline-block;font-family:var(--mono);font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
  .pill.pii{background:var(--pii-soft);color:var(--pii)}.pill.cls{background:var(--cls-soft);color:var(--cls)}.pill.type{background:var(--type-soft);color:var(--type)}.pill.req{background:var(--accent-soft);color:var(--accent)}
  .bar{display:flex;align-items:center;gap:9px;margin:2px 0}
  .bar .lab{min-width:150px;font-size:.82rem}
  .bar .track{flex:1;height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent)}
  .bar .v{font-family:var(--mono);font-size:.76rem;color:var(--fg-faint);min-width:28px;text-align:right}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
  .toolbar input[type=search],.toolbar select{font:inherit;font-size:.84rem;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
  .toolbar input[type=search]{min-width:200px}
  .toolbar label{font-size:.78rem;color:var(--fg-soft);display:flex;align-items:center;gap:6px}
  .toolbar .sp{margin-left:auto;font-family:var(--mono);font-size:.76rem;color:var(--fg-faint)}
  .xlaunch{font-family:var(--mono);font-size:.68rem;color:var(--accent);text-decoration:none;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:999px;padding:1px 8px;margin-left:5px;white-space:nowrap}
  .xlaunch:hover{background:var(--accent-soft)}
  .vals{font-family:var(--mono);font-size:.78rem;color:var(--fg-soft)}
  .empty{color:var(--fg-faint);font-style:italic;padding:8px 0}
  .flash{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="eyebrow" id="kind">data dictionary</div>
  <h1 id="title">Data Dictionary Viewer</h1>
  <div class="files" id="files"></div>
  <div class="ver" id="ver"></div>
</div></header>
<div class="wrap">
  <div class="tiles" id="tiles"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
const DATA = /*__DATA__*/null;
function __run__(DATA){
const $=(s,r=document)=>r.querySelector(s);

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const D=DATA||{counts:{},fields:[],datasets:[],byType:[],byClass:[],warnings:[]};
const F=D.fields||[];
const LINKS=D.links||{};
const slug=s=>String(s==null?"":s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const ANCH={catalog:"dataset",lineage:"node",quality:"dataset",provenance:"entity"};

$("#title").textContent=D.title||"Data Dictionary Viewer";
$("#kind").textContent="data dictionary · "+(D.sourceKind||"generic");
$("#files").textContent=(D.inputs||[]).length?("from "+(D.inputs||[]).join("  ·  ")):"";
const VER=((document.querySelector('meta[name="version"]')||{}).content)||"";
const UPD=((document.querySelector('meta[name="updated"]')||{}).content)||"";
$("#ver").textContent=(VER?("v"+VER):"")+(UPD?((VER?"  ·  ":"")+"built "+UPD):"");

const C=D.counts||{};
[["fields","Fields"],["datasets","Datasets"],["classified","Classified"],["pii","PII fields"]]
 .filter(([k])=>k==="fields"||(C[k]||0)>0).forEach(([k,l])=>$("#tiles").append(el("div",{class:"t"},el("div",{class:"n"},String(C[k]||0)),el("div",{class:"l"},l))));

function dsLinks(ds){if(!ds)return null;const sl=slug(ds);const w=el("span",{});
  ["catalog","lineage","quality","provenance"].forEach(k=>{if(LINKS[k])w.append(el("a",{class:"xlaunch",target:"_blank",rel:"noopener",href:LINKS[k]+"#"+ANCH[k]+"="+sl,title:ds+" in "+k},k));});
  return w.childNodes.length?w:null;}

const panels=[];
function addPanel(id,label,build){panels.push({id,label,build});}

// ---------- Overview
addPanel("overview","Overview",p=>{
  if((D.warnings||[]).length) p.append(el("div",{class:"banner"},el("b",{},"Check: "),D.warnings.join("  ")));
  const barBlock=(title,rows)=>{const c=el("div",{class:"card"},el("h3",{},title));if(!rows.length){c.append(el("div",{class:"empty"},"none"));return c;}
    const max=Math.max(...rows.map(r=>r.count),1);
    rows.slice(0,14).forEach(r=>c.append(el("div",{class:"bar"},el("div",{class:"lab"},r.name),el("div",{class:"track"},el("div",{class:"fill",style:`width:${Math.round(100*r.count/max)}%`})),el("div",{class:"v"},String(r.count)))));
    return c;};
  if((D.byClass||[]).length) p.append(barBlock("Fields by classification",D.byClass));
  p.append(barBlock("Fields by datatype",D.byType||[]));
  if((C.pii||0)>0) p.append(el("div",{class:"card"},el("h3",{},"PII"),el("div",{class:"small"},String(C.pii)+" field(s) flagged as personal or sensitive. See the PII filter on the Fields tab.")));
});

// ---------- Fields
addPanel("fields","Fields",p=>{
  const dss=[...new Set(F.map(f=>f.dataset).filter(Boolean))].sort();
  const types=[...new Set(F.map(f=>f.datatype).filter(Boolean))].sort();
  const clss=[...new Set(F.map(f=>f.classification).filter(Boolean))].sort();
  const selDs=el("select",{},el("option",{value:""},"all datasets"),...dss.map(x=>el("option",{value:x},x)));
  const selTy=el("select",{},el("option",{value:""},"all types"),...types.map(x=>el("option",{value:x},x)));
  const selCl=el("select",{},el("option",{value:""},"all classifications"),...clss.map(x=>el("option",{value:x},x)));
  const piiBox=el("input",{type:"checkbox"}); const search=el("input",{type:"search",placeholder:"search field / definition…"});
  const info=el("div",{class:"sp"});
  p.append(el("div",{class:"toolbar"},(dss.length>1?el("label",{},"dataset",selDs):null),el("label",{},"type",selTy),(clss.length?el("label",{},"class",selCl):null),el("label",{},piiBox,"PII only"),search,info));
  const holder=el("div",{});
  function render(){const q=search.value.toLowerCase(),fd=selDs.value,ft=selTy.value,fc=selCl.value,fp=piiBox.checked;
    const fr=F.filter(f=>(!fd||f.dataset===fd)&&(!ft||f.datatype===ft)&&(!fc||f.classification===fc)&&(!fp||f.pii)&&(!q||(f.name+" "+f.definition+" "+(f.allowedValues||[]).join(" ")).toLowerCase().includes(q)));
    holder.innerHTML="";
    const tb=el("table",{},el("thead",{},el("tr",{},el("th",{},"Field"),dss.length>1?el("th",{},"Dataset"):null,el("th",{},"Type"),el("th",{},"Req"),el("th",{},"Classification"),el("th",{},"Allowed values"),el("th",{},"Definition"))));
    const b=el("tbody",{});
    fr.forEach(f=>{
      const nameCell=el("td",{id:"fld-"+slug(f.dataset+"-"+f.name)},el("b",{},f.name),f.pii?el("span",{class:"pill pii",style:"margin-left:6px"},"PII"):null,f.format?el("div",{class:"small muted"},"format: "+f.format):null);
      b.append(el("tr",{},nameCell,
        dss.length>1?el("td",{class:"small"},f.dataset,dsLinks(f.dataset)):null,
        el("td",{},f.datatype?el("span",{class:"pill type"},f.datatype):""),
        el("td",{},f.required?el("span",{class:"pill req"},"req"):""),
        el("td",{},f.classification?el("span",{class:"pill cls"},f.classification):el("span",{class:"empty"},"—")),
        el("td",{class:"vals"},(f.allowedValues||[]).slice(0,8).join(" · ")+((f.allowedValues||[]).length>8?" …":"")),
        el("td",{class:"small muted"},f.definition||"")));
    });
    tb.append(b); holder.append(el("div",{class:"scroll"},tb));
    if(!fr.length) holder.append(el("div",{class:"empty"},"No fields match."));
    info.textContent=fr.length+" of "+F.length+" fields";}
  [selDs,selTy,selCl].forEach(s=>s.addEventListener("change",render)); piiBox.addEventListener("change",render); search.addEventListener("input",render);
  p.append(holder); render();
});

// ---------- Datasets
if((D.datasets||[]).length>1) addPanel("datasets","By dataset",p=>{
  D.datasets.forEach(ds=>{
    const ff=F.filter(f=>f.dataset===ds);
    const c=el("div",{class:"card"});
    const h=el("h3",{},ds); const dl=dsLinks(ds); if(dl)h.append(" ",dl); c.append(h);
    c.append(el("div",{class:"small muted",style:"margin:2px 0 8px"},ff.length+" field(s)"+(ff.some(f=>f.pii)?(" · "+ff.filter(f=>f.pii).length+" PII"):"")));
    const tb=el("table",{},el("thead",{},el("tr",{},el("th",{},"Field"),el("th",{},"Type"),el("th",{},"Classification"),el("th",{},"Definition"))));
    const b=el("tbody",{}); ff.forEach(f=>b.append(el("tr",{},el("td",{},el("b",{},f.name),f.pii?el("span",{class:"pill pii",style:"margin-left:6px"},"PII"):null),el("td",{},f.datatype||""),el("td",{},f.classification||""),el("td",{class:"small muted"},f.definition||""))));
    tb.append(b); c.append(tb); p.append(c);
  });
});

// ---------- Classifications
if((D.byClass||[]).length||(C.pii||0)) addPanel("classification","Classification",p=>{
  const tb=el("table",{},el("thead",{},el("tr",{},el("th",{},"Classification"),el("th",{class:"n"},"Fields"),el("th",{},"Fields (sample)"))));
  const b=el("tbody",{});
  (D.byClass||[]).forEach(c=>{const ff=F.filter(f=>f.classification===c.name).map(f=>f.name);
    b.append(el("tr",{},el("td",{},el("span",{class:"pill cls"},c.name)),el("td",{class:"n"},String(c.count)),el("td",{class:"small muted"},ff.slice(0,10).join(", ")+(ff.length>10?" …":""))));});
  const piiF=F.filter(f=>f.pii).map(f=>f.dataset+"."+f.name);
  if(piiF.length) b.append(el("tr",{},el("td",{},el("span",{class:"pill pii"},"PII")),el("td",{class:"n"},String(piiF.length)),el("td",{class:"small muted"},piiF.slice(0,12).join(", ")+(piiF.length>12?" …":""))));
  tb.append(b); p.append(el("div",{class:"card"},tb));
});

// ---------- Raw
addPanel("raw","Dictionary JSON",p=>{p.append(el("pre",{},JSON.stringify(D,null,2)));});

const nav=$("#nav"),main=$("#main");
panels.forEach((pn,i)=>{const b=el("button",{role:"tab","aria-selected":i===0?"true":"false",onclick:()=>select(i)},pn.label);pn._btn=b;nav.append(b);const d=el("div",{class:"panel"+(i===0?" on":""),id:"panel-"+pn.id});pn._div=d;main.append(d);pn._built=false;});
function select(i){panels.forEach((pn,j)=>{pn._btn.setAttribute("aria-selected",j===i?"true":"false");pn._div.classList.toggle("on",j===i);});const pn=panels[i];if(!pn._built){pn.build(pn._div);pn._built=true;}}
select(0);
// inbound: #dataset=<slug> filters Fields to that dataset
function fromHash(){const m=/(?:^|&)dataset=([^&]+)/.exec((location.hash||"").replace(/^#/,""));if(!m)return;const sl=decodeURIComponent(m[1]);const ds=(D.datasets||[]).find(d=>slug(d)===sl);if(!ds)return;const i=panels.findIndex(p=>p.id==="fields");select(i);const pn=panels[i];setTimeout(()=>{const sel=pn._div.querySelector("select");if(sel){sel.value=ds;sel.dispatchEvent(new Event("change"));}},40);}
window.addEventListener("hashchange",fromHash); fromHash();
} /* __run__ */
(function(){function ld(s){if(s.indexOf('gh:')===0){var r=s.slice(3),ref='main',at=r.lastIndexOf('@');if(at>0){ref=r.slice(at+1);r=r.slice(0,at);}var a=r.split('/'),ow=a.shift(),rp=a.shift(),pa=a.join('/'),tk='';try{tk=localStorage.getItem((new URLSearchParams(location.search).get('tokenKey'))||'mdaReadiness.ghpat')||'';}catch(e){}var h={'Accept':'application/vnd.github.raw','X-GitHub-Api-Version':'2022-11-28'};if(tk)h['Authorization']='Bearer '+tk;return fetch('https://api.github.com/repos/'+ow+'/'+rp+'/contents/'+pa+'?ref='+encodeURIComponent(ref),{headers:h,cache:'no-store'});}return fetch(s,{cache:'no-store'});}var p=new URLSearchParams(location.search),src=p.get('data')||((document.querySelector('meta[name="data-src"]')||{}).content||'');if(src){ld(src).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();}).then(function(j){__run__(j);}).catch(function(e){__run__(DATA);var b=document.getElementById('ver');if(b)b.textContent+='  ·  embedded ('+String((e&&e.message)||e)+')';});}else{__run__(DATA);}})();
</script>
</body>
</html>
