<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="version" content="1.0.1">
<title>CDMP Value Survey — Modelware</title>
<style>
:root{
  --bg:#eef1f1; --surface:#ffffff; --surface-2:#f5f8f8; --fg:#152220; --muted:#5b6b67; --faint:#8a9793;
  --line:#dce3e1; --line-strong:#c2cdca; --accent:#0f766e; --accent-2:#0b5c55; --accent-soft:#dcefec;
  --good:#0f7a52; --crit:#bd3b28; --sel:#d9ece9;
  --ff-display:"IBM Plex Serif",Georgia,serif;
  --ff-body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ff-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(12,32,28,.06),0 8px 26px rgba(12,32,28,.07);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1614; --surface:#152220; --surface-2:#1a2725; --fg:#e7efec; --muted:#a2b2ad; --faint:#7d8f8a;
  --line:#25332f; --line-strong:#35463f; --accent:#4fd1c0; --accent-2:#6fe0d1; --accent-soft:#123a35;
  --good:#43c78d; --crit:#f0836e; --sel:#143c37;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.4);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ff-body);line-height:1.55;
  -webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 72px}
h1,h2,h3{margin:0;text-wrap:balance}
a{color:var(--accent)}
.mono{font-family:var(--ff-mono)}

/* Sticky header + progress */
.top{position:sticky;top:env(safe-area-inset-top,0);z-index:10;background:var(--bg);
  padding-top:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand .name{font-family:var(--ff-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.brand .ver{font-family:var(--ff-mono);font-size:11px;color:var(--faint)}
.progress-wrap{margin:11px 0 12px}
.progress-meta{display:flex;justify-content:space-between;font-family:var(--ff-mono);font-size:11.5px;color:var(--muted);margin-bottom:6px}
.pbar{height:7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.pbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s ease}

/* Cards / screens */
.screen{padding-top:22px}
.intro h1{font-family:var(--ff-display);font-weight:600;font-size:clamp(26px,5vw,36px);line-height:1.12;letter-spacing:-.01em}
.intro .lead{font-size:16.5px;color:var(--fg);margin-top:14px}
.intro .meta{margin-top:16px;font-size:14px;color:var(--muted)}
.primer{margin-top:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow:hidden}
.primer summary{list-style:none;cursor:pointer;padding:13px 15px;font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:9px}
.primer summary::-webkit-details-marker{display:none}
.primer summary .chev{margin-left:auto;color:var(--faint);transition:transform .2s ease}
.primer[open] summary .chev{transform:rotate(90deg)}
.primer .body{padding:0 15px 14px;font-size:14px;color:var(--fg)}
.primer .body p{margin:8px 0}
.primer .body dl{margin:8px 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.primer .body dt{font-family:var(--ff-mono);font-weight:600;font-size:12.5px;color:var(--accent)}
.primer .body dd{margin:0;font-size:13.5px}
.primer .more{display:inline-block;margin-top:10px;font-family:var(--ff-mono);font-size:12.5px;font-weight:600;
  background:var(--accent);color:#fff;text-decoration:none;padding:8px 14px;border-radius:9px}
@media (prefers-color-scheme:dark){.primer .more{color:#06201c}}
.section-title{font-family:var(--ff-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.section-h{font-family:var(--ff-display);font-weight:600;font-size:23px;margin-top:6px;line-height:1.2}
.section-intro{font-size:14.5px;color:var(--muted);margin-top:10px;padding:11px 13px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}

.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-top:16px}
.q.err{border-color:var(--crit)}
.q-text{font-size:16px;font-weight:600;line-height:1.4}
.q-num{font-family:var(--ff-mono);color:var(--accent);font-size:13px;margin-right:8px}
.q-help{font-size:13px;color:var(--muted);margin-top:4px}
.q-req{color:var(--crit);margin-left:4px}
.errmsg{color:var(--crit);font-size:13px;margin-top:9px;display:none}
.q.err .errmsg{display:block}

/* Choices */
.opts{margin-top:13px;display:grid;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--line-strong);border-radius:11px;
  padding:11px 13px;cursor:pointer;background:var(--surface);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--sel)}
.opt input{position:absolute;opacity:0;width:0;height:0}
.mark{width:19px;height:19px;flex-shrink:0;margin-top:1px;border:2px solid var(--line-strong);display:grid;place-items:center;transition:border-color .12s}
.mark.radio{border-radius:50%}
.mark.check{border-radius:6px}
.opt.on .mark{border-color:var(--accent)}
.opt.on .mark.radio::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
.opt.on .mark.check::after{content:"";width:11px;height:11px;border-radius:3px;background:var(--accent)}
.opt.disabled{opacity:.45;cursor:not-allowed}
.opt-label{font-size:14.5px}
.opt-v{font-family:var(--ff-mono);font-size:12px;color:var(--faint);margin-right:2px}

/* Likert */
.likert{margin-top:14px}
.likert-scale{display:flex;gap:7px}
.likert-scale button{flex:1;min-width:0;font-family:var(--ff-mono);font-size:15px;font-weight:600;
  border:1.5px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:10px;padding:12px 4px;cursor:pointer;transition:.12s}
.likert-scale button:hover{border-color:var(--accent)}
.likert-scale button.on{border-color:var(--accent);background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.likert-scale button.on{color:#06201d}}
.likert-ends{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);margin-top:7px}
.likert-extra{margin-top:9px;display:grid;gap:9px}

/* Matrix */
.matrix-scalehead{display:none}
.mrow{border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:11px;background:var(--surface-2)}
.mrow-label{font-size:14px;font-weight:600;margin-bottom:9px}
.mrow-opts{display:flex;gap:6px}
.mrow-opts button{flex:1;min-width:0;font-family:var(--ff-mono);font-size:14px;font-weight:600;border:1.5px solid var(--line-strong);
  background:var(--surface);color:var(--fg);border-radius:9px;padding:11px 2px;cursor:pointer;transition:.12s;position:relative}
.mrow-opts button:hover{border-color:var(--accent)}
.mrow-opts button.on{border-color:var(--accent);background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.mrow-opts button.on{color:#06201d}}
.mrow-opts button small{display:block;font-family:var(--ff-body);font-size:9.5px;font-weight:500;line-height:1.1;margin-top:3px;opacity:.8}

/* Text */
textarea,input[type=email]{width:100%;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface-2);
  color:var(--fg);font-family:var(--ff-body);font-size:15px;padding:11px 13px;line-height:1.5}
textarea{resize:vertical;min-height:52px}
textarea:focus,input[type=email]:focus{outline:none;border-color:var(--accent);background:var(--surface)}

/* Email block */
.contact{background:var(--surface);border:1px dashed var(--line-strong);border-radius:14px;padding:18px;margin-top:16px}
.contact h3{font-family:var(--ff-display);font-size:18px;font-weight:600}
.contact p{font-size:13.5px;color:var(--muted);margin:7px 0 12px}

/* Nav */
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.btn{font-family:var(--ff-body);font-size:15px;font-weight:600;border-radius:11px;padding:13px 22px;cursor:pointer;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--fg);transition:.12s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-2)}
@media (prefers-color-scheme:dark){.btn.primary{color:#06201d}}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent}
.saved-note{text-align:center;font-family:var(--ff-mono);font-size:11.5px;color:var(--faint);margin-top:16px}

/* Thank you / preview */
.thanks{text-align:center;padding:40px 10px}
.thanks .tick{width:58px;height:58px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 18px;font-size:30px}
.thanks h2{font-family:var(--ff-display);font-size:26px;font-weight:600}
.thanks p{color:var(--muted);margin-top:10px}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:20px;text-align:left}
.preview h3{font-family:var(--ff-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.preview pre{font-family:var(--ff-mono);font-size:11.5px;white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:9px;max-height:340px;overflow:auto}
.banner{font-family:var(--ff-mono);font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 11px;margin-top:12px;text-align:center}
.loading,.fatal{text-align:center;padding:60px 16px;color:var(--muted)}
.fatal b{color:var(--crit)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <span class="name">Modelware · CDMP Value</span>
      <span class="ver">v<span id="appVersion"></span></span>
    </div>
    <div class="progress-wrap" id="progressWrap" hidden>
      <div class="progress-meta"><span id="stepLabel"></span><span id="pctLabel"></span></div>
      <div class="pbar"><i id="pbar"></i></div>
    </div>
  </div>
  <div id="app"><div class="loading">Loading survey…</div></div>
  <div class="saved-note" id="savedNote" hidden>Your answers are saved on this device as you go.</div>
</div>

<script>
"use strict";
document.getElementById('appVersion').textContent =
  document.querySelector('meta[name="version"]').content;

var SURVEY=null, STEP=0, ANSWERS={}, EMAIL="", STARTED=Date.now(), TOKEN="", SUBMITTED=false, QORD={};
var TS_TOKEN=null, TS_WIDGET=null, TS_LOADING=false;
var app=document.getElementById('app');

function loadTurnstile(cb){
  if(window.turnstile){cb();return;}
  window.__tsReady=function(){cb();};
  if(TS_LOADING)return; TS_LOADING=true;
  var s=document.createElement('script');
  s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=__tsReady';
  s.async=true;s.defer=true;document.head.appendChild(s);
}

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function uuid(){try{return crypto.randomUUID();}catch(e){return 'r-'+Date.now()+'-'+Math.random().toString(16).slice(2);}}

function storeKey(){return 'cdmp-survey:'+(SURVEY?SURVEY.id:'x');}
function save(){lsSet(storeKey(), JSON.stringify({answers:ANSWERS,email:EMAIL,step:STEP,started:STARTED}));}
function restore(){
  var raw=lsGet(storeKey()); if(!raw) return;
  try{var d=JSON.parse(raw); ANSWERS=d.answers||{}; EMAIL=d.email||""; STEP=d.step||0; STARTED=d.started||Date.now();}catch(e){}
}

fetch('survey.json',{cache:'no-store'}).then(function(r){
  if(!r.ok) throw new Error('HTTP '+r.status); return r.json();
}).then(function(data){
  SURVEY=data;
  (function(){var i=0;QORD={};SURVEY.sections.forEach(function(s){s.questions.forEach(function(q){QORD[q.id]=++i;});});})();
  TOKEN=lsGet('cdmp-survey:token'); if(!TOKEN){TOKEN=uuid(); lsSet('cdmp-survey:token',TOKEN);}
  restore();
  SUBMITTED = lsGet('cdmp-survey:submitted:'+SURVEY.id)==='1';
  document.getElementById('savedNote').hidden=false;
  if(SUBMITTED && SURVEY.config && SURVEY.config.lockAfterSubmit){ renderLocked(); return; }
  render();
}).catch(function(e){
  app.innerHTML='<div class="fatal"><b>Couldn’t load the survey.</b><br>survey.json is missing or unreadable ('+String(e.message||e)+'). If you just deployed, give GitHub Pages a minute and refresh.</div>';
});

/* ---- helpers ---- */
function visibleQuestions(section){
  return section.questions.filter(function(q){
    if(!q.showIf) return true;
    var v=ANSWERS[q.showIf.question];
    return q.showIf.in.indexOf(v)>-1;
  });
}
function isAnswered(q){
  var v=ANSWERS[q.id];
  if(q.type==='multi') return Array.isArray(v)&&v.length>0;
  if(q.type==='matrix'){ if(!v) return false; return q.rows.every(function(r){return v[r.k]!=null;}); }
  if(q.type==='text') return true; /* text never blocks; required handled separately if needed */
  return v!=null && v!=='';
}
function requiredMissing(section){
  return visibleQuestions(section).filter(function(q){ return q.required && !isAnswered(q); });
}
function totalRequired(){
  var n=0; SURVEY.sections.forEach(function(s){ visibleQuestions(s).forEach(function(q){ if(q.required) n++; }); }); return n;
}
function answeredRequired(){
  var n=0; SURVEY.sections.forEach(function(s){ visibleQuestions(s).forEach(function(q){ if(q.required&&isAnswered(q)) n++; }); }); return n;
}

/* ---- render ---- */
function render(){
  var pw=document.getElementById('progressWrap');
  if(STEP===0 || STEP>SURVEY.sections.length){ pw.hidden=true; }
  else{
    pw.hidden=false;
    var tot=totalRequired(), ans=answeredRequired(), pct=tot?Math.round(ans/tot*100):0;
    document.getElementById('pbar').style.width=pct+'%';
    document.getElementById('stepLabel').textContent='Section '+STEP+' of '+SURVEY.sections.length;
    document.getElementById('pctLabel').textContent=pct+'% complete';
  }
  if(STEP===0){ renderIntro(); }
  else if(STEP<=SURVEY.sections.length){ renderSection(SURVEY.sections[STEP-1]); }
  else{ renderReview(); }
  window.scrollTo(0,0);
}

function renderIntro(){
  var resume = (answeredRequired()>0);
  app.innerHTML=
    '<div class="screen intro">'+
      '<div class="section-title">'+esc(SURVEY.title)+'</div>'+
      '<h1>'+esc(SURVEY.title)+'</h1>'+
      '<p class="lead">'+esc(SURVEY.purpose)+'</p>'+
      '<p class="meta">About '+esc(SURVEY.estimatedMinutes)+' minutes · '+SURVEY.sections.length+' short sections · anonymous. Your answers save automatically on this device, so you can stop and come back.</p>'+
      '<details class="primer">'+
        '<summary>New to the CDMP? Start here<span class="chev">›</span></summary>'+
        '<div class="body">'+
          '<p>The <b>CDMP</b> (Certified Data Management Professional) is DAMA’s certification. Everyone enters through one exam, the <b>DMF</b> (Data Management Fundamentals):</p>'+
          '<dl>'+
            '<dt>Associate</dt><dd>Pass the DMF exam at 60%+. The foundation credential.</dd>'+
            '<dt>Practitioner</dt><dd>DMF + any two specialist exams, 70%+ in all three.</dd>'+
            '<dt>Master</dt><dd>DMF + two specialists at 80%+, plus 10 years’ experience.</dd>'+
          '</dl>'+
          '<p><b>DMBOK</b> = Data Management Body of Knowledge, DAMA’s reference guide the exams are based on. A high DMF score alone is still Associate — Practitioner and Master each need two specialist exams too.</p>'+
          '<a class="more" href="../cdmp-about/" target="_blank" rel="noopener">Read the full CDMP guide →</a>'+
        '</div>'+
      '</details>'+
      (SUBMITTED?'<div class="banner">You’ve already submitted this survey from this device. You can submit again if you need to.</div>':'')+
      '<div class="nav"><span></span><button class="btn primary" id="startBtn">'+(resume?'Resume survey':'Start survey')+'</button></div>'+
    '</div>';
  document.getElementById('startBtn').onclick=function(){ STEP = resume ? clampStep() : 1; save(); render(); };
}
function clampStep(){ var s=STEP; if(s<1) s=1; if(s>SURVEY.sections.length) s=SURVEY.sections.length; return s; }

function renderSection(section){
  var html='<div class="screen">'+
    '<div class="section-title">Section '+STEP+'</div>'+
    '<h2 class="section-h">'+esc(section.title)+'</h2>'+
    (section.intro?'<div class="section-intro">'+esc(section.intro)+'</div>':'');
  var vis=visibleQuestions(section);
  vis.forEach(function(q){ html+=renderQuestion(q); });
  html+='<div class="nav">'+
    '<button class="btn ghost" id="prevBtn">← Back</button>'+
    '<button class="btn primary" id="nextBtn">'+(STEP===SURVEY.sections.length?'Review & submit':'Next →')+'</button>'+
    '</div></div>';
  app.innerHTML=html;
  bindSection(section);
  document.getElementById('prevBtn').onclick=function(){ STEP--; save(); render(); };
  document.getElementById('nextBtn').onclick=function(){
    var miss=requiredMissing(section);
    if(miss.length){
      miss.forEach(function(q){ var el=document.getElementById('q-'+q.id); if(el) el.classList.add('err'); });
      var first=document.getElementById('q-'+miss[0].id); if(first) first.scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
    STEP++; save(); render();
  };
}

var LETTERS=['A','B','C','D','E'];
function renderQuestion(q){
  var num=QORD[q.id]||'';
  var head='<div class="q" id="q-'+q.id+'">'+
    '<div class="q-text">'+(num?'<span class="q-num">Q'+num+'</span>':'')+esc(q.text)+(q.required?'<span class="q-req">*</span>':'')+'</div>'+
    (q.help?'<div class="q-help">'+esc(q.help)+'</div>':'');
  var body='';
  if(q.type==='single'){
    body='<div class="opts">'+q.options.map(function(o){
      var on=ANSWERS[q.id]===o.v;
      return '<label class="opt'+(on?' on':'')+'" data-q="'+q.id+'" data-v="'+esc(o.v)+'">'+
        '<span class="mark radio"></span><span class="opt-label">'+esc(o.label)+'</span></label>';
    }).join('')+'</div>';
  } else if(q.type==='multi'){
    var cur=ANSWERS[q.id]||[]; var full=q.max>0 && cur.length>=q.max;
    body='<div class="opts">'+q.options.map(function(o){
      var on=cur.indexOf(o.v)>-1;
      var disabled = !on && !o.exclusive && full;
      return '<label class="opt'+(on?' on':'')+(disabled?' disabled':'')+'" data-q="'+q.id+'" data-v="'+esc(o.v)+'"'+(o.exclusive?' data-excl="1"':'')+'>'+
        '<span class="mark check"></span><span class="opt-label">'+esc(o.label)+'</span></label>';
    }).join('')+'</div>';
  } else if(q.type==='likert'){
    var n=[]; for(var i=q.min;i<=q.max;i++) n.push(i);
    body='<div class="likert"><div class="likert-scale">'+n.map(function(i){
      var on=ANSWERS[q.id]===i; var ex=q.extraLabels&&q.extraLabels[String(i)];
      return '<button type="button" class="'+(on?'on':'')+'" data-q="'+q.id+'" data-val="'+i+'" title="'+esc(ex||'')+'">'+i+'</button>';
    }).join('')+'</div><div class="likert-ends"><span>'+esc(q.minLabel||'')+'</span><span>'+esc(q.maxLabel||'')+'</span></div>'+
    (q.extraLabels?'<div class="likert-ends" style="margin-top:4px">'+Object.keys(q.extraLabels).map(function(k){return '<span>'+k+' = '+esc(q.extraLabels[k])+'</span>';}).join('')+'</div>':'')+
    '</div>';
  } else if(q.type==='matrix'){
    var cur2=ANSWERS[q.id]||{};
    body='<div class="matrix">'+q.rows.map(function(r){
      var scale=''; for(var i=q.min;i<=q.max;i++){
        var on=cur2[r.k]===i; var lbl=(q.scaleLabels&&q.scaleLabels[i-q.min])||'';
        scale+='<button type="button" class="'+(on?'on':'')+'" data-q="'+q.id+'" data-row="'+r.k+'" data-val="'+i+'">'+i+(lbl?'<small>'+esc(lbl)+'</small>':'')+'</button>';
      }
      return '<div class="mrow"><div class="mrow-label">'+esc(r.label)+'</div><div class="mrow-opts">'+scale+'</div></div>';
    }).join('')+'</div>';
  } else if(q.type==='text'){
    var val=ANSWERS[q.id]||'';
    body='<div style="margin-top:12px"><textarea data-q="'+q.id+'"'+(q.long?' rows="3"':'')+' placeholder="Optional">'+esc(val)+'</textarea></div>';
  }
  return head+body+'<div class="errmsg">Please answer this question to continue.</div></div>';
}

function bindSection(section){
  app.querySelectorAll('.opt[data-q]').forEach(function(el){
    el.addEventListener('click',function(e){
      e.preventDefault();
      var qid=el.getAttribute('data-q'), v=el.getAttribute('data-v');
      var q=findQ(qid);
      if(el.classList.contains('disabled')) return;
      if(q.type==='single'){ ANSWERS[qid]=v; }
      else if(q.type==='multi'){
        var cur=ANSWERS[qid]||[]; var excl=el.getAttribute('data-excl');
        if(cur.indexOf(v)>-1){ cur=cur.filter(function(x){return x!==v;}); }
        else{
          if(excl){ cur=[v]; }
          else{
            cur=cur.filter(function(x){ var o=findOpt(q,x); return !(o&&o.exclusive); });
            if(q.max>0 && cur.length>=q.max) return;
            cur.push(v);
          }
        }
        ANSWERS[qid]=cur;
      }
      clearErr(qid); save(); rerenderQuestion(q,section);
    });
  });
  app.querySelectorAll('.likert-scale button').forEach(function(b){
    b.addEventListener('click',function(){
      var qid=b.getAttribute('data-q'); ANSWERS[qid]=parseInt(b.getAttribute('data-val'),10);
      clearErr(qid); save(); rerenderQuestion(findQ(qid),section);
    });
  });
  app.querySelectorAll('.mrow-opts button').forEach(function(b){
    b.addEventListener('click',function(){
      var qid=b.getAttribute('data-q'), row=b.getAttribute('data-row');
      ANSWERS[qid]=ANSWERS[qid]||{}; ANSWERS[qid][row]=parseInt(b.getAttribute('data-val'),10);
      clearErr(qid); save(); rerenderQuestion(findQ(qid),section);
    });
  });
  app.querySelectorAll('textarea[data-q]').forEach(function(t){
    t.addEventListener('input',function(){
      var qid=t.getAttribute('data-q'); ANSWERS[qid]=t.value;
      var q=findQ(qid);
      if(q&&q.showIf){ /* a follow-up answer may reveal nothing else; no re-render needed */ }
      save();
    });
    t.addEventListener('blur',save);
  });
}

function rerenderQuestion(q,section){
  /* replace just this question's card to reflect selection + conditional reveals */
  var old=document.getElementById('q-'+q.id);
  if(!old) return;
  var tmp=document.createElement('div'); tmp.innerHTML=renderQuestion(q);
  old.replaceWith(tmp.firstChild);
  bindOne(q.id,section);
  /* handle conditional questions that depend on this one (e.g. q4 -> q4_followup) */
  section.questions.forEach(function(dep){
    if(dep.showIf && dep.showIf.question===q.id){
      var depEl=document.getElementById('q-'+dep.id);
      var shouldShow = dep.showIf.in.indexOf(ANSWERS[q.id])>-1;
      if(shouldShow && !depEl){
        var host=document.getElementById('q-'+q.id);
        var tmp2=document.createElement('div'); tmp2.innerHTML=renderQuestion(dep);
        host.after(tmp2.firstChild); bindOne(dep.id,section);
      } else if(!shouldShow && depEl){ depEl.remove(); }
    }
  });
}
function bindOne(qid,section){
  /* re-bind handlers for a single re-rendered question by rebinding the whole section lazily */
  var el=document.getElementById('q-'+qid); if(!el) return;
  el.querySelectorAll('.opt[data-q]').forEach(function(o){ rebindOpt(o,section); });
  el.querySelectorAll('.likert-scale button').forEach(function(b){ b.addEventListener('click',function(){ ANSWERS[qid]=parseInt(b.getAttribute('data-val'),10); clearErr(qid); save(); rerenderQuestion(findQ(qid),section); }); });
  el.querySelectorAll('.mrow-opts button').forEach(function(b){ b.addEventListener('click',function(){ var row=b.getAttribute('data-row'); ANSWERS[qid]=ANSWERS[qid]||{}; ANSWERS[qid][row]=parseInt(b.getAttribute('data-val'),10); clearErr(qid); save(); rerenderQuestion(findQ(qid),section); }); });
  el.querySelectorAll('textarea[data-q]').forEach(function(t){ t.addEventListener('input',function(){ ANSWERS[qid]=t.value; save(); }); t.addEventListener('blur',save); });
}
function rebindOpt(el,section){
  el.addEventListener('click',function(e){
    e.preventDefault();
    var qid=el.getAttribute('data-q'), v=el.getAttribute('data-v'); var q=findQ(qid);
    if(el.classList.contains('disabled')) return;
    if(q.type==='single'){ ANSWERS[qid]=v; }
    else if(q.type==='multi'){
      var cur=ANSWERS[qid]||[]; var excl=el.getAttribute('data-excl');
      if(cur.indexOf(v)>-1){ cur=cur.filter(function(x){return x!==v;}); }
      else{ if(excl){cur=[v];} else{ cur=cur.filter(function(x){var o=findOpt(q,x);return !(o&&o.exclusive);}); if(q.max>0&&cur.length>=q.max) return; cur.push(v); } }
      ANSWERS[qid]=cur;
    }
    clearErr(qid); save(); rerenderQuestion(q,section);
  });
}

function clearErr(qid){ var el=document.getElementById('q-'+qid); if(el) el.classList.remove('err'); }
function findQ(qid){ var f=null; SURVEY.sections.forEach(function(s){ s.questions.forEach(function(q){ if(q.id===qid) f=q; }); }); return f; }
function findOpt(q,v){ return (q.options||[]).filter(function(o){return o.v===v;})[0]; }

/* ---- review + submit ---- */
function renderReview(){
  var cfg=SURVEY.config||{};
  var html='<div class="screen"><div class="section-title">Almost done</div>'+
    '<h2 class="section-h">Review & submit</h2>'+
    '<p class="section-intro">You’ve answered every required question. The three final free-text questions are optional. Add an email only if you’d like to be contacted — it’s stored separately from your answers.</p>';
  if(cfg.collectEmail){
    html+='<div class="contact"><h3>Optional: stay in touch</h3>'+
      '<p>Leave your email only if you want follow-up about the CDMP pathway. Blank is completely fine and keeps your response anonymous.</p>'+
      '<input type="email" id="emailField" placeholder="you@example.com (optional)" value="'+esc(EMAIL)+'"></div>';
  }
  var siteKey=cfg.turnstileSiteKey||'';
  if(siteKey){ html+='<div class="contact" style="border-style:solid"><h3>Quick check</h3><p>A one-tap check that you’re human — keeps automated submissions out.</p><div id="tsWidget"></div></div>'; }
  html+='<div class="nav"><button class="btn ghost" id="prevBtn">← Back</button>'+
    '<button class="btn primary" id="submitBtn">Submit response</button></div></div>';
  app.innerHTML=html;
  var ef=document.getElementById('emailField');
  if(ef){ ef.addEventListener('input',function(){ EMAIL=ef.value.trim(); save(); }); }
  document.getElementById('prevBtn').onclick=function(){ STEP=SURVEY.sections.length; save(); render(); };
  document.getElementById('submitBtn').onclick=doSubmit;
  if(siteKey){
    TS_TOKEN=null;
    loadTurnstile(function(){
      try{ TS_WIDGET=window.turnstile.render('#tsWidget',{sitekey:siteKey,
        callback:function(t){TS_TOKEN=t;},
        'expired-callback':function(){TS_TOKEN=null;},
        'error-callback':function(){TS_TOKEN=null;}}); }catch(e){}
    });
  }
}

function buildPayload(){
  return {
    schema:1, survey:SURVEY.id, engineVersion:SURVEY.engineVersion||1,
    submittedAt:new Date().toISOString(), respondentToken:TOKEN,
    answers:ANSWERS, email:(EMAIL||null),
    meta:{ durationMs:Date.now()-STARTED, tz:(Intl.DateTimeFormat().resolvedOptions().timeZone||''), ua:navigator.userAgent }
  };
}

function doSubmit(){
  var btn=document.getElementById('submitBtn');
  var siteKey=(SURVEY.config&&SURVEY.config.turnstileSiteKey)||'';
  if(siteKey && !TS_TOKEN){
    var old=document.getElementById('submitErr'); if(old) old.remove();
    var w=document.createElement('div'); w.id='submitErr'; w.className='banner'; w.style.color='var(--crit)';
    w.textContent='Please complete the quick human check above, then submit.';
    btn.parentNode.after(w); return;
  }
  btn.disabled=true; btn.textContent='Submitting…';
  var payload=buildPayload();
  if(siteKey) payload.turnstileToken=TS_TOKEN;
  var endpoint=(SURVEY.config&&SURVEY.config.endpoint)||'';
  if(!endpoint){ showThanks(payload, true); return; }
  fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){ return r.text().then(function(body){
        if(!r.ok){ var d=body; try{ var j=JSON.parse(body); d=j.detail||j.error||body; }catch(_){}
          throw new Error('HTTP '+r.status+(d?' — '+d:'')); }
        return body; }); })
    .then(function(){ markSubmitted(); showThanks(payload,false); })
    .catch(function(e){
      btn.disabled=false; btn.textContent='Submit response';
      var old=document.getElementById('submitErr'); if(old) old.remove();
      var n=document.createElement('div'); n.id='submitErr'; n.className='banner'; n.style.color='var(--crit)';
      n.textContent='Submission failed — '+String(e.message||e)+'. Your answers are still saved here.';
      btn.parentNode.after(n);
    });
}
function markSubmitted(){ lsSet('cdmp-survey:submitted:'+SURVEY.id,'1'); try{localStorage.removeItem(storeKey());}catch(e){} }

function showThanks(payload, preview){
  if(preview){ SUBMITTED=false; }
  var html='<div class="thanks"><div class="tick">✓</div>'+
    '<h2>'+(preview?'Preview — not submitted':'Thank you')+'</h2>'+
    '<p>'+(preview
      ? 'No write-proxy is configured yet, so nothing was sent. Below is exactly the response that <em>would</em> be saved as one JSON file in the private repo.'
      : 'Your response has been recorded. Thank you for helping shape the CDMP professional-development pathway.')+'</p>';
  if(preview){
    html+='<div class="preview"><h3>Compiled response JSON</h3><pre>'+esc(JSON.stringify(payload,null,2))+'</pre></div>'+
      '<div class="banner">To go live: set <span class="mono">config.endpoint</span> in survey.json to your write-proxy URL.</div>';
  }
  html+='</div>';
  app.innerHTML=html;
  document.getElementById('progressWrap').hidden=true;
  document.getElementById('savedNote').hidden=true;
}

function renderLocked(){
  var pw=document.getElementById('progressWrap'); if(pw)pw.hidden=true;
  var sn=document.getElementById('savedNote'); if(sn)sn.hidden=true;
  app.innerHTML='<div class="thanks"><div class="tick">✓</div><h2>Already completed</h2>'+
    '<p>Our records show this survey was already submitted from this device. Thank you — there’s no need to complete it again.</p></div>';
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
</script>
