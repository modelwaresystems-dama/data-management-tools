Object.assign(App,{
  renderPredicates(){
    const rels=this.lex.rows.map((r,i)=>({r,i})).filter(x=>x.r.termType==="Relationship");
    let html=`<div class="card"><h2>Predicate Registry <span class="small">— the (n/a) group: ${rels.length} Relationship strings</span></h2>
    <p class="hint">Every Line is fully governed — ID, sense, level, lifecycle — but carries no Q6 Facet and no Quant Class. Its Edge is its classification. Agreed predicates ship as active-voice pairs with a declared direction and a registered inverse.</p>`;
    if(!rels.length){ html+='<p class="hint">No Relationship strings yet. Add a predicate through the wizard (Term Type = Relationship).</p></div>'; $("#view-predicates").innerHTML=html; return; }
    for(const {r,i} of rels){
      const checklist=Validate.predicateChecklist(r,this.lex);
      const okAll=checklist.every(c=>c.ok);
      const inv=this.lex.rows.find(x=>x.id===r.inversePrimary);
      const verbs=(r.verbalizations||[]).map((v,vi)=>`<div class="verb">${this.verbHtml(v.text)}
        <div class="row-flex small"><span class="chip">${esc(v.level)}</span><span class="spacer"></span>
        <button class="ghost danger" onclick="App.delVerb(${i},${vi})"><i class="fa-solid fa-xmark"></i></button></div></div>`).join("");
      html+=`<div class="thes-primary">
        <div class="row-flex"><h3 style="margin:0">${esc(r.label)} <span class="lex">${esc(r.id)}</span></h3>
          <span class="chip status-${esc(r.status)}">${esc(r.status)}</span> ${this.senseDecision(r)}
          ${r.edgeDirection?`<span class="chip on">${esc(r.edgeDirection)}</span>`:""}
          ${inv?`<span class="chip">inverse: ${esc(inv.label)}</span>`:""}
          ${r.primaryEquivalent?`<span class="chip status-Deprecated">→ use ${esc((this.lex.rows.find(x=>x.id===r.primaryEquivalent)||{}).label||r.primaryEquivalent)}</span>`:""}
          <span class="spacer"></span>
          ${okAll?'<span class="chip v-PASS">5/5 governed</span>':'<span class="chip v-WARN">'+checklist.filter(c=>c.ok).length+'/5</span>'}
          <button onclick="App.toggleEdit(${i});App.show('inventory')">Edit</button></div>
        <div class="small" style="margin:.3rem 0">${esc(r.senseGloss||"")}</div>
        <div class="grid g2" style="margin-top:.4rem"><div>
          <label class="f">Five-defect checklist (advisory)</label>
          ${checklist.map(c=>`<div class="small">${c.ok?'<i class="fa-solid fa-circle-check" style="color:var(--primary)"></i>':'<i class="fa-solid fa-circle-exclamation" style="color:var(--amber)"></i>'} ${c.text}</div>`).join("")}
        </div><div>
          <label class="f">FCO-IM verbalizations ${this.q("Business examples of the predicate in use — governed text, not asserted triples. Type level: Party participatesIn Agreement. Instance level: “Acme Ltd” participatesIn “SC-01”.")}</label>
          ${verbs||'<p class="hint">No verbalizations yet.</p>'}
          <div class="row-flex" style="margin-top:.4rem">
            <select id="vlevel-${i}" style="width:auto"><option>Type</option><option>Instance</option></select>
            <input type="text" id="vtext-${i}" placeholder="Subject ${esc(r.label)} Object" style="flex:1">
            <button onclick="App.addVerb(${i})">Add</button></div>
        </div></div></div>`;
    }
    html+="</div>";
    $("#view-predicates").innerHTML=html;
  },
  verbHtml(text){
    /* highlight governed vs ungoverned tokens */
    const gov=new Map(this.lex.rows.map(r=>[r.label.toLowerCase(),r]));
    return String(text).split(/(\s+)/).map(tok=>{
      const clean=tok.replace(/[“”"',.;:()]/g,""); if(!clean.trim()) return esc(tok);
      const hit=gov.get(clean.toLowerCase());
      if(hit) return `<span class="tok gov" title="governed: ${esc(hit.id)}">${esc(tok)}</span>`;
      if(/^[A-Za-z][A-Za-z-]*$/.test(clean)) return `<span class="tok ungov" title="ungoverned — govern this too" onclick="App.governToken('${esc(clean)}')">${esc(tok)}</span>`;
      return esc(tok);
    }).join("");
  },
  governToken(t){ if(!confirm(`“${t}” is not governed. Open the wizard to govern it now?`)) return; this.resetWizard(); this.wiz.row.label=t; this.show("wizard"); this.wizSearchSenses(); },
  addVerb(i){
    const lvl=$("#vlevel-"+i).value, txt=$("#vtext-"+i).value.trim();
    if(!txt) return;
    const r=this.lex.rows[i]; (r.verbalizations=r.verbalizations||[]).push({level:lvl,text:txt});
    r.lastChangeDate=nowStamp(); this.save(); this.renderPredicates();
  },
  delVerb(i,vi){ this.lex.rows[i].verbalizations.splice(vi,1); this.save(); this.renderPredicates(); }
});

/* ============================================================
   Thesaurus view (derived — never a second source of truth)
   ============================================================ */
Object.assign(App,{
  renderThesaurus(){
    const rows=this.lex.rows;
    const primaries=rows.filter(r=>!r.primaryEquivalent);
    let html=`<div class="card"><h2>Thesaurus <span class="small">— derived from governed rows; WordNet neighbours shown as lexical evidence</span></h2>
    <p class="hint">One meaning, one primary, any number of strings. Deprecated aliases stay as redirects — the gate sends authors to the governed form instead of letting a second meaning be born.</p>`;
    if(!primaries.length) html+='<p class="hint">Nothing governed yet.</p>';
    for(const p of primaries){
      const aliases=rows.filter(r=>r.primaryEquivalent===p.id);
      const cands=this.aliasCandidates(p);
      const s=(p.wordnetAnchor&&p.wordnetAnchor!=="LOCAL-SENSE")?WN.byId(p.wordnetAnchor):null;
      const rels=s?WN.relations(s):[];
      const relHtml=rels.map(g=>{
        const corr=g.key==="y"||g.key==="o"?" · corroborates MEMBER":g.key==="m"||g.key==="l"?" · corroborates PART":"";
        return `<div class="wnrel"><strong>${esc(g.kind)}</strong>${esc(corr)}: ${g.senses.map(x=>`<span class="chip" title="${esc(x.gloss)}">${esc(x.lemmas[0])}</span>`).join(" ")}</div>`;
      }).join("");
      html+=`<div class="thes-primary">
        <div class="row-flex"><h3 style="margin:0">${esc(p.label)} <span class="lex">${esc(p.id)}</span></h3>
        <span class="chip status-${esc(p.status)}">${esc(p.status)}</span>
        ${p.quantClass?`<span class="chip">${esc(p.quantClass)} @ ${esc(p.q6)}</span>`:'<span class="chip">(n/a) line</span>'}
        ${p.sense?`<span class="chip">${esc(p.sense)}</span>`:""}
        ${this.senseDecision(p)}</div>
        <div class="small" style="margin:.25rem 0 .4rem;font-family:'Source Serif 4',Georgia,serif">${esc(p.senseGloss||"")}</div>
        ${aliases.length?`<div><label class="f">Governed equivalents (prefLabel → altLabel)</label>
          ${aliases.map(a=>`<span class="chip ${a.status==="Deprecated"?"status-Deprecated":"on"}" title="${esc(a.id)}">${esc(a.label)}${a.status==="Deprecated"?" · use "+esc(p.label)+" instead":""}</span>`).join(" ")}</div>`:""}
        ${cands.length?`<div style="margin-top:.35rem"><label class="f">WordNet candidates — not yet governed</label>
          ${cands.map(l=>`<span class="chip click" style="opacity:.75" onclick="App.startAliasFor('${esc(p.id)}','${esc(l)}')">${esc(l)} +</span>`).join(" ")}
          <span class="small"> · each becomes its own Lexical Object through the wizard</span></div>`:""}
        ${relHtml?`<div style="margin-top:.35rem"><label class="f">WordNet neighbourhood — lexical evidence, not governed rulings</label>${relHtml}</div>`:""}
      </div>`;
    }
    html+="</div>";
    $("#view-thesaurus").innerHTML=html;
  }
});

/* ============================================================
   Excel export / import (canonical-first, SheetJS)
   ============================================================ */
Object.assign(App,{
  rowToRecord(r){
    const rec={};
    rec["Lexical Object ID"]=r.id; rec["String / Label"]=r.label; rec["Quant Type"]=r.quantType;
    rec["Primary Equivalent"]=r.primaryEquivalent; rec["Quant Class"]=r.quantClass; rec["Q6 Facet"]=r.q6;
    rec["Quant Level"]=r.quantLevel; rec["Term Type"]=r.termType; rec["Sense"]=r.sense;
    rec["Is Plural"]=r.isPlural; rec["Language"]=r.language; rec["Status"]=r.status;
    rec["Disambiguation Notes"]=r.disambiguationNotes; rec["Contributor"]=r.contributor; rec["Source"]=r.source;
    rec["Create Date"]=r.createDate; rec["Last Change Date"]=r.lastChangeDate;
    rec["WordNet Anchor"]=r.wordnetAnchor; rec["Provenance"]=r.provenance; rec["Sense Gloss"]=r.senseGloss;
    rec["Subject Area"]=r.subjectArea; rec["Sub-Category"]=r.subCategory;
    rec["Quant Edge"]=r.quantEdges.join("; "); rec["Classifier Comment"]=r.classifierComment;
    rec["Confidence"]=r.confidence; rec["Edge Direction"]=r.edgeDirection; rec["Inverse Primary"]=r.inversePrimary;
    rec["Sense Decision"]=App.senseDecisionText(r); rec["Confidence Band"]=App.confidenceBand(r);   /* derived: recomputed on import, never read as source */
    for(const [k,v] of Object.entries(r.audit||{})) rec[k]=v;   /* pass-through, never authored here */
    return rec;
  },
  exportWorkbook(){
    this.save();
    const lex=this.lex;
    const auditCols=[...new Set(lex.rows.flatMap(r=>Object.keys(r.audit||{})))];
    const cols=[...CANON_COLS,...EXT_COLS,...auditCols];
    const wb=XLSX.utils.book_new();
    const inv=XLSX.utils.json_to_sheet(lex.rows.map(r=>this.rowToRecord(r)),{header:cols});
    XLSX.utils.book_append_sheet(wb,inv,"Inventory");
    const ref=(name,rowsArr)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rowsArr),name);
    ref("Quant Classes",[["Quant Class","Q6 Facet"],...Object.entries(QUANT_CLASSES)]);
    ref("Quant Levels",[["Quant Level"],...QUANT_LEVELS.map(x=>[x])]);
    ref("Quant Types",[["Quant Type"],...QUANT_TYPES.map(x=>[x])]);
    ref("Quant Edges",[["Code","Name","Meaning"],...EDGES.map(e=>[e.code,e.name,e.desc])]);
    ref("Statuses",[["Status"],...STATUSES.map(x=>[x])]);
    /* Thesaurus sheet — SKOS-friendly naming */
    const th=[["Primary (prefLabel)","Primary LEX ID","Label","Label LEX ID","Label Role","Label Status","Relation","Corroboration","Sense","Sense Gloss"]];
    for(const p of lex.rows.filter(r=>!r.primaryEquivalent)){
      th.push([p.label,p.id,p.label,p.id,"prefLabel",p.status,"","",p.sense,p.senseGloss]);
      for(const a of lex.rows.filter(r=>r.primaryEquivalent===p.id)){
        const s=(p.wordnetAnchor&&p.wordnetAnchor!=="LOCAL-SENSE")?WN.byId(p.wordnetAnchor):null;
        const corr=s&&s.lemmas.some(l=>l.toLowerCase()===a.label.toLowerCase())?"WordNet lemma of "+p.wordnetAnchor:"steward ruling";
        th.push([p.label,p.id,a.label,a.id,"altLabel",a.status,"IS-EQUIVALENT-HAS",corr,a.sense,a.senseGloss]);
      }
    }
    ref("Thesaurus",th);
    /* Verbalizations sheet */
    const vb=[["Predicate","LEX ID","Level","Example Sentence","Ungoverned words"]];
    for(const r of lex.rows.filter(x=>x.termType==="Relationship"))
      for(const v of (r.verbalizations||[])){
        const gov=new Set(lex.rows.map(x=>x.label.toLowerCase()));
        const ungov=v.text.split(/\s+/).map(t=>t.replace(/[“”"',.;:()]/g,"")).filter(t=>/^[A-Za-z][A-Za-z-]*$/.test(t)&&!gov.has(t.toLowerCase()));
        vb.push([r.label,r.id,v.level,v.text,[...new Set(ungov)].join(", ")]);
      }
    ref("Verbalizations",vb);
    ref("Meta",[["Key","Value"],["App",APP_NAME],["App Version",APP_VERSION],["App Built",APP_BUILT],["Lexicon",lex.name],["Exported",nowStamp()],["Rows",lex.rows.length],["WordNet",WN.data?WN.data.source+" (dataset built "+WN.data.built+")":"not loaded"]]);
    const fname=(lex.name.replace(/[^A-Za-z0-9_-]+/g,"_")||"lexicon")+"_lexical_inventory_"+nowStamp().slice(0,10)+".xlsx";
    XLSX.writeFile(wb,fname);
  },

  /* ---------- import ---------- */
  loadClick(){
    this.modal(`<h2><i class="fa-solid fa-upload"></i> Load inventory</h2>
    <p>Pick a <span class="kbd">…lexical_inventory….xlsx</span> workbook — your own export, a facilitator master, or the <strong>audited</strong> copy the Claude auditor returned.</p>
    <div class="grid g2">
      <div class="card" style="margin:0"><h3>Open</h3><p class="small">Replace the current working set with the workbook. The normal continue / audited-round-trip path.</p>
        <button class="primary" onclick="App.pickFile('open')">Open workbook…</button></div>
      <div class="card" style="margin:0"><h3>Merge</h3><p class="small">Append the workbook into the current set. ID collisions and dangling equivalents are flagged, never silently fixed.</p>
        <button onclick="App.pickFile('merge')">Merge workbook…</button></div>
    </div>
    <div class="row-flex" style="margin-top:.8rem"><span class="spacer"></span><button onclick="App.closeModal()">Cancel</button></div>`);
  },
  pickFile(mode){ this.loadMode=mode; this.closeModal(); $("#fileInput").value=""; $("#fileInput").click(); },
  fileChosen(files){
    if(!files||!files[0]) return;
    const fr=new FileReader();
    fr.onload=()=>{ try{ this.importWorkbook(new Uint8Array(fr.result)); }catch(e){ alert("Could not read workbook: "+e.message); } };
    fr.readAsArrayBuffer(files[0]);
  },
  recordToRow(rec){
    const g=k=>{ const v=rec[k]; return v==null?"":String(v).trim(); };
    const r=newRow();
    r.id=g("Lexical Object ID"); r.label=g("String / Label"); r.quantType=g("Quant Type")||"Term";
    r.primaryEquivalent=g("Primary Equivalent"); r.quantClass=g("Quant Class"); r.q6=g("Q6 Facet");
    r.quantLevel=g("Quant Level")||"Business Concept"; r.termType=g("Term Type")||"Entity"; r.sense=g("Sense");
    r.isPlural=g("Is Plural")||"FALSE"; r.language=g("Language")||LANG_DEFAULT; r.status=g("Status")||"Draft";
    r.disambiguationNotes=g("Disambiguation Notes"); r.contributor=g("Contributor"); r.source=g("Source")||"Imported workbook";
    r.createDate=g("Create Date"); r.lastChangeDate=g("Last Change Date");
    r.wordnetAnchor=g("WordNet Anchor"); r.provenance=g("Provenance"); r.senseGloss=g("Sense Gloss");
    r.subjectArea=g("Subject Area"); r.subCategory=g("Sub-Category");
    r.quantEdges=g("Quant Edge").split(/[;,+]/).map(x=>x.trim().toUpperCase().replace(/^IS-|-HAS$/g,"")).map(x=>x.replace(/^IS$/,"HAS")).filter(x=>EDGE_BY_CODE[x]);
    r.classifierComment=g("Classifier Comment")||g("Contextual Example");
    r.confidence=g("Confidence"); r.edgeDirection=g("Edge Direction"); r.inversePrimary=g("Inverse Primary");
    const known=new Set([...CANON_COLS,...EXT_COLS,"Contextual Example"]);   /* Sense Decision + Confidence Band are in EXT_COLS: recognised, ignored, re-derived */
    for(const k of Object.keys(rec)) if(!known.has(k) && rec[k]!=null && String(rec[k]).trim()!=="") r.audit[k]=rec[k];
    return r;
  },
  importWorkbook(bytes){
    const wb=XLSX.read(bytes,{type:"array"});
    const invName=wb.SheetNames.find(n=>n.toLowerCase()==="inventory")||wb.SheetNames[0];
    const recs=XLSX.utils.sheet_to_json(wb.Sheets[invName],{defval:""});
    const report={loaded:0,updated:0,collisions:[],dangling:[],vocab:[],mode:this.loadMode,sheet:invName};
    const incoming=recs.filter(x=>String(x["String / Label"]||"").trim()||String(x["Lexical Object ID"]||"").trim()).map(x=>this.recordToRow(x));
    /* verbalizations sheet */
    const vbName=wb.SheetNames.find(n=>n.toLowerCase()==="verbalizations");
    if(vbName){
      const vrecs=XLSX.utils.sheet_to_json(wb.Sheets[vbName],{defval:""});
      for(const v of vrecs){
        const row=incoming.find(r=>r.id===String(v["LEX ID"]).trim());
        if(row&&v["Example Sentence"]) row.verbalizations.push({level:String(v["Level"]||"Type"),text:String(v["Example Sentence"])});
      }
    }
    let target;
    if(this.loadMode==="merge"){
      target=this.lex.rows;
      for(const inc of incoming){
        const byId=inc.id?target.findIndex(r=>r.id===inc.id):-1;
        if(byId>=0){
          if(target[byId].label.trim().toLowerCase()===inc.label.trim().toLowerCase()){ target[byId]=inc; report.updated++; }
          else report.collisions.push(inc.id+" — incoming “"+inc.label+"” vs existing “"+target[byId].label+"” (held out; renumbering is a steward decision)");
        } else { target.push(inc); report.loaded++; }
      }
    } else {
      this.lex.rows=incoming; target=this.lex.rows; report.loaded=incoming.length;
      this.lex.auditSummary=null; this.lex.auditHealth=null; this.lex.auditVerdict=null;
    }
    /* integrity: dangling PE / inverse, vocab flags */
    const idset=new Set(target.map(r=>r.id));
    for(const r of target){
      if(r.primaryEquivalent&&!idset.has(r.primaryEquivalent)) report.dangling.push(r.id+" "+r.label+" → Primary Equivalent "+r.primaryEquivalent+" not present");
      if(r.inversePrimary&&!idset.has(r.inversePrimary)) report.dangling.push(r.id+" "+r.label+" → Inverse Primary "+r.inversePrimary+" not present");
      if(r.quantClass&&!QUANT_CLASSES[r.quantClass]) report.vocab.push(r.id+": Quant Class “"+r.quantClass+"”");
      if(r.status&&!STATUSES.includes(r.status)) report.vocab.push(r.id+": Status “"+r.status+"”");
      if(r.quantType&&!QUANT_TYPES.includes(r.quantType)) report.vocab.push(r.id+": Quant Type “"+r.quantType+"”");
      if(!r.q6&&r.quantClass) Validate.deriveFacet(r);
    }
    /* audit summary: any sheet whose name contains 'audit' read as key/value; health from rows or summary */
    const asName=wb.SheetNames.find(n=>/audit/i.test(n)&&n.toLowerCase()!=="inventory");
    if(asName){
      const aoa=XLSX.utils.sheet_to_json(wb.Sheets[asName],{header:1,defval:""});
      this.lex.auditSummary={sheet:asName,rows:aoa.filter(r=>r.some(c=>String(c).trim()!==""))};
    }
    const healthKey=Object.keys(target[0]?.audit||{}).find(k=>/health/i.test(k));
    if(healthKey){ this.lex.auditHealth=target.find(r=>r.audit[healthKey]!=null)?.audit[healthKey]??null; }
    if(this.lex.auditSummary){
      for(const row of this.lex.auditSummary.rows){
        const j=row.findIndex(c=>/health/i.test(String(c)));
        if(j>=0&&row[j+1]!=null&&String(row[j+1]).trim()!==""){ this.lex.auditHealth=row[j+1]; break; }
      }
    }
    const verdicts=target.map(r=>String(r.audit["Audit Verdict"]||"").toUpperCase()).filter(Boolean);
    if(verdicts.length) this.lex.auditVerdict=verdicts.some(v=>v.includes("QUAR"))?"QUARANTINE":verdicts.some(v=>v.includes("WARN"))?"PASS+WARN":"PASS";
    this.lex.lastLoaded=nowStamp();
    Ids.resync(this.lex); this.save(); this.expanded={}; this.renderAll();
    this.modal(`<h2><i class="fa-solid fa-clipboard-list"></i> Import report</h2>
      <p><strong>${report.mode==="merge"?"Merged":"Opened"}</strong> sheet “${esc(report.sheet)}”: ${report.loaded} row(s) loaded${report.updated?", "+report.updated+" updated":""}.</p>
      ${report.collisions.length?`<div class="errorbox"><strong>ID collisions (held out):</strong><br>${report.collisions.map(esc).join("<br>")}</div>`:""}
      ${report.dangling.length?`<div class="advisory"><strong>Dangling references:</strong><br>${report.dangling.map(esc).join("<br>")}<br><span class="small">Re-point them in the row editor — the Primary Equivalent dropdown offers eligible primaries.</span></div>`:""}
      ${report.vocab.length?`<div class="advisory"><strong>Outside closed vocabularies (loaded, flagged):</strong><br>${report.vocab.map(esc).join("<br>")}</div>`:""}
      ${!report.collisions.length&&!report.dangling.length&&!report.vocab.length?'<div class="okbox">No collisions, no dangling references, no vocabulary flags.</div>':""}
      ${this.lex.auditHealth!=null?`<div class="okbox">Audit detected — Health <strong>${esc(this.lex.auditHealth)}</strong>. PASS/WARN/QUARANTINE chips now show per row; scores are read-only.</div>`:""}
      <div class="row-flex" style="margin-top:.8rem"><span class="spacer"></span><button class="primary" onclick="App.closeModal();App.show('inventory')">Open the Inventory</button></div>`);
  },

  /* ---------- audit summary panel ---------- */
  openAuditSummary(){
    const lex=this.lex;
    const hasRowAudit=lex.rows.some(r=>Object.keys(r.audit||{}).length);
    if(!lex.auditSummary&&!hasRowAudit){
      this.modal(`<h2><i class="fa-solid fa-clipboard-check"></i> Audit Summary</h2>
      <p class="hint">Empty — the steward never marks their own homework. Export the inventory, let the Claude auditor skill assess it (“Audit the inventory”, with <span class="kbd">semantium-inventory-auditor</span>), then Load the audited workbook back.</p>
      <div class="row-flex"><span class="spacer"></span><button onclick="App.closeModal()">Close</button></div>`);
      return;
    }
    const counts={PASS:0,WARN:0,QUARANTINE:0};
    let assessed=0;
    for(const r of lex.rows){
      const v=String((r.audit||{})["Audit Verdict"]||"").toUpperCase();
      if(!v) continue; assessed++;
      if(v.includes("QUAR"))counts.QUARANTINE++; else if(v.includes("WARN"))counts.WARN++; else counts.PASS++;
    }
    const sumRows=(lex.auditSummary?lex.auditSummary.rows:[]).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("");
    this.modal(`<h2><i class="fa-solid fa-clipboard-check"></i> Audit Summary <span class="small">— read-only; scores are set by the auditor, never by hand</span></h2>
      ${assessed?`<p>${assessed} row(s) carry verdicts · <span class="chip v-PASS">PASS ${counts.PASS}</span> <span class="chip v-WARN">WARN ${counts.WARN}</span> <span class="chip v-QUARANTINE">QUARANTINE ${counts.QUARANTINE}</span>${lex.auditHealth!=null?` · Health <strong>${esc(lex.auditHealth)}</strong>`:""}</p>`:""}
      ${sumRows?`<h3>${esc(lex.auditSummary.sheet)}</h3><table class="inv"><tbody>${sumRows}</tbody></table>`:""}
      <p class="hint">If a check flags: the WARN or QUARANTINE names its rows and reason in Audit Notes. Fix the row here, re-export, re-audit.</p>
      <div class="row-flex"><span class="spacer"></span><button onclick="App.closeModal()">Close</button></div>`);
  }
});

/* ============================================================
   Reference / Help
   ============================================================ */
Object.assign(App,{
  renderHelp(){
    const classes=Q6_FACETS.map(f=>`<tr><td><strong>${f}</strong></td><td>${CLASSES_BY_FACET[f].join(" · ")}</td></tr>`).join("");
    const edges=EDGES.map(e=>`<tr><td class="kbd">${e.code}</td><td>${e.name}</td><td>${e.desc}</td></tr>`).join("");
    $("#view-help").innerHTML=`<div class="card helpsec">
    <h2>Reference — the Level 0 method</h2>
    <p style="font-family:'Source Serif 4',Georgia,serif">“All strings must be governed, so that when we do Level 1 to Level 5, nothing gets added to a definition without the string being classified.” Level 0 locks the string's <strong>lexical identity</strong> (ID, spelling, sense, primary-vs-alias standing, Quant Type) forever; the <strong>ontological reading</strong> (Q6 Facet, Quant Class, Quant Edges) is the steward's best classification today and can be refined as the definition completes across Levels 1–3. <em>Classifications can change as definitions mature; strings cannot.</em></p>

    <h3>The 8 steps — one pass = one governed string</h3>
    <p>1 <strong>Sense</strong> (retrieve real WordNet senses, lock one or LOCAL-SENSE) · 2 <strong>Subject Area</strong> (DMBOK) · 3 <strong>Q6 Facet</strong> (a filter, not a decision) · 4 <strong>Quant Class</strong> (fixes the facet) · 5 <strong>Level &amp; Type</strong> · 6 <strong>Quant Edge</strong> (object-free hints) · 7 <strong>Example</strong> (reality check) · 8 <strong>Commit</strong> (identity, status, ruling).</p>
    <p><strong>Rule #1 — Render unto Caesar:</strong> classify what the string <em>names</em>, not its anticipated use.</p>

    <h3>The gate rule</h3>
    <p>A string clears the gate only when it is <strong>Active</strong>, carries a <strong>Quant Class</strong>, and is a <strong>primary</strong> (not an alias). Lines (Term Type = Relationship) are the governed exception: no facet, no class — their Edge is their classification; they group under (n/a) by design.</p>

    <h3>Sense provenance &amp; confidence bands</h3>
    <table><tr><th>Situation</th><th>WordNet Anchor</th><th>Provenance</th></tr>
    <tr><td>Steward picks a retrieved synset</td><td>that synset</td><td>WordNet-direct</td></tr>
    <tr><td>Steward authors a gloss and a synset set exists</td><td>nearest real synset</td><td>Anchor+Annotation (gloss is authoritative)</td></tr>
    <tr><td>No synset retrieved</td><td>LOCAL-SENSE</td><td>Local-Manual</td></tr></table>
    <p><strong>Sense-choice aids (Step 1):</strong> the <em>substitution test</em> re-renders your own FCO-IM usage sentence with the term swapped for each candidate gloss — the sense that keeps the sentence true is the sense; a half-true reading is what the justify band feels like. The <em>fit hint</em> is a deterministic word-overlap of your sentences against each sense (gloss + lemmas + broader terms) — lexical evidence only, never the governed score: short glosses make hints low and flat by nature (party.n.05 scores near zero against real business sentences, and is still the right anchor). Neither aid ever fills the Confidence field.</p>
    <p><strong>Sense Decision badge</strong> (derived, display-only — exported as report columns “Sense Decision” + “Confidence Band”, re-derived on import — the workbook reader sees the story; the source stays Provenance + Confidence + Notes): <span class="chip v-PASS">Accepted</span> WordNet-direct, gloss verbatim · <span class="chip v-WARN">Enhanced</span> Anchor+Annotation, steward-authored (zero-shot) gloss over the nearest anchor · <span class="chip">Authored</span> Local-Manual, no synset. Badge colour = the confidence band; hover shows the anchor-fit and the WHY from Disambiguation Notes.</p>
    <p>Bands (steward thresholds): <span class="kbd">≥ 0.85</span> auto-propose · <span class="kbd">0.70–0.85</span> justify (rationale required) · <span class="kbd">&lt; 0.70</span> refuse WordNet-direct. <strong>Cardinal rule:</strong> a synset ID is never invented — an empty result is a valid answer, not an error.</p>

    <h3>19 Quant Classes inside the Q6</h3>
    <table><tr><th>Facet</th><th>Classes</th></tr>${classes}</table>
    <p>Assign the <strong>class</strong>; the facet is derived. 12 Quant Types: ${QUANT_TYPES.join(" · ")}. 3 Quant Levels: ${QUANT_LEVELS.join(" · ")}. Lifecycle: ${STATUSES.join(" → ")}.</p>

    <h3>6 Quant Edges</h3>
    <table><tr><th>Chip</th><th>Edge</th><th>Meaning</th></tr>${edges}</table>
    <p><strong>Boundary attestation:</strong> no relationships are asserted at Level 0 — every Quant Edge is an object-free hint. Naming a target is Level 1.</p>

    <h3>Aliases — one meaning, one primary</h3>
    <p>A synonym never lives inside another row's cell: it gets its own Lexical Object and ID, the EQUIV edge, and a Primary Equivalent pointing at the primary (whose own cell stays blank). Aliases inherit the primary's classification, anchor and gloss — copied, not re-decided. Aliases are Classified but never Gate-ready. <strong>Deprecated ≠ deleted:</strong> retired stems stay as redirects.</p>

    <h3>Predicates — the five-defect checklist</h3>
    <p>1 usable surface form (inflected, reads inside a triple — bare stems never appear in real SPO statements) · 2 declared Edge Direction (IS-side / HAS-side) · 3 registered inverse (every Line ships as a pair) · 4 lowerCamelCase casing (Entities are PascalCase — casing is governance, not style) · 5 no passive trap (passive promotion is blocked at Level 0: the fix changes the predicate, never swaps Subject and Object). Nodes number LEX-100xx; governed Lines start at LEX-10101.</p>

    <h3>FCO-IM verbalizations</h3>
    <p>Business examples of a predicate in use, at Type level (<em>Party participatesIn Agreement</em>) and Instance level (<em>“Acme Ltd” participatesIn “SC-01”</em>). They are governed examples, not asserted triples. Ungoverned words in an example are flagged — every string a definition needs must be governed, or on the worklist.</p>

    <h3>Thesaurus positioning (SKOS)</h3>
    <table><tr><th>Capability</th><th>Here</th><th>SKOS construct</th></tr>
    <tr><td>Preferred term</td><td>the primary string</td><td>skos:prefLabel</td></tr>
    <tr><td>Synonym / alias</td><td>governed EQUIV alias rows</td><td>skos:altLabel</td></tr>
    <tr><td>Acronym / abbreviation</td><td>alias rows typed Acronym/Abbreviation</td><td>skos:altLabel</td></tr>
    <tr><td>Broader / narrower / related</td><td>WordNet evidence only (governed relations live in the Glossary Workbench thesaurus layer)</td><td>skos:broader / narrower / related</td></tr>
    <tr><td>Definition / scope note</td><td>Sense Gloss</td><td>skos:definition</td></tr></table>

    <h3>Separation of duties</h3>
    <p>The steward writes governed data here. The <span class="kbd">semantium-inventory-auditor</span> skill writes only Audit columns into the exported workbook — it assesses, never edits. Nothing auto-promotes: a string reaches Active only because a steward, holding a passing audit, says so.</p>

    <h3>About</h3>
    <p>${esc(APP_NAME)} v${APP_VERSION} · built ${esc(APP_BUILT)} · Modelware Systems International.<br>
    WordNet® — Princeton University; dataset: <span id="wnAbout">${WN.data?esc(WN.data.source)+" (built "+esc(WN.data.built)+", "+WN.data.s.length+" synsets)":"not loaded"}</span>. Used under the WordNet 3.0 License.<br>
    Storage: this browser's localStorage (autosaved on every change). The exported workbook is the portable truth — export before switching machines.</p>
    </div>`;
  }
});

window.addEventListener("DOMContentLoaded",()=>App.boot());
