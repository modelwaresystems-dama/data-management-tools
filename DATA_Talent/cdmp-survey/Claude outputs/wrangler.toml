# Cloudflare Worker config for the CDMP survey write-proxy.
# The GitHub token is a SECRET — it is NOT in this file. Set it once with:
#   npx wrangler secret put GITHUB_TOKEN
# (or in the dashboard: Worker → Settings → Variables and Secrets → Add secret)

name = "cdmp-survey-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
GH_OWNER       = "modelwaresystems-dama"        # your GitHub account/org
GH_REPO        = "modelware_app_storage"         # existing PRIVATE app-storage repo
GH_PATH_PREFIX = "Data_Talent/cdmp_survey_data"  # subfolder for responses/ and contacts/
GH_BRANCH      = "main"
ALLOWED_ORIGIN = "https://modelwaresystems-dama.github.io"  # your GitHub Pages origin
SURVEY_ID      = "cdmp-barriers-v1"              # rejects posts for any other survey
