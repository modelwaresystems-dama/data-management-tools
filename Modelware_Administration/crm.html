    var when = parseDateInput(r.occurredAt, today) || (r.occurredAt || "").slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(when)){
      out.errors.push(where + ": “" + r.occurredAt + "” is not a date I can read.");
      return;
    }

    /* Try every handle the row carries, strongest first. An email is the only
       one nobody re-types differently. */
    var dealKeyTries = [
      triageNorm(r.contactEmail) + "␟" + triageNorm(r.deal),
      triageNorm(r.company)      + "␟" + triageNorm(r.deal),
      triageNorm(r.contactName)  + "␟" + triageNorm(r.deal),
      triageNorm(r.partner)      + "␟" + triageNorm(r.deal)
    ];
    var deal = (r.dealId && byId[r.dealId]) || null;
    for (var t = 0; !deal && t < dealKeyTries.length; t++){
      if (dealKeyTries[t].charAt(0) !== "␟") deal = byName[dealKeyTries[t]];
    }
    if (!deal){
      /* The whole row travels, not just a label — because the next thing
         anyone wants is to create the deal, and going back to the file for the
         contact and the first next step is the step that gets skipped. */
      out.unmatched.push({ company:r.company || "", deal:r.deal || "", dealId:r.dealId || "",
                           occurredAt:when, summary:r.summary, kind:kind, row:r });
      out.summary.unmatched++;
      return;
    }

    var key = r.messageId || (r.dealId || deal.id) + "|" + when + "|" + r.summary;
    var stem = triageHash(String(key));
    var ixId = r.interactionId || "ix_mail_" + stem;
    /* Already logged — but is it the SAME thing?

       Deriving the id from the message id makes re-importing a no-op, which is
       right. It also made CORRECTING a line impossible: a second, better read of
       the same thread came back as "already logged, skipped", and the wrong line
       stayed in the log for good. A thread whose summary has changed is not a
       duplicate, it is a revision — surfaced separately so it is applied on
       purpose, never silently. */
    var prev = seenIx[ixId];
    var isRevision = false, sameLine = false;
    if (prev){
      var same = triageNorm(prev.summary) === triageNorm(r.summary) &&
                 prev.occurredAt === when &&
                 triageNorm(prev.kind) === kind;
      if (same){
        /* Identical line — but the row may still be telling us the DEAL is
           wrong. Keep going far enough to notice that, then stop. */
        sameLine = true;
      } else isRevision = true;
    }
    seenIx[ixId] = { summary:r.summary, occurredAt:when, kind:kind };

    var row = { dealId:deal.id, dealName:deal.name,
                company:(st.companies[deal.companyId] || {}).name || "",
                kind:kind, occurredAt:when, summary:r.summary, nextStep:null,
                revises: isRevision ? { summary:prev.summary, occurredAt:prev.occurredAt } : null };
    /* Same interaction id on purpose. The fold is last-write-wins per id, so
       re-emitting it rewrites the line rather than adding a second one — the
       append-only log keeps both versions, the current state shows the newer. */
    var ixEvent = { id:"ev_mail_" + stem + (isRevision ? "_r" + triageHash(r.summary) : ""),
      type:"interaction.logged", actor:actor,
      payload:{ interactionId:ixId, subjectType:"deal", subjectId:deal.id, kind:kind,
                occurredAt:when, summary:r.summary,
                contactId: r.contactId || undefined } };
    var mine = [ixEvent];

    /* The row may disagree with the deal it matched. `outcome: "won"` on work
       already delivered is the case that started this: the deal existed, so
       triageCreate never ran, so it sat in Negotiation forecasting revenue that
       had already been earned — and the import said nothing, because logging
       the line had worked.

       A disagreement about what the deal IS gets surfaced like a revision:
       shown, and applied on purpose. Never silently, and never ignored. */
    var changes = [];
    var wantOutcome = triageNorm(r.outcome);
    if (wantOutcome && wantOutcome !== "won" && wantOutcome !== "lost"){
      out.errors.push(where + ": \u201c" + r.outcome + "\u201d is not an outcome. Use won or lost.");
    } else if (wantOutcome && !(deal.status === "closed" && deal.outcome === wantOutcome)){
      changes.push({ what:"outcome",
        from: deal.status === "open" ? "open, at " + stageLabel(cfg, deal.stage) : deal.outcome,
        to: wantOutcome,
        event:{ id:"ev_dcx_" + stem, type:"deal.closed", actor:actor,
                payload:{ dealId:deal.id, outcome:wantOutcome, reason:r.lostReason || "" } } });
    }
    if (!wantOutcome && r.stage){
      var wantStage = null;
      ((cfg && cfg.stages) || []).forEach(function (sg){
        if (triageNorm(sg.id) === triageNorm(r.stage) || triageNorm(sg.label) === triageNorm(r.stage))
          wantStage = sg.id; });
      if (wantStage && deal.status === "open" && wantStage !== deal.stage)
        changes.push({ what:"stage", from:stageLabel(cfg, deal.stage), to:stageLabel(cfg, wantStage),
          event:{ id:"ev_dsx_" + stem, type:"deal.stage_changed", actor:actor,
                  payload:{ dealId:deal.id, from:deal.stage, to:wantStage } } });
    }
    if (r.commissionRate != null && r.commissionRate !== ""){
      var wantRate = (+r.commissionRate > 1) ? round2(+r.commissionRate) / 100 : +r.commissionRate;
      if (deal.commissionRate !== wantRate)
        changes.push({ what:"commission", from: deal.commissionRate == null ? "none" : (deal.commissionRate*100)+"%",
          to:(wantRate*100) + "%",
          event:{ id:"ev_drx_" + stem, type:"deal.updated", actor:actor,
                  payload:{ dealId:deal.id, commissionRate:wantRate } } });
    }
    if (changes.length){
      out.dealChanges.push({ dealId:deal.id, dealName:deal.name,
        company:(st.companies[deal.companyId] || {}).name || "",
        changes:changes, events:changes.map(function (c){ return c.event; }) });
      out.summary.dealChanges += changes.length;
      row.dealChanges = changes;
    }
    if (sameLine){ out.summary.duplicates++; return; }   // the LINE is already logged

    /* Everyone else on the thread. A company is rarely one person — MetLife is
       Gowri AND Nitin — and a contact who only ever appears in the To line is
       invisible to the next run's sender matching, so the same customer keeps
       arriving as "unmatched". Adding them here is what makes the company's
       history whole rather than one correspondent's slice. */
    var others = Array.isArray(r.contacts) ? r.contacts : [];
    others.forEach(function (c){
      if (!c) return;
      var em = String(c.email || "").trim();
      var nm = String(c.name || "").trim();
      if (!em && !nm) return;
      if (em && ourEmails[triageNorm(em)]) return;          // our own side is not a customer contact
      var key = triageNorm(em || (deal.companyId + "|" + nm));
      if (ctByEmail[key]) return;                            // already known
      var cid = "ct_" + triageHash(key);
      ctByEmail[key] = cid;
      mine.push({ id:"ev_ct_" + triageHash(cid), type:"contact.created", actor:actor,
        payload:{ contactId:cid, companyId:deal.companyId, name:nm || em,
                  email:em, phone:String(c.phone || "").trim(), role:c.role || "" } });
      row.addedContacts = (row.addedContacts || []).concat([nm || em]);
      /* Counted even on a revision. The contact really is created either way,
         and a count that disagrees with what happened is worse than no count. */
      out.summary.contacts++;
    });

    var ns = r.nextStep;
    if (ns && ns.what){
      /* If this deal is already carrying an open next step that says the same
         thing, do not add a second one. The batch's next step and one typed in
         by hand — or created a moment ago when this same file made the deal —
         are the same intention, and two identical rows in Today is exactly the
         kind of duplication this whole exercise is trying to stop. */
      var already = openFollowupsFor(st, deal.id).filter(function (f){
        return triageNorm(f.what) === triageNorm(ns.what); })[0];
      if (already){
        row.nextStep = { what:already.what, dueDate:already.dueDate, existing:true };
      } else {
        var due = parseDateInput(ns.dueDate, today) || deferBy(today, 7);
        /* Who is actually going to do it. An id that is not a real person in
           config.json is worse than none at all: the follow-up belongs to
           nobody, so it never shows in anyone's "mine" and quietly rots. Refuse
           it by name rather than writing a stranger into the log. */
        var owner = ns.owner ? resolveUser(cfg, ns.owner) : null;
        if (ns.owner && !owner){
          out.errors.push(where + ": “" + ns.owner + "” is not on the team, so the next step " +
            "would belong to nobody. config.json lists: " + userIds(cfg).join(", ") + ".");
          owner = deal.owner || actor;
        }
        owner = owner || deal.owner || actor;
        mine.push({ id:"ev_mailfu_" + stem + triageHash(ns.what), type:"followup.created", actor:actor,
          payload:{ followupId: ns.followupId || "fu_mail_" + stem + triageHash(ns.what),
                    subjectType:"deal", subjectId:deal.id,
                    owner: owner,
                    dueDate:due, what:String(ns.what).slice(0, 200) } });
        row.nextStep = { what:ns.what, dueDate:due, owner:owner };
        if (!isRevision) out.summary.followups++;
      }
    }

    if (isRevision){
      row.events = mine;
      /* Anything still open on this deal is shown with the correction, because a
         line that changes from "not sent yet" to "sent" almost always means an
         open next step is now finished — and only a person can say so. */
      row.openNextSteps = openFollowupsFor(st, deal.id).map(function (f){
        return { what:f.what, dueDate:f.dueDate }; });
      out.revisions.push(row);
      out.summary.revised++;
      return;                    // applied deliberately, never with the rest
    }
    mine.forEach(function (e){ out.events.push(e); });
    out.summary.logged++;
    out.rows.push(row);
  });

  return out;
}

/* Turn the rows that matched nothing into the deals they describe.
   Deliberately NOT automatic: importTriage still refuses to invent a deal, and
   this only ever runs on rows a person has ticked, after seeing exactly what it
   would make. Creating a deal is a commitment about the business, and the app
   does not get to make those.

   Ids are derived from the names rather than random, so pressing the button
   twice cannot quietly produce a second copy of the same deal — which is the
   exact failure that started this whole thread. */
function triageCreate(rows, st, cfg, ctx){
  ctx = ctx || {};
  var today = ctx.today || todayISO();
  var actor = ctx.actor || "howard";
  var out = { events:[], created:[], errors:[], invoices:0 };
  var created_invoices = 0;
  var stages = (cfg && cfg.stages) || [];
  var firstStage = stages.length ? stages[0].id : "lead";
  var stageById = {}; stages.forEach(function (s){
    stageById[triageNorm(s.id)] = s.id; stageById[triageNorm(s.label)] = s.id; });

  var coByName = {};
  Object.keys(st.companies).forEach(function (k){
    coByName[triageNorm(st.companies[k].name)] = st.companies[k].id; });
  var ctByEmail = {};
  Object.keys(st.contacts).forEach(function (k){
    if (st.contacts[k].email) ctByEmail[triageNorm(st.contacts[k].email)] = st.contacts[k].id; });
  var seenCo = {}, seenDeal = {};

  /* Where private buyers live. One holder company, reused; a person is never
     turned into a company of their own, because they are not one and the
     pipeline reads as nonsense when they are. */
  var HOLDER = String(ctx.individualHolder || "Individual");
  var holderExisting = Object.keys(st.companies).filter(function (k){
    return st.companies[k].isHolder ||
           triageNorm(st.companies[k].name) === triageNorm(HOLDER); })[0];

  (rows || []).forEach(function (u, i){
    var r = (u && u.row) || u || {};
    var isIndividual = !!r.individual;
    var person = String(r.contactName || "").trim();
    if (isIndividual && !person){
      out.errors.push("Row " + (i+1) + " is marked individual but names no person, " +
                      "so there would be nothing to call the deal.");
      return;
    }
    var coName = isIndividual ? (st.companies[holderExisting] ? st.companies[holderExisting].name : HOLDER)
                              : String(r.company || u.company || "").trim();
    var dealName = String(r.deal || u.deal || "").trim();
    if (!coName){
      out.errors.push("Row " + (i+1) + " names no company, so there is nothing to file a deal under.");
      return;
    }
    if (!dealName){
      out.errors.push("Row " + (i+1) + " (" + coName + ") names no deal. A deal needs a name you would recognise in six weeks.");
      return;
    }
    var coKey = triageNorm(coName);
    var coId = isIndividual ? (holderExisting || null) : coByName[coKey];
    /* Reusing a company as the individual bucket that nobody has marked as one.
       The row asserts this is a private buyer; without the flag the deal would
       be labelled with the bucket's name instead of the person's, and the next
       run would fail to match it. Set it, once. */
    if (isIndividual && coId && st.companies[coId] && !st.companies[coId].isHolder && !seenCo[coId]){
      seenCo[coId] = true;
      out.events.push({ id:"ev_hold_" + triageHash(coId), type:"company.updated", actor:actor,
        payload:{ companyId:coId, isHolder:true } });
    }
    if (!coId){
      coId = "co_" + triageHash(coKey);
      if (isIndividual) holderExisting = coId;
      if (!seenCo[coId]){
        seenCo[coId] = true;
        out.events.push({ id:"ev_co_" + triageHash(coKey), type:"company.created", actor:actor,
          payload:{ companyId:coId, name:coName, domain:r.domain || "",
                    isHolder: isIndividual || undefined } });
      }
    }

    var contactId = null;
    var cEmail = String(r.contactEmail || "").trim();
    var cName  = String(r.contactName || "").trim();
    if (cEmail && ctByEmail[triageNorm(cEmail)]) contactId = ctByEmail[triageNorm(cEmail)];
    else if (cEmail || cName){
      contactId = "ct_" + triageHash(triageNorm(cEmail || (coKey + "|" + cName)));
      out.events.push({ id:"ev_ct_" + triageHash(contactId), type:"contact.created", actor:actor,
        payload:{ contactId:contactId, companyId:coId, name:cName || cEmail,
                  email:cEmail, phone:String(r.contactPhone || "").trim(), role:r.contactRole || "" } });
    }

    /* The partner side. Some work reaches the customer through a reseller or a
       JV, and the people on the thread are the partner's, not the customer's.
       They are filed under their own employer — Gary works for MasterData, not
       for the bank — and the deal points at both companies. Getting this
       backwards is what makes a pipeline read "MasterData" when the opportunity
       is Standard Bank's. */
    var partnerName = String(r.partner || "").trim();
    var partnerId = null, partnerContactIds = [];
    if (partnerName){
      var pKey = triageNorm(partnerName);
      if (pKey === coKey){
        out.errors.push("Row " + (i+1) + " names " + partnerName + " as both the customer and the partner. " +
          "A partner is the company you reach the customer THROUGH, so the two cannot be the same.");
        return;
      }
      partnerId = coByName[pKey];
      if (!partnerId){
        partnerId = "co_" + triageHash(pKey);
        if (!seenCo[partnerId]){
          seenCo[partnerId] = true;
          out.events.push({ id:"ev_co_" + triageHash(pKey), type:"company.created", actor:actor,
            payload:{ companyId:partnerId, name:partnerName, domain:r.partnerDomain || "",
                      isPartner:true } });
        }
      } else if (!st.companies[partnerId].isPartner && !seenCo[partnerId]){
        seenCo[partnerId] = true;
        out.events.push({ id:"ev_cop_" + triageHash(partnerId), type:"company.updated", actor:actor,
          payload:{ companyId:partnerId, isPartner:true } });
      }
      (Array.isArray(r.partnerContacts) ? r.partnerContacts : []).forEach(function (pc){
        if (!pc) return;
        var pe = String(pc.email || "").trim(), pn = String(pc.name || "").trim();
        if (!pe && !pn) return;
        var pid = (pe && ctByEmail[triageNorm(pe)]) ||
                  ("ct_" + triageHash(triageNorm(pe || (pKey + "|" + pn))));
        if (!(pe && ctByEmail[triageNorm(pe)]))
          out.events.push({ id:"ev_ct_" + triageHash(pid), type:"contact.created", actor:actor,
            payload:{ contactId:pid, companyId:partnerId, name:pn || pe, email:pe,
                      phone:String(pc.phone || "").trim(), role:pc.role || "" } });
        partnerContactIds.push(pid);
      });
    }
    /* Where the only human on the thread works for the partner, the deal still
       needs somebody to point at, or it shows a bank and no name. */
    if (!contactId && partnerContactIds.length) contactId = partnerContactIds[0];

    /* Two private buyers can easily want the same course, so an individual's
       deal is keyed by the PERSON, not by the holder company — otherwise the
       second one silently collides with the first. */
    var dealKey = (isIndividual ? triageNorm(person) : coKey) + "␟" + triageNorm(dealName);
    var dealId = "d_" + triageHash(dealKey);
    /* Several emails about ONE new deal is the normal shape of a batch, not a
       mistake: six months of a tender is six rows. Those rows agree about what
       the deal is, so it is created once and nothing needs saying. What DOES
       need saying is two rows that disagree — different owner, stage, partner,
       value — because then only one is being honoured, and silence would hide
       which one. */
    /* Only what a row actually SAYS counts. The later rows of a catch-up batch
       are there to be logged, not to redefine the deal, so they carry a company,
       a deal name and a line and nothing else. Treating those absent fields as
       disagreement produced an error per row — eleven of them on one batch —
       for rows that had not contradicted anything. Silence is not dissent. */
    var says = {};
    if (r.owner)    says.owner    = triageNorm(r.owner);
    if (r.stage)    says.stage    = triageNorm(r.stage);
    if (r.partner)  says.partner  = triageNorm(r.partner);
    if (r.currency) says.currency = triageNorm(r.currency);
    if (r.outcome)  says.outcome  = triageNorm(r.outcome);
    if (r.value != null && r.value !== "")                   says.value = String(r.value);
    if (r.commissionRate != null && r.commissionRate !== "") says.rate  = String(r.commissionRate);
    if (r.commission === false || r.commissionable === false) says.commission = "none";

    if (seenDeal[dealId]){
      var first = seenDeal[dealId], clash = [];
      Object.keys(says).forEach(function (k){
        if (first.says[k] !== undefined && first.says[k] !== says[k]) clash.push(k);
      });
      if (clash.length)
        out.errors.push("Rows " + first.row + " and " + (i+1) + " both describe " +
          (isIndividual ? person : coName) + " / " + dealName + " but disagree on " +
          clash.join(" and ") + ". Row " + first.row + " is the one being used — make them " +
          "agree, or the difference is lost.");
      /* Anything the first row did not say, a later row may still supply. */
      Object.keys(says).forEach(function (k){
        if (first.says[k] === undefined) first.says[k] = says[k];
      });
      return;
    }
    seenDeal[dealId] = { row:i+1, says:says };

    /* Who will own it. Never the actor by default: a deal filed to the person
       running the triage sits outside its salesperson's "mine" list and rots
       there, which is the exact failure this is meant to prevent. */
    var sales = salesUsers(cfg);
    var dealOwner = r.owner ? resolveUser(cfg, r.owner) : null;
    if (r.owner && !dealOwner){
      out.errors.push("Row " + (i+1) + ": \u201c" + r.owner + "\u201d is not on the team, " +
        "so the deal would belong to nobody. config.json lists: " + userIds(cfg).join(", ") + ".");
      return;
    }
    /* Most deals pay a salesperson, so most deals must be owned by one. Not
       all: some the director carries himself, and those earn nobody anything.
       The batch says so with `commission: false` — explicitly, on the record.
       The rule being enforced is not "only salespeople own deals", it is "a deal
       that pays commission must be owned by whoever gets paid". Declaring there
       is no commission widens the roster; it is never inferred from a name. */
    var noComm = r.commission === false || r.commissionable === false;
    if (sales.length){
      if (!dealOwner){
        out.errors.push("Row " + (i+1) + " (" + (isIndividual ? person : coName) + " / " + dealName +
          ") names no owner. A deal belongs to the person who will carry it, not to whoever " +
          "filed it — set \u201cowner\u201d to one of: " + sales.join(", ") +
          (noComm ? ", or to anyone in config.json since this one pays no commission" : "") + ".");
        return;
      }
      if (!noComm && sales.indexOf(dealOwner) < 0){
        out.errors.push("Row " + (i+1) + ": " + userName_(cfg, dealOwner) +
          " does not carry commission-earning deals. Either set \u201cowner\u201d to one of: " +
          sales.join(", ") + " — or set \u201ccommission\u201d to false if this deal pays nobody.");
        return;
      }
    }
    dealOwner = dealOwner || actor;

    var stage = stageById[triageNorm(r.stage)] || firstStage;
    var val = (r.value == null || r.value === "") ? null : +String(r.value).replace(/[^0-9.\-]/g, "");
    if (val != null && !isFinite(val)) val = null;
    var rateRaw = r.commissionRate;
    var rate = (rateRaw == null || rateRaw === "") ? null
             : (+rateRaw > 1 ? round2(+rateRaw) / 100 : +rateRaw);   // "5" and 0.05 both mean 5%
    /* Saying both "nobody is paid on this" and "the rate is 5%" is not a detail
       to reconcile quietly \u2014 one of the two is wrong, and picking for him puts
       money in somebody's column on a guess. */
    if (noComm && rate != null){
      out.errors.push("Row " + (i+1) + " (" + (isIndividual ? person : coName) + " / " + dealName +
        ") says the deal pays no commission and also sets a rate of " + rateRaw + ". " +
        "One of those is wrong and I will not choose which.");
      return;
    }
    out.events.push({ id:"ev_d_" + triageHash(dealKey), type:"deal.created", actor:actor,
      payload:{ dealId:dealId, companyId:coId, name:dealName, owner:dealOwner,
                contactId: contactId || undefined,
                partnerCompanyId: partnerId || undefined,
                commissionable: noComm ? false : undefined,
                stage:stage, value:val, commissionRate:rate,
                currency:r.currency || (cfg && cfg.defaultCurrency) || "ZAR",
                expectedCloseDate: parseDateInput(r.expectedClose, today) || null } });

    /* Work that is already delivered does not sit in Negotiation waiting to be
       sold. A batch can say so — and then the invoices are what the deal is
       about, not the pipeline stage. */
    var outcome = triageNorm(r.outcome);
    if (outcome === "won" || outcome === "lost"){
      out.events.push({ id:"ev_dc_" + triageHash(dealKey), type:"deal.closed", actor:actor,
        payload:{ dealId:dealId, outcome:outcome, reason:r.lostReason || "" } });
    } else if (outcome){
      out.errors.push("Row " + (i+1) + ": \u201c" + r.outcome + "\u201d is not an outcome. Use won or lost.");
    }

    (Array.isArray(r.invoices) ? r.invoices : []).forEach(function (iv, j){
      if (!iv) return;
      var net = money(iv.net);
      /* An invoice with no amount is worse than no invoice: it clears the "Not
         invoiced" flag while telling nobody what is owed, so the gap stops
         nagging without being closed. Refuse it and say why. */
      if (!(net > 0)){
        out.errors.push("Row " + (i+1) + ", invoice " + (iv.number || j+1) +
          ": no net amount, so it would clear the Not-invoiced flag while saying nothing was owed. " +
          "Leave it out and let the flag do its job, or supply the amount.");
        return;
      }
      var ikey = dealKey + "\u241f" + triageNorm(iv.number || String(j));
      out.events.push({ id:"ev_inv_" + triageHash(ikey), type:"invoice.raised", actor:actor,
        payload:{ invoiceId:"inv_" + triageHash(ikey), dealId:dealId,
                  number:String(iv.number || "").trim(),
                  issuedOn: parseDateInput(iv.issuedOn, today) || today,
                  dueDate: iv.dueDate ? parseDateInput(iv.dueDate, today) : null,
                  currency: iv.currency || r.currency || (cfg && cfg.defaultCurrency) || "ZAR",
                  net:net, passThrough:money(iv.passThrough), vat:money(iv.vat) } });
      created_invoices++;
    });

    /* A deal with no first next step is born straight into band three, where it
       is invisible until someone goes looking. So one is always created — and
       shown in the preview, so a defaulted one is never a surprise.

       EXCEPT on a deal that arrives already closed: winning releases the
       next-step invariant (C7), and "Make first contact" on work delivered in
       May would be nonsense. A closed deal gets a next step only if the batch
       actually names one. */
    var closed = (outcome === "won" || outcome === "lost");
    var ns = (r.nextStep && r.nextStep.what) ? r.nextStep
           : (closed ? null : { what:"Make first contact", dueDate:deferBy(today, 7) });
    var due = ns ? (parseDateInput(ns.dueDate, today) || deferBy(today, 7)) : null;
    if (ns)
      out.events.push({ id:"ev_dfu_" + triageHash(dealKey), type:"followup.created", actor:actor,
        payload:{ followupId:"fu_d_" + triageHash(dealKey), subjectType:"deal", subjectId:dealId,
                  owner: resolveUser(cfg, ns.owner) || dealOwner,
                  dueDate:due, what:String(ns.what).slice(0,200) } });

    out.invoices = created_invoices;
    out.created.push({ dealId:dealId, rowIndex:i,
                       outcome: (outcome === "won" || outcome === "lost") ? outcome : "",
                       invoices: (Array.isArray(r.invoices) ? r.invoices : []).length,
                       commissionRate: rate,
                       /* what the preview should call it — the person for a
                          private buyer, the organisation otherwise */
                       company: isIndividual ? person : coName,
                       partner: partnerName || "",
                       noCommission: noComm,
                       filedUnder: isIndividual ? coName : "",
                       individual: isIndividual,
                       deal:dealName,
                       stage:stageLabel(cfg, stage), contact: cName || cEmail || "",
                       owner:dealOwner,
                       nextStep: ns ? ns.what : "\u2014", dueDate:due,
                       defaultedNextStep: !!ns && !(r.nextStep && r.nextStep.what) });
  });

  return out;
}

/* Money in a spreadsheet cell. Currencies are never summed (C16), so a deal
   billed in two of them prints both rather than a misleading total. */
function bagText(bag){
  return Object.keys(bag || {}).filter(function (c){ return Math.abs(bag[c]) >= 0.005; })
    .map(function (c){ return fmtMoney(bag[c], c); }).join(" | ");
}

function exportCSV(st, cfg, today){
  today = today || todayISO();
  var flags = computeFlags(st, cfg, today);
  /* Deal id leads. Every question that starts "which deal is this?" — a triage
     batch, a support message, a spreadsheet somebody mailed round — dies here
     if the export only carries names. It costs one column. */
  var rows = [["Deal id","Company","Deal","Stage","Owner","Value","Currency","Expected close",
               "Status","Next step","Next step due","Pushed","Last contact",
               "Invoiced","Paid","Outstanding","Commission %","Commission earned","Flags"]];
  Object.keys(st.deals).map(function(k){ return st.deals[k]; })
    .sort(function(a,b){ return a.name < b.name ? -1 : 1; })
    .forEach(function (d){
      var co = dealParty(st, d);
      var m = dealMoney(st, d);
      var ofs = openFollowupsFor(st, d.id);
      var nx = ofs[0];
      rows.push([
        d.id, co.name, d.name, stageLabel(cfg, d.stage), d.owner,
        d.value == null ? "" : d.value, d.currency || "",
        d.expectedCloseDate || "",
        d.status === "open" ? "Open" : (d.outcome === "won" ? "Won" : "Lost"),
        nx ? nx.what : "", nx ? nx.dueDate : "", nx ? nx.pushCount : "",
        lastContact(st, d.id) || "",
        bagText(m.invoiced), bagText(m.paid), bagText(m.outstanding),
        d.commissionRate == null ? "" : (Math.round(d.commissionRate * 1000) / 10) + "%",
        bagText(m.commissionEarned),
        (flags[d.id] || []).join(" | ")
      ]);
    });
  return toCSV(rows);
}

/* ---------------- paste-to-log (C9) ----------------
   Parsed in the browser. The RAW TEXT IS NEVER COMMITTED — and the suggested
   summary is built from metadata ONLY (channel, sender, date, message count,
   email subject header). No line of any message body is ever carried into the
   result object, on any channel. What was said is typed by the person logging
   it. That is deliberate: an append-only git log is the wrong shape for a
   POPIA erasure request, so third-party message content must never enter it.
------------------------------------------------------------------------- */

/* WhatsApp exports. Two envelope shapes — and inside the envelope the date and
   the time can be in EITHER order, depending on platform and on the phone's
   locale. So match the envelope loosely and work out afterwards which half is
   the date, rather than assuming one field order and silently failing on the
   other. ‎ is the left-to-right mark WhatsApp sprinkles through its own
   exports; it must be tolerated, not matched on. */
var WA_PATTERNS = [
  /* [2026/08/17, 14:22:11] Pieter van Zyl: message   — iOS / Desktop */
  /^[\s‎‏]*\[[\s‎]*([^\]\n]{6,44}?)[\s‎]*\]\s*([^:\n]{1,60}?)\s*:\s?([\s\S]*)$/,
  /* 17/08/2026, 14:22 - Pieter van Zyl: message      — Android */
  /^[\s‎‏]*(\d[^-–—\n]{5,43}?)\s*[-–—]\s*([^:\n]{1,60}?)\s*:\s?([\s\S]*)$/
];
var WA_DATE_IN = /\d{1,4}[\/\-.]\d{1,2}[\/\-.]\d{2,4}/;
var WA_TIME_IN = /\d{1,2}:\d{2}/;

/* WhatsApp's own system lines are not people and must not become "contacts". */
var WA_SYSTEM = /^(messages and calls are end-to-end encrypted|missed voice call|missed video call|you (created|added|removed|joined)|.* (created group|added|removed|left|joined using|changed the subject|changed this group))/i;

/* A date whose field order is not known in advance. Day-first (ZA) unless the
   text proves otherwise — a value above 12 can only be a day. */
function parseLooseDate(s){
  var m = /^(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(String(s || "").trim());
  if (!m) return null;
  var a = +m[1], b = +m[2], c = +m[3];
  var y, mo, d;
  if (m[1].length === 4){ y = a; mo = b; d = c; }             // 2026/08/17
  else {
    y = c < 100 ? 2000 + c : c;
    if (a > 12 && b <= 12){ d = a; mo = b; }                   // 17/08/2026 — unambiguous
    else if (b > 12 && a <= 12){ mo = a; d = b; }              // 08/17/2026 — US, unambiguous
    else { d = a; mo = b; }                                    // ambiguous → day-first, per ZA
  }
  if (!(mo >= 1 && mo <= 12 && d >= 1 && d <= 31)) return null;
  var iso = y + "-" + pad(mo) + "-" + pad(d);
  return parseISO(iso) === null ? null : iso;
}

function parsePaste(raw, opts){
  opts = opts || {};
  var excl = {};
  (opts.exclude || []).forEach(function (n){ excl[String(n).trim().toLowerCase()] = true; });
  var notUs = function (n){ return !excl[String(n).trim().toLowerCase()]; };
  var text = String(raw || "");
  var out = { channel:null, ok:false, from:"", fromName:"", to:"", subject:"",
              occurredAt:null, firstDate:null, participants:[], others:[], messageCount:0,
              suggestedKind:"note", suggestedSummary:"", reason:"" };
  var lines = text.split(/\r?\n/);

  var hasEmailHeaders = /^\s*from\s*:/im.test(text) && /^\s*(subject|sent|date)\s*:/im.test(text);

  /* ---- WhatsApp first: its line shape is the more distinctive of the two ---- */
  var dates = [], who = [], count = 0;
  for (var i = 0; i < lines.length; i++){
    for (var pi = 0; pi < WA_PATTERNS.length; pi++){
      var m = WA_PATTERNS[pi].exec(lines[i]);
      if (!m) continue;
      var stamp = m[1];
      /* the envelope must carry BOTH a date and a clock time, or it is not a
         WhatsApp message line — this is what stops "Tel: 011 555 1234" and
         quoted email headers from being read as conversation */
      if (!WA_DATE_IN.test(stamp) || !WA_TIME_IN.test(stamp)) continue;
      var name = m[2].trim();
      if (WA_SYSTEM.test(name) || WA_SYSTEM.test(m[3] || "")) break;
      count++;
      var d = parseLooseDate((stamp.match(WA_DATE_IN) || [""])[0]);
      if (d) dates.push(d);
      if (name && who.indexOf(name) < 0 && who.length < 12) who.push(name);
      break;                                  // m[3] (the message body) is discarded here
    }
  }
  /* A single stray match inside a genuine email is a quoted line, not a chat. */
  if (count === 1 && hasEmailHeaders) count = 0;

  if (count > 0){
    dates.sort();
    out.channel = "whatsapp";
    out.suggestedKind = "whatsapp";
    out.messageCount = count;
    out.participants = who;
    out.firstDate = dates[0] || null;
    out.occurredAt = dates.length ? dates[dates.length - 1] : null;   // most recent contact
    /* Name the OTHER side of the conversation. "WhatsApp with Howard, Thandi"
       reads as though Howard were the customer; our own people are noise here. */
    var others = who.filter(notUs);
    out.others = others;
    out.fromName = others[0] || who[0] || "";
    out.suggestedSummary = "WhatsApp" + (others.length ? " with " + others.join(", ") : "") +
      " · " + count + " message" + (count === 1 ? "" : "s");
    out.ok = true;
    return out;
  }

  /* ---- email headers ---- */
  function header(names){
    for (var j = 0; j < Math.min(lines.length, 60); j++){
      var hm = /^\s*([A-Za-z-]+)\s*:\s*(.+)$/.exec(lines[j]);
      if (hm && names.indexOf(hm[1].toLowerCase()) >= 0) return hm[2].trim();
    }
    return "";
  }
  var fromRaw = header(["from","van"]);
  out.subject  = header(["subject","subj","onderwerp"]);
  out.to       = (header(["to"]).match(/[\w.+-]+@[\w-]+\.[\w.-]+/) || [""])[0];
  var dateRaw  = header(["date","sent","gestuur"]);

  var anyEmail = text.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
  out.from = (fromRaw.match(/[\w.+-]+@[\w-]+\.[\w.-]+/) || [anyEmail ? anyEmail[0] : ""])[0] || "";
  var nm = /^\s*"?([^"<]+?)"?\s*</.exec(fromRaw);
  out.fromName = nm ? nm[1].trim() : (fromRaw && !/@/.test(fromRaw) ? fromRaw.trim() : "");
  if (out.fromName) { out.participants = [out.fromName]; out.others = [out.fromName].filter(notUs); }

  if (dateRaw){
    var dd = new Date(dateRaw);
    if (!isNaN(dd.getTime())) out.occurredAt = toISO(dd);
  }
  if (!out.occurredAt){
    var iso = text.match(/\b(\d{4}-\d{2}-\d{2})\b/);
    if (iso) out.occurredAt = iso[1];
  }

  if (out.from || out.subject){
    out.channel = "email";
    out.suggestedKind = "email";
    out.messageCount = 1;
    /* Metadata only. The body is NOT used as a fallback subject — that was a
       leak: an email with no Subject header would have copied its first
       sentence into the field that gets committed. */
    out.suggestedSummary = (out.subject ||
      ("Email" + (out.fromName ? " from " + out.fromName : out.from ? " from " + out.from : ""))).slice(0, 140);
    out.ok = true;
    return out;
  }

  out.reason = "No email headers and no WhatsApp timestamps found. " +

function parseEmailPaste(raw){ return parsePaste(raw); }

function matchContact(st, email, name){
  var e = String(email||"").toLowerCase();
  var found = null;
  for (var k in st.contacts){
    var c = st.contacts[k];
    if (e && String(c.email||"").toLowerCase() === e){ found = c; break; }
  }
  if (!found && name){
    var n = String(name).toLowerCase();
    for (var k2 in st.contacts)
      if (String(st.contacts[k2].name||"").toLowerCase() === n){ found = st.contacts[k2]; break; }
  }
  if (!found && e){
    var dom = e.split("@")[1] || "";
    for (var k3 in st.companies){
      var co = st.companies[k3];
      if (co.domain && dom && String(co.domain).toLowerCase().replace(/^www\./,"") === dom)
        return { contact:null, company:co, deal:pickDealForCompany(st, co.id) };
    }
    return { contact:null, company:null, deal:null };
  }
  if (!found) return { contact:null, company:null, deal:null };
  var comp = st.companies[found.companyId] || null;
  return { contact:found, company:comp, deal: comp ? pickDealForCompany(st, comp.id) : null };

   The last nine digits are the stable part across every one of those. */
function phoneKey(s){
  var d = String(s || "").replace(/\D/g, "");
  return d.length >= 9 ? d.slice(-9) : "";
}

/* Resolve a parsed paste to a contact / company / deal.
   WhatsApp gives names or phone numbers rather than an address, and one of the
   participants is one of US — skip our own people or every chat matches nobody. */
function matchPaste(st, parsed, excludeNames){
  var skip = {};
  (excludeNames || []).forEach(function (n){ skip[String(n).toLowerCase()] = true; });

  if (parsed.from){
    var byEmail = matchContact(st, parsed.from, parsed.fromName);
    if (byEmail.contact || byEmail.company) return byEmail;
  }
  var names = (parsed.participants && parsed.participants.length)
    ? parsed.participants : (parsed.fromName ? [parsed.fromName] : []);

  for (var i = 0; i < names.length; i++){
    var raw = String(names[i] || "").trim();
    if (!raw || skip[raw.toLowerCase()]) continue;
    var pk = phoneKey(raw);
    for (var k in st.contacts){
      var c = st.contacts[k];
      if (String(c.name || "").toLowerCase() === raw.toLowerCase() ||
          (pk && phoneKey(c.phone) === pk)){
        var comp = st.companies[c.companyId] || null;
        return { contact:c, company:comp, deal: comp ? pickDealForCompany(st, comp.id) : null };
      }
    }
  }
  return { contact:null, company:null, deal:null };
}

function pickDealForCompany(st, companyId){
  var ds = openDeals(st).filter(function(d){ return d.companyId === companyId; });
  if (!ds.length) return null;
  ds.sort(function(a,b){ return (b.value||0) - (a.value||0); });

/* ---------------- search ---------------- */

function search(st, cfg, q, limit){
  q = String(q||"").trim().toLowerCase();
  if (!q) return [];
  var out = [];
  function push(kind, id, title, sub, score){ out.push({ kind:kind, id:id, title:title, sub:sub, score:score }); }
  function score(hay){
    hay = String(hay||"").toLowerCase();
    var i = hay.indexOf(q);

  Object.keys(st.deals).forEach(function (k){
    var d = st.deals[k], party = dealParty(st, d);
    var s = Math.max(score(d.name), score(party.name));
    if (s) push("deal", d.id, d.name, (party.name ? party.name + " · " : "") + stageLabel(cfg, d.stage), s + (d.status==="open"?1:0));

  Object.keys(st.companies).forEach(function (k){
    var c = st.companies[k], s = Math.max(score(c.name), score(c.domain));

  Object.keys(st.contacts).forEach(function (k){
    var c = st.contacts[k], s = Math.max(score(c.name), score(c.email));

<script id="crm-app">

  var el = document.createElement(tag);
  if (attrs) for (var k in attrs){
    var v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "html") el.innerHTML = v;               // only ever for static markup below

    else if (k === "data") { for (var d in v) el.dataset[d] = v[d]; }
    else if (k === "style") el.setAttribute("style", v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (var i = 2; i < arguments.length; i++){
    var c = arguments[i];
    if (c == null || c === false) continue;
    if (Array.isArray(c)) c.forEach(function (x){ if (x != null && x !== false) el.appendChild(typeof x === "string" ? document.createTextNode(x) : x); });
    else el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }

}

  demoEv:    "crm.demo.events",

  teamCfg:   "crm.team.cache.config",

  ok: true,            // has every write so far succeeded?
  reason: "",          // "quota" | "blocked" | ""
  detail: "",

  lastError: null

   bloat an append-only log for no extra information. */
function announceBuild(){
  if (App.workspace !== "team") return;          // the demo has nobody to tell
  var b = buildInfo();
  if (!b.id) return;
  var known = App.st.clients[App.me];

  try {
    var probe = "crm.__probe";

    return true;
  } catch (e){ return false; }

  try { var v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); }

   once before giving up — the demo cache is disposable and is the obvious
   thing to sacrifice to keep real work saved. */
function lsSet(k, v){

  try { payload = JSON.stringify(v); }
  catch (e){ return false; }

    return true;

    "err",
    { label: unsynced ? "Export now" : "Settings",
      fn: function (){ unsynced ? exportEverything() : go("settings"); } }
  );
}

/* A persistent, unmissable strip — because unlike a toast it does not go away
   while the problem has not. */
function updateStorageBanner(){
  var host = $("#storagebanner");

  clear(host);

    h("button", { class:"btn btn-sm", type:"button", onclick:exportEverything }, "Export now"),
    h("button", { class:"btn btn-sm", type:"button", onclick:function (){ go("settings"); } }, "Settings")));
}

var App = {
  workspace: lsGet(LS.ws, "demo"),        // "demo" | "team"
  view: "today",
  scope: lsGet(LS.scope, "mine"),
  me: lsGet(LS.me, "howard"),
  events: [],
  config: null,
  st: null,
  flags: {},
  today: C.todayISO(),
  gh: lsGet(LS.gh, { owner:"", repo:"", branch:"main", path:"", token:"", user:"" }),
  pending: lsGet(LS.pending, []),
  sync: { status:"idle", detail:"", lastAt:null },
  selectedIndex: -1,
  rows: [],
  pipeFilter: null,
  openDealId: null,
  seq: 0
};

/* ---------------- workspace load / persist ---------------- */

function loadWorkspace(){
  if (App.workspace === "demo"){
    var stored = lsGet(LS.demoEv, null);
    if (stored && stored.day === App.today && Array.isArray(stored.events)) App.events = stored.events;
    else { var built = Demo.build(App.today); App.events = built.events; persistDemo(); }
    App.config = Demo.config;
    App.me = lsGet(LS.me + ".demo", "howard");
  } else {
    App.events = lsGet(LS.teamEv, []) || [];
    App.config = lsGet(LS.teamCfg, null) || defaultConfig();
    App.me = App.gh.user || lsGet(LS.me, "howard");
    var byId = {};
    App.events.forEach(function (e){ byId[e.id] = e; });
    App.pending = (lsGet(LS.pending, []) || [])
      .map(function (x){ return typeof x === "string" ? byId[x] : x; })   // tolerate the old format
      .filter(Boolean);
  }
  lsSet(LS.ws, App.workspace);      // make the resolved choice explicit, not implied by a default
  refold();
}
function defaultConfig(){
  return { stages:[
      { id:"lead", label:"Lead", probability:0.10 },
      { id:"qualified", label:"Qualified", probability:0.30 },
      { id:"proposal", label:"Proposal", probability:0.60 },
      { id:"negotiation", label:"Negotiation", probability:0.85 }],
    thresholds:{ pushedCount:3, silentDays:30, stalledDays:45 },
    users:[{ id:"howard", name:"Howard", initials:"HM", github:"howard" }],
    currencies:["ZAR","USD"], defaultCurrency:"ZAR" };
}
function persistDemo(){ return lsSet(LS.demoEv, { day:App.today, events:App.events }); }
/* Pending is a SUBSET of events, so storing whole objects wrote every unsynced
   event to the browser twice. Store ids and rehydrate on load. */
function persistTeam(){
  var a = lsSet(LS.teamEv, App.events);
  var b = lsSet(LS.pending, App.pending.map(function (e){ return e.id; }));
  return a && b;
}
function persist(){ return App.workspace === "demo" ? persistDemo() : persistTeam(); }

function refold(){
  App.today = C.todayISO();
  App.st = C.foldEvents(App.events);
  App.flags = C.computeFlags(App.st, App.config, App.today);
}

/* ---------------- emitting events ---------------- */

function emit(type, payload){
  var e = { id:C.uid("ev"), ts:new Date().toISOString(), seq:App.seq++,
            actor:App.me, type:type, payload:payload };
  App.events.push(e);
  if (App.workspace === "team") App.pending.push(e);
  persist();
  refold();
  if (App.workspace === "team" && App.gh.token) scheduleFlush();
  return e;
}

/* ---------------- users ---------------- */

function users(){ return (App.config && App.config.users) || []; }
function userName(id){ var u = users().filter(function(x){ return x.id === id; })[0]; return u ? u.name : id; }
/* Who does what. Shown wherever a task is being handed to somebody, so a next
   step landing on the wrong desk is visible at the moment it is assigned rather
   than a week later when nobody has done it. */
function userRole(id){
  var u = users().filter(function(x){ return x.id === id; })[0];
  return u && u.role ? u.role : "";
}
function userLabel(id){
  var r = userRole(id);
  return userName(id) + (r ? "  \u00b7  " + r : "");
}
function initials(id){
  var u = users().filter(function(x){ return x.id === id; })[0];
  if (u && u.initials) return u.initials;
  return String(id||"?").slice(0,2).toUpperCase();
}
function scopeOpts(){ return { scope:App.scope, user:App.me }; }

/* ---------------- toasts ---------------- */

function toast(msg, kind, action){
  var box = $("#toasts");
  var t = h("div", { class:"toast" + (kind === "err" ? " err" : ""), role:"status" }, msg);
  if (action) t.appendChild(h("button", { type:"button", onclick:function (){ action.fn(); t.remove(); } }, action.label));
  box.appendChild(t);
  setTimeout(function (){ t.style.transition = "opacity .25s"; t.style.opacity = "0";
                          setTimeout(function(){ t.remove(); }, 260); }, action ? 6500 : 3200);
}

/* ---------------- layers: popovers, panels, overlays ---------------- */

var layers = null;
function layerEl(){ return layers || (layers = $("#layers")); }
function closeLayers(kind){
  var l = layerEl();
  Array.prototype.slice.call(l.children).forEach(function (c){
    if (!kind || c.dataset.kind === kind){ if (c._cleanup) c._cleanup(); c.remove(); }
  });
}
/* A popover must never put its own Save button off-screen. Width is decided
   BEFORE positioning, the box is clamped to the viewport on both axes, and it
   scrolls internally with a sticky footer when the form is taller than the window.
   Below 560px there is no room to sit beside an anchor, so it becomes a sheet. */
function openPopover(anchor, node, opts){
  opts = opts || {};
  closeLayers("pop");
  var wrap = h("div", { class:"pop", data:{ kind:"pop" }, role:"dialog" });
  wrap.appendChild(node);
  layerEl().appendChild(wrap);

  var vw = document.documentElement.clientWidth;
  var vh = window.innerHeight || document.documentElement.clientHeight;
  var width = Math.min(opts.width || 280, vw - 16);
  wrap.style.width = width + "px";
  wrap.style.maxHeight = (vh - 16) + "px";

  var r = anchor && anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : null;

  function place(){
    var hgt = wrap.offsetHeight;
    var maxTop  = Math.max(8, vh - hgt - 8);
    var maxLeft = Math.max(8, vw - width - 8);
    var left, top;
    if (vw < 560 || !r || (!r.width && !r.height)){
      left = (vw - width) / 2;
      top  = Math.min(60, maxTop);
    } else {
      left = r.left;
      top  = r.bottom + 6;                                  // prefer just below the anchor
      var above = r.top - hgt - 6;
      if (top + hgt > vh - 8 && above >= 8) top = above;     // otherwise just above it
    }
    // Final clamp, unconditionally. The anchor may itself be scrolled off-screen,
    // in which case both preferences are wrong and the viewport wins.
    wrap.style.left = Math.round(Math.max(8, Math.min(left, maxLeft))) + "px";
    wrap.style.top  = Math.round(Math.max(8, Math.min(top,  maxTop))) + "px";
  }
  place();

  /* Popovers GROW after they open — a paste preview appears, a date hint
     resolves, an error note is added. A position computed once goes stale the
     moment that happens, so re-clamp whenever the box changes size. */
  if (typeof ResizeObserver === "function"){
    wrap._ro = new ResizeObserver(function (){ place(); });
    wrap._ro.observe(wrap);
  }
  function onResize(){
    vw = document.documentElement.clientWidth;
    vh = window.innerHeight || document.documentElement.clientHeight;
    width = Math.min(opts.width || 280, vw - 16);
    wrap.style.width = width + "px";
    wrap.style.maxHeight = (vh - 16) + "px";
    r = anchor && anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : null;
    place();
  }
  window.addEventListener("resize", onResize);
  wrap._cleanup = function (){
    window.removeEventListener("resize", onResize);
    if (wrap._ro) wrap._ro.disconnect();
  };

  // A transient toast must never sit on top of the button this form exists to offer.
  clear($("#toasts"));

  var first = wrap.querySelector("input,button,select,textarea");
  if (first) first.focus();
  setTimeout(function (){
    document.addEventListener("mousedown", outside, true);
  }, 0);
  function outside(e){
    if (!wrap.contains(e.target)){
      document.removeEventListener("mousedown", outside, true);
      wrap._cleanup(); wrap.remove();
    }
  }
  wrap.addEventListener("keydown", function (e){
    if (e.key === "Escape"){ e.stopPropagation(); wrap._cleanup(); wrap.remove(); }
  });
  return wrap;
}

/* ---------------- GitHub sync (P3 / C2) ---------------- */

function b64encode(str){
  var bytes = new TextEncoder().encode(str), bin = "";
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decode(b64){
  var bin = atob(String(b64).replace(/\n/g, ""));
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function ghHeaders(){
  return { "Accept":"application/vnd.github+json", "Authorization":"Bearer " + App.gh.token,
           "X-GitHub-Api-Version":"2022-11-28" };
}
/* One repo can host several apps' data, each in its own folder — so every path
   is resolved under an optional prefix. Empty prefix means the repo root, which
   is what a repo dedicated to the CRM looks like. */
function ghPrefix(){
  return String(App.gh.path || "").replace(/\\/g, "/").replace(/^\/+|\/+$/g, "");
}
function ghRelPath(rel){
  var base = ghPrefix();
  return base ? base + "/" + rel : rel;
}
function ghUrl(rel){
  /* encode each segment but keep the slashes — a folder called "CRM Data"
     must survive, and "CRM%2FData" would not be a folder */
  var encoded = ghRelPath(rel).split("/").map(encodeURIComponent).join("/");
  return "https://api.github.com/repos/" + encodeURIComponent(App.gh.owner) + "/" +
         encodeURIComponent(App.gh.repo) + "/contents/" + encoded;
}
function ghConfigured(){ return !!(App.gh.owner && App.gh.repo && App.gh.token && App.gh.user); }

/* The web address of a path in the repo — for looking at with human eyes.
   The API url is not browsable, and people check the wrong place otherwise. */
function ghWebUrl(rel, kind){
  if (!App.gh.owner || !App.gh.repo) return null;
  var p = ghRelPath(rel || "");
  return "https://github.com/" + encodeURIComponent(App.gh.owner) + "/" +
         encodeURIComponent(App.gh.repo) + "/" + (kind || "tree") + "/" +
         encodeURIComponent(App.gh.branch || "main") +
         (p ? "/" + p.split("/").map(encodeURIComponent).join("/") : "");
}

function setSync(status, detail){
  App.sync.status = status; App.sync.detail = detail || "";
  if (status === "ok") App.sync.lastAt = new Date().toISOString();
  var dot = $("#syncdot"); var txt = $("#synctxt");
  if (dot) dot.className = "sync-dot " + (status === "ok" ? "ok" : status === "error" ? "err" : status === "syncing" || App.pending.length ? "pending" : "");
  if (txt) txt.textContent = syncLabel();
}
/* A wall clock in the reader's own time. Slicing the ISO string showed UTC —
   two hours out in Johannesburg, and wrong by a different amount for anyone
   travelling. Timestamps are stored as UTC and always have been; only the
   rendering was lying. */
function fmtClock(iso){
  try {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso).slice(11,16);
    return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  } catch (e){ return String(iso).slice(11,16); }
}

function syncLabel(){
  if (App.workspace === "demo") return "Demo — nothing is saved to a repo";
  if (!ghConfigured()) return "Not connected — Settings";
  if (App.sync.status === "syncing") return "Syncing…";
  if (App.sync.status === "error") return "Sync failed — " + App.sync.detail;
  if (App.pending.length) return App.pending.length + " change" + (App.pending.length === 1 ? "" : "s") + " waiting";
  return "Synced" + (App.sync.lastAt ? " · " + fmtClock(App.sync.lastAt) : "");
}

var flushTimer = null;
function scheduleFlush(){
  clearTimeout(flushTimer);
  flushTimer = setTimeout(function (){ flushPending().catch(function(){}); }, 1200);
  setSync("pending");
}

async function ghGetFile(path){
  var res = await fetch(ghUrl(path) + "?ref=" + encodeURIComponent(App.gh.branch || "main"),
                        { headers:ghHeaders(), cache:"no-store" });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(ghExplain(res.status, ghRelPath(path), await res.text()));
  var j = await res.json();
  /* A directory comes back as an array, and a file over 1MB comes back with no
     inline content. Returning "" for either produces a baffling "not valid JSON"
     several steps later, so name the actual problem here. */
  if (Array.isArray(j))
    throw new Error(ghRelPath(path) + " is a folder, not a file. Check the " +
                    "\u201cFolder in repo\u201d setting.");
  if (typeof j.content !== "string")
    throw new Error(ghRelPath(path) + " came back from GitHub with no content" +
                    (j.size > 900000 ? " — it is too large to read this way (" +
                     Math.round(j.size/1024) + " KB)." : "."));
  return { sha:j.sha, text: b64decode(j.content) };
}
async function ghPutFile(path, text, sha, message){
  var body = { message:message || "crm update", content:b64encode(text),
               branch: App.gh.branch || "main" };
  if (sha) body.sha = sha;
  var res = await fetch(ghUrl(path), { method:"PUT", headers:
      Object.assign({ "Content-Type":"application/json" }, ghHeaders()), body:JSON.stringify(body) });
  if (!res.ok)
    throw new Error(ghExplain(res.status, ghRelPath(path), await res.text(), { write:true }));
  return res.json();
}

/* GitHub's status codes are precise and completely unhelpful to the person
   reading them. Each one has a small number of real causes; say those. */
function ghSaid(body){
  /* GitHub's own message is often the most useful sentence available —
     "Resource not accessible by personal access token" says it exactly. */
  try { var j = JSON.parse(body); if (j && j.message) return " GitHub said: \u201c" + j.message + "\u201d."; }
  catch (e){}
  return "";
}

function ghExplain(status, where, body, opts){
  var b = String(body || "");
  var writing = !!(opts && opts.write);
  switch (status){
    case 401:
      return "GitHub rejected the token itself (401). This is not a permissions " +
             "problem — the token is expired, mistyped, or was cut short when " +
             "pasted. Generate a fresh one and paste the whole thing." + ghSaid(b);
    case 403:
      if (/rate limit/i.test(b)) return "GitHub rate limit reached (403). Wait a few minutes.";
      return "The token is valid but not allowed to do this (403)." + ghSaid(b) +
             " Usually its Contents permission is Read rather than Read and write, " +
             "or it is still waiting for an organisation owner to approve it.";
    case 404:
      if (writing)
        return "GitHub would not write to " + where + " (404)." + ghSaid(b) +
               " GitHub answers 404 for anything a token cannot reach, so in " +
               "likelihood order: this token was not given access to this " +
               "repository when it was created; it is still awaiting organisation " +
               "approval; the repository or branch does not exist yet; or Contents " +
               "is set to Read rather than Read and write. Run Test connection — it " +
               "checks each of those separately.";
      return "Not found (404) at " + where + "." + ghSaid(b) +
             " GitHub returns 404 rather than \u201cforbidden\u201d for private " +
             "repos, so this means either the name is wrong or this token cannot " +
             "see it. Check the repo owner, the repo name, and the folder.";
    case 409:
      return "Conflict (409) at " + where + "." + ghSaid(b) +
             " Either the repository has no commits yet, or someone changed the " +
             "file at the same moment. Pull, then try again.";
    case 422:
      return "GitHub refused the request (422)." + ghSaid(b) +
             " Usually the branch name is wrong.";
    default:
      return "GitHub returned " + status + " on " + where + "." + ghSaid(b);
  }
}

/* A step-by-step probe. Each step is a thing that can independently be wrong,
   and stopping at the first failure means the answer is one line, not six. */
async function testConnection(report){
  var steps = [];
  var say = function (state, label, detail){
    steps.push({ state:state, label:label, detail:detail || "" });
    report(steps);
  };

  var owner = App.gh.owner, repo = App.gh.repo, branch = App.gh.branch || "main";

  /* 0 — things we can catch without asking GitHub at all */
  if (!/^[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?$/.test(owner)){
    say("fail", "Repo owner is not a valid GitHub name",
      /_/.test(owner)
        ? "\u201c" + owner + "\u201d contains an underscore. GitHub account and " +
          "organisation names allow letters, digits and hyphens only — never " +
          "underscores. Did you mean " + owner.replace(/_/g, "-") + "?"
        : "\u201c" + owner + "\u201d is not a valid GitHub owner name.");
    return steps;
  }
  say("ok", "Repo owner looks like a GitHub name");

  if (!App.gh.token){ say("fail", "No token entered"); return steps; }

  /* 1 — is the token itself accepted? */
  try {
    var r0 = await fetch("https://api.github.com/rate_limit", { headers:ghHeaders(), cache:"no-store" });
    if (r0.status === 401){
      say("fail", "GitHub rejected the token", ghExplain(401));
      return steps;
    }
    if (!r0.ok){ say("warn", "Could not verify the token", "GitHub returned " + r0.status); }
    else say("ok", "The token is accepted by GitHub");
  } catch (e){
    say("fail", "Could not reach github.com", String(e.message || e) +
        " — check the connection, or whether something is blocking api.github.com.");
    return steps;
  }

  /* 2 — can this token see the repository? */
  var repoInfo = null;
  try {
    var r1 = await fetch("https://api.github.com/repos/" + encodeURIComponent(owner) +
                         "/" + encodeURIComponent(repo), { headers:ghHeaders(), cache:"no-store" });
    if (!r1.ok){
      say("fail", "Cannot see " + owner + "/" + repo,
          ghExplain(r1.status, owner + "/" + repo, await r1.text()) +
          (r1.status === 404
            ? " The token is valid, so the likeliest causes are that this " +
              "repository was not ticked under \u201cOnly select repositories\u201d " +
              "when the token was created, or the token is still listed as Pending " +
              "under the organisation's Personal access tokens settings."
            : ""));
      return steps;
    }
    repoInfo = await r1.json();
    say("ok", "Found the repository", repoInfo.private ? "private, as it should be"
                                                       : "WARNING: this repository is PUBLIC");
    if (repoInfo.permissions && repoInfo.permissions.push === false)
      say("fail", "The token can read but not write",
          "Its Contents permission is Read, not Read and write. Permissions cannot " +
          "be changed on an existing token — generate a new one.");
    else if (repoInfo.permissions && repoInfo.permissions.push)
      say("ok", "The token can write");
  } catch (e){ say("fail", "Repository check failed", String(e.message || e)); return steps; }

  /* 3 — does the branch exist? */
  try {
    var r2 = await fetch("https://api.github.com/repos/" + encodeURIComponent(owner) + "/" +
                         encodeURIComponent(repo) + "/branches/" + encodeURIComponent(branch),
                         { headers:ghHeaders(), cache:"no-store" });
    if (!r2.ok){
      say("fail", "No branch called \u201c" + branch + "\u201d",
          "The default branch on GitHub is usually " +
          (repoInfo && repoInfo.default_branch ? "\u201c" + repoInfo.default_branch + "\u201d" : "main or master") + ".");
      return steps;
    }
    say("ok", "Branch \u201c" + branch + "\u201d exists");
  } catch (e){ say("warn", "Branch check failed", String(e.message || e)); }

  /* 4 — is config.json where we are looking? */
  var cfg = null;
  try {
    var got = await ghGetFile("config.json");
    if (!got){
      say("fail", "No config.json at " + ghRelPath("config.json"),
          ghPrefix()
            ? "The folder or the file name is wrong. Check the capitals — CRM_Data and crm_data are different paths."
            : "Either commit config.json to the root, or set \u201cFolder in repo\u201d if it lives in a subfolder.");
      return steps;
    }
    say("ok", "Found " + ghRelPath("config.json"));
    try { cfg = JSON.parse(got.text); say("ok", "config.json is valid JSON"); }
    catch (e){
      say("fail", "config.json is not valid JSON", String(e.message || e) +
          " — usually a trailing comma, or smart quotes pasted from a document.");
      return steps;
    }
  } catch (e){ say("fail", "Could not read config.json", String(e.message || e)); return steps; }

  /* 5 — is the user id one of the people in it? */
  var ids = ((cfg && cfg.users) || []).map(function (u){ return u.id; });
  if (!App.gh.user){
    say("fail", "No user id entered", "It must be one of: " + (ids.join(", ") || "(config.json lists nobody)"));
  } else if (ids.indexOf(App.gh.user) < 0){
    say("fail", "\u201c" + App.gh.user + "\u201d is not a person in config.json",
        "This is your short name inside the CRM, not the organisation and not your " +
        "GitHub login. config.json lists: " + (ids.join(", ") || "nobody yet") + ".");
  } else {
    say("ok", "\u201c" + App.gh.user + "\u201d is in config.json",
        "Your events will be written to " + ghRelPath("events/" + App.gh.user + ".jsonl"));
  }

  /* 6 — the events folder */
  try {
    var res = await fetch(ghUrl("events") + "?ref=" + encodeURIComponent(branch),
                          { headers:ghHeaders(), cache:"no-store" });
    if (res.status === 404)
      say("warn", "No events folder yet at " + ghRelPath("events"),
          "Not fatal — it is created on your first save. But if you expected other " +
          "people's work to be there, the folder name or path is wrong.");
    else if (res.ok){
      var files = await res.json();
      var jsonl = (Array.isArray(files) ? files : []).filter(function (f){ return /\.jsonl$/.test(f.name); });
      say("ok", "Found the events folder",
          jsonl.length ? jsonl.length + " event file(s): " + jsonl.map(function (f){ return f.name; }).join(", ")
                       : "empty so far");
    }
  } catch (e){ say("warn", "Could not list the events folder", String(e.message || e)); }

  /* 7 — ACTUALLY WRITE SOMETHING.
     The repository's reported permissions describe the account, not always the
     token, so "can write" read off the repo object is a guess. The only honest
     check is to try. This writes one small file and updates it in place on
     later runs — it never touches anyone's event log. */
  try {
    var probe = ".crm-write-check";
    var prev = null;
    try { prev = await ghGetFile(probe); } catch (e){ prev = null; }
    var stamp = "Last successful write check: " + new Date().toISOString() +
                " by " + (App.gh.user || "?") + "\n";
    await ghPutFile(probe, stamp, prev ? prev.sha : null, "crm: write check");
    say("ok", "Write test passed",
        "Wrote " + ghRelPath(probe) + ". This is the only check that proves saving " +
        "will work — everything above only proves reading does.");
  } catch (e){
    say("fail", "Write test FAILED", String(e.message || e));
  }

  return steps;
}

async function pullTeam(){
  if (!ghConfigured()) throw new Error("Not connected");
  setSync("syncing");
  /* A missing config.json used to fall back to defaults SILENTLY. That turned
     "this token cannot see the repository at all" into "everything is fine"
     right up until the first write failed with an unrelated-looking 404.
     A read that finds nothing is a failure, and must say so. */
  var cfgFile = await ghGetFile("config.json");
  if (!cfgFile)
    throw new Error("Could not read " + ghRelPath("config.json") + ". Reading it " +
      "returned nothing, which means one of: the file has not been pushed to " +
      "GitHub yet, the \u201cFolder in repo\u201d is wrong, or this token cannot " +
      "see this repository (pending organisation approval, or the repository was " +
      "not selected when the token was made). Use Test connection to tell which.");
  var cfg;
  try { cfg = JSON.parse(cfgFile.text); }
  catch (e){
    throw new Error(ghRelPath("config.json") + " is not valid JSON: " +
      String(e.message || e) + " — usually a trailing comma or a smart quote.");
  }

  var listRes = await fetch(ghUrl("events") + "?ref=" + encodeURIComponent(App.gh.branch || "main"),
                            { headers:ghHeaders(), cache:"no-store" });
  var events = [];
  if (listRes.ok){
    var files = await listRes.json();
    if (Array.isArray(files)){
      for (var i = 0; i < files.length; i++){
        var f = files[i];
        if (!/\.jsonl$/.test(f.name)) continue;
        var got = await ghGetFile("events/" + f.name);
        if (!got) continue;
        got.text.split(/\n/).forEach(function (line){
          line = line.trim(); if (!line) return;
          try { events.push(JSON.parse(line)); } catch (e){}
        });
      }
    }
  } else if (listRes.status !== 404){
    throw new Error(ghExplain(listRes.status, ghRelPath("events"), ""));
  }

  // local pending events that are not yet on the server stay in view
  var known = {}; events.forEach(function(e){ known[e.id] = true; });
  App.pending.forEach(function (e){ if (!known[e.id]) events.push(e); });

  App.events = C.sortEvents(events);
  App.config = cfg;
  lsSet(LS.teamCfg, cfg);
  persistTeam();
  refold();
  setSync(App.pending.length ? "pending" : "ok");
  return true;
}

var flushing = false;
async function flushPending(){
  if (flushing || !App.pending.length || !ghConfigured()) return;
  flushing = true;
  setSync("syncing");
  try {
    var path = "events/" + App.gh.user + ".jsonl";
    var batch = App.pending.slice();
    var existing = await ghGetFile(path);
    var have = {};
    if (existing) existing.text.split(/\n/).forEach(function (l){
      l = l.trim(); if (!l) return;
      try { have[JSON.parse(l).id] = true; } catch (e){}
    });
    var lines = batch.filter(function (e){ return !have[e.id]; })
                     .map(function (e){ return JSON.stringify(e); });
    if (lines.length){
      var base = existing ? existing.text.replace(/\s*$/, "") : "";
      var next = (base ? base + "\n" : "") + lines.join("\n") + "\n";
      await ghPutFile(path, next, existing ? existing.sha : null,
                      "crm: " + lines.length + " event" + (lines.length===1?"":"s") +
                      " from " + App.gh.user + (ghPrefix() ? " (" + ghPrefix() + ")" : ""));
    }
    App.pending = App.pending.filter(function (e){ return batch.indexOf(e) < 0; });
    persistTeam();
    setSync(App.pending.length ? "pending" : "ok");
  } catch (err){
    setSync("error", String(err.message || err));
    toast("Sync failed: " + (err.message || err) + " Your work is saved locally and will retry.", "err");
  } finally { flushing = false; }
}

/* The email line. Two facts and the distance between them: when the triage last
   ran, and how far into the mail it reached. Shown on Today because that is the
   page anyone actually looks at, and because a CRM whose flags are computed from
   what has been logged is only as trustworthy as the last time anything was.

   It never says the mail is up to date \u2014 it cannot know that. It says when it
   last ran and what it covered, and lets the reader draw the conclusion. */
function mailStatusLine(){
  var w = C.mailWatermark(App.st);
  if (!w.ran)
    return h("div", { class:"note", style:"margin:0 0 14px",
      text:"No email has been brought in yet. Import a triage batch in Settings and this line will say when." });

  var ranDay = String(w.ran).slice(0, 10);
  var age = C.daysBetween(ranDay, App.today);            // whole days since the run
  var when = age === 0 ? "today at " + fmtClock(w.ran)
           : age === 1 ? "yesterday at " + fmtClock(w.ran)
           : age + " days ago, on " + C.fmtDay(ranDay);
  var behind = C.daysBetween(w.coversTo, App.today);

  var txt = "Email last brought in " + when +
            " \u00b7 covers mail to " + C.fmtDay(w.coversTo) +
            " \u00b7 " + w.count + " conversation" + (w.count === 1 ? "" : "s") + " logged";

  /* Only the run's own age is worth colouring. How far back the newest mail
     sits is not a fault \u2014 a quiet week is a quiet week \u2014 but a triage that has
     not run in days means the flags on this page are reading stale ground. */
  var stale = age >= 3;
  var line = h("div", { class:"note", style:"margin:0 0 14px" + (stale ? ";color:var(--overdue)" : ""),
                        title:"Counted from the conversations imported from tagged mail, not from a marker written at the time.",
                        text:txt });
  if (stale)
    line.appendChild(h("div", { style:"color:var(--muted)",
      text:"Nothing on this page has seen your inbox since then." }));
  else if (behind >= 3)
    line.appendChild(h("div", { style:"color:var(--muted)",
      text:"The newest tagged mail is " + behind + " days old \u2014 either it has been quiet, or it is not being tagged." }));
  return line;
}

function completeFollowup(f, rowEl){
  emit("followup.completed", { followupId:f.id, completedAt:App.today });
  var afterwards = function (){
    var stillOpen = f.subjectType === "deal" ? C.openFollowupsFor(App.st, f.subjectId) : [];
    var deal = f.subjectType === "deal" ? App.st.deals[f.subjectId] : null;
    if (deal && deal.status === "open" && stillOpen.length === 0){
      var anchor = $("#content") || document.body;
      nextStepPopover(anchor, deal, null, { reason:"Done — what's next on " + deal.name + "?" });
    } else render();
  };
  if (rowEl && !window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    rowEl.classList.add("done");
    var head = rowEl.closest(".band") && rowEl.closest(".band").querySelector(".band-head .n");
    if (head){
      var n = parseInt(String(head.textContent).replace(/\D/g,""), 10);
      if (!isNaN(n)) head.textContent = "· " + Math.max(0, n - 1);
    }
    setTimeout(afterwards, 280);
  } else afterwards();
  toast("Done — " + f.what, null, { label:"Undo", fn:function (){
    emit("followup.updated", { followupId:f.id });         // no-op guard
    App.events = App.events.filter(function (e){
      return !(e.type === "followup.completed" && e.payload && e.payload.followupId === f.id);
    });
    if (App.workspace === "team")
      App.pending = App.pending.filter(function (e){
        return !(e.type === "followup.completed" && e.payload && e.payload.followupId === f.id);
      });
    persist(); refold(); render();
  }});
}

function deferPopover(anchor, f){
  var box = h("div");
  box.appendChild(h("h4", { text:"Defer — " + f.what }));
  var quick = h("div", { class:"quick" });
  [[1,"Tomorrow","1"],[3,"+3 days","3"],[7,"+7 days","7"],[14,"+14 days","14"]].forEach(function (q){
    var to = C.deferBy(App.today, q[0]);
    quick.appendChild(h("button", { class:"btn btn-sm", type:"button",
      title:q[1] + " → " + C.fmtFull(to) + (C.isWeekend(C.addDays(App.today, q[0])) ? " (weekend skipped)" : ""),
      onclick:function (){ doDefer(f, to); } },
      h("span", { text:q[1] }), " ", h("span", { class:"kbd", text:q[2] })));
  });
  box.appendChild(quick);
  var inp = h("input", { type:"text", placeholder:"or type: fri · +21 · 3 sep · 2026-09-03",
                         "aria-label":"Defer to a typed date" });
  var preview = h("div", { class:"note", text:"Typed dates land exactly as typed — weekends are not skipped." });
  inp.addEventListener("input", function (){
    var d = C.parseDateInput(inp.value, App.today);
    preview.textContent = inp.value.trim()
      ? (d ? "→ " + C.fmtFull(d) : "Not a date I recognise.")
      : "Typed dates land exactly as typed — weekends are not skipped.";
  });
  inp.addEventListener("keydown", function (e){
    if (e.key === "Enter"){
      var d = C.parseDateInput(inp.value, App.today);
      if (d) doDefer(f, d); else toast("Not a date I recognise — try 'fri', '+21' or '3 sep'.", "err");
    }
  });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Pick a date" }), inp));
  box.appendChild(preview);
  if (f.pushCount > 0)
    box.appendChild(h("div", { class:"note",
      text:"Already pushed " + f.pushCount + "× · originally due " + C.fmtDayYear(f.originalDue) +
           ". Deferring is never blocked, only counted." }));
  openPopover(anchor, box);
}

function doDefer(f, to){
  if (!to) return;
  emit("followup.rescheduled", { followupId:f.id, from:f.dueDate, to:to });
  closeLayers("pop");
  render();
  var n = (App.st.followups[f.id] || {}).pushCount || 0;
  toast("Moved to " + C.fmtFull(to) + (n > 1 ? " · pushed " + n + "×" : ""));
}

function rowKeys(e, ctx){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key;
  if (ctx.followup){
    if (k === "d"){ e.preventDefault(); completeFollowup(ctx.followup, ctx.row); return; }
    if (k === "1" || k === "3" || k === "7"){ e.preventDefault(); doDefer(ctx.followup, C.deferBy(App.today, +k)); return; }
    if (k === "4"){ e.preventDefault(); doDefer(ctx.followup, C.deferBy(App.today, 14)); return; }
    if (k === "e"){ e.preventDefault(); deferPopover(ctx.row.querySelector(".acts .btn:last-child") || ctx.row, ctx.followup); return; }
  }
  if (k === "Enter" || k === " "){
    e.preventDefault();
    if (ctx.deal) openDeal(ctx.deal.id); else if (ctx.followup) openSubject(ctx.followup);
  }
  if (k === "l" && ctx.deal){ e.preventDefault(); logPopover(ctx.row, ctx.deal); }
}

   The log saves immediately. The prompt follows; it never blocks.
