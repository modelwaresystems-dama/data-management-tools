<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelware Partner Pack Builder</title>
<style>
:root{
  --ink:#12212b; --ink-2:#3d5361; --line:#d8e2e8; --line-2:#eef3f6;
  --bg:#f4f7f9; --panel:#ffffff; --accent:#0f6d8c; --accent-2:#0b566f;
  --warm:#c2571f; --good:#1c7a54; --warn:#a8730c;
  --shadow:0 1px 2px rgba(18,33,43,.06),0 6px 20px rgba(18,33,43,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Segoe UI",Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
header.app{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
header.app .brand{font-weight:700;letter-spacing:.2px;font-size:15px}
header.app .sub{font-size:12px;opacity:.72}
header.app .spacer{flex:1}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid transparent;border-radius:6px;padding:8px 14px;cursor:pointer;background:var(--accent);color:#fff}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.light{background:#fff;color:var(--accent);border-color:var(--line)}
.btn.light:hover{background:var(--line-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.layout{display:grid;grid-template-columns:minmax(340px,420px) 1fr;gap:0;height:calc(100vh - 53px)}
.pane{overflow:auto;padding:18px 20px 60px}
.pane.left{border-right:1px solid var(--line);background:var(--panel)}
.pane.right{background:var(--bg)}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h2.sec:first-child{margin-top:4px}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.field .hint{font-size:11px;font-weight:400;color:#7c8f9a}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(15,109,140,.28);border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.models{display:grid;gap:8px}
.model-opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:7px;padding:10px;cursor:pointer;background:#fff}
.model-opt:hover{border-color:var(--accent)}
.model-opt.on{border-color:var(--accent);background:#f0f8fb;box-shadow:inset 0 0 0 1px var(--accent)}
.model-opt input{margin-top:3px}
.model-opt>span{display:block}
.model-opt .t{display:block;font-weight:700;font-size:13px}
.model-opt .d{display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--line-2);border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:11.5px;display:flex;align-items:center;gap:6px}
.chip button{border:0;background:none;cursor:pointer;color:var(--ink-2);font-size:13px;line-height:1;padding:0}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding-top:2px;z-index:5}
.tab{font:inherit;font-size:12.5px;font-weight:600;border:1px solid transparent;border-bottom:0;background:none;color:var(--ink-2);padding:8px 12px;border-radius:6px 6px 0 0;cursor:pointer}
.tab:hover{color:var(--accent)}
.tab.on{background:var(--panel);border-color:var(--line);color:var(--ink)}
.doc{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:44px 52px;max-width:860px;margin:0 auto 24px}
.doc h1{font-size:19px;margin:0 0 4px;letter-spacing:.2px}
.doc .docmeta{font-size:11.5px;color:#7c8f9a;margin-bottom:22px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.doc h2{font-size:14px;margin:22px 0 7px;color:var(--ink)}
.doc h3{font-size:12.5px;margin:16px 0 5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.doc p{margin:0 0 9px;text-align:justify}
.doc ul,.doc ol{margin:0 0 10px;padding-left:22px}
.doc li{margin-bottom:5px}
.doc table{border-collapse:collapse;width:100%;margin:6px 0 14px;font-size:12.5px}
.doc th,.doc td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.doc th{background:var(--line-2);font-weight:700}
.doc .note{background:#fff8e8;border-left:3px solid var(--warn);padding:9px 12px;font-size:12px;margin:0 0 16px;color:#5c4708}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:26px}
.doc .sigbox{border-top:1px solid var(--ink);padding-top:6px;font-size:12px;margin-top:44px}
.sheetwrap{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:auto;margin-bottom:24px}
table.sheet{border-collapse:collapse;font-size:12px;width:100%}
table.sheet th,table.sheet td{border:1px solid var(--line);padding:5px 8px;white-space:nowrap}
table.sheet th{background:var(--ink);color:#fff;font-weight:600;text-align:left;position:sticky;top:0}
table.sheet td.num{text-align:right;font-variant-numeric:tabular-nums}
table.sheet tr.grp td{background:var(--line-2);font-weight:700}
.sheettitle{font-size:13px;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:#fbfdfe}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--line-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.hard{background:#fdeceb;color:#9c2a20;border-color:#f3c9c5}
.pill.soft{background:#eaf6f1;color:var(--good);border-color:#c4e5d7}
.msg{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:7px;font-size:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;z-index:60;max-width:380px}
.msg.on{opacity:1;transform:none}
.msg.err{background:#8e2a20}
.disclaimer{background:#fff8e8;border:1px solid #f0dfb4;border-radius:7px;padding:10px 12px;font-size:11.5px;color:#5c4708;margin-bottom:14px}
.exportgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
details.adv{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:11px;background:#fbfdfe}
details.adv summary{font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer}
details.adv .body{padding-top:9px}
.tierrow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
@media (max-width:960px){.layout{grid-template-columns:1fr;height:auto}.pane{height:auto}.doc{padding:26px 22px}}
@media print{header.app,.pane.left,.tabs,.bar{display:none}.layout{display:block;height:auto}.doc{box-shadow:none;border:0;page-break-after:always}}
</style>
</head>
<body>
<header class="app">
  <div>
    <div class="brand">Modelware Partner Pack Builder</div>
    <div class="sub">Partnership agreements &amp; partner account workbook &mdash; offline, single file</div>
  </div>
  <div class="spacer"></div>
  <button class="btn ghost sm" id="btnLoadDemo">Load example</button>
  <button class="btn ghost sm" id="btnSaveJson">Save data</button>
  <button class="btn ghost sm" id="btnLoadJson">Open data</button>
  <button class="btn" id="btnExportAll">Export full pack (.zip)</button>
</header>
<div class="layout">
  <div class="pane left" id="form"></div>
  <div class="pane right">
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
</div>
<div class="msg" id="msg"></div>
<input type="file" id="fileIn" accept="application/json" style="display:none">
<script>
"use strict";
/* ============================================================================
   MODELWARE PARTNER PACK BUILDER
   Single-file, fully offline. No external libraries, no network, no storage.
   Generates: partner account workbook (.xlsx), contract set (.docx + .pdf),
   and a combined .zip pack.
   ========================================================================= */

/* ---------------------------------------------------------------- constants */
var FRANCHISOR_DEFAULT = {
  legalName: "Modelware Systems (Pty) Ltd",
  regNo: "",
  vatNo: "",
  address: "Cape Town, Western Cape, South Africa",
  repName: "Howard Diesel",
  repRole: "Managing Director",
  email: "howard@modelwaresystems.com",
  brand: "Modelware Systems"
};

var GOVERNING_LAW = {
  law: "the laws of the Republic of South Africa",
  courts: "the High Court of South Africa, Western Cape Division, Cape Town",
  arbitration: "the Arbitration Foundation of Southern Africa (AFSA)",
  seat: "Cape Town, South Africa",
  dataAct: "the Protection of Personal Information Act 4 of 2013 (POPIA)"
};

var MODELS = {
  ADP: {
    key: "ADP",
    name: "Authorised Delivery Partner",
    short: "Authorised Delivery Partner",
    agreementTitle: "Authorised Delivery Partner Agreement",
    blurb: "Strict brand alignment, centralised content IP, DAMA REP compliance. Entry tier.",
    defaults: { royaltyPct: 25, marketingPct: 2, initialFee: 15000, exclusivity: "Non-exclusive", termYears: 2, renewYears: 2, minAnnualRoyalty: 6000 },
    flags: { subLicence: false, ownContent: false, exclusiveDefault: false, operationsManual: true, territoryRights: true, masterOverride: false, requiresCertifiedTrainer: true }
  },
  FRANCHISE: {
    key: "FRANCHISE",
    name: "Independent Franchise",
    short: "Independent Franchise",
    agreementTitle: "Franchise Partner Agreement",
    blurb: "High autonomy, exclusive territory, full business-format franchise with local scaling rights.",
    defaults: { royaltyPct: 20, marketingPct: 3, initialFee: 45000, exclusivity: "Exclusive", termYears: 3, renewYears: 3, minAnnualRoyalty: 18000 },
    flags: { subLicence: false, ownContent: false, exclusiveDefault: true, operationsManual: true, territoryRights: true, masterOverride: false, requiresCertifiedTrainer: true }
  },
  MASTER: {
    key: "MASTER",
    name: "Master Franchise",
    short: "Master Franchise",
    agreementTitle: "Master Franchise Agreement",
    blurb: "Regional sub-licensing rights, sub-franchisor obligations, override royalty on the sub-network.",
    defaults: { royaltyPct: 15, marketingPct: 2, initialFee: 120000, exclusivity: "Exclusive", termYears: 5, renewYears: 5, minAnnualRoyalty: 45000 },
    flags: { subLicence: true, ownContent: false, exclusiveDefault: true, operationsManual: true, territoryRights: true, masterOverride: true, requiresCertifiedTrainer: true }
  },
  LICENCE: {
    key: "LICENCE",
    name: "IP Licensing Only",
    short: "IP Licence",
    agreementTitle: "Intellectual Property and Courseware Licence Agreement",
    blurb: "Courseware and trademark licence for price-sensitive markets. No business-format franchise.",
    defaults: { royaltyPct: 12, marketingPct: 0, initialFee: 6000, exclusivity: "Non-exclusive", termYears: 2, renewYears: 1, minAnnualRoyalty: 2500 },
    flags: { subLicence: false, ownContent: true, exclusiveDefault: false, operationsManual: false, territoryRights: false, masterOverride: false, requiresCertifiedTrainer: true }
  }
};

var CURRENCIES = ["USD","EUR","GBP","ZAR","AED","SAR","AUD","CAD","SGD","INR","NGN","KES","GHS","BWP","NAD"];

var LIFECYCLE_STAGES = [
  ["1. Partner Selection & Qualification","Vet for strategic fit, domain expertise, ethical alignment and territorial capability."],
  ["2. Onboarding & Training","Formalise the agreement; certify trainers, provision systems, issue playbooks and brand guidelines."],
  ["3. Go-to-Market Launch","Marketing toolkit, co-marketing, lead generation and assisted first deliveries."],
  ["4. Ongoing Operations & Quality","Standards, audits, KPIs, content updates, central support and partner community."],
  ["5. Growth & Maturity","New offerings, territory expansion, performance incentives, advanced capability."],
  ["6. Renewal or Exit","Term-end review: renew, rescope, remediate or execute an orderly exit."]
];

var GATES = [
  { key:"PRE",  label:"Pre-Signing (Due Diligence)",        day:0,   type:"Hard",
    obj:"Confirm strategic fit and credibility — mission alignment, domain expertise, values compliance.",
    ev:"Due diligence pack: business plan, trainer qualifications, references, financial standing." },
  { key:"D30",  label:"30-Day Post-Signing Check",          day:30,  type:"Soft",
    obj:"Confirm onboarding is on track: team training underway, systems provisioned, roadblocks cleared.",
    ev:"Training completion %, LMS/CRM login activity, partner feedback on onboarding." },
  { key:"D90",  label:"90-Day Check (Launch & First Sale)", day:90,  type:"Soft",
    obj:"Verify market-launch readiness and, ideally, first revenue achieved.",
    ev:"Launch plan executed, marketing live, first course or client project booked or delivered." },
  { key:"D180", label:"6-Month Operational & Quality Check",day:182, type:"Soft",
    obj:"Assess ongoing viability, consistent operations and adherence to quality standards.",
    ev:"Delivery volume, satisfaction scores, quality audit result, compliance record." },
  { key:"D365", label:"12-Month Year-1 Review",             day:365, type:"Hard",
    obj:"Determine financial and operational viability after one year; approach to break-even.",
    ev:"Year-1 revenue vs plan, royalties paid, KPI scorecard, profitability trajectory." },
  { key:"TERM", label:"Contract Renewal Review",            day:null,type:"Hard",
    obj:"Decide renewal, rescope, probation or structured exit at end of term.",
    ev:"Full-term performance vs targets, cumulative revenue, quality record, compliance history." }
];

var KPI_SETS = [
  ["Selection & Qualification", [
    ["Partner approval rate vs pipeline","%",null],
    ["Time to qualify and sign partner","days",90],
    ["Certification readiness (trainers meeting standard)","%",100],
    ["Territory coverage fit","score /5",4]
  ]],
  ["Onboarding & Training", [
    ["Onboarding completion rate","%",100],
    ["Time to launch readiness","days",60],
    ["Trainer certification pass rate","%",100],
    ["Systems go-live success (LMS, CRM, tools)","%",100]
  ]],
  ["Go-to-Market Launch", [
    ["Time to first course or project delivered","days",90],
    ["Lead-to-client conversion rate","%",20],
    ["Initial enrolments / project bookings","count",20],
    ["Launch customer satisfaction score","score /5",4.5]
  ]],
  ["Ongoing Operations & Quality", [
    ["Average customer satisfaction / NPS","score /5",4.5],
    ["Quality audit pass rate","%",100],
    ["Compliance incidents","count",0],
    ["Course / project delivery volume","count/yr",null],
    ["SLA adherence for support requests","%",95]
  ]],
  ["Growth & Maturity", [
    ["Revenue growth year on year","%",20],
    ["Average revenue per partner","currency",null],
    ["Portfolio expansion (new offerings launched)","count",2],
    ["Repeat client rate","%",40],
    ["Partner net margin","%",20]
  ]],
  ["Renewal or Exit", [
    ["Contract renewal rate","%",95],
    ["Performance vs agreed targets at term end","%",100],
    ["Remediation success rate","%",80],
    ["Orderly exit completion (no client or brand impact)","yes/no",null]
  ]],
  ["Commercial & Risk", [
    ["Royalty collection rate (on time)","%",99],
    ["Partner payback period","months",18],
    ["Days of cash on hand","days",30],
    ["Partner retention rate","%",95]
  ]]
];

/* -------------------------------------------------------------- data model */
function todayISO(){ var d=new Date(); return d.toISOString().slice(0,10); }
function addDays(iso,n){ var d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function addYears(iso,n){ var d=new Date(iso+"T00:00:00Z"); d.setUTCFullYear(d.getUTCFullYear()+n); return d.toISOString().slice(0,10); }

function blankModel(){
  var m = MODELS.ADP;
  return {
    ref: "MWS-PP-" + new Date().getFullYear() + "-001",
    modelKey: "ADP",
    franchisor: JSON.parse(JSON.stringify(FRANCHISOR_DEFAULT)),
    partner: { legalName:"", tradingName:"", regNo:"", vatNo:"", countryOfIncorporation:"",
               address:"", repName:"", repRole:"", email:"", phone:"", website:"" },
    territory: { countries:[], description:"", exclusivity:m.defaults.exclusivity,
                 subLicence:false, channels:"Public training, in-house corporate training, advisory services" },
    term: { agreementDate: todayISO(), commencementDate: todayISO(),
            termYears: m.defaults.termYears, renewYears: m.defaults.renewYears,
            renewalNoticeMonths: 6, terminationNoticeMonths: 3, cureDays: 30 },
    commercial: { currency:"USD", initialFee:m.defaults.initialFee, initialFeeInstalments:1,
                  royaltyPct:m.defaults.royaltyPct, marketingPct:m.defaults.marketingPct,
                  minAnnualRoyalty:m.defaults.minAnnualRoyalty, overridePct:5,
                  reportFrequency:"Quarterly", reportingDays:15, paymentDays:30, latePct:2,
                  tiers:[{from:250000,pct:Math.max(5,m.defaults.royaltyPct-3)},{from:500000,pct:Math.max(5,m.defaults.royaltyPct-5)}] },
    quality: { minSatisfaction:4.5, auditsPerYear:2, minCertifiedTrainers:1,
               certification:"CDMP Master level (or equivalent) for at least one nominated trainer",
               responseSLAHours:24, contentUpdateDays:30 },
    targets: { year1Revenue:180000, year1Courses:8, year1Delegates:120, ttfsDays:90,
               breakEvenMonths:15, year2Growth:25 },
    ops: { lms:"Modelware LMS instance", crm:"Modelware CRM (partner tenant)",
           playbook:"Partner Operations Manual v1", onboardingWeeks:8 },
    notes: ""
  };
}
var D = blankModel();
</script>
<script>
"use strict";
/* ------------------------------------------------------------- formatters */
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function dt(iso){ if(!iso) return "[date]"; var p=iso.split("-"); return parseInt(p[2],10)+" "+MONTHS[parseInt(p[1],10)-1]+" "+p[0]; }
function num(n,dp){ if(n===null||n===undefined||n==="") return "0"; dp=dp===undefined?0:dp;
  return Number(n).toFixed(dp).replace(/\B(?=(\d{3})+(?!\d))/g,","); }
function money(cur,n,dp){ return cur+" "+num(n,dp===undefined?0:dp); }
function pct(n){ return (Math.round(Number(n)*100)/100)+"%"; }
function words(n){ var w=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
  return (n>=0&&n<=12)?w[n]:String(n); }
function esc(s){ return String(s===null||s===undefined?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fb(v,ph){ return (v===null||v===undefined||String(v).trim()==="") ? ("["+ph+"]") : String(v).trim(); }
function territoryText(d){
  var c=d.territory.countries.slice();
  if(d.territory.description && d.territory.description.trim()) {
    return d.territory.description.trim() + (c.length?" ("+c.join(", ")+")":"");
  }
  if(!c.length) return "[Territory]";
  if(c.length===1) return c[0];
  return c.slice(0,-1).join(", ")+" and "+c[c.length-1];
}
function partyName(d){ return fb(d.partner.legalName,"Partner legal name"); }
function roleName(k){ return k==="LICENCE"?"Licensee":(k==="MASTER"?"Master Franchisee":(k==="FRANCHISE"?"Franchisee":"Partner")); }
function ourRole(k){ return k==="LICENCE"?"Licensor":(k==="ADP"?"Company":"Franchisor"); }
function gateDates(d){
  var out=[], start=d.term.commencementDate;
  GATES.forEach(function(g){
    var date = g.day===null ? addYears(start, Number(d.term.termYears)||2) : (g.day===0? d.term.agreementDate : addDays(start,g.day));
    out.push({key:g.key,label:g.label,type:g.type,obj:g.obj,ev:g.ev,date:date});
  });
  return out;
}
function effRoyaltyRows(d){
  var rows=[["Base royalty (all training and advisory revenue)", pct(d.commercial.royaltyPct)]];
  (d.commercial.tiers||[]).forEach(function(t){
    if(t.from) rows.push(["Annual Gross Revenue above "+money(d.commercial.currency,t.from), pct(t.pct)]);
  });
  return rows;
}

/* ------------------------------------------------------ document assembly */
function h1(x){return{t:"h1",x:x}} function h2(x){return{t:"h2",x:x}} function h3(x){return{t:"h3",x:x}}
function p(x){return{t:"p",x:x}} function note(x){return{t:"note",x:x}}
function ul(items){return{t:"ul",items:items}} function ol(items){return{t:"ol",items:items}}
function tbl(head,rows){return{t:"table",head:head,rows:rows}}
function pb(){return{t:"pb"}}
function sig(d){return{t:"sig",a:{party:d.franchisor.legalName,name:d.franchisor.repName,role:d.franchisor.repRole},
                          b:{party:partyName(d),name:d.partner.repName,role:d.partner.repRole}}}

var REVIEW_NOTE = "DRAFT FOR LEGAL REVIEW. This document is generated from a template and has not been settled by a qualified legal practitioner. It must be reviewed and adapted by counsel before signature, and checked against any mandatory local law in the Territory that applies irrespective of the chosen governing law.";

function buildDocs(d){
  var M = MODELS[d.modelKey], F=d.franchisor, P=d.partner, docs=[];
  var R = roleName(d.modelKey), O = ourRole(d.modelKey);
  var terr = territoryText(d);
  var cur = d.commercial.currency;
  var refBase = fb(d.ref,"REF");
  var g = gateDates(d);

  /* =========================================================== 1. AGREEMENT */
  var b=[];
  b.push(h1(M.agreementTitle.toUpperCase()));
  b.push(note(REVIEW_NOTE));
  b.push(p("This "+M.agreementTitle+" (the “Agreement”) is entered into on "+dt(d.term.agreementDate)+" between:"));
  b.push(tbl(["Party","Details"],[
    [O+" (“"+F.brand+"”)", F.legalName+(F.regNo?", registration number "+F.regNo:"")+", of "+F.address],
    [R, partyName(d)+(P.regNo?", registration number "+P.regNo:"")+", of "+fb(P.address,"Partner address")+
        (P.countryOfIncorporation?", incorporated in "+P.countryOfIncorporation:"")]
  ]));
  b.push(p("each a “Party” and together the “Parties”."));

  b.push(h2("1. Definitions and interpretation"));
  b.push(p("1.1 “Agreement Reference” means "+refBase+"."));
  b.push(p("1.2 “Brand” means the "+F.brand+" name, logos, trade marks, domain names, course titles and get-up owned or controlled by the "+O+"."));
  b.push(p("1.3 “Courseware” means all training curricula, slide decks, workbooks, exercises, assessments, facilitator guides, recordings and derivative learning materials made available by the "+O+" to the "+R+"."));
  b.push(p("1.4 “Gross Revenue” means all amounts invoiced by the "+R+" for Services in the Territory, net of value added tax or equivalent transaction taxes, and before deduction of any cost, discount, commission, bad debt or refund other than documented credit notes actually issued."));

    "The "+O+" maintains the international trade mark portfolio; the "+R+" will not oppose or challenge it during or after the Term."
  ]));
  docs.push({id:"SCH-C", code:"04", title:"Schedule C — Brand, IP and Marketing Standards", subtitle:refBase+" — "+partyName(d), blocks:b});

  /* ====================================================== SCHEDULE D */
  b=[];
  b.push(h1("SCHEDULE D — QUALITY STANDARDS, CERTIFICATION AND SUPPORT LEVELS"));
  b.push(p("This Schedule forms part of the "+M.agreementTitle+" bearing reference "+refBase+"."));
  b.push(h2("D1. Certification requirements"));
  b.push(tbl(["Requirement","Standard"],[
    ["Certified trainers", "Not fewer than "+d.quality.minCertifiedTrainers+" at all times"],
    ["Qualification", d.quality.certification],
    ["Train-the-trainer", "Every nominated trainer completes the "+F.brand+" train-the-trainer programme and passes an observed delivery assessment before delivering independently"],
    ["Mentoring", "Co-delivery or shadowing by a senior "+F.brand+" trainer until the assessment is passed"],
    ["Recertification", "Annual refresher and re-assessment; lapse suspends the right to deliver the affected course"],
    ["New courses", "A trainer may deliver a course only after certification on that specific course"]
  ]));
  b.push(h2("D2. Delivery standards"));
  b.push(ol([
    "Deliver to the published course structure, duration and learning outcomes, using current materials only.",
    "Maintain a minimum and maximum class size as published for each course; deviations require consent.",
    "Issue attendance and results records through "+fb(d.ops.lms,"the learning platform")+" so that the learner record is centrally held.",
    "Run the standard evaluation instrument after every delivery and load results within five (5) business days.",
    "Maintain an average satisfaction score of at least "+d.quality.minSatisfaction+" out of 5, measured over a rolling four-delivery window.",
    "Advisory engagements follow the "+F.brand+" methodology, with the standard deliverable templates and a documented quality review before client issue."
  ]));
  b.push(h2("D3. Quality assurance and audit"));
  b.push(tbl(["Activity","Frequency","Owner"],[
    ["Delivery observation by a senior trainer", String(d.quality.auditsPerYear)+" per year", O],
    ["Learner satisfaction review", "Every delivery", R],
    ["Advisory deliverable quality review", "Every engagement", R+", sampled by "+O],
    ["Compliance and brand audit", "Annually", O],
    ["Performance review meeting", d.commercial.reportFrequency, "Both Parties"]
  ]));
  b.push(p("D3.1 Where a score falls below the minimum, or an audit is failed, the "+O+" issues a written remediation plan. The "+R+" implements it within thirty (30) (or, for a serious finding, fourteen (14)) days. Persistent failure is dealt with under clause 11 of the Agreement."));
  b.push(h2("D4. Support levels provided by the "+O));
  b.push(tbl(["Request type","Response","Resolution target"],[
    ["Platform outage affecting a live delivery","1 hour","Same business day"],
    ["General partner support request", d.quality.responseSLAHours+" hours","5 business days"],
    ["Content query or correction","2 business days","Next content release"],
    ["Proposal or bid support","2 business days","By agreed bid date"],
    ["Escalation to senior management","2 business days","10 business days"]
  ]));
  b.push(h2("D5. Partner community"));
  b.push(p("D5.1 The "+O+" convenes a partner forum at least "+d.commercial.reportFrequency.toLowerCase()+" for shared practice, roadmap preview and issue escalation, and maintains a partner knowledge base."));
  b.push(p("D5.2 The "+R+" nominates a single accountable relationship owner and keeps that nomination current."));
  docs.push({id:"SCH-D", code:"05", title:"Schedule D — Quality, Certification and Support", subtitle:refBase+" — "+partyName(d), blocks:b});

  /* ====================================================== SCHEDULE E */
  b=[];
  b.push(h1("SCHEDULE E — PERFORMANCE TARGETS AND LIFECYCLE GATES"));
  b.push(p("This Schedule forms part of the "+M.agreementTitle+" bearing reference "+refBase+"."));
  b.push(h2("E1. Year 1 minimum performance"));
  b.push(tbl(["Measure","Target"],[
    ["Gross Revenue, year 1", money(cur,d.targets.year1Revenue)],
    ["Courses delivered, year 1", String(d.targets.year1Courses)],
    ["Delegates trained, year 1", String(d.targets.year1Delegates)],
    ["Time to first sale, from onboarding completion", d.targets.ttfsDays+" days"],
    ["Expected break-even", d.targets.breakEvenMonths+" months from commencement"],
    ["Year 2 revenue growth", pct(d.targets.year2Growth)],
    ["Minimum satisfaction", d.quality.minSatisfaction+" / 5"],
    ["Compliance incidents", "Zero"]
  ]));
  b.push(h2("E2. Time-based review checkpoints"));
  b.push(p("Each checkpoint reviews evidence and produces a documented decision. Soft gates allow remediation; hard gates require a go / no-go decision."));
  var gr = g.map(function(x){ return [x.label, x.type+" gate", dt(x.date), x.obj]; });
  b.push(tbl(["Checkpoint","Gate","Scheduled","Objective"], gr));
  b.push(h2("E3. Evidence required at each checkpoint"));
  b.push(tbl(["Checkpoint","Evidence"], g.map(function(x){return [x.label, x.ev];})));
  b.push(h2("E4. Performance-triggered milestones"));
  b.push(tbl(["Milestone","Trigger","Gate","Decision"],[
    ["Operational readiness","Staff certified, systems live, launch plan approved — target within 60 days of signature","Soft","Confirm launch or extend onboarding with support"],
    ["First revenue","First paying engagement secured — target within "+d.targets.ttfsDays+" days","Soft","Confirm market fit or apply sales support"],
    ["Quality checkpoint","2–3 engagements delivered and evaluated","Soft","Confirm standards or issue remediation plan"],
    ["Sustained profitability","Break-even reached — expected by "+d.targets.breakEvenMonths+" months","Soft / Hard","Confirm viability or restructure territory and support"],
    ["Term performance review","Annual or at renewal","Hard","Renew, rescope, place on probation, or exit"]
  ]));
  b.push(h2("E5. Consequences"));
  b.push(ol([
    "Soft gate not met: written remediation plan, additional "+O+" support, and re-review within ninety (90) days.",
    "Hard gate not met: formal notice, ninety (90) day remediation period, and a documented go / no-go decision at the end of it.",
    "Two consecutive missed thresholds: conversion to non-exclusive status, Territory reduction, or opening of a segment to another partner.",
    "Material breach of quality or compliance: dealt with under clause 11 of the Agreement, without the need for a gate.",
    "Sustained over-performance: eligibility for royalty band reduction, Territory expansion, new service lines and co-funded campaigns."
  ]));
  b.push(h2("E6. KPI scorecard"));
  b.push(p("The full KPI scorecard is maintained in the partner account workbook issued with this Agreement and is reviewed at each checkpoint. The headline measures are:"));
  b.push(tbl(["Dimension","Headline KPI","Target"],[
    ["Growth","Gross Revenue vs plan", money(cur,d.targets.year1Revenue)+" year 1, +"+pct(d.targets.year2Growth)+" year 2"],
    ["Quality","Average satisfaction", d.quality.minSatisfaction+" / 5"],
    ["Delivery","Courses and delegates", d.targets.year1Courses+" courses, "+d.targets.year1Delegates+" delegates"],
    ["Speed","Time to first sale", d.targets.ttfsDays+" days"],
    ["Commercial discipline","Royalty collection on time","99%"],
    ["Compliance","Incidents","Zero"],
    ["Viability","Payback period", d.targets.breakEvenMonths+" months"]
  ]));
  docs.push({id:"SCH-E", code:"06", title:"Schedule E — Performance Targets and Lifecycle Gates", subtitle:refBase+" — "+partyName(d), blocks:b});

  /* ====================================================== NDA */
  b=[];
  b.push(h1("MUTUAL NON-DISCLOSURE AGREEMENT"));
  b.push(note(REVIEW_NOTE));
  b.push(p("This Mutual Non-Disclosure Agreement is entered into on "+dt(d.term.agreementDate)+" between "+F.legalName+" of "+F.address+" and "+partyName(d)+" of "+fb(P.address,"Partner address")+" (each a “Party”)."));
  b.push(h2("1. Purpose"));
  b.push(p("1.1 The Parties wish to exchange confidential information in connection with the evaluation, negotiation and performance of a "+M.name+" relationship for "+terr+" (the “Purpose”)."));
  b.push(h2("2. Confidential Information"));
  b.push(p("2.1 “Confidential Information” means any information disclosed by one Party (“Discloser”) to the other (“Recipient”), in any form, that is marked confidential or that a reasonable person would understand to be confidential, including courseware, methodologies, pricing, financial models, partner and client lists, learner data, business plans, roadmaps and the terms of any agreement between the Parties."));
  b.push(p("2.2 Confidential Information does not include information that: (a) is or becomes public without breach of this Agreement; (b) the Recipient held free of restriction before disclosure; (c) is lawfully received from a third party without restriction; or (d) the Recipient independently develops without use of the Confidential Information."));
  b.push(h2("3. Obligations"));
  b.push(ol([
    "Use the Confidential Information solely for the Purpose.",
    "Keep it secret using at least the care it applies to its own confidential information, and never less than reasonable care.",
    "Disclose it only to personnel and professional advisers who need it for the Purpose and who are bound by equivalent obligations, remaining responsible for their compliance.",
    "Not copy, reverse engineer, or derive competing materials from it.",
    "Notify the Discloser promptly on becoming aware of any unauthorised disclosure and cooperate in limiting the consequences."

  b.push(h2("4. Compelled disclosure"));
  b.push(p("4.1 The Recipient may disclose Confidential Information to the extent required by law, regulation or court order, provided it gives the Discloser prompt written notice where lawful, and discloses only the minimum required."));
  b.push(h2("5. No licence, no obligation"));
  b.push(p("5.1 All Confidential Information remains the property of the Discloser. No licence, assignment or other right is granted except the limited right to use it for the Purpose. Neither Party is obliged to disclose anything, or to proceed to any transaction."));
  b.push(h2("6. Personal information"));
  b.push(p("6.1 Where Confidential Information includes personal information, the Recipient processes it only for the Purpose, applies appropriate security safeguards, and complies with "+GOVERNING_LAW.dataAct+" and any applicable data protection law in the Territory."));
  b.push(h2("7. Duration and return"));
  b.push(p("7.1 This Agreement applies to disclosures made in the two (2) years from the date above, and the obligations in clause 3 continue for five (5) years from the date of each disclosure. Obligations relating to trade secrets and to personal information continue for as long as the law protects them."));
  b.push(p("7.2 On written request, or on the end of any partnership relationship between the Parties, the Recipient returns or irretrievably destroys all Confidential Information and certifies that it has done so, save for one archival copy retained for legal compliance and for copies held in routine backups that are not readily accessible."));
  b.push(h2("8. Remedies"));
  b.push(p("8.1 The Parties acknowledge that damages alone may not be an adequate remedy for breach, and that the Discloser is entitled to seek urgent interim relief in addition to any other remedy."));
  b.push(h2("9. General"));
  b.push(p("9.1 This Agreement is governed by "+GOVERNING_LAW.law+", and clause 13 of the "+M.agreementTitle+" (dispute resolution) applies to it as if set out in full."));
  b.push(p("9.2 It may be signed in counterparts and by electronic signature. No amendment is effective unless in writing and signed by both Parties."));
  b.push(sig(d));
  docs.push({id:"NDA", code:"07", title:"Mutual Non-Disclosure Agreement", subtitle:refBase+" — "+partyName(d), blocks:b});

  /* ====================================================== DPA / AI ETHICS */
  b=[];
  b.push(h1("DATA PROTECTION AND AI ETHICS ADDENDUM"));
  b.push(note(REVIEW_NOTE+" Where the Territory is subject to the GDPR, the UK GDPR, the Saudi PDPL, the UAE PDPL, the Nigerian NDPA or a comparable regime, a jurisdiction-specific data processing agreement and transfer mechanism will usually be required in addition to this Addendum."));
  b.push(p("This Addendum forms part of the "+M.agreementTitle+" bearing reference "+refBase+" between "+F.legalName+" and "+partyName(d)+"."));
  b.push(h2("1. Roles"));
  b.push(p("1.1 In respect of learner records, enrolment data, assessment results and certification data held in "+fb(d.ops.lms,"the learning platform")+", the "+O+" is the responsible party (controller) and the "+R+" is the operator (processor) acting on documented instructions."));
  b.push(p("1.2 In respect of the "+R+"'s own client relationships, prospect lists and employees, the "+R+" is the responsible party in its own right and is solely accountable for that processing."));
  b.push(h2("2. Compliance"));
  b.push(ol([
    "Each Party complies with "+GOVERNING_LAW.dataAct+" and with every data protection law applicable in the Territory, whichever imposes the higher standard.",
    "The "+R+" collects only the personal information needed for the Services, retains it only as long as required, and does not use learner data for its own marketing without a lawful basis and a clear opt-out.",
    "The "+R+" implements appropriate technical and organisational security measures, including access control, encryption in transit, device security and staff confidentiality undertakings.",
    "The "+R+" does not transfer personal information across borders except as needed to use the "+O+"'s platforms, or where a lawful transfer mechanism is in place.",
    "The "+R+" assists the "+O+" with data subject requests within five (5) business days and does not respond directly on the "+O+"'s behalf.",
    "The "+R+" notifies the "+O+" of any security compromise affecting learner or client personal information without undue delay and in any event within twenty-four (24) hours of becoming aware of it.",
    "The "+R+" engages a sub-processor only with the "+O+"'s prior written consent and on terms no less protective than this Addendum."
  ]));
  b.push(h2("3. AI ethics standards"));
  b.push(p("3.1 The "+R+" may use artificial intelligence tools to support preparation, marketing and delivery of the Services, subject to the following standards, which reflect the "+F.brand+" position on responsible AI:"));
  b.push(ol([
    "No client, learner or employee personal information, and no client confidential material, may be entered into a public or consumer AI service.",
    "AI-generated content used with clients or learners is reviewed by a competent human before use, and the reviewer remains accountable for its accuracy.",
    "Material AI assistance in producing a client deliverable is disclosed to the client on request, and always where the client's own policy requires it.",
    "Accredited or examinable course content may not be regenerated or paraphrased by an AI tool; only the controlled source of truth may be delivered.",
    "The "+R+" does not present AI output as independent expert opinion, and does not use AI to generate testimonials, case studies, credentials or evaluation results.",
    "Where the "+R+" advises clients on AI governance, it applies the "+F.brand+" methodology and discloses any conflict of interest arising from tools it resells.",
    "The "+R+" keeps a record of AI tools used in delivery and makes it available at the annual compliance audit."
  ]));
  b.push(h2("4. Records and audit"));
  b.push(p("4.1 The "+R+" maintains a record of processing activities relating to the Services and makes it available to the "+O+" on reasonable request, and to a regulator where required by law."));
  b.push(p("4.2 The "+O+" may audit compliance with this Addendum once per year, as part of the compliance audit in Schedule D."));
  b.push(h2("5. End of relationship"));
  b.push(p("5.1 On termination of the Agreement, the "+R+" returns or deletes all personal information processed on the "+O+"'s behalf, subject to any retention required by law, and certifies deletion within thirty (30) days."));
  b.push(sig(d));
  docs.push({id:"DPA", code:"08", title:"Data Protection and AI Ethics Addendum", subtitle:refBase+" — "+partyName(d), blocks:b});

  return docs;
}

    local.push(lh);

  });

    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
    '<sheets>'+wbSheets+'</sheets><calcPr calcId="0" fullCalcOnLoad="1"/></workbook>';
  var wbr='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+wbRels+
    '<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  var files=[{name:"[Content_Types].xml",data:u8(ct)},{name:"_rels/.rels",data:u8(rels)},
             {name:"xl/workbook.xml",data:u8(wb)},{name:"xl/_rels/workbook.xml.rels",data:u8(wbr)},
             {name:"xl/styles.xml",data:u8(XL_STYLES)}];
  sheets.forEach(function(s,i){ files.push({name:"xl/worksheets/sheet"+(i+1)+".xml",data:u8(sheetXml(s))}); });
  return zipMake(files);
}

<script>
"use strict";
/* ================================================= PARTNER ACCOUNT WORKBOOK */
function buildWorkbook(d){
  var M=MODELS[d.modelKey], cur=d.commercial.currency, g=gateDates(d), sheets=[];
  var expiry=addYears(d.term.commencementDate,Number(d.term.termYears));

  /* ---- 1. Agreement Summary ---- */
  var r=[];
  r.push([TT("Partner Account Summary")]);
  r.push([{t:"s",v:fb(d.partner.legalName,"Partner legal name")+"  —  "+M.name,s:10}]);
  r.push([]);
  function kv(k,v,st){ r.push([G(k),{t:(st===undefined?"s":"s"),v:v,s:7}]); }
  function kvc(k,cell){ r.push([G(k),cell]); }
  kv("Agreement reference", fb(d.ref,"ref"));
  kv("Operating model", M.name);
  kv("Agreement title", M.agreementTitle);
  kv("Governing law", "Republic of South Africa");
  kv("Dispute forum", GOVERNING_LAW.arbitration+", seated in "+GOVERNING_LAW.seat);
  kvc("Agreement date", DT(d.term.agreementDate));
  kvc("Commencement date", DT(d.term.commencementDate));
  kvc("Expiry date", DT(expiry));
  kv("Initial term (years)", String(d.term.termYears));
  kv("Renewal notice (months)", String(d.term.renewalNoticeMonths));
  kv("Territory", territoryText(d));
  kv("Exclusivity", d.territory.exclusivity);
  kv("Sub-licensing", M.flags.subLicence?"Permitted, subject to approval":"Not permitted");
  kv("Authorised channels", d.territory.channels);
  r.push([]);
  r.push([G("Documents issued with this workbook")]);
  buildDocs(d).forEach(function(doc){ r.push([S(doc.code,7),S(doc.title,7)]); });
  r.push([]);
  r.push([{t:"s",v:"Generated by the Modelware Partner Pack Builder. Contract drafts require review by a qualified legal practitioner before signature.",s:10}]);
  sheets.push({name:"Agreement Summary", cols:[34,62], rows:r});

  /* ---- 2. Partner Register ---- */
  var hdr=["Partner Ref","Legal Name","Trading Name","Registration No","VAT/Tax No","Country of Incorporation",
    "Registered Address","Territory","Countries","Operating Model","Exclusivity","Sub-licensing","Channels",
    "Lifecycle Stage","Status","Agreement Date","Commencement","Term (yrs)","Expiry","Renewal Notice (mo)",
    "Contact Name","Contact Role","Email","Phone","Website","Certified Trainers","Certification Standard",
    "LMS Instance","CRM Tenant","Operations Playbook","Onboarding (weeks)","Currency","Initial Fee",
    "Base Royalty %","Marketing %","Min Annual Royalty","Next Gate","Next Gate Date","Relationship Owner","Notes"];
  var reg=[];
  reg.push([TT("Partner Account & Inventory Register")]);
  reg.push([{t:"s",v:"One row per partner. Copy the row format when adding partners; the register is the master inventory of partner accounts.",s:10}]);
  reg.push([]);
  reg.push(hdr.map(function(h){ return H(h); }));
  var nextGate = g.filter(function(x){ return x.key!=="PRE"; })[0];
  reg.push([
    S(fb(d.ref,"ref")), S(fb(d.partner.legalName,"legal name")), S(d.partner.tradingName), S(d.partner.regNo),
    S(d.partner.vatNo), S(d.partner.countryOfIncorporation), S(d.partner.address), S(territoryText(d)),
    S(d.territory.countries.join(", ")), S(M.name), S(d.territory.exclusivity),
    S(M.flags.subLicence?"Permitted":"Not permitted"), S(d.territory.channels),
    S("2. Onboarding & Training"), S("Contracting"),
    DT(d.term.agreementDate), DT(d.term.commencementDate), N(d.term.termYears,9), DT(expiry),
    N(d.term.renewalNoticeMonths,9),
    S(d.partner.repName), S(d.partner.repRole), S(d.partner.email), S(d.partner.phone), S(d.partner.website),
    N(d.quality.minCertifiedTrainers,9), S(d.quality.certification), S(d.ops.lms), S(d.ops.crm), S(d.ops.playbook),
    N(d.ops.onboardingWeeks,9), S(cur), N(d.commercial.initialFee,4),
    N(Number(d.commercial.royaltyPct)/100,5), N(Number(d.commercial.marketingPct)/100,5),
    N(d.commercial.minAnnualRoyalty,4), S(nextGate?nextGate.label:""), DT(nextGate?nextGate.date:null),
    S(d.franchisor.repName), S(d.notes)
  ]);
  reg.push([]);
  reg.push([G("Lifecycle stage reference")]);
  LIFECYCLE_STAGES.forEach(function(s){ reg.push([S(s[0],7),S(s[1],7)]); });
  sheets.push({name:"Partner Register", cols:hdr.map(function(h,i){ return i===6||i===12||i===26?38:(h.length<10?12:Math.min(26,h.length+6)); }), rows:reg, rowHeights:{3:30}});

  /* ---- 3. Commercial Model ---- */
  var c=[], row=0; function put(cells){ c.push(cells); row++; return row; }
  put([TT("Commercial Model & Royalty Calculator")]);                       /* 1 */
  put([{t:"s",v:fb(d.partner.legalName,"Partner")+"  —  "+M.name+"  —  all amounts in "+cur,s:10}]); /* 2 */
  put([]);                                                                  /* 3 */
  var rAssump=put([G("Assumptions"),G("Value"),G(""),G("")]);               /* 4 */
  var rCur   =put([S("Currency",7), S(cur,7)]);
  var rFee   =put([S("Initial fee",7), N(d.commercial.initialFee,4)]);
  var rBase  =put([S("Base royalty rate",7), N(Number(d.commercial.royaltyPct)/100,5)]);
  var t1=(d.commercial.tiers[0]||{from:0,pct:d.commercial.royaltyPct});
  var t2=(d.commercial.tiers[1]||{from:0,pct:d.commercial.royaltyPct});
  var rT1a  =put([S("Tier 1 revenue threshold",7), N(t1.from,4)]);
  var rT1b  =put([S("Tier 1 royalty rate",7), N(Number(t1.pct)/100,5)]);
  var rT2a  =put([S("Tier 2 revenue threshold",7), N(t2.from,4)]);
  var rT2b  =put([S("Tier 2 royalty rate",7), N(Number(t2.pct)/100,5)]);
  var rMkt  =put([S("Marketing contribution",7), N(Number(d.commercial.marketingPct)/100,5)]);
  var rMin  =put([S("Minimum annual royalty (from year 2)",7), N(d.commercial.minAnnualRoyalty,4)]);
  var rGM   =put([S("Partner delivery gross margin",7), N(0.55,5)]);
  var rFix  =put([S("Partner annual fixed operating cost",7), N(Math.round(Number(d.targets.year1Revenue)*0.28),4)]);
  var rGrow =put([S("Year-on-year revenue growth",7), N(Number(d.targets.year2Growth)/100,5)]);
  var rOvrR=0, rOvrP=0;
  if(M.flags.masterOverride){
    rOvrR=put([S("Sub-partner override rate",7), N(Number(d.commercial.overridePct)/100,5)]);
    rOvrP=put([S("Sub-partner network revenue (year 1)",7), N(0,4)]);
  }
  put([]);
  var rHdr=put([H("Line"),H("Year 1"),H("Year 2"),H("Year 3")]);
  var rRev=put([S("Gross revenue (plan)",7), N(d.targets.year1Revenue,4),
                Fx("B"+(rHdr+1)+"*(1+$B$"+rGrow+")"), Fx("C"+(rHdr+1)+"*(1+$B$"+rGrow+")")]);
  function tri(label,fA,style){
    var rn=c.length+1;
    var cells=[S(label,7)];
    ["B","C","D"].forEach(function(col){ cells.push(Fx(fA(col,rn),style===undefined?4:style)); });
    c.push(cells); return rn;
  }
  var rRate=tri("Applicable royalty rate",function(col,rn){
    return "IF("+col+rRev+">=$B$"+rT2a+",$B$"+rT2b+",IF("+col+rRev+">=$B$"+rT1a+",$B$"+rT1b+",$B$"+rBase+"))"; },5);
  var rRoy=tri("Royalty payable",function(col,rn){
    return "MAX("+col+rRev+"*"+col+rRate+",IF("+col+rRev+"=0,0,$B$"+rMin+"))"; });
  var rMktP=tri("Marketing contribution",function(col){ return col+rRev+"*$B$"+rMkt; });
  var rOvr=0;
  if(M.flags.masterOverride){ rOvr=tri("Sub-partner override",function(col){ return "$B$"+rOvrP+"*$B$"+rOvrR; }); }
  var rTot=tri("Total payable to "+d.franchisor.brand,function(col){
    return col+rRoy+"+"+col+rMktP+(rOvr?"+"+col+rOvr:""); });
  var rEff=tri("Effective total rate",function(col){ return "IF("+col+rRev+"=0,0,"+col+rTot+"/"+col+rRev+")"; },5);
  var rDel=tri("Partner delivery cost",function(col){ return col+rRev+"*(1-$B$"+rGM+")"; });
  var rFixC=tri("Partner fixed operating cost",function(col){ return "$B$"+rFix; });
  var rProf=tri("Partner operating profit",function(col){
    return col+rRev+"-"+col+rTot+"-"+col+rDel+"-"+col+rFixC; });
  var rMarg=tri("Partner net margin",function(col){ return "IF("+col+rRev+"=0,0,"+col+rProf+"/"+col+rRev+")"; },5);
  var rCum=c.length+1;
  c.push([S("Cumulative profit after initial fee",7),
          Fx("B"+rProf+"-$B$"+rFee), Fx("B"+rCum+"+C"+rProf), Fx("C"+rCum+"+D"+rProf)]);
  var rPay=c.length+1;
  c.push([S("Payback achieved",7),
          Fx('IF(B'+rCum+'>=0,"Yes","No")',7), Fx('IF(C'+rCum+'>=0,"Yes","No")',7), Fx('IF(D'+rCum+'>=0,"Yes","No")',7)]);
  c.push([]);
  var rFH=c.length+1; c.push([G(d.franchisor.brand+" view"),G("Year 1"),G("Year 2"),G("Year 3")]);
  var rFI=c.length+1; c.push([S("Income from this partner",7), Fx("B"+rTot), Fx("C"+rTot), Fx("D"+rTot)]);
  var rFC=c.length+1; c.push([S("Cumulative income incl. initial fee",7),
          Fx("B"+rFI+"+$B$"+rFee), Fx("B"+rFC+"+C"+rFI), Fx("C"+rFC+"+D"+rFI)]);
  c.push([]);
  c.push([{t:"s",v:"The Assumptions block and the Gross revenue row for Year 1 are the only inputs. Every other figure is a live formula — change an assumption and the projection, the payback and the Modelware view all recalculate.",s:10}]);
  sheets.push({name:"Commercial Model", cols:[40,16,16,16], rows:c});

  /* ---- 4. Lifecycle Gates ---- */
  var lg=[];
  lg.push([TT("Lifecycle Gate Tracker")]);
  lg.push([{t:"s",v:"Soft gates allow remediation. Hard gates require a documented go / no-go decision.",s:10}]);
  lg.push([]);
  lg.push(["Checkpoint","Gate","Scheduled","Objective","Evidence required","Owner","Status","Actual date","Decision","Notes"].map(H));
  g.forEach(function(x){
    lg.push([S(x.label),S(x.type+" gate"),DT(x.date),S(x.obj),S(x.ev),
             S(d.franchisor.repName),S("Not started"),T(""),T(""),T("")]);
  });
  lg.push([]);
  lg.push([G("Performance-triggered milestones")]);
  lg.push(["Milestone","Trigger","Gate","Decision required","Status","Date achieved"].map(H));
  [["Operational readiness","Staff certified, systems live, launch plan approved (target 60 days)","Soft","Confirm launch or extend onboarding"],
   ["First revenue","First paying engagement secured (target "+d.targets.ttfsDays+" days)","Soft","Confirm market fit or apply sales support"],
   ["Quality checkpoint","2-3 engagements delivered and evaluated","Soft","Confirm standards or issue remediation plan"],
   ["Sustained profitability","Break-even reached (expected "+d.targets.breakEvenMonths+" months)","Soft / Hard","Confirm viability or restructure"],
   ["Term performance review","Annual or at renewal","Hard","Renew, rescope, probation or exit"]
  ].forEach(function(m){ lg.push([S(m[0]),S(m[1]),S(m[2]),S(m[3]),S("Not started"),T("")]); });
  lg.push([]);
  lg.push([G("Lifecycle stages")]);
  LIFECYCLE_STAGES.forEach(function(s){ lg.push([S(s[0],7),S(s[1],7)]); });
  sheets.push({name:"Lifecycle Gates", cols:[34,14,14,52,52,20,16,14,26,30], rows:lg, rowHeights:{4:30}});

  /* ---- 5. KPI Scorecard ---- */
  var k=[];
  k.push([TT("Partner KPI Scorecard")]);
  k.push([{t:"s",v:"Enter the Actual column at each review. Variance and Status calculate automatically.",s:10}]);
  k.push([]);
  k.push(["Dimension","KPI","Unit","Better","Target","Actual","Variance","Status","Comment"].map(H));
  var lowerBetter=["days","months","count"];
  KPI_SETS.forEach(function(set){
    k.push([G(set[0]),G(""),G(""),G(""),G(""),G(""),G(""),G(""),G("")]);
    set[1].forEach(function(kpi){
      var unit=kpi[1], target=kpi[2];
      var better = (unit==="days"||unit==="months") ? "Lower"
                 : (kpi[0].indexOf("incident")>-1 ? "Lower" : "Higher");
      var rn=k.length+1;
      var tCell;
      if(target===null) tCell=T("");
      else if(unit==="%") tCell=N(target/100,5);
      else if(unit==="currency") tCell=N(target,4);
      else tCell=N(target,9);
      k.push([S(set[0]),S(kpi[0]),S(unit),S(better),tCell,
              (unit==="%"?{t:"n",v:null,s:5}:{t:"n",v:null,s:9}),
              Fx('IF(OR(E'+rn+'="",F'+rn+'=""),"",F'+rn+'-E'+rn+')',9),
              Fx('IF(F'+rn+'="","Not measured",IF(D'+rn+'="Higher",IF(F'+rn+'>=E'+rn+',"On target","Below target"),IF(F'+rn+'<=E'+rn+',"On target","Off target")))',7),
              T("")]);
    });
  });
  k.push([]);
  k.push([{t:"s",v:"Targets are drawn from Schedule E of the agreement and from the Modelware partner KPI framework.",s:10}]);
  sheets.push({name:"KPI Scorecard", cols:[26,46,12,10,14,14,14,18,34], rows:k, rowHeights:{4:30}});

  return sheets;
}
</script>
<script>

/* ================================================================== UI */
var COUNTRY_LIST=["South Africa","Namibia","Botswana","Zimbabwe","Zambia","Kenya","Tanzania","Uganda","Rwanda","Ghana","Nigeria","Egypt","Morocco","Mauritius","United Arab Emirates","Saudi Arabia","Qatar","Kuwait","Oman","Bahrain","United Kingdom","Ireland","Netherlands","Germany","France","Spain","Portugal","Poland","Sweden","Norway","United States","Canada","Mexico","Brazil","Chile","Colombia","Australia","New Zealand","Singapore","Malaysia","Indonesia","Philippines","India","Sri Lanka","Pakistan","Bangladesh","Japan","South Korea","Turkey","Israel"];

function get(path){ return path.split(".").reduce(function(o,k){ return o==null?undefined:o[k]; }, D); }
function set(path,val){
  var ks=path.split("."), o=D, i;
  for(i=0;i<ks.length-1;i++) o=o[ks[i]];
  o[ks[ks.length-1]]=val;
}
function f(path,label,type,extra){
  var v=get(path); extra=extra||{};
  var attrs='data-p="'+path+'"';
  if(extra.step) attrs+=' step="'+extra.step+'"';
  if(extra.min!==undefined) attrs+=' min="'+extra.min+'"';
  var ctl;
  if(type==="select"){
    ctl='<select '+attrs+'>'+extra.options.map(function(o){
      var val=(typeof o==="object")?o.v:o, lab=(typeof o==="object")?o.l:o;
      return '<option value="'+esc(val)+'"'+(String(val)===String(v)?" selected":"")+'>'+esc(lab)+'</option>';
    }).join("")+'</select>';
  } else if(type==="textarea"){
    ctl='<textarea '+attrs+'>'+esc(v)+'</textarea>';
  } else if(type==="checkbox"){
    ctl='<label style="font-weight:400;display:flex;gap:8px;align-items:center"><input type="checkbox" '+attrs+(v?" checked":"")+'> '+esc(extra.cbLabel||"")+'</label>';
  } else {
    ctl='<input type="'+type+'" '+attrs+' value="'+esc(v)+'">';
  }
  return '<div class="field"><label>'+esc(label)+(extra.hint?' <span class="hint">'+esc(extra.hint)+'</span>':'')+'</label>'+ctl+'</div>';
}
function renderForm(){

  h+=f("territory.description","Territory description","text",{hint:"optional — overrides the country list wording"});

  h+='<h2 class="sec">Commercial terms</h2>';

      f("commercial.initialFee","Initial fee","number",{min:0})+
      f("commercial.initialFeeInstalments","Instalments","number",{min:1})+'</div>';
  h+='<div class="grid3">'+f("commercial.royaltyPct","Base royalty %","number",{step:"0.5",min:0})+

  h+='<h2 class="sec">Quality &amp; certification</h2>';

  h+='<div class="grid3">'+f("targets.ttfsDays","Time to first sale (days)","number",{min:0})+
      f("targets.breakEvenMonths","Break-even (months)","number",{min:0})+
      f("targets.year2Growth","Year 2 growth %","number",{min:0})+'</div>';

  h+='<h2 class="sec">Onboarding &amp; systems</h2>';
  h+='<div class="grid2">'+f("ops.lms","Learning platform","text")+f("ops.crm","CRM tenant","text")+'</div>';
  h+='<div class="grid2">'+f("ops.playbook","Operations playbook","text")+f("ops.onboardingWeeks","Onboarding (weeks)","number",{min:1})+'</div>';
  h+=f("notes","Internal notes","textarea");

  h+='<h2 class="sec">Franchisor / licensor</h2>';
  h+='<div class="grid2">'+f("franchisor.legalName","Legal name","text")+f("franchisor.brand","Brand","text")+'</div>';
  h+='<div class="grid2">'+f("franchisor.regNo","Registration no.","text")+f("franchisor.vatNo","VAT no.","text")+'</div>';
  h+=f("franchisor.address","Address","text");
  h+='<div class="grid2">'+f("franchisor.repName","Signatory","text")+f("franchisor.repRole","Capacity","text")+'</div>';

  h+='<h2 class="sec">Export</h2>';
  h+='<div class="disclaimer"><strong>Legal review required.</strong> Every contract produced here is a draft generated from a template. It is governed by South African law and must be settled by a qualified legal practitioner, and checked against mandatory local law in the partner\'s territory, before signature.</div>';
  h+='<div class="exportgrid">'+
     '<button class="btn light" id="btnXlsx">Workbook (.xlsx)</button>'+
     '<button class="btn light" id="btnDocxAll">Contracts (.docx)</button>'+
     '<button class="btn light" id="btnPdfAll">Contracts (.pdf)</button>'+
     '<button class="btn" id="btnZip">Full pack (.zip)</button>'+
     '</div>';
  document.getElementById("form").innerHTML=h;
}

/* ------------------------------------------------------- preview render */
function blocksToHtml(doc){
  var h='<div class="doc"><h1>'+esc(doc.title)+'</h1><div class="docmeta">'+esc(doc.subtitle||"")+'</div>';
  doc.blocks.forEach(function(bl){
    switch(bl.t){
      case "h1": break;
      case "h2": h+="<h2>"+esc(bl.x)+"</h2>"; break;
      case "h3": h+="<h3>"+esc(bl.x)+"</h3>"; break;
      case "p": h+="<p>"+esc(bl.x)+"</p>"; break;
      case "note": h+='<div class="note">'+esc(bl.x)+"</div>"; break;
      case "ul": h+="<ul>"+bl.items.map(function(i){return "<li>"+esc(i)+"</li>";}).join("")+"</ul>"; break;
      case "ol": h+="<ol>"+bl.items.map(function(i){return "<li>"+esc(i)+"</li>";}).join("")+"</ol>"; break;
      case "table":
        h+="<table>"+(bl.head&&bl.head.length?"<tr>"+bl.head.map(function(x){return "<th>"+esc(x)+"</th>";}).join("")+"</tr>":"");
        bl.rows.forEach(function(r){ h+="<tr>"+r.map(function(x){return "<td>"+esc(x)+"</td>";}).join("")+"</tr>"; });
        h+="</table>"; break;
      case "sig":
        h+='<h2>Signed by the parties</h2><div class="sig">'+
           '<div><strong>For '+esc(bl.a.party)+'</strong><div class="sigbox">Name: '+esc(fb(bl.a.name,"name"))+'<br>Capacity: '+esc(fb(bl.a.role,"capacity"))+'<br>Date: ______________</div></div>'+
           '<div><strong>For '+esc(bl.b.party)+'</strong><div class="sigbox">Name: '+esc(fb(bl.b.name,"name"))+'<br>Capacity: '+esc(fb(bl.b.role,"capacity"))+'<br>Date: ______________</div></div></div>';
        break;
    }
  });
  return h+"</div>";
}
function sheetsToHtml(sheets){
  var h="";
  sheets.forEach(function(s){
    h+='<div class="sheetwrap"><div class="sheettitle">'+esc(s.name)+'</div><table class="sheet">';
    s.rows.forEach(function(r){
      if(!r||!r.length){ h+='<tr><td style="height:6px;border:0"></td></tr>'; return; }
      var isHead=r[0]&&r[0].s===2, isGrp=r[0]&&r[0].s===8;
      h+='<tr'+(isGrp?' class="grp"':'')+'>';
      r.forEach(function(c){
        if(!c){ h+="<td></td>"; return; }
        var v=c.v, cls="";
        if(c.t==="f"){ v="= "+c.v; cls=' class="num"'; }
        else if(c.t==="n"){
          if(v===null||v===""){ v=""; }
          else if(c.s===5){ v=(Number(v)*100).toFixed(1)+"%"; }
          else if(c.s===6){ v=new Date(Date.UTC(1899,11,30)+Number(v)*86400000).toISOString().slice(0,10); }
          else v=num(v, c.s===9?1:0);
          cls=' class="num"';
        }
        h+=(isHead?"<th>":"<td"+cls+">")+esc(v)+(isHead?"</th>":"</td>");
      });
      h+="</tr>";
    });
    h+="</table></div>";
  });
  return h;
}
var activeTab="WB";
function render(){
  var docs=buildDocs(D), sheets=buildWorkbook(D);
  var tabs='<button class="tab'+(activeTab==="WB"?" on":"")+'" data-tab="WB">Workbook</button>';
  docs.forEach(function(dc){ tabs+='<button class="tab'+(activeTab===dc.id?" on":"")+'" data-tab="'+dc.id+'">'+esc(dc.code+". "+dc.title.replace(/^Schedule ([A-E]) — /,"Sch $1: ").replace(/ Agreement$/," Agr."))+'</button>'; });
  document.getElementById("tabs").innerHTML=tabs;
  var v=document.getElementById("view");
  if(activeTab==="WB"){
    v.innerHTML='<div class="bar"><span class="pill">'+esc(MODELS[D.modelKey].name)+'</span>'+
      '<span class="pill">'+esc(territoryText(D))+'</span>'+
      '<span class="pill">'+esc(D.territory.exclusivity)+'</span>'+
      '<span class="pill soft">'+sheets.length+' sheets</span></div>'+sheetsToHtml(sheets);
  } else {
    var dc=docs.filter(function(x){return x.id===activeTab;})[0]||docs[0];
    v.innerHTML='<div class="bar"><button class="btn light sm" data-one="docx">Download .docx</button>'+
      '<button class="btn light sm" data-one="pdf">Download .pdf</button>'+
      '<span class="pill">'+esc(MODELS[D.modelKey].name)+'</span></div>'+blocksToHtml(dc);
  }
}
function toast(m,err){
  var el=document.getElementById("msg"); el.textContent=m;
  el.className="msg on"+(err?" err":"");
  clearTimeout(toast._t); toast._t=setTimeout(function(){ el.className="msg"+(err?" err":""); },3200);
}
</script>
<script>
"use strict";
/* ============================================================== EXPORTS */
function packBase(){
  return safeName(D.partner.legalName||D.partner.tradingName||"Partner")+" - "+safeName(MODELS[D.modelKey].short);
}
function docFileBase(doc){ return doc.code+" "+safeName(doc.title); }
function footerFor(doc){
  return D.franchisor.brand+" | "+fb(D.ref,"ref")+" | "+doc.title+" | "+fb(D.partner.legalName,"Partner")+" | Draft for legal review";
}
function exportXlsx(){
  var bytes=buildXlsx(buildWorkbook(D));
  download(packBase()+" - Partner Account Workbook.xlsx", bytes,
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  toast("Workbook exported.");
}
function contractFiles(kind){
  var docs=buildDocs(D), files=[];
  docs.forEach(function(doc){
    if(kind==="docx") files.push({name:docFileBase(doc)+".docx", data:blocksToDocx(doc)});
    else files.push({name:docFileBase(doc)+".pdf", data:blocksToPdf(doc,footerFor(doc))});
  });
  return files;
}
function exportContracts(kind){
  var files=contractFiles(kind).map(function(f){ return {name:packBase()+"/"+f.name, data:f.data}; });
  download(packBase()+" - Contracts ("+kind.toUpperCase()+").zip", zipMake(files), "application/zip");
  toast("Contract set exported as "+kind.toUpperCase()+".");
}
function exportAll(){
  var base=packBase(), files=[];
  files.push({name:base+"/"+base+" - Partner Account Workbook.xlsx", data:buildXlsx(buildWorkbook(D))});
  contractFiles("docx").forEach(function(f){ files.push({name:base+"/Contracts (Word)/"+f.name, data:f.data}); });
  contractFiles("pdf").forEach(function(f){ files.push({name:base+"/Contracts (PDF)/"+f.name, data:f.data}); });
  files.push({name:base+"/partner-data.json", data:u8(JSON.stringify(D,null,2))});
  files.push({name:base+"/READ ME.txt", data:u8(
    "MODELWARE PARTNER PACK\n"+
    "======================\n\n"+
    "Partner:        "+fb(D.partner.legalName,"Partner")+"\n"+
    "Operating model:"+MODELS[D.modelKey].name+"\n"+
    "Territory:      "+territoryText(D)+"\n"+
    "Reference:      "+fb(D.ref,"ref")+"\n"+
    "Generated:      "+new Date().toISOString().slice(0,10)+"\n\n"+
    "CONTENTS\n"+
    "  Partner Account Workbook.xlsx  Agreement summary, partner register, commercial model,\n"+
    "                                 lifecycle gate tracker and KPI scorecard.\n"+
    "  Contracts (Word)/              Editable drafts for redlining.\n"+
    "  Contracts (PDF)/               Issue copies with signature blocks.\n"+
    "  partner-data.json              Reload this in the builder to reproduce or amend the pack.\n\n"+
    "IMPORTANT\n"+
    "  These contracts are drafts generated from a template. They are governed by South African\n"+
    "  law and must be reviewed by a qualified legal practitioner, and checked against mandatory\n"+
    "  local law in the partner's territory, before signature.\n")});
  download(base+" - Partner Pack.zip", zipMake(files), "application/zip");
  toast("Full partner pack exported.");
}
function exportOne(kind){
  var docs=buildDocs(D), doc=docs.filter(function(x){return x.id===activeTab;})[0];
  if(!doc){ toast("Open a contract tab first.",true); return; }
  if(kind==="docx") download(packBase()+" - "+docFileBase(doc)+".docx", blocksToDocx(doc),
    "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  else download(packBase()+" - "+docFileBase(doc)+".pdf", blocksToPdf(doc,footerFor(doc)), "application/pdf");
  toast(doc.title+" exported.");
}

/* =============================================================== DEMO */
function demoData(){
  var d=blankModel();
  d.ref="MWS-PP-2026-014";
  d.modelKey="FRANCHISE";
  applyModelDefaults(d,"FRANCHISE");
  d.partner={legalName:"Gulf Data Academy LLC", tradingName:"Gulf Data Academy", regNo:"CN-1194422",
    vatNo:"100234567800003", countryOfIncorporation:"United Arab Emirates",
    address:"Office 1204, Emaar Square Building 3, Downtown Dubai, United Arab Emirates",
    repName:"Layla Al-Mansoori", repRole:"Managing Director",
    email:"layla@gulfdataacademy.ae", phone:"+971 4 555 0198", website:"gulfdataacademy.ae"};
  d.territory.countries=["United Arab Emirates","Qatar","Oman"];
  d.territory.exclusivity="Exclusive";
  d.term.agreementDate=todayISO(); d.term.commencementDate=addDays(todayISO(),30);
  d.targets={year1Revenue:420000, year1Courses:14, year1Delegates:210, ttfsDays:75, breakEvenMonths:14, year2Growth:30};
  d.commercial.currency="USD";
  d.notes="Introduced through DAMA UAE chapter. Two CDMP-certified trainers in place; third in progress.";
  return d;
}
function applyModelDefaults(d,key){
  var m=MODELS[key].defaults;
  d.commercial.royaltyPct=m.royaltyPct; d.commercial.marketingPct=m.marketingPct;
  d.commercial.initialFee=m.initialFee; d.commercial.minAnnualRoyalty=m.minAnnualRoyalty;
  d.territory.exclusivity=m.exclusivity; d.term.termYears=m.termYears; d.term.renewYears=m.renewYears;
  d.commercial.tiers=[{from:Math.round(m.initialFee*10),pct:Math.max(5,m.royaltyPct-3)},
                      {from:Math.round(m.initialFee*20),pct:Math.max(5,m.royaltyPct-5)}];
}

/* ================================================================ WIRING */
function refresh(){ renderForm(); render(); }
document.addEventListener("input", function(e){
  var t=e.target;
  if(t.dataset && t.dataset.p){
    var path=t.dataset.p, val;
    if(t.type==="checkbox") val=t.checked;
    else if(t.type==="number") val=(t.value===""?"":Number(t.value));
    else val=t.value;
    set(path,val); render(); return;
  }
  if(t.dataset && t.dataset.tier!==undefined){
    var i=Number(t.dataset.tier), fld=t.dataset.tf;
    D.commercial.tiers[i][fld]=Number(t.value)||0; render(); return;
  }
});
document.addEventListener("change", function(e){
  var t=e.target;
  if(t.name==="mk"){ D.modelKey=t.value; applyModelDefaults(D,t.value); activeTab=activeTab==="WB"?"WB":"AGREEMENT"; refresh(); }
});
document.addEventListener("keydown", function(e){
  if(e.target.id==="countryIn" && e.key==="Enter"){
    e.preventDefault();
    var v=e.target.value.trim();
    if(v && D.territory.countries.indexOf(v)===-1){ D.territory.countries.push(v); refresh();
      var el=document.getElementById("countryIn"); if(el) el.focus(); }
  }
});
document.addEventListener("click", function(e){
  var t=e.target, id=t.id;
  if(t.dataset && t.dataset.rm!==undefined){ D.territory.countries.splice(Number(t.dataset.rm),1); refresh(); return; }
  if(t.dataset && t.dataset.tierrm!==undefined){ D.commercial.tiers.splice(Number(t.dataset.tierrm),1); refresh(); return; }
  if(t.dataset && t.dataset.tab){ activeTab=t.dataset.tab; render(); return; }
  if(t.dataset && t.dataset.one){ exportOne(t.dataset.one); return; }
  switch(id){
    case "btnAddTier": D.commercial.tiers.push({from:0,pct:Number(D.commercial.royaltyPct)||10}); refresh(); break;
    case "btnApplyDefaults": applyModelDefaults(D,D.modelKey); refresh(); toast("Commercial terms reset to model defaults."); break;
    case "btnXlsx": exportXlsx(); break;
    case "btnDocxAll": exportContracts("docx"); break;
    case "btnPdfAll": exportContracts("pdf"); break;
    case "btnZip": case "btnExportAll": exportAll(); break;
    case "btnLoadDemo": D=demoData(); activeTab="WB"; refresh(); toast("Example partner loaded."); break;
    case "btnSaveJson":
      download(packBase()+" - partner-data.json", u8(JSON.stringify(D,null,2)), "application/json");
      toast("Data saved."); break;
    case "btnLoadJson": document.getElementById("fileIn").click(); break;
  }
});
document.getElementById("fileIn").addEventListener("change", function(e){
  var file=e.target.files[0]; if(!file) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var obj=JSON.parse(fr.result), base=blankModel(), k;
      for(k in base){ if(obj[k]!==undefined) base[k]=obj[k]; }
      if(!MODELS[base.modelKey]) base.modelKey="ADP";
      D=base; activeTab="WB"; refresh(); toast("Partner data loaded.");
    }catch(err){ toast("Could not read that file: "+err.message,true); }
  };
  fr.readAsText(file);
  e.target.value="";
});

/* expose for automated verification */
window.MW = {
  get data(){ return D; }, set data(v){ D=v; refresh(); },
  buildDocs:function(){ return buildDocs(D); },
  buildWorkbook:function(){ return buildWorkbook(D); },
  xlsxBytes:function(){ return buildXlsx(buildWorkbook(D)); },
  docxBytes:function(i){ return blocksToDocx(buildDocs(D)[i]); },
  pdfBytes:function(i){ var dc=buildDocs(D)[i]; return blocksToPdf(dc,footerFor(dc)); },
  zipBytes:function(){
    var base=packBase(), files=[];
    files.push({name:base+"/workbook.xlsx",data:buildXlsx(buildWorkbook(D))});
    contractFiles("docx").forEach(function(f){ files.push({name:base+"/docx/"+f.name,data:f.data}); });
    contractFiles("pdf").forEach(function(f){ files.push({name:base+"/pdf/"+f.name,data:f.data}); });
    return zipMake(files);
  },
  demo:demoData, refresh:refresh, MODELS:MODELS
};
refresh();
</script>
