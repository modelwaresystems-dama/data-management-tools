function nextStepPopover(anchor, deal, contextFollowup, opts){
  opts = opts || {};
  var box = h("div");
  box.appendChild(h("h4", { text: opts.reason || ("Next step — " + deal.name) }));

  var what = h("input", { type:"text", value:"", placeholder:"What happens next?",
                          "aria-label":"What happens next" });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"What" }), what));

  var chosen = { date: C.deferBy(App.today, 7) };
  var quick = h("div", { class:"quick" });
  var btns = [];
  [[1,"Tomorrow","1"],[3,"+3","3"],[7,"+7","7"],[14,"+14","4"]].forEach(function (q){
    var to = C.deferBy(App.today, q[0]);
    var b = h("button", { class:"btn btn-sm", type:"button",
      onclick:function (){ chosen.date = to; paint(); } },
      h("span", { text:q[1] }), " ", h("span", { class:"kbd", text:q[2] }));
    b.dataset.date = to;
    btns.push(b); quick.appendChild(b);
  });
  box.appendChild(quick);

  var typed = h("input", { type:"text", placeholder:"or type: fri · 3 sep · 2026-09-03",
                           "aria-label":"Or type a date" });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"When" }), typed));
  var preview = h("div", { class:"note" });
  box.appendChild(preview);

  /* Who does it. A next step used to inherit the deal's owner with no way to
     say otherwise — but the person who owns the account is often not the person
     who does the task: Veronica raises the quote, Monica fixes the invoice.
     Roles are shown so a task landing on the wrong desk is visible now rather
     than a week later when nobody has done it. */
  var who = h("select", { "aria-label":"Who does it" });
  users().forEach(function (u){ who.appendChild(h("option", { value:u.id }, userLabel(u.id))); });
  who.value = deal.owner || App.me;
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Who" }), who));

  function paint(){
    btns.forEach(function (b){ b.classList.toggle("primary", b.dataset.date === chosen.date); });
    preview.textContent = "Due " + C.fmtFull(chosen.date);
  }
  typed.addEventListener("input", function (){
    var d = C.parseDateInput(typed.value, App.today);
    if (d){ chosen.date = d; paint(); }
    else if (typed.value.trim()) preview.textContent = "Not a date I recognise.";
  });
  paint();

  function save(){
    var text = what.value.trim() || "Follow up";
    emit("followup.created", { followupId:C.uid("fu"), subjectType:"deal", subjectId:deal.id,
      owner:who.value || deal.owner || App.me, dueDate:chosen.date, what:text });
    closeLayers("pop"); render();
    toast("Next step set — " + C.fmtFull(chosen.date) +
          (who.value && who.value !== deal.owner ? " · " + userName(who.value) : ""));
  }
  function decline(){
    emit("followup.declined", { subjectType:"deal", subjectId:deal.id });
    closeLayers("pop"); render();
    toast(deal.name + " has no next step — it will sit in band three until it does.");
  }

  box.appendChild(h("div", { class:"note",
    text:"Nothing here is required. Choosing “no next step yet” is honest — it puts the deal in band three where you can see it." }));
  box.appendChild(h("div", { class:"pop-foot" },
    h("button", { class:"btn btn-sm quiet", type:"button", onclick:decline }, "No next step yet"),
    h("button", { class:"btn btn-sm primary", type:"button", onclick:save }, "Set")));

  box.addEventListener("keydown", function (e){
    if (e.target === typed) { if (e.key === "Enter"){ e.preventDefault(); save(); } return; }
    if (e.key === "Enter"){ e.preventDefault(); save(); return; }
    if (e.target === what) return;
    if (e.key === "1"){ chosen.date = C.deferBy(App.today,1); paint(); }
    if (e.key === "3"){ chosen.date = C.deferBy(App.today,3); paint(); }
    if (e.key === "7"){ chosen.date = C.deferBy(App.today,7); paint(); }
    if (e.key === "4"){ chosen.date = C.deferBy(App.today,14); paint(); }
  });
  var pop = openPopover(anchor, box);
  what.focus();
  return pop;
}

var KINDS = [["call","Call"],["whatsapp","WhatsApp"],["linkedin","LinkedIn"],["email","Email"],["meeting","Meeting"],["note","Note"]];

function logPopover(anchor, deal, prefill){
  prefill = prefill || {};
  var box = h("div");
  box.appendChild(h("h4", { text:"Log — " + deal.name }));

  var kind = prefill.kind || "call";
  var kwrap = h("div", { class:"quick kinds" });
  var kbtns = [];
  KINDS.forEach(function (k){
    var b = h("button", { class:"btn btn-sm" + (k[0] === kind ? " primary" : ""), type:"button",
      onclick:function (){ kind = k[0]; kbtns.forEach(function (x){ x.classList.toggle("primary", x.dataset.k === kind); }); } }, k[1]);
    b.dataset.k = k[0]; kbtns.push(b); kwrap.appendChild(b);
  });
  box.appendChild(kwrap);

  var when = h("input", { type:"text", value: prefill.occurredAt || App.today,
                          "aria-label":"When it happened" });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"When" }), when));

  var summary = h("textarea", { rows:"3", placeholder:"What was said, in one line.",
                                "aria-label":"Summary" });
  summary.value = prefill.summary || "";
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Summary" }), summary));

  function save(){
    var d = C.parseDateInput(when.value, App.today) || App.today;
    emit("interaction.logged", { interactionId:C.uid("ix"), subjectType:"deal", subjectId:deal.id,
      kind:kind, occurredAt:d, summary:summary.value.trim() || "(no summary)",
      contactId: prefill.contactId || null });
    closeLayers("pop");
    render();
    toast("Logged.");
    // the prompt FOLLOWS the save — it never blocks it
    var live = App.st.deals[deal.id];
    if (live && live.status === "open")
      setTimeout(function (){
        nextStepPopover($("#content") || document.body, live, null,
                        { reason:"Logged. What's next on " + live.name + "?" });
      }, 30);
  }
  box.appendChild(h("div", { class:"note", text:"Saves immediately. The next-step prompt comes after." }));
  box.appendChild(h("div", { class:"pop-foot" },
    h("button", { class:"btn btn-sm quiet", type:"button", onclick:function (){ closeLayers("pop"); } }, "Cancel"),
    h("button", { class:"btn btn-sm primary", type:"button", onclick:save }, "Save")));
  var pop = openPopover(anchor, box, { width:320 });
  summary.focus();
  return pop;
}

/* ---------------- log from anywhere (the spine) ----------------
   Logging used to require navigating into a deal first. That is backwards: the
   log is the single source of truth every flag is computed from (C8), so it has
   to be the cheapest thing in the app to reach, not the deepest. This is the
   front door — pick who, then log.
------------------------------------------------------------------------- */

function quickLog(anchor, opts){
  opts = opts || {};
  var box = h("div", { style:"width:100%" });
  box.appendChild(h("h4", { text: opts.title || "Log an interaction" }));

  var inp = h("input", { type:"text", placeholder:"Which customer or deal?",
                         "aria-label":"Find a customer or deal", autocomplete:"off" });
  box.appendChild(inp);
  var list = h("div", { class:"picker", role:"listbox" });
  box.appendChild(list);
  var hint = h("div", { class:"note",
    text:"Type a company, deal or contact. ↑ ↓ to move, Enter to pick." });
  box.appendChild(hint);
  box.appendChild(h("div", { class:"pop-foot" },
    h("button", { class:"btn btn-sm quiet", type:"button",
                  onclick:function (){ closeLayers("pop"); } }, "Cancel"),
    h("button", { class:"btn btn-sm", type:"button", onclick:function (e){
      closeLayers("pop"); pastePopover($("#content") || document.body);
    }}, "Paste a chat or email")));

  var rows = [], sel = 0;

  /* Deals are the spine (C4), so they are what you log against. A company with
     no open deal is offered as a company, and the follow-on step says so. */
  function candidates(q){
    var out = [];
    var seen = {};
    C.search(App.st, App.config, q, 30).forEach(function (r){
      if (r.kind === "deal"){
        var d = App.st.deals[r.id];
        if (d && !seen[d.id]){ seen[d.id] = 1; out.push({ deal:d }); }
      } else if (r.kind === "company"){
        C.openDeals(App.st).filter(function (d){ return d.companyId === r.id; })
          .forEach(function (d){ if (!seen[d.id]){ seen[d.id] = 1; out.push({ deal:d }); } });
      } else if (r.kind === "contact"){
        var c = App.st.contacts[r.id];
        if (c) C.openDeals(App.st).filter(function (d){ return d.companyId === c.companyId; })
          .forEach(function (d){ if (!seen[d.id]){ seen[d.id] = 1; out.push({ deal:d, via:c }); } });
      }
    });
    if (!q){
      /* with nothing typed, offer what you are most likely to be logging:
         whatever you have touched or been chased about today */
      var b = C.bands(App.st, App.config, App.today, scopeOpts());
      b.overdue.concat(b.dueToday).forEach(function (f){
        if (f.subjectType !== "deal") return;
        var d = App.st.deals[f.subjectId];
        if (d && !seen[d.id]){ seen[d.id] = 1; out.push({ deal:d, why:"on your list today" }); }
      });
      C.openDeals(App.st)
        .filter(function (d){ return App.scope === "team" || d.owner === App.me; })
        .sort(function (a, z){
          var la = C.lastContact(App.st, a.id) || "", lz = C.lastContact(App.st, z.id) || "";
          return lz < la ? -1 : 1;
        })
        .forEach(function (d){ if (!seen[d.id] && out.length < 12){ seen[d.id] = 1; out.push({ deal:d }); } });
    }
    return out.slice(0, 12);
  }

  function paint(){
    clear(list);
    rows = candidates(inp.value.trim());
    if (!rows.length){
      list.appendChild(h("div", { class:"note", style:"padding:8px 2px",
        text: inp.value.trim() ? "Nothing matches. Press n to create a deal instead."
                               : "No open deals yet." }));
      return;
    }
    rows.forEach(function (r, i){
      var co = App.st.companies[r.deal.companyId];
      var lc = C.lastContact(App.st, r.deal.id);
      var row = h("div", { class:"pick", role:"option", onclick:function (){ choose(i); } },
        h("div", { style:"min-width:0;flex:1" },
          h("div", { class:"p1", text:(co ? co.name + " — " : "") + r.deal.name }),
          h("div", { class:"p2", text:
            C.stageLabel(App.config, r.deal.stage) +
            (r.via ? " · via " + r.via.name : "") +
            (r.why ? " · " + r.why : "") +
            (lc ? " · last contact " + C.fmtDay(lc) : " · never contacted") })),
        App.scope === "team" || r.deal.owner !== App.me
          ? h("span", { class:"chip owner", text:initials(r.deal.owner), title:userName(r.deal.owner) })
          : null);
      row.setAttribute("aria-selected", i === sel ? "true" : "false");
      if (i === sel) row.classList.add("on");
      list.appendChild(row);
    });
  }
  function choose(i){
    var r = rows[i]; if (!r) return;
    closeLayers("pop");
    logPopover($("#content") || document.body, r.deal,
               r.via ? { contactId:r.via.id } : null);
  }

  inp.addEventListener("input", function (){ sel = 0; paint(); });
  inp.addEventListener("keydown", function (e){
    if (e.key === "ArrowDown"){ e.preventDefault(); sel = Math.min(sel + 1, rows.length - 1); paint(); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); sel = Math.max(0, sel - 1); paint(); }
    else if (e.key === "Enter"){ e.preventDefault(); choose(sel); }
  });
  paint();
  var pop = openPopover(anchor || $("#content") || document.body, box, { width:400 });
  inp.focus();
  return pop;
}

/* ---------------- paste-to-log (C9): parsed in-browser, raw text never committed ---------------- */

function pastePopover(anchor, forceDeal){
  var box = h("div", { style:"width:100%" });
  box.appendChild(h("h4", { text:"Paste a conversation" }));
  var ta = h("textarea", { rows:"7",
    placeholder:"Paste an email (the From / Date / Subject lines are enough), or paste a SCREENSHOT of a WhatsApp or LinkedIn chat.",
    "aria-label":"Paste an email, or a screenshot of a chat" });
  box.appendChild(ta);
  var out = h("div", { class:"note", text:"Nothing is saved until you confirm." });
  box.appendChild(out);

  /* ---- a pasted screenshot ----------------------------------------------
     WhatsApp on the desktop cannot export a conversation, and LinkedIn will
     not either, so "paste the exported chat" asked for something that does
     not exist. A screenshot is what people actually have.

     The app cannot READ it: this is one file with no network access, and
     carrying an OCR engine would cost fifty times its own size for middling
     accuracy on chat bubbles. It does not need to. Howard can read it. What
     the app has to do is stop refusing the paste, hold the picture on screen
     while he types the one line, and then forget it.

     The image is held as an object URL and revoked when this closes. It is
     never turned into a data URL, never put in an event, never written to
     localStorage and never committed. Same rule as the text: what lands is
     one line. */
  var shot = { url:null, name:"" };
  var shotWrap = h("div", { style:"display:none;margin:8px 0" });
  box.insertBefore(shotWrap, out);

  function dropShot(){
    if (shot.url){ try { URL.revokeObjectURL(shot.url); } catch (e){} }
    shot.url = null; shot.name = "";
    clear(shotWrap); shotWrap.style.display = "none";
    ta.disabled = false;
    ta.dispatchEvent(new Event("input"));
  }

  function takeShot(file){
    if (!file || String(file.type || "").indexOf("image/") !== 0) return false;
    if (shot.url){ try { URL.revokeObjectURL(shot.url); } catch (e){} }
    shot.url = URL.createObjectURL(file);
    shot.name = file.name || "screenshot";
    clear(shotWrap);
    shotWrap.style.display = "";
    shotWrap.appendChild(h("img", { src:shot.url, alt:"The pasted screenshot",
      style:"max-width:100%;max-height:320px;display:block;border:1px solid var(--line);border-radius:6px" }));
    shotWrap.appendChild(h("div", { class:"note", style:"display:flex;gap:8px;align-items:center;margin-top:4px" },
      h("span", { text:"Read it here and write the one line below." }),
      h("span", { class:"spacer" }),
      h("button", { class:"btn btn-sm quiet", type:"button", onclick:dropShot }, "Remove")));
    shotWrap.appendChild(shotForm());
    /* Nothing to parse out of a picture, so the text box stops pretending. */
    ta.value = ""; ta.disabled = true;
    ta.dispatchEvent(new Event("input"));
    return true;
  }

  /* The form stays in THIS popover, under the picture. Handing off to the log
     form would close the screenshot the moment he needed to read it. */
  function shotForm(){
    var wrap = h("div", { style:"margin-top:10px" });
    if (!forceDeal){
      wrap.appendChild(h("div", { class:"note", style:"color:var(--overdue)",
        text:"A picture gives nothing to match on, so open the deal first and paste from there \u2014 " +
             "otherwise there is no way to know whose conversation this is." }));
      return wrap;
    }

    var kind = "whatsapp";
    var kwrap = h("div", { class:"quick kinds" });
    var kb = [];
    [["whatsapp","WhatsApp"],["linkedin","LinkedIn"],["call","Call"],["meeting","Meeting"]].forEach(function (k){
      var b = h("button", { class:"btn btn-sm" + (k[0] === kind ? " primary" : ""), type:"button",
        onclick:function (){ kind = k[0];
          kb.forEach(function (x){ x.classList.toggle("primary", x.dataset.k === kind); }); } }, k[1]);
      b.dataset.k = k[0]; kb.push(b); kwrap.appendChild(b);
    });
    wrap.appendChild(kwrap);

    var when = h("input", { type:"text", value:App.today, "aria-label":"When it happened" });
    wrap.appendChild(h("label", { class:"fld" }, h("span", { text:"When" }), when));
    /* A chat screenshot usually shows a clock and no day. Defaulting silently
       to today would put the interaction on the wrong date, and every quiet-
       account flag is computed from those dates. */
    wrap.appendChild(h("div", { class:"note",
      text:"Screenshots usually show a time and no date. Check this is the day it actually happened." }));

    var people = Object.keys(App.st.contacts).map(function (k){ return App.st.contacts[k]; })
      .filter(function (c){ return c.companyId === forceDeal.companyId ||
                                   c.companyId === forceDeal.partnerCompanyId; });
    var who = h("select", { "aria-label":"Who it was with" });
    who.appendChild(h("option", { value:"" }, "\u2014 nobody named \u2014"));
    people.forEach(function (c){ who.appendChild(h("option", { value:c.id }, c.name)); });
    if (people.length) wrap.appendChild(h("label", { class:"fld" }, h("span", { text:"With" }), who));

    var line = h("input", { type:"text", maxlength:"200",
      placeholder:"What happened, in one line",
      "aria-label":"The one line that gets logged" });
    wrap.appendChild(h("label", { class:"fld" }, h("span", { text:"The line that gets logged" }), line));

    var err = h("div", { class:"note", style:"color:var(--overdue)" });
    wrap.appendChild(err);
    wrap.appendChild(h("div", { class:"pop-foot", style:"border-top:0" },
      h("button", { class:"btn btn-sm quiet", type:"button", onclick:function (){ closeLayers("pop"); } }, "Cancel"),
      h("button", { class:"btn btn-sm primary", type:"button", onclick:function (){
        var day = C.parseDateInput(when.value, App.today);
        if (!day){ err.textContent = "\u201c" + when.value + "\u201d is not a date I can read."; return; }
        var txt = String(line.value || "").trim();
        if (!txt){ err.textContent = "The line is the only thing that gets kept, so it cannot be empty."; return; }
        emit("interaction.logged", { interactionId:C.uid("ix"), subjectType:"deal",
          subjectId:forceDeal.id, kind:kind, occurredAt:day, summary:txt.slice(0,200),
          contactId: who.value || undefined });
        dropShot();                       // the picture goes now, not later
        closeLayers(); render(); openDeal(forceDeal.id);
        toast("Logged \u2014 the screenshot was not kept.");
      }}, "Log it")));
    return wrap;
  }

  function fromClipboard(e){
    var dt = e.clipboardData || e.dataTransfer;
    if (!dt) return;
    var items = dt.items ? Array.prototype.slice.call(dt.items) : [];
    for (var i = 0; i < items.length; i++){
      if (items[i].kind === "file" && String(items[i].type || "").indexOf("image/") === 0){
        var f = items[i].getAsFile();
        if (f && takeShot(f)){ e.preventDefault(); return; }
      }
    }
    var files = dt.files ? Array.prototype.slice.call(dt.files) : [];
    for (var j = 0; j < files.length; j++)
      if (takeShot(files[j])){ e.preventDefault(); return; }
  }

  ta.addEventListener("paste", fromClipboard);
  box.addEventListener("paste", fromClipboard);
  box.addEventListener("dragover", function (e){ e.preventDefault(); });
  box.addEventListener("drop", function (e){ e.preventDefault(); fromClipboard(e); });
  var act = h("div", { class:"pop-foot", style:"border-top:0" });
  box.appendChild(act);

  ta.addEventListener("input", function (){
    clear(act);
    var ourNamesEarly = users().map(function (u){ return u.name; })
                          .concat(users().map(function (u){ return u.id; }));
    var p = C.parsePaste(ta.value, { exclude:ourNamesEarly });
    if (!p.ok){
      out.textContent = ta.value.trim()
        ? p.reason
        : "Nothing is saved until you confirm.";
      return;
    }
    var ourNames = ourNamesEarly;
    var m = C.matchPaste(App.st, p, ourNames);
    var target = forceDeal || m.deal;

    var bits = [];
    if (p.channel === "whatsapp"){
      bits.push("WhatsApp · " + p.messageCount + " message" + (p.messageCount === 1 ? "" : "s"));
      if (p.others.length) bits.push("with " + p.others.join(", "));
    } else {
      bits.push("Email from " + (p.fromName ? p.fromName + " <" + p.from + ">" : p.from || "unknown"));
    }
    if (p.occurredAt){
      bits.push("on " + C.fmtFull(p.occurredAt) +
        (p.firstDate && p.firstDate !== p.occurredAt ? " (last of " + C.fmtDay(p.firstDate) + "–" + C.fmtDay(p.occurredAt) + ")" : ""));
    } else bits.push("no date found — you'll set it");
    bits.push(target ? "→ " + target.name
                     : (m.company ? "→ " + m.company.name + " (no open deal)" : "→ no match — open the deal and paste from there"));
    out.textContent = bits.join(" · ");

    /* If this was opened from inside a deal, that deal wins — but the person
       who sent the messages may belong to a different company entirely, and
       silently filing it under the open deal would be a quiet mistake. */
    if (forceDeal && m.company && m.company.id !== forceDeal.companyId){
      out.appendChild(h("div", { style:"color:var(--overdue);margin-top:4px",
        text:"Heads up — this conversation is with " + m.company.name +
             ", not " + ((App.st.companies[forceDeal.companyId] || {}).name || "this company") +
             ". It will be filed against " + forceDeal.name + " because you opened it from there." }));
    }

    if (target){
      act.appendChild(h("button", { class:"btn btn-sm primary", type:"button", onclick:function (){
        ta.value = "";                              // the raw paste is dropped here, deliberately
        closeLayers("pop");
        logPopover($("#content") || document.body, target, {
          kind: p.suggestedKind, occurredAt: p.occurredAt || App.today,
          summary: p.suggestedSummary, contactId: m.contact ? m.contact.id : null });
      }}, "Use this"));
    }
  });
  box.insertBefore(h("div", { class:"note",
    text:"Text is parsed in your browser and a screenshot is only shown, never uploaded. Both are thrown away. " +
         "Only the channel, date, sender, deal link and the one line you type are ever written — never what was said." }), act);
  var pop = openPopover(anchor, box, { width:420 });
  /* Closing by any route \u2014 Cancel, Escape, the scrim, another popover opening
     over the top \u2014 releases the picture. An object URL that outlives its
     popover is the browser still holding the conversation after the app said
     it had let go. */
  pop._cleanup = function (){
    if (shot.url){ try { URL.revokeObjectURL(shot.url); } catch (e){} shot.url = null; }
  };
  ta.focus();
  return pop;
}

/* ---------------- new deal ---------------- */

function newDeal(anchor){
  var box = h("div");
  box.appendChild(h("h4", { text:"New deal" }));

  var coNames = Object.keys(App.st.companies).map(function (k){ return App.st.companies[k]; })
                  .sort(function (a,b){ return a.name < b.name ? -1 : 1; });
  var listId = "co-list-" + C.uid("dl");
  var co = h("input", { type:"text", list:listId, placeholder:"Company",
                        "aria-label":"Company" });
  var dl = h("datalist", { id:listId });
  coNames.forEach(function (c){ dl.appendChild(h("option", { value:c.name })); });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Company" }), co, dl));

  var nm = h("input", { type:"text", placeholder:"What are you selling them?", "aria-label":"Deal name" });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Deal" }), nm));

  var stage = h("select", { "aria-label":"Stage" });
  (App.config.stages||[]).forEach(function (s){ stage.appendChild(h("option", { value:s.id }, s.label)); });

  /* A deal belongs to whoever will carry it. If the person filing it does not
     carry deals — the usual case when it comes in off an email tag — nothing is
     preselected, so an owner has to be chosen rather than inherited. */
  var sellers = C.salesUsers(App.config);
  var owner = h("select", { "aria-label":"Owner" });
  var iSell = !sellers.length || sellers.indexOf(App.me) >= 0;
  if (!iSell) owner.appendChild(h("option", { value:"" }, "— choose an owner —"));
  users().forEach(function (u){
    if (sellers.length && sellers.indexOf(u.id) < 0 && u.id !== App.me) return;
    owner.appendChild(h("option", { value:u.id },
      userLabel(u.id) + (sellers.length && sellers.indexOf(u.id) < 0 ? "  (does not carry deals)" : "")));
  });
  owner.value = iSell ? App.me : "";
  box.appendChild(h("div", { class:"row2" },
    h("label", { class:"fld" }, h("span", { text:"Stage" }), stage),
    h("label", { class:"fld" }, h("span", { text:"Owner" }), owner)));
  if (!iSell)
    box.appendChild(h("div", { class:"note",
      text:"You do not carry deals, so this one needs an owner. It will sit in their list, not yours." }));

  var val = h("input", { type:"text", placeholder:"0", "aria-label":"Value" });
  var cur = h("select", { "aria-label":"Currency" });
  (App.config.currencies || ["ZAR"]).forEach(function (c){ cur.appendChild(h("option", { value:c }, c)); });
  cur.value = App.config.defaultCurrency || "ZAR";
  box.appendChild(h("div", { class:"row2" },
    h("label", { class:"fld" }, h("span", { text:"Value" }), val),
    h("label", { class:"fld" }, h("span", { text:"Currency" }), cur)));

  var close = h("input", { type:"text", placeholder:"e.g. 30 sep", "aria-label":"Expected close" });
  var first = h("input", { type:"text", placeholder:"First next step", "aria-label":"First next step" });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Expected close" }), close));
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"First next step" }), first));
  var due = h("input", { type:"text", value:C.deferBy(App.today, 7), "aria-label":"First next step due" });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Due" }), due));

  function save(){
    var coName = co.value.trim();
    if (!coName && !nm.value.trim()){ toast("A company or a deal name is the minimum.", "err"); return; }
    if (!owner.value){ toast("Pick an owner — the deal has to sit in somebody's list.", "err"); return; }
    var existing = coNames.filter(function (c){ return c.name.toLowerCase() === coName.toLowerCase(); })[0];
    var coId = existing ? existing.id : C.uid("co");
    if (!existing && coName) emit("company.created", { companyId:coId, name:coName });
    var dealId = C.uid("dl");
    var v = val.value.replace(/[^\d.\-]/g, "");
    emit("deal.created", { dealId:dealId, companyId:coName ? coId : null,
      name:nm.value.trim() || coName, owner:owner.value, stage:stage.value,
      value: v === "" ? null : +v, currency:cur.value,
      expectedCloseDate: C.parseDateInput(close.value, App.today) });
    var d = C.parseDateInput(due.value, App.today) || C.deferBy(App.today, 7);
    emit("followup.created", { followupId:C.uid("fu"), subjectType:"deal", subjectId:dealId,
      owner:owner.value, dueDate:d, what: first.value.trim() || "Make first contact" });
    closeLayers("pop"); render();
    toast("Deal created with a next step on " + C.fmtFull(d) + ".");
    openDeal(dealId);
  }
  box.appendChild(h("div", { class:"note",
    text:"A new deal always gets a next step. That is the invariant, not a nag." }));
  box.appendChild(h("div", { class:"pop-foot" },
    h("button", { class:"btn btn-sm quiet", type:"button", onclick:function (){ closeLayers("pop"); } }, "Cancel"),
    h("button", { class:"btn btn-sm primary", type:"button", onclick:save }, "Create")));
  var pop = openPopover(anchor || $("#content") || document.body, box, { width:360 });
  co.focus();
}

/* ============================================================
   DEAL PANEL — slides over, so context is never lost
   ============================================================ */

function openSubject(f){
  if (f.subjectType === "deal") return openDeal(f.subjectId);
  go("companies");
}

function closePanel(){ closeLayers("panel"); App.openDealId = null; }

function openDeal(dealId){
  var d = App.st.deals[dealId];

  closeLayers("panel");
  var co = C.dealParty(App.st, d);
  var scrim = h("div", { class:"scrim", data:{ kind:"panel" }, onclick:closePanel });
  var panel = h("aside", { class:"panel", data:{ kind:"panel" }, role:"dialog",
                           "aria-label":"Deal — " + d.name, tabindex:"-1" });

  /* header */
  var head = h("header", null,
    h("div", { style:"display:flex;align-items:flex-start;gap:12px" },
      h("div", { style:"flex:1;min-width:0" },
        h("div", { class:"cohead", text: co.name || "No company" }),
        h("h3", { text:d.name }),
        /* The customer is the headline; the partner sits under it. Reversing
           these two is what makes a pipeline read as a list of resellers. */
        (d.partnerCompanyId && App.st.companies[d.partnerCompanyId]
          ? h("div", { class:"note", style:"margin:2px 0 0",

      render(); openDeal(d.id);
      toast("Moved to " + C.stageLabel(App.config, to) + ".");
    }});
  (App.config.stages||[]).forEach(function (s){ stageSel.appendChild(h("option", { value:s.id }, s.label)); });
  stageSel.value = d.stage;

  var headRow = h("div", { style:"display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap" });
  if (d.status === "open"){
    headRow.appendChild(stageSel);
    headRow.appendChild(h("button", { class:"btn btn-sm", type:"button",
      onclick:function (e){ logPopover(e.currentTarget, d); } }, "Log  l"));
    headRow.appendChild(h("button", { class:"btn btn-sm", type:"button",
      onclick:function (e){ nextStepPopover(e.currentTarget, d, null); } }, "Add next step"));
    headRow.appendChild(h("span", { class:"spacer" }));
    headRow.appendChild(h("button", { class:"btn btn-sm", type:"button",
      onclick:function (){ closeDeal(d, "won"); } }, "Won"));
    headRow.appendChild(h("button", { class:"btn btn-sm danger", type:"button",
      onclick:function (e){ closeDealPrompt(e.currentTarget, d); } }, "Lost"));
    headRow.appendChild(h("button", { class:"btn btn-sm quiet", type:"button",
      title:"For a deal that should never have existed — a duplicate or a typo. Not the same as Lost.",
      onclick:function (e){ deleteDealPrompt(e.currentTarget, d); } }, "Delete"));
  } else {
    headRow.appendChild(h("span", { class:"chip plain " + (d.outcome === "won" ? "" : "hot"),
      text: d.outcome === "won" ? "Won · " + C.fmtDayYear(d.closedAt) : "Lost · " + C.fmtDayYear(d.closedAt) }));
    if (d.lossReason) headRow.appendChild(h("span", { class:"chip plain", text:d.lossReason }));
    headRow.appendChild(h("button", { class:"btn btn-sm quiet", type:"button",
      onclick:function (){ emit("deal.reopened", { dealId:d.id }); render(); openDeal(d.id); } }, "Reopen"));
  }
  head.appendChild(headRow);
  panel.appendChild(head);

  var body = h("div", { class:"scroll" });

  /* facts */

  function fact(k, v){ kv.appendChild(h("dt", { text:k })); kv.appendChild(h("dd", { text:v })); }
  fact("Value", d.value == null ? "—" : C.fmtMoney(d.value, d.currency) + " " + (d.currency||""));
  fact("Expected close", d.expectedCloseDate ? C.fmtDayYear(d.expectedCloseDate) : "not set");
  fact("Owner", userName(d.owner) +
       (d.commissionable === false ? "  (no commission on this deal)" : ""));
  if (d.partnerCompanyId && App.st.companies[d.partnerCompanyId])
    fact("Partner", App.st.companies[d.partnerCompanyId].name);
  fact("In stage since", C.fmtDayYear(d.stageSince) + " · " + Math.abs(C.daysBetween(d.stageSince, App.today)) + " days");
  fact("Created", C.fmtDayYear(d.createdDay));
  body.appendChild(h("section", { class:"sec" }, h("h4", { text:"Deal" }), kv,
    h("div", { style:"margin-top:9px" },
      h("button", { class:"btn btn-sm", type:"button",
        onclick:function (e){ editDeal(e.currentTarget, d); } }, "Edit"))));

  /* flags — each with its rule on hover */
  var fl = App.flags[d.id] || [];

    fl.forEach(function (f){

  }

  /* follow-ups */

  var fusec = h("section", { class:"sec" }, h("h4", { text:"Next step" }));
  if (!openFus.length && d.status === "open"){

  var doneFus = fus.filter(function (f){ return f.status !== "open"; });
  if (doneFus.length)

  body.appendChild(fusec);

  /* timeline */
  var ix = C.interactionsFor(App.st, d.id);
  var tl = h("ul", { class:"tl" });
  if (!ix.length) tl.appendChild(h("li", null, h("div", { class:"what", text:"Nothing logged yet." })));
  ix.forEach(function (x){
    var ct = x.contactId && App.st.contacts[x.contactId];

  body.appendChild(h("section", { class:"sec" },
    h("h4", { text:"History" }),
    h("div", { style:"margin-bottom:9px;display:flex;gap:6px" },

        onclick:function (e){ logPopover(e.currentTarget, d); } }, "Log an interaction"),
      h("button", { class:"btn btn-sm", type:"button",

  /* contacts \u2014 the customer's, and the partner's where there is one. On a
     partner-led deal the partner's people are usually the only ones anybody has
     ever mailed, so a Contacts list scoped to the customer would be empty on

  var contactRow = function (c){

      h("div", { class:"t2", style:"font-family:var(--mono);font-size:11.5px;color:var(--muted)" },

  var cts  = allCts.filter(function (c){ return c.companyId === d.companyId; });

      csec.appendChild(plist);

  /* ---- money (C20) ---- */
  {
    var m = C.dealMoney(App.st, d);
    var msec = h("section", { class:"sec" });

      h("span", { class:"note",
        /* Three states, not two. "Nobody is paid on this" is a decision;

      h("span", { class:"spacer" }),
      h("button", { class:"btn btn-sm", type:"button",
        onclick:function (e){ invoicePopover(e.currentTarget, d, null); } }, "Raise invoice")));

    if (!m.invoices.length){
      msec.appendChild(h("div", { class:"note", style:"margin-top:8px",
        text: d.status === "closed" && d.outcome === "won"
          ? "Won and not invoiced. Nobody earns anything until this is raised."
          : "No invoices yet." }));
    } else {
      var mt = h("tbody");
      m.invoices.forEach(function (st_){
        var inv = st_.invoice;
        var late = inv.dueDate && st_.balance > 0 ? C.daysBetween(App.today, inv.dueDate) : null;
        mt.appendChild(h("tr", null,
          h("td", null,
            h("div", { text:(inv.number || "(no number)") + (st_.cancelled ? "  · cancelled" : "") }),
            h("div", { class:"note", text:"issued " + C.fmtDay(inv.issuedOn) +
              (inv.dueDate ? " · due " + C.fmtDay(inv.dueDate) : " · no due date") +
              (inv.passThrough ? " · incl " + C.fmtMoney(inv.passThrough, inv.currency) + " resale" : "") })),
          h("td", { class:"num", text:C.fmtMoney(st_.gross, inv.currency) }),
          h("td", { class:"num", text:C.fmtMoney(st_.paid, inv.currency) }),
          h("td", { class:"num",
                    style: st_.cancelled ? "color:var(--muted)"
                         : (late != null && late < 0) ? "color:var(--overdue);font-weight:600" : "",
                    text: st_.cancelled ? "\u2014" : C.fmtMoney(st_.balance, inv.currency) +
                          (late != null && late < 0 ? "  " + (-late) + "d late" : "") }),
          h("td", { class:"num", text: !m.hasRate ? "\u2014"
            : C.fmtMoney(C.round2(st_.commissionBase * m.rate), inv.currency) +
              (st_.settled ? "  earned" : "  pending") }),
          h("td", null,
            st_.cancelled ? null : h("button", { class:"btn btn-sm quiet", type:"button",
              onclick:(function (i){ return function (e){ paymentPopover(e.currentTarget, d, i); }; })(inv) },
              "Payment"),
            h("button", { class:"btn btn-sm quiet", type:"button",
              onclick:(function (i){ return function (e){ invoicePopover(e.currentTarget, d, i); }; })(inv) },
              "Edit"))));
      });
      msec.appendChild(h("table", { class:"tbl", style:"margin-top:8px" },
        h("thead", null, h("tr", null,
          h("th", { text:"Invoice" }), h("th", { class:"num", text:"Owed" }),
          h("th", { class:"num", text:"Paid" }), h("th", { class:"num", text:"Balance" }),
          h("th", { class:"num", text:"Commission" }), h("th", { text:"" }))), mt));

      var tot = h("dl", { class:"kv", style:"margin-top:8px" });
      var line = function (label, bag, hot){
        var txt = Object.keys(bag).map(function (c){ return C.fmtMoney(bag[c], c); }).join("  \u00b7  ");
        if (!txt) return;
        tot.appendChild(h("dt", { text:label }));
        tot.appendChild(h("dd", { text:txt, style: hot ? "color:var(--overdue);font-weight:600" : "" }));

           Object.keys(m.outstanding).some(function (c){ return m.outstanding[c] > 0; }));

      msec.appendChild(tot);
      if (m.hasRate)
        msec.appendChild(h("div", { class:"note",
          text:"Commission is " + pct(m.rate) + " of the invoice excluding VAT and excluding " +
               "resale items, earned only once an invoice is settled in full." }));
    }
    body.appendChild(msec);

  panel.appendChild(body);
  layerEl().appendChild(scrim);
  layerEl().appendChild(panel);
  panel.focus();
  panel.addEventListener("keydown", function (e){
    if (e.key === "Escape"){ closePanel(); }

}

function closeDeal(d, outcome, reason){
  emit("deal.closed", { dealId:d.id, outcome:outcome, reason:reason || "" });
  C.openFollowupsFor(App.st, d.id).forEach(function (f){
    emit("followup.cancelled", { followupId:f.id, reason:"deal " + outcome });
  });
  closeLayers(); render();
  toast(d.name + " marked " + outcome + ". The next-step invariant is released.");
}
function closeDealPrompt(anchor, d){
  var box = h("div");
  box.appendChild(h("h4", { text:"Mark lost — " + d.name }));
  var r = h("input", { type:"text", placeholder:"Why? (optional)", "aria-label":"Reason" });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Reason" }), r));
  box.appendChild(h("div", { class:"pop-foot" },
    h("button", { class:"btn btn-sm quiet", type:"button", onclick:function (){ closeLayers("pop"); } }, "Cancel"),
    h("button", { class:"btn btn-sm danger", type:"button",
      onclick:function (){ closeLayers("pop"); closeDeal(d, "lost", r.value.trim()); } }, "Mark lost")));
  openPopover(anchor, box);
}

/* Delete — for a deal that should never have existed.
   Lost is an outcome; this is a correction. Keeping them apart is the whole
   point, so the popover says which is which rather than assuming anyone
   remembers. It also counts what goes with the deal, because "delete" reads as
   harmless right up until it takes six logged conversations with it. */
function deleteDealPrompt(anchor, d){
  var ix = C.interactionsFor(App.st, d.id).length;
  var fu = C.openFollowupsFor(App.st, d.id).length;
  var co = C.dealParty(App.st, d);

  var box = h("div");
  box.appendChild(h("h4", { text:"Delete " + d.name + (co.name ? " (" + co.name + ")" : "") }));
  box.appendChild(h("div", { class:"note",
    text:"Use this for a duplicate or a typo — something that was never a real deal. " +
         "It will not count as a loss and will not appear in the win rate, the forecast " +
         "or the week retro." }));
  if (ix || fu){
    box.appendChild(h("div", { class:"note", style:"margin-top:8px;color:var(--overdue);font-weight:600",
      text:"This deal has " + (ix ? ix + " logged interaction" + (ix===1?"":"s") : "") +
           (ix && fu ? " and " : "") + (fu ? fu + " open next step" + (fu===1?"":"s") : "") +
           ". They go with it. If real work happened here, mark it Lost instead." }));
  }
  box.appendChild(h("div", { class:"note", style:"margin-top:8px",
    text:"Nothing is erased — the event log keeps the record, and Settings can put it back." }));
  var r = h("input", { type:"text", placeholder:"e.g. duplicate of the MetLife DCAM deal", "aria-label":"Reason" });
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Reason (optional)" }), r));
  box.appendChild(h("div", { class:"pop-foot" },
    h("button", { class:"btn btn-sm quiet", type:"button", onclick:function (){ closeLayers("pop"); } }, "Cancel"),
    h("button", { class:"btn btn-sm danger", type:"button", onclick:function (){
      closeLayers("pop"); deleteDeal(d, r.value.trim());
    } }, "Delete this deal")));
  openPopover(anchor, box);
}

function deleteDeal(d, reason){
  var name = d.name;
  emit("deal.deleted", { dealId:d.id, reason:reason || "" });
  closeLayers(); App.openDealId = null; render();
  toast(name + " deleted. It is not counted as lost.", null,
        { label:"Undo", fn:function (){
            emit("deal.restored", { dealId:d.id });
            render(); toast(name + " is back.");
          } });
}

function restoreDeal(id){
  emit("deal.restored", { dealId:id });
  render();
  toast("Restored.");
}

/* A rate reads as a percentage everywhere a person sees it, and is stored as a
   fraction everywhere a machine does. One helper, so the two never drift. */
function pct(rate){
  if (rate == null) return "\u2014";
  var n = rate * 100;
  return (Math.round(n * 10) / 10) + "%";
}

function invoicePopover(anchorEl, d, inv){
  var box = h("div");
  box.appendChild(h("h4", { text: inv ? "Edit invoice" : "Raise an invoice \u2014 " + d.name }));

  var num  = h("input", { type:"text", value: inv ? inv.number : "", placeholder:"e.g. MW-1043", "aria-label":"Invoice number" });
  var iss  = h("input", { type:"text", value: inv ? inv.issuedOn : App.today, "aria-label":"Issued" });
  var due  = h("input", { type:"text", value: inv && inv.dueDate ? inv.dueDate : "", placeholder:"e.g. +30 or 30 sep", "aria-label":"Due" });
  var cur  = h("select", { "aria-label":"Currency" });
  (App.config.currencies || ["ZAR"]).forEach(function (c){ cur.appendChild(h("option", { value:c }, c)); });
  cur.value = inv ? inv.currency : (d.currency || App.config.defaultCurrency || "ZAR");
  var net  = h("input", { type:"text", value: inv ? String(inv.net) : "", placeholder:"0.00", "aria-label":"Net" });
  var thru = h("input", { type:"text", value: inv ? String(inv.passThrough) : "", placeholder:"0.00", "aria-label":"Resale" });
  var vat  = h("input", { type:"text", value: inv ? String(inv.vat) : "", placeholder:"0.00", "aria-label":"VAT" });

  box.appendChild(h("div", { class:"row2" },
    h("label", { class:"fld" }, h("span", { text:"Invoice no." }), num),
    h("label", { class:"fld" }, h("span", { text:"Currency" }), cur)));
  box.appendChild(h("div", { class:"row2" },
    h("label", { class:"fld" }, h("span", { text:"Issued" }), iss),
    h("label", { class:"fld" }, h("span", { text:"Due" }), due)));
  box.appendChild(h("div", { class:"row2" },
    h("label", { class:"fld" }, h("span", { text:"Net (excl VAT)" }), net),
    h("label", { class:"fld" }, h("span", { text:"of which resale" }), thru)));
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"VAT" }), vat));

  var explain = h("div", { class:"note" });
  var repaint = function (){
    var n = C.money(net.value), t = C.money(thru.value), v = C.money(vat.value);
    var owed = C.round2(n + v), base = C.round2(n - t);
    var bits = ["Customer owes " + C.fmtMoney(owed, cur.value)];
    if (d.commissionRate != null)
      bits.push("commission base " + C.fmtMoney(base, cur.value) +
                " \u2192 " + C.fmtMoney(C.round2(base * d.commissionRate), cur.value) +
                " at " + pct(d.commissionRate) + ", once it is settled in full");
    else bits.push("no commission rate on this deal, so nothing is computed");
    if (t > n) bits.push("resale is more than the net \u2014 check the split");
    explain.textContent = bits.join(". ") + ".";
  };
  [net, thru, vat, cur].forEach(function (el){ el.addEventListener("input", repaint); el.addEventListener("change", repaint); });
  repaint();
  box.appendChild(explain);
  box.appendChild(h("div", { class:"note",
    text:"Resale is the part you collect for somebody else \u2014 books, exam coupons. It is inside the net, and it does not earn commission." }));

  var foot = h("div", { class:"pop-foot" },
    h("button", { class:"btn btn-sm quiet", type:"button", onclick:function (){ closeLayers("pop"); } }, "Cancel"));
  if (inv)
    foot.appendChild(h("button", { class:"btn btn-sm danger", type:"button", onclick:function (){
      closeLayers("pop");
      emit("invoice.cancelled", { invoiceId:inv.id, reason:"" });
      render(); openDeal(d.id);
      toast("Invoice cancelled. It stops counting towards anything.");
    } }, "Cancel invoice"));
  foot.appendChild(h("button", { class:"btn btn-sm primary", type:"button", onclick:function (){
    var payload = {
      dealId:d.id, number:num.value.trim(),
      issuedOn: C.parseDateInput(iss.value, App.today) || App.today,
      dueDate: due.value.trim() ? C.parseDateInput(due.value, App.today) : null,
      currency:cur.value, net:C.money(net.value),
      passThrough:C.money(thru.value), vat:C.money(vat.value)
    };
    closeLayers("pop");
    if (inv) emit("invoice.updated", Object.assign({ invoiceId:inv.id }, payload));
    else     emit("invoice.raised",  Object.assign({ invoiceId:C.uid("inv") }, payload));
    render(); openDeal(d.id);
    toast(inv ? "Invoice updated." : "Invoice raised." +
      (payload.dueDate ? "" : " No due date, so nothing will call it late."));
  } }, inv ? "Save" : "Raise"));
  box.appendChild(foot);
  openPopover(anchorEl, box);
}

function paymentPopover(anchorEl, d, inv){
  var s = C.invoiceState(App.st, inv);
  var box = h("div");
  box.appendChild(h("h4", { text:"Payment \u2014 " + (inv.number || "invoice") }));
  box.appendChild(h("div", { class:"note",
    text:"Owed " + C.fmtMoney(s.gross, inv.currency) + " \u00b7 paid " +
         C.fmtMoney(s.paid, inv.currency) + " \u00b7 balance " +
         C.fmtMoney(s.balance, inv.currency) }));

  var amt = h("input", { type:"text", value: s.balance > 0 ? String(s.balance) : "",
                         placeholder:"0.00", "aria-label":"Amount" });
  var on  = h("input", { type:"text", value:App.today, "aria-label":"Received on" });
  var ref = h("input", { type:"text", placeholder:"e.g. PO 88123", "aria-label":"Reference" });
  box.appendChild(h("div", { class:"row2" },
    h("label", { class:"fld" }, h("span", { text:"Amount" }), amt),
    h("label", { class:"fld" }, h("span", { text:"Received" }), on)));
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Reference" }), ref));

  var after = h("div", { class:"note" });
  var repaint = function (){
    var a = C.money(amt.value);
    var bal = C.round2(s.balance - a);
    var msg = bal <= 0 ? "Settles the invoice in full"
                       : C.fmtMoney(bal, inv.currency) + " would still be outstanding";
    if (d.commissionRate != null){
      msg += bal <= 0
        ? " \u2014 " + C.fmtMoney(C.round2(s.commissionBase * d.commissionRate), inv.currency) +
          " commission becomes earned for " + userName(d.owner)
        : ", so no commission is earned yet";
    }
    after.textContent = msg + ".";
  };
  amt.addEventListener("input", repaint); repaint();
  box.appendChild(after);

  var payments = C.paymentsFor(App.st, inv.id);
  if (payments.length){
    var pl = h("div", { style:"margin-top:8px" });
    payments.forEach(function (pay){
      pl.appendChild(h("div", { style:"display:flex;gap:8px;align-items:baseline;padding:3px 0" },
        h("span", { class:"note", text:C.fmtDay(pay.receivedOn) + " \u00b7 " +
          C.fmtMoney(pay.amount, inv.currency) + (pay.reference ? " \u00b7 " + pay.reference : "") }),
        h("span", { class:"spacer" }),
        h("button", { class:"btn btn-sm quiet", type:"button", onclick:(function (id){
          return function (){
            closeLayers("pop");
            emit("payment.removed", { paymentId:id });
            render(); openDeal(d.id);
            toast("Payment removed. Use this for a keying error, not a refund.");
          };
        })(pay.id) }, "Remove")));
    });
    box.appendChild(pl);
  }

  box.appendChild(h("div", { class:"pop-foot" },
    h("button", { class:"btn btn-sm quiet", type:"button", onclick:function (){ closeLayers("pop"); } }, "Cancel"),
    h("button", { class:"btn btn-sm primary", type:"button", onclick:function (){
      var a = C.money(amt.value);
      if (a <= 0){ toast("Enter an amount.", "err"); return; }
      closeLayers("pop");
      emit("payment.received", { paymentId:C.uid("pay"), invoiceId:inv.id,
        receivedOn: C.parseDateInput(on.value, App.today) || App.today,
        amount:a, reference:ref.value.trim() });
      render(); openDeal(d.id);
      var now = C.invoiceState(App.st, App.st.invoices[inv.id]);
      toast(now.settled ? "Settled in full." + (d.commissionRate != null
              ? " " + C.fmtMoney(C.round2(now.commissionBase * d.commissionRate), inv.currency) +
                " earned by " + userName(d.owner) + "."
              : "")
            : C.fmtMoney(now.balance, inv.currency) + " still outstanding.");
    } }, "Record payment")));
  openPopover(anchorEl, box);
}

function editDeal(anchor, d){
  var box = h("div");
  box.appendChild(h("h4", { text:"Edit deal" }));
  var nm = h("input", { type:"text", value:d.name, "aria-label":"Deal name" });
  var val = h("input", { type:"text", value:d.value == null ? "" : String(d.value), "aria-label":"Value" });
  var cur = h("select", { "aria-label":"Currency" });
  (App.config.currencies || ["ZAR"]).forEach(function (c){ cur.appendChild(h("option", { value:c }, c)); });
  cur.value = d.currency || "ZAR";
  var close = h("input", { type:"text", value:d.expectedCloseDate || "", placeholder:"e.g. 30 sep", "aria-label":"Expected close" });
  var owner = h("select", { "aria-label":"Owner" });
  var sellers2 = C.salesUsers(App.config);
  users().forEach(function (u){
    /* Everyone stays selectable here — a deal already filed to a non-seller has
       to be fixable, and the label says which is which rather than hiding it. */
    owner.appendChild(h("option", { value:u.id },
      userLabel(u.id) + (sellers2.length && sellers2.indexOf(u.id) < 0 ? "  (does not carry deals)" : "")));
  });
  owner.value = d.owner;
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Deal" }), nm));
  box.appendChild(h("div", { class:"row2" },
    h("label", { class:"fld" }, h("span", { text:"Value" }), val),
    h("label", { class:"fld" }, h("span", { text:"Currency" }), cur)));
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Expected close" }), close));
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Owner" }), owner));
  /* Per deal, by ruling — rates differ by what is being sold. Blank means no
     commission is computed at all, which is honest; a defaulted rate would be a
     number somebody eventually gets paid on. */
  var rate = h("input", { type:"text", "aria-label":"Commission %",
    value: d.commissionRate == null ? "" : String(Math.round(d.commissionRate * 1000) / 10),
    placeholder:"e.g. 5" });
  /* The label names whoever the Owner box currently says — it follows the
     select rather than the saved value, because this is the field that decides
     who gets paid and a stale name here is the worst kind of stale. */
  var rateLabel = h("span", { text:"Commission % to " + userName(owner.value || d.owner) });
  owner.addEventListener("change", function (){
    rateLabel.textContent = "Commission % to " + userName(owner.value);
  });
  var rateRow = h("label", { class:"fld" }, rateLabel, rate);
  box.appendChild(rateRow);

  /* Not every deal pays anybody. One the director carries himself has no
     earner, and a blank rate says "nobody has set this yet" rather than "there
     is nothing to set" — two different problems that want two different
     answers from whoever reads the deal in six weeks. */
  var noComm = h("input", { type:"checkbox" });
  noComm.checked = d.commissionable === false;
  var syncComm = function (){
    rateRow.style.opacity = noComm.checked ? "0.45" : "";
    rate.disabled = !!noComm.checked;
    if (noComm.checked) rate.value = "";
  };
  noComm.addEventListener("change", syncComm); syncComm();
  box.appendChild(h("label", { class:"fld chk" }, noComm,
    h("span", { text:"This deal pays no commission" })));

  /* The partner, where the work reaches the customer through somebody else.
     The deal stays the customer's — this only records who brought it. */
  var partner = h("select", { "aria-label":"Partner" });
  partner.appendChild(h("option", { value:"" }, "\u2014 direct, no partner \u2014"));
  Object.keys(App.st.companies).map(function (k){ return App.st.companies[k]; })
    .filter(function (c){ return c.id !== d.companyId && !c.isHolder; })
    .sort(function (a,b){
      if (!!b.isPartner !== !!a.isPartner) return b.isPartner ? 1 : -1;
      return a.name < b.name ? -1 : 1; })
    .forEach(function (c){
      partner.appendChild(h("option", { value:c.id },
        c.name + (c.isPartner ? "" : "  (not marked a partner)"))); });
  partner.value = d.partnerCompanyId || "";
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Via partner" }), partner));

  if (users().length < 2)
    box.appendChild(h("div", { class:"note", style:"color:var(--overdue)",
      text:"Only one person is in config.json, so there is nobody else to hand this to. " +
           "The roster lives in the repo — commit config.json and press Pull now in Settings." }));

  /* Whose deal is it? Only asked where the answer is not obvious — inside a
     holder company the person IS the customer, and without this the card is
     labelled with the bucket's name. */
  var holder = App.st.companies[d.companyId];
  var party = null;
  if (holder && holder.isHolder){
    party = h("select", { "aria-label":"Person" });
    party.appendChild(h("option", { value:"" }, "— nobody named —"));
    Object.keys(App.st.contacts).map(function (k){ return App.st.contacts[k]; })
      .filter(function (c){ return c.companyId === d.companyId; })
      .sort(function (a,b){ return a.name < b.name ? -1 : 1; })
      .forEach(function (c){ party.appendChild(h("option", { value:c.id }, c.name)); });
    party.value = d.contactId || "";
    box.appendChild(h("label", { class:"fld" },
      h("span", { text:"Person" }), party));
    box.appendChild(h("div", { class:"note",
      text:"“" + holder.name + "” holds individuals, so this deal is shown under the person's name." }));
  }

  box.appendChild(h("div", { class:"pop-foot" },
    h("button", { class:"btn btn-sm quiet", type:"button", onclick:function (){ closeLayers("pop"); } }, "Cancel"),
    h("button", { class:"btn btn-sm primary", type:"button", onclick:function (){
      var v = val.value.replace(/[^\d.\-]/g, "");
      var rp = rate.value.replace(/[^\d.]/g, "");
      /* Marking a company as a partner is a fact about that company, not about
         this deal, so it is recorded on the company where the next deal can
         find it. */
      if (partner.value && App.st.companies[partner.value] && !App.st.companies[partner.value].isPartner)
        emit("company.updated", { companyId:partner.value, isPartner:true });
      emit("deal.updated", { dealId:d.id, name:nm.value.trim() || d.name,
        value: v === "" ? null : +v, currency:cur.value, owner:owner.value,
        contactId: party ? (party.value || null) : d.contactId,
        partnerCompanyId: partner.value || null,
        commissionable: !noComm.checked,
        commissionRate: noComm.checked ? null : (rp === "" ? null : C.round2(+rp) / 100),
        expectedCloseDate: close.value.trim() ? C.parseDateInput(close.value, App.today) : null });
      closeLayers(); render(); openDeal(d.id);
    }}, "Save")));
  openPopover(anchor, box);
}

var ALL_FLAGS = ["Never contacted","No next step","Overdue","Pushed 3+","Silent 30d","Stalled","Close date passed"];

function viewPipeline(el){
  var filterBar = h("div", { style:"display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:16px" },
    h("span", { class:"band-head", style:"margin:0", text:"Filter" }));
  ALL_FLAGS.forEach(function (f){
    var n = 0;
    for (var k in App.flags) if ((App.flags[k]||[]).indexOf(f) >= 0){
      var d = App.st.deals[k];
      if (App.scope === "team" || (d && d.owner === App.me)) n++;
    }
    var b = h("button", { class:"chip filter " + (C.FLAG_TONE[f]||""), type:"button",
      title:C.flagRule(f, App.config),
      onclick:function (){ App.pipeFilter = App.pipeFilter === f ? null : f; render(); } },
      C.flagLabel(f, App.config) + " " + n);
    b.setAttribute("aria-pressed", App.pipeFilter === f ? "true" : "false");
    if (!n) b.disabled = true;
    filterBar.appendChild(b);
  });
  if (App.pipeFilter)
    filterBar.appendChild(h("button", { class:"btn btn-sm quiet", type:"button",
      onclick:function (){ App.pipeFilter = null; render(); } }, "Clear"));
  el.appendChild(filterBar);

  var board = h("div", { class:"board" });
  var deals = C.openDeals(App.st).filter(function (d){
    if (App.scope !== "team" && d.owner !== App.me) return false;
    if (App.pipeFilter && (App.flags[d.id]||[]).indexOf(App.pipeFilter) < 0) return false;
    return true;
  });

  (App.config.stages||[]).forEach(function (s){
    var mine = deals.filter(function (d){ return d.stage === s.id; });
    var totals = {};
    mine.forEach(function (d){ if (d.value) totals[d.currency||"ZAR"] = (totals[d.currency||"ZAR"]||0) + d.value; });
    var col = h("div", { class:"col" },
      h("div", { class:"h" },
        h("span", { text:s.label }),
        h("span", { class:"n", text:String(mine.length) }),
        h("span", { class:"spacer" }),
        h("span", { class:"mono", style:"font-size:10px;text-transform:none;letter-spacing:0",
          text: Object.keys(totals).map(function (c){ return C.fmtMoney(totals[c], c); }).join(" · ") })));
    var drop = h("div", { class:"drop", data:{ stage:s.id } });
    drop.addEventListener("dragover", function (e){ e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", function (){ drop.classList.remove("over"); });
    drop.addEventListener("drop", function (e){
      e.preventDefault(); drop.classList.remove("over");
      var id = e.dataTransfer.getData("text/plain");
      var d = App.st.deals[id];
      if (d && d.stage !== s.id){
        emit("deal.stage_changed", { dealId:id, from:d.stage, to:s.id });
        render();
        toast(d.name + " → " + s.label);
      }
    });
    mine.sort(function (a,b){ return (b.value||0) - (a.value||0); }).forEach(function (d){
      drop.appendChild(dealCard(d));
    });
    if (!mine.length) drop.appendChild(h("div", { class:"note", style:"padding:8px", text:"—" }));
    col.appendChild(drop);
    board.appendChild(col);
  });
  el.appendChild(board);

  var closed = Object.keys(App.st.deals).map(function (k){ return App.st.deals[k]; })
    .filter(function (d){ return d.status !== "open" && (App.scope === "team" || d.owner === App.me); })
    .sort(function (a,b){ return a.closedAt < b.closedAt ? 1 : -1; }).slice(0, 12);
  if (closed.length){
    var t = h("table", { class:"tbl" }, h("thead", null, h("tr", null,
      h("th", { text:"Company" }), h("th", { text:"Deal" }), h("th", { text:"Outcome" }),
      h("th", { text:"Closed" }), h("th", { class:"num", text:"Value" }))));
    var tb = h("tbody");
    closed.forEach(function (d){
      var co = C.dealParty(App.st, d);
      tb.appendChild(h("tr", { onclick:function (){ openDeal(d.id); } },
        h("td", { text:co.name }), h("td", { text:d.name }),
        h("td", { text:d.outcome === "won" ? "Won" : "Lost" + (d.lossReason ? " · " + d.lossReason : "") }),
        h("td", { class:"num", text:C.fmtDayYear(d.closedAt) }),
        h("td", { class:"num", text:d.value == null ? "—" : C.fmtMoney(d.value, d.currency) })));
    });
    t.appendChild(tb);
    el.appendChild(h("section", { style:"margin-top:26px" },
      h("div", { class:"band-head" }, h("span", { text:"Recently closed" })), t));
  }
}

function dealCard(d){
  var co = C.dealParty(App.st, d);
  var ofs = C.openFollowupsFor(App.st, d.id);
  var nx = ofs[0];
  var late = nx ? C.daysBetween(App.today, nx.dueDate) : null;
  var card = h("div", { class:"card", draggable:"true", tabindex:"0", data:{ deal:d.id },
                        onclick:function (){ openDeal(d.id); } },
    h("div", { class:"co", text:co.name || "—" }),
    h("div", { class:"nm", text:d.name }),
    h("div", { class:"val", text: d.value == null ? "—" : C.fmtMoney(d.value, d.currency) +
      (d.expectedCloseDate ? "  ·  " + C.fmtDay(d.expectedCloseDate) : "") }),
    nx
      ? h("div", { class:"next" + (late < 0 ? " od" : ""),
          title:nx.what + " — due " + C.fmtFull(nx.dueDate),
          text: (late < 0 ? "▸ " + (-late) + "d late · " : late === 0 ? "▸ today · " : "▸ " + C.fmtDay(nx.dueDate) + " · ") + nx.what })
      : h("div", { class:"next none", text:"▸ no next step" }),
    h("div", { class:"foot" }, chipsFor(d.id, 3),
      h("span", { class:"spacer" }),
      /* Two badges when the next step belongs to someone other than the deal's
         owner — the person who must ACT is the one you need to see, and on a
         card that reads "Howard" nobody chases Veronica for the invoice. */
      nx && nx.owner && nx.owner !== d.owner
        ? h("span", { class:"chip owner", style:"margin-right:4px",
                      text:initials(nx.owner),
                      title:"Next step: " + userName(nx.owner) })
        : null,
      h("span", { class:"chip owner", text:initials(d.owner),
                  title:"Deal owner: " + userName(d.owner) })));
  card.addEventListener("dragstart", function (e){
    e.dataTransfer.setData("text/plain", d.id);
    e.dataTransfer.effectAllowed = "move";
    card.classList.add("dragging");
  });
  card.addEventListener("dragend", function (){ card.classList.remove("dragging"); });
  card.addEventListener("keydown", function (e){
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openDeal(d.id); }
    if (e.key === "l"){ e.preventDefault(); logPopover(card, d); }
  });
  return card;
}

/* ============================================================
   COMPANIES & CONTACTS (P4)
   ============================================================ */

/* Fold one company record into another. Same reasoning as deleting a deal:
   two records for one customer is a mistake, not a fact, and it must not be
   recorded as anything that looks like a business event. Deals, contacts and
   therefore every logged interaction move across; nothing is thrown away. */
function mergeCompanyPrompt(anchor, co){
  var others = Object.keys(App.st.companies).map(function (k){ return App.st.companies[k]; })
    .filter(function (x){ return x.id !== co.id; })
    .sort(function (a,b){ return a.name < b.name ? -1 : 1; });
  if (!others.length){ toast("There is nothing else to merge into."); return; }

  var deals = Object.keys(App.st.deals).filter(function (k){
    return App.st.deals[k].companyId === co.id; }).length;
  var cts = Object.keys(App.st.contacts).filter(function (k){
    return App.st.contacts[k].companyId === co.id; }).length;

  var sel = h("select", { "aria-label":"Merge into" });
  others.forEach(function (x){
    var n = Object.keys(App.st.deals).filter(function (k){
      return App.st.deals[k].companyId === x.id; }).length;
    sel.appendChild(h("option", { value:x.id },
      x.name + " (" + n + " deal" + (n===1?"":"s") + ")"));
  });
  /* default to the same-named record, since that is almost always the case */
  var twin = others.filter(function (x){
    return String(x.name).trim().toLowerCase() === String(co.name).trim().toLowerCase(); })[0];
  if (twin) sel.value = twin.id;

  var box = h("div");
  box.appendChild(h("h4", { text:"Merge " + co.name + " into…" }));
  box.appendChild(h("div", { class:"note",
    text: deals + " deal" + (deals===1?"":"s") + " and " + cts + " contact" + (cts===1?"":"s") +
          " move across, with everything logged against them. “" + co.name +
          "” then stops appearing. Nothing is deleted and nothing is marked lost." }));
  box.appendChild(h("label", { class:"fld" }, h("span", { text:"Keep" }), sel));
  box.appendChild(h("div", { class:"pop-foot" },
    h("button", { class:"btn btn-sm quiet", type:"button",
      onclick:function (){ closeLayers("pop"); } }, "Cancel"),
    h("button", { class:"btn btn-sm primary", type:"button", onclick:function (){
      var intoId = sel.value;
      var into = App.st.companies[intoId];
      closeLayers("pop");
      emit("company.merged", { fromId:co.id, intoId:intoId });
      render();
      toast(co.name + " merged into " + (into ? into.name : "the other record") + ".", null,
        { label:"Undo", fn:function (){
            emit("company.unmerged", { fromId:co.id });
            render(); toast("Merge undone.");
          } });
    } }, "Merge")));
  openPopover(anchor, box);
}

/* Money — the book. Deliberately its own screen rather than more columns on the
   pipeline: selling and collecting are different jobs, often different people,
   and the questions are different too. "Who owes us?" and "what have I earned?"
   are asked on a Friday afternoon, not while working a deal. */
function viewMoney(el){
  var book = C.moneyBook(App.st, App.config, App.today,
                         { scope:App.scope, user:App.me });
  var bag = function (b){
    var t = Object.keys(b).filter(function (c){ return Math.abs(b[c]) >= 0.005; })
             .map(function (c){ return C.fmtMoney(b[c], c); }).join("  \u00b7  ");
    return t || "\u2014";
  };

  var top = h("section", { class:"pane", style:"margin-bottom:16px" },
    h("h3", { text: App.scope === "team" ? "The whole book" : "Your book" }));
  var kv = h("dl", { class:"kv" });
  [["Invoiced", book.invoiced, false],
   ["Paid", book.paid, false],
   ["Outstanding", book.outstanding, false],
   ["Overdue", book.overdue, true]].forEach(function (r){
    kv.appendChild(h("dt", { text:r[0] }));
    kv.appendChild(h("dd", { text:bag(r[1]),
      style: r[2] && Object.keys(r[1]).length ? "color:var(--overdue);font-weight:600" : "" }));
  });
  top.appendChild(kv);
  top.appendChild(h("div", { class:"note",
    text:"Currencies are never added together \u2014 each is shown as itself (C16)." }));
  el.appendChild(top);

  /* Overdue first, because it is the only part that is anybody's problem today */
  var od = h("section", { class:"pane", style:"margin-bottom:16px" },
    h("h3", { text:"Overdue" }),
    h("div", { class:"sub", text:"Past its due date with money still outstanding. Longest late first." }));

      if (deals.length){

          h("th", { text:"Owner" }), h("th", { class:"num", text:"Value" }))));
        var tb = h("tbody");
        deals.sort(function (a,b){
            if (co.isHolder){
              var pa = C.dealParty(App.st, a).name, pb = C.dealParty(App.st, b).name;
              if (pa !== pb) return pa < pb ? -1 : 1;
            }
            return a.status === b.status ? (a.name < b.name ? -1:1) : (a.status === "open" ? -1 : 1); })
          .forEach(function (d){
            var nx = C.openFollowupsFor(App.st, d.id)[0];

            var party = C.dealParty(App.st, d);
            tb.appendChild(h("tr", { onclick:function (){ openDeal(d.id); } },
              h("td", null,
                co.isHolder
                  ? h("div", { class:"note", style:"font-size:11.5px",
                      text: party.isIndividual ? party.name : "(nobody named)" })
                  : null,
                h("div", { text:d.name }), chipsFor(d.id, 3)),

                                 : (d.status === "open" ? "— no next step" : "—") }),
              h("td", { text:userName(d.owner) }),
              h("td", { class:"num", text:d.value == null ? "—" : C.fmtMoney(d.value, d.currency) })));
          });
        t.appendChild(tb);

      if (cts.length){

      if (hist.length){

          h("span", { class:"note",
            text: hist.length + " interaction" + (hist.length===1?"":"s") +
                  " across " + deals.length + " deal" + (deals.length===1?"":"s") +
                  (Object.keys(many).length > 1
                    ? " · " + Object.keys(many).length + " people" : "") }));
        sec.appendChild(head);
        var hl = h("div", { style:"margin-top:6px" });
        hist.slice(0, 12).forEach(function (e){
          hl.appendChild(h("div", { style:"padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer",

            h("div", { class:"note" },
              C.fmtDayYear(e.ix.occurredAt) + " · " + e.ix.kind + " · " + e.deal.name +
              (e.contact ? " · " + e.contact.name : "") +
              (e.ix.actor && e.ix.actor !== App.me ? " · logged by " + userName(e.ix.actor) : "")),
            h("div", { style:"font-size:13px", text:e.ix.summary })));
        });

  q.addEventListener("input", paint);
  paint();

/* ============================================================
   WEEK (C14a) — retrospective first, then forecast
   ============================================================ */

function viewWeek(el){
  var thisMon = C.startOfWeek(App.today);
  var lastMon = C.addDays(thisMon, -7), lastSun = C.addDays(thisMon, -1);
  var r = C.weekRetro(App.events, App.st, App.config, lastMon, lastSun, scopeOpts());
  var fc = C.forecast(App.st, App.config, App.today, scopeOpts());

  var halves = h("div", { class:"halves" });

  /* --- last week --- */
  var left = h("section", { class:"pane" },
    h("h3", { text:"Last week" }),
    h("div", { class:"sub", text:C.fmtDayYear(lastMon) + " → " + C.fmtDayYear(lastSun) }));
  function stat(lab, v, hot, title){
    left.appendChild(h("div", { class:"stat", title:title || "" },
      h("span", { class:"lab", text:lab }),
      h("span", { class:"v" + (hot ? " hot" : ""), text:String(v) })));
  }
  stat("Follow-ups completed", r.completed);
  stat("Interactions logged", r.logged, false, "Every flag on this page is computed from these.");
  stat("Follow-ups pushed", r.pushes, r.pushes > r.completed,
       "Rescheduling is never blocked. It is counted.");
  stat("Deals that lost their next step", r.declined, r.declined > 0,
       "Times someone chose “no next step yet”.");
  stat("New follow-ups created", r.created);
  stat("Won", r.won);
  stat("Lost", r.lost, r.lost > 0);
  if (Object.keys(r.wonValue).length)
    left.appendChild(h("div", { class:"stat" },
      h("span", { class:"lab", text:"Won value" }),
      h("span", { class:"v", text:Object.keys(r.wonValue).map(function (c){
        return C.fmtMoney(r.wonValue[c], c); }).join(" · ") })));

  var b = C.bands(App.st, App.config, App.today, scopeOpts());
  left.appendChild(h("div", { class:"trust" },
    r.pushes > r.completed
      ? h("span", null, h("strong", { text:"More was pushed than finished last week." }),
          " That is the number this page exists to show.")
      : h("span", null, h("strong", { text:"More was finished than pushed." }), " The discipline held."),
    h("div", { style:"margin-top:6px",
      text: b.noNextStep.length
        ? b.noNextStep.length + " open deal" + (b.noNextStep.length===1?"":"s") + " currently has no next step at all."
        : "Every open deal currently has a next step." })));
  halves.appendChild(left);

  /* --- forecast --- */
  var right = h("section", { class:"pane" },
    h("h3", { text:"Forecast" }),
    h("div", { class:"sub", text:"Open deals × fixed stage probability · currencies never converted" }));

  if (!fc.length){
    right.appendChild(h("div", { class:"note", text:"No open deals with a value." }));
  }
  fc.forEach(function (cur){
    right.appendChild(h("div", { class:"band-head", style:"margin-top:14px" },
      h("span", { text:cur.currency }),
      h("span", { class:"n", text:"· " + cur.count + " deal" + (cur.count===1?"":"s") })));
    var t = h("table", { class:"tbl" }, h("thead", null, h("tr", null,
      h("th", { text:"Close month" }), h("th", { class:"num", text:"Deals" }),
      h("th", { class:"num", text:"Gross" }), h("th", { class:"num", text:"Weighted" }))));
    var tb = h("tbody");
    cur.monthList.forEach(function (m){
      tb.appendChild(h("tr", null,
        h("td", null, h("span", { text:C.fmtMonth(m.key) }),
          m.passed ? h("span", { class:"chip hot", style:"margin-left:6px",
            title:C.flagRule("Close date passed", App.config),
            text: m.key === "none" ? "no date" : m.passed + " passed" }) : null),
        h("td", { class:"num", text:String(m.count) }),
        h("td", { class:"num", text:C.fmtMoney(m.gross, cur.currency) }),
        h("td", { class:"num", text:C.fmtMoney(m.weighted, cur.currency) })));
    });
    tb.appendChild(h("tr", null,
      h("td", null, h("strong", { text:"Total" })),
      h("td", { class:"num", text:String(cur.count) }),
      h("td", { class:"num", text:C.fmtMoney(cur.gross, cur.currency) }),
      h("td", { class:"num" }, h("strong", { text:C.fmtMoney(cur.weighted, cur.currency) }))));
    t.appendChild(tb);
    right.appendChild(t);

    right.appendChild(h("div", { class:"trust" },
      h("span", null,
        h("strong", { text:cur.atRiskPct + "%" }),
        " of this " + cur.currency + " weighted total (" + C.fmtMoney(cur.atRiskWeighted, cur.currency) +
        " across " + cur.atRiskCount + " deal" + (cur.atRiskCount===1?"":"s") +
        ") sits on a close date that has already passed, or on no close date at all."),
      h("div", { style:"margin-top:6px",
        text: cur.atRiskPct >= 25
          ? "Fix those dates before you repeat this number to anyone."
          : "The dates behind this number are mostly current." })));
  });

  right.appendChild(h("div", { class:"note", style:"margin-top:14px",
    text:"Probabilities are fixed per stage in config.json and are not editable per deal — a slider is where a forecast becomes a mood. " +
         "Different currencies are reported side by side and never summed at an invented rate." }));
  halves.appendChild(right);
  el.appendChild(halves);
}
