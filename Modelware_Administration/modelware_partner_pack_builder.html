<title>Modelware Partner Pack Builder</title>
<!-- Modelware Partner Pack Builder — v1.10.2 — build 2026-08-31 16:10 SAST -->
<style>
:root{
  --ink:#12212b; --ink-2:#3d5361; --line:#d8e2e8; --line-2:#eef3f6;
  --bg:#f4f7f9; --panel:#ffffff; --accent:#0f6d8c; --accent-2:#0b566f;
  --warm:#c2571f; --good:#1c7a54; --warn:#a8730c;
  --shadow:0 1px 2px rgba(18,33,43,.06),0 6px 20px rgba(18,33,43,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Segoe UI",Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5;overflow-x:hidden}
header.app{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
header.app .brand{font-weight:700;letter-spacing:.2px;font-size:15px}
header.app .sub{font-size:12px;opacity:.72}
header.app .spacer{flex:1}
header.app .ver{font-size:11px;font-family:var(--mono);background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:4px 10px;letter-spacing:.02em;white-space:nowrap}
.doc .stamp{font-size:10.5px;color:#8d9ea8;font-family:var(--mono);margin-top:3px}
.aboutbox{font-size:11.5px;color:var(--ink-2);background:#fbfdfe;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.aboutbox .v{font-family:var(--mono);font-weight:700;color:var(--ink)}
.aboutbox ul{margin:8px 0 0;padding-left:18px}
.aboutbox li{margin-bottom:4px}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid transparent;border-radius:6px;padding:8px 14px;cursor:pointer;background:var(--accent);color:#fff}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.light{background:#fff;color:var(--accent);border-color:var(--line)}
.btn.light:hover{background:var(--line-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.layout{display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr);gap:0;height:calc(100vh - 53px);max-width:100%;overflow:hidden}
.pane{overflow:auto;min-width:0;padding:18px 20px 60px}
.pane.left{border-right:1px solid var(--line);background:var(--panel)}
.pane.right{background:var(--bg)}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h2.sec:first-child{margin-top:4px}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.field .hint{font-size:11px;font-weight:400;color:#7c8f9a}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(15,109,140,.28);border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.models{display:grid;gap:8px}
.model-opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:7px;padding:10px;cursor:pointer;background:#fff}
.model-opt:hover{border-color:var(--accent)}
.model-opt.on{border-color:var(--accent);background:#f0f8fb;box-shadow:inset 0 0 0 1px var(--accent)}
.model-opt input{margin-top:3px}
.model-opt>span{display:block}
.model-opt .t{display:block;font-weight:700;font-size:13px}
.model-opt .d{display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--line-2);border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:11.5px;display:flex;align-items:center;gap:6px}
.chip button{border:0;background:none;cursor:pointer;color:var(--ink-2);font-size:13px;line-height:1;padding:0}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding-top:2px;z-index:5}
.tab{font:inherit;font-size:12.5px;font-weight:600;border:1px solid transparent;border-bottom:0;background:none;color:var(--ink-2);padding:8px 12px;border-radius:6px 6px 0 0;cursor:pointer}
.tab:hover{color:var(--accent)}
.tab.on{background:var(--panel);border-color:var(--line);color:var(--ink)}
.doc{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:44px 52px;max-width:860px;margin:0 auto 24px}
.doc h1{font-size:19px;margin:0 0 4px;letter-spacing:.2px}
.doc .docmeta{font-size:11.5px;color:#7c8f9a;margin-bottom:22px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.doc h2{font-size:14px;margin:22px 0 7px;color:var(--ink)}
.doc h3{font-size:12.5px;margin:16px 0 5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.doc p{margin:0 0 9px;text-align:justify}
.doc ul,.doc ol{margin:0 0 10px;padding-left:22px}
.doc li{margin-bottom:5px}
.doc table{border-collapse:collapse;width:100%;table-layout:auto;margin:6px 0 14px;font-size:12.5px}
.doc th,.doc td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.doc th{background:var(--line-2);font-weight:700}
.doc .note{background:#fff8e8;border-left:3px solid var(--warn);padding:9px 12px;font-size:12px;margin:0 0 16px;color:#5c4708}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:26px}
.doc .sigbox{border-top:1px solid var(--ink);padding-top:6px;font-size:12px;margin-top:44px}
.sheetwrap{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
  margin-bottom:18px;max-width:100%;width:fit-content;overflow:hidden}
.sheetscroll{overflow-x:auto;overflow-y:hidden;max-width:100%}
.sheethint{font-size:11px;color:#93a3ad;padding:6px 12px;border-top:1px solid var(--line-2)}
/* natural width, scrolling inside its own box — never squeezed until words break */
table.sheet{border-collapse:collapse;font-size:12px;width:max-content;max-width:none;table-layout:auto}
table.sheet th{white-space:nowrap;vertical-align:bottom}
table.sheet th,table.sheet td{border:1px solid var(--line);padding:5px 9px;vertical-align:top;
  white-space:normal;overflow-wrap:break-word;word-break:normal;hyphens:none;
  min-width:64px;max-width:300px}
table.sheet td.dt{white-space:nowrap;text-align:left;min-width:88px}
table.sheet td.num{white-space:nowrap;font-variant-numeric:tabular-nums;min-width:70px}
table.sheet td.fx{font-family:var(--mono);font-size:10.5px;color:#5d7280;max-width:260px;white-space:nowrap}
/* the key/value shape used for a single record */
table.sheet.kv{width:auto;max-width:100%}
table.sheet.kv td:first-child{min-width:180px;max-width:260px;font-weight:600;color:var(--ink-2);background:#fbfdfe}
table.sheet.kv td:last-child{max-width:560px}
/* Every value on every screen and every table starts at the same left edge.
   No exceptions — not numbers, not currency, not percentages, not dates. */
table.sheet th,
table.sheet td,
table.sheet td.num,
table.sheet td.dt,
table.sheet td.fx,
.doc th, .doc td{text-align:left}
table.sheet th{background:var(--ink);color:#fff;font-weight:600;text-align:left;position:sticky;top:0}
table.sheet tr.grp td{background:var(--line-2);font-weight:700}
.sheettitle{font-size:13px;font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);background:#fbfdfe}
.sheettitle .lead{display:block;font-weight:400;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.sheetfoot{font-size:11px;color:#7c8f9a;padding:8px 12px;border-top:1px solid var(--line-2);background:#fbfdfe;

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--line-2);

.pill.soft{background:#eaf6f1;color:var(--good);border-color:#c4e5d7}
.msg{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:7px;font-size:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;z-index:60;max-width:380px}

.msg.err{background:#8e2a20}
.disclaimer{background:#fff8e8;border:1px solid #f0dfb4;border-radius:7px;padding:10px 12px;font-size:11.5px;color:#5c4708;margin-bottom:14px}
.exportgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
details.adv{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:11px;background:#fbfdfe}
details.adv summary{font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer}
details.adv .body{padding-top:9px}
.overlay{position:fixed;inset:0;background:rgba(18,33,43,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:60px 20px;overflow:auto}
.dialog{background:#fff;border-radius:10px;max-width:520px;width:100%;padding:24px 26px;box-shadow:0 12px 40px rgba(18,33,43,.28)}
.dialog h3{margin:0 0 4px;font-size:17px}
.dialog .sub{font-size:12.5px;color:var(--ink-2);margin:0 0 18px}
.dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.flow{display:flex;gap:0;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.flow .step{flex:1 1 0;padding:9px 12px;border-right:1px solid var(--line-2);min-width:0}
.flow .step:last-child{border-right:0}
.flow .step .n{font-size:10px;font-weight:700;letter-spacing:.08em;color:#93a3ad;text-transform:uppercase}
.flow .step .t{font-size:12.5px;font-weight:700;margin-top:1px}
.flow .step .d{font-size:11px;color:var(--ink-2);margin-top:1px;line-height:1.35}
.flow .step.on{background:#f0f8fb;box-shadow:inset 0 -3px 0 var(--accent)}
.flow .step.on .n{color:var(--accent)}
.flow .step.done .t{color:#7c8f9a}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;margin-bottom:14px;box-shadow:var(--shadow)}
.filters input[type=text]{flex:1 1 260px;min-width:180px}
.filters select{flex:0 0 auto;width:auto;min-width:130px}
.filters .count{margin-left:auto;font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.rowacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stage{margin-bottom:16px}
.stage h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin:0 0 6px;display:flex;gap:8px;align-items:center}
.stage h3 .c{background:var(--line-2);border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;letter-spacing:0;text-transform:none}
.ghstatus{font-size:11.5px;padding:7px 9px;border-radius:5px;background:var(--line-2);color:var(--ink-2);border:1px solid var(--line);margin-top:8px;word-break:break-word}
.ghstatus.ok{background:#eaf6f1;color:#14603f;border-color:#c4e5d7}
.ghstatus.err{background:#fdeceb;color:#8e2a20;border-color:#f3c9c5}
.lineedit{border:1px solid var(--line);border-radius:7px;background:#fbfdfe;padding:2px 12px 10px;margin-bottom:11px}
.lerow{padding:11px 0;border-top:1px solid var(--line-2)}
.lerow:first-child{border-top:0}
.lerow.off{opacity:.5}
.lerow.tot{border-top:1px solid var(--line);padding-bottom:4px}
.lehead2{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lename{font-size:12.5px;font-weight:600;line-height:1.3}
.letot{font-size:12.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.legrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:7px}
.legrid label{display:block;min-width:0}
.legrid label span{display:block;font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;color:#93a3ad;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legrid label span em{font-style:normal;font-weight:400;text-transform:none;letter-spacing:0}
.legrid input{width:100%;font-size:12.5px;padding:6px 7px}
.lenote{font-size:11px;color:var(--ink-2);margin-top:6px;line-height:1.4}
.warnbox{background:#fff8e8;border:1px solid #f0dfb4;border-radius:6px;padding:8px 10px;font-size:11.5px;color:#5c4708;margin:8px 0}
.repolist{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.repolist .rowitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:11px 14px;border-bottom:1px solid var(--line-2)}
.repolist .rowitem .sub{overflow-wrap:anywhere}
.repolist .rowitem:last-child{border-bottom:0}
.repolist .nm{font-weight:700;font-size:13px}
.repolist .sub{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.repolist .empty{padding:22px 16px;text-align:center;color:#7c8f9a;font-size:12.5px}
.kvgrid{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px;margin-bottom:14px}
.kvgrid dt{font-weight:700;color:var(--ink-2)}
.kvgrid dd{margin:0}
.tierrow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
@media (max-width:960px){.layout{grid-template-columns:1fr;height:auto}.pane{height:auto}.doc{padding:26px 22px}}
@media print{header.app,.pane.left,.tabs,.bar{display:none}.layout{display:block;height:auto}.doc{box-shadow:none;border:0;page-break-after:always}}
</style>

  ["1.7.0","2026-08-31","Finding a partner made easy: connecting lands on the list, records missing from the register are read straight from the repository, and the list can be searched and filtered by stage and model. Contracts and the full pack download from the row itself, without leaving the list."],

  ["1.1.0","2026-08-31","Private GitHub sync: Repository tab, one JSON record per partner, generated register.json and README.md, sha-guarded writes."],
  ["1.0.0","2026-08-31","First build: four operating models, eight contract documents in .docx and .pdf, five-sheet partner account workbook, offline export engines."]

<script>
"use strict";
/* ------------------------------------------------------------- formatters */
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function dt(iso){ if(!iso) return "[date]"; var p=iso.split("-"); return parseInt(p[2],10)+" "+MONTHS[parseInt(p[1],10)-1]+" "+p[0]; }
function num(n,dp){ if(n===null||n===undefined||n==="") return "0"; dp=dp===undefined?0:dp;
  return Number(n).toFixed(dp).replace(/\B(?=(\d{3})+(?!\d))/g,","); }
function money(cur,n,dp){ return cur+" "+num(n,dp===undefined?0:dp); }
function pct(n){ return (Math.round(Number(n)*100)/100)+"%"; }
function words(n){ var w=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
  return (n>=0&&n<=12)?w[n]:String(n); }
function esc(s){ return String(s===null||s===undefined?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fb(v,ph){ return (v===null||v===undefined||String(v).trim()==="") ? ("["+ph+"]") : String(v).trim(); }
function territoryText(d){
  var c=d.territory.countries.slice();
  if(d.territory.description && d.territory.description.trim()) {
    return d.territory.description.trim() + (c.length?" ("+c.join(", ")+")":"");
  }
  if(!c.length) return "[Territory]";
  if(c.length===1) return c[0];
  return c.slice(0,-1).join(", ")+" and "+c[c.length-1];
}
function partyName(d){ return fb(d.partner.legalName,"Partner legal name"); }
function roleName(k){ return k==="LICENCE"?"Licensee":(k==="MASTER"?"Master Franchisee":(k==="FRANCHISE"?"Franchisee":"Partner")); }
function ourRole(k){ return k==="LICENCE"?"Licensor":(k==="ADP"?"Company":"Franchisor"); }
function gateDates(d){
  var out=[], start=d.term.commencementDate;
  GATES.forEach(function(g){
    var date = g.day===null ? addYears(start, Number(d.term.termYears)||2) : (g.day===0? d.term.agreementDate : addDays(start,g.day));
    out.push({key:g.key,label:g.label,type:g.type,obj:g.obj,ev:g.ev,date:date});
  });
  return out;
}
/* Phase 1 closes the set-up investment account if break-even has not arrived first */
function phase1End(d){
  if(d.inventory && d.inventory.phase1EndDate) return d.inventory.phase1EndDate;
  var m=(d.inventory&&Number(d.inventory.phase1Months))||12;
  return addDays(d.term.commencementDate, Math.round(m*30.44));
}
function lineApplies(d,l){
  if(l.when==="notMaster") return !(d.inventory||{}).partnerIsCdmpMaster;
  return true;
}
/* Every line reads the same way: quantity x unit price x rate.
   Melissa's first course is 2 delegates x USD 1,300 x 25% = USD 650. */
function lineQty(d,l){ return Number(l.qty)||0; }
function lineUnit(d,l){ return Number(l.rate)||0; }
function linePct(d,l){ return (l.pct===undefined||l.pct===null||l.pct==="") ? 100 : (Number(l.pct)||0); }
function lineValue(d,l){ return lineQty(d,l)*lineUnit(d,l); }
function lineAmount(d,l){
  if(!lineApplies(d,l)) return 0;
  return lineValue(d,l)*(linePct(d,l)/100);
}
function lineBasis(d,l){
  var q=lineQty(d,l), u=lineUnit(d,l), r=linePct(d,l);
  var s=num(q)+(l.qtyLabel?" "+l.qtyLabel:"")+" \u00d7 "+money(d.commercial.currency,u);
  if(r!==100) s+=" \u00d7 "+pct(r);
  return s;
}
function invLines(d){
  return (((d.inventory||{}).lines)||[]).filter(function(l){ return lineApplies(d,l); });
}
function invTotal(d,side){
  var i=d.inventory||{};
  if(side==="mws"){ var t=0; invLines(d).forEach(function(l){ t+=lineAmount(d,l); }); return t; }
  return (Number(i.partnerOnboarding)||0)+(Number(i.partnerSystems)||0);
}
function effRoyaltyRows(d){
  var rows=[["Base royalty (all training and advisory revenue)", pct(d.commercial.royaltyPct)]];
  (d.commercial.tiers||[]).forEach(function(t){
    if(t.from) rows.push(["Annual Gross Revenue above "+money(d.commercial.currency,t.from), pct(t.pct)]);
  });
  return rows;
}

/* ------------------------------------------------------ document assembly */

  sec("term","Term and renewal");

    "Run the standard evaluation instrument after every delivery and load results within five (5) business days.",
    "Maintain an average satisfaction score of at least "+d.quality.minSatisfaction+" out of 5, measured over a rolling four-delivery window.",
    "Advisory engagements follow the "+F.brand+" methodology, with the standard deliverable templates and a documented quality review before client issue."

    ["Delivery observation by a senior trainer", String(d.quality.auditsPerYear)+" per year", O],

    ["Advisory deliverable quality review", "Every engagement", R+", sampled by "+O],
    ["Compliance and brand audit", "Annually", O],
    ["Performance review meeting", d.commercial.reportFrequency, "Both Parties"]

  b.push(p("D3.1 Where a score falls below the minimum, or an audit is failed, the "+O+" issues a written remediation plan. The "+R+" implements it within thirty (30) (or, for a serious finding, fourteen (14)) days. Persistent failure is dealt with under "+cx("term2")+" of the Agreement."));

    ["Platform outage affecting a live delivery","1 hour","Same business day"],
    ["General partner support request", d.quality.responseSLAHours+" hours","5 business days"],
    ["Content query or correction","2 business days","Next content release"],
    ["Proposal or bid support","2 business days","By agreed bid date"],
    ["Escalation to senior management","2 business days","10 business days"]
  ]));

  b.push(p("D5.2 The "+R+" nominates a single accountable relationship owner and keeps that nomination current."));

  b.push(p("This Schedule forms part of the "+M.agreementTitle+" bearing reference "+refBase+"."));
  b.push(h2("E1. Year 1 minimum performance"));
  b.push(tbl(["Measure","Target"],[
    ["Gross Revenue, year 1", money(cur,d.targets.year1Revenue)],
    ["Courses delivered, year 1", String(d.targets.year1Courses)],
    ["Delegates trained, year 1", String(d.targets.year1Delegates)],
    ["Time to first sale, from onboarding completion", d.targets.ttfsDays+" days"],
    ["Expected break-even", d.targets.breakEvenMonths+" months from commencement"],
    ["Year 2 revenue growth", pct(d.targets.year2Growth)],
    ["Minimum satisfaction", d.quality.minSatisfaction+" / 5"],
    ["Compliance incidents", "Zero"]
  ]));
  b.push(h2("E2. Time-based review checkpoints"));
  b.push(p("Each checkpoint reviews evidence and produces a documented decision. Soft gates allow remediation; hard gates require a go / no-go decision."));
  var gr = g.map(function(x){ return [x.label, x.type+" gate", dt(x.date), x.obj]; });
  b.push(tbl(["Checkpoint","Gate","Scheduled","Objective"], gr));
  b.push(h2("E3. Evidence required at each checkpoint"));
  b.push(tbl(["Checkpoint","Evidence"], g.map(function(x){return [x.label, x.ev];})));
  b.push(h2("E4. Performance-triggered milestones"));
  b.push(tbl(["Milestone","Trigger","Gate","Decision"],[
    ["Operational readiness","Staff certified, systems live, launch plan approved — target within 60 days of signature","Soft","Confirm launch or extend onboarding with support"],
    ["First revenue","First paying engagement secured — target within "+d.targets.ttfsDays+" days","Soft","Confirm market fit or apply sales support"],
    ["Quality checkpoint","2–3 engagements delivered and evaluated","Soft","Confirm standards or issue remediation plan"],
    ["Sustained profitability","Break-even reached — expected by "+d.targets.breakEvenMonths+" months","Soft / Hard","Confirm viability or restructure territory and support"],
    ["Term performance review","Annual or at renewal","Hard","Renew, rescope, place on probation, or exit"]
  ]));
  b.push(h2("E5. Consequences"));
  b.push(ol([
    "Soft gate not met: written remediation plan, additional "+O+" support, and re-review within ninety (90) days.",
    "Hard gate not met: formal notice, ninety (90) day remediation period, and a documented go / no-go decision at the end of it.",
    "Two consecutive missed thresholds: conversion to non-exclusive status, Territory reduction, or opening of a segment to another partner.",
    "Material breach of quality or compliance: dealt with under "+cx("term2")+" of the Agreement, without the need for a gate.",
    "Sustained over-performance: eligibility for royalty band reduction, Territory expansion, new service lines and co-funded campaigns."
  ]));
  b.push(h2("E6. KPI scorecard"));
  b.push(p("The full KPI scorecard is maintained in the partner account workbook issued with this Agreement and is reviewed at each checkpoint. The headline measures are:"));
  b.push(tbl(["Dimension","Headline KPI","Target"],[
    ["Growth","Gross Revenue vs plan", money(cur,d.targets.year1Revenue)+" year 1, +"+pct(d.targets.year2Growth)+" year 2"],
    ["Quality","Average satisfaction", d.quality.minSatisfaction+" / 5"],
    ["Delivery","Courses and delegates", d.targets.year1Courses+" courses, "+d.targets.year1Delegates+" delegates"],
    ["Speed","Time to first sale", d.targets.ttfsDays+" days"],

  /* ====================================================== NDA */
  b=[];
  b.push(h1("MUTUAL NON-DISCLOSURE AGREEMENT"));
  b.push(note(REVIEW_NOTE));
  b.push(p("This Mutual Non-Disclosure Agreement is entered into on "+dt(d.term.agreementDate)+" between "+F.legalName+" of "+F.address+" and "+partyName(d)+" of "+fb(P.address,"Partner address")+" (each a “Party”)."));
  b.push(h2("1. Purpose"));
  b.push(p("1.1 The Parties wish to exchange confidential information in connection with the evaluation, negotiation and performance of a "+M.name+" relationship for "+terr+" (the “Purpose”)."));
  b.push(h2("2. Confidential Information"));
  b.push(p("2.1 “Confidential Information” means any information disclosed by one Party (“Discloser”) to the other (“Recipient”), in any form, that is marked confidential or that a reasonable person would understand to be confidential, including courseware, methodologies, pricing, financial models, partner and client lists, learner data, business plans, roadmaps and the terms of any agreement between the Parties."));
  b.push(p("2.2 Confidential Information does not include information that: (a) is or becomes public without breach of this Agreement; (b) the Recipient held free of restriction before disclosure; (c) is lawfully received from a third party without restriction; or (d) the Recipient independently develops without use of the Confidential Information."));
  b.push(h2("3. Obligations"));
  b.push(ol([
    "Use the Confidential Information solely for the Purpose.",
    "Keep it secret using at least the care it applies to its own confidential information, and never less than reasonable care.",
    "Disclose it only to personnel and professional advisers who need it for the Purpose and who are bound by equivalent obligations, remaining responsible for their compliance.",
    "Not copy, reverse engineer, or derive competing materials from it.",
    "Notify the Discloser promptly on becoming aware of any unauthorised disclosure and cooperate in limiting the consequences."

  b.push(h2("4. Compelled disclosure"));

  b.push(h2("5. No licence, no obligation"));
  b.push(p("5.1 All Confidential Information remains the property of the Discloser. No licence, assignment or other right is granted except the limited right to use it for the Purpose. Neither Party is obliged to disclose anything, or to proceed to any transaction."));
  b.push(h2("6. Personal information"));
  b.push(p("6.1 Where Confidential Information includes personal information, the Recipient processes it only for the Purpose, applies appropriate security safeguards, and complies with "+GOVERNING_LAW.dataAct+" and any applicable data protection law in the Territory."));
  b.push(h2("7. Duration and return"));
  b.push(p("7.1 This Agreement applies to disclosures made in the two (2) years from the date above, and the obligations in clause 3 continue for five (5) years from the date of each disclosure. Obligations relating to trade secrets and to personal information continue for as long as the law protects them."));
  b.push(p("7.2 On written request, or on the end of any partnership relationship between the Parties, the Recipient returns or irretrievably destroys all Confidential Information and certifies that it has done so, save for one archival copy retained for legal compliance and for copies held in routine backups that are not readily accessible."));
  b.push(h2("8. Remedies"));
  b.push(p("8.1 The Parties acknowledge that damages alone may not be an adequate remedy for breach, and that the Discloser is entitled to seek urgent interim relief in addition to any other remedy."));
  b.push(h2("9. General"));
  b.push(p("9.1 This Agreement is governed by "+GOVERNING_LAW.law+", and "+cx("law")+" of the "+M.agreementTitle+" (dispute resolution) applies to it as if set out in full."));
  b.push(p("9.2 It may be signed in counterparts and by electronic signature. No amendment is effective unless in writing and signed by both Parties."));
  b.push(sig(d));
  docs.push({id:"NDA", code:"07", title:"Mutual Non-Disclosure Agreement", subtitle:refBase+" — "+partyName(d), stamp:buildStamp(), blocks:b});

  /* ====================================================== DPA / AI ETHICS */
  b=[];
  b.push(h1("DATA PROTECTION AND AI ETHICS ADDENDUM"));
  b.push(note(REVIEW_NOTE+" Where the Territory is subject to the GDPR, the UK GDPR, the Saudi PDPL, the UAE PDPL, the Nigerian NDPA or a comparable regime, a jurisdiction-specific data processing agreement and transfer mechanism will usually be required in addition to this Addendum."));
  b.push(p("This Addendum forms part of the "+M.agreementTitle+" bearing reference "+refBase+" between "+F.legalName+" and "+partyName(d)+"."));
  b.push(h2("1. Roles"));
  b.push(p("1.1 In respect of learner records, enrolment data, assessment results and certification data held in "+fb(d.ops.lms,"the learning platform")+", the "+O+" is the responsible party (controller) and the "+R+" is the operator (processor) acting on documented instructions."));
  b.push(p("1.2 In respect of the "+R+"'s own client relationships, prospect lists and employees, the "+R+" is the responsible party in its own right and is solely accountable for that processing."));
  b.push(h2("2. Compliance"));
  b.push(ol([
    "Each Party complies with "+GOVERNING_LAW.dataAct+" and with every data protection law applicable in the Territory, whichever imposes the higher standard.",
    "The "+R+" collects only the personal information needed for the Services, retains it only as long as required, and does not use learner data for its own marketing without a lawful basis and a clear opt-out.",
    "The "+R+" implements appropriate technical and organisational security measures, including access control, encryption in transit, device security and staff confidentiality undertakings.",
    "The "+R+" does not transfer personal information across borders except as needed to use the "+O+"'s platforms, or where a lawful transfer mechanism is in place.",
    "The "+R+" assists the "+O+" with data subject requests within five (5) business days and does not respond directly on the "+O+"'s behalf.",
    "The "+R+" notifies the "+O+" of any security compromise affecting learner or client personal information without undue delay and in any event within twenty-four (24) hours of becoming aware of it.",
    "The "+R+" engages a sub-processor only with the "+O+"'s prior written consent and on terms no less protective than this Addendum."
  ]));
  b.push(h2("3. AI ethics standards"));
  b.push(p("3.1 The "+R+" may use artificial intelligence tools to support preparation, marketing and delivery of the Services, subject to the following standards, which reflect the "+F.brand+" position on responsible AI:"));
  b.push(ol([
    "No client, learner or employee personal information, and no client confidential material, may be entered into a public or consumer AI service.",
    "AI-generated content used with clients or learners is reviewed by a competent human before use, and the reviewer remains accountable for its accuracy.",
    "Material AI assistance in producing a client deliverable is disclosed to the client on request, and always where the client's own policy requires it.",
    "Accredited or examinable course content may not be regenerated or paraphrased by an AI tool; only the controlled source of truth may be delivered.",
    "The "+R+" does not present AI output as independent expert opinion, and does not use AI to generate testimonials, case studies, credentials or evaluation results.",
    "Where the "+R+" advises clients on AI governance, it applies the "+F.brand+" methodology and discloses any conflict of interest arising from tools it resells.",
    "The "+R+" keeps a record of AI tools used in delivery and makes it available at the annual compliance audit."
  ]));
  b.push(h2("4. Records and audit"));
  b.push(p("4.1 The "+R+" maintains a record of processing activities relating to the Services and makes it available to the "+O+" on reasonable request, and to a regulator where required by law."));
  b.push(p("4.2 The "+O+" may audit compliance with this Addendum once per year, as part of the compliance audit in Schedule D."));
  b.push(h2("5. End of relationship"));
  b.push(p("5.1 On termination of the Agreement, the "+R+" returns or deletes all personal information processed on the "+O+"'s behalf, subject to any retention required by law, and certifies deletion within thirty (30) days."));
  b.push(sig(d));
  docs.push({id:"DPA", code:"08", title:"Data Protection and AI Ethics Addendum", subtitle:refBase+" — "+partyName(d), stamp:buildStamp(), blocks:b});

  return docs;
}

  var files=[{name:"[Content_Types].xml",data:u8(ct)},{name:"_rels/.rels",data:u8(rels)},
             {name:"xl/workbook.xml",data:u8(wb)},{name:"xl/_rels/workbook.xml.rels",data:u8(wbr)},
             {name:"xl/styles.xml",data:u8(XL_STYLES)}];
  sheets.forEach(function(s,i){ files.push({name:"xl/worksheets/sheet"+(i+1)+".xml",data:u8(sheetXml(s))}); });
  return zipMake(files);
}
</script>
<script>
"use strict";
/* ================================================= PARTNER ACCOUNT WORKBOOK */
function buildWorkbook(d){
  var M=MODELS[d.modelKey], cur=d.commercial.currency, g=gateDates(d), sheets=[];

  /* ---- 1. Agreement Summary ---- */
  var r=[];

  function kv(k,v,st){ r.push([G(k),{t:(st===undefined?"s":"s"),v:v,s:7}]); }

  kv("Agreement title", M.agreementTitle);
  kv("Governing law", "Republic of South Africa");

  kv("Set-up investment (ours / theirs)", money(d.commercial.currency,invTotal(d,"mws"))+"  /  "+money(d.commercial.currency,invTotal(d,"partner")));
  kv("Shortfall recoverable from partner", d.inventory.recoverable?"Yes":"No");
  kv("Territory", territoryText(d));
  kv("Exclusivity", d.territory.exclusivity);
  kv("Sub-licensing", M.flags.subLicence?"Permitted, subject to approval":"Not permitted");
  kv("Authorised channels", d.territory.channels);
  r.push([]);
  r.push([G("Documents issued with this workbook")]);
  buildDocs(d).forEach(function(doc){ r.push([S(doc.code,7),S(doc.title,7)]); });
  r.push([]);
  var dgKeys=Object.keys(d.diligence||{}).filter(function(k){ var v=d.diligence[k];
    return v!==undefined && v!==null && String(v).trim()!==""; });
  kv("Onboarding questionnaire", dgKeys.length ? "Received — "+dgKeys.length+" of "+intakeFieldCount()+" questions answered"
                                               : "Not yet received");
  r.push([]);
  r.push([G("Build")]);
  kv("Builder version", "v"+APP_VERSION);
  kv("Builder build (SAST)", APP_BUILD);
  kv("This pack generated (SAST)", sastNow());
  r.push([]);
  r.push([{t:"s",v:"Generated by "+APP_NAME+" v"+APP_VERSION+" (build "+APP_BUILD+"). Contract drafts require review by a qualified legal practitioner before signature.",s:10}]);
  sheets.push({name:"Agreement Summary", cols:[34,62], rows:r});

  /* ---- 2. Partner Register ---- */
  var hdr=["Partner Ref","Legal Name","Trading Name","Registration No","VAT/Tax No","Country of Incorporation",
    "Registered Address","Territory","Countries","Operating Model","Exclusivity","Sub-licensing","Channels",
    "Lifecycle Stage","Status","Agreement Date","Commencement","Term (yrs)","Expiry","Renewal Notice (mo)",
    "Contact Name","Contact Role","Email","Phone","Website","Certified Trainers","Certification Standard",
    "LMS Instance","CRM Tenant","Operations Playbook","Onboarding (weeks)","Currency","Initial Fee",
    "Base Royalty %","Marketing %","Min Annual Royalty","Next Gate","Next Gate Date","Relationship Owner","Notes",
    "Phase 1 End Date","Our Set-up Investment","Partner Set-up Investment","Shortfall Recoverable"];
  var reg=[];
  reg.push([TT("Partner Account & Inventory Register")]);
  reg.push([{t:"s",v:"One row per partner. Copy the row format when adding partners; the register is the master inventory of partner accounts.",s:10}]);
  reg.push([]);
  reg.push(hdr.map(function(h){ return H(h); }));
  var nextGate = (typeof nextGateFor==="function") ? nextGateFor(d) : g.filter(function(x){ return x.key!=="PRE"; })[0];
  reg.push([
    S(fb(d.ref,"ref")), S(fb(d.partner.legalName,"legal name")), S(d.partner.tradingName), S(d.partner.regNo),
    S(d.partner.vatNo), S(d.partner.countryOfIncorporation), S(d.partner.address), S(territoryText(d)),
    S(d.territory.countries.join(", ")), S(M.name), S(d.territory.exclusivity),
    S(M.flags.subLicence?"Permitted":"Not permitted"), S(d.territory.channels),
    S("2. Onboarding & Training"), S(d.status||"Contracting"),
    DT(d.term.agreementDate), DT(d.term.commencementDate), N(d.term.termYears,9), DT(expiry),
    N(d.term.renewalNoticeMonths,9),
    S(d.partner.repName), S(d.partner.repRole), S(d.partner.email), S(d.partner.phone), S(d.partner.website),
    N(d.quality.minCertifiedTrainers,9), S(d.quality.certification), S(d.ops.lms), S(d.ops.crm), S(d.ops.playbook),
    N(d.ops.onboardingWeeks,9), S(cur), N(d.commercial.initialFee,4),
    N(Number(d.commercial.royaltyPct)/100,5), N(Number(d.commercial.marketingPct)/100,5),
    N(d.commercial.minAnnualRoyalty,4), S(nextGate?nextGate.label:""), DT(nextGate?nextGate.date:null),
    S(d.franchisor.repName), S(d.notes),
    DT(phase1End(d)), N(invTotal(d,"mws"),4), N(invTotal(d,"partner"),4), S(d.inventory.recoverable?"Yes":"No")
  ]);
  reg.push([]);
  reg.push([{t:"s",v:buildStamp(),s:10}]);
  reg.push([]);
  reg.push([G("Lifecycle stage reference")]);
  LIFECYCLE_STAGES.forEach(function(s){ reg.push([S(s[0],7),S(s[1],7)]); });
  sheets.push({name:"Partner Register", preview:"record", cols:hdr.map(function(h,i){ return i===6||i===12||i===26?38:(h.length<10?12:Math.min(26,h.length+6)); }), rows:reg, rowHeights:{3:30}});

  /* ---- 3. Commercial Model ---- */
  var c=[], row=0; function put(cells){ c.push(cells); row++; return row; }
  put([TT("Commercial Model & Royalty Calculator")]);                       /* 1 */
  put([{t:"s",v:fb(d.partner.legalName,"Partner")+"  —  "+M.name+"  —  all amounts in "+cur,s:10}]); /* 2 */
  put([]);                                                                  /* 3 */
  var rAssump=put([G("Assumptions"),G("Value"),G(""),G("")]);               /* 4 */
  var rCur   =put([S("Currency",7), S(cur,7)]);
  var rFee   =put([S("Initial fee",7), N(d.commercial.initialFee,4)]);
  var rBase  =put([S("Base royalty rate",7), N(Number(d.commercial.royaltyPct)/100,5)]);
  var t1=(d.commercial.tiers[0]||{from:0,pct:d.commercial.royaltyPct});
  var t2=(d.commercial.tiers[1]||{from:0,pct:d.commercial.royaltyPct});
  var rT1a  =put([S("Tier 1 revenue threshold",7), N(t1.from,4)]);
  var rT1b  =put([S("Tier 1 royalty rate",7), N(Number(t1.pct)/100,5)]);
  var rT2a  =put([S("Tier 2 revenue threshold",7), N(t2.from,4)]);
  var rT2b  =put([S("Tier 2 royalty rate",7), N(Number(t2.pct)/100,5)]);
  var rMkt  =put([S("Marketing contribution",7), N(Number(d.commercial.marketingPct)/100,5)]);
  var rMin  =put([S("Minimum annual royalty (from year 2)",7), N(d.commercial.minAnnualRoyalty,4)]);
  var rGM   =put([S("Partner delivery gross margin",7), N(0.55,5)]);
  var rFix  =put([S("Partner annual fixed operating cost",7), N(Math.round(Number(d.targets.year1Revenue)*0.28),4)]);
  var rGrow =put([S("Year-on-year revenue growth",7), N(Number(d.targets.year2Growth)/100,5)]);
  var rOvrR=0, rOvrP=0;
  if(M.flags.masterOverride){
    rOvrR=put([S("Sub-partner override rate",7), N(Number(d.commercial.overridePct)/100,5)]);
    rOvrP=put([S("Sub-partner network revenue (year 1)",7), N(0,4)]);
  }
  put([]);
  var rHdr=put([H("Line"),H("Year 1"),H("Year 2"),H("Year 3")]);
  var rRev=put([S("Gross revenue (plan)",7), N(d.targets.year1Revenue,4),
                Fx("B"+(rHdr+1)+"*(1+$B$"+rGrow+")"), Fx("C"+(rHdr+1)+"*(1+$B$"+rGrow+")")]);
  function tri(label,fA,style){
    var rn=c.length+1;
    var cells=[S(label,7)];
    ["B","C","D"].forEach(function(col){ cells.push(Fx(fA(col,rn),style===undefined?4:style)); });
    c.push(cells); return rn;
  }
  var rRate=tri("Applicable royalty rate",function(col,rn){
    return "IF("+col+rRev+">=$B$"+rT2a+",$B$"+rT2b+",IF("+col+rRev+">=$B$"+rT1a+",$B$"+rT1b+",$B$"+rBase+"))"; },5);
  var rRoy=tri("Royalty payable",function(col,rn){
    return "MAX("+col+rRev+"*"+col+rRate+",IF("+col+rRev+"=0,0,$B$"+rMin+"))"; });
  var rMktP=tri("Marketing contribution",function(col){ return col+rRev+"*$B$"+rMkt; });
  var rOvr=0;
  if(M.flags.masterOverride){ rOvr=tri("Sub-partner override",function(col){ return "$B$"+rOvrP+"*$B$"+rOvrR; }); }
  var rTot=tri("Total payable to "+d.franchisor.brand,function(col){
    return col+rRoy+"+"+col+rMktP+(rOvr?"+"+col+rOvr:""); });
  var rEff=tri("Effective total rate",function(col){ return "IF("+col+rRev+"=0,0,"+col+rTot+"/"+col+rRev+")"; },5);
  var rDel=tri("Partner delivery cost",function(col){ return col+rRev+"*(1-$B$"+rGM+")"; });
  var rFixC=tri("Partner fixed operating cost",function(col){ return "$B$"+rFix; });
  var rProf=tri("Partner operating profit",function(col){
    return col+rRev+"-"+col+rTot+"-"+col+rDel+"-"+col+rFixC; });
  var rMarg=tri("Partner net margin",function(col){ return "IF("+col+rRev+"=0,0,"+col+rProf+"/"+col+rRev+")"; },5);
  var rCum=c.length+1;
  c.push([S("Cumulative profit after initial fee",7),
          Fx("B"+rProf+"-$B$"+rFee), Fx("B"+rCum+"+C"+rProf), Fx("C"+rCum+"+D"+rProf)]);
  var rPay=c.length+1;
  c.push([S("Payback achieved",7),
          Fx('IF(B'+rCum+'>=0,"Yes","No")',7), Fx('IF(C'+rCum+'>=0,"Yes","No")',7), Fx('IF(D'+rCum+'>=0,"Yes","No")',7)]);
  c.push([]);
  var rFH=c.length+1; c.push([G(d.franchisor.brand+" view"),G("Year 1"),G("Year 2"),G("Year 3")]);
  var rFI=c.length+1; c.push([S("Income from this partner",7), Fx("B"+rTot), Fx("C"+rTot), Fx("D"+rTot)]);
  var rFC=c.length+1; c.push([S("Cumulative income incl. initial fee",7),
          Fx("B"+rFI+"+$B$"+rFee), Fx("B"+rFC+"+C"+rFI), Fx("C"+rFC+"+D"+rFI)]);
  c.push([]);
  c.push([{t:"s",v:buildStamp(),s:10}]);
  c.push([{t:"s",v:"The Assumptions block and the Gross revenue row for Year 1 are the only inputs. Every other figure is a live formula — change an assumption and the projection, the payback and the Modelware view all recalculate.",s:10}]);
  sheets.push({name:"Commercial Model", cols:[40,16,16,16], rows:c});

  /* ---- 4. Lifecycle Gates ---- */
  var lg=[];
  lg.push([TT("Lifecycle Gate Tracker")]);
  lg.push([{t:"s",v:"Soft gates allow remediation. Hard gates require a documented go / no-go decision.",s:10}]);
  lg.push([]);
  lg.push(["Checkpoint","Gate","Scheduled","Objective","Evidence required","Owner","Status","Actual date","Decision","Notes"].map(H));
  g.forEach(function(x){
    lg.push([S(x.label),S(x.type+" gate"),DT(x.date),S(x.obj),S(x.ev),
             S(d.franchisor.repName),S("Not started"),T(""),T(""),T("")]);
  });
  lg.push([]);
  lg.push([G("Performance-triggered milestones")]);
  lg.push(["Milestone","Trigger","Gate","Decision required","Status","Date achieved"].map(H));
  [["Operational readiness","Staff certified, systems live, launch plan approved (target 60 days)","Soft","Confirm launch or extend onboarding"],
   ["First revenue","First paying engagement secured (target "+d.targets.ttfsDays+" days)","Soft","Confirm market fit or apply sales support"],
   ["Quality checkpoint","2-3 engagements delivered and evaluated","Soft","Confirm standards or issue remediation plan"],
   ["Sustained profitability","Break-even reached (expected "+d.targets.breakEvenMonths+" months)","Soft / Hard","Confirm viability or restructure"],
   ["Term performance review","Annual or at renewal","Hard","Renew, rescope, probation or exit"]
  ].forEach(function(m){ lg.push([S(m[0]),S(m[1]),S(m[2]),S(m[3]),S("Not started"),T("")]); });
  lg.push([]);
  lg.push([G("Lifecycle stages")]);
  LIFECYCLE_STAGES.forEach(function(s){ lg.push([S(s[0],7),S(s[1],7)]); });
  lg.push([]);
  lg.push([{t:"s",v:buildStamp(),s:10}]);
  sheets.push({name:"Lifecycle Gates", cols:[34,14,14,52,52,20,16,14,26,30], rows:lg, rowHeights:{4:30}});

  /* ---- 5. KPI Scorecard ---- */
  var k=[];
  k.push([TT("Partner KPI Scorecard")]);
  k.push([{t:"s",v:"Enter the Actual column at each review. Variance and Status calculate automatically.",s:10}]);
  k.push([]);
  k.push(["Dimension","KPI","Unit","Better","Target","Actual","Variance","Status","Comment"].map(H));
  var lowerBetter=["days","months","count"];
  KPI_SETS.forEach(function(set){
    k.push([G(set[0]),G(""),G(""),G(""),G(""),G(""),G(""),G(""),G("")]);
    set[1].forEach(function(kpi){
      var unit=kpi[1], target=kpi[2];
      var better = (unit==="days"||unit==="months") ? "Lower"
                 : (kpi[0].indexOf("incident")>-1 ? "Lower" : "Higher");
      var rn=k.length+1;
      var tCell;
      if(target===null) tCell=T("");
      else if(unit==="%") tCell=N(target/100,5);
      else if(unit==="currency") tCell=N(target,4);
      else tCell=N(target,9);
      k.push([S(set[0]),S(kpi[0]),S(unit),S(better),tCell,
              (unit==="%"?{t:"n",v:null,s:5}:{t:"n",v:null,s:9}),
              Fx('IF(OR(E'+rn+'="",F'+rn+'=""),"",F'+rn+'-E'+rn+')',9),
              Fx('IF(F'+rn+'="","Not measured",IF(D'+rn+'="Higher",IF(F'+rn+'>=E'+rn+',"On target","Below target"),IF(F'+rn+'<=E'+rn+',"On target","Off target")))',7),
              T("")]);
    });
  });
  k.push([]);
  k.push([{t:"s",v:"Targets are drawn from Schedule E of the agreement and from the Modelware partner KPI framework.",s:10}]);
  k.push([]);
  k.push([{t:"s",v:buildStamp(),s:10}]);
  sheets.push({name:"KPI Scorecard", cols:[26,46,12,10,14,14,14,18,34], rows:k, rowHeights:{4:30}});

  /* ---- 6. Onboarding checklist ---- */
  var ob=[], rows=[];
  ONBOARDING_TASKS.forEach(function(grp){
    rows.push({grp:grp[0]});
    grp[1].forEach(function(t){
      rows.push({stage:grp[0].replace(/ \(.*$/,""), task:t[0], owner:t[1],
                 due:onboardingDue(d,t[2],t[3]),
                 gate:/hard gate/.test(grp[0])?"Hard":"Soft"});
    });
  });
  ob.push([TT("Partner Onboarding Checklist")]);
  ob.push([{t:"s",v:fb(d.partner.legalName,"Partner")+"  —  dates are calculated from the agreement and commencement dates; edit Status as you go.",s:10}]);
  ob.push([]);
  ob.push([G("Progress"),G("Count")]);
  /* placeholders — the ranges are only known once the table below is laid out */
  var sumRows={};
  ob.push([S("Tasks",7), N(rows.filter(function(x){ return !x.grp; }).length,9)]);
  ["Done","In progress","Not started","Blocked"].forEach(function(st){
    sumRows[st]=ob.length; ob.push([S(st,7), null]);
  });
  sumRows.__overdue=ob.length; ob.push([S("Overdue and not done",7), null]);
  ob.push([]);
  var HDR=ob.length+1;                                  /* 1-based row of the header */
  ob.push(["Stage","Task","Owner","Due","Gate","Status","Completed","Evidence / reference","Notes"].map(H));
  var START=HDR+1, END=HDR+rows.length;
  var rngStatus="$F$"+START+":$F$"+END, rngDue="$D$"+START+":$D$"+END;
  ["Done","In progress","Not started","Blocked"].forEach(function(st){
    ob[sumRows[st]][1]=Fx('COUNTIF('+rngStatus+',"'+st+'")',9);
  });
  ob[sumRows.__overdue][1]=Fx('SUMPRODUCT(('+rngStatus+'<>"Done")*('+rngStatus+'<>"N/A")*('+rngDue+'>0)*('+rngDue+'<TODAY()))',9);
  rows.forEach(function(x){
    if(x.grp){ ob.push([G(x.grp),G(""),G(""),G(""),G(""),G(""),G(""),G(""),G("")]); return; }
    ob.push([S(x.stage),S(x.task),S(x.owner),DT(x.due),S(x.gate),S("Not started"),T(""),T(""),T("")]);
  });
  ob.push([]);
  ob.push([{t:"s",v:"Status values: Not started · In progress · Done · Blocked · N/A",s:10}]);
  ob.push([{t:"s",v:buildStamp(),s:10}]);
  sheets.push({name:"Onboarding", cols:[34,58,12,13,10,14,13,30,34], rows:ob, rowHeights:(function(){var o={};o[HDR]=30;return o;})()});

  /* ---- 7. Inventory Account ---- */
  var inv=d.inventory||{}, iv=[], R2=(MODELS[d.modelKey]||MODELS.ADP).short;
  function ivRow(cells){ iv.push(cells); return iv.length; }
  function ivGrp(t){ return ivRow([G(t),G(""),G(""),G(""),G(""),G("")]); }
  function ivLedger(seed, blanks){
    var hdr=ivRow(["Date","Category","Type","Description","Qty","Unit price","Value",
                   "Rate","Amount","Recognised","Cumulative","Notes"].map(H));
    var first=hdr+1, LAST=first+seed.length+blanks-1, i;
    function calc(r){
      var rangeC="$C$"+first+":$C$"+LAST, rangeB="$B$"+first+":$B$"+LAST;
      return [
        Fx("E"+r+"*F"+r, 4),                                        /* Value  = qty x unit price */
        null,                                                       /* Rate   (filled by caller) */
        Fx("G"+r+"*IF(H"+r+'="",1,H'+r+")", 4),                     /* Amount = value x rate */
        /* a Budget line stops counting the moment an Actual exists for the same category */
        Fx('IF(C'+r+'="Actual",I'+r+',IF(COUNTIFS('+rangeC+',"Actual",'+rangeB+',B'+r+')>0,0,I'+r+'))', 4),
        Fx("SUM($J$"+first+":J"+r+")", 4)
      ];
    }
    seed.forEach(function(s2){
      var r=iv.length+1, c=calc(r);
      c[1]=N((Number(s2.pct===undefined?100:s2.pct))/100, 5);
      iv.push([DT(s2.date), S(s2.cat), S(s2.type||"Budget"), S(s2.desc),
               N(s2.qty,9), N(s2.unit,4)].concat(c).concat([S(s2.note||"")]));
    });
    for(i=0;i<blanks;i++){
      var r2=iv.length+1, c2=calc(r2);
      c2[1]=N(1,5);
      iv.push([T(""), T(""), T(""), T(""), {t:"n",v:null,s:9}, {t:"n",v:null,s:4}]
              .concat(c2).concat([T("")]));
    }
    var tot=ivRow([T(""),T(""),T(""),G("Total recognised"),T(""),T(""),T(""),T(""),
                   Fx("SUM(I"+first+":I"+LAST+")",4),
                   Fx("SUM(J"+first+":J"+LAST+")",4),T(""),T("")]);
    return {first:first,last:LAST,total:tot};
  }
  ivRow([TT("Inventory Account — set-up investment")]);
  ivRow([{t:"s",v:fb(d.partner.legalName,"Partner")+"  —  "+R2+"  —  all amounts in "+cur+
        ". Costs accumulate here until the account is repaid or Phase 1 ends, whichever comes first.",s:10}]);
  ivRow([]);
  ivGrp("Account terms");
  var rPhase=ivRow([S("Phase 1 End Date",7), DT(phase1End(d))]);
  ivRow([S("Closes on",7), S("The earlier of full recovery and the Phase 1 End Date",7)]);
  var rRecov=ivRow([S("Shortfall recoverable from partner",7), S(inv.recoverable?"Yes":"No",7)]);
  ivRow([S("Recovery period after statement (days)",7), N(inv.recoveryDays,9)]);
  ivRow([S("Statements issued",7), S(d.commercial.reportFrequency,7)]);
  ivRow([S("Partner holds CDMP Master",7), S(inv.partnerIsCdmpMaster?"Yes":"No",7)]);
  ivRow([S("Initial fee",7), S(Number(d.commercial.initialFee)>0?money(cur,d.commercial.initialFee):"None — no initial fee for this model",7)]);
  ivRow([]);
  ivGrp(d.franchisor.brand+" — investment in this partner");
  var seedM=invLines(d).map(function(l){
    return { date:d.term.agreementDate, cat:l.label, type:"Budget", desc:lineBasis(d,l),
             qty:lineQty(d,l), unit:lineUnit(d,l), pct:linePct(d,l), note:l.note||"" };
  });
  var LM=ivLedger(seedM, 16);
  ivRow([]);
  ivGrp(d.franchisor.brand+" — amounts received from this partner");
  var seedI = Number(d.commercial.initialFee)>0
    ? [{date:d.term.agreementDate, cat:"Initial fee", type:"Actual", desc:"Payable on signature",
        qty:1, unit:d.commercial.initialFee, pct:100}]
    : [];
  var LI=ivLedger(seedI, 18);
  ivRow([]);
  ivGrp("Position");
  var rInvT=ivRow([S("Total investment (recognised)",7), Fx("J"+LM.total,4)]);
  var rRecT=ivRow([S("Total received",7), Fx("J"+LI.total,4)]);
  var rNet =ivRow([S("Net position",7), Fx("B"+rRecT+"-B"+rInvT,4)]);
  var rDone=ivRow([S("Recovered?",7), Fx('IF(B'+rNet+'>=0,"Yes","No")',7)]);
  var rStat=ivRow([S("Account status",7),
    Fx('IF(B'+rDone+'="Yes","Closed - recovered",IF(TODAY()>=B'+rPhase+',"Closed - Phase 1 ended","Open"))',7)]);
  var rShort=ivRow([S("Shortfall at close",7), Fx("MAX(0,B"+rInvT+"-B"+rRecT+")",4)]);
  ivRow([S("Recoverable from the partner",7),
       Fx('IF(AND(B'+rRecov+'="Yes",B'+rStat+'="Closed - Phase 1 ended"),B'+rShort+',0)',4)]);
  ivRow([S("Recovery statement due by",7),

/* the spec, narrowed to the model being offered */
function intakeSectionsFor(d){
  var mk=(d&&d.modelKey)||"ADP", out=[];
  INTAKE_SECTIONS.forEach(function(s){
    var fs=s[2].filter(function(f){ return !f.m || f.m.indexOf(mk)>-1; });
    if(fs.length) out.push([s[0],s[1],fs]);
  });
  return out;
}
function intakeFieldCount(d){
  var n=0; intakeSectionsFor(d||D).forEach(function(s){ n+=s[2].length; }); return n;
}
function intakeFieldCountAll(){
  var n=0; INTAKE_SECTIONS.forEach(function(s){ n+=s[2].length; }); return n;
}
function intakeRequiredCount(d){
  var n=0; intakeSectionsFor(d||D).forEach(function(s){ s[2].forEach(function(f){ if(f.req) n++; }); }); return n;
}
/* value already known to us, used to pre-fill the form we send out */
function intakePrefill(d){
  var out={};
  intakeSectionsFor(d).forEach(function(s){
    s[2].forEach(function(f){
      var v=pGet(d,f.p);
      if(v===undefined||v===null||v==="") return;
      if(f.t==="countries") v=(Array.isArray(v)?v:[v]).join(", ");
      out[f.p]=v;
    });
  });
  return out;
}
/* answers -> a builder data object */
function intakeToData(answers,base){
  var d=base||blankModel(), k, f, map={};
  INTAKE_SECTIONS.forEach(function(s){ s[2].forEach(function(x){ map[x.p]=x; }); });
  for(k in answers){
    if(!Object.prototype.hasOwnProperty.call(answers,k)) continue;
    f=map[k]; var v=answers[k];
    if(v===undefined||v===null) continue;
    if(f && f.t==="countries"){
      v=String(v).split(",").map(function(x){ return x.trim(); }).filter(function(x){ return x.length; });
    } else if(f && f.t==="number"){
      v=(String(v).trim()==="")?"":Number(v);
      if(v!=="" && isNaN(v)) continue;
    }
    if(v==="" ) continue;
    pSet(d,k,v);
  }
  if(!d.status || d.status==="Prospect" || d.status==="Contracting") d.status="Due diligence";
  return d;
}

<script>
"use strict";
/* ==========================================================================
   GITHUB SYNC — private repo, one JSON per partner plus a generated register.
   Uses the GitHub Contents REST API directly. No libraries, no OAuth flow.
   The rest of the app stays fully offline; only these calls touch the network.
   ========================================================================== */
var GH = {
  owner:"modelwaresystems-dama",
  repo:"modelware_app_storage",
  folder:"modelware_businesspartner_data",
  branch:"main",
  token:"",
  remember:false,
  apiBase:"https://api.github.com",
  connected:false,
  login:"",
  files:[],        /* [{slug,path,sha,name}] from partners/ */
  entries:{},      /* slug -> register entry, cached to avoid refetching */
  status:"Not connected",
  statusKind:"",   /* "", "ok", "err" */
  busy:false
};
var LS_CFG="mwpp.gh.cfg", LS_TOK="mwpp.gh.token";
var PARTNER_DIR="partners";
var SCHEMA_PARTNER="modelware-partner/1";
var SCHEMA_REGISTER="modelware-partner-register/1";

function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ window.localStorage.removeItem(k); }catch(e){} }
function ghLoadCfg(){
  try{
    var raw=lsGet(LS_CFG); if(raw){ var c=JSON.parse(raw);
      if(c.owner) GH.owner=c.owner; if(c.repo) GH.repo=c.repo;
      if(c.branch) GH.branch=c.branch; if(c.folder!==undefined) GH.folder=c.folder; GH.remember=!!c.remember; }
    if(GH.remember){ var t=lsGet(LS_TOK); if(t) GH.token=t; }
  }catch(e){}
}
function ghSaveCfg(){
  lsSet(LS_CFG, JSON.stringify({owner:GH.owner,repo:GH.repo,folder:GH.folder,branch:GH.branch,remember:GH.remember}));
  if(GH.remember && GH.token) lsSet(LS_TOK,GH.token); else lsDel(LS_TOK);
}
function ghForgetToken(){ GH.token=""; GH.remember=false; GH.connected=false; GH.files=[]; GH.entries={};
  lsDel(LS_TOK); ghSaveCfg(); ghSetStatus("Token cleared from this device.",""); }

function ghSetStatus(msg,kind){ GH.status=msg; GH.statusKind=kind||""; renderGhStatus(); }
function renderGhStatus(){
  var el=document.getElementById("ghStatus");
  if(el){ el.textContent=GH.status;
    el.className="ghstatus"+(GH.statusKind==="ok"?" ok":(GH.statusKind==="err"?" err":"")); }
  var el2=document.getElementById("ghStatus2");
  if(el2){ el2.textContent=GH.status;
    el2.className="ghstatus"+(GH.statusKind==="ok"?" ok":(GH.statusKind==="err"?" err":"")); }
}

/* -------------------------------------------------------------- base64 */
function bytesToB64(bytes){
  var s="",chunk=0x8000,i;
  for(i=0;i<bytes.length;i+=chunk) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  return btoa(s);
}
function strToB64(str){ return bytesToB64(u8(str)); }
function b64ToStr(b64){
  var bin=atob(String(b64||"").replace(/\s+/g,"")), n=bin.length, arr=new Uint8Array(n), i;
  for(i=0;i<n;i++) arr[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(arr);
}
function slugify(s){
  return String(s||"").toLowerCase().normalize? String(s||"").toLowerCase().normalize("NFKD")
      .replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,64)
    : String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-");
}
function partnerSlug(d){
  return d.slug && String(d.slug).trim() ? slugify(d.slug)
       : (slugify(d.partner.legalName||d.partner.tradingName||d.ref||"partner") || "partner");
}

/* ----------------------------------------------------------- API client */
/* Only headers GitHub lists in Access-Control-Allow-Headers may be sent from a
   browser. Authorization and Content-Type are on that list; X-GitHub-Api-Version
   is NOT — sending it makes the CORS preflight fail and every call dies with
   "Failed to fetch" before it leaves the machine. Do not add headers here. */
function ghApi(path,opts){
  opts=opts||{};
  var headers={"Accept":"application/vnd.github+json"};
  if(GH.token) headers["Authorization"]="Bearer "+GH.token;
  var init={method:opts.method||"GET",headers:headers,cache:"no-store"};
  if(opts.body){ headers["Content-Type"]="application/json"; init.body=JSON.stringify(opts.body); }
  var url=GH.apiBase+path;
  return fetch(url,init).then(function(res){
    return res.text().then(function(txt){
      var json=null; try{ json=txt?JSON.parse(txt):null; }catch(e){}
      return {ok:res.ok,status:res.status,json:json,text:txt,url:url};
    });
  }).catch(function(e){
    return {ok:false,status:0,json:null,text:"",url:url,netErr:String(e&&e.message||e)};
  });
}
function ghErr(r,what){
  if(r.status===0){
    return "The browser could not reach "+GH.apiBase+" at all ("+(r.netErr||"network error")+
      "). Nothing was sent. This is a network or CORS failure rather than a GitHub error: check you are online, "+
      "and that no proxy or extension is blocking api.github.com.";
  }
  if(r.status===401) return "GitHub rejected the token (401). Check it has not expired.";
  if(r.status===403) return "Forbidden (403). The token is missing Contents: Read and write on this repository.";
  if(r.status===404) return "Not found (404): "+what+". Check the owner, repository name and that the token can see this private repo.";
  if(r.status===409||r.status===422) return "Conflict: the file changed in GitHub since it was read. Refresh, reopen the partner, and reapply your changes.";
  var m=(r.json&&r.json.message)?r.json.message:("HTTP "+r.status);
  return what+" failed: "+m;
}
function ghFolder(){
  return String(GH.folder||"").replace(/\\/g,"/").replace(/^\/+|\/+$/g,"");
}
function ghPathFor(p){ var f=ghFolder(); return (f?f+"/":"")+p; }
function ghContentPath(p){ return "/repos/"+GH.owner+"/"+GH.repo+"/contents/"+encodeURI(p); }
function ghWebUrl(p){
  return "https://github.com/"+GH.owner+"/"+GH.repo+"/tree/"+encodeURIComponent(GH.branch)+"/"+encodeURI(p||ghFolder());
}
/* a repo pasted as "repo/folder" or "repo\folder" is split, not sent as one name */
function ghNormalise(){
  var r=String(GH.repo||"").replace(/\\/g,"/").replace(/^\/+|\/+$/g,"");
  if(r.indexOf("/")>-1){
    var parts=r.split("/");
    GH.repo=parts.shift();
    var rest=parts.join("/");
    if(rest) GH.folder=ghFolder()?rest:rest;
    return true;
  }
  GH.repo=r;
  return false;
}
function ghGetFile(p){
  return ghApi(ghContentPath(p)+"?ref="+encodeURIComponent(GH.branch));
}
function ghPutFile(p,text,message,sha){
  var body={message:message,content:strToB64(text),branch:GH.branch};
  if(sha) body.sha=sha;
  return ghApi(ghContentPath(p),{method:"PUT",body:body});
}

/* ------------------------------------------------------------- connect */
function ghConnect(){
  if(GH.busy) return Promise.resolve();
  if(!GH.owner||!GH.repo){ ghSetStatus("Enter the repository owner and name.","err"); return Promise.resolve(); }
  if(!GH.token){ ghSetStatus("Paste a fine-grained token with Contents: Read and write on this repository.","err"); return Promise.resolve(); }
  var split=ghNormalise();
  GH.busy=true; ghSetStatus("Connecting to "+GH.owner+"/"+GH.repo+(ghFolder()?" · "+ghFolder()+"/":"")+"…","");
  return ghApi("/repos/"+GH.owner+"/"+GH.repo).then(function(r){
    if(!r.ok){ GH.connected=false; throw new Error(ghErr(r,"repository "+GH.owner+"/"+GH.repo)); }
    if(r.json && r.json.default_branch && !GH.branch) GH.branch=r.json.default_branch;
    GH.connected=true;
    ghSaveCfg();
    return ghRefresh(true).then(function(){
      if(split) ghSetStatus(GH.status+" (the folder was split out of the repository name for you.)",GH.statusKind);
    });
  }).catch(function(e){
    GH.connected=false; ghSetStatus(e.message||String(e),"err");
  }).then(function(){ GH.busy=false; if(GH.connected) activeTab="REPO"; refresh(); });
}
function ghRefresh(quiet){
  if(!GH.connected){ ghSetStatus("Connect first.","err"); return Promise.resolve(); }
  if(!quiet) ghSetStatus("Reading the repository…","");
  return ghApi(ghContentPath(ghPathFor(PARTNER_DIR))+"?ref="+encodeURIComponent(GH.branch)).then(function(r){
    if(r.status===404){ GH.files=[];
      ghSetStatus("Connected to "+GH.owner+"/"+GH.repo+" — nothing at "+ghPathFor(PARTNER_DIR)+"/ yet. Saving a partner will create it.","ok");
      return; }
    if(!r.ok) throw new Error(ghErr(r,ghPathFor(PARTNER_DIR)+"/"));
    var list=Array.isArray(r.json)?r.json:[];
    GH.files=list.filter(function(x){ return x.type==="file" && /\.json$/i.test(x.name); })
      .map(function(x){ return {name:x.name, slug:x.name.replace(/\.json$/i,""), path:x.path, sha:x.sha}; })
      .sort(function(a,b){ return a.slug<b.slug?-1:1; });
    ghSetStatus("Connected to "+GH.owner+"/"+GH.repo+" ("+GH.branch+") · "+ghPathFor(PARTNER_DIR)+"/ — "+GH.files.length+" partner"+(GH.files.length===1?"":"s")+" on file.","ok");
    return ghLoadRegister().then(function(){
      var missing=GH.files.filter(function(x){ return !GH.entries[x.slug]; });
      if(!missing.length) return;
      ghSetStatus("Reading "+missing.length+" partner record"+(missing.length===1?"":"s")+" the register does not cover…","");
      var chain=Promise.resolve(), done=0;
      missing.slice(0,60).forEach(function(fr){
        chain=chain.then(function(){
          return ghReadPartner(fr.path).then(function(rec){
            if(rec) GH.entries[fr.slug]=registerEntry(rec,fr.slug);
            done++;
            ghSetStatus("Reading partner records… "+done+" of "+missing.length,"");
          });
        });
      });
      return chain.then(function(){
        ghSetStatus("Connected to "+GH.owner+"/"+GH.repo+" ("+GH.branch+") · "+ghPathFor(PARTNER_DIR)+"/ — "+
          GH.files.length+" partner"+(GH.files.length===1?"":"s")+" on file.","ok");
      });
    });
  }).catch(function(e){ ghSetStatus(e.message||String(e),"err"); })
    .then(function(){ if(!quiet) refresh(); });
}

/* ---------------------------------------------------- record read/write */
function partnerRecord(d){
  return { schema:SCHEMA_PARTNER, slug:partnerSlug(d),
           updatedAt:new Date().toISOString(), updatedAtSAST:sastNow(),
           builder:{ name:APP_NAME, version:APP_VERSION, build:APP_BUILD },
           data:d };
}
var SCHEMA_INTAKE="modelware-partner-intake/1";
function recordToData(obj){
  if(obj && obj.schema===SCHEMA_INTAKE && obj.answers) return intakeToData(obj.answers, blankModel());
  if(obj && obj.answers && !obj.partner_) return intakeToData(obj.answers, blankModel());
  if(obj && obj.schema===SCHEMA_PARTNER && obj.data) return obj.data;
  if(obj && obj.data && obj.data.partner) return obj.data;
  return obj;
}
function mergeIntoBlank(obj){
  var base=blankModel(), k, j;
  obj=obj||{};
  for(k in base){
    if(obj[k]===undefined) continue;
    if(base[k] && typeof base[k]==="object" && !Array.isArray(base[k]) &&
       obj[k] && typeof obj[k]==="object" && !Array.isArray(obj[k])){
      for(j in obj[k]){ if(obj[k][j]!==undefined) base[k][j]=obj[k][j]; }   /* keep new fields the record predates */
    } else { base[k]=obj[k]; }
  }
  if(!MODELS[base.modelKey]) base.modelKey="ADP";
  if(!Array.isArray(base.territory.countries)) base.territory.countries=[];
  if(!Array.isArray(base.commercial.tiers)) base.commercial.tiers=[];
  if(!base.inventory || !Array.isArray(base.inventory.lines) || !base.inventory.lines.length){
    base.inventory=base.inventory||{};
    base.inventory.lines=costLinesFor(base.modelKey==="ADP"?"ADP":"DEFAULT");   /* records that predate cost lines */
  }
  return base;
}
/* the next checkpoint that has not fallen due yet — this is what makes the register useful */
function nextGateFor(d){
  var g=gateDates(d), today=todayISO(), i;
  for(i=0;i<g.length;i++){ if(g[i].key!=="PRE" && g[i].date>=today) return g[i]; }
  return g[g.length-1]||null;
}
function ghOpen(slug, keepTab){
  var fileRec=GH.files.filter(function(x){return x.slug===slug;})[0];
  if(!fileRec){ ghSetStatus("Unknown partner file.","err"); return Promise.resolve(); }
  ghSetStatus("Opening "+slug+"…","");
  return ghGetFile(fileRec.path).then(function(r){
    if(!r.ok) throw new Error(ghErr(r,fileRec.path));
    if(!r.json || !r.json.content) throw new Error("That file is too large to read through the Contents API.");
    var obj=JSON.parse(b64ToStr(r.json.content));
    fileRec.sha=r.json.sha;
    D=mergeIntoBlank(recordToData(obj));
    D.slug=slug;
    if(!keepTab) activeTab="WB";        /* a row action must not throw you out of the list */
    ghSetStatus("Opened "+fb(D.partner.legalName,"partner")+" from GitHub.","ok");
    refresh();
  }).catch(function(e){ ghSetStatus(e.message||String(e),"err"); refresh(); });
}
function ghReadPartner(path){
  return ghGetFile(path).then(function(r){
    if(!r.ok||!r.json||!r.json.content) return null;
    try{ return mergeIntoBlank(recordToData(JSON.parse(b64ToStr(r.json.content)))); }
    catch(e){ return null; }
  });
}
/* one request gets the whole pipeline, instead of one per partner */
function ghLoadRegister(){
  return ghGetFile(ghPathFor("register.json")).then(function(r){
    if(!r.ok||!r.json||!r.json.content) return false;
    try{
      var reg=JSON.parse(b64ToStr(r.json.content));
      (reg.partners||[]).forEach(function(e){ if(e&&e.slug) GH.entries[e.slug]=e; });
      return true;
    }catch(e){ return false; }
  });
}
function registerEntry(d,slug){
  var M=MODELS[d.modelKey]||MODELS.ADP;
  var next=nextGateFor(d);
  return {
    slug: slug, ref: d.ref||"",
    legalName: d.partner.legalName||"", tradingName: d.partner.tradingName||"",
    countryOfIncorporation: d.partner.countryOfIncorporation||"",
    modelKey: d.modelKey, model: M.name,
    territory: territoryText(d), countries: (d.territory.countries||[]).slice(),
    exclusivity: d.territory.exclusivity, subLicence: !!M.flags.subLicence,
    status: d.status||"", channels: d.territory.channels||"",
    currency: d.commercial.currency, initialFee: Number(d.commercial.initialFee)||0,
    royaltyPct: Number(d.commercial.royaltyPct)||0, marketingPct: Number(d.commercial.marketingPct)||0,
    minAnnualRoyalty: Number(d.commercial.minAnnualRoyalty)||0,
    agreementDate: d.term.agreementDate, commencementDate: d.term.commencementDate,
    termYears: Number(d.term.termYears)||0,
    expiryDate: addYears(d.term.commencementDate, Number(d.term.termYears)||0),
    contactName: d.partner.repName||"", contactEmail: d.partner.email||"",
    year1Revenue: Number(d.targets.year1Revenue)||0,
    nextGate: next?next.label:"", nextGateDate: next?next.date:"",
    updatedAt: new Date().toISOString()
  };
}
function registerMarkdown(entries){
  var lines=[];
  lines.push("# Modelware business partner register");
  lines.push("");
  lines.push("Generated by "+APP_NAME+" `v"+APP_VERSION+"` (build "+APP_BUILD+"). Do not edit by hand — it is rewritten on every save.");
  lines.push("");
  lines.push("Partners on file: **"+entries.length+"**  ·  Last generated: "+sastNow());
  lines.push("");
  lines.push("| Partner | Model | Territory | Basis | Status | Commences | Expires | Royalty | Next gate |");
  lines.push("|---|---|---|---|---|---|---|---|---|");
  entries.forEach(function(e){
    lines.push("| ["+(e.legalName||e.slug)+"]("+PARTNER_DIR+"/"+e.slug+".json) | "+e.model+" | "+
      e.territory+" | "+e.exclusivity+" | "+(e.status||"—")+" | "+(e.commencementDate||"—")+" | "+
      (e.expiryDate||"—")+" | "+e.royaltyPct+"% | "+(e.nextGate?e.nextGate+" ("+e.nextGateDate+")":"—")+" |");
  });
  lines.push("");
  lines.push("## Files");
  lines.push("");
  lines.push("- `"+PARTNER_DIR+"/<slug>.json` — one record per partner, schema `"+SCHEMA_PARTNER+"`.");
  lines.push("- `register.json` — generated index, schema `"+SCHEMA_REGISTER+"`.");
  lines.push("");
  lines.push("Contract drafts and workbooks are **not** stored here — they are regenerated from these records by the builder.");
  lines.push("");
  return lines.join("\n");
}
/* Save the open partner, then regenerate register.json and README.md */
function ghSave(){
  if(GH.busy) return Promise.resolve();
  if(!GH.connected){ ghSetStatus("Connect to the repository first.","err"); return Promise.resolve(); }
  if(!String(D.partner.legalName||"").trim()){
    ghSetStatus("Give the partner a legal name before saving — it becomes the file name.","err"); return Promise.resolve(); }
  GH.busy=true;
  var slug=partnerSlug(D); D.slug=slug;
  var path=ghPathFor(PARTNER_DIR+"/"+slug+".json");
  var existing=GH.files.filter(function(x){ return x.slug===slug; })[0];
  var isNew=!existing;
  ghSetStatus((isNew?"Creating ":"Updating ")+path+"…","");
  var msg=(isNew?"Add":"Update")+" partner: "+D.partner.legalName+
          " ("+(MODELS[D.modelKey]||MODELS.ADP).name+", "+territoryText(D)+") [builder v"+APP_VERSION+"]";
  return Promise.resolve()
    .then(function(){
      if(existing && existing.sha) return existing.sha;
      return ghGetFile(path).then(function(r){ return r.ok&&r.json?r.json.sha:null; });
    })
    .then(function(sha){
      return ghPutFile(path, JSON.stringify(partnerRecord(D),null,2)+"\n", msg, sha);
    })
    .then(function(r){
      if(!r.ok) throw new Error(ghErr(r,path));
      var newSha=r.json&&r.json.content?r.json.content.sha:null;
      if(existing) existing.sha=newSha;
      else GH.files.push({name:slug+".json",slug:slug,path:path,sha:newSha});
      GH.files.sort(function(a,b){ return a.slug<b.slug?-1:1; });
      GH.entries[slug]=registerEntry(D,slug);
      ghSetStatus("Saved. Rebuilding the register…","");
      return ghRebuildRegister();
    })
    .then(function(){
      ghSetStatus("Saved "+D.partner.legalName+" to "+GH.owner+"/"+GH.repo+" and refreshed the register.","ok");
      toast("Saved to GitHub.");
    })
    .catch(function(e){ ghSetStatus(e.message||String(e),"err"); toast("GitHub save failed — see the repository panel.",true); })
    .then(function(){ GH.busy=false; refresh(); });
}
/* Read every partner file we do not already have cached, then write the index */
function ghRebuildRegister(){
  var needed=GH.files.filter(function(x){ return !GH.entries[x.slug]; });
  var chain=Promise.resolve();
  needed.forEach(function(fileRec){
    chain=chain.then(function(){
      return ghGetFile(fileRec.path).then(function(r){
        if(!r.ok||!r.json||!r.json.content) return;
        try{
          var obj=JSON.parse(b64ToStr(r.json.content));
          fileRec.sha=r.json.sha;
          GH.entries[fileRec.slug]=registerEntry(mergeIntoBlank(recordToData(obj)),fileRec.slug);
        }catch(e){}
      });
    });
  });
  return chain.then(function(){
    var entries=GH.files.map(function(x){ return GH.entries[x.slug]; })
                        .filter(function(x){ return !!x; });
    var reg={ schema:SCHEMA_REGISTER, generatedAt:new Date().toISOString(),
              generatedAtSAST:sastNow(),
              builder:{ name:APP_NAME, version:APP_VERSION, build:APP_BUILD },
              repository:GH.owner+"/"+GH.repo, count:entries.length, partners:entries };
    return ghWriteGenerated(ghPathFor("register.json"), JSON.stringify(reg,null,2)+"\n",
                            "Regenerate partner register ("+entries.length+" partner"+(entries.length===1?"":"s")+")")
      .then(function(){
        return ghWriteGenerated(ghPathFor("README.md"), registerMarkdown(entries),
                                "Regenerate partner register table");
      });
  });
}
function ghWriteGenerated(path,text,message){
  return ghGetFile(path).then(function(r){
    var sha=(r.ok&&r.json)?r.json.sha:null;
    return ghPutFile(path,text,message,sha).then(function(p){
      if(!p.ok) throw new Error(ghErr(p,path));
    });
  });
}
ghLoadCfg();
</script>
<script>
"use strict";
/* ================================================================== UI */
var COUNTRY_LIST=["South Africa","Namibia","Botswana","Zimbabwe","Zambia","Kenya","Tanzania","Uganda","Rwanda","Ghana","Nigeria","Egypt","Morocco","Mauritius","United Arab Emirates","Saudi Arabia","Qatar","Kuwait","Oman","Bahrain","United Kingdom","Ireland","Netherlands","Germany","France","Spain","Portugal","Poland","Sweden","Norway","United States","Canada","Mexico","Brazil","Chile","Colombia","Australia","New Zealand","Singapore","Malaysia","Indonesia","Philippines","India","Sri Lanka","Pakistan","Bangladesh","Japan","South Korea","Turkey","Israel"];

function get(path){ return path.split(".").reduce(function(o,k){ return o==null?undefined:o[k]; }, D); }
function set(path,val){
  var ks=path.split("."), o=D, i;
  for(i=0;i<ks.length-1;i++) o=o[ks[i]];
  o[ks[ks.length-1]]=val;
}
function f(path,label,type,extra){
  var v=get(path); extra=extra||{};

  if(extra.step) attrs+=' step="'+extra.step+'"';
  if(extra.min!==undefined) attrs+=' min="'+extra.min+'"';

function blocksToHtml(doc){
  var h='<div class="doc"><h1>'+esc(doc.title)+'</h1><div class="docmeta">'+esc(doc.subtitle||"")+
        '<div class="stamp">'+esc(doc.stamp||buildStamp())+'</div></div>';
  doc.blocks.forEach(function(bl){
    switch(bl.t){
      case "h1": break;
      case "h2": h+="<h2>"+esc(bl.x)+"</h2>"; break;
      case "h3": h+="<h3>"+esc(bl.x)+"</h3>"; break;
      case "p": h+="<p>"+esc(bl.x)+"</p>"; break;
      case "note": h+='<div class="note">'+esc(bl.x)+"</div>"; break;
      case "ul": h+="<ul>"+bl.items.map(function(i){return "<li>"+esc(i)+"</li>";}).join("")+"</ul>"; break;
      case "ol": h+="<ol>"+bl.items.map(function(i){return "<li>"+esc(i)+"</li>";}).join("")+"</ol>"; break;
      case "table":
        h+="<table>"+(bl.head&&bl.head.length?"<tr>"+bl.head.map(function(x){return "<th>"+esc(x)+"</th>";}).join("")+"</tr>":"");
        bl.rows.forEach(function(r){ h+="<tr>"+r.map(function(x){return "<td>"+esc(x)+"</td>";}).join("")+"</tr>"; });
        h+="</table>"; break;
      case "sig":
        h+='<h2>Signed by the parties</h2><div class="sig">'+
           '<div><strong>For '+esc(bl.a.party)+'</strong><div class="sigbox">Name: '+esc(fb(bl.a.name,"name"))+'<br>Capacity: '+esc(fb(bl.a.role,"capacity"))+'<br>Date: ______________</div></div>'+
           '<div><strong>For '+esc(bl.b.party)+'</strong><div class="sigbox">Name: '+esc(fb(bl.b.name,"name"))+'<br>Capacity: '+esc(fb(bl.b.role,"capacity"))+'<br>Date: ______________</div></div></div>';
        break;
    }
  });
  return h+"</div>";
}
function cellHtml(c,asTd){
  if(!c) return "<td></td>";
  var v=c.v, cls="";
  if(c.t==="f"){ v="= "+c.v; cls=' class="fx"'; }
  else if(c.t==="n"){
    if(v===null||v===""){ v=""; }
    else if(c.s===5){ v=(Number(v)*100).toFixed(1)+"%"; cls=' class="num"'; }
    else if(c.s===6){ v=new Date(Date.UTC(1899,11,30)+Number(v)*86400000).toISOString().slice(0,10); cls=' class="dt"'; }
    else { v=num(v, c.s===9?1:0); cls=' class="num"'; }
  }
  return "<td"+cls+">"+esc(v)+"</td>";
}
function blockTable(rows){
  var h='<div class="sheetscroll"><table class="sheet">';
  rows.forEach(function(r){
    if(!r||!r.length){ return; }
    var isHead=r[0]&&r[0].s===2, isGrp=r[0]&&r[0].s===8;
    h+='<tr'+(isGrp?' class="grp"':'')+'>';
    r.forEach(function(c){
      if(isHead){ h+="<th>"+esc(c?c.v:"")+"</th>"; return; }
      h+=cellHtml(c);
    });
    h+="</tr>";
  });
  return h+"</table></div>";
}
function sheetsToHtml(sheets){
  var h="";
  sheets.forEach(function(s){
    /* title and note rows are prose, not data — keeping them in the table stretches
       the first column and forces horizontal scrolling, so lift them out */
    var rows=s.rows.slice(), lead=[], tail=[];
    function isProse(r){ return r && r.length && r[0] && (r[0].s===1 || r[0].s===10); }
    function isBlank(r){ return !r || !r.length; }
    while(rows.length && (isProse(rows[0]) || isBlank(rows[0]))){
      var t=rows.shift(); if(isProse(t)) lead.push(t[0].v);
    }
    while(rows.length && (isProse(rows[rows.length-1]) || isBlank(rows[rows.length-1]))){
      var b=rows.pop(); if(isProse(b)) tail.unshift(b[0].v);
    }
    h+='<div class="sheetwrap"><div class="sheettitle">'+esc(s.name)+
       (lead.length?'<span class="lead">'+lead.map(esc).join(' &middot; ')+'</span>':'')+'</div>';

    /* A sheet that is one wide row per partner reads as a record on screen.
       Forty columns squeezed into a pane is unreadable; turn it on its side. */
    if(s.preview==="record"){
      var hdrRow=null, dataRow=null, rest=[];
      rows.forEach(function(r){
        if(!r||!r.length) { if(hdrRow&&dataRow) rest.push(r); return; }
        if(!hdrRow && r[0] && r[0].s===2){ hdrRow=r; return; }
        if(hdrRow && !dataRow){ dataRow=r; return; }
        if(hdrRow && dataRow) rest.push(r);
      });
      if(hdrRow && dataRow){
        h+='<div class="sheetscroll"><table class="sheet kv">';
        hdrRow.forEach(function(hc,i){
          var dc=dataRow[i];
          h+='<tr><td>'+esc(hc?hc.v:"")+'</td>'+cellHtml(dc,true)+'</tr>';
        });
        h+='</table></div>';
        if(rest.length) h+=blockTable(rest);
        h+=(tail.length?'<div class="sheetfoot">'+tail.map(esc).join('<br>')+'</div>':'')+'</div>';
        return;
      }
    }
    h+='<div class="sheetscroll"><table class="sheet">';
    rows.forEach(function(r){
      if(!r||!r.length){ h+='<tr><td style="height:6px;border:0"></td></tr>'; return; }
      var isHead=r[0]&&r[0].s===2, isGrp=r[0]&&r[0].s===8;
      h+='<tr'+(isGrp?' class="grp"':'')+'>';
      r.forEach(function(c){
        if(!c){ h+="<td></td>"; return; }
        var v=c.v, cls="";
        if(c.t==="f"){ v="= "+c.v; cls=' class="fx"'; }
        else if(c.t==="n"){
          if(v===null||v===""){ v=""; }
          else if(c.s===5){ v=(Number(v)*100).toFixed(1)+"%"; }
          else if(c.s===6){ v=new Date(Date.UTC(1899,11,30)+Number(v)*86400000).toISOString().slice(0,10);
                            cls=' class="dt"'; }
          else { v=num(v, c.s===9?1:0); cls=' class="num"'; }
          if(c.s===5) cls=' class="num"';
        }
        h+=(isHead?"<th>":"<td"+cls+">")+esc(v)+(isHead?"</th>":"</td>");
      });
      h+="</tr>";
    });
    h+='</table></div>'+
       (tail.length?'<div class="sheetfoot">'+tail.map(esc).join('<br>')+'</div>':'')+
       '</div>';
  });
  return h;
}

 ["1","New partner","Name the candidate and choose the model you are offering."],

function flowStep(){
  var named=String(D.partner.legalName||"").trim()!=="";
  var got=Object.keys(D.diligence||{}).length>0;
  var saved=GH.connected && GH.files.filter(function(x){ return x.slug===partnerSlug(D); }).length>0;
  if(!named) return 0;
  if(!got) return 1;
  if(!saved) return 3;
  return 4;
}
function flowHtml(){
  var cur=flowStep();
