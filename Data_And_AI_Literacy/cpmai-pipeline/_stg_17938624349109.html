<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="version" content="1.0.0">
<meta name="mw-asset" content="true">
<meta name="ontology-src" content="gh:modelwaresystems-dama/modelware_app_storage/Data_And_AI_Literacy/Ontology/database">
<title>CPMAI Delivery Pipeline</title>
<style>
  :root{
    --bg:#f6f7f9;--panel:#fff;--panel2:#fbfcfd;--ink:#15181d;--muted:#5c6673;
    --line:#e3e7ec;--line2:#eef1f4;--accent:#2f5bd0;--accent-ink:#1b3a8f;--accent-bg:#eaf0fc;
    --chip:#eef1f6;--chip-ink:#3a4452;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(20,24,29,.06),0 2px 10px rgba(20,24,29,.05);--radius:12px;
    --warn:#b23b2e;--ok:#12946a;--gate:#b23b2e;
    --s1:#2f5bd0;--s2:#1f6f8b;--s3:#7c3aed;--s4:#0f7b5a;--s5:#b8742a;--s6:#12946a;
    --deliv:#2f5bd0;--ctrl:#7c3aed;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0f1216;--panel:#171b21;--panel2:#1b2027;--ink:#e9edf2;--muted:#9aa5b2;
    --line:#272d36;--line2:#20262e;--accent:#6f97ff;--accent-ink:#9db8ff;--accent-bg:#17223c;
    --chip:#232a33;--chip-ink:#c3ccd7;--shadow:0 1px 2px rgba(0,0,0,.4),0 2px 12px rgba(0,0,0,.35);
    --warn:#e0725f;--ok:#39c08c;--gate:#e0725f;
    --s1:#6f97ff;--s2:#5aa0cf;--s3:#b49bf0;--s4:#43c494;--s5:#d9a56a;--s6:#39c08c;
    --deliv:#6f97ff;--ctrl:#b49bf0;
  }}
  :root[data-theme="dark"]{
    --bg:#0f1216;--panel:#171b21;--panel2:#1b2027;--ink:#e9edf2;--muted:#9aa5b2;
    --line:#272d36;--line2:#20262e;--accent:#6f97ff;--accent-ink:#9db8ff;--accent-bg:#17223c;
    --chip:#232a33;--chip-ink:#c3ccd7;--warn:#e0725f;--ok:#39c08c;--gate:#e0725f;
    --s1:#6f97ff;--s2:#5aa0cf;--s3:#b49bf0;--s4:#43c494;--s5:#d9a56a;--s6:#39c08c;--deliv:#6f97ff;--ctrl:#b49bf0;
  }
  *{box-sizing:border-box}html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;position:sticky;top:0;z-index:30}
  .ttl{font-weight:800;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
  .badge{font:700 11px var(--mono);background:var(--accent-bg);color:var(--accent-ink);border-radius:6px;padding:2px 7px}
  .sub{font-size:12px;color:var(--muted)}
  .viewtog{display:flex;gap:3px;background:var(--chip);border-radius:10px;padding:3px}
  .viewtog button{border:none;background:transparent;color:var(--chip-ink);font:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer}
  .viewtog button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
  .search{position:relative;margin-left:auto}
  .search input{border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;width:200px}
  .search input:focus{outline:none;border-color:var(--accent)}
  .results{position:absolute;top:110%;right:0;width:340px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:none;z-index:40}
  .results.show{display:block}
  .results .r{padding:8px 11px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:13px}
  .results .r:hover{background:var(--panel2)}
  .results .r .ty{font:600 10px var(--mono);color:var(--muted)}
  .wrap{padding:0}
  .intro{padding:12px 16px 2px;color:var(--muted);font-size:12.5px;max-width:980px}
  /* outline */
  .outline{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,430px);gap:0;align-items:start}
  .outcol{padding:8px 16px 60px;min-width:0}
  .outdet{position:sticky;top:var(--toph,56px);align-self:start;border-left:1px solid var(--line);background:var(--panel);max-height:calc(100vh - var(--toph,56px));overflow:auto}
  .outdetinner{padding:16px}
  @media(max-width:860px){.outline{grid-template-columns:1fr}.outdet{position:static;max-height:none;border-left:none;border-top:1px solid var(--line)}}
  .ph{margin:0 0 12px;padding:14px 0 6px;border-top:2px solid var(--sc,var(--line));scroll-margin-top:calc(var(--toph,56px) + 12px)}
  .ph:first-child{border-top:none}
  .phhd{display:flex;align-items:center;gap:10px;position:sticky;top:var(--toph,56px);background:var(--bg);padding:6px 0;z-index:2;cursor:pointer;border-radius:8px}
  .phhd:hover{background:var(--chip)}.phhd.sel{box-shadow:inset 0 0 0 2px var(--sc,var(--accent))}
  .phhd .n{width:24px;height:24px;border-radius:999px;background:var(--sc,var(--accent));color:#fff;font:800 12px var(--mono);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .phhd .nm{font-weight:800;font-size:15.5px;letter-spacing:-.01em;flex:1}
  .phhd .ct{font:800 12px var(--mono);color:var(--muted);background:var(--chip);border-radius:999px;padding:2px 10px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 2px 8px}
  .chip{font:600 11px var(--mono);border-radius:6px;padding:3px 8px;cursor:pointer;white-space:nowrap;border:1px solid transparent}
  .chip.gate{background:rgba(178,59,46,.1);color:var(--gate);border-color:rgba(178,59,46,.32)}
  .chip.loop{background:var(--chip);color:var(--chip-ink)}
  .chip:hover{filter:brightness(.97);text-decoration:underline}
  .phdesc{font-size:12.5px;color:var(--muted);margin:0 2px 11px;line-height:1.5}
  .grp{margin-bottom:10px}
  .grphd{display:flex;align-items:center;gap:8px;font:800 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:8px 2px 7px}
  .grphd .gc{background:var(--chip);border-radius:999px;padding:1px 8px}
  .rec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;background:var(--panel);cursor:pointer;border-left:3px solid var(--lc,var(--line))}
  .rec:hover{border-color:var(--accent)}.rec.sel{box-shadow:0 0 0 2px var(--accent-bg);border-color:var(--accent)}
  .rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rl{font-weight:700;font-size:13.5px;flex:1;letter-spacing:-.01em;min-width:120px}
  .tag{font:600 10px var(--mono);border-radius:5px;padding:1px 6px;white-space:nowrap;background:var(--chip);color:var(--chip-ink)}
  .tag.deliv{background:rgba(47,91,208,.12);color:var(--deliv)}
  .tag.ctrl{background:rgba(124,58,237,.12);color:var(--ctrl)}
  .tag.ka{background:var(--accent-bg);color:var(--accent-ink)}
  .tag.own{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .ra{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
  .empty{color:var(--muted);font-size:13px;padding:14px;text-align:center}
  /* detail */
  .dhd{font-size:16px;font-weight:800;letter-spacing:-.01em;margin:2px 0 3px}
  .dmeta{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .ddef{font-size:13px;line-height:1.55;margin:0 0 14px;padding:10px 12px;background:var(--panel2);border-radius:9px;border:1px solid var(--line2)}
  .sec{font:800 10.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 7px}
  table.attr{width:100%;border-collapse:collapse;font-size:12.5px}
  table.attr td{padding:5px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
  table.attr td.k{color:var(--muted);width:42%;font-weight:600}
  table.attr td.v{color:var(--ink);font-weight:600}
  .lnk{display:flex;align-items:center;gap:7px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--panel)}
  .lnk:hover{border-color:var(--accent);background:var(--panel2)}
  .lnk .verb{font:700 10px var(--mono);color:var(--accent-ink);background:var(--accent-bg);border-radius:5px;padding:1px 6px;white-space:nowrap}
  .lnk .verb.in{color:var(--muted);background:var(--chip)}
  .lnk .lt{font-size:12.5px;font-weight:700;flex:1}
  .lnk .ls{font:600 9.5px var(--mono);color:var(--muted)}
  /* status */
  .status{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .status .box{max-width:620px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px 24px}
  .status h3{margin:0 0 4px;font-size:16px}.status p{margin:0 0 12px;color:var(--muted);font-size:13px}
  .diag{font:12px/1.55 var(--mono);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;max-height:300px;overflow:auto;white-space:pre-wrap;color:var(--ink)}
  .diag .ok{color:var(--ok)}.diag .bad{color:var(--warn)}.diag .warn{color:#b8742a}.diag .dim{color:var(--muted)}
  .verdict{margin-top:12px;font-size:13px;padding:11px 13px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
  .verdict.bad{border-color:var(--warn);color:var(--warn)}.verdict.ok{border-color:var(--ok);color:var(--ok)}
  #tokenBox{margin-top:12px}#tokenBox input{width:100%;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:9px 12px;font:inherit;font-size:13px}
  .statusBtns{display:flex;gap:8px;margin-top:12px}
  .statusBtns button{border:1.5px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:8px 15px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .statusBtns button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
</style>
</head>
<body>
  <div class="top">
    <div>
      <div class="ttl">CPMAI Delivery Pipeline <span class="badge" id="ver">v1.0.0</span></div>
      <div class="sub">Continuous Project Management of Data &amp; AI · 6 phases × DMBOK controls · live from the CA&amp;I ontology</div>
    </div>
    <div class="viewtog" id="viewtog">
      <button data-view="phase" class="on">By phase</button>
      <button data-view="ka">By DMBOK area</button>
      <button data-view="role">By role</button>
    </div>
    <div class="search">
      <input id="q" type="text" placeholder="Search…" autocomplete="off">
      <div class="results" id="results"></div>
    </div>
  </div>
  <div id="app"></div>

  <div class="status" id="status"><div class="box">
    <h3 id="statusTitle">Loading pipeline…</h3>
    <p id="statusMsg">Connecting to the private repository…</p>
    <pre id="diagLog" class="diag" aria-live="polite"></pre>
    <p id="verdict" class="verdict" style="display:none"></p>
    <div id="tokenBox" style="display:none">
      <input id="tokenIn" type="password" placeholder="Paste your fine-grained PAT (Contents: Read)">
      <div class="statusBtns"><button id="tokenSave">Connect &amp; load</button></div>
    </div>
    <div class="statusBtns" id="diagBtns" style="display:none">
      <button id="retryBtn">Retry</button>
      <button id="copyBtn" class="ghost">Copy diagnostics</button>
      <button id="tokenToggle" class="ghost">Change token</button>
    </div>
  </div></div>

<script>
document.getElementById('ver').textContent='v'+document.querySelector('meta[name="version"]').content;
function syncTopVar(){ const t=document.querySelector('.top'); if(t)document.documentElement.style.setProperty('--toph',Math.round(t.getBoundingClientRect().height)+'px'); }
syncTopVar(); window.addEventListener('resize',syncTopVar);
if(window.ResizeObserver){ const ro=new ResizeObserver(syncTopVar); const tb=document.querySelector('.top'); if(tb)ro.observe(tb); }
const TOKEN_KEY=(new URLSearchParams(location.search).get('tokenKey'))||'mdaReadiness.ghpat';
const SRC=(new URLSearchParams(location.search).get('data'))||((document.querySelector('meta[name="ontology-src"]')||{}).content||'');
function getToken(){try{return localStorage.getItem(TOKEN_KEY)||'';}catch(e){return'';}}
function resolveSrc(base){ if(base.indexOf('gh:')===0){ var r=base.slice(3),ref='main',at=r.lastIndexOf('@');if(at>0){ref=r.slice(at+1);r=r.slice(0,at);}
    var a=r.split('/'),ow=a.shift(),rp=a.shift(),pa=a.join('/'); return {gh:true,owner:ow,repo:rp,ref:ref,path:pa}; }
  return {gh:false,base:base.replace(/\/$/,'')}; }
const SRCINFO=resolveSrc(SRC);
function fileUrl(file){ if(SRCINFO.gh){ return 'https://api.github.com/repos/'+SRCINFO.owner+'/'+SRCINFO.repo+'/contents/'+SRCINFO.path+'/'+file+'?ref='+encodeURIComponent(SRCINFO.ref); } return SRCINFO.base+'/'+file; }
function ghHeaders(raw){ var tk=getToken(), h={'Accept':raw?'application/vnd.github.raw':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; if(tk)h['Authorization']='Bearer '+tk; return h; }
async function probe(url,opts){ var out={url:url,ok:false,status:0,threw:false,error:'',body:'',json:null};
  try{ var r=await fetch(url,opts); out.status=r.status; out.ok=r.ok; var txt=await r.text(); out.body=txt; try{out.json=JSON.parse(txt);}catch(e){} }
  catch(e){ out.threw=true; out.error=(e&&e.message)||String(e); } return out; }

// ---------- model ----------
const M={ent:new Map(),type:new Map(),rtype:new Map(),facet:new Map(),out:new Map(),inc:new Map()};
function buildModel(ds){
  (ds.entityTypes.items).forEach(t=>M.type.set(t.id,t));
  (ds.relationshipTypes.items).forEach(t=>M.rtype.set(t.id,t));
  ((ds.facets&&ds.facets.items)||[]).forEach(f=>M.facet.set(f.id,f));
  (ds.entities.items).forEach(e=>{M.ent.set(e.id,e);M.out.set(e.id,[]);M.inc.set(e.id,[]);});
  (ds.relationships.items).forEach(r=>{ if(M.out.has(r.sourceEntityId))M.out.get(r.sourceEntityId).push(r); if(M.inc.has(r.targetEntityId))M.inc.get(r.targetEntityId).push(r); });
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const FACET='facet:cpmai';
const hasFacet=(e,f)=>e&&Array.isArray(e.facetIds)&&e.facetIds.indexOf(f)>=0;
const MEMBER=()=>[...M.ent.values()].filter(e=>hasFacet(e,FACET));
const labelOf=id=>{const e=M.ent.get(id);return (e&&e.preferredLabel)||id;};
const typeLabel=tid=>{const t=M.type.get(tid);return t?t.label:(tid||'').replace(/^type:/,'');};
const rtypeLabel=rid=>{const t=M.rtype.get(rid);return (t&&t.label)||(rid||'').replace(/^rel:/,'').replace(/-/g,' ');};
const rtypeInverse=rid=>{const t=M.rtype.get(rid);return (t&&(t.inverseLabel||t.label))||(rid||'').replace(/^rel:/,'').replace(/-/g,' ');};
const outOf=(id,rel)=>(M.out.get(id)||[]).filter(r=>!rel||r.relationshipTypeId===rel);
const incOf=(id,rel)=>(M.inc.get(id)||[]).filter(r=>!rel||r.relationshipTypeId===rel);

const PHASE_COLOR={1:'--s1',2:'--s2',3:'--s3',4:'--s4',5:'--s5',6:'--s6'};
const phases=()=>[...M.ent.values()].filter(e=>e.entityTypeId==='type:cpmai-phase').sort((a,b)=>((a.attributes||{}).ord||0)-((b.attributes||{}).ord||0));
const phaseItems=pid=>outOf(pid,'rel:contains').map(r=>M.ent.get(r.targetEntityId)).filter(Boolean);
const gatesForPhase=pid=>incOf(pid,'rel:gates-phase').map(r=>M.ent.get(r.sourceEntityId)).filter(Boolean).sort((a,b)=>String((a.attributes||{}).gate).localeCompare(String((b.attributes||{}).gate)));
const kaFor=id=>outOf(id,'rel:maps-to-ka').map(r=>M.ent.get(r.targetEntityId)).filter(Boolean);
const ownerFor=id=>{const r=outOf(id,'rel:owned-by').map(r=>M.ent.get(r.targetEntityId)).filter(Boolean);return r[0]||null;};
const isCtrl=e=>e.entityTypeId==='type:dmbok-control';
const isDeliv=e=>e.entityTypeId==='type:cpmai-deliverable';
const phaseOfItem=id=>{const r=incOf(id,'rel:contains').map(r=>M.ent.get(r.sourceEntityId)).filter(e=>e&&e.entityTypeId==='type:cpmai-phase');return r[0]||null;};

const S={view:'phase',rec:null};

// ---------- item card ----------
function recCard(e){
  const sel=e.id===S.rec; const ctrl=isCtrl(e); const lc=ctrl?'--ctrl':'--deliv';
  const own=ownerFor(e.id); const kas=ctrl?kaFor(e.id):[];
  return '<div class="rec'+(sel?' sel':'')+'" style="--lc:var('+lc+')" data-rec="'+esc(e.id)+'">'+
    '<div class="rh"><span class="rl">'+esc(e.preferredLabel)+'</span>'+
      '<span class="tag '+(ctrl?'ctrl':'deliv')+'">'+(ctrl?'DMBOK control':'CPMAI')+'</span>'+
      (own?'<span class="tag own">'+esc(own.preferredLabel)+'</span>':'')+
      (kas.length?'<span class="tag ka">'+esc(kas.map(k=>k.preferredLabel).join(' · '))+'</span>':'')+
    '</div>'+(e.definition?'<div class="ra">'+esc(e.definition)+'</div>':'')+'</div>';
}

// ---------- By phase (outline) ----------
function phaseSection(e){
  const a=e.attributes||{}; const ord=a.ord||0; const sc=PHASE_COLOR[ord]||'--accent';
  const items=phaseItems(e.id);
  const delivs=items.filter(isDeliv), ctrls=items.filter(isCtrl);
  let chips='';
  gatesForPhase(e.id).forEach(gate=>{const ga=gate.attributes||{}; chips+='<span class="chip gate" data-rec="'+esc(gate.id)+'" title="Governance gate">⚖ '+esc(ga.gate||'Gate')+' · '+esc((ga.approver||'')||gate.preferredLabel)+'</span>';});
  const loop=outOf(e.id,'rel:refines').map(r=>r.targetEntityId);
  const loopIn=incOf(e.id,'rel:refines').map(r=>r.sourceEntityId);
  if(loop.length) chips+='<span class="chip loop" data-rec="'+esc(loop[0])+'" title="Continuous loop">↻ feeds back → '+esc(labelOf(loop[0]))+'</span>';
  if(loopIn.length) chips+='<span class="chip loop" data-rec="'+esc(loopIn[0])+'" title="Continuous loop">↻ re-framed by '+esc(labelOf(loopIn[0]))+'</span>';
  function grp(label,arr,cls){ if(!arr.length)return '';
    return '<div class="grp"><div class="grphd"><span>'+label+'</span><span class="gc">'+arr.length+'</span></div>'+arr.map(recCard).join('')+'</div>'; }
  return '<div class="ph" id="ph-'+esc(e.id)+'" style="--sc:var('+sc+')">'+
    '<div class="phhd'+(e.id===S.rec?' sel':'')+'" data-rec="'+esc(e.id)+'" title="Open this phase"><span class="n">'+ord+'</span><span class="nm">'+esc(e.preferredLabel.replace(/^\d+\s·\s/,''))+'</span><span class="ct">'+items.length+'</span></div>'+
    (chips?'<div class="chips">'+chips+'</div>':'')+
    '<div class="phdesc">'+esc(e.definition||'')+'</div>'+
    grp('CPMAI deliverables',delivs)+grp('DMBOK controls',ctrls)+'</div>';
}
function renderPhaseView(){
  const app=document.getElementById('app');
  let left=''; phases().forEach(p=>left+=phaseSection(p));
  app.innerHTML='<div class="intro">The six CPMAI phases from Business Understanding to Model Operationalization, each with its governance gate, the CPMAI method deliverables it produces and the DMBOK controls it applies. Click any item to see its owner role and the DMBOK knowledge area it aligns to.</div>'+
    '<div class="outline"><div class="outcol">'+left+'</div>'+
    '<div class="outdet"><div class="outdetinner" id="outdetinner">'+renderDetail(S.rec)+'</div></div></div>';
}

// ---------- By DMBOK knowledge area ----------
function renderKAView(){
  const app=document.getElementById('app');
  const ctrls=[...M.ent.values()].filter(isCtrl);
  const byKA=new Map();
  ctrls.forEach(c=>kaFor(c.id).forEach(k=>{ if(!byKA.has(k.id))byKA.set(k.id,{ka:k,items:[]}); byKA.get(k.id).items.push(c); }));
  const groups=[...byKA.values()].sort((a,b)=>((a.ka.attributes||{}).dmbokChapter||99)-((b.ka.attributes||{}).dmbokChapter||99));
  let left='';
  groups.forEach(g=>{ const ch=(g.ka.attributes||{}).dmbokChapter;
    left+='<div class="ph" style="--sc:var(--accent)"><div class="phhd" data-rec="'+esc(g.ka.id)+'"><span class="n" style="font-size:10px">'+(ch!=null?('C'+ch):'KA')+'</span><span class="nm">'+esc(g.ka.preferredLabel)+'</span><span class="ct">'+g.items.length+'</span></div>'+
      '<div class="phdesc">DMBOK controls that align to this knowledge area, applied across the CPMAI phases.</div>'+
      g.items.map(c=>{const ph=phaseOfItem(c.id); const own=ownerFor(c.id);
        return '<div class="rec" style="--lc:var(--ctrl)" data-rec="'+esc(c.id)+'"><div class="rh"><span class="rl">'+esc(c.preferredLabel)+'</span>'+(ph?'<span class="tag">'+esc(ph.preferredLabel)+'</span>':'')+(own?'<span class="tag own">'+esc(own.preferredLabel)+'</span>':'')+'</div>'+(c.definition?'<div class="ra">'+esc(c.definition)+'</div>':'')+'</div>';}).join('')+'</div>';
  });
  app.innerHTML='<div class="intro">The CPMAI × DMBOK integration: every DMBOK control the playbook applies, grouped by the DMBOK knowledge area it aligns to in your ontology. '+ctrls.length+' controls across '+groups.length+' knowledge areas.</div>'+
    '<div class="outline"><div class="outcol">'+left+'</div><div class="outdet"><div class="outdetinner" id="outdetinner">'+renderDetail(S.rec)+'</div></div></div>';
}

// ---------- By role ----------
function renderRoleView(){
  const app=document.getElementById('app');
  const roles=[...M.ent.values()].filter(e=>e.entityTypeId==='type:delivery-role');
  const owned=r=>incOf(r.id,'rel:owned-by').map(x=>M.ent.get(x.sourceEntityId)).filter(Boolean);
  const groups=roles.map(r=>({role:r,items:owned(r)})).filter(g=>g.items.length).sort((a,b)=>b.items.length-a.items.length);
  let left='';
  groups.forEach(g=>{
    left+='<div class="ph" style="--sc:var(--accent)"><div class="phhd" data-rec="'+esc(g.role.id)+'"><span class="n" style="font-size:10px">👤</span><span class="nm">'+esc(g.role.preferredLabel)+'</span><span class="ct">'+g.items.length+'</span></div>'+
      '<div class="phdesc">Deliverables and controls this role owns across the CPMAI pipeline.</div>'+
      g.items.map(it=>{const ph=phaseOfItem(it.id);const ctrl=isCtrl(it);
        return '<div class="rec" style="--lc:var('+(ctrl?'--ctrl':'--deliv')+')" data-rec="'+esc(it.id)+'"><div class="rh"><span class="rl">'+esc(it.preferredLabel)+'</span><span class="tag '+(ctrl?'ctrl':'deliv')+'">'+(ctrl?'DMBOK control':'CPMAI')+'</span>'+(ph?'<span class="tag">'+esc(ph.preferredLabel)+'</span>':'')+'</div></div>';}).join('')+'</div>';
  });
  app.innerHTML='<div class="intro">Oversight of teams: each delivery role and the CPMAI deliverables and DMBOK controls it is accountable for. '+groups.length+' roles.</div>'+
    '<div class="outline"><div class="outcol">'+left+'</div><div class="outdet"><div class="outdetinner" id="outdetinner">'+renderDetail(S.rec)+'</div></div></div>';
}

// ---------- detail ----------
function renderDetail(id){
  if(!id) return '<div class="empty">Select anything — a phase, a deliverable, a DMBOK control, a gate or a role — to see its detail and how it connects.</div>';
  const e=M.ent.get(id); if(!e) return '<div class="empty">Not found.</div>';
  const a=e.attributes||{};
  let h='<div class="dhd">'+esc(e.preferredLabel)+'</div>';
  h+='<div class="dmeta">'+esc(typeLabel(e.entityTypeId))+(a.gate?' · <b>'+esc(a.gate)+'</b>':'')+(a.framework?' · '+esc(a.framework):'')+'</div>';
  if(e.definition) h+='<div class="ddef">'+esc(e.definition)+'</div>';
  const HIDE={ord:1,beforeStage:1}; const keys=Object.keys(a).filter(k=>!HIDE[k]);
  if(keys.length){ h+='<div class="sec">Attributes</div><table class="attr">'+keys.map(k=>'<tr><td class="k">'+esc(humanKey(k))+'</td><td class="v">'+esc(String(a[k]))+'</td></tr>').join('')+'</table>'; }
  // relationships (both directions), skipping the structural contains for cleanliness on items
  const links=[];
  outOf(id).forEach(r=>{ if(M.ent.get(r.targetEntityId)) links.push({dir:'out',verb:rtypeLabel(r.relationshipTypeId),to:r.targetEntityId}); });
  incOf(id).forEach(r=>{ if(M.ent.get(r.sourceEntityId)) links.push({dir:'in',verb:rtypeInverse(r.relationshipTypeId),to:r.sourceEntityId}); });
  if(links.length){ h+='<div class="sec">Connections</div>'+links.map(l=>{const te=M.ent.get(l.to);
    return '<div class="lnk" data-rec="'+esc(l.to)+'"><span class="verb'+(l.dir==='in'?' in':'')+'">'+(l.dir==='in'?'← ':'→ ')+esc(l.verb)+'</span><span class="lt">'+esc(te.preferredLabel)+'</span><span class="ls">'+esc(typeLabel(te.entityTypeId))+'</span></div>';
  }).join(''); }
  return h;
}
function humanKey(k){return k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()).replace(/Cpmai/,'CPMAI').replace(/Dmbok/,'DMBOK').replace(/Ka\b/,'KA');}

// ---------- interaction ----------
function selectRec(id){
  S.rec=id;
  const di=document.getElementById('outdetinner');
  if(di){ di.innerHTML=renderDetail(id); const panel=di.closest('.outdet'); if(panel)panel.scrollTop=0;
    document.querySelectorAll('#app .sel').forEach(x=>x.classList.remove('sel'));
    document.querySelectorAll('#app .rec[data-rec="'+CSS.escape(id)+'"], #app .phhd[data-rec="'+CSS.escape(id)+'"]').forEach(el=>el.classList.add('sel'));
    return; }
  renderAll();
}
function renderAll(){
  if(S.view==='ka') return renderKAView();
  if(S.view==='role') return renderRoleView();
  renderPhaseView();
}
document.getElementById('viewtog').addEventListener('click',ev=>{const b=ev.target.closest('button[data-view]');if(!b)return;
  if(S.view===b.dataset.view)return; S.view=b.dataset.view; S.rec=null;
  [...document.querySelectorAll('#viewtog button')].forEach(x=>x.classList.toggle('on',x.dataset.view===S.view)); renderAll();});
document.getElementById('app').addEventListener('click',ev=>{ const rc=ev.target.closest('[data-rec]'); if(rc)selectRec(rc.dataset.rec); });
// search
const q=document.getElementById('q'), results=document.getElementById('results');
q.addEventListener('input',()=>{ const v=q.value.trim().toLowerCase(); if(!v){results.classList.remove('show');return;}
  const hits=MEMBER().filter(e=>e.preferredLabel.toLowerCase().indexOf(v)>=0||(e.definition||'').toLowerCase().indexOf(v)>=0).slice(0,30);
  results.innerHTML=hits.map(e=>'<div class="r" data-rec="'+esc(e.id)+'">'+esc(e.preferredLabel)+'<div class="ty">'+esc(typeLabel(e.entityTypeId))+'</div></div>').join('')||'<div class="r">No matches</div>';
  results.classList.add('show'); });
results.addEventListener('click',ev=>{const r=ev.target.closest('[data-rec]');if(r){selectRec(r.dataset.rec);results.classList.remove('show');q.value='';}});
document.addEventListener('click',ev=>{if(!ev.target.closest('.search'))results.classList.remove('show');});

// ---------- boot / connection diagnostics ----------
(function(){
  const st=document.getElementById('status'), msg=document.getElementById('statusMsg'),
        title=document.getElementById('statusTitle'), diag=document.getElementById('diagLog'),
        verdict=document.getElementById('verdict'), tokenBox=document.getElementById('tokenBox'),
        diagBtns=document.getElementById('diagBtns');
  const esc2=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  function log(html){ diag.innerHTML += html+'\n'; diag.scrollTop=diag.scrollHeight; }
  function line(label,cls,detail){ log('<span class="'+(cls||'dim')+'">'+esc2(label)+'</span>'+(detail?'  <span class="dim">'+esc2(detail)+'</span>':'')); }
  function setVerdict(text,cls){ verdict.textContent=text; verdict.className='verdict '+(cls||''); verdict.style.display='block'; }
  const DATASETS=['index.json','entity-types.json','relationship-types.json','facets.json','entities.json','relationships.json'];
  async function go(){
    diag.innerHTML=''; verdict.style.display='none'; tokenBox.style.display='none'; diagBtns.style.display='none';
    title.textContent='Connecting…'; msg.textContent='Running connection diagnostics against GitHub.';
    const tk=getToken();
    if(!SRCINFO.gh){ line('Source  : '+SRCINFO.base+' (plain URL, no token)','dim'); }
    else{ line('Scheme  : gh:  (GitHub Contents API)','dim'); line('Owner   : '+SRCINFO.owner,'dim'); line('Repo    : '+SRCINFO.repo,'dim');
      line('Branch  : '+SRCINFO.ref,'dim'); line('Path    : '+SRCINFO.path,'dim');
      line('Token   : '+(tk?('present ('+tk.length+' chars)'):'(none stored)'), tk?'ok':'warn'); }
    log('');
    if(SRCINFO.gh){
      line('① Reach api.github.com …','dim','GET https://api.github.com/zen');
      const net=await probe('https://api.github.com/zen',{cache:'no-store'});
      if(net.threw){ line('   ✗ network error — '+net.error,'bad'); setVerdict('Cannot reach api.github.com — a blocker, firewall or proxy is in the way.','bad'); return finish(false); }
      line('   ✓ reachable — HTTP '+net.status,'ok');
      line('② Repo visibility …','dim','GET /repos/'+SRCINFO.owner+'/'+SRCINFO.repo);
      const repo=await probe('https://api.github.com/repos/'+SRCINFO.owner+'/'+SRCINFO.repo,{headers:ghHeaders(false),cache:'no-store'});
      if(repo.status===401){ line('   ✗ HTTP 401 — token rejected','bad'); setVerdict('GitHub rejected the token (401). Paste a current fine-grained PAT with Contents: Read on '+SRCINFO.owner+'/'+SRCINFO.repo+'.','bad'); return finish(false,true); }
      if(repo.status===404){ line('   ✗ HTTP 404 — repo not visible','bad'); setVerdict('The repo is not visible (404). The PAT needs Contents: Read on this repo.','bad'); return finish(false,true); }
      if(!repo.ok){ line('   ✗ HTTP '+repo.status,'bad'); setVerdict('Unexpected response checking the repo: HTTP '+repo.status+'.','bad'); return finish(false,true); }
      line('   ✓ repo visible — HTTP '+repo.status,'ok');
      line('③ Ontology folder …','dim','GET /contents/'+SRCINFO.path);
      const folder=await probe('https://api.github.com/repos/'+SRCINFO.owner+'/'+SRCINFO.repo+'/contents/'+encodeURI(SRCINFO.path)+'?ref='+encodeURIComponent(SRCINFO.ref),{headers:ghHeaders(false),cache:'no-store'});
      if(folder.status===404){ line('   ✗ HTTP 404 — folder not found','bad'); setVerdict(SRCINFO.path+'/ does not exist on branch "'+SRCINFO.ref+'".','bad'); return finish(false); }
      if(folder.ok&&Array.isArray(folder.json)){ line('   ✓ folder found — '+folder.json.length+' file(s)','ok'); }
      else if(!folder.ok){ line('   ✗ HTTP '+folder.status,'bad'); setVerdict('Could not list the ontology folder: HTTP '+folder.status+'.','bad'); return finish(false); }
    }
    log(''); line((SRCINFO.gh?'④':'①')+' Fetch datasets …','dim');
    const CRITICAL={'entity-types.json':1,'relationship-types.json':1,'entities.json':1,'relationships.json':1};
    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
    async function fetchData(f){ let p; for(let at=0;at<3;at++){ p=await probe(fileUrl(f),{headers:SRCINFO.gh?ghHeaders(true):undefined,cache:'no-store'});
        if(!p.threw&&p.ok&&p.json!=null)return p; if(p.threw||p.status>=500||p.status===0){ if(at<2){ line('   … '+f+' — '+(p.threw?('network: '+p.error):('HTTP '+p.status))+', retrying ('+(at+1)+'/2)','warn'); await sleep(500*(at+1)); continue; } } break; } return p; }
    const data={}; let failed=null, degraded=[];
    for(const f of DATASETS){ const p=await fetchData(f);
      const why=p.threw?('network error: '+p.error):(!p.ok?('HTTP '+p.status):(p.json==null?'not valid JSON':null));
      if(why){ if(CRITICAL[f]){ line('   ✗ '+f+' — '+why,'bad'); failed=failed||(f+': '+why); } else { line('   ⚠ '+f+' — '+why+' · skipped','warn'); degraded.push(f); } continue; }
      const n=(p.json.count!=null?p.json.count:(Array.isArray(p.json.items)?p.json.items.length:'?'));
      line('   ✓ '+f+' — HTTP '+p.status+'  ('+n+' items)','ok'); data[f]=p.json; }
    if(failed){ setVerdict('A core dataset failed to load — '+failed+'.','bad'); return finish(false); }
    try{
      buildModel({ entityTypes:data['entity-types.json'], relationshipTypes:data['relationship-types.json'], facets:data['facets.json'], entities:data['entities.json'], relationships:data['relationships.json']});
      const idx=data['index.json']||{}; const mem=MEMBER().length;
      line('',''); line('✓ Loaded ontology v'+(idx.version||'?')+'  —  '+mem+' CPMAI records','ok');
      if(!mem){ setVerdict('Ontology loaded, but it has no CPMAI records yet (facet:cpmai is empty). Deploy ontology v0.16.0 or later.','bad'); return finish(false); }
      setVerdict('Connected. Rendering…','ok');
      setTimeout(()=>{ st.style.display='none'; renderAll(); },200);
    }catch(e){ line('   ✗ build error: '+((e&&e.message)||e),'bad'); setVerdict('Data loaded but failed to build the model: '+((e&&e.message)||e),'bad'); return finish(false); }
  }
  function finish(okFlag,showToken){ title.textContent=okFlag?'Connected':'Not connected'; msg.innerHTML=okFlag?'':'The pipeline could not load. The trace above shows where it stopped.'; diagBtns.style.display='flex'; if(showToken) tokenBox.style.display='block'; }
  document.getElementById('tokenSave').addEventListener('click',()=>{const t=document.getElementById('tokenIn').value.trim();if(t){try{localStorage.setItem(TOKEN_KEY,t);}catch(e){}}go();});
  document.getElementById('retryBtn').addEventListener('click',go);
  document.getElementById('tokenToggle').addEventListener('click',()=>{ tokenBox.style.display = tokenBox.style.display==='none'?'block':'none'; });
  document.getElementById('copyBtn').addEventListener('click',()=>{ const t=diag.textContent+'\n'+(verdict.style.display!=='none'?('VERDICT: '+verdict.textContent):''); try{navigator.clipboard.writeText(t);document.getElementById('copyBtn').textContent='Copied';setTimeout(()=>document.getElementById('copyBtn').textContent='Copy diagnostics',1200);}catch(e){} });
  go();
})();
</script>
