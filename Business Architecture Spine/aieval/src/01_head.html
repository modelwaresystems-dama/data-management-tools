<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Eval Framework</title>
<style>
  /* ===================================================================
     HOUSE THEME: tokens & chrome aligned to the Business Architecture
     Lineage Explorer and the Business Architecture Pack.
     =================================================================== */
  :root{
    --ink:#1a2a3a; --mut:#5b6b7f; --line:#d9e2ec; --panel:#ffffff; --bg:#eef2f6;
    --accent:#1f5c9e; --accent-soft:#e7f0fa; --warn:#c0392b; --warnbg:#fdecea; --ok:#2e7d5b;
    --okbg:#e8f5ef; --okline:#a9d8c3; --amber:#92600a; --amberbg:#fdf3e2; --amberline:#eccb92;
    --shadow:0 1px 3px rgba(20,40,80,.06);
    --p-business:#1f5c9e; --p-decision:#6b3fa0; --p-data:#0f7d7f; --p-records:#a15c00; --p-system:#b03a4a;
    --mono:"SF Mono",ui-monospace,Consolas,monospace;
    --gd-w:460px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
  h1,h2,h3,h4{margin:0 0 .5em;color:var(--ink);line-height:1.25}
  h2{font-size:1.02rem;font-weight:700}
  h3{font-size:.92rem;font-weight:700}
  h4{font-size:.82rem;font-weight:700;color:var(--accent)}
  p{margin:0 0 .7em}

  /* ---- chrome ---- */
  header{background:linear-gradient(135deg,#12325a,#1c4a7a);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  header h1{margin:0;font-size:1.15rem;font-weight:700;letter-spacing:.2px;color:#fff}
  header .sub{font-size:.8rem;opacity:.8}
  .ver{font-size:.7rem;font-weight:700;background:rgba(255,255,255,.18);border-radius:20px;padding:2px 9px;margin-left:8px;vertical-align:middle}
  #tenant{font-size:.82rem;background:rgba(255,255,255,.14);border-radius:20px;padding:4px 12px}
  #facbadge{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:#b8860b;
    color:#fff;border-radius:20px;padding:5px 13px;box-shadow:0 0 0 2px rgba(255,255,255,.22)}
  body.fac header{background:linear-gradient(135deg,#12325a,#1c4a7a 55%,#7a5a12)}
  .hdr-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .file-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#12325a;border:none;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:.85rem;font-family:inherit}
  .file-btn:hover{background:#eef4fb}
  .file-btn.q{background:rgba(255,255,255,.16);color:#fff}
  .file-btn.q:hover{background:rgba(255,255,255,.26)}
  .tabs{display:flex;gap:2px;background:#0f2947;padding:0 18px;overflow-x:auto;scrollbar-width:thin}
  .tab{padding:11px 10px;color:#b9cbe0;cursor:pointer;font-weight:600;font-size:.83rem;border-bottom:3px solid transparent;white-space:nowrap;user-select:none}
  .tab.on{color:#fff;border-bottom-color:#5aa0e0;background:#12325a}
  .tab .tick{font-size:.7rem;opacity:.85;margin-left:6px}
  .wrap{padding:18px 22px;max-width:1560px;margin:0 auto}
  footer{padding:14px 22px;color:var(--mut);font-size:.75rem;text-align:center}
  .view{display:none}.view.on{display:block}

  /* ---- panels ---- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
  .panel>h2:first-child,.panel>h3:first-child{margin-top:0}
  .panel-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .panel-head h2,.panel-head h3{margin:0}
  .spacer{margin-left:auto}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

  /* ---- controls ---- */
  .controls{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .controls .fld{display:flex;flex-direction:column;gap:4px}
  .controls label,label.lb{font-size:.72rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
  select,input[type=text],input[type=search],input[type=number],input[type=date]{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem;background:#fff;font-family:inherit;color:var(--ink);min-width:0}
  textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem;background:#fff;font-family:inherit;color:var(--ink);width:100%;min-height:74px;resize:vertical;line-height:1.5}
  input:focus,select:focus,textarea:focus{outline:2px solid rgba(31,92,158,.32);outline-offset:-1px;border-color:var(--accent)}
  .fw{width:100%}
  .fld-b{display:block;margin-bottom:12px}
  .fld-b>label{display:block;margin-bottom:4px}
  .fld-b>label i{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;color:var(--mut)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:8px 13px;font-size:.83rem;cursor:pointer;color:var(--mut);font-weight:600;font-family:inherit}
  .seg button.on{background:var(--accent);color:#fff}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ink);cursor:pointer;user-select:none;text-transform:none;letter-spacing:0;font-weight:400}
  .hint{color:var(--mut);font-size:.82rem;margin:4px 0 0}
  .empty{color:var(--mut);text-align:center;padding:60px 20px;font-size:.95rem}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 13px;font-size:.83rem;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:#f6fafe;border-color:var(--accent)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.pri:hover{background:#1a4f88}
  .btn.sm{padding:4px 9px;font-size:.76rem}
  .btn.dz{border-color:transparent;background:transparent;color:var(--warn)}
  .btn.dz:hover{background:var(--warnbg);border-color:var(--warn)}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ---- badges / pills ---- */
  .badge{display:inline-block;font-size:.62rem;font-weight:800;color:#fff;border-radius:5px;padding:1px 6px;letter-spacing:.03em;vertical-align:middle;background:var(--mut)}
  .pill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:2px 10px;font-size:.75rem;font-weight:700;margin-right:6px}
  .pill.ok{background:var(--okbg);color:var(--ok)}
  .pill.warn{background:var(--warnbg);color:var(--warn)}
  .pill.amb{background:var(--amberbg);color:var(--amber)}
  .pill.mut{background:#eef2f6;color:var(--mut)}
  .idm{font-family:var(--mono);font-size:.72rem;color:var(--mut)}
  .mono{font-family:var(--mono)}
  .mut{color:var(--mut)}
  .nowrap{white-space:nowrap}

  /* ---- notices ---- */
  .notice{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:11px 14px;font-size:.83rem;margin-bottom:14px}
  .notice.warn{border-left-color:var(--warn);background:var(--warnbg)}
  .notice.ok{border-left-color:var(--ok);background:var(--okbg)}
  .notice.amb{border-left-color:var(--amber);background:var(--amberbg)}

  /* ---- tables ---- */
  table{border-collapse:collapse;width:100%;font-size:.82rem}
  th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
  th{background:#f1f5f9;white-space:nowrap;font-weight:700}
  th.num,td.num{text-align:right}
  tbody tr:hover{background:#f6fafe}
  .tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
  .tbl-wrap table{font-size:.8rem}
  .tbl-wrap th,.tbl-wrap td{border-left:none;border-right:none}
  table input,table select,table textarea{font-size:.78rem;padding:4px 6px;border-radius:6px;width:100%}
  table textarea{min-height:46px}
  td.zero{color:var(--warn);font-weight:700;background:var(--warnbg)}

  /* ---- kpis ---- */
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .kpi{background:#f6fafe;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px;flex:1 1 120px}
  .kpi b{display:block;font-size:1.3rem;color:var(--accent)}
  .kpi span{font-size:.72rem;color:var(--mut)}
  .kpi.ok b{color:var(--ok)}.kpi.bad b{color:var(--warn)}.kpi.amb b{color:var(--amber)}
  .bar{height:7px;border-radius:4px;background:#e3eaf2;overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;background:var(--accent)}

  /* ---- dropzone ---- */
  .drop{border:2px dashed #c4d2e2;border-radius:12px;padding:30px;text-align:center;background:#fbfdff;cursor:pointer}
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}

  /* ---- session flow ---- */
  .phasebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .phasebtn{flex:1 1 210px;text-align:left;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-family:inherit;color:var(--ink)}
  .phasebtn:hover{background:#f6fafe}
  .phasebtn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
  .phasebtn b{display:block;font-size:.86rem;color:var(--accent)}
  .phasebtn span{display:block;font-size:.73rem;color:var(--mut)}
  .steplist{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .stepchip{padding:4px 10px;border:1px solid var(--line);border-radius:20px;background:#fff;cursor:pointer;font-size:.76rem;color:var(--mut);font-weight:600;font-family:inherit}
  .stepchip:hover{border-color:var(--accent)}
  .stepchip.done{border-color:var(--okline);background:var(--okbg);color:var(--ok)}
  .stepchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .slidehead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .slidehead h2{margin:0}
  .tcode{font-family:var(--mono);font-size:.74rem;color:var(--mut);background:#eef2f6;padding:2px 9px;border-radius:20px}
  .facil{background:#fbfdff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
  .facil h4{margin:0 0 5px;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
  .facil p:last-child{margin-bottom:0}
  .say{border-left:3px solid var(--accent);padding-left:11px;font-style:italic;color:var(--mut)}
  .reveal .answer{display:none;margin-top:10px;border:1px solid var(--okline);background:var(--okbg);border-radius:10px;padding:12px 14px;font-size:.83rem}
  .reveal.open .answer{display:block}
  .answer ul{margin:.3em 0 .3em 1.1em;padding:0}
  .timer{font-family:var(--mono);font-size:.83rem;padding:5px 11px;border-radius:20px;background:#eef2f6;border:1px solid var(--line);font-weight:700}
  .timer.run{background:var(--okbg);border-color:var(--okline);color:var(--ok)}
  .timer.over{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
  .navrow{display:flex;gap:8px;align-items:center;margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}

  /* ---- supplied mind map ---- */
  .mapbox{border:1px solid var(--line);border-radius:10px;background:#fbfdff;margin:0 0 12px;overflow:hidden}
  .mapbox>.mh{padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;background:#f2f7fc}
  .mapbox>.mh b{font-size:.86rem}
  .mapbox>.mh .spacer{margin-left:auto}
  .mapbox>.mb{display:none;border-top:1px solid var(--line);padding:13px}
  .mapbox.open>.mb{display:block}
  .mapbox .scroller{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;max-height:460px}
  .mapbox .scroller img{display:block;width:1400px;max-width:none}
  .mapbox.wide .scroller{max-height:none}
  .mapbox.wide .scroller img{width:100%}

  /* ---- iceberg ---- */
  .iceberg{display:grid;gap:7px}
  .icelayer{border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .icelayer.l1{background:#f2f7fc}.icelayer.l2{background:#e9f1f9}
  .icelayer.l3{background:#dfeaf6}.icelayer.l4{background:#d5e3f2}
  .icelayer h4{margin:0 0 2px}
  .icelayer .lev{font-size:.68rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
  .waterline{border-top:2px dashed var(--accent);position:relative;margin:6px 0 8px}
  .waterline span{position:absolute;top:-9px;left:14px;background:var(--panel);padding:0 8px;font-size:.66rem;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;font-weight:700}

  /* ---- spine ---- */
  .vert{display:grid;grid-template-columns:158px 118px 1fr;gap:12px;padding:9px 11px;border-bottom:1px solid var(--line);align-items:start}
  .vert:nth-child(odd){background:#fbfdff}
  .vert .lay{font-weight:700;color:var(--accent);font-size:.78rem}
  .vert .nm{font-size:.83rem}
  .vert .nm em{display:block;font-style:normal;color:var(--mut);font-size:.76rem;margin-top:2px}
  .vert.gap{background:var(--warnbg)}
  .miss{color:var(--warn);font-style:italic}

  /* ---- dimension cards ---- */
  .dimcard{border:1px solid var(--line);border-radius:10px;padding:13px;background:#fff}
  .dimcard.g{border-left:4px solid var(--ok)}
  .dimcard.a{border-left:4px solid var(--amber)}
  .dimcard.r{border-left:4px solid var(--warn)}
  .dimcard .q{font-size:.8rem;color:var(--mut);margin-bottom:9px}
  .rag{display:flex;gap:4px;margin-bottom:9px}
  .rag button{flex:1;padding:5px;font-size:.74rem;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-family:inherit;color:var(--mut);font-weight:600}
  .rag button.sel[data-v=Green]{background:var(--okbg);border-color:var(--okline);color:var(--ok)}
  .rag button.sel[data-v=Amber]{background:var(--amberbg);border-color:var(--amberline);color:var(--amber)}
  .rag button.sel[data-v=Red]{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
  .rag button.sel[data-v="Not assessed"]{background:#eef2f6;color:var(--ink)}
  .pl{display:inline-block;font-size:.62rem;font-weight:800;color:#fff;border-radius:5px;padding:1px 7px;letter-spacing:.03em}
  .pl.b{background:var(--p-business)}.pl.d{background:var(--p-decision)}
  .pl.da{background:var(--p-data)}.pl.r{background:var(--p-records)}
  .pl.s{background:var(--p-system)}

  /* ---- collapsible canvas sections ---- */
  .sect{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:#fff;overflow:hidden}
  .sect>.sh{padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;background:#f6fafe;user-select:none}
  .sect>.sh h3{margin:0;font-size:.88rem}
  .sect>.sb{padding:14px;border-top:1px solid var(--line);display:none}
  .sect.open>.sb{display:block}
  .caret{color:var(--mut);font-weight:800;transition:transform .15s;display:inline-block}
  .sect.open .caret{transform:rotate(90deg)}


  /* ---- facilitator guide drawer ---- */
  .gd-scrim{position:fixed;inset:0;background:rgba(15,41,71,.28);z-index:70;display:none}
  .gd-scrim.on{display:block}
  #guide{position:fixed;top:0;right:0;height:100%;width:min(var(--gd-w),94vw);background:var(--panel);z-index:71;
    box-shadow:-8px 0 26px rgba(20,40,80,.18);display:flex;flex-direction:column;transform:translateX(102%);
    transition:transform .18s ease-out}
  #guide.on{transform:none}
  @media (prefers-reduced-motion:reduce){#guide{transition:none}}
  /* docked: the guide takes its own column and the app keeps working beside it */
  body.gd-docked{padding-right:var(--gd-w)}
  body.gd-docked #guide{box-shadow:-1px 0 0 var(--line)}
  body.gd-docked .gd-scrim{display:none!important}
  .gd-grip{position:absolute;left:0;top:0;bottom:0;width:7px;cursor:col-resize;background:transparent;z-index:2}
  .gd-grip:hover,.gd-grip.drag{background:rgba(90,160,224,.55)}
  body.gd-resizing{user-select:none;cursor:col-resize}
  #guide .gd-dock{background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:8px;height:30px;padding:0 10px;
    font-size:.72rem;font-weight:700;cursor:pointer;font-family:inherit;flex:none;letter-spacing:.03em}
  #guide .gd-dock:hover{background:rgba(255,255,255,.28)}
  #guide header .hdr-btns{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
  @media (max-width:1180px){
    body.gd-docked{padding-right:0}
    body.gd-docked #guide{box-shadow:-8px 0 26px rgba(20,40,80,.18)}
    #guide .gd-dock{display:none}
    body.gd-docked .gd-scrim.on{display:block!important}
  }
  #guide header{background:linear-gradient(135deg,#12325a,#1c4a7a);padding:12px 16px;align-items:flex-start}
  #guide header h2{color:#fff;font-size:.98rem;margin:0}
  #guide header .sub{font-size:.74rem;opacity:.82;margin-top:2px}
  #guide .gd-close{margin-left:auto;background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:8px;
    width:30px;height:30px;font-size:1rem;cursor:pointer;font-family:inherit;flex:none}
  #guide .gd-close:hover{background:rgba(255,255,255,.28)}
  #guide .gd-body{overflow-y:auto;padding:16px;flex:1}
  #guide .gd-foot{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;background:#f6fafe}
  .gd-sec{margin-bottom:16px}
  .gd-sec h4{margin:0 0 6px;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
  .gd-sec p{font-size:.85rem;margin:0 0 8px}
  .gd-sec ul{margin:0;padding-left:18px;font-size:.84rem}
  .gd-sec li{margin-bottom:6px}
  .gd-obj{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--accent-soft);
    border-radius:10px;padding:11px 13px;font-size:.86rem;margin-bottom:16px}
  .gd-obj b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-bottom:3px}
  .gd-watch{border:1px solid var(--warn);background:var(--warnbg);border-left-width:4px;border-radius:10px;padding:11px 13px;margin-bottom:16px}
  .gd-watch h4{color:var(--warn)}
  .gd-done{border:1px solid var(--okline);background:var(--okbg);border-left:4px solid var(--ok);border-radius:10px;
    padding:10px 13px;font-size:.85rem}
  .gd-done b{color:var(--ok)}
  .gd-step{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;background:#fbfdff}
  .gd-step .gd-n{font-family:var(--mono);font-size:.72rem;color:var(--mut)}
  .gd-tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
  .gd-tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 10px;font-size:.76rem;
    cursor:pointer;font-family:inherit;color:var(--mut);font-weight:600}
  .gd-tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .rolecard{border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:12px;background:#fff;break-inside:avoid}
  .rolecard h3{margin:0 0 2px;font-size:.92rem}
  .rolecard .pl-line{font-size:.72rem;color:var(--mut);margin-bottom:8px}
  .rolecard .ask{border-left:3px solid var(--accent);padding-left:10px;font-style:italic;color:var(--mut);
    font-size:.84rem;margin:8px 0}
  /* ===================== v2: requirements, assurance, lifecycle ===================== */
  .reqcard{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:9px;overflow:hidden}
  .reqcard.g{border-left:4px solid var(--ok)}
  .reqcard.a{border-left:4px solid var(--amber)}
  .reqcard.r{border-left:4px solid var(--warn)}
  .reqhead{display:flex;align-items:center;gap:9px;padding:10px 13px;cursor:pointer;user-select:none}
  .reqhead:hover{background:#f6fafe}
  .reqhead .rq-id{font-size:.72rem;color:var(--mut);flex:0 0 auto}
  .reqhead .rq-title{flex:1 1 auto;font-size:.9rem;min-width:0}
  .reqhead .chev{color:var(--mut);font-size:.7rem}
  .reqsub{padding:0 13px 10px 13px;font-size:.73rem;color:var(--mut)}
  .reqbody{border-top:1px solid var(--line);background:#fbfdff;padding:4px 13px 13px}
  .reqgrp{margin-top:12px}
  .reqgrp h4{margin:0 0 7px;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
  .reqgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:9px}
  .reqgrid .fld-b{margin-bottom:0}
  .specwrap{margin-top:16px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:2px 12px 12px}
  .specbar{display:flex;align-items:center;gap:10px;margin:-2px -12px 0;padding:8px 12px;
