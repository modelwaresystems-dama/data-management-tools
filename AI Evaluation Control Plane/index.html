  var psi=0;for(i=0;i<e.length;i++){var ep=e[i]===0?0.0001:e[i],ap=a[i]===0?0.0001:a[i];psi+=(ap-ep)*Math.log(ap/ep);}
  return psi;}
/* CDDQ assertions */
function cddqUnique(vals){var s=new Set(),dup=0,i;for(i=0;i<vals.length;i++){if(s.has(vals[i]))dup++;else s.add(vals[i]);}
  return{dim:'Uniqueness',invalid:dup,passRate:(vals.length-dup)/vals.length,status:dup===0?'PASS':'FAIL'};}
function cddqNotNull(vals){var n=vals.filter(function(v){return v===null||v===undefined||v==='';}).length;
  return{dim:'Completeness',invalid:n,passRate:(vals.length-n)/vals.length,status:n===0?'PASS':'FAIL'};}
function cddqRange(vals,lo,hi){var inv=vals.filter(function(v){return!(v>=lo&&v<=hi);}).length,pr=(vals.length-inv)/vals.length;
  return{dim:'Range Conformance',invalid:inv,passRate:pr,status:pr>=0.995?'PASS':'FAIL'};}
function cddqInSet(vals,set){var s=new Set(set),inv=vals.filter(function(v){return!s.has(v);}).length;
  return{dim:'Domain Conformance',invalid:inv,passRate:(vals.length-inv)/vals.length,status:inv===0?'PASS':'FAIL'};}
/* drift synthesis (inflight_drift_monitor.py thresholds) */
function driftVerdict(psi,deltaF1,overrideRate){
  var breaker=false,reasons=[];
  if(psi>=0.20){breaker=true;reasons.push('Significant covariate shift (PSI '+psi.toFixed(4)+' ≥ 0.20)');}
  else if(psi>=0.10){reasons.push('Moderate covariate shift warning (PSI '+psi.toFixed(4)+')');}
  if(deltaF1<=-0.08){breaker=true;reasons.push('Concept-drift collapse (ΔF1 '+deltaF1.toFixed(4)+' ≤ -0.08)');}
  else if(deltaF1<=-0.05){reasons.push('Concept-drift degradation warning (ΔF1 '+deltaF1.toFixed(4)+')');}
  if(overrideRate>0.12){breaker=true;reasons.push('Override velocity spike ('+(overrideRate*100).toFixed(1)+'% > 12.0%)');}
  else if(overrideRate>0.08){reasons.push('Elevated override warning ('+(overrideRate*100).toFixed(1)+'%)');}
  var action=breaker?'EMERGENCY FALLBACK — revert 100% of traffic to the manual underwriting queue within 1 hour'
    :(reasons.length?'WARNING — schedule recalibration and manual-review sampling':'NORMAL — continue unconstrained production operation');
  return{breaker:breaker,reasons:reasons,action:action};}
/* seeded PRNG + gaussian for in-app sandboxes (reproducible; not numpy) */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gaussians(n,mean,sd,seed){var r=mulberry32(seed),out=[],i;for(i=0;i<n;i++){
  var u1=Math.max(r(),1e-12),u2=r();out.push(mean+sd*Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2));}return out;}

function cddqParseRule(r){
  var m=String(r.Great_Expectations_Assertion_Method||'');
  var s={id:r.CDDQ_Rule_ID,dim:r.CDDQ_Dimension,cde:r.Target_Critical_Data_Element};
  if(/to_be_unique/.test(m))s.type='unique';
  else if(/to_not_be_null/.test(m))s.type='notnull';
  else if(/to_be_between/.test(m)){var nums=(m.match(/-?\d+(?:\.\d+)?/g)||[]).map(parseFloat);s.type='range';s.min=nums[nums.length-2];s.max=nums[nums.length-1];}
  else if(/to_be_in_set/.test(m)){var q=(m.match(/'([^']*)'/g)||[]).map(function(x){return x.slice(1,-1);});s.type='set';s.set=q.slice(1);}
  else if(/match_regex/.test(m))s.type='format';
  else s.type='format';
  return s;
}
function cddqRunSpec(s,n,inj,seed){
  var i,vals=[],res;
  if(s.type==='unique'){for(i=0;i<n;i++)vals.push('K-'+i);for(i=0;i<inj&&i<n;i++)vals[(i*7)%n]=vals[(i*7+1)%n];res=cddqUnique(vals);}
  else if(s.type==='notnull'){for(i=0;i<n;i++)vals.push('v'+i);for(i=0;i<inj&&i<n;i++)vals[(i*7)%n]='';res=cddqNotNull(vals);}
  else if(s.type==='range'){var mid=(s.min+s.max)/2,sd=Math.max((s.max-s.min)/8,0.5);vals=gaussians(n,mid,sd,seed);for(i=0;i<inj&&i<n;i++)vals[(i*7)%n]=(i%2?s.max+(s.max-s.min):s.min-(s.max-s.min));res=cddqRange(vals,s.min,s.max);}
  else if(s.type==='set'){var set=(s.set&&s.set.length)?s.set:['A','B','C'];var rr=mulberry32(seed);for(i=0;i<n;i++)vals.push(set[Math.floor(rr()*set.length)]);for(i=0;i<inj&&i<n;i++)vals[(i*7)%n]='__INVALID__';res=cddqInSet(vals,set);}
  else {for(i=0;i<n;i++)vals.push('OK');for(i=0;i<inj&&i<n;i++)vals[(i*7)%n]='BAD';var bad=vals.filter(function(x){return x==='BAD';}).length,pr=(n-bad)/n;res={dim:s.dim,invalid:bad,passRate:pr,status:pr>=0.995?'PASS':'FAIL'};}
  res.id=s.id;res.cde=s.cde;return res;
}

function runCDDQ(){
  var dp=cddqCurrentDP();
  var specs=rows('cddq').filter(function(r){return r.Data_Product_ID===dp;}).map(cddqParseRule);
  if(!specs.length){el('cdOut').innerHTML='<div class="hint">No CDDQ rules registered for '+esc(dp)+'.</div>';return;}

  var res=specs.map(function(s,idx){return cddqRunSpec(s,n,idx===injIdx?inj:0,seed+idx*131);});
  var breaker=res.some(function(x){return x.status==='FAIL';});
  var html='<div class="hint" style="margin:0 0 10px;font-size:12px">Run #'+cddqRunN+' · '+esc(dp)+' · fresh '+n+'-row sample · '+new Date().toLocaleTimeString()+'</div>';

  html+='<div class="tablewrap"><table class="grid"><thead><tr><th>Assertion</th><th>Dimension</th><th>Critical data element</th><th>Pass rate</th><th>Invalid</th><th>Conformance</th><th>Status</th></tr></thead><tbody>';

}

function viewAudit(){
  return '<div class="eyebrow">Episode 3 · Live engine · recomputation_audit_runner.py</div><h2 class="sec">Recomputation Audit</h2>'+
  '<p class="lead">The headline act: every recorded evaluation status is re-derived from its raw observed value against the threshold, then classified. <b>Optimistic overrides</b> (math FAIL recorded PASS) are the dangerous ones. Edit the rows or paste your own; each finding is signed with a SHA-256 of its payload.</p>'+
  '<div class="panel live"><h4><span class="tag">Live</span>Recompute &amp; classify</h4>'+
  '<p class="pdesc">One record per line: <span class="mono">RunID | Observed | Threshold | RecordedStatus</span>. Loaded below are all '+rows('run').length+' runs from the workbook. Operator (≤ ≥ == in) is parsed from the threshold text.</p>'+
  '<textarea class="data" id="auIn"></textarea>'+
  '<div class="controls" style="margin-top:12px"><button class="runbtn" id="auRun">Recompute audit</button>'+
  '<button class="btn" id="auReset">Reload workbook runs</button>'+
  '<button class="btn" id="auSample">Load the 5-record sample</button></div>'+
  '<div id="auOut"></div></div>';
}
function auDefaultText(){return rows('run').map(function(r){return [r.Eval_Run_ID,r.Observed_Metric_Value,r.Operating_Threshold,r.Recorded_Status].join(' | ');}).join('\n');}
function auSampleText(){return ['RUN01-SEA | 840ms | <= 1000ms | PASS','RUN04-SEA | 1850ms | <= 1200ms | PASS','RUN05-DEQ1 | ECE=0.114 | <= 0.080 | PASS','RUN07-DEQ | FN=0.0012 | <= 0.0005 | FAIL','RUN10-DEQ | Prec=79.2% | >= 85.0% | PASS'].join('\n');}
async function runAudit(){
  var lines=el('auIn').value.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  var findings=[],conc=0,disc=0;
  for(var i=0;i<lines.length;i++){
    var p=lines[i].split('|').map(function(x){return x.trim();});
    if(p.length<4)continue;
    var id=p[0],obs=p[1],th=p[2],rec=p[3].toUpperCase();
    var comp=recompute(obs,th),cls=classifyDiscrepancy(comp,rec),isD=comp!==rec;
    if(isD)disc++;else conc++;
    var sig=await sha256([id,obs,th,comp,rec].join('|'));
    findings.push({id:id,obs:obs,th:th,comp:comp,rec:rec,cls:cls,isD:isD,sig:sig});
  }
  var html='<div class="kpis" style="margin-top:14px">'+
    kpi('Records audited',findings.length,'','')+
    kpi('Concordant',conc,'math agrees with record','good')+
    kpi('Discrepancies',disc,'recorded ≠ computed',disc?'bad':'good')+'</div>';
  html+='<div class="tablewrap"><table class="grid"><thead><tr><th>Run ID</th><th>Observed</th><th>Threshold</th><th>Math</th><th>Recorded</th><th>Classification</th><th>SHA-256</th></tr></thead><tbody>';
  findings.forEach(function(f){var cl=f.cls.indexOf('OPTIMISTIC')>-1?'fail':f.cls.indexOf('PESSIMISTIC')>-1?'warn':'mut';
    html+='<tr'+(f.isD?' style="background:var(--fail-soft)"':'')+'><td><span class="idcell">'+esc(f.id)+'</span></td>'+
    '<td class="mono">'+esc(f.obs)+'</td><td class="mono">'+esc(f.th)+'</td><td>'+statusPill(f.comp)+'</td><td>'+statusPill(f.rec)+'</td>'+
    '<td><span class="pill '+cl+'">'+esc(f.cls.replace(/_/g,' '))+'</span></td><td class="mono" style="font-size:10.5px;color:var(--faint)">'+esc(f.sig.slice(0,16))+'…</td></tr>';});
  html+='</tbody></table></div>';
  if(disc)html='<div class="banner flag"><span class="bi">⚠</span><div><b>'+disc+' discrepanc'+(disc===1?'y':'ies')+' detected.</b> Each overrules the manual status: deployment authority is suspended until reconciliation (control CTRL-AUD01).</div></div>'+html;
  else html='<div class="banner ok"><span class="bi">✓</span><div>All records concordant — recorded statuses reconcile with the recomputed mathematics.</div></div>'+html;
  el('auOut').innerHTML=html;
}

/* ---- ternary gate live engine (Ep3) ---- */
function viewGate(){
  return '<div class="eyebrow">Episode 3 · Live engine · deterministic ternary gatekeeper</div><h2 class="sec">Ternary Release Gate</h2>'+
  '<p class="lead">For each use case the gate synthesises the five lens results from the run log — overriding Data Quality to FAIL where a CDDQ breaker has fired for the consuming data product — and issues a binding verdict: <b>Full Deploy</b>, <b>Restricted Pilot (100% HITL)</b>, or <b>Hard Rejection</b>. No binary rubber-stamp.</p>'+
  '<div id="gateOut"></div>';
}
function gateCompute(){
  var dc=rows('contract'),uc2dp={};dc.forEach(function(r){uc2dp[String(r.Consuming_AI_Use_Case).split(':')[0].trim()]=r.Data_Product_ID;});
  var fired=new Set(rows('cddq').filter(function(r){return String(r.Execution_Status).toUpperCase().indexOf('FIRED')>-1;}).map(function(r){return r.Data_Product_ID;}));
  var LMAP={'Business Quality':'BQ','Decision Quality':'DEQ','Data Quality':'DAQ','System & Engineering Assurance':'SEA','Records & Governance Quality':'RGQ'};
  var byUC={};rows('run').forEach(function(r){var u=r.AI_Use_Case_ID;(byUC[u]=byUC[u]||{})[LMAP[r.Assurance_Lens]]=recompute(r.Observed_Metric_Value,r.Operating_Threshold);});
  var cv=rows('canvas'),names={};cv.forEach(function(r){names[r.AI_Use_Case_ID]=r.AI_Use_Case_Name;});
  var out=[];
  Object.keys(byUC).sort().forEach(function(u){
    var v=Object.assign({},byUC[u]);var ovr=false;
    if(fired.has(uc2dp[u])){if(v.DAQ!=='FAIL'){v.DAQ='FAIL';ovr=true;}}
    var fails=Object.keys(v).filter(function(k){return v[k]==='FAIL';});
    var verdict,cls;
    if(fails.indexOf('BQ')>-1&&fails.indexOf('DEQ')>-1){verdict='HARD REJECTION (FROZEN)';cls='reject';}
    else if(fails.length){verdict='RESTRICTED CONTROLLED PILOT (100% HITL)';cls='pilot';}
    else{verdict='FULL PRODUCTION DEPLOY';cls='deploy';}
    out.push({u:u,name:names[u],v:v,fails:fails,verdict:verdict,cls:cls,ovr:ovr});
  });
  return out;
}
function renderGate(){
  var out=gateCompute().filter(function(o){return !UC_FILTER||o.u===UC_FILTER;});
  var lensOrder=['BQ','DEQ','DAQ','SEA','RGQ'];
  var html='';
  out.forEach(function(o){
    var lenses=lensOrder.map(function(L){var s=o.v[L]||'UNKNOWN';var isOvr=L==='DAQ'&&o.ovr;
      return '<span class="pill '+(s==='PASS'?'pass':'fail')+'" title="'+L+(isOvr?' — overridden by CDDQ breaker':'')+'">'+L+' '+(s==='PASS'?'✓':'✗')+(isOvr?' *':'')+'</span>';}).join(' ');

  });
  return '<p class="hint" style="margin-bottom:10px">* Data-Quality lens overridden to FAIL by a fired CDDQ circuit breaker on the consuming data product.</p>'+html;
}

function runDrift(){

  audit:['Audit_RecomputationEngine','Audit Record ID'],cddq:['25A_ProgrammaticCDDQRules','CDDQ Rule ID'],
  drift:['53_InFlightDriftTelemetry','Monitoring Batch ID'],gating:['Gating_TernaryReleaseEngine','Release Candidate ID'],
  balance:['54_BALANCE_Defensibility','AI Use Case ID'],sunset:['55_ModelSunsetGraveProtocol','AI Use Case ID'],
  wakamoso:['56_WAKAMOSO_EthicalReview','AI Use Case ID']};
function slug(h){h=String(h||'').trim().replace(/[^\w\s]/g,'').replace(/\s+/g,'_');return h.slice(0,46)||'col';}
function loadWorkbook(buf){
  var wb=XLSX.read(buf,{type:'array'});var nd={},loaded=0;
  Object.keys(SHEETCFG).forEach(function(name){var sh=SHEETCFG[name][0],fh=SHEETCFG[name][1];
    if(!wb.Sheets[sh])return;var aoa=XLSX.utils.sheet_to_json(wb.Sheets[sh],{header:1,defval:''});
    var hi=-1;for(var i=0;i<aoa.length;i++){if(String(aoa[i][0]).trim()===fh){hi=i;break;}}if(hi<0)return;
    var hdr=aoa[hi].map(function(c){return String(c).trim();}),ks=[],seen={};
    hdr.forEach(function(h){var k=slug(h);if(k in seen){seen[k]++;k=k+'_'+seen[k];}else seen[k]=0;ks.push(k);});
    var rws=[];for(var j=hi+1;j<aoa.length;j++){if(!aoa[j][0]&&aoa[j][0]!==0)continue;var o={};ks.forEach(function(k,ci){o[k]=aoa[j][ci]==null?'':aoa[j][ci];});rws.push(o);}
    nd[name]={headers:hdr,keys:ks,rows:rws};loaded++;});
  if(!loaded){alertBar('No recognised control-plane sheets found in that workbook.');return;}
  nd._meta=Object.assign({},DATA._meta,{source:'Uploaded workbook'});DATA=nd;
  el('srcChip').textContent='Uploaded workbook';el('srcChip').classList.add('up');
  fillUC();render();
}

/* boot */
el('verBadge').textContent='v'+(document.querySelector('meta[name="version"]')||{}).content||'v1.0.0';
buildNav();fillUC();
document.getElementById('navlist').addEventListener('click',function(e){var b=e.target.closest('[data-nav]');if(b){location.hash=b.dataset.nav;render();}});
window.addEventListener('hashchange',render);
render();

/* --- Modelware: load control-plane workbook from a private GitHub repo (Contents:Read PAT) --- */
(function(){
  function el(id){return document.getElementById(id);}
  var btn=el('repoBtn'); if(!btn) return;
  btn.onclick=function(){
    var last={}; try{last=JSON.parse(sessionStorage.getItem('cp-repo')||'{}');}catch(e){}
    var owner=prompt('GitHub owner (e.g. modelwaresystems-dama):', last.owner||''); if(owner===null)return;
    var repo=prompt('Private repo name (e.g. modelware_app_storage):', last.repo||''); if(repo===null)return;
    var path=prompt('Path to the .xlsx in the repo:', last.path||'Business Architecture Spine/control-plane.xlsx'); if(path===null)return;
    var branch=prompt('Branch:', last.branch||'main')||'main';
    var pat=prompt('Fine-grained PAT (Contents:Read). Kept in memory for this tab only:', ''); if(!pat)return;
    try{sessionStorage.setItem('cp-repo',JSON.stringify({owner:owner,repo:repo,path:path,branch:branch}));}catch(e){}
    var url='https://api.github.com/repos/'+owner+'/'+repo+'/contents/'+path.split('/').map(encodeURIComponent).join('/')+'?ref='+encodeURIComponent(branch);
    fetch(url,{headers:{'Authorization':'Bearer '+pat,'Accept':'application/vnd.github.raw','X-GitHub-Api-Version':'2022-11-28'}})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status+(r.status===404?' (check owner/repo/path/branch & PAT scope)':'')); return r.arrayBuffer(); })
      .then(function(buf){
        loadWorkbook(buf);
        var c=el('srcChip'); if(c){c.textContent='Repo: '+repo+'/'+path.split('/').pop(); c.classList.add('up');}
      })
      .catch(function(e){ alert('Repo load failed: '+e.message); });
  };
})();
