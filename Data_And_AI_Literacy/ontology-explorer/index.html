<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="version" content="1.0.0">
<meta name="mw-asset" content="true">
<meta name="ontology-src" content="gh:modelwaresystems-dama/modelware_app_storage/Data_And_AI_Literacy/Ontology/database">
<title>Ontology Explorer</title>
<style>
  :root{
    --bg:#f6f7f9;--panel:#fff;--panel2:#fbfcfd;--ink:#15181d;--muted:#5c6673;
    --line:#e3e7ec;--line2:#eef1f4;--accent:#2f5bd0;--accent-ink:#1b3a8f;--accent-bg:#eaf0fc;
    --chip:#eef1f6;--chip-ink:#3a4452;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(20,24,29,.06),0 2px 10px rgba(20,24,29,.05);--radius:12px;
    --warn:#b23b2e;--ok:#12946a;
    --concept:#2f5bd0;--actor:#7c3aed;--activity:#0f7b5a;--artifact:#1f6f8b;--capability:#b23b2e;
    --classification:#5c6673;--scale:#8a5a1a;--evidence:#0f7b5a;--other:#5c6673;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0f1216;--panel:#171b21;--panel2:#1b2027;--ink:#e9edf2;--muted:#9aa5b2;
    --line:#272d36;--line2:#20262e;--accent:#6f97ff;--accent-ink:#9db8ff;--accent-bg:#17223c;
    --chip:#232a33;--chip-ink:#c3ccd7;--shadow:0 1px 2px rgba(0,0,0,.4),0 2px 12px rgba(0,0,0,.35);
    --warn:#e0725f;--ok:#39c08c;
    --concept:#6f97ff;--actor:#b49bf0;--activity:#43c494;--artifact:#5aa0cf;--capability:#e0725f;
    --classification:#9aa5b2;--scale:#d9a56a;--evidence:#43c494;--other:#9aa5b2;
  }}
  :root[data-theme="dark"]{
    --bg:#0f1216;--panel:#171b21;--panel2:#1b2027;--ink:#e9edf2;--muted:#9aa5b2;
    --line:#272d36;--line2:#20262e;--accent:#6f97ff;--accent-ink:#9db8ff;--accent-bg:#17223c;
    --chip:#232a33;--chip-ink:#c3ccd7;--warn:#e0725f;--ok:#39c08c;
    --concept:#6f97ff;--actor:#b49bf0;--activity:#43c494;--artifact:#5aa0cf;--capability:#e0725f;
    --classification:#9aa5b2;--scale:#d9a56a;--evidence:#43c494;--other:#9aa5b2;
  }
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  a{color:var(--accent-ink)}
  /* top bar */
  .top{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto;flex-wrap:wrap}
  .top .ttl{font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
  .badge{font:700 11px var(--mono);background:var(--accent-bg);color:var(--accent-ink);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  .nav-btns{display:flex;gap:4px}
  .ib{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
  .ib:disabled{opacity:.4;cursor:default}.ib:hover:not(:disabled){border-color:var(--accent)}
  .crumbs{flex:1;min-width:140px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px;align-items:center;overflow:hidden}
  .crumbs a{cursor:pointer;text-decoration:none;color:var(--muted);white-space:nowrap}
  .crumbs a:hover{color:var(--ink)}
  .crumbs .cur{color:var(--ink);font-weight:700}
  .crumbs .jump{color:var(--accent-ink)}
  .search{position:relative}
  .search input{width:230px;max-width:46vw;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:7px 11px;font:inherit;font-size:13px}
  .search input:focus{outline:none;border-color:var(--accent)}
  .results{position:absolute;top:38px;right:0;width:330px;max-height:340px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:20;display:none}
  .results.show{display:block}
  .results .r{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line2);font-size:13px}
  .results .r:hover{background:var(--panel2)}
  .results .r .ty{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
  /* layout */
  .wrap{flex:1;display:grid;grid-template-columns:186px 1fr 340px;min-height:0}
  .side{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 10px}
  .side h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 6px 6px;font-weight:800}
  .side h4:first-child{margin-top:2px}
  .vbtn{display:block;width:100%;text-align:left;border:1.5px solid transparent;background:transparent;color:var(--ink);border-radius:8px;padding:7px 9px;cursor:pointer;font:inherit;font-size:13px;margin-bottom:2px}
  .vbtn:hover{background:var(--panel2)}.vbtn.on{background:var(--accent-bg);border-color:var(--accent);font-weight:700}
  .fct{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:none;background:transparent;color:var(--ink);border-radius:7px;padding:5px 8px;cursor:pointer;font:inherit;font-size:12.5px;margin-bottom:1px}
  .fct:hover{background:var(--panel2)}.fct.on{background:var(--accent-bg);font-weight:700}
  .fct .dot{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
  .canvas{overflow:auto;position:relative;background:var(--bg)}
  .detail{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 16px}
  /* spine svg */
  svg.spine{display:block;width:100%;height:auto;min-width:560px}
  .snode{cursor:pointer}
  .snode rect{stroke:rgba(255,255,255,.22);stroke-width:1}
  .snode .l{font:700 11.5px -apple-system,sans-serif;fill:#fff;pointer-events:none}
  .snode.sel rect{stroke:var(--ink);stroke-width:2.5}
  .snode.faded{opacity:.2}
  .sedge{fill:none;stroke:var(--line);stroke-width:1.4}
  .sedge.hot{stroke:var(--accent);stroke-width:2.4}.sedge.faded{opacity:.1}
  .bandlab{font:800 10px var(--mono);fill:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  /* ka tree */
  .katree{padding:16px 18px}
  .kahdr{font-size:19px;font-weight:800;margin-bottom:2px}
  .kasub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .tnode{margin:2px 0}
  .trow{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:8px;cursor:pointer}
  .trow:hover{background:var(--panel2)}.trow.sel{background:var(--accent-bg)}
  .tw{width:14px;display:inline-block;text-align:center;color:var(--muted);font-size:11px}
  .tlabel{font-size:13.5px}.tmeta{font-size:11px;color:var(--muted);font-family:var(--mono)}
  .tchild{margin-left:16px;border-left:1px solid var(--line2);padding-left:6px}
  .tpill{font:700 9px var(--mono);border-radius:999px;padding:1px 7px;color:#fff;margin-left:4px}
  /* detail panel */
  .dh{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:800}
  .dt{font-size:19px;font-weight:800;line-height:1.2;margin:4px 0 4px}
  .dtype{display:inline-block;font:700 10px var(--mono);color:#fff;border-radius:999px;padding:2px 9px;margin-bottom:8px}
  .ddef{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.55}
  .dfacets{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px}
  .dfacet{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
  .relgrp{margin:0 0 11px}
  .relgrp .rt{font-size:11px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px;margin-bottom:5px}
  .relgrp .rt .ct{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:700}
  .relgrp .rt .dir{font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px}
  .tgt{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1.5px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 10px;margin:0 5px 5px 0;cursor:pointer;max-width:100%}
  .tgt:hover{border-color:var(--accent)}
  .tgt .d{width:8px;height:8px;border-radius:3px;flex:0 0 8px}
  .tgt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .morebtn{font-size:11.5px;color:var(--accent-ink);background:none;border:none;cursor:pointer;padding:2px 0}
  .empty{color:var(--muted);font-size:13px;padding:20px 4px}
  .openbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--accent);background:var(--accent-bg);color:var(--accent-ink);border-radius:9px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;margin:2px 6px 10px 0}
  /* status / loader */
  .status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50}
  .status .box{max-width:440px;text-align:center;padding:24px}
  .status h3{margin:0 0 8px}.status p{color:var(--muted);font-size:13.5px}
  .status input{width:100%;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:9px 11px;font:inherit;margin:8px 0}
  .status button{border:1.5px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:7px 14px;border-top:1px solid var(--line2);background:var(--panel);flex:0 0 auto;align-items:center;min-height:0}
  .chips .lab{font-size:11px;color:var(--muted);font-weight:700}
  .fchip{font-size:11.5px;border:1.5px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer;background:var(--panel2)}
  .fchip.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-ink);font-weight:700}
  @media (max-width:860px){.wrap{grid-template-columns:1fr}.side,.detail{display:none}.wrap.showdetail .detail{display:block;position:fixed;right:0;top:0;bottom:0;width:86vw;z-index:30;box-shadow:-4px 0 20px rgba(0,0,0,.2)}}
</style>
</head>
<body>
  <div class="top">
    <span class="ttl">Ontology Explorer</span><span class="badge" id="ver"></span>
    <div class="nav-btns"><button class="ib" id="back" title="Back">‹</button><button class="ib" id="fwd" title="Forward">›</button><button class="ib" id="home" title="Overview spine">⌂</button></div>
    <div class="crumbs" id="crumbs"></div>
    <div class="search"><input id="q" placeholder="Search entities…" autocomplete="off"><div class="results" id="results"></div></div>
  </div>
  <div class="wrap" id="wrap">
    <div class="side">
      <h4>Views</h4>
      <button class="vbtn" data-view="spine">Capability Spine</button>
      <button class="vbtn" data-view="ka">Knowledge Area</button>
      <h4>Facets</h4>
      <div id="facetList"></div>
    </div>
    <div class="canvas" id="canvas"></div>
    <div class="detail" id="detail"></div>
  </div>
  <div class="chips" id="chips"></div>

  <div class="status" id="status"><div class="box">
    <h3>Loading ontology…</h3>
    <p id="statusMsg">Fetching from the private repository.</p>
    <div id="tokenBox" style="display:none">
      <input id="tokenIn" type="password" placeholder="Paste your fine-grained PAT (Contents: Read)">
      <div><button id="tokenSave">Connect &amp; load</button></div>
    </div>
  </div></div>

<script>
document.getElementById('ver').textContent='v'+document.querySelector('meta[name="version"]').content;
const TOKEN_KEY=(new URLSearchParams(location.search).get('tokenKey'))||'mdaReadiness.ghpat';
const SRC=(new URLSearchParams(location.search).get('data'))||((document.querySelector('meta[name="ontology-src"]')||{}).content||'');
const TYPECOLORVARS={concept:'--concept',actor:'--actor',activity:'--activity',artifact:'--artifact',capability:'--capability',classification:'--classification',scale:'--scale',evidence:'--evidence',other:'--other'};

function getToken(){try{return localStorage.getItem(TOKEN_KEY)||'';}catch(e){return'';}}
function ghFetch(base,file){
  if(base.indexOf('gh:')===0){
    var r=base.slice(3),ref='main',at=r.lastIndexOf('@');if(at>0){ref=r.slice(at+1);r=r.slice(0,at);}
    var a=r.split('/'),ow=a.shift(),rp=a.shift(),pa=a.join('/')+'/'+file,tk=getToken();
    var h={'Accept':'application/vnd.github.raw','X-GitHub-Api-Version':'2022-11-28'};if(tk)h['Authorization']='Bearer '+tk;
    return fetch('https://api.github.com/repos/'+ow+'/'+rp+'/contents/'+pa+'?ref='+encodeURIComponent(ref),{headers:h,cache:'no-store'});
  }
  return fetch(base.replace(/\/$/,'')+'/'+file,{cache:'no-store'});
}
async function loadJson(file){const r=await ghFetch(SRC,file);if(!r.ok)throw new Error(file+' → HTTP '+r.status);return r.json();}

// ---------- model ----------
const M={ent:new Map(),type:new Map(),rtype:new Map(),facet:new Map(),out:new Map(),inc:new Map()};
function buildModel(ds){
  (ds.entityTypes.items).forEach(t=>M.type.set(t.id,t));
  (ds.relationshipTypes.items).forEach(t=>M.rtype.set(t.id,t));
  (ds.facets.items).forEach(f=>M.facet.set(f.id,f));
  (ds.entities.items).forEach(e=>{M.ent.set(e.id,e);M.out.set(e.id,[]);M.inc.set(e.id,[]);});
  (ds.relationships.items).forEach(r=>{ if(M.out.has(r.sourceEntityId))M.out.get(r.sourceEntityId).push(r); if(M.inc.has(r.targetEntityId))M.inc.get(r.targetEntityId).push(r); });
}
const semCat=id=>{const e=M.ent.get(id);const t=e&&M.type.get(e.entityTypeId);return (t&&t.semanticCategory)||'other';};
const colorOf=id=>getComputedStyle(document.documentElement).getPropertyValue(TYPECOLORVARS[semCat(id)]||'--other').trim()||'#5c6673';
const typeLabel=id=>{const e=M.ent.get(id);const t=e&&M.type.get(e.entityTypeId);return t?t.label:'';};

// ---------- state ----------
const S={view:'spine',focus:null,facet:null,filters:new Set(),hist:[],hi:-1};
function snapshot(){return{view:S.view,focus:S.focus,facet:S.facet,filters:[...S.filters]};}
function pushHist(){ S.hist=S.hist.slice(0,S.hi+1); S.hist.push(snapshot()); S.hi=S.hist.length-1; syncNav(); }
function restore(s){S.view=s.view;S.focus=s.focus;S.facet=s.facet;S.filters=new Set(s.filters);renderAll();}
function syncNav(){document.getElementById('back').disabled=S.hi<=0;document.getElementById('fwd').disabled=S.hi>=S.hist.length-1;}

function select(id,record){ S.focus=id; if(record!==false)pushHist(); renderDetail(); highlightSpine(); if(window.innerWidth<=860)document.getElementById('wrap').classList.add('showdetail'); renderCrumbs(); }
function setView(v,rootId){ S.view=v; if(v==='ka'&&rootId)S.facet=rootId; pushHist(); renderAll(); }

// ---------- SPINE view ----------
const BANDS=[
  {label:'Demand chain',ids:['e:strat','e:bcap','e:dts','e:treq','e:cai']},
  {label:'Operating & people',ids:['e:opmodel','e:role','e:learner','e:pir']},
  {label:'Personas',ids:['e:persona:exec','e:persona:tl','e:persona:pm','e:persona:prof','e:persona:cit']},
  {label:'Knowledge & assessment',ids:['e:ka:dg','e:mastery-concept','e:evidence-concept']},
  {label:'Realization',ids:['e:caprealize','e:outcome']}
];
let spineEls={nodes:{},edges:[]};
function renderSpine(){
  const anchors=[]; BANDS.forEach(b=>b.ids.forEach(id=>{if(M.ent.get(id))anchors.push(id);}));
  const aset=new Set(anchors);
  const colW=210, rowH=66, padX=30, padY=42, nodeW=168, nodeH=42;
  const bandH=Math.max(...BANDS.map(b=>b.ids.filter(id=>M.ent.get(id)).length));
  const W=BANDS.length*colW+padX, Hh=bandH*rowH+padY+30;
  const pos={};
  BANDS.forEach((b,bi)=>{const ids=b.ids.filter(id=>M.ent.get(id));ids.forEach((id,ri)=>{pos[id]={x:padX+bi*colW,y:padY+ri*rowH};});});
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('class','spine');svg.setAttribute('viewBox','0 0 '+W+' '+Hh);
  // band labels
  BANDS.forEach((b,bi)=>{const t=document.createElementNS(NS,'text');t.setAttribute('class','bandlab');t.setAttribute('x',padX+bi*colW);t.setAttribute('y',24);t.textContent=b.label;svg.appendChild(t);});
  // edges among anchors
  spineEls={nodes:{},edges:[]};
  const seen=new Set();
  anchors.forEach(id=>{(M.out.get(id)||[]).forEach(r=>{ if(aset.has(r.targetEntityId)){ const k=r.sourceEntityId+'>'+r.targetEntityId; if(seen.has(k))return;seen.add(k);
    const a=pos[r.sourceEntityId],b=pos[r.targetEntityId];
    const x1=a.x+nodeW,y1=a.y+nodeH/2,x2=b.x,y2=b.y+nodeH/2;
    const p=document.createElementNS(NS,'path');p.setAttribute('class','sedge');
    const mx=(x1+x2)/2;p.setAttribute('d','M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2);
    svg.appendChild(p);spineEls.edges.push({a:r.sourceEntityId,b:r.targetEntityId,el:p});
  }});});
  // nodes
  anchors.forEach(id=>{const e=M.ent.get(id),p=pos[id];
    const g=document.createElementNS(NS,'g');g.setAttribute('class','snode');g.dataset.id=id;
    const rect=document.createElementNS(NS,'rect');rect.setAttribute('x',p.x);rect.setAttribute('y',p.y);rect.setAttribute('width',nodeW);rect.setAttribute('height',nodeH);rect.setAttribute('rx',9);rect.setAttribute('fill',colorOf(id));g.appendChild(rect);
    const t=document.createElementNS(NS,'text');t.setAttribute('class','l');t.setAttribute('x',p.x+nodeW/2);t.setAttribute('y',p.y+nodeH/2+4);t.setAttribute('text-anchor','middle');
    let lab=e.preferredLabel;if(lab.length>24)lab=lab.slice(0,22)+'…';t.textContent=lab;g.appendChild(t);
    g.addEventListener('click',ev=>{ev.stopPropagation();select(id);});
    svg.appendChild(g);spineEls.nodes[id]=g;
  });
  const c=document.getElementById('canvas');c.innerHTML='';c.appendChild(svg);c.addEventListener('click',()=>{});
  highlightSpine();
}
function highlightSpine(){
  if(S.view!=='spine')return;
  const f=S.focus;const nb=new Set();
  if(f){ nb.add(f); (M.out.get(f)||[]).forEach(r=>nb.add(r.targetEntityId)); (M.inc.get(f)||[]).forEach(r=>nb.add(r.sourceEntityId)); }
  Object.entries(spineEls.nodes).forEach(([id,g])=>{g.classList.toggle('sel',id===f);g.classList.toggle('faded',!!f&&!nb.has(id));});
  spineEls.edges.forEach(e=>{const on=f&&(e.a===f||e.b===f);e.el.classList.toggle('hot',!!on);e.el.classList.toggle('faded',!!f&&!on);});
}

// ---------- KA facet view (hierarchy) ----------
function childrenByRel(id,relId){return (M.out.get(id)||[]).filter(r=>r.relationshipTypeId===relId).map(r=>r.targetEntityId);}
function renderKA(){
  const kaId=S.facet||'e:ka:dg';const ka=M.ent.get(kaId);const c=document.getElementById('canvas');
  if(!ka){c.innerHTML='<div class="empty">Knowledge Area not found.</div>';return;}
  const wrap=document.createElement('div');wrap.className='katree';
  wrap.innerHTML='<div class="kahdr">'+ka.preferredLabel+'</div><div class="kasub">'+(ka.definition||'')+'</div>';
  // KA → phases (contains, target type phase) → best practices (contains) → deliverables (produces)
  const phases=childrenByRel(kaId,'rel:contains').filter(id=>typeLabel(id)==='Phase');
  const bps=childrenByRel(kaId,'rel:contains').filter(id=>typeLabel(id)==='Best Practice');
  function row(id,depth,kind){
    const e=M.ent.get(id);const d=document.createElement('div');d.className='tnode';
    const rr=document.createElement('div');rr.className='trow'+(S.focus===id?' sel':'');
    const kids=kind==='phase'?bps.filter(b=>childrenByRel(b,'rel:contains').includes(id)||phaseOf(b)===id):(kind==='bp'?childrenByRel(id,'rel:produces'):[]);
    const hasKids=kids.length>0;
    rr.innerHTML='<span class="tw">'+(hasKids?'▸':'·')+'</span><span class="tlabel">'+e.preferredLabel+'</span>'+(kind==='bp'&&e.attributes&&e.attributes.requiredMastery?'<span class="tpill" style="background:'+colorOf(id)+'">'+e.attributes.requiredMastery+'</span>':'');
    const childWrap=document.createElement('div');childWrap.className='tchild';childWrap.style.display=depth<1?'block':'none';
    if(hasKids&&depth<1)rr.querySelector('.tw').textContent='▾';
    rr.addEventListener('click',ev=>{ev.stopPropagation();select(id);
      if(hasKids){const open=childWrap.style.display==='block';childWrap.style.display=open?'none':'block';rr.querySelector('.tw').textContent=open?'▸':'▾';}
    });
    d.appendChild(rr);
    if(hasKids){kids.forEach(k=>childWrap.appendChild(row(k,depth+1,kind==='phase'?'bp':'del')));d.appendChild(childWrap);}
    return d;
  }
  // map best practice -> phase via its 'contains' phase target
  window.__phaseOf=window.__phaseOf||{};
  function phaseOf(bp){return (M.out.get(bp)||[]).filter(r=>r.relationshipTypeId==='rel:contains'&&typeLabel(r.targetEntityId)==='Phase').map(r=>r.targetEntityId)[0];}
  window.phaseOf=phaseOf;
  if(phases.length){ phases.forEach(p=>wrap.appendChild(row(p,0,'phase'))); }
  else { bps.forEach(b=>wrap.appendChild(row(b,0,'bp'))); }
  c.innerHTML='';c.appendChild(wrap);
}

// ---------- Entity detail (always-on) ----------
const expandState={};
function renderDetail(){
  const d=document.getElementById('detail');
  if(!S.focus){d.innerHTML='<div class="empty">Select an element to explore its meaning and relationships.</div>';return;}
  const e=M.ent.get(S.focus);if(!e){d.innerHTML='<div class="empty">Unknown entity.</div>';return;}
  const col=colorOf(S.focus);
  let h='<div class="dh">Entity</div><div class="dt">'+e.preferredLabel+'</div>';
  h+='<span class="dtype" style="background:'+col+'">'+typeLabel(S.focus)+'</span>';
  if(e.definition)h+='<div class="ddef">'+e.definition+'</div>';
  // open-in-facet action for KAs
  if(typeLabel(S.focus)==='Knowledge Area')h+='<button class="openbtn" data-open="'+S.focus+'">Open Knowledge Area context →</button>';
  if(e.facetIds&&e.facetIds.length)h+='<div class="dfacets">'+e.facetIds.map(f=>'<span class="dfacet">'+((M.facet.get(f)||{}).label||f)+'</span>').join('')+'</div>';
  // relationships grouped by type + direction
  function groupRels(list,dir){
    const by={};list.forEach(r=>{(by[r.relationshipTypeId]=by[r.relationshipTypeId]||[]).push(r);});
    return Object.keys(by).map(rt=>{
      const rtDef=M.rtype.get(rt)||{label:rt};const lab=dir==='out'?rtDef.label:(rtDef.inverseLabel||rtDef.label);
      const items=by[rt].map(r=>dir==='out'?r.targetEntityId:r.sourceEntityId);
      const key=S.focus+'|'+rt+'|'+dir;const shown=expandState[key]?items.length:Math.min(items.length,6);
      let hh='<div class="relgrp"><div class="rt">'+lab+' <span class="ct">'+items.length+'</span> <span class="dir">'+(dir==='out'?'→':'←')+'</span></div>';
      hh+=items.slice(0,shown).map(id=>'<span class="tgt" data-go="'+id+'"><span class="d" style="background:'+colorOf(id)+'"></span><span class="nm">'+M.ent.get(id).preferredLabel+'</span></span>').join('');
      if(items.length>shown)hh+='<button class="morebtn" data-more="'+key+'">+ '+(items.length-shown)+' more</button>';
      hh+='</div>';return hh;
    }).join('');
  }
  const outg=groupRels(M.out.get(S.focus)||[],'out');
  const inc=groupRels(M.inc.get(S.focus)||[],'in');
  if(outg||inc){ h+='<div class="dh" style="margin-top:6px">Relationships</div>'+outg+inc; }
  else h+='<div class="empty">No relationships.</div>';
  d.innerHTML=h;
}

// ---------- crumbs ----------
function renderCrumbs(){
  const c=document.getElementById('crumbs');
  const parts=[];
  parts.push('<a data-home="1">Overview</a>');
  if(S.view==='ka'&&S.facet)parts.push('<span>›</span><a class="jump" data-go="'+S.facet+'">'+M.ent.get(S.facet).preferredLabel+'</a>');
  if(S.focus&&S.focus!==S.facet){const e=M.ent.get(S.focus);if(e)parts.push('<span>›</span><span class="cur">'+e.preferredLabel+'</span>');}
  c.innerHTML=parts.join(' ');
}

// ---------- render orchestration ----------
function renderAll(){
  document.querySelectorAll('.vbtn').forEach(b=>b.classList.toggle('on',b.dataset.view===S.view));
  if(S.view==='spine')renderSpine(); else renderKA();
  renderDetail();renderCrumbs();renderFacets();renderChips();syncNav();
}
function renderFacets(){
  const fl=document.getElementById('facetList');
  fl.innerHTML=[...M.facet.values()].map(f=>'<button class="fct'+(S.facet===f.id?' on':'')+'" data-facet="'+f.id+'"><span class="dot" style="background:var(--accent)"></span>'+f.label+'</button>').join('');
}
function renderChips(){
  const types=[...M.type.values()].filter(t=>[...M.ent.values()].some(e=>e.entityTypeId===t.id));
  const c=document.getElementById('chips');
  c.innerHTML='<span class="lab">Highlight type:</span>'+types.slice(0,10).map(t=>'<span class="fchip'+(S.filters.has(t.id)?' on':'')+'" data-type="'+t.id+'">'+t.label+'</span>').join('');
}

// ---------- events ----------
document.addEventListener('click',ev=>{
  const go=ev.target.closest('[data-go]');if(go){const id=go.dataset.go;if(M.ent.get(id)){if(S.view==='ka'&&typeLabel(id)==='Knowledge Area')setView('ka',id);else select(id);}return;}
  const op=ev.target.closest('[data-open]');if(op){setView('ka',op.dataset.open);return;}
  const mr=ev.target.closest('[data-more]');if(mr){expandState[mr.dataset.more]=true;renderDetail();return;}
  const vb=ev.target.closest('.vbtn');if(vb){setView(vb.dataset.view, vb.dataset.view==='ka'?(S.facet||'e:ka:dg'):null);return;}
  const fc=ev.target.closest('[data-facet]');if(fc){const fid=fc.dataset.facet;S.facet=fid; if(typeLabel) {} // facet click: if KA facet, open KA view; else filter spine to facet members
    if(fid==='facet:knowledge-area'){setView('ka','e:ka:dg');}else{S.view='spine';renderAll();}return;}
  const tc=ev.target.closest('[data-type]');if(tc){const t=tc.dataset.type;if(S.filters.has(t))S.filters.delete(t);else S.filters.add(t);renderChips();applyTypeFilter();return;}
  const hm=ev.target.closest('[data-home]');if(hm){setView('spine');S.facet=null;S.focus=null;renderAll();return;}
});
function applyTypeFilter(){ // dim spine nodes not matching active type filters
  if(S.view!=='spine')return; if(!S.filters.size){highlightSpine();return;}
  Object.entries(spineEls.nodes).forEach(([id,g])=>{const e=M.ent.get(id);g.classList.toggle('faded',!S.filters.has(e.entityTypeId));});
}
document.getElementById('back').addEventListener('click',()=>{if(S.hi>0){S.hi--;restore(S.hist[S.hi]);syncNav();}});
document.getElementById('fwd').addEventListener('click',()=>{if(S.hi<S.hist.length-1){S.hi++;restore(S.hist[S.hi]);syncNav();}});
document.getElementById('home').addEventListener('click',()=>{setView('spine');S.facet=null;S.focus=null;renderAll();});
// search
const q=document.getElementById('q'),results=document.getElementById('results');
q.addEventListener('input',()=>{const v=q.value.trim().toLowerCase();if(!v){results.classList.remove('show');return;}
  const hits=[...M.ent.values()].filter(e=>e.preferredLabel.toLowerCase().includes(v)).slice(0,20);
  results.innerHTML=hits.map(e=>'<div class="r" data-go="'+e.id+'"><div>'+e.preferredLabel+'</div><div class="ty">'+typeLabel(e.id)+'</div></div>').join('')||'<div class="r">No match</div>';
  results.classList.add('show');
});
results.addEventListener('click',ev=>{const r=ev.target.closest('[data-go]');if(r){select(r.dataset.go);results.classList.remove('show');q.value='';}});
document.addEventListener('click',ev=>{if(!ev.target.closest('.search'))results.classList.remove('show');});

// ---------- boot ----------
(async function(){
  const st=document.getElementById('status'),msg=document.getElementById('statusMsg');
  async function go(){
    try{
      msg.textContent='Fetching datasets from the private repository…';
      const index=await loadJson('index.json');
      const [entityTypes,relationshipTypes,facets,entities,relationships]=await Promise.all([
        loadJson('entity-types.json'),loadJson('relationship-types.json'),loadJson('facets.json'),loadJson('entities.json'),loadJson('relationships.json')]);
      buildModel({entityTypes,relationshipTypes,facets,entities,relationships});
      st.style.display='none';
      pushHist();renderAll();
    }catch(e){
      msg.innerHTML='Could not load the ontology: <b>'+(e.message||e)+'</b>.<br>If this is the private repo, paste a fine-grained PAT with Contents: Read.';
      document.getElementById('tokenBox').style.display='block';
    }
  }
  document.getElementById('tokenSave').addEventListener('click',()=>{const t=document.getElementById('tokenIn').value.trim();if(t){try{localStorage.setItem(TOKEN_KEY,t);}catch(e){}document.getElementById('tokenBox').style.display='none';msg.textContent='Loading…';go();}});
  go();
})();
</script>
