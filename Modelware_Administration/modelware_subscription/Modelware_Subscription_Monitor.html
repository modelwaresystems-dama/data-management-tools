<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelware Subscription Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2efe8; --paper-2:#e9e5db; --card:#fbfaf6; --ink:#23282d; --ink-soft:#5a616a;
  --line:#d9d3c6; --steel:#2f5d7c; --steel-2:#3f6b8e; --steel-soft:#e5edf3;
  --good:#3d7a57; --good-soft:#e2f0e8; --warn:#a5722a; --warn-soft:#f6ecd9;
  --cancel:#9a3b3b; --cancel-soft:#f4e2e0; --review:#7a5aa5; --review-soft:#ece5f5;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --shadow:0 1px 2px rgba(35,40,45,.06),0 2px 8px rgba(35,40,45,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#191d21; --paper-2:#20262b; --card:#232a30; --ink:#e7e9ec; --ink-soft:#a2acb5;
    --line:#333c44; --steel:#8fbad8; --steel-2:#7aa9cb; --steel-soft:#25333d;
    --good:#7bc39a; --good-soft:#20342a; --warn:#d8a860; --warn-soft:#33291a;
    --cancel:#e08c8c; --cancel-soft:#39221f; --review:#bda2e0; --review-soft:#2a2333;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.45;
  -webkit-font-smoothing:antialiased;font-size:15px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 96px}
header.top{padding:26px 0 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:23px;font-weight:700;margin:0;letter-spacing:-.2px}
.badge{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--steel);
  background:var(--steel-soft);border:1px solid var(--line);padding:2px 8px;border-radius:20px}
.sub{color:var(--ink-soft);font-size:13px;margin-top:5px}
.sub code{font-family:var(--mono);font-size:12px}
.hdr-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* sync chip */
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;
  border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-soft);flex:0 0 8px}
.sync.synced .dot{background:var(--good)} .sync.synced{color:var(--good)}
.sync.local .dot{background:var(--warn)} .sync.local{color:var(--warn)}
.sync.error .dot{background:var(--cancel)} .sync.error{color:var(--cancel)}
.sync.busy .dot{background:var(--steel);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}

/* controls */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 4px}
.seg{display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink-soft);
  background:none;border:0;padding:6px 14px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--steel);box-shadow:var(--shadow)}
.grow{flex:1}
select,input[type=search],input[type=text],input[type=number],input[type=date],textarea{
  font-family:var(--sans);font-size:13px;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
textarea{resize:vertical;min-height:56px;width:100%}
.btn{font-family:var(--sans);font-size:13px;font-weight:500;color:#fff;background:var(--steel);
  border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--steel);border:1px solid var(--line)}
.btn.danger{background:var(--card);color:var(--cancel);border:1px solid var(--line)}

/* tabs */
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:22px 0 20px;flex-wrap:wrap}
nav.tabs button{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink-soft);
  background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;margin-bottom:-1px}
nav.tabs button.on{color:var(--steel);border-bottom-color:var(--steel)}
nav.tabs .pill{display:inline-block;min-width:18px;font-family:var(--mono);font-size:11px;
  background:var(--review-soft);color:var(--review);border-radius:10px;padding:0 6px;margin-left:6px}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.kpi .val{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:6px;letter-spacing:-.5px}
.kpi .note{font-size:11.5px;color:var(--ink-soft);margin-top:3px}
.kpi.accent .val{color:var(--steel)}
.kpi.cancel .val{color:var(--cancel)}
.kpi.good .val{color:var(--good)}

/* table */
.tablecard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);margin-top:16px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);
  font-weight:600;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--paper-2);cursor:pointer;white-space:nowrap}
thead th.num,td.num{text-align:right;font-family:var(--mono)}
thead th.act,td.act{text-align:right;cursor:default}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr.row:hover{background:var(--paper-2)}
tbody tr:last-child td{border-bottom:0}
.vname{font-weight:600;cursor:pointer}
.vname:hover{color:var(--steel)}
.vcat{font-size:11.5px;color:var(--ink-soft)}
.chip{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:500;
  padding:1px 7px;border-radius:12px;border:1px solid transparent;white-space:nowrap}
.chip.ent{background:var(--steel-soft);color:var(--steel);border-color:var(--line)}
.chip.moved{background:var(--warn-soft);color:var(--warn)}
.chip.active{background:var(--good-soft);color:var(--good)}
.chip.review{background:var(--review-soft);color:var(--review)}
.chip.cancel{background:var(--cancel-soft);color:var(--cancel)}
.chip.vat{background:var(--paper-2);color:var(--ink-soft)}
.chip.edited{background:var(--steel-soft);color:var(--steel-2)}
.call{font-weight:600;font-size:12.5px}
.call.Keep{color:var(--good)} .call.Cancel{color:var(--cancel)} .call.Review{color:var(--review)}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--steel);border-radius:7px;
  padding:5px 9px;font-size:12px;cursor:pointer;font-weight:500}
.iconbtn:hover{background:var(--steel-soft)}
.msel{position:relative}
.msel-btn{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.msel-panel{position:absolute;top:calc(100% + 4px);right:0;background:var(--card);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.16);padding:6px;z-index:30;min-width:210px}
.msel-panel label{display:flex;align-items:center;gap:9px;padding:7px 9px;font-size:13px;border-radius:6px;cursor:pointer}
.msel-panel label:hover{background:var(--paper-2)}
.msel-panel input{accent-color:var(--steel);width:15px;height:15px}
.msel-foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:4px;padding:8px 6px 4px}
.msel-foot button{font-size:12px;background:none;border:0;color:var(--steel);cursor:pointer;font-weight:500}
.grouphdr td{background:var(--paper-2);padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.grouphdr .glabel{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.grouphdr .gcount{font-family:var(--mono);font-weight:500;color:var(--ink-soft);margin-left:8px}
.grouphdr .gtot{float:right;font-family:var(--mono);color:var(--ink);font-weight:600}
.grouphdr .gcar{display:inline-block;width:14px;color:var(--ink-soft)}
.gh-active .glabel{color:var(--good)} .gh-review .glabel{color:var(--review)}
.gh-marked-to-cancel .glabel,.gh-cancelling .glabel,.gh-cancelled .glabel{color:var(--cancel)}
.gh-moved .glabel{color:var(--warn)}
.detail td{background:var(--paper-2);padding:0}
.detail-inner{padding:14px 16px}
.hist{width:100%;font-size:12.5px;margin-top:6px}
.hist th{font-size:10px;padding:5px 8px}
.hist td{padding:5px 8px;font-family:var(--mono);font-size:12px}
.hist tr.rf td{color:var(--good)}
.muted{color:var(--ink-soft)}
.right{text-align:right}

/* review inbox */
.rev{display:grid;gap:12px}
.revcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--steel);
  border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.revcard.warn{border-left-color:var(--warn)} .revcard.info{border-left-color:var(--steel-2)}
.revcard h4{margin:0 0 4px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kind{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.5px;
  padding:2px 8px;border-radius:10px;background:var(--paper-2);color:var(--ink-soft)}
.revcard p{margin:6px 0;font-size:13.5px}
.evi{font-family:var(--mono);font-size:12px;color:var(--ink-soft);background:var(--paper-2);
  border-radius:8px;padding:8px 10px;margin-top:8px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.actions button{font-family:var(--sans);font-size:12.5px;font-weight:500;border-radius:7px;
  padding:6px 12px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.actions button.on{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.decided{font-size:12px;color:var(--good);font-weight:600;margin-top:8px}

/* cards view */
.cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.cardbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.cardbox h3{margin:0 0 2px;font-size:15px}
.cardbox .ctot{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--steel);margin:6px 0 2px}
.cardbox ul{list-style:none;margin:10px 0 0;padding:0;font-size:12.5px}
.cardbox li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.cardbox li:last-child{border-bottom:0}
.cardbox li .a{font-family:var(--mono);color:var(--ink-soft)}

/* prose / import */
.prose{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow);max-width:840px}
.prose h3{margin-top:22px;font-size:15px}
.prose h3:first-child{margin-top:0}
.prose p{font-size:13.5px}
.recon{width:100%;font-size:13px;margin-top:10px}
.recon td,.recon th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
.recon td.num,.recon th.num{text-align:right;font-family:var(--mono)}
.ok{color:var(--good);font-weight:600}
.step{display:flex;gap:12px;margin:14px 0}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--steel);color:#fff;
  font-family:var(--mono);font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:600}
.step .t{font-size:13.5px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,24,28,.5);display:flex;align-items:flex-start;
  justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.28);
  width:100%;max-width:640px;padding:22px 24px}
.modal h2{margin:0 0 4px;font-size:18px}
.modal .mdesc{color:var(--ink-soft);font-size:13px;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px}
.field input,.field select,.field textarea{width:100%}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;align-items:center}
.modal-foot .grow{flex:1}
.note-box{background:var(--paper-2);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--ink-soft);margin-top:14px}

/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  box-shadow:0 -2px 12px rgba(0,0,0,.08);padding:12px 16px;display:none;z-index:40}
.savebar.show{display:block}
.savebar .inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.savebar .msg{font-size:13.5px;font-weight:500}

/* toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);z-index:60;opacity:0;
  transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:var(--cancel);color:#fff}
footer{color:var(--ink-soft);font-size:12px;margin-top:30px;text-align:center}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="title">
        <h1>Modelware Subscription Monitor</h1>
        <span class="badge">Increment 2 · Edit</span>
        <span class="badge" id="buildBadge" title="Build version and time"></span>
      </div>
      <div class="sub" id="subline"></div>
    </div>
    <div class="hdr-actions">
      <div class="sync local" id="syncchip" title="Data source"><span class="dot"></span><span id="synctxt">Local file</span></div>
      <button class="btn" id="importClaudeBtn">↥ Import via Claude</button>
      <button class="btn ghost" id="importBtn" title="Quick local CSV importer (FNB export only)">Local CSV</button>
      <button class="btn ghost" id="addBtn">+ Add</button>
      <button class="btn ghost" id="cfgBtn">⚙ GitHub</button>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="controls">
    <div class="seg" id="entseg">
      <button data-ent="ALL" class="on">All entities</button>
      <button data-ent="MWL">MWL</button>
      <button data-ent="MWI">MWI</button>
    </div>
    <div class="grow"></div>
    <input type="search" id="q" placeholder="Search vendor…">
    <div class="msel" id="mselStatus">
      <button class="msel-btn" id="mselStatusBtn" type="button">All statuses <span aria-hidden="true">▾</span></button>
      <div class="msel-panel hide" id="mselStatusPanel"></div>
    </div>
    <select id="fcall">
      <option value="">All calls</option>
      <option value="Keep">Keep</option>
      <option value="Cancel">Cancel</option>
      <option value="Review">Review</option>
    </select>
  </div>

  <nav class="tabs" id="tabs">
    <button data-tab="inv" class="on">Inventory</button>
    <button data-tab="rev">Review inbox <span class="pill" id="revcount">0</span></button>
    <button data-tab="cards">Cards</button>
    <button data-tab="import">Import &amp; reconciliation</button>
  </nav>

  <section id="tab-inv"></section>
  <section id="tab-rev" class="hide"></section>
  <section id="tab-cards" class="hide"></section>
  <section id="tab-import" class="hide"></section>

  <footer>
    Estimates from actual charges · uncertain items sit in the review inbox · edits commit to the private repo (last-writer-wins).
    <div id="buildFoot" style="margin-top:6px;font-family:var(--mono);font-size:11px"></div>
  </footer>
</div>

<div class="savebar" id="savebar"><div class="inner">
  <span class="msg" id="savemsg"></span>
  <div class="grow"></div>
  <button class="btn ghost" id="discardBtn">Discard</button>
  <button class="btn" id="saveBtn">Save to GitHub</button>
</div></div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

/* ===== config ===== */
const CFG_KEY='mws_sub_gh_cfg_v1';
const DEFAULT_CFG={owner:'modelwaresystems-dama',repo:'modelware_app_storage',
  branch:'main',folder:'modelware_subscription',token:'',editor:''};
function loadCfg(){try{return Object.assign({},DEFAULT_CFG,JSON.parse(localStorage.getItem(CFG_KEY)||'{}'));}catch(e){return{...DEFAULT_CFG};}}
function saveCfg(c){try{localStorage.setItem(CFG_KEY,JSON.stringify(c));}catch(e){}}
let cfg=loadCfg();

/* ===== model ===== */
const CADENCE_MULT={monthly:12,quarterly:4,'6-monthly':2,annual:1,'one-off':0};
const CARDS={MWL:['Veronica CC','Howard CC','Current Account'],MWI:['Howard Business CC','Veronica Business CC']};
const STATUSES=['active','review','marked-to-cancel','cancelling','cancelled','moved'];
const CALLS=['—','Keep','Cancel','Review'];  /* '—' = no advisory (Status is the source of truth) */
const TERMINAL=['cancelling','cancelled'];
const CADENCES=['monthly','quarterly','6-monthly','annual','one-off'];
const VATS=['SA-VAT-15','none','confirm'];
const EDIT_FIELDS={next_renewal:'',cancel_url:'',cancel_steps:'',note:'',edited_by:'',edited_at:'',auto_review:false};
const OVERDUE_MONTHS=2;  // an Active monthly with no charge for this many months → Review

let LIVE=null, sha=null, dirty={}, path=()=> (cfg.folder?cfg.folder.replace(/\/+$/,'')+'/':'')+'subscription_data.json';

function normalise(d){
  d=JSON.parse(JSON.stringify(d));
  (d.subscriptions||[]).forEach((s,i)=>{
    for(const k in EDIT_FIELDS) if(s[k]===undefined) s[k]=EDIT_FIELDS[k];
    if(s.id===undefined) s.id=s.key||('sub_'+i);
  });
  return d;
}
function recompute(s){
  const mult=CADENCE_MULT[s.cadence]??12;
  s.fwd_annual=Math.round((s.last_actual||0)*mult*100)/100;
  s.fund_annual=Math.round(s.fwd_annual*(1+(s.buffer_pct||0)/100)*100)/100;
}
/* overdue-monthly rule: measured against the latest charge in the data (as-of) */
function asOfDate(){let mx='';(LIVE.subscriptions||[]).forEach(s=>(s.charges||[]).forEach(c=>{if(!c.refund&&c.date>mx)mx=c.date;}));
  return mx||LIVE.generated||new Date().toISOString().slice(0,10);}
function monthsMissed(lastPay,asOf){const[ly,lm,ld]=lastPay.split('-').map(Number),[ay,am,ad]=asOf.split('-').map(Number);
  let mo=(ay-ly)*12+(am-lm);if(ad<ld)mo-=1;return mo;}
function cardAsOfMap(){const m={};(LIVE.subscriptions||[]).forEach(s=>(s.charges||[]).forEach(c=>{
  if(!c.refund&&(!m[c.card]||c.date>m[c.card]))m[c.card]=c.date;}));return m;}
function applyOverdueRule(){
  const cm=cardAsOfMap(),gAsOf=asOfDate();let changed=0;
  LIVE.review=(LIVE.review||[]).filter(r=>r.kind!=='overdue');   // system items regenerated each run
  (LIVE.subscriptions||[]).forEach(s=>{
    if(s.cadence!=='monthly')return;
    if(['cancelled','cancelling','marked-to-cancel'].includes(s.status))return;
    const asOf=cm[s.card]||gAsOf;   // 2-month clock runs from the latest statement on THIS card
    const pays=(s.charges||[]).filter(c=>!c.refund).map(c=>c.date).sort();
    const lastPay=pays.length?pays[pays.length-1]:null;
    const missed=lastPay?monthsMissed(lastPay,asOf):999;
    const overdue=missed>=OVERDUE_MONTHS;
    // manual override holds until newer statement data arrives (edit dated at/after as-of)
    const editedRecent=s.edited_at&&s.edited_at.slice(0,10)>=asOf;
    if(overdue&&!editedRecent){
      if(s.status==='active'){s.status='review';s.auto_review=true;dirty[s.id]=true;changed++;}
      if(s.status==='review'){
        LIVE.review.push({kind:'overdue',severity:'warn',
          title:s.name+' — no payment for '+(missed>900?'2+':missed)+' month'+(missed===1?'':'s'),
          detail:'Monthly subscription with no charge since '+(lastPay||'ever')+' (as of latest statement '+asOf+'). '+(s.auto_review?'Auto-moved to Review':'In Review')+'; it returns to Active automatically when a payment appears in a later import.',
          evidence:s.entity+'·'+s.card+' · last paid '+(lastPay||'—')+' · typical R'+(s.typical||0).toFixed(2),
          subId:s.id});
      }
    } else if(s.auto_review&&s.status==='review'&&!overdue){
      s.status='active';s.auto_review=false;dirty[s.id]=true;changed++;
    }
  });
  return changed;
}

/* ===== helpers ===== */
const ZAR=n=>'R'+(n||0).toLocaleString('en-ZA',{minimumFractionDigits:0,maximumFractionDigits:0});
const ZAR2=n=>'R'+(n||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');
  setTimeout(()=>t.className='toast',err?4200:2200);}

/* ===== GitHub Contents API ===== */
function ghHeaders(){return{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};}
function b64enc(str){return btoa(unescape(encodeURIComponent(str)));}
function b64dec(b64){return decodeURIComponent(escape(atob((b64||'').replace(/\n/g,''))));}
async function ghGet(){
  const url=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path()}?ref=${encodeURIComponent(cfg.branch)}`;
  const r=await fetch(url,{headers:ghHeaders()});
  if(r.status===404) return {missing:true};
  if(!r.ok) throw new Error('read '+r.status+': '+(await r.text()).slice(0,160));
  const j=await r.json();
  return {data:JSON.parse(b64dec(j.content)),sha:j.sha};
}
async function ghPut(obj,prevSha,msg){
  const url=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path()}`;
  const body={message:msg,content:b64enc(JSON.stringify(obj,null,1)),branch:cfg.branch};
  if(prevSha) body.sha=prevSha;
  const r=await fetch(url,{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});
  if(r.status===409||r.status===422){const e=new Error('conflict');e.conflict=true;throw e;}
  if(!r.ok) throw new Error('write '+r.status+': '+(await r.text()).slice(0,160));
  return (await r.json()).content.sha;
}
function setSync(kind,txt){
  const c=document.getElementById('syncchip');c.className='sync '+kind;
  document.getElementById('synctxt').textContent=txt;
}
function showBuild(){
  document.getElementById('buildBadge').textContent='v'+BUILD.version;
  document.getElementById('buildFoot').textContent='Build v'+BUILD.version+' · built '+BUILD.built;
}
async function boot(){
  showBuild();
  LIVE=normalise(BUNDLED);
  applyOverdueRule();
  render();
  if(cfg.token&&cfg.owner&&cfg.repo){
    setSync('busy','Connecting…');
    try{
      const res=await ghGet();
      if(res.missing){ setSync('local','Repo empty — seed'); toast('No data file in repo yet — open ⚙ GitHub to seed it.'); }
      else { LIVE=normalise(res.data); sha=res.sha; applyOverdueRule(); setSync('synced','Synced'); render(); checkProposal(true); }
    }catch(e){ setSync('error','Connect failed'); toast('GitHub: '+e.message,true); }
  } else {
    setSync('local','Local file — not connected');
  }
}

/* ===== filtering / kpis ===== */
function subs(){return LIVE.subscriptions;}
function subsFiltered(){
  return subs().filter(s=>{
    if(state.ent!=='ALL'&&s.entity!==state.ent)return false;
    if(state.statusSel.length&&!state.statusSel.includes(s.status))return false;
    if(state.call&&s.call!==state.call)return false;
    if(state.q&&!((s.name||'').toLowerCase().includes(state.q)||(s.category||'').toLowerCase().includes(state.q)))return false;
    return true;
  }).sort((a,b)=>{let av=a[state.sort],bv=b[state.sort];
    if(typeof av==='string'){av=av.toLowerCase();bv=(bv||'').toLowerCase();}
    return (av<bv?-1:av>bv?1:0)*state.dir;});
}
function renderKpis(){
  const box=document.getElementById('kpis');box.innerHTML='';
  const scope=subs().filter(s=>state.ent==='ALL'||s.entity===state.ent);
  const KEPT=['active','review','moved'];
  const runrate=scope.filter(s=>KEPT.includes(s.status)&&s.cadence!=='one-off').reduce((t,s)=>t+s.fwd_annual,0);
  const candidates=scope.filter(s=>s.status==='marked-to-cancel');
  const cancelled=scope.filter(s=>s.status==='cancelled'||s.status==='cancelling');
  const nReview=scope.filter(s=>s.status==='review').length;
  const openRev=(LIVE.review||[]).filter((r,i)=>!state.decisions[i]).length;
  [['Kept run-rate','accent',ZAR(runrate),'fwd annual, still billing, excl. current a/c'],
   ['To-cancel (candidates)','cancel',ZAR(candidates.reduce((t,s)=>t+s.fwd_annual,0)),candidates.length+' marked to cancel'],
   ['Cancelled (saved)','good',ZAR(cancelled.reduce((t,s)=>t+s.fwd_annual,0)),cancelled.length+' cancelled/cancelling'],
   ['Under review','',nReview,'status to confirm'],
   ['Review inbox','',openRev+' open','of '+(LIVE.review||[]).length+' flagged'],
   ['Subscriptions','',scope.length,(state.ent==='ALL'?'both entities':state.ent)],
  ].forEach(([l,cl,v,n])=>{const k=el('div','kpi '+cl);k.appendChild(el('div','lbl',l));
    k.appendChild(el('div','val',v));k.appendChild(el('div','note',n));box.appendChild(k);});
}

function renderInv(){
  const sec=document.getElementById('tab-inv');sec.innerHTML='';
  const card=el('div','tablecard');const tbl=el('table');
  const thead=el('thead');const tr=el('tr');
  COLS.forEach(([k,l,cl])=>{const th=el('th',cl,l+(k&&state.sort===k?(state.dir<0?' ▾':' ▴'):''));
    if(k)th.onclick=()=>{if(state.sort===k)state.dir*=-1;else{state.sort=k;state.dir=(cl==='num'?-1:1);}render();};
    tr.appendChild(th);});
  thead.appendChild(tr);tbl.appendChild(thead);
  const tb=el('tbody');const rows=subsFiltered();
  // group by status, in lifecycle order
  const groups={};rows.forEach(s=>{(groups[s.status]=groups[s.status]||[]).push(s);});
  const order=STATUSES.filter(st=>groups[st]&&groups[st].length);
  Object.keys(groups).forEach(st=>{if(!order.includes(st))order.push(st);});
  order.forEach(st=>{
    const gs=groups[st];
    const tot=gs.reduce((t,s)=>t+(s.fwd_annual||0),0);
    const collapsed=!!state.collapsed[st];
    const hdr=el('tr','grouphdr gh-'+st);
    const hc=el('td');hc.colSpan=COLS.length;
    hc.innerHTML=`<span class="gcar">${collapsed?'▸':'▾'}</span><span class="glabel">${esc(STATUS_LABEL[st]||st)}</span><span class="gcount">${gs.length} sub${gs.length>1?'s':''}</span><span class="gtot">${ZAR(tot)}/yr</span>`;
    hdr.appendChild(hc);
    hdr.onclick=()=>{state.collapsed[st]=!state.collapsed[st];renderInv();};
    tb.appendChild(hdr);
    if(!collapsed) gs.forEach(s=>buildRow(s,tb));
  });
  tbl.appendChild(tb);card.appendChild(tbl);
  if(!rows.length)card.appendChild(el('div','',`<div style="padding:24px;text-align:center" class="muted">No subscriptions match these filters.</div>`));
  sec.appendChild(card);
}

/* ===== save / dirty ===== */
function markDirty(){
  const n=Object.keys(dirty).length;const bar=document.getElementById('savebar');
  document.getElementById('savemsg').textContent=n?(n+' unsaved change'+(n>1?'s':'')):'';
  bar.className='savebar'+(n?' show':'');
  document.getElementById('saveBtn').disabled=!(cfg.token&&cfg.owner);
}
async function doSave(){
  if(!cfg.token){toast('Connect a token first (⚙ GitHub).',true);openCfg();return;}
  setSync('busy','Saving…');document.getElementById('saveBtn').disabled=true;
  LIVE.edited={by:cfg.editor||'(unnamed)',at:new Date().toISOString()};
  const msg='Update subscription register ('+Object.keys(dirty).length+' change(s)) — '+(cfg.editor||'editor');
  try{
    sha=await ghPut(LIVE,sha,msg);
    dirty={};markDirty();setSync('synced','Synced');toast('Saved & committed to GitHub.');
  }catch(e){
    if(e.conflict){
      setSync('error','Conflict');
      if(confirm('The file changed in GitHub since you loaded it (Veronica may have saved). Reload the latest now? Your unsaved edits will be lost.')){
        try{const res=await ghGet();LIVE=normalise(res.data);sha=res.sha;dirty={};markDirty();render();setSync('synced','Synced');toast('Reloaded latest from GitHub.');}
        catch(e2){setSync('error','Reload failed');toast('GitHub: '+e2.message,true);}
      } else {markDirty();}
    } else {setSync('error','Save failed');toast('GitHub: '+e.message,true);document.getElementById('saveBtn').disabled=false;}
  }
}

function parseCSVLine(line){const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else{if(ch==='"')q=true;else if(ch===','){out.push(cur);cur='';}else cur+=ch;}}
  out.push(cur);return out;}
function impAmount(s){s=(s||'').trim();if(!s)return 0;return parseFloat(s.replace(/,/g,''))||0;}
function msftSplit(a){if(Math.abs(a-1600.20)<1)return 'msft_business';if(Math.abs(a-408.90)<1)return 'msft_second';return 'msft_azure';}
function impMatch(desc,amount){for(const [re,k] of IMP_RULES){if(re.test(desc))return k==='_MSFT'?msftSplit(amount):k;}return null;}
function cleanName(desc){return (desc||'').replace(/\s+/g,' ').trim().split(' ').slice(0,3).join(' ')||'Unknown vendor';}
function median(a){const n=a.length;if(!n)return 0;const s=[...a].sort((x,y)=>x-y);return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;}
function chargeKey(c){return c.date+'|'+c.card+'|'+c.gross+'|'+(c.refund?'r':'')+'|'+c.desc;}

function parseStatement(text){
  const lines=text.split(/\r?\n/);let hi=-1;
  for(let i=0;i<lines.length;i++){if(/Account Description/.test(lines[i])){hi=i;break;}}
  if(hi<0)return {error:'Not an AccountTransactionsReport CSV (no header row found).',rows:[]};
  const rows=[];
  for(let i=hi+1;i<lines.length;i++){
    if(!lines[i].trim())continue;
    const f=parseCSVLine(lines[i]);if(f.length<8)continue;
    if(f[0].trim())continue;                       // section / balance rows
    const dt=f[1].trim();if(!/^\d{2}\/\d{2}\/\d{4}$/.test(dt))continue;
    const [d,m,y]=dt.split('/');const iso=`${y}-${m}-${d}`;
    const bank=f[2].trim(),ttype=f[4].trim(),desc=f[5].trim();
    const debit=impAmount(f[6]),credit=impAmount(f[7]);
    const refund=credit>0&&/receipt/i.test(ttype);
    const gross=Math.round((refund?credit:debit)*100)/100;
    if(!gross)continue;
    const ci=IMP_CARD_MAP[bank]||['?',bank,'-'];
    let key=impMatch(desc,refund?credit:debit);
    rows.push({date:iso,entity:ci[0],card:ci[1],holder:ci[2],desc,gross,refund,key});
  }
  return {rows};
}
function classifyImport(parsed){
  const existing=new Set();subs().forEach(s=>(s.charges||[]).forEach(c=>existing.add(chargeKey(c))));
  const byKey={};subs().forEach(s=>{if(s.key)byKey[s.key]=s;});
  const res={rows:parsed.length,add:[],newVendors:{},dups:0,nonsub:[],batch:new Set()};
  parsed.forEach(c=>{
    const ck=chargeKey(c);
    if(existing.has(ck)||res.batch.has(ck)){res.dups++;return;}
    res.batch.add(ck);
    if(c.key==='_bankfee'||c.key==='_current_account'){res.nonsub.push(c);return;}
    const sub=c.key&&byKey[c.key];
    if(sub){res.add.push({sub,charge:c});}
    else{const g=c.key||('unknown:'+cleanName(c.desc));(res.newVendors[g]=res.newVendors[g]||[]).push(c);}
  });
  return res;
}
function recomputeSub(s){
  const ch=(s.charges||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const pays=ch.filter(c=>!c.refund),refs=ch.filter(c=>c.refund);
  s.n_charges=pays.length;s.n_refunds=refs.length;
  s.net_refunds=Math.round(refs.reduce((t,c)=>t+c.gross,0)*100)/100;
  if(pays.length){s.last_actual=pays[pays.length-1].gross;s.typical=Math.round(median(pays.map(c=>c.gross))*100)/100;}
  if(ch.length){s.first_seen=ch[0].date;s.last_seen=ch[ch.length-1].date;}
  const cards=[...new Set(pays.map(c=>c.card))],ents=[...new Set(pays.map(c=>c.entity))];
  s.cards_touched=cards;s.entities_touched=ents;
  s.moved=(cards.length>1||ents.length>1)&&s.cadence!=='one-off';
  if(pays.length){const l=pays[pays.length-1];s.entity=l.entity;s.card=l.card;s.holder=l.holder;}
  s.charges=ch;recompute(s);
}
function applyImport(res){

      vat:meta?meta[3]:'confirm',status:'review',call:'—',buffer_pct:IMP_FOREIGN.has(g)?10:0,
      charges:charges.slice(),...EDIT_FIELDS,_impBatch:batch};
    s.charges.forEach(c=>c._imp=batch);

    evidence:res.nonsub.map(c=>c.date+' '+c.card+' R'+c.gross.toFixed(2)+' '+c.desc.slice(0,26)).join('; ').slice(0,400)});}
  (LIVE.imports=LIVE.imports||[]).push({at:new Date().toISOString().slice(0,16).replace('T',' '),by:cfg.editor||'',
    rows:res.rows,added:res.add.length,newVendors:Object.keys(res.newVendors).length,dups:res.dups,nonsub:res.nonsub.length,
    batch,createdSubIds});
  closeModal();render();markDirty();
  toast('Imported '+res.add.length+' charge(s), '+Object.keys(res.newVendors).length+' new vendor(s). Save to GitHub to commit.');
}
function undoLastImport(){
  const imps=LIVE.imports||[];const last=imps[imps.length-1];
  if(last&&last.batch){
    const ids=new Set(last.createdSubIds||[]);
    // remove charges this import added to existing subs, and delete subs it created
    LIVE.subscriptions=subs().filter(s=>!ids.has(s.id));
    const touched=[];
    subs().forEach(s=>{const before=(s.charges||[]).length;
      s.charges=(s.charges||[]).filter(c=>c._imp!==last.batch);
      if(s.charges.length!==before){recomputeSub(s);dirty[s.id]=true;touched.push(s);}});
    imps.pop();
    applyOverdueRule();markDirty();render();
    toast('Reverted import of '+last.at+' — removed '+(ids.size)+' vendor(s) and '+last.added+' matched charge(s). Save to GitHub to commit.');
    return;
  }
  // legacy / untagged (e.g. the earlier bad import): remove import-created unmatched vendors
  const bad=subs().filter(s=>(!s.key)&&!s.edited_by);
  if(!bad.length){toast('Nothing to undo — no import-created unmatched vendors found.');return;}
  if(!confirm('Remove '+bad.length+' import-created unmatched vendor(s)?\n\nThese have no matched vendor and were never edited by hand. Subscriptions you added or edited yourself are kept.\n\n'+bad.slice(0,12).map(s=>'• '+s.name).join('\n')+(bad.length>12?'\n…':'')))return;
  const ids=new Set(bad.map(s=>s.id));
  LIVE.subscriptions=subs().filter(s=>!ids.has(s.id));
  bad.forEach(s=>{delete dirty[s.id];});
  dirty['__undo_'+Date.now()]=true;   // force a dirty state so the removal can be saved
  applyOverdueRule();markDirty();render();
  toast('Removed '+bad.length+' unmatched vendor(s). Save to GitHub to commit.');
}

function folderPath(name){return (cfg.folder?cfg.folder.replace(/\/+$/,'')+'/':'')+name;}
async function ghGetPath(p){
  const url=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(p).replace(/%2F/g,'/')}?ref=${encodeURIComponent(cfg.branch)}`;
  const r=await fetch(url,{headers:ghHeaders()});
  if(r.status===404) return {missing:true};
  if(!r.ok) throw new Error('read '+r.status);
  const j=await r.json();
  return {raw:b64dec(j.content),sha:j.sha};
}
async function ghDeletePath(p,psha,msg){
  const url=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(p).replace(/%2F/g,'/')}`;
  const r=await fetch(url,{method:'DELETE',headers:ghHeaders(),body:JSON.stringify({message:msg,sha:psha,branch:cfg.branch})});
  if(!r.ok&&r.status!==404) throw new Error('delete '+r.status);
}
async function ghPutFile(p,b64,msg){
  let sha0=null; try{const g=await ghGetPath(p); if(!g.missing) sha0=g.sha;}catch(e){}
  const url=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(p).replace(/%2F/g,'/')}`;
  const body={message:msg,content:b64,branch:cfg.branch}; if(sha0)body.sha=sha0;
  const r=await fetch(url,{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});
  if(!r.ok) throw new Error('upload '+r.status+': '+(await r.text()).slice(0,140));
}
function abToB64(buf){let bin='';const b=new Uint8Array(buf);const ch=0x8000;
  for(let i=0;i<b.length;i+=ch)bin+=String.fromCharCode.apply(null,b.subarray(i,i+ch));return btoa(bin);}

let proposal=null;   // {data, sha, report, reportSha}
async function checkProposal(silent){
  if(!(cfg.token&&cfg.owner&&cfg.repo))return false;
  try{
    const p=await ghGetPath(folderPath('subscription_data.proposed.json'));
    if(p.missing){proposal=null;renderProposalBanner();if(!silent)toast('No import proposal waiting.');return false;}
    let rep='',repSha=null;
    try{const rr=await ghGetPath(folderPath('import_report.md'));if(!rr.missing){rep=rr.raw;repSha=rr.sha;}}catch(e){}
    proposal={data:JSON.parse(p.raw),sha:p.sha,report:rep,reportSha:repSha};
    renderProposalBanner();if(!silent)toast('Import proposal loaded.');return true;
  }catch(e){if(!silent)toast('Check failed: '+e.message,true);return false;}
}
function renderProposalBanner(){
  let b=document.getElementById('propBanner');
  const host=document.getElementById('kpis');
  if(!b){b=el('div');b.id='propBanner';host.parentNode.insertBefore(b,host);}
  if(!proposal){b.innerHTML='';b.style.display='none';return;}
  const n=(proposal.data.subscriptions||[]).length;
  b.style.cssText='display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--steel);background:var(--steel-soft);border-radius:12px;padding:12px 16px;margin:0 0 14px';
  b.innerHTML=`<span>📥 <b>Import proposal ready</b> — Claude parsed a statement (${n} subscriptions proposed). Approve before it's applied.</span><span style="flex:1"></span>`;
  const r=el('button','btn','Review proposal');r.onclick=openProposal;b.appendChild(r);
}
function openProposal(){
  const cur=subs().length,prop=(proposal.data.subscriptions||[]).length;
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal" style="max-width:740px">
    <h2>Import proposal</h2>
    <div class="mdesc">Claude processed a statement and proposes the register below. Accepting replaces the live data (<b>${cur} → ${prop}</b> subscriptions) and commits it. Nothing changes until you click Accept.</div>
    <div class="note-box" style="max-height:360px;overflow:auto;white-space:pre-wrap;font-size:12.5px;line-height:1.5">${esc(proposal.report||'(no report supplied)')}</div>
    <div class="modal-foot">
      <button class="btn danger" id="pReject">Reject</button>
      <div class="grow"></div>
      <button class="btn ghost" id="pCancel">Close</button>
      <button class="btn" id="pAccept">Accept &amp; apply</button></div>
  </div></div>`;
  document.getElementById('pCancel').onclick=closeModal;
  document.getElementById('pAccept').onclick=acceptProposal;
  document.getElementById('pReject').onclick=rejectProposal;
}
async function acceptProposal(){
  setSync('busy','Applying…');
  try{
    sha=await ghPut(proposal.data,sha,'Accept import proposal — apply to register');
    try{const p=await ghGetPath(folderPath('subscription_data.proposed.json'));if(!p.missing)await ghDeletePath(folderPath('subscription_data.proposed.json'),p.sha,'Clear applied proposal');}catch(e){}
    if(proposal.reportSha){try{await ghDeletePath(folderPath('import_report.md'),proposal.reportSha,'Clear applied report');}catch(e){}}
    LIVE=normalise(proposal.data);proposal=null;dirty={};
    applyOverdueRule();setSync('synced','Synced');closeModal();renderProposalBanner();render();
    toast('Proposal applied & committed.');
  }catch(e){setSync('error','Apply failed');toast('GitHub: '+e.message,true);}
}
async function rejectProposal(){
  if(!confirm('Discard this import proposal? The register is unchanged; the statement stays in processed/.'))return;
  try{
    const p=await ghGetPath(folderPath('subscription_data.proposed.json'));if(!p.missing)await ghDeletePath(folderPath('subscription_data.proposed.json'),p.sha,'Reject import proposal');
    if(proposal.reportSha)await ghDeletePath(folderPath('import_report.md'),proposal.reportSha,'Reject import report');
  }catch(e){toast('GitHub: '+e.message,true);}
  proposal=null;closeModal();renderProposalBanner();toast('Proposal rejected.');
}
function openImportClaude(){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal">
    <h2>Import via Claude</h2>
    <div class="mdesc">Pick a statement — any FNB export, a USD-account statement, a single-card CSV, or a PDF. It's uploaded to the repo <code>inbox/</code>; a GitHub Action runs Claude to group and match it (SWIFT/reference lines become real vendors), and returns a <b>proposal</b> you approve here. Takes ~2–3 minutes.</div>
    <input type="file" id="icFile" accept=".csv,.pdf,.txt,text/csv,application/pdf" style="margin:6px 0">
    <div id="icStatus" class="note-box" style="display:none"></div>
    <div class="modal-foot">
      <button class="btn ghost" id="icCheck">Check for proposal</button>
      <div class="grow"></div>
      <button class="btn ghost" id="icCancel">Close</button>
      <button class="btn" id="icUpload" disabled>Upload &amp; run</button></div>
  </div></div>`;
  const $=x=>document.getElementById(x);let file=null;
  $('icCancel').onclick=closeModal;
  $('icCheck').onclick=async()=>{const ok=await checkProposal(false);if(ok){closeModal();openProposal();}};
  $('icFile').onchange=e=>{file=e.target.files[0];$('icUpload').disabled=!file;};
  $('icUpload').onclick=async()=>{
    if(!file)return;
    if(!cfg.token){toast('Connect GitHub first (⚙).',true);return;}
    $('icUpload').disabled=true;$('icStatus').style.display='block';$('icStatus').textContent='Uploading '+file.name+'…';
    try{
      const buf=await file.arrayBuffer();
      await ghPutFile(folderPath('inbox/'+file.name.replace(/[^\w.\- ]+/g,'_')),abToB64(buf),'Add statement to inbox: '+file.name);
      $('icStatus').innerHTML='Uploaded. The GitHub Action is running (~2–3 min). This will check automatically; you can also close and use “Check for proposal” later.';
      let tries=0;const poll=async()=>{tries++;const ok=await checkProposal(true);
        if(ok){$('icStatus').innerHTML='✅ Proposal ready — opening…';setTimeout(()=>{closeModal();openProposal();},600);return;}
        if(tries<15)setTimeout(poll,20000); else $('icStatus').innerHTML='Still running. Close this and click “Check for proposal” in a minute (watch the repo Actions tab).';};
      setTimeout(poll,25000);
    }catch(e){$('icStatus').innerHTML='<span style="color:var(--cancel)">Upload failed: '+esc(e.message)+'</span>';$('icUpload').disabled=false;}
  };
}

/* ===== shell ===== */
function render(){
  const stamp=(LIVE.edited&&LIVE.edited.at)?(' · last edit '+LIVE.edited.at.slice(0,10)+(LIVE.edited.by?(' by '+LIVE.edited.by):'')):'';
  document.getElementById('subline').innerHTML=
    `${subs().length} subscriptions across MWL &amp; MWI · generated ${esc(LIVE.generated||'')}${stamp}`;
  document.getElementById('revcount').textContent=(LIVE.review||[]).filter((r,i)=>!state.decisions[i]).length;
  renderKpis();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));
  ['inv','rev','cards','import'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('hide',t!==state.tab));
  if(state.tab==='inv')renderInv();if(state.tab==='rev')renderRev();
  if(state.tab==='cards')renderCards();if(state.tab==='import')renderImport();
  markDirty();
}
document.getElementById('entseg').onclick=e=>{if(e.target.dataset.ent){state.ent=e.target.dataset.ent;
  document.querySelectorAll('#entseg button').forEach(b=>b.classList.toggle('on',b===e.target));render();}};
document.getElementById('tabs').onclick=e=>{if(e.target.dataset.tab){state.tab=e.target.dataset.tab;render();}};
document.getElementById('q').oninput=e=>{state.q=e.target.value.toLowerCase();if(state.tab==='inv')renderInv();renderKpis();};
document.getElementById('fcall').onchange=e=>{state.call=e.target.value;render();};
// multi-select status filter
function updStatusBtn(){const n=state.statusSel.length;
  document.getElementById('mselStatusBtn').innerHTML=(n===0?'All statuses':n+' status'+(n>1?'es':'')+' selected')+' <span aria-hidden="true">▾</span>';}
function buildStatusPanel(){
  const p=document.getElementById('mselStatusPanel');
  p.innerHTML=STATUSES.map(st=>`<label><input type="checkbox" value="${st}" ${state.statusSel.includes(st)?'checked':''}>${STATUS_LABEL[st]||st}</label>`).join('')
    +`<div class="msel-foot"><button type="button" data-act="all">Select all</button><button type="button" data-act="clear">Clear</button></div>`;
  p.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{
    state.statusSel=[...p.querySelectorAll('input:checked')].map(x=>x.value);updStatusBtn();render();});
  p.querySelector('[data-act=all]').onclick=()=>{state.statusSel=[...STATUSES];buildStatusPanel();updStatusBtn();render();};
  p.querySelector('[data-act=clear]').onclick=()=>{state.statusSel=[];buildStatusPanel();updStatusBtn();render();};
}
document.getElementById('mselStatusBtn').onclick=e=>{e.stopPropagation();document.getElementById('mselStatusPanel').classList.toggle('hide');};
document.addEventListener('click',e=>{const m=document.getElementById('mselStatus');
  if(m&&!m.contains(e.target))document.getElementById('mselStatusPanel').classList.add('hide');});
buildStatusPanel();updStatusBtn();
document.getElementById('cfgBtn').onclick=openCfg;
document.getElementById('addBtn').onclick=()=>openEdit(null);
document.getElementById('importBtn').onclick=openImport;
document.getElementById('importClaudeBtn').onclick=openImportClaude;
document.getElementById('saveBtn').onclick=doSave;
document.getElementById('discardBtn').onclick=()=>{if(confirm('Discard unsaved changes and reload the last loaded data?'))boot();};
boot();
</script>
