<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="version" content="1.9.0">
<meta name="mw-asset" content="true">
<meta name="ontology-src" content="gh:modelwaresystems-dama/modelware_app_storage/Data_And_AI_Literacy/Ontology/database">
<title>Ontology Explorer</title>
<style>
  :root{
    --bg:#f6f7f9;--panel:#fff;--panel2:#fbfcfd;--ink:#15181d;--muted:#5c6673;
    --line:#e3e7ec;--line2:#eef1f4;--accent:#2f5bd0;--accent-ink:#1b3a8f;--accent-bg:#eaf0fc;
    --chip:#eef1f6;--chip-ink:#3a4452;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(20,24,29,.06),0 2px 10px rgba(20,24,29,.05);--radius:12px;
    --warn:#b23b2e;--ok:#12946a;
    --concept:#2f5bd0;--actor:#7c3aed;--activity:#0f7b5a;--artifact:#1f6f8b;--capability:#b23b2e;
    --classification:#5c6673;--scale:#8a5a1a;--evidence:#0f7b5a;--other:#5c6673;--class:#9a3fb0;--assessment:#b8742a;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0f1216;--panel:#171b21;--panel2:#1b2027;--ink:#e9edf2;--muted:#9aa5b2;
    --line:#272d36;--line2:#20262e;--accent:#6f97ff;--accent-ink:#9db8ff;--accent-bg:#17223c;
    --chip:#232a33;--chip-ink:#c3ccd7;--shadow:0 1px 2px rgba(0,0,0,.4),0 2px 12px rgba(0,0,0,.35);
    --warn:#e0725f;--ok:#39c08c;
    --concept:#6f97ff;--actor:#b49bf0;--activity:#43c494;--artifact:#5aa0cf;--capability:#e0725f;
    --classification:#9aa5b2;--scale:#d9a56a;--evidence:#43c494;--other:#9aa5b2;--class:#c479d6;--assessment:#d99a52;
  }}
  :root[data-theme="dark"]{
    --bg:#0f1216;--panel:#171b21;--panel2:#1b2027;--ink:#e9edf2;--muted:#9aa5b2;
    --line:#272d36;--line2:#20262e;--accent:#6f97ff;--accent-ink:#9db8ff;--accent-bg:#17223c;
    --chip:#232a33;--chip-ink:#c3ccd7;--warn:#e0725f;--ok:#39c08c;
    --concept:#6f97ff;--actor:#b49bf0;--activity:#43c494;--artifact:#5aa0cf;--capability:#e0725f;
    --classification:#9aa5b2;--scale:#d9a56a;--evidence:#43c494;--other:#9aa5b2;--class:#c479d6;--assessment:#d99a52;
  }
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  a{color:var(--accent-ink)}
  /* top bar */
  .top{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto;flex-wrap:wrap}
  .top .ttl{font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
  .badge{font:700 11px var(--mono);background:var(--accent-bg);color:var(--accent-ink);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  .nav-btns{display:flex;gap:4px}
  .ib{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
  .ib:disabled{opacity:.4;cursor:default}.ib:hover:not(:disabled){border-color:var(--accent)}
  .crumbs{flex:1;min-width:140px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px;align-items:center;overflow:hidden}
  .crumbs a{cursor:pointer;text-decoration:none;color:var(--muted);white-space:nowrap}
  .crumbs a:hover{color:var(--ink)}
  .crumbs .cur{color:var(--ink);font-weight:700}
  .crumbs .jump{color:var(--accent-ink)}
  .search{position:relative}
  .search input{width:230px;max-width:46vw;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:7px 11px;font:inherit;font-size:13px}
  .search input:focus{outline:none;border-color:var(--accent)}
  .results{position:absolute;top:38px;right:0;width:330px;max-height:340px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:20;display:none}
  .results.show{display:block}
  .results .r{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line2);font-size:13px}
  .results .r:hover{background:var(--panel2)}
  .results .r .ty{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
  /* layout */
  .wrap{flex:1;display:grid;grid-template-columns:186px 1fr 340px;min-height:0}
  .side{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 10px}
  .side h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 6px 6px;font-weight:800}
  .side h4:first-child{margin-top:2px}
  .vbtn{display:block;width:100%;text-align:left;border:1.5px solid transparent;background:transparent;color:var(--ink);border-radius:8px;padding:7px 9px;cursor:pointer;font:inherit;font-size:13px;margin-bottom:2px}
  .vbtn:hover{background:var(--panel2)}.vbtn.on{background:var(--accent-bg);border-color:var(--accent);font-weight:700}
  .fct{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:none;background:transparent;color:var(--ink);border-radius:7px;padding:5px 8px;cursor:pointer;font:inherit;font-size:12.5px;margin-bottom:1px}
  .fct:hover{background:var(--panel2)}.fct.on{background:var(--accent-bg);font-weight:700}
  .fct .dot{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
  .canvas{overflow:auto;position:relative;background:var(--bg)}
  .detail{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 16px}
  /* spine svg */
  svg.spine{display:block;width:100%;height:auto;min-width:560px}
  .snode{cursor:pointer}
  .snode rect{stroke:rgba(255,255,255,.22);stroke-width:1}
  .snode .l{font:700 11.5px -apple-system,sans-serif;fill:#fff;pointer-events:none}
  .snode.sband rect{stroke:var(--line2)}
  .snode .bandl{font:700 10px var(--mono);letter-spacing:.14em;fill:var(--muted);pointer-events:none}
  .snode.sel rect{stroke:var(--ink);stroke-width:2.5}
  .snode.faded{opacity:.2}
  .sedge{fill:none;stroke:var(--line);stroke-width:1.4}
  .sedge.hot{stroke:var(--accent);stroke-width:2.4}.sedge.faded{opacity:.1}
  .sedge.prop{stroke-dasharray:5 4;stroke:var(--muted)}
  .bandlab{font:800 10px var(--mono);fill:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .elab{font:700 9.5px var(--mono);fill:var(--accent-ink);opacity:0;pointer-events:none;transition:opacity .15s;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
  svg.spine.showlabels .elab{opacity:1}
  .elab.hot{opacity:1;fill:var(--accent);font-weight:800}.elab.faded{opacity:0}
  /* context diagram svg */
  svg.ctxsvg{display:block;width:100%;height:auto;min-width:720px}
  .cedge{fill:none;stroke:var(--muted);stroke-width:1.6;opacity:.75}
  .cedge.hot{stroke:var(--accent);stroke-width:2.6;opacity:1}.cedge.faded{opacity:.12}
  .clab{font:700 10px var(--mono);fill:var(--accent-ink);paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
  .clab.faded{opacity:.15}.clab.hot{fill:var(--accent);font-weight:800}
  /* view toolbar + caption */
  .spinebar{display:flex;align-items:center;gap:12px;padding:10px 14px 4px;flex-wrap:wrap}
  .tgl{border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  .tgl.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-ink)}
  .spinehint{font-size:12px;color:var(--muted)}
  .vcap{padding:12px 16px;font-size:12.5px;color:var(--muted);line-height:1.5}
  .vcap b{color:var(--ink)}
  /* SFIA x phase matrix */
  .sfiawrap{padding:8px 16px 24px}
  .sfiah{font-size:15px;margin:14px 0 2px}
  .sfsub{font-size:12px;color:var(--muted);margin-bottom:10px}
  .sfiatab{border-collapse:separate;border-spacing:3px;font-size:12px}
  .sfiatab th{font:700 11px var(--mono);color:var(--muted);padding:4px 8px;text-align:center;font-weight:700}
  .sfiatab th:first-child{text-align:left}
  .sfiatab td{padding:6px 8px;text-align:center;background:var(--panel2);border-radius:6px;color:var(--muted);min-width:42px}
  .sfiatab td:first-child{text-align:left;color:var(--ink);font-weight:700;background:transparent;min-width:96px}
  .sfiatab tr.sfmeta td{font-size:11px;background:transparent;color:var(--muted)}
  .sfiatab tr.sfph td.on{background:var(--accent);color:#fff;font-weight:800;font-family:var(--mono)}
  .vcap.warn{border-left:3px solid var(--scale);background:var(--panel2);border-radius:0 8px 8px 0;margin:10px 14px 0;padding:11px 14px}
  /* ka picker + template */
  .kapick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .kpb{font-size:12px;border:1.5px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;background:var(--panel2);color:var(--ink)}
  .kpb:hover{border-color:var(--accent)}
  .kpb.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-ink);font-weight:700}
  .instof{font-size:12px;font-weight:600;color:var(--muted);margin-left:10px}
  .instof a{cursor:pointer}
  .tmpl{display:flex;flex-direction:column;gap:3px;margin-top:6px}
  .tlvl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .tindent{margin-left:18px}.tindent2{margin-left:36px}
  .tarrow{font:700 10.5px var(--mono);color:var(--muted);margin:2px 0 2px 18px;letter-spacing:.03em}
  .tband{display:flex;align-items:center;gap:7px;font:700 10px var(--mono);letter-spacing:.12em;color:var(--muted);background:var(--panel2);border:1px dashed var(--line2);border-radius:6px;padding:5px 10px;margin:4px 0;cursor:pointer}
  .tband:hover{border-color:var(--accent)}
  .tband .tnote{font-weight:500;letter-spacing:0;opacity:.85}
  .tinline{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;background:var(--panel)}
  .tinline:hover{border-color:var(--accent)}.tinline.sel{border-color:var(--accent);background:var(--accent-bg)}
  .tdot{width:9px;height:9px;border-radius:999px;flex:none}
  .tnote{font-size:11px;color:var(--muted)}
  .tlab{font:600 11px var(--mono);color:var(--muted)}
  /* ka tree */
  .katree{padding:16px 18px}
  .kahdr{font-size:19px;font-weight:800;margin-bottom:2px}
  .kasub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .tnode{margin:2px 0}
  .trow{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:8px;cursor:pointer}
  .trow:hover{background:var(--panel2)}.trow.sel{background:var(--accent-bg)}
  .tw{width:14px;display:inline-block;text-align:center;color:var(--muted);font-size:11px}
  .tlabel{font-size:13.5px}.tmeta{font-size:11px;color:var(--muted);font-family:var(--mono)}
  .tchild{margin-left:16px;border-left:1px solid var(--line2);padding-left:6px}
  .tpill{font:700 9px var(--mono);border-radius:999px;padding:1px 7px;color:#fff;margin-left:4px}
  /* facet view */
  .fgroup{display:flex;align-items:center;gap:8px;margin:16px 0 7px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .fgphase{display:block}
  .fgline{display:flex;align-items:center;gap:8px}
  .phaff{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;text-transform:none;letter-spacing:0;font-weight:600}
  .phaff .affsfia{font:600 10px var(--mono);color:#fff;background:var(--chain);border-radius:5px;padding:2px 7px}
  .phaff .afffit{font:600 10px var(--mono);color:var(--accent-ink);background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:2px 7px}
  .fgcount{font:700 10px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted)}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
  .fgrid.indent{margin-left:16px;padding-left:12px;border-left:2px solid var(--line2)}
  .fnode{display:flex;flex-direction:column;gap:5px}
  .fcard{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer;width:100%}
  .fcard:hover{border-color:var(--accent);background:var(--panel2)}
  .fcard.sel{border-color:var(--accent);background:var(--accent-bg)}
  .fdot{width:9px;height:9px;border-radius:999px;flex:none}
  .fcl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* parent (taxonomy) header */
  .fparent{margin:16px 0 4px}
  .fpbtn{display:flex;align-items:center;gap:9px;text-align:left;border:none;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);padding:4px 2px 7px;font:inherit;font-size:15px;font-weight:800;cursor:pointer;width:100%}
  .fpbtn:hover .fpl{color:var(--accent-ink)}
  .fpbtn.sel .fpl{color:var(--accent-ink)}
  .fpl{flex:1}
  /* relationship chips (cross-spine links) */
  .rchips{display:flex;flex-wrap:wrap;gap:4px;padding-left:4px}
  .rchip{font:600 10.5px var(--mono);color:var(--muted);background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:1px 8px;white-space:nowrap}
  .rchip.lnk{cursor:pointer;color:var(--accent-ink);border-color:var(--accent-bg)}
  .rchip.lnk:hover{background:var(--accent-bg);border-color:var(--accent)}
  /* facet header + mode toggle */
  .facethead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
  .fmode{display:flex;gap:4px;flex:none}
  .fmbtn{border:1.5px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:8px;padding:5px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  .fmbtn.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-ink)}
  /* tree */
  .otree{font-size:13.5px}
  .trow2{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;cursor:default}
  .trow2:hover{background:var(--panel2)}.trow2.sel{background:var(--accent-bg)}
  .ttog{width:16px;flex:none;text-align:center;color:var(--muted);font-size:11px;user-select:none}
  .ttog.has{cursor:pointer;color:var(--accent-ink);font-weight:700}
  .trow2 .tdot{width:9px;height:9px;border-radius:999px;flex:none}
  .tlbl{cursor:pointer;font-weight:600}
  .tlbl:hover{color:var(--accent-ink);text-decoration:underline}
  .tvia{font:600 10.5px var(--mono);color:var(--accent-ink);background:var(--accent-bg);border-radius:999px;padding:1px 7px}
  .ttype2{font:600 11px var(--mono);color:var(--muted);margin-left:auto;white-space:nowrap}
  .tkids{margin-left:2px;border-left:1px solid var(--line2)}
  .trelhdr{display:flex;align-items:center;gap:7px;padding:7px 6px 2px;font:700 10px var(--mono);text-transform:uppercase;letter-spacing:.04em}
  .fgrphdr{display:flex;align-items:center;gap:7px;padding:9px 8px;margin-top:3px;font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;border-radius:7px;background:var(--panel2);border:1px solid var(--line2)}
  .fgrphdr:hover{border-color:var(--accent)}
  .fgrpcar{color:var(--accent);width:10px;display:inline-block}
  .fgrpkids{padding-left:2px}
  .trelname{color:var(--accent-ink)}
  .trelcount{color:var(--muted);background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:0 6px;font-size:9.5px}
  .tchipsrow{display:flex;flex-wrap:wrap;gap:4px;padding:1px 6px 5px}
  /* detail panel */
  .dh{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:800}
  .dt{font-size:19px;font-weight:800;line-height:1.2;margin:4px 0 4px}
  .dtype{display:inline-block;font:700 10px var(--mono);color:#fff;border-radius:999px;padding:2px 9px;margin-bottom:8px}
  .ddef{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.55}
  .dfacets{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px}
  .dfacet{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
  .relgrp{margin:0 0 11px}
  .relgrp .rt{font-size:11px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px;margin-bottom:5px}
  .relgrp .rt .ct{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:700}
  .relgrp .rt .dir{font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px}
  .tgt{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1.5px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 10px;margin:0 5px 5px 0;cursor:pointer;max-width:100%}
  .tgt:hover{border-color:var(--accent)}
  .tgt .d{width:8px;height:8px;border-radius:3px;flex:0 0 8px}
  .tgt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .morebtn{font-size:11.5px;color:var(--accent-ink);background:none;border:none;cursor:pointer;padding:2px 0}
  .empty{color:var(--muted);font-size:13px;padding:20px 4px}
  .openbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--accent);background:var(--accent-bg);color:var(--accent-ink);border-radius:9px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;margin:2px 6px 10px 0}
  /* status / loader */
  .status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50;padding:16px}
  .status .box{max-width:620px;width:100%;text-align:center;padding:24px}
  .status h3{margin:0 0 8px}.status p{color:var(--muted);font-size:13.5px}
  .status input{width:100%;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:9px 11px;font:inherit;margin:8px 0}
  .status button{border:1.5px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
  .status button.ghost{background:transparent;color:var(--accent)}
  .statusBtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .diag{text-align:left;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.5;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin:12px 0 0;max-height:46vh;overflow:auto;white-space:pre-wrap;word-break:break-all}
  .diag .ok{color:#2e9e5b}.diag .bad{color:#d2443b}.diag .warn{color:#c08400}.diag .dim{color:var(--muted)}.diag .u{text-decoration:none;color:var(--accent)}
  .verdict{text-align:left;font-size:13px;margin:12px 0 0;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
  .verdict.bad{border-color:#d2443b;background:color-mix(in srgb,#d2443b 10%,var(--panel2))}
  .verdict.ok{border-color:#2e9e5b;background:color-mix(in srgb,#2e9e5b 10%,var(--panel2))}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:7px 14px;border-top:1px solid var(--line2);background:var(--panel);flex:0 0 auto;align-items:center;min-height:0}
  .chips .lab{font-size:11px;color:var(--muted);font-weight:700}
  .fchip{font-size:11.5px;border:1.5px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer;background:var(--panel2)}
  .fchip.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-ink);font-weight:700}
  @media (max-width:860px){.wrap{grid-template-columns:1fr}.side,.detail{display:none}.wrap.showdetail .detail{display:block;position:fixed;right:0;top:0;bottom:0;width:86vw;z-index:30;box-shadow:-4px 0 20px rgba(0,0,0,.2)}}
</style>
</head>
<body>
  <div class="top">
    <span class="ttl">Ontology Explorer</span><span class="badge" id="ver"></span>
    <div class="nav-btns"><button class="ib" id="back" title="Back">‹</button><button class="ib" id="fwd" title="Forward">›</button><button class="ib" id="home" title="Overview spine">⌂</button></div>
    <div class="crumbs" id="crumbs"></div>
    <div class="search"><input id="q" placeholder="Search entities…" autocomplete="off"><div class="results" id="results"></div></div>
  </div>
  <div class="wrap" id="wrap">
    <div class="side">
      <h4>Views</h4>

    <pre id="diagLog" class="diag" aria-live="polite"></pre>
    <p id="verdict" class="verdict" style="display:none"></p>
    <div id="tokenBox" style="display:none">
      <input id="tokenIn" type="password" placeholder="Paste your fine-grained PAT (Contents: Read)">
      <div class="statusBtns"><button id="tokenSave">Connect &amp; load</button></div>
    </div>
    <div class="statusBtns" id="diagBtns" style="display:none">
      <button id="retryBtn">Retry</button>
      <button id="copyBtn" class="ghost">Copy diagnostics</button>
      <button id="tokenToggle" class="ghost">Change token</button>
    </div>
  </div></div>

<script>
document.getElementById('ver').textContent='v'+document.querySelector('meta[name="version"]').content;
const TOKEN_KEY=(new URLSearchParams(location.search).get('tokenKey'))||'mdaReadiness.ghpat';
const SRC=(new URLSearchParams(location.search).get('data'))||((document.querySelector('meta[name="ontology-src"]')||{}).content||'');
const TYPECOLORVARS={concept:'--concept',actor:'--actor',activity:'--activity',artifact:'--artifact',capability:'--capability',classification:'--classification',scale:'--scale',evidence:'--evidence',class:'--class',assessment:'--assessment',other:'--other'};

function getToken(){try{return localStorage.getItem(TOKEN_KEY)||'';}catch(e){return'';}}
// Parse a gh: source into its parts (or mark it a plain base URL).
function resolveSrc(base){
  if(base.indexOf('gh:')===0){
    var r=base.slice(3),ref='main',at=r.lastIndexOf('@');if(at>0){ref=r.slice(at+1);r=r.slice(0,at);}
    var a=r.split('/'),ow=a.shift(),rp=a.shift(),pa=a.join('/');
    return {gh:true,owner:ow,repo:rp,ref:ref,path:pa};
  }
  return {gh:false,base:base.replace(/\/$/,'')};
}
const SRCINFO=resolveSrc(SRC);
function fileUrl(file){
  if(SRCINFO.gh){ return 'https://api.github.com/repos/'+SRCINFO.owner+'/'+SRCINFO.repo+'/contents/'+SRCINFO.path+'/'+file+'?ref='+encodeURIComponent(SRCINFO.ref); }
  return SRCINFO.base+'/'+file;
}
function ghHeaders(raw){
  var tk=getToken(), h={'Accept':raw?'application/vnd.github.raw':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(tk)h['Authorization']='Bearer '+tk; return h;
}
// A fetch that never throws: returns {ok,status,threw,error,body,json,url}.
async function probe(url,opts){
  var out={url:url,ok:false,status:0,threw:false,error:'',body:'',json:null};
  try{
    var r=await fetch(url,opts);
    out.status=r.status; out.ok=r.ok;
    var txt=await r.text(); out.body=txt;
    try{out.json=JSON.parse(txt);}catch(e){}
  }catch(e){ out.threw=true; out.error=(e&&e.message)||String(e); }
  return out;
}
async function loadJson(file){
  var p=await probe(fileUrl(file),{headers:SRCINFO.gh?ghHeaders(true):undefined,cache:'no-store'});
  if(p.threw) throw new Error(file+' → network error: '+p.error);
  if(!p.ok) throw new Error(file+' → HTTP '+p.status);
  if(p.json==null) throw new Error(file+' → response was not valid JSON');
  return p.json;
}

// ---------- model ----------
const M={ent:new Map(),type:new Map(),rtype:new Map(),facet:new Map(),out:new Map(),inc:new Map()};
function buildModel(ds){
  (ds.entityTypes.items).forEach(t=>M.type.set(t.id,t));
  (ds.relationshipTypes.items).forEach(t=>M.rtype.set(t.id,t));
  (ds.facets.items).forEach(f=>M.facet.set(f.id,f));
  (ds.entities.items).forEach(e=>{M.ent.set(e.id,e);M.out.set(e.id,[]);M.inc.set(e.id,[]);});
  (ds.relationships.items).forEach(r=>{ if(M.out.has(r.sourceEntityId))M.out.get(r.sourceEntityId).push(r); if(M.inc.has(r.targetEntityId))M.inc.get(r.targetEntityId).push(r); });
}
const semCat=id=>{const e=M.ent.get(id);const t=e&&M.type.get(e.entityTypeId);return (t&&t.semanticCategory)||'other';};
const colorOf=id=>getComputedStyle(document.documentElement).getPropertyValue(TYPECOLORVARS[semCat(id)]||'--other').trim()||'#5c6673';
const typeLabel=id=>{const e=M.ent.get(id);const t=e&&M.type.get(e.entityTypeId);return t?t.label:'';};

// ---------- state ----------
const S={view:'spine',focus:null,facet:null,kaRoot:'e:ka:dg',kaInstance:null,spineLabels:true,spineExt:true,facetMode:'tree',filters:new Set(),hist:[],hi:-1};
function snapshot(){return{view:S.view,focus:S.focus,facet:S.facet,kaRoot:S.kaRoot,kaInstance:S.kaInstance,filters:[...S.filters]};}
function pushHist(){ S.hist=S.hist.slice(0,S.hi+1); S.hist.push(snapshot()); S.hi=S.hist.length-1; syncNav(); }
function restore(s){S.view=s.view;S.focus=s.focus;S.facet=s.facet;S.kaRoot=s.kaRoot||'e:ka:dg';S.kaInstance=s.kaInstance||null;S.filters=new Set(s.filters);renderAll();}
function syncNav(){document.getElementById('back').disabled=S.hi<=0;document.getElementById('fwd').disabled=S.hi>=S.hist.length-1;}

function select(id,record){ S.focus=id; if(record!==false)pushHist(); renderDetail(); highlightSpine(); if(S.view==='context')renderContext(); else if(S.view==='affinity')renderAffinity(); if(window.innerWidth<=860)document.getElementById('wrap').classList.add('showdetail'); renderCrumbs(); }
// v: 'spine' | 'ka' (arg = KA entity id) | 'facet' (arg = facet id)
function setView(v,arg){ S.view=v; if(v==='ka'&&arg)S.kaRoot=arg; if(v==='facet'&&arg)S.facet=arg; pushHist(); renderAll(); }

// ---------- SPINE view ----------
const BANDS=[
  {label:'Demand chain',ids:['e:strat','e:bcap','e:dts','e:treq','e:cai']},
  {label:'Operating & people',ids:['e:opmodel','e:role','e:learner','e:pir']},
  {label:'Personas',ids:['e:personaclass']},
  {label:'Knowledge & assessment',ids:['e:kaclass','e:mastery-concept','e:evidence-concept']},
  {label:'Realization',ids:['e:caprealize','e:outcome']}
];
function relLabel(relId){const t=M.rtype.get(relId);return t?t.label:'';}
let spineEls={nodes:{},edges:[]};
function renderSpine(){
  const anchors=[]; BANDS.forEach(b=>b.ids.forEach(id=>{if(M.ent.get(id))anchors.push(id);}));
  const aset=new Set(anchors);
  const colW=210, rowH=66, padX=30, padY=42, nodeW=168, nodeH=42;
  const bandH=Math.max(...BANDS.map(b=>b.ids.filter(id=>M.ent.get(id)).length));
  const W=BANDS.length*colW+padX, Hh=bandH*rowH+padY+30;
  const pos={};
  BANDS.forEach((b,bi)=>{const ids=b.ids.filter(id=>M.ent.get(id));ids.forEach((id,ri)=>{pos[id]={x:padX+bi*colW,y:padY+ri*rowH};});});
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('class','spine'+(S.spineLabels?' showlabels':''));svg.setAttribute('viewBox','0 0 '+W+' '+Hh);
  // band labels
  BANDS.forEach((b,bi)=>{const t=document.createElementNS(NS,'text');t.setAttribute('class','bandlab');t.setAttribute('x',padX+bi*colW);t.setAttribute('y',24);t.textContent=b.label;svg.appendChild(t);});
  // edges among anchors
  spineEls={nodes:{},edges:[]};
  const seen=new Set();
  anchors.forEach(id=>{(M.out.get(id)||[]).forEach(r=>{ if(aset.has(r.targetEntityId)){ const k=r.sourceEntityId+'>'+r.targetEntityId; if(seen.has(k))return;seen.add(k);
    const a=pos[r.sourceEntityId],b=pos[r.targetEntityId];
    const x1=a.x+nodeW,y1=a.y+nodeH/2,x2=b.x,y2=b.y+nodeH/2;
    const p=document.createElementNS(NS,'path');p.setAttribute('class','sedge');
    const mx=(x1+x2)/2;p.setAttribute('d','M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2);
    svg.appendChild(p);
    const lt=document.createElementNS(NS,'text');lt.setAttribute('class','elab');lt.setAttribute('x',mx);lt.setAttribute('y',(y1+y2)/2-3);lt.setAttribute('text-anchor','middle');lt.textContent=relLabel(r.relationshipTypeId);svg.appendChild(lt);
    spineEls.edges.push({a:r.sourceEntityId,b:r.targetEntityId,el:p,lab:lt});
  }});});
  // nodes
  anchors.forEach(id=>{const e=M.ent.get(id),p=pos[id];
    const g=document.createElementNS(NS,'g');g.setAttribute('class','snode');g.dataset.id=id;
    const rect=document.createElementNS(NS,'rect');rect.setAttribute('x',p.x);rect.setAttribute('y',p.y);rect.setAttribute('width',nodeW);rect.setAttribute('height',nodeH);rect.setAttribute('rx',9);rect.setAttribute('fill',colorOf(id));g.appendChild(rect);
    const t=document.createElementNS(NS,'text');t.setAttribute('class','l');t.setAttribute('x',p.x+nodeW/2);t.setAttribute('y',p.y+nodeH/2+4);t.setAttribute('text-anchor','middle');
    let lab=e.preferredLabel;if(lab.length>24)lab=lab.slice(0,22)+'…';t.textContent=lab;g.appendChild(t);
    g.addEventListener('click',ev=>{ev.stopPropagation();select(id);});
    svg.appendChild(g);spineEls.nodes[id]=g;
  });
  const c=document.getElementById('canvas');c.innerHTML='';
  const bar=document.createElement('div');bar.className='spinebar';
  bar.innerHTML='<button class="tgl'+(S.spineLabels?' on':'')+'" id="spineLabelToggle">'+(S.spineLabels?'✓ ':'')+'Show all relationship labels</button><span class="spinehint">Click any element to focus it and read its links.</span>';
  c.appendChild(bar);c.appendChild(svg);
  highlightSpine();
}
function highlightSpine(){
  if(S.view!=='spine')return;
  const f=S.focus;const nb=new Set();
  if(f){ nb.add(f); (M.out.get(f)||[]).forEach(r=>nb.add(r.targetEntityId)); (M.inc.get(f)||[]).forEach(r=>nb.add(r.sourceEntityId)); }
  Object.entries(spineEls.nodes).forEach(([id,g])=>{g.classList.toggle('sel',id===f);g.classList.toggle('faded',!!f&&!nb.has(id));});
  spineEls.edges.forEach(e=>{const on=f&&(e.a===f||e.b===f);e.el.classList.toggle('hot',!!on);e.el.classList.toggle('faded',!!f&&!on);if(e.lab){e.lab.classList.toggle('hot',!!on);e.lab.classList.toggle('faded',!!f&&!on);}});
}

// ---------- helpers ----------
function childrenByRel(id,relId){return (M.out.get(id)||[]).filter(r=>r.relationshipTypeId===relId).map(r=>r.targetEntityId);}
function outTo(id,relId){return (M.out.get(id)||[]).filter(r=>r.relationshipTypeId===relId).map(r=>r.targetEntityId);}
function incFrom(id,relId){return (M.inc.get(id)||[]).filter(r=>r.relationshipTypeId===relId).map(r=>r.sourceEntityId);}
function kaInstances(){return [...M.ent.values()].filter(e=>e.entityTypeId==='type:knowledge-area').sort((a,b)=>a.preferredLabel.localeCompare(b.preferredLabel));}

// ---------- Knowledge Area view: concept TEMPLATE by default + instance picker ----------
function renderKA(){
  const c=document.getElementById('canvas');
  const wrap=document.createElement('div');wrap.className='katree';
  // picker
  const insts=kaInstances();
  const pick=document.createElement('div');pick.className='kapick';
  pick.innerHTML='<button class="kpb'+(S.kaInstance?'':' on')+'" data-ki="">◆ Concept (template)</button>'+
    insts.map(e=>'<button class="kpb'+(S.kaInstance===e.id?' on':'')+'" data-ki="'+e.id+'">'+e.preferredLabel+'</button>').join('');
  wrap.appendChild(pick);

  if(!S.kaInstance){
    // TEMPLATE MODE — the meta-model outline from e:kaclass
    const cls=M.ent.get('e:kaclass');
    const body=document.createElement('div');
    body.innerHTML='<div class="kahdr">Knowledge Area — the concept</div><div class="kasub">'+((cls&&cls.definition)||'The reusable structure every DMBOK Knowledge Area conforms to.')+' Each role below is a slot an instance fills. Click any node for its definition.</div>';
    if(!cls){ body.innerHTML+='<div class="empty">The meta-model (e:kaclass) is not in this dataset — load ontology v0.3.0 or later.</div>'; c.innerHTML='';c.appendChild(wrap);wrap.appendChild(body);return; }
    const R=id=>'e:karole:'+id;
    const node=(id,label,note)=>{const e=M.ent.get(id);const nm=(e&&e.preferredLabel)||label;return '<span class="trow tinline'+(S.focus===id?' sel':'')+'" data-go="'+id+'"><span class="tdot" style="background:'+colorOf(id)+'"></span>'+nm+(note?'<span class="tnote"> — '+note+'</span>':'')+'</span>';};
    let h='<div class="tmpl">';
    h+='<div class="tlvl">'+node('e:kaclass','Knowledge Area')+'</div>';
    h+='<div class="tlvl tindent">'+node(R('definition'),'Definition','is defined by')+node(R('goals'),'Goals & Principles','is guided by')+'</div>';
    h+='<div class="tband" data-go="'+R('business-drivers')+'"><span class="tdot" style="background:'+colorOf(R('business-drivers'))+'"></span>BUSINESS DRIVERS<span class="tnote"> — the business forces that drive the KA</span></div>';
    h+='<div class="tarrow">decomposes into ▾</div>';
    h+='<div class="tlvl tindent">'+node(R('phase'),'Phase')+'</div>';
    h+='<div class="tarrow">holds ▾</div>';
    h+='<div class="tlvl tindent">'+node(R('bestpractice'),'Best Practice — the Activity')+'</div>';
    h+='<div class="tlvl tindent2"><span class="tlab">performed by</span>'+node(R('participant'),'Participants')+'<span class="tlab">using</span>'+node(R('technique'),'Techniques')+node(R('tool'),'Tools')+'<span class="tlab">fed by</span>'+node(R('input'),'Inputs')+node(R('supplier'),'Suppliers','provide')+'</div>';
    h+='<div class="tband" data-go="'+R('technical-drivers')+'"><span class="tdot" style="background:'+colorOf(R('technical-drivers'))+'"></span>TECHNICAL DRIVERS<span class="tnote"> — the technical forces behind the techniques, tools &amp; metrics</span></div>';
    h+='<div class="tarrow">requires ▾</div>';
    h+='<div class="tlvl tindent">'+node(R('deliverable'),'Deliverable — the Output')+'</div>';
    h+='<div class="tlvl tindent2"><span class="tlab">used by</span>'+node(R('consumer'),'Consumers')+'<span class="tlab">scored by</span>'+node(R('scorecard'),'Scorecards')+'</div>';
    h+='<div class="tarrow">form ▾</div>';
    h+='<div class="tlvl tindent">'+node(R('evidence'),'Evidence')+'</div>';
    h+='<div class="tarrow">evidences ▾</div>';
    h+='<div class="tlvl tindent">'+node(R('mastery'),'Mastery')+'<span class="tlab">measured by</span>'+node(R('metric'),'Metrics')+'</div>';
    h+='</div>';
    h+='<div class="kasub" style="margin-top:14px">'+insts.length+' Knowledge Areas conform to this template — pick one above to see it populated.</div>';
    body.innerHTML+=h;
    wrap.appendChild(body);
  } else {
    // INSTANCE MODE
    const ka=M.ent.get(S.kaInstance);
    const body=document.createElement('div');
    body.innerHTML='<div class="kahdr">'+ka.preferredLabel+'<span class="instof">instance of → <a data-ki="">Knowledge Area</a></span></div><div class="kasub">'+(ka.definition||'')+'</div>';
    const bps=childrenByRel(S.kaInstance,'rel:contains').filter(id=>typeLabel(id)==='Best Practice');
    const phaseOf=bp=>(M.out.get(bp)||[]).filter(r=>r.relationshipTypeId==='rel:contains'&&typeLabel(r.targetEntityId)==='Phase').map(r=>r.targetEntityId)[0];
    if(bps.length){
      const byPhase={};bps.forEach(b=>{const p=phaseOf(b)||'e:phase:other';(byPhase[p]=byPhase[p]||[]).push(b);});
      const phOrder=['e:phase:planning','e:phase:development','e:phase:operations','e:phase:control','e:phase:other'];
      const phKeys=Object.keys(byPhase).sort((a,b)=>phOrder.indexOf(a)-phOrder.indexOf(b));
      phKeys.forEach(p=>{
        const pe=M.ent.get(p);
        // Activity Affinity for this phase (fit, not mastery): the thinking styles / strengths that suit it,
        // and its SFIA band → expected mastery. Mirrors the Spine Map affinity model.
        const suitedBy=(M.inc.get(p)||[]).filter(r=>r.relationshipTypeId==='rel:suits').map(r=>M.ent.get(r.sourceEntityId)).filter(Boolean);
        const ts=suitedBy.filter(e=>e.entityTypeId==='type:thinking-style').map(e=>(e.preferredLabel.match(/\(([^)]+)\)/)||[])[1]||e.preferredLabel);
        const sd=suitedBy.filter(e=>e.entityTypeId==='type:strength-domain').map(e=>e.preferredLabel);
        const pa=(pe&&pe.attributes)||{};let sfiaTxt='';
        if(pa.sfiaMin){sfiaTxt='SFIA L'+pa.sfiaMin+(pa.sfiaMax>pa.sfiaMin?'–'+pa.sfiaMax:'');
          const top=M.ent.get('e:sfialvl:'+pa.sfiaMax);const mrel=top&&(M.out.get(top.id)||[]).find(r=>r.relationshipTypeId==='rel:maps-to');const ml=mrel&&M.ent.get(mrel.targetEntityId);if(ml)sfiaTxt+=' → '+ml.preferredLabel.replace(/^M\d+\s*/,'')+' expected';}
        const aff=[];if(sfiaTxt)aff.push('<span class="affsfia">'+sfiaTxt+'</span>');
        if(ts.length||sd.length)aff.push('<span class="afffit">fits '+[...ts,...sd].join(' · ')+'</span>');
        const ph=document.createElement('div');ph.className='fgroup fgphase';
        ph.innerHTML='<div class="fgline"><span>'+((pe&&pe.preferredLabel)||'Phase')+'</span><span class="fgcount">'+byPhase[p].length+'</span></div>'+(aff.length?'<div class="phaff">'+aff.join('')+'</div>':'');
        body.appendChild(ph);
        byPhase[p].forEach(b=>{
          const be=M.ent.get(b);
          const row=document.createElement('div');row.className='trow'+(S.focus===b?' sel':'');row.dataset.go=b;
          const dels=childrenByRel(b,'rel:produces');
          row.innerHTML='<span class="tw">'+(dels.length?'▸':'·')+'</span><span class="tlabel">'+be.preferredLabel+'</span>'+(be.attributes&&be.attributes.requiredMastery?'<span class="tpill" style="background:'+colorOf(b)+'">'+be.attributes.requiredMastery+'</span>':'');
          const kids=document.createElement('div');kids.className='tchild';kids.style.display='none';
          dels.forEach(d=>{const de=M.ent.get(d);const dr=document.createElement('div');dr.className='trow';dr.dataset.go=d;dr.innerHTML='<span class="tw">·</span><span class="tlabel">'+de.preferredLabel+'</span>';kids.appendChild(dr);});
          row.addEventListener('click',ev=>{ev.stopPropagation();select(b);if(dels.length){const o=kids.style.display==='block';kids.style.display=o?'none':'block';row.querySelector('.tw').textContent=o?'▸':'▾';}});
          body.appendChild(row);body.appendChild(kids);
        });
      });
      // DG context groups, if present
      const ctx=incFrom(S.kaInstance,'rel:has-participant').concat(incFrom(S.kaInstance,'rel:uses-tool')); // quick presence check
      const ctxEls=[...M.ent.values()].filter(e=>e.entityTypeId==='type:context-element'&&(M.inc.get(e.id)||[]).some(r=>r.sourceEntityId===S.kaInstance));
      if(ctxEls.length){ const g=document.createElement('div');g.className='fgroup';g.innerHTML='<span>Context diagram</span><span class="fgcount">'+ctxEls.length+'</span>';body.appendChild(g);
        const grid=document.createElement('div');grid.className='fgrid';
        ctxEls.sort((a,b)=>a.preferredLabel.localeCompare(b.preferredLabel)).forEach(e=>{const cd=document.createElement('button');cd.className='fcard';cd.dataset.go=e.id;cd.innerHTML='<span class="fdot" style="background:'+colorOf(e.id)+'"></span><span class="fcl">'+e.preferredLabel+'</span>';grid.appendChild(cd);});
        body.appendChild(grid);
      }
    } else {
      const lvl=outTo(S.kaInstance,'rel:grouped-by').map(id=>(M.ent.get(id)||{}).preferredLabel).join(', ');
      body.innerHTML+='<div class="empty">No activities mapped for this Knowledge Area yet. It conforms to the Knowledge Area template'+(lvl?' and sits at DMBOK level: <b>'+lvl+'</b>':'')+'. Data Governance is the fully-mapped exemplar — the other 16 are stubs for now.</div>';
    }
    wrap.appendChild(body);
  }
  c.innerHTML='';c.appendChild(wrap);
}

// ---------- Context Diagram view: the DMBOK KA context diagram, data-driven ----------
const CTXCOL={ // explicit palette matching the DMBOK context-diagram convention
  'e:kaclass':'--artifact','e:karole:definition':'--artifact','e:karole:goals':'--artifact',
  'e:karole:evidence':'--capability','e:karole:mastery':'--artifact',
  'e:karole:bestpractice':'--actor','e:karole:deliverable':'--activity'
};
function ctxColorVar(id){
  if(CTXCOL[id]) return CTXCOL[id];
  if(id.indexOf('e:phase:')===0) return '--concept';
  if(id.indexOf('e:score:')===0) return '--scale';
  return '--classification'; // supplier/input/tool/participant/technique/consumer/metric
}
function renderContext(){
  const c=document.getElementById('canvas');
  if(!M.ent.get('e:kaclass')){c.innerHTML='<div class="empty">The Knowledge Area meta-model isn\'t in this dataset. Load ontology v0.3.1 or later.</div>';return;}
  const NS='http://www.w3.org/2000/svg';
  const nodeW=162,nodeH=42;
  // fixed pixel layout mirroring Howard's hand-drawn DMBOK context diagram
  const N={

const CTXROLE_LABEL={participant:'Participants & Roles',tool:'Tools & Technology',technique:'Techniques & Methods',metric:'Metrics',input:'Inputs',supplier:'Suppliers',consumer:'Consumers','serves-consumer':'Consumers',goal:'Goals & Guiding Principles','guided-by':'Goals & Guiding Principles'};

const CTXCLASS_LABEL={goal:'Goals & Guiding Principles',actor:'Actors (Suppliers · Participants · Consumers)',input:'Inputs',technique:'Techniques & Methods',tool:'Tools & Technology',metric:'Metrics'};
const CTXCLASS_ORDER=['goal','actor','input','technique','tool','metric'];

const FACET_HIER={
  'facet:strength':{parentType:'type:strength-domain',upRel:'rel:rolls-up-to'},   // theme → domain
  'facet:activity':{parentType:'type:phase',upRel:'rel:contains'},                // best practice → phase
  'facet:knowledge-area':{parentType:'type:dmbok-level',upRel:'rel:grouped-by'},  // KA → DMBOK level

// Collapsible groupings for facets that are a flat set, not a parent→child hierarchy.
// Returns ordered [{label, items:[entity]}] or null (fall back to hierarchy / default roots).
const MASTERY_KIND=[['required','Required — the Role needs it'],['desired','Desired — target to reach'],['acquired','Acquired — held by the learner']];
function facetGroups(fid,members){
  const mk=(arr,fn)=>{const g=new Map();arr.forEach(e=>{const k=fn(e);if(k==null)return;if(!g.has(k))g.set(k,[]);g.get(k).push(e);});return g;};
  if(fid==='facet:context'){
    const g=mk(members,e=>(e.attributes&&e.attributes.ctxClass)||'other');
    const order=[...CTXCLASS_ORDER,...[...g.keys()].filter(c=>!CTXCLASS_ORDER.includes(c))];
    return order.filter(c=>g.has(c)).map(c=>({label:CTXCLASS_LABEL[c]||c,items:g.get(c)}));
  }
  if(fid==='facet:mastery'){
    const g=mk(members,e=>(e.attributes&&e.attributes.kind)||'other');
    const out=MASTERY_KIND.filter(([k])=>g.has(k)).map(([k,l])=>({label:l,items:g.get(k)}));
    if(g.has('other'))out.push({label:'Other',items:g.get('other')});
    return out;
  }
  if(fid==='facet:sfia'){
    const cats=new Map(),levels=[],other=[];
    members.forEach(e=>{
      if(e.entityTypeId==='type:sfia-category')return; // becomes a header, not an item
      if(e.entityTypeId==='type:sfia-level'){levels.push(e);return;}
      if(e.entityTypeId==='type:sfia-skill'){const c=outTo(e.id,'rel:in-category')[0];const lbl=(c&&M.ent.get(c)&&M.ent.get(c).preferredLabel)||'Uncategorised';if(!cats.has(lbl))cats.set(lbl,[]);cats.get(lbl).push(e);return;}
      other.push(e);
    });
    const out=[...cats.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([l,items])=>({label:l,items}));
    if(levels.length)out.unshift({label:'Responsibility levels (SFIA 1–7)',items:levels});
    if(other.length)out.push({label:'Other',items:other});
    return out;
  }
  if(fid==='facet:talent-strategy'){
    // Group the Talent Strategy framework by its 8 lifecycle stages; governance gates separately.
    const stageLabel={}; members.forEach(e=>{if(e.entityTypeId==='type:ts-stage')stageLabel[(e.attributes||{}).stage]=e.preferredLabel;});
    const g=new Map(),other=[];
    members.forEach(e=>{ if(e.entityTypeId==='type:ts-stage')return; const st=(e.attributes&&e.attributes.stage);
      if(st){if(!g.has(st))g.set(st,[]);g.get(st).push(e);}else other.push(e);});
    const out=[...g.keys()].sort((a,b)=>String(a).localeCompare(String(b))).map(st=>({label:stageLabel[st]||('Stage '+st),items:g.get(st)}));
    if(other.length)out.push({label:'Governance gates & cross-cutting',items:other});
    return out;
  }
  if(fid==='facet:capability-spine'){
    // Group DCAM capabilities under their Component; concept/realization-chain nodes together.
    const compLabel={}; members.forEach(e=>{if(e.entityTypeId==='type:capability-component')compLabel[(e.attributes||{}).dcamComponent]=e.preferredLabel;});
    const comps=new Map(),chain=[];
    members.forEach(e=>{

      const dcamId=(e.attributes&&e.attributes.dcamId);
      if(e.entityTypeId==='type:business-capability'&&dcamId){const c=String(dcamId).split('.')[0];const lbl=compLabel[c]||('Component '+c);if(!comps.has(lbl))comps.set(lbl,[]);comps.get(lbl).push(e);return;}
      chain.push(e);
    });
    const out=[...comps.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([l,items])=>({label:l,items}));
    if(chain.length)out.push({label:'Realization chain & concept',items:chain});
    return out;
  }
  if(fid==='facet:evidence'){
    const kaG=new Map(),score=[],concept=[];
    members.forEach(e=>{
      if(e.entityTypeId==='type:scorecard'){score.push(e);return;}
      if(e.entityTypeId==='type:deliverable'){const abbr=(e.attributes&&e.attributes.ka)||'';const ke=abbr&&M.ent.get('e:ka:'+String(abbr).toLowerCase());const lbl=(ke&&ke.preferredLabel)||'Other deliverables';if(!kaG.has(lbl))kaG.set(lbl,[]);kaG.get(lbl).push(e);return;}
      concept.push(e);
    });
    const out=[...kaG.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([l,items])=>({label:l+' — deliverables',items}));
    if(score.length)out.unshift({label:'Scorecards (Quality · Value · Stakeholder)',items:score});
    if(concept.length)out.push({label:'Evidence concept',items:concept});
    return out;
  }
  return null;

function shortLabel(id){const e=M.ent.get(id);let l=(e&&e.preferredLabel)||id;return l.length>22?l.slice(0,20)+'…':l;}
// relationship chips for a node — prioritise links that leave this facet (other areas of the spine)
function relChips(id,seen){
  const out=M.out.get(id)||[], inc=M.inc.get(id)||[], items=[];
  const go=new Map(); out.forEach(r=>{if(!go.has(r.relationshipTypeId))go.set(r.relationshipTypeId,[]);go.get(r.relationshipTypeId).push(r.targetEntityId);});
  const gi=new Map(); inc.forEach(r=>{if(!gi.has(r.relationshipTypeId))gi.set(r.relationshipTypeId,[]);gi.get(r.relationshipTypeId).push(r.sourceEntityId);});
  go.forEach((t,rt)=>{const lbl=relLabel(rt),u=[...new Set(t)];
    if(u.length===1)items.push({label:lbl+' '+shortLabel(u[0]),go:u[0],cross:!seen.has(u[0])});
    else items.push({label:lbl+' · '+u.length,cross:u.some(x=>!seen.has(x))});});
  gi.forEach((s,rt)=>{const rtp=M.rtype.get(rt),lbl=(rtp&&rtp.inverseLabel)||relLabel(rt),u=[...new Set(s)];
    if(u.length===1)items.push({label:lbl+' '+shortLabel(u[0]),go:u[0],cross:!seen.has(u[0])});
    else items.push({label:lbl+' · '+u.length,cross:u.some(x=>!seen.has(x))});});
  items.sort((a,b)=>(b.cross?1:0)-(a.cross?1:0));
  return items.slice(0,6);
}

// DRILL-DOWN ONLY: the tree follows containment / taxonomy links downward, never the full graph.
// Outgoing links that go "down" (parent → the things it owns/contains/realizes):
const DRILL_OUT=new Set(['rel:needs','rel:drives','rel:maps-to','rel:met-by','rel:develops','rel:fits','rel:allocates','rel:realizes','rel:enables','rel:form','rel:contains','rel:produces','rel:draws-on','rel:has-definition','rel:guided-by','rel:decomposes-into','rel:holds-practice','rel:requires','rel:performed-by','rel:consumes-input','rel:supplied-by','rel:used-by','rel:scored-by','rel:forms-evidence','rel:evidences','rel:measured-by','rel:has-participant','rel:uses-tool','rel:uses-technique','rel:has-input','rel:has-supplier','rel:serves-consumer','rel:tracked-by']);
// Incoming links whose INVERSE goes "down": concept→instances, domain→themes, role→styles, level→KAs, scale→levels, capability→(knowledge it needs).
const DRILL_IN=new Set(['rel:conforms-to','rel:rolls-up-to','rel:plays','rel:grouped-by','rel:comprises','rel:knowledge-for']);
const DRILL_ALL=new Set([...DRILL_OUT,...DRILL_IN]);
function treeChildren(id,ancestors){
  const map=new Map();
  (M.out.get(id)||[]).forEach(r=>{
    if(!DRILL_OUT.has(r.relationshipTypeId))return;
    if(r.relationshipTypeId==='rel:contains'&&typeLabel(r.targetEntityId)==='Phase')return; // skip BP→Phase (that's upward)
    if(ancestors.has(r.targetEntityId)||map.has(r.targetEntityId)||!M.ent.get(r.targetEntityId))return;
    map.set(r.targetEntityId,relLabel(r.relationshipTypeId)+' →');
  });
  (M.inc.get(id)||[]).forEach(r=>{
    if(!DRILL_IN.has(r.relationshipTypeId))return;
    if(ancestors.has(r.sourceEntityId)||map.has(r.sourceEntityId)||!M.ent.get(r.sourceEntityId))return;
    const t=M.rtype.get(r.relationshipTypeId);
    map.set(r.sourceEntityId,'← '+((t&&t.inverseLabel)||relLabel(r.relationshipTypeId)));
  });
  return [...map.entries()].map(([id,rel])=>({id,rel})).sort((a,b)=>{
    const ai=/has instance/i.test(a.rel)?1:0, bi=/has instance/i.test(b.rel)?1:0;
    if(ai!==bi) return ai-bi;
    return M.ent.get(a.id).preferredLabel.localeCompare(M.ent.get(b.id).preferredLabel);
  });
}
// the NON-drill links for a node — shown as clickable chips, never expanded (so they don't explode the tree)
function treeChips(id,ancestors){
  const items=[];const add=(tid,lbl)=>{if(ancestors.has(tid)||!M.ent.get(tid))return;items.push({label:lbl+' '+shortLabel(tid),go:tid});};
  (M.out.get(id)||[]).forEach(r=>{if(!DRILL_ALL.has(r.relationshipTypeId))add(r.targetEntityId,relLabel(r.relationshipTypeId));});
  (M.inc.get(id)||[]).forEach(r=>{if(!DRILL_ALL.has(r.relationshipTypeId)){const t=M.rtype.get(r.relationshipTypeId);add(r.sourceEntityId,'← '+((t&&t.inverseLabel)||relLabel(r.relationshipTypeId)));}});
  const u=new Map();items.forEach(i=>{if(!u.has(i.go))u.set(i.go,i);});
  return [...u.values()].slice(0,5);
}
function treeNode(e,viaRel,ancestors,depth){
  const d=document.createElement('div');d.className='tn';
  const kids=treeChildren(e.id,ancestors);const hasKids=kids.length>0;
  const row=document.createElement('div');row.className='trow2'+(S.focus===e.id?' sel':'');row.style.paddingLeft=(depth*20+4)+'px';
  row.innerHTML='<span class="ttog'+(hasKids?' has':'')+'">'+(hasKids?'▸':'·')+'</span><span class="tdot" style="background:'+colorOf(e.id)+'"></span><span class="tlbl" data-go="'+e.id+'">'+e.preferredLabel+'</span>'+(viaRel?'<span class="tvia">'+viaRel+'</span>':'')+'<span class="ttype2">'+typeLabel(e.id)+(hasKids?' · '+kids.length:'')+'</span>';
  const chips=treeChips(e.id,ancestors);let chipEl=null;
  if(chips.length){chipEl=document.createElement('div');chipEl.className='tchipsrow';chipEl.style.paddingLeft=(depth*20+30)+'px';chipEl.innerHTML=chips.map(c=>'<span class="rchip lnk" data-go="'+c.go+'">'+c.label+'</span>').join('');}
  const kidWrap=document.createElement('div');kidWrap.className='tkids';kidWrap.style.display='none';let built=false;
  if(hasKids){const tog=row.querySelector('.ttog');
    const toggle=()=>{const open=kidWrap.style.display==='block';
      if(!built){
        // group children by relationship; "has instance" groups sort to the bottom
        const groups=new Map();
        kids.forEach(k=>{if(!groups.has(k.rel))groups.set(k.rel,[]);groups.get(k.rel).push(k);});
        [...groups.entries()].sort((a,b)=>{const ai=/has instance/i.test(a[0])?1:0,bi=/has instance/i.test(b[0])?1:0;if(ai!==bi)return ai-bi;return a[0].localeCompare(b[0]);})
          .forEach(([rel,list])=>{
            const gh=document.createElement('div');gh.className='trelhdr';gh.style.paddingLeft=((depth+1)*20+8)+'px';
            gh.innerHTML='<span class="trelname">'+rel+'</span><span class="trelcount">'+list.length+'</span>';
            kidWrap.appendChild(gh);
            list.forEach(k=>{const ce=M.ent.get(k.id);if(ce)kidWrap.appendChild(treeNode(ce,null,new Set([...ancestors,k.id]),depth+1));});
          });
        built=true;
      }
      kidWrap.style.display=open?'none':'block';tog.textContent=open?'▸':'▾';};
    tog.addEventListener('click',ev=>{ev.stopPropagation();toggle();});}
  d.appendChild(row);if(chipEl)d.appendChild(chipEl);d.appendChild(kidWrap);return d;
}
function renderFacetView(){
  const fid=S.facet; const facet=M.facet.get(fid); const c=document.getElementById('canvas');
  if(!facet){ c.innerHTML='<div class="empty">Facet not found.</div>'; return; }
  const members=[...M.ent.values()].filter(e=>Array.isArray(e.facetIds)&&e.facetIds.indexOf(fid)>=0);
  const seen=new Set(members.map(e=>e.id));
  const wrap=document.createElement('div'); wrap.className='katree';
  const tree=S.facetMode!=='cards';
  wrap.innerHTML='<div class="facethead"><div><div class="kahdr">'+facet.label+'</div><div class="kasub">'+members.length+' entities'+(tree?' — expand (▸) to drill DOWN the hierarchy, grouped by relationship. The pale chips are cross-links to other parts of the spine; click any label or chip to follow it.':', in their taxonomy. Pale chips are links to other parts of the spine — click to follow.')+'</div></div>'+
    '<div class="fmode"><button class="fmbtn'+(tree?' on':'')+'" data-fmode="tree">Tree</button><button class="fmbtn'+(tree?'':' on')+'" data-fmode="cards">Cards</button></div></div>';
  if(!members.length){ wrap.innerHTML+='<div class="empty">No entities carry this facet yet.</div>'; c.innerHTML=''; c.appendChild(wrap); return; }

  const hier=FACET_HIER[fid];
  if(tree){
    const tc=document.createElement('div');tc.className='otree';
    // Flat facets (context / mastery / sfia / evidence) render as COLLAPSIBLE groups.
    const groups=facetGroups(fid,members);
    if(groups){
      groups.forEach(grp=>{
        const gh=document.createElement('div');gh.className='fgrphdr';
        gh.innerHTML='<span class="fgrpcar">▸</span><span class="trelname">'+grp.label+'</span><span class="trelcount">'+grp.items.length+'</span>';
        const kids=document.createElement('div');kids.className='fgrpkids';kids.style.display='none';let built=false;
        gh.addEventListener('click',()=>{const open=kids.style.display==='block';
          if(!built){grp.items.slice().sort((a,b)=>a.preferredLabel.localeCompare(b.preferredLabel)).forEach(e=>kids.appendChild(treeNode(e,null,new Set([e.id]),0)));built=true;}
          kids.style.display=open?'none':'block';gh.querySelector('.fgrpcar').textContent=open?'▸':'▾';});
        tc.appendChild(gh);tc.appendChild(kids);
      });
      wrap.appendChild(tc); c.innerHTML=''; c.appendChild(wrap); return;
    }
    let roots;
    if(hier){ roots=members.filter(e=>e.entityTypeId===hier.parentType); const have=new Set(roots.map(r=>r.id)); members.forEach(e=>{if(!have.has(e.id)&&!outTo(e.id,hier.upRel).some(t=>have.has(t)))roots.push(e);}); }
    else {
      const memberIds=new Set(members.map(e=>e.id)), childOfMember=new Set();
      members.forEach(e=>treeChildren(e.id,new Set([e.id])).forEach(k=>{if(memberIds.has(k.id))childOfMember.add(k.id);}));
      roots=members.filter(e=>!childOfMember.has(e.id));
      if(!roots.length)roots=members.slice();
    }
    roots.sort((a,b)=>a.preferredLabel.localeCompare(b.preferredLabel)).forEach(e=>tc.appendChild(treeNode(e,null,new Set([e.id]),0)));
    wrap.appendChild(tc);
    c.innerHTML=''; c.appendChild(wrap); return;
  }

  // ---- Cards mode ----
  const node=(e)=>{const d=document.createElement('div');d.className='fnode';
    d.innerHTML='<button class="fcard'+(S.focus===e.id?' sel':'')+'" data-go="'+e.id+'"><span class="fdot" style="background:'+colorOf(e.id)+'"></span><span class="fcl">'+e.preferredLabel+'</span></button>'+chipHtml(relChips(e.id,seen));return d;};
  const groupHdr=(name,n)=>{const gh=document.createElement('div');gh.className='fgroup';gh.innerHTML='<span>'+name+'</span><span class="fgcount">'+n+'</span>';return gh;};
  const gridOf=(list,indent)=>{const g=document.createElement('div');g.className='fgrid'+(indent?' indent':'');list.sort((a,b)=>a.preferredLabel.localeCompare(b.preferredLabel)).forEach(e=>g.appendChild(node(e)));return g;};
  if(fid==='facet:context'){
    const groups=new Map();
    members.forEach(e=>{const cls=(e.attributes&&e.attributes.ctxClass)||'other';const key=CTXCLASS_LABEL[cls]||'Other context';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(e);});
    const classKeys=CTXCLASS_ORDER.map(c=>CTXCLASS_LABEL[c]);
    [...groups.entries()].sort((a,b)=>{const ai=classKeys.indexOf(a[0]),bi=classKeys.indexOf(b[0]);return (ai<0?99:ai)-(bi<0?99:bi)||a[0].localeCompare(b[0]);}).forEach(([g,l])=>{wrap.appendChild(groupHdr(g,l.length));wrap.appendChild(gridOf(l));});
  } else if(hier){
    const parents=members.filter(e=>e.entityTypeId===hier.parentType);
    const pset=new Set(parents.map(p=>p.id));
    const childrenOf=new Map(parents.map(p=>[p.id,[]])); const orphans=[];
    members.forEach(e=>{ if(pset.has(e.id))return; const up=outTo(e.id,hier.upRel).find(t=>pset.has(t)); if(up)childrenOf.get(up).push(e); else orphans.push(e); });
    parents.sort((a,b)=>a.preferredLabel.localeCompare(b.preferredLabel)).forEach(p=>{
      const ph=document.createElement('div');ph.className='fparent';
      ph.innerHTML='<button class="fpbtn'+(S.focus===p.id?' sel':'')+'" data-go="'+p.id+'"><span class="fdot" style="background:'+colorOf(p.id)+'"></span><span class="fpl">'+p.preferredLabel+'</span><span class="fgcount">'+childrenOf.get(p.id).length+'</span></button>'+chipHtml(relChips(p.id,seen));
      wrap.appendChild(ph);
      wrap.appendChild(gridOf(childrenOf.get(p.id),true));
    });
    if(orphans.length){ wrap.appendChild(groupHdr('Other',orphans.length)); wrap.appendChild(gridOf(orphans)); }
  } else {
    const groups=new Map();
    members.forEach(e=>{const k=typeLabel(e.id)||'Other';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e);});
    [...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0])).forEach(([g,l])=>{wrap.appendChild(groupHdr(g,l.length));wrap.appendChild(gridOf(l));});
  }
  c.innerHTML=''; c.appendChild(wrap);
}

const expandState={};
function renderDetail(){
  const d=document.getElementById('detail');
  if(!S.focus){d.innerHTML='<div class="empty">Select an element to explore its meaning and relationships.</div>';return;}
  const e=M.ent.get(S.focus);if(!e){d.innerHTML='<div class="empty">Unknown entity.</div>';return;}
  const col=colorOf(S.focus);
  let h='<div class="dh">Entity</div><div class="dt">'+e.preferredLabel+'</div>';
  h+='<span class="dtype" style="background:'+col+'">'+typeLabel(S.focus)+'</span>';
  if(e.definition)h+='<div class="ddef">'+e.definition+'</div>';
  // open-in-facet action for KAs
  if(typeLabel(S.focus)==='Knowledge Area')h+='<button class="openbtn" data-open="'+S.focus+'">Open Knowledge Area context →</button>';
  if(e.facetIds&&e.facetIds.length)h+='<div class="dfacets">'+e.facetIds.map(f=>'<span class="dfacet">'+((M.facet.get(f)||{}).label||f)+'</span>').join('')+'</div>';
  // relationships grouped by type + direction
  function groupRels(list,dir){
    const by={};list.forEach(r=>{(by[r.relationshipTypeId]=by[r.relationshipTypeId]||[]).push(r);});
    return Object.keys(by).map(rt=>{
      const rtDef=M.rtype.get(rt)||{label:rt};const lab=dir==='out'?rtDef.label:(rtDef.inverseLabel||rtDef.label);
      const items=by[rt].map(r=>dir==='out'?r.targetEntityId:r.sourceEntityId);
      const key=S.focus+'|'+rt+'|'+dir;const shown=expandState[key]?items.length:Math.min(items.length,6);
      let hh='<div class="relgrp"><div class="rt">'+lab+' <span class="ct">'+items.length+'</span> <span class="dir">'+(dir==='out'?'→':'←')+'</span></div>';
      hh+=items.slice(0,shown).map(id=>'<span class="tgt" data-go="'+id+'"><span class="d" style="background:'+colorOf(id)+'"></span><span class="nm">'+M.ent.get(id).preferredLabel+'</span></span>').join('');
      if(items.length>shown)hh+='<button class="morebtn" data-more="'+key+'">+ '+(items.length-shown)+' more</button>';
      hh+='</div>';return hh;
    }).join('');
  }
  const outg=groupRels(M.out.get(S.focus)||[],'out');
  const inc=groupRels(M.inc.get(S.focus)||[],'in');
  if(outg||inc){ h+='<div class="dh" style="margin-top:6px">Relationships</div>'+outg+inc; }
  else h+='<div class="empty">No relationships.</div>';
  d.innerHTML=h;
}

// ---------- boot / connection diagnostics ----------
(function(){
  const st=document.getElementById('status'), msg=document.getElementById('statusMsg'),
        title=document.getElementById('statusTitle'), diag=document.getElementById('diagLog'),
        verdict=document.getElementById('verdict'), tokenBox=document.getElementById('tokenBox'),
        diagBtns=document.getElementById('diagBtns');
  const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  function log(html){ diag.innerHTML += html+'\n'; diag.scrollTop=diag.scrollHeight; }
  function line(label,cls,detail){ log('<span class="'+(cls||'dim')+'">'+esc(label)+'</span>'+(detail?'  <span class="dim">'+esc(detail)+'</span>':'')); }
  function setVerdict(text,cls){ verdict.textContent=text; verdict.className='verdict '+(cls||''); verdict.style.display='block'; }
  const DATASETS=['index.json','entity-types.json','relationship-types.json','facets.json','entities.json','relationships.json'];

  async function go(){
    diag.innerHTML=''; verdict.style.display='none'; tokenBox.style.display='none'; diagBtns.style.display='none';
    title.textContent='Connecting…'; msg.textContent='Running connection diagnostics against GitHub.';
    const tk=getToken();

    // 0. What are we even asking for?
    if(!SRCINFO.gh){
      line('Source  : '+SRCINFO.base+' (plain URL, no token)','dim');
    }else{
      line('Scheme  : gh:  (GitHub Contents API)','dim');
      line('Owner   : '+SRCINFO.owner,'dim');
      line('Repo    : '+SRCINFO.repo,'dim');
      line('Branch  : '+SRCINFO.ref,'dim');
      line('Path    : '+SRCINFO.path,'dim');
      line('Token   : '+(tk?('present ('+tk.length+' chars, '+tk.slice(0,4)+'…'+tk.slice(-2)+')'):'(none stored)'), tk?'ok':'warn');
    }
    log('');

    // 1. Can we reach api.github.com at all?  (public, CORS-enabled, no auth)
    if(SRCINFO.gh){
      line('① Reach api.github.com …','dim', 'GET https://api.github.com/zen');
      const net=await probe('https://api.github.com/zen',{cache:'no-store'});
      if(net.threw){
        line('   ✗ network error — '+net.error,'bad');
        setVerdict('Cannot reach api.github.com at all. This is not a repo or token problem — a browser extension (ad/privacy blocker), a firewall, or a corporate proxy is blocking requests to GitHub. Try another browser or disable blockers for this page.','bad');
        return finish(false);
      }
      line('   ✓ reachable — HTTP '+net.status,'ok');

      // 2. Is the repo visible to this token?
      line('② Repo visibility …','dim','GET /repos/'+SRCINFO.owner+'/'+SRCINFO.repo);
      const repo=await probe('https://api.github.com/repos/'+SRCINFO.owner+'/'+SRCINFO.repo,{headers:ghHeaders(false),cache:'no-store'});
      if(repo.threw){ line('   ✗ network error — '+repo.error,'bad'); setVerdict('The reachability check passed but the repo request failed at the network layer: '+repo.error,'bad'); return finish(false); }
      if(repo.status===401){ line('   ✗ HTTP 401 — token rejected','bad'); setVerdict('GitHub rejected the token (401). The PAT is invalid, expired, or malformed. Paste a current fine-grained PAT with Contents: Read on '+SRCINFO.owner+'/'+SRCINFO.repo+'.','bad'); return finish(false,true); }
      if(repo.status===404){ line('   ✗ HTTP 404 — repo not visible to this token','bad'); setVerdict('The repo '+SRCINFO.owner+'/'+SRCINFO.repo+' is not visible (404). For a private repo this means the token has no access to it — the fine-grained PAT needs Contents: Read on exactly this repo — or the owner/repo in the page is wrong.','bad'); return finish(false,true); }
      if(!repo.ok){ line('   ✗ HTTP '+repo.status,'bad'); setVerdict('Unexpected response checking the repo: HTTP '+repo.status+'. '+(repo.json&&repo.json.message?repo.json.message:''),'bad'); return finish(false,true); }
      const dflt=repo.json&&repo.json.default_branch;
      line('   ✓ repo visible — HTTP '+repo.status+(dflt?'  (default branch: '+dflt+')':''),'ok');
      if(dflt&&dflt!==SRCINFO.ref) line('   ! this page asks for branch "'+SRCINFO.ref+'", repo default is "'+dflt+'"','warn');

      // 3. Does the database/ folder exist on that branch?
      line('③ Ontology folder on "'+SRCINFO.ref+'" …','dim','GET /contents/'+SRCINFO.path+'?ref='+SRCINFO.ref);
      const folder=await probe('https://api.github.com/repos/'+SRCINFO.owner+'/'+SRCINFO.repo+'/contents/'+encodeURI(SRCINFO.path)+'?ref='+encodeURIComponent(SRCINFO.ref),{headers:ghHeaders(false),cache:'no-store'});
      if(folder.status===404){
        line('   ✗ HTTP 404 — folder not found on this branch','bad');
        setVerdict('The repo is reachable and the token works, but '+SRCINFO.path+'/ does not exist on branch "'+SRCINFO.ref+'" (404). The ontology files have not been committed + pushed to that branch, are on a different branch, or sit at a different path. Push Data_And_AI_Literacy/Ontology/ to "'+SRCINFO.ref+'".','bad');
        return finish(false);
      }
      if(folder.ok&&Array.isArray(folder.json)){
        const names=folder.json.map(x=>x.name);
        line('   ✓ folder found — '+names.length+' file(s): '+names.join(', '),'ok');
        const missing=DATASETS.filter(d=>names.indexOf(d)<0);
        if(missing.length) line('   ! missing expected file(s): '+missing.join(', '),'warn');
      } else if(folder.ok){
        line('   ✓ path resolved (HTTP '+folder.status+')','ok');
      } else {
        line('   ✗ HTTP '+folder.status,'bad'); setVerdict('Could not list the ontology folder: HTTP '+folder.status+'. '+(folder.json&&folder.json.message?folder.json.message:''),'bad'); return finish(false);
      }
    }

    // 4. Pull the datasets.
    log('');
    line((SRCINFO.gh?'④':'①')+' Fetch datasets …','dim');
    const data={}; let failed=null;
    for(const f of DATASETS){
      const p=await probe(fileUrl(f),{headers:SRCINFO.gh?ghHeaders(true):undefined,cache:'no-store'});
      if(p.threw){ line('   ✗ '+f+' — network error: '+p.error,'bad'); failed=failed||(f+': '+p.error); continue; }
      if(!p.ok){ line('   ✗ '+f+' — HTTP '+p.status,'bad'); failed=failed||(f+': HTTP '+p.status); continue; }
      if(p.json==null){ line('   ✗ '+f+' — not valid JSON','bad'); failed=failed||(f+': bad JSON'); continue; }
      const n=(p.json.count!=null?p.json.count:(Array.isArray(p.json.items)?p.json.items.length:'?'));
      line('   ✓ '+f+' — HTTP '+p.status+'  ('+n+' items)','ok');
      data[f]=p.json;
    }
    if(failed){ setVerdict('Folder resolved but a dataset failed to load — '+failed+'. The file may be missing from the commit, or renamed.','bad'); return finish(false); }

    // 5. Build.
    try{
      buildModel({
        entityTypes:data['entity-types.json'], relationshipTypes:data['relationship-types.json'],
        facets:data['facets.json'], entities:data['entities.json'], relationships:data['relationships.json']});
      const idx=data['index.json']||{};
      line('','dim'); line('✓ Loaded ontology v'+(idx.version||'?')+'  —  '+M.ent.size+' entities, '+[...M.out.values()].reduce((a,b)=>a+b.length,0)+' relationships','ok');
      setVerdict('Connected. Rendering…','ok');
      setTimeout(()=>{ st.style.display='none'; pushHist(); renderAll(); },250);
    }catch(e){ line('   ✗ build error: '+((e&&e.message)||e),'bad'); setVerdict('Data loaded but failed to build the model: '+((e&&e.message)||e),'bad'); return finish(false); }
  }

  function finish(okFlag,showToken){
    title.textContent = okFlag?'Connected':'Not connected';
    msg.innerHTML = okFlag?'' : 'The ontology could not be loaded. The trace above shows exactly where it stopped.';
    diagBtns.style.display='flex';
    if(showToken) tokenBox.style.display='block';
  }

  document.getElementById('tokenSave').addEventListener('click',()=>{const t=document.getElementById('tokenIn').value.trim();if(t){try{localStorage.setItem(TOKEN_KEY,t);}catch(e){}}go();});
  document.getElementById('retryBtn').addEventListener('click',go);
  document.getElementById('tokenToggle').addEventListener('click',()=>{ tokenBox.style.display = tokenBox.style.display==='none'?'block':'none'; });
  document.getElementById('copyBtn').addEventListener('click',()=>{ const t=diag.textContent+'\n'+(verdict.style.display!=='none'?('VERDICT: '+verdict.textContent):''); try{navigator.clipboard.writeText(t);document.getElementById('copyBtn').textContent='Copied';setTimeout(()=>document.getElementById('copyBtn').textContent='Copy diagnostics',1200);}catch(e){} });
  go();
})();
</script>
<script>(function(){try{var m=document.querySelector('meta[name="version"]');var h=document.querySelector(".ttl");if(m&&h&&!document.getElementById("mwVerBadge")){}}catch(e){}})();</script>
</body>
