<style>
  :root{
    --bg:#f6f4ef;--surface:#fffdf9;--surface-2:#efece4;--line:#ddd7cb;
    --fg:#211f1b;--fg-soft:#5a564d;--fg-faint:#8a847a;
    --accent:#1f6f6b;--accent-soft:#dff0ec;
    --theme:#4a5a7a;--theme-soft:#dde2ec;--cls:#9a4f1b;--cls-soft:#f0e0d1;--warn:#9a3030;--warn-soft:#f3dada;--kind:#1f6feb;--kind-soft:#e3edfd;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --disp:"Fraunces",Georgia,serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#16151a;--surface:#1f1e24;--surface-2:#27262d;--line:#36343d;
    --fg:#eceaf2;--fg-soft:#b4b0bd;--fg-faint:#827e8c;
    --accent:#58b8b0;--accent-soft:#15302e;
    --theme:#9fb2d8;--theme-soft:#20273a;--cls:#d79156;--cls-soft:#3a2a1b;--warn:#e88;--warn-soft:#3a1f1f;--kind:#7fb0ff;--kind-soft:#16233b;
    color-scheme:dark;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;font-size:15px}
  .wrap{max-width:1100px;margin:0 auto;padding:0 18px}
  h1,h2,h3{font-family:var(--disp);font-weight:560;line-height:1.15;margin:0}
  code,.id{font-family:var(--mono);font-size:.84em;background:var(--surface-2);padding:.08em .4em;border-radius:4px}
  a{color:var(--accent)}
  header{padding:28px 0 16px;border-bottom:1px solid var(--line)}
  header .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  header h1{font-size:clamp(1.5rem,4vw,2.1rem)}
  header .files{font-family:var(--mono);font-size:.78rem;color:var(--fg-faint);margin-top:6px}
  header .ver{font-family:var(--mono);font-size:.72rem;color:var(--fg-faint);margin-top:4px}
  .tiles{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:18px 0}
  .tiles .t{background:var(--surface);padding:11px 16px;flex:1;min-width:92px}
  .tiles .t .n{font-family:var(--disp);font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1}
  .tiles .t .l{font-size:.72rem;color:var(--fg-soft);margin-top:2px}
  nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:4px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}

  nav button:hover{background:var(--surface-2)}

  main{padding:22px 0 80px}
  .panel{display:none}.panel.on{display:block}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 14px}
  .card h3{font-size:1.1rem}
  .muted{color:var(--fg-soft)}.small{font-size:.84rem}
  .pill{display:inline-block;font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin:1px 2px}
  .pill.theme{background:var(--theme-soft);color:var(--theme)}
  .pill.kind{background:var(--kind-soft);color:var(--kind);font-weight:700}
  .pill.cls{background:var(--cls-soft);color:var(--cls)}
  .pill.fmt{background:var(--accent-soft);color:var(--accent)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  table{border-collapse:collapse;width:100%;font-size:.86rem}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-faint);font-weight:600}
  td.n,th.n{font-variant-numeric:tabular-nums}
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  details{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;background:var(--surface)}
  details>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:"\25B8";color:var(--fg-faint);transition:transform .15s}
  details[open]>summary::before{transform:rotate(90deg)}
  details .inner{padding:0 16px 14px}
  pre{font-family:var(--mono);font-size:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;max-height:70vh}
  .filters{position:sticky;top:48px;z-index:4;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .filters label{font-size:.78rem;color:var(--fg-soft);display:flex;align-items:center;gap:6px}
  .filters select,.filters input[type=search]{font:inherit;font-size:.84rem;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
  .filters input[type=search]{min-width:170px}
  .filters .count{margin-left:auto;font-family:var(--mono);font-size:.76rem;color:var(--fg-faint)}
  .ds-meta{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:.84rem;margin:8px 0}
  .ds-meta .k{color:var(--fg-faint);font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
  .banner{border-radius:10px;padding:12px 15px;margin:0 0 14px;font-size:.88rem;background:var(--warn-soft);color:var(--warn)}
  .bar{display:flex;align-items:center;gap:8px;margin:3px 0}
  .bar .lab{min-width:150px;font-size:.82rem}
  .bar .track{flex:1;height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent)}
  .bar .v{font-family:var(--mono);font-size:.76rem;color:var(--fg-faint);min-width:28px;text-align:right}
  .empty{color:var(--fg-faint);font-style:italic;padding:8px 0}
  a.linlink{font-family:var(--mono);font-size:.74rem;color:var(--accent);text-decoration:none;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:999px;padding:2px 9px}
  a.linlink:hover{background:var(--accent-soft)}
  .launch{display:inline-flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
  a.xlaunch{font-family:var(--mono);font-size:.68rem;color:var(--accent);text-decoration:none;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:999px;padding:2px 9px;white-space:nowrap}
  a.xlaunch:hover{background:var(--accent-soft)}
  details.flash{outline:2px solid var(--accent);outline-offset:1px;transition:outline-color .3s}

    .pill.ev{font-weight:700}
    .pill.ev-EA{background:#1f7a4d;color:#fff}
    .pill.ev-EB{background:#3a8f63;color:#fff}
    .pill.ev-EC{background:#6aa989;color:#fff}
    .pill.ev-P{background:#b06a1f;color:#fff}
    table.matrix th.rot{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-weight:600;font-size:11px;max-height:120px}
    ul.spec{margin:6px 0 0 18px;padding:0}
    ul.spec li{font-size:13px;margin:2px 0}
</style>

<body>
<header><div class="wrap">
  <div class="eyebrow" id="kind">data catalog</div>

  <div class="ver" id="ver"></div>
</div></header>
<div class="wrap">
  <div class="tiles" id="tiles"></div>

  <main id="main"></main>
</div>
<script>
const DATA = /*__DATA__*/null;
function __run__(DATA){
const $=(s,r=document)=>r.querySelector(s);
function el(t,a,...kids){const n=document.createElement(t);for(const k in (a||{})){if(k==="class")n.className=a[k];else if(k==="html")n.innerHTML=a[k];else if(k.startsWith("on"))n.addEventListener(k.slice(2),a[k]);else if(a[k]!=null)n.setAttribute(k,a[k]);}for(const c of kids){if(c==null)continue;n.append(c.nodeType?c:document.createTextNode(c));}return n;}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const D=DATA||{counts:{},datasets:[],distributions:[],services:[],agents:[],themes:[],formats:[],classifications:[],catalogs:[],warnings:[]};
const LINKS=D.links||{};
const LAUNCH=D.launch||{};
const VIEWLABELS={metadata:"Metadata",data:"Data",model:"Model",quality:"Quality",dictionary:"Dictionary",lineage:"Lineage",provenance:"Provenance",glossary:"Glossary",opmodel:"Operating Model"};
const VIEWANCHOR={lineage:"node",quality:"dataset",provenance:"entity",dictionary:"dataset",catalog:"dataset",glossary:"term"};
const slug=s=>String(s==null?"":s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
function launchUrl(tpl,sl,view){if(tpl.indexOf("{slug}")>=0)return tpl.replace(/\{slug\}/g,sl);if(tpl.indexOf("?")<0&&tpl.indexOf("#")<0&&VIEWANCHOR[view])return tpl+"#"+VIEWANCHOR[view]+"="+sl;return tpl;}
function launchChips(d){
  const dists=d.distributions||d.distribution||[];
  const hasData=dists.some(x=>["CSV","JSON"].includes(String(x.format||"").toUpperCase()));
  if(!hasData){
    const link=dists.find(x=>x.accessURL)||{};
    if(!link.accessURL)return null;
    const w=el("span",{class:"launch",style:"margin-left:auto"});
    const lbl=(d.kind==="Public body"||d.kind==="External partner")?"Operating Model":"Open";
    w.append(el("a",{class:"xlaunch",target:"_blank",rel:"noopener",href:link.accessURL,title:"open "+(d.title||""),onclick:e=>e.stopPropagation()},lbl));
    return w;
  }
  const sl=slug(d.title);const wrap=el("span",{class:"launch",style:"margin-left:auto"});
  Object.keys(VIEWLABELS).forEach(k=>{if(LAUNCH[k])wrap.append(el("a",{class:"xlaunch",target:"_blank",rel:"noopener",href:launchUrl(LAUNCH[k],sl,k),title:"open the "+VIEWLABELS[k]+" view for this dataset",onclick:e=>e.stopPropagation()},VIEWLABELS[k]));});
  return wrap.childNodes.length?wrap:null;}

$("#title").textContent=D.title||"Data Catalog Viewer";
$("#kind").textContent=(D.sourceKind||"catalog")+" catalog";
$("#files").textContent=(D.inputs||[]).length?("from "+(D.inputs||[]).join("  ·  ")):"";
const VER=((document.querySelector('meta[name="version"]')||{}).content)||"";
const UPD=((document.querySelector('meta[name="updated"]')||{}).content)||"";
$("#ver").textContent=(VER?("v"+VER):"")+(UPD?((VER?"  ·  ":"")+"built "+UPD):"");

const C=D.counts||{};
const tileDefs=[["datasets","Datasets"],["entities","Entities"],["distributions","Distributions"],["publishers","Publishers"],["themes","Themes"],["services","Services"],["catalogs","Catalogs"]];
$("#tiles").append(...tileDefs.filter(([k])=>(C[k]||0)>0||k==="datasets").map(([k,l])=>el("div",{class:"t"},el("div",{class:"n"},String(C[k]||0)),el("div",{class:"l"},l))));

const panels=[];
function addPanel(id,label,build){panels.push({id,label,build});}
function ghResolve(s){var r=s.slice(3),ref="main",at=r.lastIndexOf("@");if(at>0){ref=r.slice(at+1);r=r.slice(0,at);}var a=r.split("/"),ow=a.shift(),rp=a.shift(),pa=a.join("/"),tk="";try{tk=localStorage.getItem("mdaReadiness.ghpat")||"";}catch(e){}var h={"Accept":"application/vnd.github.raw","X-GitHub-Api-Version":"2022-11-28"};if(tk)h["Authorization"]="Bearer "+tk;return fetch("https://api.github.com/repos/"+ow+"/"+rp+"/contents/"+pa+"?ref="+encodeURIComponent(ref),{headers:h,cache:"no-store"});}
function ghClick(url,dl){var fn=url.split("/").pop().split("@")[0];ghResolve(url).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.blob();}).then(function(b){var u=URL.createObjectURL(b);if(dl){var a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();}else{window.open(u,"_blank");}setTimeout(function(){URL.revokeObjectURL(u);},15000);}).catch(function(e){alert("Could not fetch "+fn+": "+e.message+".\nOpen the catalog console and Save the GitHub token first (same browser), then retry.");});}
function link(url,txt){
  if(!url)return document.createTextNode(txt||"");
  if(url.indexOf("gh:")===0){var dl=(txt==="download");return el("a",{href:"#",title:url,onclick:function(e){e.preventDefault();ghClick(url,dl);}},txt||url);}
  return el("a",{href:url,target:"_blank",rel:"noopener"},txt||url);
}

// ---------- Overview
addPanel("overview","Overview",p=>{
  if((D.warnings||[]).length) p.append(el("div",{class:"banner"},el("b",{},"Check: "),D.warnings.join("  ")));
  const barBlock=(title,rows,total)=>{const c=el("div",{class:"card"},el("h3",{},title));
    if(!rows.length){c.append(el("div",{class:"empty"},"none"));return c;}
    const max=Math.max(...rows.map(r=>r.v));
    rows.slice(0,12).forEach(r=>c.append(el("div",{class:"bar"},el("div",{class:"lab"},r.k),el("div",{class:"track"},el("div",{class:"fill",style:`width:${Math.round(100*r.v/max)}%`})),el("div",{class:"v"},String(r.v)))));
    return c;};
  p.append(barBlock("Datasets by publisher",(D.agents||[]).map(a=>({k:a.name,v:a.datasetCount}))));
  p.append(barBlock("Datasets by theme",(D.themes||[]).map(t=>({k:t.name,v:t.datasetCount}))));
  if((D.formats||[]).length) p.append(barBlock("Distribution formats",(D.formats||[]).map(f=>({k:f.name,v:f.count}))));
  if((D.classifications||[]).length) p.append(barBlock("Classification",(D.classifications||[]).map(f=>({k:f.name,v:f.count}))));
});

// ---------- Datasets
addPanel("datasets","Datasets",p=>{
  const ds=D.datasets||[];
  const pubs=[...new Set(ds.map(d=>d.publisher).filter(Boolean))].sort();
  const themes=[...new Set(ds.flatMap(d=>d.themes||[]))].sort();
  const fmts=[...new Set(ds.flatMap(d=>d.formats||[]))].sort();
  const selP=el("select",{},el("option",{value:""},"all publishers"),...pubs.map(x=>el("option",{value:x},x)));
  const selT=el("select",{},el("option",{value:""},"all themes"),...themes.map(x=>el("option",{value:x},x)));
  const selF=el("select",{},el("option",{value:""},"all formats"),...fmts.map(x=>el("option",{value:x},x)));
  const search=el("input",{type:"search",placeholder:"search title / description…"});
  const cnt=el("div",{class:"count"});
  const bar=el("div",{class:"filters"},el("label",{},"publisher",selP),el("label",{},"theme",selT),el("label",{},"format",selF),search,cnt);
  const list=el("div",{});
  function card(d){
    const head=[el("span",{},d.title)];
    if(d.kind) head.push(el("span",{class:"pill kind"},d.kind));
    if(d.classification) head.push(el("span",{class:"pill cls"},d.classification));
    (d.themes||[]).slice(0,4).forEach(t=>head.push(el("span",{class:"pill theme"},t)));
    const lc=launchChips(d); if(lc) head.push(lc);
    const det=el("details",{id:"ds-"+slug(d.title)},el("summary",{},...head));
    const inner=el("div",{class:"inner"});
    if(d.description) inner.append(el("p",{class:"small muted"},d.description));
    const meta=el("div",{class:"ds-meta"});
    const row=(k,v)=>{if(v==null||v==="")return;meta.append(el("div",{class:"k"},k),el("div",{},v.nodeType?v:document.createTextNode(String(v))));};
    row("Identifier",d.identifier); row("Publisher",d.publisher); row("Catalog",d.catalog);
    if(d.owner){
      const R=d.roles||{};
      const ev=d.evidence?el("span",{class:"pill ev ev-"+d.evidence.replace(/[^A-Za-z]/g,"")},d.evidence):"";
      row("Owner (DO)",el("span",{},d.owner," ",ev,(d.ownerTheme?el("span",{class:"muted small"}," \u00b7 via theme \u2018"+d.ownerTheme+"\u2019"):"")));
      if(R.CR) row("Creator (CR)",R.CR);
      if(R.ST) row("Steward (ST)",R.ST);
      if(R.SoR) row("System of Record",R.SoR);
      if(R.TP) row("Technical Publisher (TP)",R.TP);
      if(R.note) row("Allocation note",el("span",{class:"small muted"},R.note));
    }
    if(d.artifactProfile){const ap=d.artifactProfile;
      row("Governance artifacts",el("span",{},String(ap.have)+" / "+String(ap.total)+" registered ",
        el("span",{class:"track",style:"display:inline-block;width:90px;vertical-align:middle"},
          el("span",{class:"fill",style:"width:"+Math.round(100*ap.have/ap.total)+"%"}))));
    }
    row("Keywords",(d.keywords||[]).join(", ")); row("License",d.license); row("Classification",d.classification);
    row("Modified",d.modified); row("Frequency",d.frequency); row("Coverage",[d.spatial,d.temporal].filter(Boolean).join(" · "));
    row("Contact",d.contact); row("Landing page",link(d.landingPage));
    for(const k in (d.extra||{})) row(k,String(d.extra[k]));
    inner.append(meta);
    if((d.distributions||[]).length){
      inner.append(el("h3",{class:"small",style:"margin:10px 0 4px"},"Distributions ("+d.distributions.length+")"));
      const tb=el("table",{},el("thead",{},el("tr",{},el("th",{},"Title"),el("th",{},"Format"),el("th",{},"Size"),el("th",{},"Access"),el("th",{},"Download"))));
      const body=el("tbody",{});
      d.distributions.forEach(x=>body.append(el("tr",{},el("td",{},x.title),el("td",{},x.format||x.mediaType||""),el("td",{},x.byteSize||""),el("td",{},link(x.accessURL,x.accessURL?"open":"")),el("td",{},link(x.downloadURL,x.downloadURL?"download":"")))));
      tb.append(body); inner.append(el("div",{class:"scroll"},tb));
    } else inner.append(el("div",{class:"empty"},"No distribution recorded (no extract or access route)."));
    det.append(inner); return det;
  }
  function render(){
    const q=search.value.toLowerCase(), fp=selP.value, ft=selT.value, ff=selF.value;
    const fr=ds.filter(d=>(!fp||d.publisher===fp)&&(!ft||(d.themes||[]).includes(ft))&&(!ff||(d.formats||[]).includes(ff))&&(!q||(d.title+" "+d.description+" "+(d.keywords||[]).join(" ")).toLowerCase().includes(q)));
    list.innerHTML=""; fr.forEach(d=>list.append(card(d)));
    if(!fr.length) list.append(el("div",{class:"empty"},"No datasets match."));
    cnt.textContent=`${fr.length} of ${ds.length} datasets`;
  }
  [selP,selT,selF].forEach(s=>s.addEventListener("change",render)); search.addEventListener("input",render);
  p.append(bar,list); render();
  p._focusTheme=sa=>{selP.value="";selF.value="";search.value="";selT.value=sa;render();};
  p._focusDataset=sl=>{selP.value="";selT.value="";selF.value="";search.value="";render();
    const card=[...list.querySelectorAll("details")].find(x=>x.id==="ds-"+sl);
    if(card){card.open=true;card.scrollIntoView({behavior:"smooth",block:"center"});card.classList.add("flash");setTimeout(()=>card.classList.remove("flash"),1600);}
  };
});

// ---------- Distributions
addPanel("distributions","Distributions",p=>{
  const dd=D.distributions||[];
  if(!dd.length){p.append(el("div",{class:"empty"},"No distributions."));return;}
  const tb=el("table",{},el("thead",{},el("tr",{},el("th",{},"Dataset"),el("th",{},"Title"),el("th",{},"Format"),el("th",{},"Size"),el("th",{},"Access"),el("th",{},"Download"))));
  const body=el("tbody",{});
  dd.forEach(x=>body.append(el("tr",{},el("td",{},x.dataset),el("td",{},x.title),el("td",{},x.format||x.mediaType||""),el("td",{},x.byteSize||""),el("td",{},link(x.accessURL,x.accessURL?"open":"")),el("td",{},link(x.downloadURL,x.downloadURL?"download":"")))));
  tb.append(body); p.append(el("div",{class:"scroll"},tb));
});

// ---------- Entities (public bodies / organisations, operating-model only, not datasets)
if((D.entities||[]).length) addPanel("entities","Entities",p=>{
  const es=D.entities||[];
  p.append(el("div",{class:"small muted",style:"margin:4px 0 10px"},
    "Public bodies and external partners from the operating model. These are organisations that own themes and publish data, not datasets in their own right. "+es.length+" entities."));
  const search=el("input",{type:"search",placeholder:"search entity / type / theme\u2026"});
  const cnt=el("div",{class:"count"});
  p.append(el("div",{class:"filters"},search,cnt));
  const tb=el("table",{},el("thead",{},el("tr",{},el("th",{},"Entity"),el("th",{},"Type"),el("th",{},"Theme / subject area"),el("th",{},"Owns themes"),el("th",{},"Operating Model"))));
  const body=el("tbody",{}); tb.append(body);
  p.append(el("div",{class:"scroll"},tb));
  function render(){
    const q=search.value.toLowerCase();
    const fr=es.filter(d=>!q||((d.title||"")+" "+(d.kind||"")+" "+(d.themes||[]).join(" ")).toLowerCase().includes(q));
    body.innerHTML="";
    fr.forEach(d=>{
      const lc=launchChips(d);
      body.append(el("tr",{},
        el("td",{},el("b",{},d.title)),
        el("td",{class:"small"},d.kind||""),
        el("td",{class:"small"},(d.themes||[]).join(", ")),
        el("td",{class:"small"},(d.ownsThemes||[]).join(", ")),
        el("td",{},lc||document.createTextNode(""))));
    });
