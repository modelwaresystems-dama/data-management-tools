<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sample Interactive Asset</title>
<!--
  A self-contained example asset so you can test the full pipeline today.
  Replace with your real interactive HTML. No external dependencies, so it
  embeds cleanly in the add-in iframe and loads for anyone with the link.
-->
<style>
  :root{
    --bg:#ffffff; --fg:#1b1b19; --muted:#6c6c64; --border:#e4e4dd;
    --accent:#c43e1c; --accent-weak:rgba(196,62,28,.10);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#17171c; --fg:#ededf1; --muted:#9a9aa6; --border:#33333d;
      --accent:#ff6a3d; --accent-weak:rgba(255,106,61,.16); }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);height:100vh;display:flex;flex-direction:column}
  header{padding:18px 22px;border-bottom:1px solid var(--border)}
  header .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
  header h1{font-size:20px;margin-top:3px}
  .stage{flex:1;display:flex;gap:18px;padding:22px;min-height:0;flex-wrap:wrap}
  .areas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1 1 320px;align-content:start;min-width:260px}
  .area{border:1px solid var(--border);border-radius:10px;padding:13px 12px;cursor:pointer;background:var(--bg);transition:all .15s;font-size:13px;font-weight:600}
  .area:hover{border-color:var(--accent)}
  .area.active{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
  .panel{flex:1 1 260px;min-width:240px;border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;justify-content:center}
  .panel .big{font-size:22px;font-weight:700;margin-bottom:8px}
  .panel .body{font-size:14px;color:var(--muted);line-height:1.55}
  .panel .ph{color:var(--muted);font-size:14px}
  footer{padding:10px 22px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
  <header>
    <div class="k">Modelware · Sample Asset</div>
    <h1>DMBOK Knowledge Areas — click to explore</h1>
  </header>
  <div class="stage">
    <div class="areas" id="areas"></div>
    <div class="panel" id="panel"><div class="ph">Select a knowledge area to see its one-line definition.</div></div>
  </div>
  <footer>This is placeholder content. Swap this file for your real interactive asset.</footer>

<script>
  var AREAS = [
    ["Data Governance","The exercise of authority and control over the management of data assets."],
    ["Architecture","The overall structure of data and data-related resources as an enterprise capability."],
    ["Modeling & Design","Discovering, analyzing and scoping data requirements, then representing them precisely."],
    ["Storage & Operations","Design, implementation and support of stored data to maximise its value."],
    ["Security","Ensuring privacy, confidentiality and appropriate access to data."],
    ["Integration & Interoperability","Managing the movement and consolidation of data within and between stores."],
    ["Documents & Content","Managing data found outside structured databases."],
    ["Reference & Master Data","Managing shared data to reduce redundancy and improve quality."],
    ["Data Warehousing & BI","Managing analytical data to support decisions and knowledge workers."],
    ["Metadata","Collecting, categorising, maintaining and integrating data about data."],
    ["Data Quality","Planning and implementing techniques to measure and improve data fitness."]
  ];
  var areasEl = document.getElementById("areas"), panel = document.getElementById("panel");
  AREAS.forEach(function (a, i) {
    var d = document.createElement("div");
    d.className = "area"; d.textContent = a[0];
    d.addEventListener("click", function () {
      [].forEach.call(document.querySelectorAll(".area"), function (e) { e.classList.remove("active"); });
      d.classList.add("active");
      panel.innerHTML = '<div class="big">' + a[0] + '</div><div class="body">' + a[1] + '</div>';
    });
    areasEl.appendChild(d);
  });
</script>
</body>
</html>
