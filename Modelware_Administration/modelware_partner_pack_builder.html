  }
  b.push(p("F1.1 The licence is granted against a course and a version. The "+R+" may deliver only the version current on the Platform at the date of each engagement. A superseded version is withdrawn from the Platform within "+ct(d).supersededDays+" days of release of its replacement and may not be delivered after that date, whether or not the "+R+" is aware of the change."));
  b.push(p("F1.2 Adding a course to this Schedule requires the written agreement of the "+O+". Removing one requires notice to the "+R+" and takes effect on the date stated in the notice, save where removal follows a breach, in which case it takes effect immediately."));

  b.push(h2("F2. Named trainers"));
  if(d.modelKey==="RESELLER"){
    b.push(p("The "+R+" sells the Services; it does not deliver them, and it is not granted access to the Facilitator Materials at all. This section is therefore normally empty. It is completed only where the Parties have agreed in writing under Schedule B that the "+R+"'s own certified trainers will deliver a particular engagement, in which case the named individuals appear below and the Authorised Delivery Partner terms apply to them."));
  } else {
    b.push(p("Access is granted to individuals, not to the "+R+" as an organisation. Only the people below may open the Facilitator Materials, and each is granted access under their own credentials."));
  }
  if(ctActiveTrainers(d).length){
    b.push(tbl(["Name","Access account","Certified to deliver","Access from","Status"],
      ctActiveTrainers(d).map(function(t){
        return [t.name||"", t.email||"", t.certifiedTo||"", t.added?dt(t.added):"", t.status||"Active"];
      })));
  } else {
    b.push(p("No trainers are currently named. No access to the Facilitator Materials exists until at least one trainer is named and provisioned."));
  }
  b.push(ol([
    "Credentials are personal. A named trainer may not share, lend or delegate their access, and may not open the material on behalf of anyone else.",
    "The "+R+" notifies the "+O+" within two (2) business days when a named trainer leaves its employment, ceases to hold the required certification, or no longer needs access. Access is then withdrawn.",
    "The "+O+" may add or remove names on request, and reviews the list every "+ct(d).reviewMonths+" months. A trainer who has not delivered in twelve (12) months is removed at the review unless the "+R+" asks for the access to be kept.",
    "The number of named trainers is not capped, but each is provisioned individually and each appears on this Schedule."
  ]));

  b.push(h2("F3. How access is provided"));
  b.push(tbl(["Item","Term"],[
    ["Platform", ct(d).platform||""],
    ["Location", String(ct(d).libraryUrl||"").trim() || "To be notified in writing on provisioning"],
    ["Access method", ct(d).accessMode||""],
    ["Credentials", "A guest account in the "+O+"'s directory, issued to the individual named trainer"],
    ["Protection applied", "Encryption and rights management. The file carries its permissions with it and checks them each time it is opened"],
    ["Rights granted", "View only. No download, no printing, no copying or extraction of content, no editing, no saving a local copy, no forwarding"],
    ["Offline validity", ct(d).offlineDays+" day(s). Access is re-checked against this Schedule at least this often"],
    ["Marking", ct(d).watermark ? "Every page carries \u201c"+ctWatermark(d)+"\u201d" : "Not applied"],
    ["Delegate materials", "Issued by the "+O+" to the enrolled Delegates, per "+cx("mat")],
    ["What is not provided", "No file copy, no repository, no synchronised folder, no export and no application programming interface"]
  ]));
  b.push(p("F3.1 The "+R+" will not, and will not permit any person to, defeat or attempt to defeat these controls \u2014 including by screen capture, screen recording, photography, transcription, re-typing, optical character recognition, or the use of any tool that extracts content from a display. Material reconstructed by any of those means is a copy of the Training Materials and "+cx("ip",2)+" applies to it."));
  b.push(p("F3.2 The "+R+" will not present the Facilitator Materials on a screen that is being recorded, streamed or captured, other than in a live delivery to enrolled Delegates. Where a delivery is conducted online the "+R+" will not enable recording of any part of it without the "+O+"'s prior written consent."));
  b.push(p("F3.3 The controls above are a floor, not a ceiling. The "+O+" may strengthen them at any time, and will give reasonable notice of any change that affects how the "+R+" delivers."));

  b.push(h2("F4. Online delivery"));
  b.push(p("Every online delivery of a Course runs in a meeting hosted on the "+O+"'s "+ctTeams(d).hostedBy+" and organised by "+ctTeams(d).organiser+" The "+R+" does not host, schedule or organise a delivery on its own tenant or on any other conferencing service."));
  b.push(p("F4.1 The reason is control of the meeting settings, not preference of platform. The options below are set by the "+O+" as organiser. The "+R+"'s trainer joins as a presenter and therefore cannot reach or change them."));
  b.push(tbl(["Setting","How it is set","Why"],[
    ["Organiser", ctTeams(d).organiser, "Only the organiser can change meeting options. The "+R+" is never the organiser"],
    ["Meeting template", ctTeams(d).templateName || "Standard course delivery settings", "Applies the settings below to every delivery without anyone having to remember them"],
    ["Who can present", "Organiser and co-organisers only", "An attendee who cannot share a screen cannot broadcast the material onward"],
    ["Recording", ctTeams(d).recording ? "Permitted by prior written consent; the recording belongs to the "+O : "Off. Nobody may record", "A recording is a copy of the Facilitator Materials that outlives the delivery"],
    ["Transcription and AI notes", ctTeams(d).transcription ? "Permitted where agreed in writing" : "Off", "A transcript reconstructs the teaching, which is the part that is deliberately not in the workbook"],
    ["Attendee screen share", ctTeams(d).attendeeShare ? "Permitted" : "Off", "Removes the route for a Delegate to re-share the content live"],
    ["Anonymous join", ctTeams(d).anonymousJoin ? "Permitted" : "Off \u2014 every attendee signs in", "The register under "+cx("learn",6)+" needs a name against every attendee"],

    ["Content marking in the meeting", ctTeams(d).watermark ? "Each participant's own address is shown across the shared content" : "Not applied", "Makes a screenshot traceable to the person who took it"]
  ]));
  b.push(ol([
    "The "+R+" requests a delivery meeting from the "+O+" not less than "+ctTeams(d).noticeDays+" business days before the engagement, giving the date, the times, the course and the delegate list. The "+O+" creates the meeting and issues the joining link.",
    "The "+R+" passes the joining link to the enrolled Delegates and to nobody else. It does not publish the link, post it on a client portal, or forward it beyond the register.",
    "The "+R+" will not record, transcribe, stream, re-broadcast or capture any part of a delivery, will not admit a third-party notetaker, recorder or artificial intelligence assistant to the meeting, and will not permit a Delegate to do any of those things.",

    "A breach of this clause is treated in the same way as unauthorised reproduction under "+cx("mat")+"."
  ]));
  b.push(note("Face-to-face delivery is unaffected: the trainer opens the deck from the Platform in a browser and presents it in the room. This clause governs online delivery only."));

  b.push(h2("F5. Access review"));
  b.push(tbl(["Review","Frequency","What is checked"],[
    ["Named trainer review", "Every "+ct(d).reviewMonths+" months", "Every name on F2 still employed, still certified, still delivering"],
    ["Online delivery review", "Quarterly", "Every online delivery ran on a "+d.franchisor.brand+" meeting, with the settings in F4"],
    ["Course licence review", "Every "+ct(d).reviewMonths+" months", "Every course on F1 still current, still being delivered, still within its licensed period"],
    ["Version currency", "On each release", "Superseded versions withdrawn within "+ct(d).supersededDays+" days"],
    ["Access log review", "Quarterly", "Who opened what, from where, and whether it matches the engagements booked"],
    ["Exception review", "As they arise", "Any offline or unusual access granted, and whether it is still needed"]
  ]));
  b.push(p("F5.1 The "+O+" keeps a record of every grant, change and withdrawal of access under this Schedule, and of every access to the Facilitator Materials. The "+R+" consents to that logging and will inform its named trainers of it. The record is evidence for the purposes of "+cx("mat")+" and "+cx("learn")+"."));

  b.push(h2("F6. Withdrawal of access"));
  b.push(p("Access is withdrawn, in whole or in part, on any of the events below. Withdrawal is a technical act by the "+O+" and does not require the "+R+"'s cooperation."));
  b.push(tbl(["Event","What is withdrawn","When"],[
    ["Expiry or termination of this Agreement, for any reason", "All access, all courses, all named trainers", "Within "+ct(d).withdrawHours+" hours of the effective date"],
    ["Suspension of delivery under "+cx("accred"), "Access to the affected courses", "Immediately on notice"],
    ["A named trainer leaves, or loses certification", "That individual's access", "Within "+ct(d).withdrawHours+" hours of notification or discovery"],
    ["Removal of a course from F1", "Access to that course", "On the date stated in the notice"],
    ["Breach of "+cx("mat")+", "+cx("learn")+" or F3", "All access, pending investigation", "Immediately, without notice"],
    ["Non-payment beyond the cure period", "All access", "On written notice, and restored on payment"]
  ]));
  b.push(ol([
    "On withdrawal the "+R+"'s credentials are disabled and its access to the Platform ends. Because no copy was ever provided, there is nothing for the "+R+" to return, delete or certify \u2014 and nothing it can continue to use.",
    "Any cached copy on a device stops opening within "+ct(d).offlineDays+" day(s) of withdrawal, being the offline validity in F3. The "+R+" will not attempt to extend, preserve or circumvent that expiry.",
    "Withdrawal does not of itself terminate this Agreement, and does not relieve the "+R+" of any obligation that has already accrued.",
    "Where access is withdrawn in error the "+O+" restores it promptly and, where a booked engagement was affected, bears the "+R+"'s reasonable direct costs of the postponement."
  ]));

  b.push(h2("F7. Engagements already booked"));
  b.push(p("F7.1 Where this Agreement ends while engagements are booked but not delivered, the "+O+" will, at its discretion and on written request, either (a) permit the "+R+" to complete those engagements under a short written extension limited to the courses and dates concerned, or (b) deliver them itself and account to the "+R+" for the margin it would have earned. The "+R+" will not represent to a client that it can deliver a course to which its access has ended."));

  b.push(h2("F8. Evidence and audit"));
  b.push(ol([
    "The "+O+" may audit the "+R+"'s compliance with this Schedule once per year on reasonable notice, and at any time on reasonable suspicion of a breach. The audit is limited to the use of the Training Materials and does not extend to the "+R+"'s client pricing or unrelated business.",
    "The "+R+" will, on request, confirm in writing which of its people have accessed the Facilitator Materials, on what devices, and for which engagements.",
    "Access logs kept by the "+O+" and the delegate register kept by the "+R+" under "+cx("learn",6)+" are read together. A delivery in the log with no matching register entry, or the reverse, is a matter the "+R+" will explain.",
    "Nothing in this Schedule requires the "+R+" to disclose the personal data of any person beyond what is necessary to administer access, and both Parties handle that data under the Data Protection and AI Ethics Addendum."
  ]));
  b.push(note("The technical controls in F3 and F4 make casual copying hard and deliberate copying visible and attributable. They do not make it impossible. That is why F3.1 exists: what the controls cannot prevent, the Agreement makes a breach, and the marking on every page makes it traceable to the licence it came from."));
  docs.push({id:"SCH-F", code:"07", title:"Schedule F \u2014 Licensed Content and Access", subtitle:refBase+" \u2014 "+partyName(d), stamp:buildStamp(), blocks:xrefResolve(b)});

  /* ====================================================== NDA */
  b=[];
  b.push(h1("MUTUAL NON-DISCLOSURE AGREEMENT"));
  b.push(note(REVIEW_NOTE));
  b.push(p("This Mutual Non-Disclosure Agreement is entered into on "+dt(d.term.agreementDate)+" between "+F.legalName+" of "+F.address+" and "+partyName(d)+" of "+fb(P.address,"Partner address")+" (each a “Party”)."));
  b.push(h2("1. Purpose"));
  b.push(p("1.1 The Parties wish to exchange confidential information in connection with the evaluation, negotiation and performance of a "+M.name+" relationship for "+terr+" (the “Purpose”)."));
  b.push(h2("2. Confidential Information"));
  b.push(p("2.1 “Confidential Information” means any information disclosed by one Party (“Discloser”) to the other (“Recipient”), in any form, that is marked confidential or that a reasonable person would understand to be confidential, including courseware, methodologies, pricing, financial models, partner and client lists, learner data, business plans, roadmaps and the terms of any agreement between the Parties."));
  b.push(p("2.2 Confidential Information does not include information that: (a) is or becomes public without breach of this Agreement; (b) the Recipient held free of restriction before disclosure; (c) is lawfully received from a third party without restriction; or (d) the Recipient independently develops without use of the Confidential Information."));
  b.push(h2("3. Obligations"));
  b.push(ol([
    "Use the Confidential Information solely for the Purpose.",
    "Keep it secret using at least the care it applies to its own confidential information, and never less than reasonable care.",
    "Disclose it only to personnel and professional advisers who need it for the Purpose and who are bound by equivalent obligations, remaining responsible for their compliance.",
    "Not copy, reverse engineer, or derive competing materials from it.",
    "Notify the Discloser promptly on becoming aware of any unauthorised disclosure and cooperate in limiting the consequences."
  ]));
  b.push(h2("4. Compelled disclosure"));
  b.push(p("4.1 The Recipient may disclose Confidential Information to the extent required by law, regulation or court order, provided it gives the Discloser prompt written notice where lawful, and discloses only the minimum required."));
  b.push(h2("5. No licence, no obligation"));
  b.push(p("5.1 All Confidential Information remains the property of the Discloser. No licence, assignment or other right is granted except the limited right to use it for the Purpose. Neither Party is obliged to disclose anything, or to proceed to any transaction."));
  b.push(h2("6. Personal information"));
  b.push(p("6.1 Where Confidential Information includes personal information, the Recipient processes it only for the Purpose, applies appropriate security safeguards, and complies with "+GOVERNING_LAW.dataAct+" and any applicable data protection law in the Territory."));
  b.push(h2("7. Duration and return"));
  b.push(p("7.1 This Agreement applies to disclosures made in the two (2) years from the date above, and the obligations in clause 3 continue for five (5) years from the date of each disclosure. Obligations relating to trade secrets and to personal information continue for as long as the law protects them."));
  b.push(p("7.2 On written request, or on the end of any partnership relationship between the Parties, the Recipient returns or irretrievably destroys all Confidential Information and certifies that it has done so, save for one archival copy retained for legal compliance and for copies held in routine backups that are not readily accessible."));
  b.push(h2("8. Remedies"));
  b.push(p("8.1 The Parties acknowledge that damages alone may not be an adequate remedy for breach, and that the Discloser is entitled to seek urgent interim relief in addition to any other remedy."));
  b.push(h2("9. General"));
  b.push(p("9.1 This Agreement is governed by "+GOVERNING_LAW.law+", and "+cx("law")+" of the "+M.agreementTitle+" (dispute resolution) applies to it as if set out in full."));
  b.push(p("9.2 It may be signed in counterparts and by electronic signature. No amendment is effective unless in writing and signed by both Parties."));
  b.push(sig(d));
  docs.push({id:"NDA", code:"08", title:"Mutual Non-Disclosure Agreement", subtitle:refBase+" — "+partyName(d), stamp:buildStamp(), blocks:xrefResolve(b)});

  /* ====================================================== DPA / AI ETHICS */
  b=[];
  b.push(h1("DATA PROTECTION AND AI ETHICS ADDENDUM"));
  b.push(note(REVIEW_NOTE+" Where the Territory is subject to the GDPR, the UK GDPR, the Saudi PDPL, the UAE PDPL, the Nigerian NDPA or a comparable regime, a jurisdiction-specific data processing agreement and transfer mechanism will usually be required in addition to this Addendum."));
  b.push(p("This Addendum forms part of the "+M.agreementTitle+" bearing reference "+refBase+" between "+F.legalName+" and "+partyName(d)+"."));
  b.push(h2("1. Roles"));
  b.push(p("1.1 In respect of learner records, enrolment data, assessment results and certification data held in "+fb(d.ops.lms,"the learning platform")+", the "+O+" is the responsible party (controller) and the "+R+" is the operator (processor) acting on documented instructions."));
  b.push(p("1.2 In respect of the "+R+"'s own client relationships, prospect lists and employees, the "+R+" is the responsible party in its own right and is solely accountable for that processing."));
  b.push(h2("2. Compliance"));
  b.push(ol([
    "Each Party complies with "+GOVERNING_LAW.dataAct+" and with every data protection law applicable in the Territory, whichever imposes the higher standard.",
    "The "+R+" collects only the personal information needed for the Services, retains it only as long as required, and does not use learner data for its own marketing without a lawful basis and a clear opt-out.",
    "The "+R+" implements appropriate technical and organisational security measures, including access control, encryption in transit, device security and staff confidentiality undertakings.",
    "The "+R+" does not transfer personal information across borders except as needed to use the "+O+"'s platforms, or where a lawful transfer mechanism is in place.",
    "The "+R+" assists the "+O+" with data subject requests within five (5) business days and does not respond directly on the "+O+"'s behalf.",
    "The "+R+" notifies the "+O+" of any security compromise affecting learner or client personal information without undue delay and in any event within twenty-four (24) hours of becoming aware of it.",
    "The "+R+" engages a sub-processor only with the "+O+"'s prior written consent and on terms no less protective than this Addendum."
  ]));
  b.push(h2("3. AI ethics standards"));
  b.push(p("3.1 The "+R+" may use artificial intelligence tools to support preparation, marketing and delivery of the Services, subject to the following standards, which reflect the "+F.brand+" position on responsible AI:"));
  b.push(ol([
    "No client, learner or employee personal information, and no client confidential material, may be entered into a public or consumer AI service.",
    "AI-generated content used with clients or learners is reviewed by a competent human before use, and the reviewer remains accountable for its accuracy.",
    "Material AI assistance in producing a client deliverable is disclosed to the client on request, and always where the client's own policy requires it.",
    "Accredited or examinable course content may not be regenerated or paraphrased by an AI tool; only the controlled source of truth may be delivered.",
    "The "+R+" does not present AI output as independent expert opinion, and does not use AI to generate testimonials, case studies, credentials or evaluation results.",
    "Where the "+R+" advises clients on AI governance, it applies the "+F.brand+" methodology and discloses any conflict of interest arising from tools it resells.",
    "The "+R+" keeps a record of AI tools used in delivery and makes it available at the annual compliance audit."
  ]));
  b.push(h2("4. Records and audit"));
  b.push(p("4.1 The "+R+" maintains a record of processing activities relating to the Services and makes it available to the "+O+" on reasonable request, and to a regulator where required by law."));
  b.push(p("4.2 The "+O+" may audit compliance with this Addendum once per year, as part of the compliance audit in Schedule D."));
  b.push(h2("5. End of relationship"));
  b.push(p("5.1 On termination of the Agreement, the "+R+" returns or deletes all personal information processed on the "+O+"'s behalf, subject to any retention required by law, and certifies deletion within thirty (30) days."));
  b.push(sig(d));
  b.push(h2("Cross-border transfers"));
  b.push(p("Delegate and client personal information may move between the "+R+"'s territory and the "+O+"'s systems in South Africa, and may be processed by sub-processors elsewhere. The Parties will put in place, before any transfer, the mechanism required by the law applying in the "+R+"'s territory."));
  b.push(tbl(["Item","Term"],[
    ["Transfer mechanism", "The mechanism recognised by the law of the Territory \u2014 an adequacy finding, standard contractual clauses, binding corporate rules, or the data subject's explicit informed consent where the law permits it"],
    ["Where the Territory is the UAE", "Federal Decree-Law 45 of 2021 (PDPL) applies to the "+R+". Transfers outside the UAE require an adequate-protection finding or an approved contractual mechanism, and a separate Data Processing Agreement is put in place before delegate data is transferred"],
    ["Where the Territory is in the EEA or UK", "Standard contractual clauses plus a transfer risk assessment, and the UK Addendum where UK data is involved"],
    ["Sub-processors", "Named in advance, bound by equivalent terms, and notified to the "+R+" before any change"],
    ["Data localisation", "Where the Territory requires personal information to remain in-country, the "+O+" will make a local processing or storage arrangement, or the affected processing does not take place"],
    ["Conflict", "Where the law of the Territory imposes a stricter requirement than this Addendum, the Territory's law prevails and this Addendum is read subject to it"]
  ]));
  b.push(note("This Addendum is a framework. It does not replace a jurisdiction-specific Data Processing Agreement, which is prepared for the Territory before delegate personal information is transferred."));
  docs.push({id:"DPA", code:"09", title:"Data Protection and AI Ethics Addendum", subtitle:refBase+" \u2014 "+partyName(d), stamp:buildStamp(), blocks:xrefResolve(b)});

  /* ================================ COURSEWARE PROTECTION ONBOARDING */

  b.push(h1("COURSEWARE PROTECTION \u2014 PARTNER ONBOARDING CHECKLIST"));

  b.push(tbl(["Field","Value"],[
    ["Partner", partyName(d)],
    ["Agreement reference", fb(d.ref,"reference")],
    ["Operating model", M.name],
    ["Courses to provision", String(ctActiveItems(d).length)],
    ["Trainers to provision", String(ctActiveTrainers(d).length)],
    ["Library", String(ct(d).libraryUrl||"").trim() || "TO BE CREATED"],
    ["Protection label", ct(d).labelName||""],
    ["Offline validity", ct(d).offlineDays+" day(s)"],
    ["Target completion", "Before the first delivery, and not before Schedule F is signed"]
  ]));
  b.push(note("Do not provision anything before Stage A is complete. Access granted ahead of a signed Schedule F is access you have no contractual basis to control, and it is the hardest thing to take back."));

  b.push(h2("Stage A \u2014 Paperwork before anything is switched on"));
  b.push(tbl(["#","Step","Who","Done"],[
    ["A1","Agreement and all schedules signed, including Schedule F","Both",""],
    ["A2","Schedule F1 lists every course and version the partner may teach","Us",""],
    ["A3","Schedule F2 lists every named trainer, with a work email address each","Partner",""],
    ["A4","Trainer certification evidence received and checked for each name","Partner",""],
    ["A5","Contract reference frozen and the record pushed to the repository","Us",""],
    ["A6","Partner has read Schedule F3 and F4 and confirmed the delivery method works for them","Partner",""],
    ["A7","Named contact agreed for access requests and joiner/leaver notifications","Partner",""]
  ]));

  b.push(h2("Stage B \u2014 Build their space"));
  b.push(tbl(["#","Step","Who","Done"],[
    ["B1","Create the partner site as a communication site \u2014 not a Teams site, which would add a group, a mailbox and a chat space","Us",""],
    ["B2","Create the partner trainer security group","Us",""],
    ["B3","Grant the group read access to the library. Grant nothing to individuals","Us",""],
    ["B4","Set external sharing on the site to new and existing guests only \u2014 never \u201canyone with the link\u201d","Us",""],
    ["B5","Set the default sharing link to specific people, view only, download blocked","Us",""],
    ["B6","Disable sync and \u201cadd shortcut to OneDrive\u201d on the library","Us",""],
    ["B7","Record the library address on the partner record so Schedule F prints it","Us",""]
  ]));

  b.push(h2("Stage C \u2014 Protect the files"));
  b.push(tbl(["#","Step","Who","Done"],[
    ["C1","Confirm the protection label exists and is published: "+(ct(d).labelName||""),"Us",""],
    ["C2","Label grants view only \u2014 no copy or extract, no print, no export, no edit, no forward","Us",""],
    ["C3","Label offline validity set to "+ct(d).offlineDays+" day(s), matching Schedule F3","Us",""],
    ["C4","Page marking set to: "+(ct(d).watermark?ctWatermark(d):"not applied"),"Us",""],
    ["C5","Copy in only the courses on Schedule F1, at the current version","Us",""],
    ["C6","Apply the label to every file in the library","Us",""],
    ["C7","Confirm no learner workbook or delegate material sits in this library","Us",""]
  ]));

  b.push(h2("Stage D \u2014 Give the named people access"));
  if(ctActiveTrainers(d).length){
    b.push(tbl(["Trainer","Access account","Guest invited","Added to group","Signed in","Tested"],
      ctActiveTrainers(d).map(function(t){ return [t.name||"", t.email||"", "", "", "", ""]; })));
  } else {
    b.push(p("No trainers named on the record. Complete Schedule F2 before this stage."));
  }
  b.push(ol([
    "Invite each trainer individually, by their own work address. Never a shared mailbox, never a distribution list, never an address like training@ \u2014 you cannot withdraw access from a person you cannot name.",
    "Add each to the partner group. Never grant access to an individual directly: the group is what you empty on termination.",
    "Have each trainer sign in once and open one course while you watch, so a failure surfaces now rather than an hour before a delivery.",
    "Record the date each was provisioned on the partner record."
  ]));

  b.push(h2("Stage E \u2014 Set up online delivery"));
  b.push(tbl(["#","Step","Who","Done"],[
    ["E1","Confirm the meeting template exists: "+(ctTeams(d).templateName||"course delivery settings"),"Us",""],
    ["E2","Template sets: presenters limited to organiser and co-organisers","Us",""],
    ["E3","Template sets: recording "+(ctTeams(d).recording?"permitted by consent":"off")+", transcription "+(ctTeams(d).transcription?"permitted":"off"),"Us",""],
    ["E4","Template sets: attendee screen share "+(ctTeams(d).attendeeShare?"on":"off")+", anonymous join "+(ctTeams(d).anonymousJoin?"on":"off"),"Us",""],
    ["E5","Template sets the lobby: "+(ctTeams(d).lobby||""),"Us",""],
    ["E6","Nominate the "+d.franchisor.brand+" account that will organise every delivery meeting","Us",""],
    ["E7","Agree the request route and the "+ctTeams(d).noticeDays+" business day notice for booking a meeting","Both",""],
    ["E8","Partner confirms it will not host a delivery on its own tenant or any other platform","Partner",""],
    ["E9","Partner confirms no third-party notetaker, recorder or AI assistant will be admitted","Partner",""]
  ]));

  b.push(h2("Stage F \u2014 Prove it before the first delivery"));
  b.push(p("Run these as a trainer, not as an administrator. An administrator sees a different world."));
  b.push(tbl(["#","Test","Expected result","Pass"],[
    ["F1","Open a licensed course from the library","Opens in the browser",""],
    ["F2","Try to download it","Not offered, or fails",""],
    ["F3","Try to print it","Produces nothing usable",""],
    ["F4","Select a slide and copy, then paste elsewhere","Nothing usable pastes",""],
    ["F5","Look at the page marking","Shows "+(ct(d).watermark?ctWatermark(d):"the agreed marking"),""],
    ["F6","Open a course NOT on Schedule F1","Access denied",""],
    ["F7","Join a test delivery meeting as the trainer","Joins as presenter, cannot open Meeting options",""],
    ["F8","Try to record the test meeting","Recording unavailable",""],
    ["F9","Try to share a screen as an attendee","Not permitted",""],
    ["F10","Present the deck in the test meeting","Slides display normally",""],
    ["F11","Remove the test account from the group, wait out the offline window, reopen","Refuses to open",""]
  ]));
  b.push(note("F11 is the one that matters. Everything above it is comfort; F11 is the control you are actually buying, and it is what the withdrawal runbook depends on. Do not sign this checklist off without it."));

  b.push(h2("Stage G \u2014 Hand over and diarise"));
  b.push(tbl(["#","Step","Who","Done"],[
    ["G1","Send the partner the library address, the access instructions and the meeting request route","Us",""],
    ["G2","Brief the named trainers on what they may and may not do with the material","Us",""],
    ["G3","Confirm the partner has the current Schedule F and knows it is reissued on every change","Us",""],
    ["G4","Diarise the access review, every "+ct(d).reviewMonths+" months","Us",""],
    ["G5","Diarise the quarterly access-log and online-delivery review","Us",""],
    ["G6","File the completed checklist and the Stage F test evidence on the partner file","Us",""],
    ["G7","Generate the Access Withdrawal Runbook for this partner and file it now, not on the day","Us",""]
  ]));

  b.push(h2("Sign-off"));
  b.push(tbl(["Stage","Completed by","Date","Notes"],[
    ["A \u2014 Paperwork","","",""],
    ["B \u2014 Their space","","",""],
    ["C \u2014 File protection","","",""],
    ["D \u2014 Named access","","",""],
    ["E \u2014 Online delivery","","",""],
    ["F \u2014 Testing","","",""],
    ["G \u2014 Handover","","",""]
  ]));

  /* Internal. Not issued to the partner. Its whole purpose is that on the

  b=[];
  b.push(h1("ACCESS WITHDRAWAL RUNBOOK"));
  b.push(p("Internal procedure for "+d.franchisor.brand+". Not part of the Agreement and not issued to the "+R+"."));
  b.push(note("This runbook withdraws "+partyName(d)+"'s access to the Training Materials. Work top to bottom. Steps 1 to 4 stop new access and are done first, in that order, because each one narrows what the next has to cover. Do not start at the file level \u2014 removing files while accounts are still live leaves the accounts, and accounts are what actually grant access."));
  b.push(tbl(["Field","Value"],[
    ["Partner", partyName(d)],
    ["Agreement reference", fb(d.ref,"reference")],
    ["Operating model", M.name],
    ["Library", String(ct(d).libraryUrl||"").trim() || "NOT RECORDED \u2014 find it before you start"],
    ["Named trainers to remove", String(ctActiveTrainers(d).length)],
    ["Courses licensed", String(ctActiveItems(d).length)],
    ["Contractual deadline", "Within "+ct(d).withdrawHours+" hours of the effective date, per Schedule F6"],

  b.push(h2("Before you start"));
  b.push(ol([
    "Confirm the effective date and the reason in writing, and note who authorised it. Everything below is logged against that authority.",

  b.push(h2("Step 1 \u2014 Stop new access at the door"));
  b.push(tbl(["#","Action","Where","Done"],[
    ["1.1","Remove every named trainer from the partner access group","Directory \u2014 group membership",""],
    ["1.2","Block sign-in on each guest account, then delete it after the retention period","Directory \u2014 users",""],
    ["1.3","Revoke active sign-in sessions and refresh tokens for those accounts","Directory \u2014 revoke sessions",""],
    ["1.4","Remove the partner group from the library's permissions","Content platform \u2014 site permissions",""]
  ]));
  b.push(note("Order matters. Group first, then the account, then sessions. Deleting the account first can leave an active session running until it expires."));

  b.push(h2("Step 2 \u2014 Kill what is already cached"));
  b.push(tbl(["#","Action","Where","Done"],[
    ["2.1","Confirm the protection label's offline validity is "+ct(d).offlineDays+" day(s) \u2014 this is the clock on any cached copy","Protection service \u2014 label settings",""],
    ["2.2","Where the risk warrants it, revoke the protected documents directly rather than waiting out the cache","Protection service \u2014 track and revoke",""],
    ["2.3","Diarise the date the cache expires and re-test on that date","Calendar",""]
  ]));
  b.push(note("Nothing here is instant. A device that already holds a use licence keeps opening the file until the licence expires. That is what the "+ct(d).offlineDays+"-day setting buys you, and it is why it is set low."));

  b.push(h2("Step 3 \u2014 Close the side doors"));
  b.push(tbl(["#","Action","Where","Done"],[
    ["3.1","Delete every sharing link issued for the partner library, including any \u201canyone\u201d links","Content platform \u2014 manage access",""],
    ["3.2","Remove the partner from any Teams team, channel or chat carrying material","Collaboration platform",""],
    ["3.2b","Cancel every scheduled delivery meeting and revoke its joining link","Calendar \u2014 organiser account",""],
    ["3.2c","Delete or restrict any meeting recording, transcript or chat holding course content","Stream / OneDrive",""],
    ["3.3","Remove access to the learning platform, exam booking and delegate administration","Each system in turn",""],
    ["3.4","Cancel any scheduled report, alert or automated export addressed to the partner","Automation",""],
    ["3.5","Check whether anything was ever emailed as an attachment. If it was, say so in the incident note \u2014 an emailed file cannot be recalled","Mail audit",""]
  ]));

  b.push(h2("Step 4 \u2014 Take down the public face"));
  b.push(tbl(["#","Action","Where","Done"],[
    ["4.1","Remove the partner from the website, partner directory and any listing that implies a current relationship","Website",""],
    ["4.2","Require removal of "+d.franchisor.brand+" branding, the attribution line and any accreditation reference from the partner's own materials, and set a date","Notice to partner",""],
    ["4.3","Withdraw joining-instruction and certificate templates carrying our name","Templates",""],
    ["4.4","Notify DAMA International if the partnership was visible in the accreditation context","Accreditation contact",""]
  ]));

  b.push(h2("Step 5 \u2014 Prove it"));
  b.push(tbl(["#","Evidence to keep","Where filed","Done"],[
    ["5.1","Screenshot or export of group membership after removal","Partner file",""],
    ["5.2","Directory audit log showing account block and session revocation","Partner file",""],
    ["5.3","Sharing-link report showing no active links","Partner file",""],
    ["5.4","Access log for the twelve months before withdrawal","Partner file",""],
    ["5.5","Re-test result: a former trainer account cannot open a licensed file","Partner file",""],
    ["5.6","Signed note of who authorised the withdrawal, when, and why","Partner file",""]
  ]));

  b.push(h2("Step 6 \u2014 Watch for what you cannot stop"));
  b.push(ol([
    "Search for the partner still advertising the courses, thirty days after withdrawal and again at ninety.",
    "Search for our slide content, diagrams and course outlines appearing under another name.",
    "Check whether any former named trainer has surfaced at another provider delivering a substantially similar course \u2014 "+cx("learn",5)+" runs for twelve months after termination.",
    "Where something turns up, the marking on the page identifies the licence it came from. Preserve the evidence with dates before making contact."
  ]));

  b.push(h2("Courses to withdraw"));
  if(ctActiveItems(d).length){
    b.push(tbl(["Code","Course","Version","Withdrawn"],
      ctActiveItems(d).map(function(it){
        var c=courseByCode(it.code)||{};
        return [it.code||"", it.title||c.title||"", it.version||c.version||"", ""];
      })));
  } else { b.push(p("No courses recorded on this partner record.")); }

  b.push(h2("Accounts to remove"));
  if(ctActiveTrainers(d).length){
    b.push(tbl(["Name","Access account","Blocked","Deleted","Re-tested"],
      ctActiveTrainers(d).map(function(t){ return [t.name||"", t.email||"", "", "", ""]; })));
  } else { b.push(p("No named trainers recorded on this partner record.")); }

  b.push(note("Completed by ____________________  Date ____________  Countersigned ____________________"));
  docs.push({id:"RUNBOOK", code:"11", internal:true, title:"Access Withdrawal Runbook (internal)", subtitle:refBase+" \u2014 "+partyName(d), stamp:buildStamp(), blocks:xrefResolve(b)});

  return docs;
}

    sheet.cols.forEach(function(w,i){ x+='<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>'; });
    x+="</cols>";
  }
  x+="<sheetData>";
  rows.forEach(function(r,ri){
    if(!r||!r.length){ return; }
    x+='<row r="'+(ri+1)+'"'+(sheet.rowHeights&&sheet.rowHeights[ri]?' ht="'+sheet.rowHeights[ri]+'" customHeight="1"':'')+'>';
    r.forEach(function(c,ci){
      if(c===null||c===undefined) return;
      var ref=colName(ci)+(ri+1), st=(c.s===undefined?0:c.s);
      if(c.t==="f"){ x+='<c r="'+ref+'" s="'+st+'"><f>'+xesc(c.v)+'</f></c>'; }
      else if(c.t==="n"){ if(c.v===null||c.v===""||isNaN(c.v)) { x+='<c r="'+ref+'" s="'+st+'"/>'; }
                          else x+='<c r="'+ref+'" s="'+st+'"><v>'+Number(c.v)+'</v></c>'; }
      else { var v=String(c.v===null||c.v===undefined?"":c.v);
             if(v==="") { x+='<c r="'+ref+'" s="'+st+'"/>'; }
             else x+='<c r="'+ref+'" s="'+st+'" t="inlineStr"><is><t xml:space="preserve">'+xesc(v)+'</t></is></c>'; }
    });
    x+="</row>";
  });
  x+="</sheetData>";
  if(sheet.freeze){ }
  x+='<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/></worksheet>';
  return x;
}

  var files=[{name:"[Content_Types].xml",data:u8(ct)},{name:"_rels/.rels",data:u8(rels)},
             {name:"xl/workbook.xml",data:u8(wb)},{name:"xl/_rels/workbook.xml.rels",data:u8(wbr)},
             {name:"xl/styles.xml",data:u8(XL_STYLES)}];
  sheets.forEach(function(s,i){ files.push({name:"xl/worksheets/sheet"+(i+1)+".xml",data:u8(sheetXml(s))}); });
  return zipMake(files);
}

<script>

  reg.push([
    S(fb(d.ref,"ref")), S(fb(d.partner.legalName,"legal name")), S(d.partner.tradingName), S(d.partner.regNo),
    S(d.partner.vatNo), S(d.partner.countryOfIncorporation), S(d.partner.address), S(territoryText(d)),
    S(d.territory.countries.join(", ")), S(M.name), S(d.territory.exclusivity),
    S(M.flags.subLicence?"Permitted":"Not permitted"), S(d.territory.channels),
    S("2. Onboarding & Training"), S(d.status||"Contracting"),

    N(d.ops.onboardingWeeks,9), S(cur), N(d.commercial.initialFee,4),

    N(d.commercial.minAnnualRoyalty,4), S(nextGate?nextGate.label:""), DT(nextGate?nextGate.date:null),
    S(d.franchisor.repName), S(d.notes),
    DT(phase1End(d)), N(invTotal(d,"mws"),4), N(invTotal(d,"partner"),4),
    N(invTriggerPax(d),9), N(invRevTrigger(d),4), S(d.inventory.recoverable?"Yes":"No")
  ]);
  reg.push([]);
  reg.push([{t:"s",v:buildStamp(),s:10}]);
  reg.push([]);
  reg.push([G("Lifecycle stage reference")]);
  LIFECYCLE_STAGES.forEach(function(s){ reg.push([S(s[0],7),S(s[1],7)]); });
  sheets.push({name:"Partner Register", preview:"record", cols:hdr.map(function(h,i){ return i===6||i===12||i===26?38:(h.length<10?12:Math.min(26,h.length+6)); }), rows:reg, rowHeights:{3:30}});

  /* ---- 3. Commercial Model ---- */
  var c=[], row=0; function put(cells){ c.push(cells); row++; return row; }
  put([TT("Commercial Model & Royalty Calculator")]);                       /* 1 */

  put([]);                                                                  /* 3 */
  var rAssump=put([G("Assumptions"),G("Value"),G(""),G("")]);               /* 4 */
  var rCur   =put([S("Currency",7), S(cur,7)]);
  var rFee   =put([S("Initial fee",7), N(d.commercial.initialFee,4)]);
  var rBase  =put([S("Base royalty rate",7), N(Number(d.commercial.royaltyPct)/100,5)]);
  var t1=(d.commercial.tiers[0]||{from:0,pct:d.commercial.royaltyPct});
  var t2=(d.commercial.tiers[1]||{from:0,pct:d.commercial.royaltyPct});
  var rT1a  =put([S("Tier 1 revenue threshold",7), N(t1.from,4)]);
  var rT1b  =put([S("Tier 1 royalty rate",7), N(Number(t1.pct)/100,5)]);
  var rT2a  =put([S("Tier 2 revenue threshold",7), N(t2.from,4)]);
  var rT2b  =put([S("Tier 2 royalty rate",7), N(Number(t2.pct)/100,5)]);
  var rMkt  =put([S("Marketing contribution",7), N(Number(d.commercial.marketingPct)/100,5)]);
  var rMin  =put([S("Minimum annual royalty (from year 2)",7), N(d.commercial.minAnnualRoyalty,4)]);
  var rGM   =put([S("Partner delivery gross margin",7), N(0.55,5)]);
  var rFix  =put([S("Partner annual fixed operating cost",7), N(Math.round(Number(d.targets.year1Revenue)*0.28),4)]);
  var rGrow =put([S("Year-on-year revenue growth",7), N(Number(d.targets.year2Growth)/100,5)]);
  var rOvrR=0, rOvrP=0;
  if(M.flags.masterOverride){
    rOvrR=put([S("Sub-partner override rate",7), N(Number(d.commercial.overridePct)/100,5)]);
    rOvrP=put([S("Sub-partner network revenue (year 1)",7), N(0,4)]);
  }
  put([]);
  var rHdr=put([H("Line"),H("Year 1"),H("Year 2"),H("Year 3")]);
  var rRev=put([S("Gross revenue (plan)",7), N(d.targets.year1Revenue,4),
                Fx("B"+(rHdr+1)+"*(1+$B$"+rGrow+")"), Fx("C"+(rHdr+1)+"*(1+$B$"+rGrow+")")]);
  function tri(label,fA,style){
    var rn=c.length+1;
    var cells=[S(label,7)];
    ["B","C","D"].forEach(function(col){ cells.push(Fx(fA(col,rn),style===undefined?4:style)); });
    c.push(cells); return rn;
  }
  var rRate=tri("Applicable royalty rate",function(col,rn){
    return "IF("+col+rRev+">=$B$"+rT2a+",$B$"+rT2b+",IF("+col+rRev+">=$B$"+rT1a+",$B$"+rT1b+",$B$"+rBase+"))"; },5);
  var rRoy=tri("Royalty payable",function(col,rn){
    return "MAX("+col+rRev+"*"+col+rRate+",IF("+col+rRev+"=0,0,$B$"+rMin+"))"; });
  var rMktP=tri("Marketing contribution",function(col){ return col+rRev+"*$B$"+rMkt; });
  var rOvr=0;
  if(M.flags.masterOverride){ rOvr=tri("Sub-partner override",function(col){ return "$B$"+rOvrP+"*$B$"+rOvrR; }); }
  var rTot=tri("Total payable to "+d.franchisor.brand,function(col){
    return col+rRoy+"+"+col+rMktP+(rOvr?"+"+col+rOvr:""); });
  var rEff=tri("Effective total rate",function(col){ return "IF("+col+rRev+"=0,0,"+col+rTot+"/"+col+rRev+")"; },5);
  var rDel=tri("Partner delivery cost",function(col){ return col+rRev+"*(1-$B$"+rGM+")"; });
  var rFixC=tri("Partner fixed operating cost",function(col){ return "$B$"+rFix; });
  var rProf=tri("Partner operating profit",function(col){
    return col+rRev+"-"+col+rTot+"-"+col+rDel+"-"+col+rFixC; });
  var rMarg=tri("Partner net margin",function(col){ return "IF("+col+rRev+"=0,0,"+col+rProf+"/"+col+rRev+")"; },5);
  var rCum=c.length+1;
  c.push([S("Cumulative profit after initial fee",7),
          Fx("B"+rProf+"-$B$"+rFee), Fx("B"+rCum+"+C"+rProf), Fx("C"+rCum+"+D"+rProf)]);
  var rPay=c.length+1;
  c.push([S("Payback achieved",7),
          Fx('IF(B'+rCum+'>=0,"Yes","No")',7), Fx('IF(C'+rCum+'>=0,"Yes","No")',7), Fx('IF(D'+rCum+'>=0,"Yes","No")',7)]);
  c.push([]);
  var rFH=c.length+1; c.push([G(d.franchisor.brand+" view"),G("Year 1"),G("Year 2"),G("Year 3")]);
  var rFI=c.length+1; c.push([S("Income from this partner",7), Fx("B"+rTot), Fx("C"+rTot), Fx("D"+rTot)]);
  var rFC=c.length+1; c.push([S("Cumulative income incl. initial fee",7),

    lg.push([S(x.label),S(x.type+" gate"),DT(x.date),S(x.obj),S(x.ev),

  });

   ["Term performance review","Annual or at renewal","Hard","Renew, rescope, probation or exit"]
  ].forEach(function(m){ lg.push([S(m[0]),S(m[1]),S(m[2]),S(m[3]),S("Not started"),T("")]); });
  lg.push([]);
  lg.push([G("Lifecycle stages")]);
  LIFECYCLE_STAGES.forEach(function(s){ lg.push([S(s[0],7),S(s[1],7)]); });
  lg.push([]);
  lg.push([{t:"s",v:buildStamp(),s:10}]);
  sheets.push({name:"Lifecycle Gates", cols:[34,14,14,52,52,20,16,14,26,30], rows:lg, rowHeights:{4:30}});

  /* ---- 5. KPI Scorecard ---- */
  var k=[];
  k.push([TT("Partner KPI Scorecard")]);
  k.push([{t:"s",v:"Enter the Actual column at each review. Variance and Status calculate automatically.",s:10}]);
  k.push([]);

  var lowerBetter=["days","months","count"];
  KPI_SETS.forEach(function(set){
    k.push([G(set[0]),G(""),G(""),G(""),G(""),G(""),G(""),G(""),G("")]);

      var unit=kpi[1], target=kpi[2];
      var better = (unit==="days"||unit==="months") ? "Lower"
                 : (kpi[0].indexOf("incident")>-1 ? "Lower" : "Higher");

  /* ---- 6. Onboarding checklist ---- */
  var ob=[], rows=[];
  ONBOARDING_TASKS.forEach(function(grp){
    rows.push({grp:grp[0]});

      rows.push({stage:grp[0].replace(/ \(.*$/,""), task:t[0], owner:t[1],

  var sumRows={};

  sheets.push({name:"Onboarding", cols:[34,58,12,13,10,14,13,30,34], rows:ob, rowHeights:(function(){var o={};o[HDR]=30;return o;})()});

  /* ---- 7a. Reseller Pricing (this model only) ----
     The band is chosen by formula from weeks delivered, so changing the weeks

    resWeekSteps(d).forEach(function(w){

    resWeekSteps(d).forEach(function(w){

  function ivLedger(seed, blanks){

                   "Rate","Amount","Recognised","Cumulative","Notes"].map(H));

      var rangeC="$C$"+first+":$C$"+LAST, rangeB="$B$"+first+":$B$"+LAST;

        Fx("E"+r+"*F"+r, 4),                                        /* Value  = qty x unit price */
        null,                                                       /* Rate   (filled by caller) */
        Fx("G"+r+"*IF(H"+r+'="",1,H'+r+")", 4),                     /* Amount = value x rate */

        Fx('IF(C'+r+'="Actual",I'+r+',IF(COUNTIFS('+rangeC+',"Actual",'+rangeB+',B'+r+')>0,0,I'+r+'))', 4),

                   Fx("SUM(I"+first+":I"+LAST+")",4),
                   Fx("SUM(J"+first+":J"+LAST+")",4),T(""),T("")]);
    return {first:first,last:LAST,total:tot};
  }

  var rPhase=ivRow([S("Phase 1 End Date",7), DT(phase1End(d))]);
  var rTPax=ivRow([S("Viability Trigger — delegates in one booking",7), N(invTriggerPax(d),9)]);
  var rTrig =ivRow([S("Viability Trigger — cumulative revenue",7), N(invRevTrigger(d),4)]);

  var rHit =ivRow([S("Viability Trigger met?",7),
    Fx('IF(OR(AND(B'+rTPax+'>0,B'+rBook+'>=B'+rTPax+'),AND(B'+rTrig+'>0,B'+rRevT+'>=B'+rTrig+')),"Yes","No")',7)]);
  ivRow([S("Met by",7),
    Fx('IF(B'+rHit+'<>"Yes","",'
       +'IF(AND(B'+rTPax+'>0,B'+rBook+'>=B'+rTPax+'),"Booking of "&B'+rBook+'&" delegates","Cumulative revenue"))',7)]);

  return sheets;

/* the spec, narrowed to the model being offered */
function intakeSectionsFor(d){
  var mk=(d&&d.modelKey)||"ADP", out=[];
  INTAKE_SECTIONS.forEach(function(s){
    var fs=s[2].filter(function(f){ return !f.m || f.m.indexOf(mk)>-1; });
    if(fs.length) out.push([s[0],s[1],fs]);
  });
  return out;
}
function intakeFieldCount(d){
  var n=0; intakeSectionsFor(d||D).forEach(function(s){ n+=s[2].length; }); return n;
}
function intakeFieldCountAll(){
  var n=0; INTAKE_SECTIONS.forEach(function(s){ n+=s[2].length; }); return n;
}
function intakeRequiredCount(d){
  var n=0; intakeSectionsFor(d||D).forEach(function(s){ s[2].forEach(function(f){ if(f.req) n++; }); }); return n;
}
/* value already known to us, used to pre-fill the form we send out */
function intakePrefill(d){
  var out={};
  intakeSectionsFor(d).forEach(function(s){
    s[2].forEach(function(f){
      var v=pGet(d,f.p);
      if(v===undefined||v===null||v==="") return;
      if(f.t==="countries") v=(Array.isArray(v)?v:[v]).join(", ");
      out[f.p]=v;
    });
  });
  return out;
}
/* answers -> a builder data object */
function intakeToData(answers,base){
  var d=base||blankModel(), k, f, map={};
  INTAKE_SECTIONS.forEach(function(s){ s[2].forEach(function(x){ map[x.p]=x; }); });
  for(k in answers){
    if(!Object.prototype.hasOwnProperty.call(answers,k)) continue;
    f=map[k]; var v=answers[k];
    if(v===undefined||v===null) continue;
    if(f && f.t==="countries"){
      v=String(v).split(",").map(function(x){ return x.trim(); }).filter(function(x){ return x.length; });
    } else if(f && f.t==="number"){
      v=(String(v).trim()==="")?"":Number(v);
      if(v!=="" && isNaN(v)) continue;
    }
    if(v==="" ) continue;
    pSet(d,k,v);
  }
  if(!d.status || d.status==="Prospect" || d.status==="Contracting") d.status="Due diligence";
  return d;
}

<script>
"use strict";
/* ==========================================================================
   GITHUB SYNC — private repo, one JSON per partner plus a generated register.
   Uses the GitHub Contents REST API directly. No libraries, no OAuth flow.
   The rest of the app stays fully offline; only these calls touch the network.
   ========================================================================== */
var GH = {
  owner:"modelwaresystems-dama",
  repo:"modelware_app_storage",
  folder:"modelware_businesspartner_data",
  branch:"main",
  token:"",
  remember:false,
  apiBase:"https://api.github.com",
  connected:false,
  login:"",
  files:[],        /* [{slug,path,sha,name}] from partners/ */
  entries:{},      /* slug -> register entry, cached to avoid refetching */
  refs:{allocations:[],sha:null},   /* the contract-reference ledger */
  userId:"",       /* who is writing — stamped on every claim and commit */
  syncedAt:"",     /* SAST time of the last successful pull or push */
  status:"Not connected",
  statusKind:"",   /* "", "ok", "err" */
  busy:false
};
var LS_CFG="mwpp.gh.cfg", LS_TOK="mwpp.gh.token";
var PARTNER_DIR="partners";
var SCHEMA_PARTNER="modelware-partner/1";
var SCHEMA_REGISTER="modelware-partner-register/1";
var SCHEMA_REFS="modelware-contract-references/1";
var REFS_FILE="contract-references.json";

/* ==================================================================
   CONTRACT REFERENCE LEDGER

   A reference must never be reused across partners. Checking the register
   before saving is not enough on its own: two people can both read "the
   highest is 014" and both write 015. The ledger is what makes it safe —
   it is written back with the sha it was read at, so the second writer's
   PUT is rejected by GitHub with a 409 and has to re-read and re-allocate.
   That is the only part of this that survives two machines at once.
   ================================================================== */
function refParse(ref){
  var m=String(ref||"").trim().match(/^(.*?)(\d+)\s*$/);
  if(!m) return null;
  return { prefix:m[1], seq:parseInt(m[2],10), width:m[2].length, ref:String(ref).trim() };
}
function refFormat(prefix,seq,width){
  var s=String(seq);
  while(s.length<width) s="0"+s;
  return prefix+s;
}
function refNorm(ref){ return String(ref||"").trim().toUpperCase().replace(/\s+/g," "); }

/* Every reference we know about, from the ledger and from the partner files,
   because a record saved before the ledger existed is still a claim. */
function refClaims(){
  var out={};
  function claim(ref,slug,name,src){
    var k=refNorm(ref); if(!k) return;
    if(!out[k]) out[k]=[];
    if(!out[k].some(function(x){ return x.slug===slug; })) out[k].push({slug:slug,legalName:name||"",source:src});
  }
  (GH.refs.allocations||[]).forEach(function(a){ claim(a.ref,a.slug,a.legalName,"ledger"); });
  Object.keys(GH.entries||{}).forEach(function(sl){
    var e=GH.entries[sl]; if(e && e.ref) claim(e.ref,sl,e.legalName,"register");
  });
  return out;
}
/* Who else holds this reference. Empty means it is free for this partner. */
function refHolders(ref,forSlug){
  var k=refNorm(ref); if(!k) return [];
  return (refClaims()[k]||[]).filter(function(x){ return x.slug!==forSlug; });
}
function refDuplicates(){
  var c=refClaims(), out=[];
  Object.keys(c).forEach(function(k){ if(c[k].length>1) out.push({ref:k, holders:c[k]}); });
  out.sort(function(a,b){ return a.ref<b.ref?-1:1; });
  return out;
}
/* The next free number in a series, skipping anything already claimed. */
function refNextFree(pattern){
  var p=refParse(pattern)||refParse("MWS-PP-"+new Date().getFullYear()+"-001");
  var claims=refClaims(), best=0;
  Object.keys(claims).forEach(function(k){
    var q=refParse(k);
    if(q && refNorm(q.prefix)===refNorm(p.prefix) && q.seq>best) best=q.seq;
  });
  var seq=Math.max(best+1, 1), guard=0;
  while(claims[refNorm(refFormat(p.prefix,seq,p.width))] && guard++<10000) seq++;
  return refFormat(p.prefix,seq,p.width);
}
function ghLoadRefs(){
  return ghGetFile(ghPathFor(REFS_FILE)).then(function(r){
    if(r.ok && r.json && r.json.content){
      try{
        var j=JSON.parse(b64ToStr(r.json.content));
        GH.refs={ allocations:(j.allocations||[]), sha:r.json.sha };
      }catch(e){ GH.refs={allocations:[], sha:r.json.sha}; }
    } else {
      GH.refs={allocations:[], sha:null};
    }
    return GH.refs;
  });
}
/* Claim a reference for a slug. Re-reads the ledger first, refuses a reference
   another partner holds, and writes with the sha it just read so a concurrent
   claim collides instead of silently overwriting. */
function ghClaimRef(ref,slug,legalName){
  return ghLoadRefs().then(function(){
    var others=refHolders(ref,slug);
    if(others.length){
      throw new Error("Reference "+ref+" is already held by "+others[0].legalName+
                      " ("+others[0].slug+"). Pick another, or use Allocate next.");
    }
    var list=(GH.refs.allocations||[]).filter(function(a){ return a.slug!==slug; });
    list.push({ref:String(ref).trim(), slug:slug, legalName:legalName||"",
               allocatedBy:ghWho(), allocatedAt:new Date().toISOString(),
               allocatedAtSAST:sastNow(), builder:APP_VERSION,
               frozen:!!D.refFrozen, frozenAt:D.refFrozenAt||"",
               unlocks:(D.refUnlockLog||[]).slice(-20)});
    list.sort(function(a,b){ return refNorm(a.ref)<refNorm(b.ref)?-1:1; });
    var body={ schema:SCHEMA_REFS, generatedAt:new Date().toISOString(),
               note:"Authoritative allocation of contract references. One reference, one partner. Written with the sha it was read at, so a concurrent claim is rejected rather than overwritten.",
               allocations:list };
    return ghPutFile(ghPathFor(REFS_FILE), JSON.stringify(body,null,2)+"\n",
                     "Claim reference "+ref+" for "+(legalName||slug)+" by "+ghWho()+" [builder v"+APP_VERSION+"]",
                     GH.refs.sha)
      .then(function(r){
        if(r.status===409) throw new Error("Another save claimed a reference at the same moment. Refresh and try again — nothing was written.");
        if(!r.ok) throw new Error(ghErr(r,REFS_FILE));
        GH.refs.allocations=list;
        GH.refs.sha=r.json&&r.json.content?r.json.content.sha:null;
        return true;
      });
  });
}

/* --------------------------------------------------- reference freeze */
/* Contracting is the point at which a number goes onto something that leaves
   the building, so that is where it locks. The override is a real action with
   a reason attached, not a silent edit. */
var FREEZE_AT_STATUS = "Contracting";
function refShouldFreeze(d){
  var i=STATUSES.indexOf(String(d.status||""));
  var j=STATUSES.indexOf(FREEZE_AT_STATUS);
  return i>=0 && j>=0 && i>=j;
}
function refFreezeIfDue(d){
  if(!d.refFrozen && refShouldFreeze(d)){
    d.refFrozen=true; d.refFrozenAt=sastNow();
    return true;
  }
  return false;
}
function refUnlock(d,reason){
  if(!d.refFrozen) return false;
  d.refFrozen=false;
  d.refUnlockLog=(d.refUnlockLog||[]).concat([{
    ref:d.ref, by:ghWho(), at:sastNow(), reason:String(reason||"").trim(),
    frozenAt:d.refFrozenAt||"", builder:APP_VERSION }]);
  d.refFrozenAt="";
  return true;
}

/* -------------------------------------------------------------- base64 */
function bytesToB64(bytes){
  var s="",chunk=0x8000,i;
  for(i=0;i<bytes.length;i+=chunk) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  return btoa(s);
}
function strToB64(str){ return bytesToB64(u8(str)); }
function b64ToStr(b64){
  var bin=atob(String(b64||"").replace(/\s+/g,"")), n=bin.length, arr=new Uint8Array(n), i;
  for(i=0;i<n;i++) arr[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(arr);
}
function slugify(s){
  return String(s||"").toLowerCase().normalize? String(s||"").toLowerCase().normalize("NFKD")
      .replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,64)
    : String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-");
}
function partnerSlug(d){
  return d.slug && String(d.slug).trim() ? slugify(d.slug)
       : (slugify(d.partner.legalName||d.partner.tradingName||d.ref||"partner") || "partner");
}

/* ----------------------------------------------------------- API client */
/* Only headers GitHub lists in Access-Control-Allow-Headers may be sent from a
   browser. Authorization and Content-Type are on that list; X-GitHub-Api-Version
   is NOT — sending it makes the CORS preflight fail and every call dies with
   "Failed to fetch" before it leaves the machine. Do not add headers here. */
function ghApi(path,opts){
  opts=opts||{};
  var headers={"Accept":"application/vnd.github+json"};
  if(GH.token) headers["Authorization"]="Bearer "+GH.token;
  var init={method:opts.method||"GET",headers:headers,cache:"no-store"};
  if(opts.body){ headers["Content-Type"]="application/json"; init.body=JSON.stringify(opts.body); }
  var url=GH.apiBase+path;
  return fetch(url,init).then(function(res){
    return res.text().then(function(txt){
      var json=null; try{ json=txt?JSON.parse(txt):null; }catch(e){}
      return {ok:res.ok,status:res.status,json:json,text:txt,url:url};
    });
  }).catch(function(e){
    return {ok:false,status:0,json:null,text:"",url:url,netErr:String(e&&e.message||e)};
  });
}
function ghErr(r,what){
  if(r.status===0){
    return "The browser could not reach "+GH.apiBase+" at all ("+(r.netErr||"network error")+
      "). Nothing was sent. This is a network or CORS failure rather than a GitHub error: check you are online, "+
      "and that no proxy or extension is blocking api.github.com.";
  }
  if(r.status===401) return "GitHub rejected the token (401). Check it has not expired.";
  if(r.status===403) return "Forbidden (403). The token is missing Contents: Read and write on this repository.";
  if(r.status===404) return "Not found (404): "+what+". Check the owner, repository name and that the token can see this private repo.";
  if(r.status===409||r.status===422) return "Conflict: the file changed in GitHub since it was read. Refresh, reopen the partner, and reapply your changes.";
  var m=(r.json&&r.json.message)?r.json.message:("HTTP "+r.status);
  return what+" failed: "+m;
}
function ghFolder(){
  return String(GH.folder||"").replace(/\\/g,"/").replace(/^\/+|\/+$/g,"");
}
function ghPathFor(p){ var f=ghFolder(); return (f?f+"/":"")+p; }
function ghContentPath(p){ return "/repos/"+GH.owner+"/"+GH.repo+"/contents/"+encodeURI(p); }
function ghWebUrl(p){
  return "https://github.com/"+GH.owner+"/"+GH.repo+"/tree/"+encodeURIComponent(GH.branch)+"/"+encodeURI(p||ghFolder());
}
/* a repo pasted as "repo/folder" or "repo\folder" is split, not sent as one name */
function ghNormalise(){
  var r=String(GH.repo||"").replace(/\\/g,"/").replace(/^\/+|\/+$/g,"");
  if(r.indexOf("/")>-1){
    var parts=r.split("/");
    GH.repo=parts.shift();
    var rest=parts.join("/");
    if(rest) GH.folder=ghFolder()?rest:rest;
    return true;
  }
  GH.repo=r;
  return false;
}
function ghGetFile(p){
  return ghApi(ghContentPath(p)+"?ref="+encodeURIComponent(GH.branch));
}
function ghPutFile(p,text,message,sha){
  var body={message:message,content:strToB64(text),branch:GH.branch};
  if(sha) body.sha=sha;
  return ghApi(ghContentPath(p),{method:"PUT",body:body});
}

/* ------------------------------------------------------------- connect */
function ghFileUrl(p){
  return "https://github.com/"+GH.owner+"/"+GH.repo+"/blob/"+encodeURIComponent(GH.branch)+"/"+encodeURI(p);
}
/* Reaches the repository and says what it found, without changing anything. */
function ghTest(){
  if(GH.busy) return Promise.resolve();
  if(!GH.owner||!GH.repo){ ghSetStatus("Enter the repository owner and name.","err"); return Promise.resolve(); }
  if(!GH.token){ ghSetStatus("Paste a fine-grained token with Contents: Read and write on this repository.","err"); return Promise.resolve(); }
  ghNormalise(); GH.busy=true;
  ghSetStatus("Testing "+GH.owner+"/"+GH.repo+"\u2026","");
  var note=[];
  return ghApi("/repos/"+GH.owner+"/"+GH.repo).then(function(r){
    if(!r.ok) throw new Error(ghErr(r,"repository "+GH.owner+"/"+GH.repo));
    note.push("Repository reachable"+(r.json&&r.json.private?" and private":", but NOT private \u2014 partner data should not sit in a public repo"));
    if(r.json && r.json.default_branch) note.push("default branch "+r.json.default_branch);
    return ghApi(ghContentPath(ghPathFor(PARTNER_DIR))+"?ref="+encodeURIComponent(GH.branch));
  }).then(function(r){
    if(r.status===404) note.push(ghPathFor(PARTNER_DIR)+"/ does not exist yet \u2014 the first push creates it");
    else if(r.ok && Array.isArray(r.json)) note.push(r.json.filter(function(x){return /\.json$/i.test(x.name);}).length+" partner file(s) on file");
    else note.push("could not read "+ghPathFor(PARTNER_DIR)+"/");
    return ghGetFile(ghPathFor(REFS_FILE));
  }).then(function(r){
    note.push(r.ok ? "reference ledger present" : "no reference ledger yet \u2014 the first push creates it");
    if(!String(GH.userId||"").trim()) note.push("no user id set \u2014 commits will not say who made them");
    ghSetStatus(note.join(" \u00b7 ")+".","ok");
  }).catch(function(e){ ghSetStatus(e.message||String(e),"err"); })
    .then(function(){ GH.busy=false; refresh(); });
}
function ghConnect(){
  if(GH.busy) return Promise.resolve();
  if(!GH.owner||!GH.repo){ ghSetStatus("Enter the repository owner and name.","err"); return Promise.resolve(); }
  if(!GH.token){ ghSetStatus("Paste a fine-grained token with Contents: Read and write on this repository.","err"); return Promise.resolve(); }
  var split=ghNormalise();
  GH.busy=true; ghSetStatus("Connecting to "+GH.owner+"/"+GH.repo+(ghFolder()?" · "+ghFolder()+"/":"")+"…","");
  return ghApi("/repos/"+GH.owner+"/"+GH.repo).then(function(r){
    if(!r.ok){ GH.connected=false; throw new Error(ghErr(r,"repository "+GH.owner+"/"+GH.repo)); }
    if(r.json && r.json.default_branch && !GH.branch) GH.branch=r.json.default_branch;
    GH.connected=true;
    ghSaveCfg();
    return ghRefresh(true).then(function(){
      if(split) ghSetStatus(GH.status+" (the folder was split out of the repository name for you.)",GH.statusKind);
    });
  }).catch(function(e){
    GH.connected=false; ghSetStatus(e.message||String(e),"err");
  }).then(function(){ GH.busy=false; if(GH.connected) activeTab="REPO"; refresh(); });
}
function ghRefresh(quiet){
  if(!GH.connected){ ghSetStatus("Connect first.","err"); return Promise.resolve(); }
  if(!quiet) ghSetStatus("Reading the repository…","");
  return ghApi(ghContentPath(ghPathFor(PARTNER_DIR))+"?ref="+encodeURIComponent(GH.branch)).then(function(r){
    if(r.status===404){ GH.files=[];
      return ghLoadRefs().then(function(){
        ghSetStatus("Connected to "+GH.owner+"/"+GH.repo+" — nothing at "+ghPathFor(PARTNER_DIR)+"/ yet. Saving a partner will create it.","ok");
      }); }
    if(!r.ok) throw new Error(ghErr(r,ghPathFor(PARTNER_DIR)+"/"));
    var list=Array.isArray(r.json)?r.json:[];
    GH.files=list.filter(function(x){ return x.type==="file" && /\.json$/i.test(x.name); })
      .map(function(x){ return {name:x.name, slug:x.name.replace(/\.json$/i,""), path:x.path, sha:x.sha}; })
      .sort(function(a,b){ return a.slug<b.slug?-1:1; });
    ghSetStatus("Connected to "+GH.owner+"/"+GH.repo+" ("+GH.branch+") · "+ghPathFor(PARTNER_DIR)+"/ — "+GH.files.length+" partner"+(GH.files.length===1?"":"s")+" on file.","ok");
    return ghLoadRefs().then(function(){ return ghLoadRegister(); }).then(function(){
      var missing=GH.files.filter(function(x){ return !GH.entries[x.slug]; });
      if(!missing.length) return;
      ghSetStatus("Reading "+missing.length+" partner record"+(missing.length===1?"":"s")+" the register does not cover…","");
      var chain=Promise.resolve(), done=0;
      missing.slice(0,60).forEach(function(fr){
        chain=chain.then(function(){
          return ghReadPartner(fr.path).then(function(rec){
            if(rec) GH.entries[fr.slug]=registerEntry(rec,fr.slug);
            done++;
            ghSetStatus("Reading partner records… "+done+" of "+missing.length,"");
          });
        });
      });
      return chain.then(function(){
        ghStampSynced();
        var dup=ghDuplicateWarning();
        if(dup) ghSetStatus("Duplicate contract reference on file: "+dup+". Open one of them and allocate a new reference.","err");
        else ghSetStatus("Connected to "+GH.owner+"/"+GH.repo+" ("+GH.branch+") · "+ghPathFor(PARTNER_DIR)+"/ — "+
          GH.files.length+" partner"+(GH.files.length===1?"":"s")+" on file, "+
          (GH.refs.allocations||[]).length+" reference"+((GH.refs.allocations||[]).length===1?"":"s")+" allocated.","ok");
      });
    });
  }).catch(function(e){ ghSetStatus(e.message||String(e),"err"); })
    .then(function(){ if(!quiet) refresh(); });
}

/* ---------------------------------------------------- record read/write */
function partnerRecord(d){
  return { schema:SCHEMA_PARTNER, slug:partnerSlug(d),
           updatedAt:new Date().toISOString(), updatedAtSAST:sastNow(),
           builder:{ name:APP_NAME, version:APP_VERSION, build:APP_BUILD },
           data:d };
}
var SCHEMA_INTAKE="modelware-partner-intake/1";
function recordToData(obj){
  if(obj && obj.schema===SCHEMA_INTAKE && obj.answers) return intakeToData(obj.answers, blankModel());
  if(obj && obj.answers && !obj.partner_) return intakeToData(obj.answers, blankModel());
  if(obj && obj.schema===SCHEMA_PARTNER && obj.data) return obj.data;
  if(obj && obj.data && obj.data.partner) return obj.data;
  return obj;
}
function mergeIntoBlank(obj){
  var base=blankModel(), k, j;
  obj=obj||{};
  for(k in base){
    if(obj[k]===undefined) continue;
    if(base[k] && typeof base[k]==="object" && !Array.isArray(base[k]) &&
       obj[k] && typeof obj[k]==="object" && !Array.isArray(obj[k])){
      for(j in obj[k]){ if(obj[k][j]!==undefined) base[k][j]=obj[k][j]; }   /* keep new fields the record predates */
    } else { base[k]=obj[k]; }
  }
  var _ret = retiredModel(base.modelKey);
  if(_ret){ base.modelKey=_ret.to; base.retiredFrom=_ret.name; base.retiredNote=_ret.why; }
  if(!MODELS[base.modelKey]) base.modelKey="ADP";
  if(!base.content || typeof base.content!=="object") base.content=JSON.parse(JSON.stringify(CONTENT_DEFAULT));
  if(!Array.isArray(base.content.items)) base.content.items=[];
  if(!Array.isArray(base.content.trainers)) base.content.trainers=[];
  if(!Array.isArray(base.territory.countries)) base.territory.countries=[];
  if(!Array.isArray(base.commercial.tiers)) base.commercial.tiers=[];
  if(!base.inventory || !Array.isArray(base.inventory.lines) || !base.inventory.lines.length){
    base.inventory=base.inventory||{};
    base.inventory.lines=costLinesFor(base.modelKey==="ADP"?"ADP":"DEFAULT");   /* records that predate cost lines */
  }
  return base;
}
/* the next checkpoint that has not fallen due yet — this is what makes the register useful */
function nextGateFor(d){
  var g=gateDates(d), today=todayISO(), i;
  for(i=0;i<g.length;i++){ if(g[i].key!=="PRE" && g[i].date>=today) return g[i]; }
  return g[g.length-1]||null;
}
function ghOpen(slug, keepTab){
  var fileRec=GH.files.filter(function(x){return x.slug===slug;})[0];
  if(!fileRec){ ghSetStatus("Unknown partner file.","err"); return Promise.resolve(); }
  ghSetStatus("Opening "+slug+"…","");
  return ghGetFile(fileRec.path).then(function(r){
    if(!r.ok) throw new Error(ghErr(r,fileRec.path));
    if(!r.json || !r.json.content) throw new Error("That file is too large to read through the Contents API.");
    var obj=JSON.parse(b64ToStr(r.json.content));
    fileRec.sha=r.json.sha;
    D=mergeIntoBlank(recordToData(obj));
    D.slug=slug;
    if(!keepTab) activeTab="WB";        /* a row action must not throw you out of the list */
    ghSetStatus("Opened "+fb(D.partner.legalName,"partner")+" from GitHub.","ok");
    refresh();
  }).catch(function(e){ ghSetStatus(e.message||String(e),"err"); refresh(); });
}
function ghReadPartner(path){
  return ghGetFile(path).then(function(r){
    if(!r.ok||!r.json||!r.json.content) return null;
    try{ return mergeIntoBlank(recordToData(JSON.parse(b64ToStr(r.json.content)))); }
    catch(e){ return null; }
  });
}
/* one request gets the whole pipeline, instead of one per partner */
function ghLoadRegister(){
  return ghGetFile(ghPathFor("register.json")).then(function(r){
    if(!r.ok||!r.json||!r.json.content) return false;
    try{
      var reg=JSON.parse(b64ToStr(r.json.content));
      (reg.partners||[]).forEach(function(e){ if(e&&e.slug) GH.entries[e.slug]=e; });
      return true;
    }catch(e){ return false; }
  });
}
/* Reported on every refresh: a duplicate that predates the ledger is exactly
   the thing nobody notices until two contracts arrive with the same number. */
function ghDuplicateWarning(){
  var d=refDuplicates();
  if(!d.length) return "";
  return d.map(function(x){
    return x.ref+" \u2014 "+x.holders.map(function(h){ return h.legalName||h.slug; }).join(" and ");
  }).join("; ");
}
function registerEntry(d,slug){
  var M=MODELS[d.modelKey]||MODELS.ADP;
  var next=nextGateFor(d);
  return {
    slug: slug, ref: d.ref||"",
    legalName: d.partner.legalName||"", tradingName: d.partner.tradingName||"",
    countryOfIncorporation: d.partner.countryOfIncorporation||"",
    modelKey: d.modelKey, model: M.name,
    territory: territoryText(d), countries: (d.territory.countries||[]).slice(),
    exclusivity: d.territory.exclusivity, subLicence: !!M.flags.subLicence,
    status: d.status||"", channels: d.territory.channels||"",
    currency: d.commercial.currency, initialFee: Number(d.commercial.initialFee)||0,
    royaltyPct: Number(d.commercial.royaltyPct)||0, marketingPct: Number(d.commercial.marketingPct)||0,
    minAnnualRoyalty: Number(d.commercial.minAnnualRoyalty)||0,
    agreementDate: d.term.agreementDate, commencementDate: d.term.commencementDate,
    termYears: Number(d.term.termYears)||0,
    expiryDate: addYears(d.term.commencementDate, Number(d.term.termYears)||0),
    contactName: d.partner.repName||"", contactEmail: d.partner.email||"",
    year1Revenue: Number(d.targets.year1Revenue)||0,
    nextGate: next?next.label:"", nextGateDate: next?next.date:"",
    updatedAt: new Date().toISOString()
  };
}

/* Save the open partner, then regenerate register.json and README.md */
function ghSave(){
  if(GH.busy) return Promise.resolve();
  if(!GH.connected){ ghSetStatus("Connect to the repository first.","err"); return Promise.resolve(); }
  if(!String(D.partner.legalName||"").trim()){
    ghSetStatus("Give the partner a legal name before saving — it becomes the file name.","err"); return Promise.resolve(); }
  if(!String(D.ref||"").trim()){
    ghSetStatus("Give the agreement a reference before saving — it is what keeps contracts apart.","err");
    return Promise.resolve(); }
  GH.busy=true;
  /* Pushing a record that has reached Contracting is the other moment a number
     is out of the building, so the freeze happens here too. */
  refFreezeIfDue(D);
  var slug=partnerSlug(D); D.slug=slug;
  var path=ghPathFor(PARTNER_DIR+"/"+slug+".json");
  var existing=GH.files.filter(function(x){ return x.slug===slug; })[0];
  var isNew=!existing;
  ghSetStatus((isNew?"Creating ":"Updating ")+path+"…","");
  var msg=(isNew?"Add":"Update")+" partner: "+D.partner.legalName+
          " ("+(MODELS[D.modelKey]||MODELS.ADP).name+", "+territoryText(D)+") by "+ghWho()+" [builder v"+APP_VERSION+"]";
  return ghClaimRef(D.ref, slug, D.partner.legalName)
    .then(function(){
      ghSetStatus("Reference "+D.ref+" claimed. Writing "+path+"\u2026","");
      if(existing && existing.sha) return existing.sha;
      return ghGetFile(path).then(function(r){ return r.ok&&r.json?r.json.sha:null; });
    })
    .then(function(sha){
      return ghPutFile(path, JSON.stringify(partnerRecord(D),null,2)+"\n", msg, sha);
    })
    .then(function(r){
      if(!r.ok) throw new Error(ghErr(r,path));
      var newSha=r.json&&r.json.content?r.json.content.sha:null;
      if(existing) existing.sha=newSha;
      else GH.files.push({name:slug+".json",slug:slug,path:path,sha:newSha});
      GH.files.sort(function(a,b){ return a.slug<b.slug?-1:1; });
      GH.entries[slug]=registerEntry(D,slug);
      ghSetStatus("Saved. Rebuilding the register…","");
      return ghRebuildRegister();
    })
    .then(function(){
      ghStampSynced();
      ghSetStatus("Pushed "+D.partner.legalName+" to "+GH.owner+"/"+GH.repo+" and refreshed the register.","ok");
      toast("Saved to GitHub.");
    })
    .catch(function(e){ ghSetStatus(e.message||String(e),"err"); toast("GitHub save failed — see the repository panel.",true); })
    .then(function(){ GH.busy=false; refresh(); });
}
/* Read every partner file we do not already have cached, then write the index */
function ghRebuildRegister(){
  var needed=GH.files.filter(function(x){ return !GH.entries[x.slug]; });
  var chain=Promise.resolve();
  needed.forEach(function(fileRec){
    chain=chain.then(function(){
      return ghGetFile(fileRec.path).then(function(r){
        if(!r.ok||!r.json||!r.json.content) return;
        try{
          var obj=JSON.parse(b64ToStr(r.json.content));
          fileRec.sha=r.json.sha;
          GH.entries[fileRec.slug]=registerEntry(mergeIntoBlank(recordToData(obj)),fileRec.slug);
        }catch(e){}
      });
    });
  });
  return chain.then(function(){
    var entries=GH.files.map(function(x){ return GH.entries[x.slug]; })
                        .filter(function(x){ return !!x; });
    var reg={ schema:SCHEMA_REGISTER, generatedAt:new Date().toISOString(),
              generatedAtSAST:sastNow(),
              builder:{ name:APP_NAME, version:APP_VERSION, build:APP_BUILD },
              repository:GH.owner+"/"+GH.repo, count:entries.length, partners:entries };
    return ghWriteGenerated(ghPathFor("register.json"), JSON.stringify(reg,null,2)+"\n",
                            "Regenerate partner register ("+entries.length+" partner"+(entries.length===1?"":"s")+")")
      .then(function(){
        return ghWriteGenerated(ghPathFor("README.md"), registerMarkdown(entries),
                                "Regenerate partner register table");
      });
  });
}
function ghWriteGenerated(path,text,message){
  return ghGetFile(path).then(function(r){
    var sha=(r.ok&&r.json)?r.json.sha:null;
    return ghPutFile(path,text,message,sha).then(function(p){
      if(!p.ok) throw new Error(ghErr(p,path));
    });
  });
}

/* How much of a section is filled, counted from the fields it actually contains. */
function grpProgress(body){
  var paths=[], m, re=/data-p="([^"]+)"/g, seen={};
  while((m=re.exec(body))!==null){ if(!seen[m[1]]){ seen[m[1]]=1; paths.push(m[1]); } }
  var done=0;
  paths.forEach(function(p){
    var v=get(p);
    if(v===true) done++;
    else if(v!==null && v!==undefined && String(v).trim()!=="" && String(v)!=="0") done++;
  });
  return {total:paths.length, done:done};
}

function blocksToHtml(doc){
  var h='<div class="doc"><h1>'+esc(doc.title)+'</h1><div class="docmeta">'+esc(doc.subtitle||"")+
        '<div class="stamp">'+esc(doc.stamp||buildStamp())+'</div></div>';
  doc.blocks.forEach(function(bl){
    switch(bl.t){
      case "h1": break;
      case "h2": h+="<h2>"+esc(bl.x)+"</h2>"; break;
      case "h3": h+="<h3>"+esc(bl.x)+"</h3>"; break;
      case "p": h+="<p>"+esc(bl.x)+"</p>"; break;
      case "note": h+='<div class="note">'+esc(bl.x)+"</div>"; break;
      case "ul": h+="<ul>"+bl.items.map(function(i){return "<li>"+esc(i)+"</li>";}).join("")+"</ul>"; break;
      case "ol": h+="<ol>"+bl.items.map(function(i){return "<li>"+esc(i)+"</li>";}).join("")+"</ol>"; break;
      case "table":
        h+="<table>"+(bl.head&&bl.head.length?"<tr>"+bl.head.map(function(x){return "<th>"+esc(x)+"</th>";}).join("")+"</tr>":"");
        bl.rows.forEach(function(r){ h+="<tr>"+r.map(function(x){return "<td>"+esc(x)+"</td>";}).join("")+"</tr>"; });
        h+="</table>"; break;
      case "sig":
        h+='<h2>Signed by the parties</h2><div class="sig">'+
           '<div><strong>For '+esc(bl.a.party)+'</strong><div class="sigbox">Name: '+esc(fb(bl.a.name,"name"))+'<br>Capacity: '+esc(fb(bl.a.role,"capacity"))+'<br>Date: ______________</div></div>'+
           '<div><strong>For '+esc(bl.b.party)+'</strong><div class="sigbox">Name: '+esc(fb(bl.b.name,"name"))+'<br>Capacity: '+esc(fb(bl.b.role,"capacity"))+'<br>Date: ______________</div></div></div>';
        break;
    }
  });
  return h+"</div>";
}
function cellHtml(c,asTd){
  if(!c) return "<td></td>";
  var v=c.v, cls="";
  if(c.t==="f"){ v="= "+c.v; cls=' class="fx"'; }
  else if(c.t==="n"){
    if(v===null||v===""){ v=""; }
    else if(c.s===5){ v=(Number(v)*100).toFixed(1)+"%"; cls=' class="num"'; }
    else if(c.s===6){ v=new Date(Date.UTC(1899,11,30)+Number(v)*86400000).toISOString().slice(0,10); cls=' class="dt"'; }
    else { v=num(v, c.s===9?1:0); cls=' class="num"'; }
  }
  return "<td"+cls+">"+esc(v)+"</td>";
}
