<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business Processes (SIPOC) — Nedbank Marketing Pack</title>
<link rel="stylesheet" href="assets/pack.css">
<style>
  .proclayout{display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:start}
  @media(max-width:820px){.proclayout{grid-template-columns:1fr}}
  .plist{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:8px;position:sticky;top:104px}
  @media(max-width:820px){.plist{position:static}}
  .plist .grp{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;padding:8px 10px 4px}
  .plist a{display:flex;gap:8px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.86rem}
  .plist a:hover{background:#f4f7fc;text-decoration:none} .plist a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .plist a .pid{font-family:"SF Mono",monospace;font-size:.72rem;color:var(--accent);flex:none}
</style>
</head>
<body>
<div id="nav"></div>
<div id="breadcrumb"></div>

<div class="wrap">
  <div class="pagehead">
    <div class="eyebrow">How the bank delivers — SIPOC</div>
    <h1>Business Processes</h1>
    <p class="lede">Each high-level process as a <strong>SIPOC</strong> — Suppliers, Inputs, Process, Outputs, Customers — with its
    capabilities and participants. Suppliers and customers link back to the stakeholder catalogue.</p>
  </div>

  <div class="proclayout">
    <div class="plist" id="plist"></div>
    <div>
      <div class="stephead" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <h2 id="ptitle" style="border:0;margin:0;padding:0">—</h2>
        <a class="btn ghost" id="navlink" href="#">Open in Navigator ›</a>
      </div>
      <div id="sipoc"></div>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/pack.js"></script>
<script>
PACK.setWorkbooks([{label:"Process SIPOC pack .xlsx", href:""}]);
PACK.renderNav("business_process.html");
var D = PACK.data(), MAP = PACK.MAP;
var current = null;

function renderList(){
  var core = D.processes.filter(function(p){return !p.ext;}), ext = D.processes.filter(function(p){return p.ext;});
  function grp(title, arr){ return '<div class="grp">'+title+'</div>'+arr.map(function(p){
    return '<a class="'+(p.id===current?"on":"")+'" href="#'+p.id+'" onclick="sel(\''+p.id+'\')"><span class="pid">'+p.id+'</span>'+PACK.esc(p.name)+'</a>';
  }).join(""); }
  document.getElementById("plist").innerHTML = grp("Core (P1–P8)",core)+grp("Extension (PX1–PX8)",ext);
}
window.sel = function(id){
  current = id; renderList();
  var p = MAP.P[id];
  document.getElementById("ptitle").innerHTML = '<span class="mono" style="color:var(--c-proc)">'+id+'</span> '+PACK.esc(p.name);
  document.getElementById("navlink").href = PACK.navUrl("proc",{proc:id});
  PACK.renderSIPOC(document.getElementById("sipoc"), id);
  try{ history.replaceState(null,"","#"+id); }catch(e){}
  PACK.renderBreadcrumb("proc");
};

renderList();
var start = location.hash.replace(/^#/,"");
sel(MAP.P[start] ? start : "P1");
PACK.renderBreadcrumb("proc");
document.body.insertAdjacentHTML("beforeend", PACK.footer());
</script>
</body>
</html>
