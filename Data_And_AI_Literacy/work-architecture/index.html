<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="version" content="1.0.0">
<meta name="mw-asset" content="true">
<meta name="ontology-src" content="gh:modelwaresystems-dama/modelware_app_storage/Data_And_AI_Literacy/Ontology/database">
<meta name="tenant-src" content="gh:modelwaresystems-dama/modelware_app_storage/Data_And_AI_Literacy/Ontology/tenants/Modelware/work-architecture">
<title>Work &amp; Decision Architecture</title>
<style>
  :root{
    --bg:#f6f7f9;--panel:#fff;--panel2:#fbfcfd;--ink:#15181d;--muted:#5c6673;
    --line:#e3e7ec;--line2:#eef1f4;--accent:#2f5bd0;--accent-ink:#1b3a8f;--accent-bg:#eaf0fc;
    --chip:#eef1f6;--chip-ink:#3a4452;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(20,24,29,.06),0 2px 10px rgba(20,24,29,.05);--radius:12px;
    --warn:#b23b2e;--ok:#12946a;--gate:#b23b2e;
    --s1:#2f5bd0;--s2:#1f6f8b;--s3:#7c3aed;--s4:#b8742a;--s5:#0f7b5a;--s6:#9a3b8f;--s7:#12946a;
    --proc:#2f5bd0;--wu:#1f6f8b;--task:#7c3aed;--dec:#b8742a;--dem:#0f7b5a;--comp:#9a3b8f;--alloc:#12946a;
    --build:#0f7b5a;--buy:#2f5bd0;--borrow:#b8742a;--bot:#9a3b8f;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0f1216;--panel:#171b21;--panel2:#1b2027;--ink:#e9edf2;--muted:#9aa5b2;
    --line:#272d36;--line2:#20262e;--accent:#6f97ff;--accent-ink:#9db8ff;--accent-bg:#17223c;
    --chip:#232a33;--chip-ink:#c3ccd7;--shadow:0 1px 2px rgba(0,0,0,.4),0 2px 12px rgba(0,0,0,.35);
    --warn:#e0725f;--ok:#39c08c;--gate:#e0725f;
    --s1:#6f97ff;--s2:#5aa0cf;--s3:#b49bf0;--s4:#d9a56a;--s5:#43c494;--s6:#d58fc7;--s7:#39c08c;
    --proc:#6f97ff;--wu:#5aa0cf;--task:#b49bf0;--dec:#d9a56a;--dem:#43c494;--comp:#d58fc7;--alloc:#39c08c;
    --build:#43c494;--buy:#6f97ff;--borrow:#d9a56a;--bot:#d58fc7;
  }}
  :root[data-theme="dark"]{
    --bg:#0f1216;--panel:#171b21;--panel2:#1b2027;--ink:#e9edf2;--muted:#9aa5b2;
    --line:#272d36;--line2:#20262e;--accent:#6f97ff;--accent-ink:#9db8ff;--accent-bg:#17223c;
    --chip:#232a33;--chip-ink:#c3ccd7;--warn:#e0725f;--ok:#39c08c;--gate:#e0725f;
    --s1:#6f97ff;--s2:#5aa0cf;--s3:#b49bf0;--s4:#d9a56a;--s5:#43c494;--s6:#d58fc7;--s7:#39c08c;
    --proc:#6f97ff;--wu:#5aa0cf;--task:#b49bf0;--dec:#d9a56a;--dem:#43c494;--comp:#d58fc7;--alloc:#39c08c;
    --build:#43c494;--buy:#6f97ff;--borrow:#d9a56a;--bot:#d58fc7;
  }
  *{box-sizing:border-box}html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;position:sticky;top:0;z-index:30}
  .ttl{font-weight:800;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
  .badge{font:700 11px var(--mono);background:var(--accent-bg);color:var(--accent-ink);border-radius:6px;padding:2px 7px}
  .tnt{font:700 10px var(--mono);background:rgba(18,148,106,.12);color:var(--alloc);border-radius:6px;padding:2px 7px}
  .sub{font-size:12px;color:var(--muted)}
  .viewtog{display:flex;gap:3px;background:var(--chip);border-radius:10px;padding:3px;flex-wrap:wrap}
  .viewtog button{border:none;background:transparent;color:var(--chip-ink);font:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer}
  .viewtog button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
  .search{position:relative;margin-left:auto}
  .search input{border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;width:200px}
  .search input:focus{outline:none;border-color:var(--accent)}
  .results{position:absolute;top:110%;right:0;width:360px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:none;z-index:40}
  .results.show{display:block}
  .results .r{padding:8px 11px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:13px}
  .results .r:hover{background:var(--panel2)}
  .results .r .ty{font:600 10px var(--mono);color:var(--muted)}
  .intro{padding:12px 16px 2px;color:var(--muted);font-size:12.5px;max-width:1000px}
  /* spine map band */
  .loopwrap{padding:18px 16px 6px;overflow-x:auto}
  .loop{display:flex;align-items:stretch;gap:0;min-width:min-content}
  .stagecard{position:relative;flex:1 1 0;min-width:138px;background:var(--panel);border:1.5px solid var(--line);border-top:4px solid var(--sc,var(--accent));border-radius:12px;padding:11px 12px 12px;cursor:pointer;transition:transform .12s,box-shadow .12s;margin-right:22px}
  .stagecard:last-of-type{margin-right:0}
  .stagecard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
  .stagecard .no{position:absolute;top:-13px;left:12px;min-width:24px;height:24px;padding:0 5px;border-radius:999px;background:var(--sc,var(--accent));color:#fff;font:800 12px var(--mono);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
  .stagecard .snm{font-weight:800;font-size:12.5px;margin:2px 0 4px;letter-spacing:-.01em}
  .stagecard .scount{font:800 20px var(--mono);color:var(--sc,var(--accent))}
  .stagecard .scount small{font:600 11px -apple-system,sans-serif;color:var(--muted)}
  .stagecard .stypes{margin-top:6px;display:flex;flex-wrap:wrap;gap:3px}
  .stagecard .tt{font:600 10px var(--mono);background:var(--chip);color:var(--chip-ink);border-radius:5px;padding:1px 5px}
  .arrow{position:absolute;right:-22px;top:50%;width:22px;height:2px;background:var(--line);transform:translateY(-50%)}
  .arrow:after{content:"";position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left-color:var(--line)}
  .govbar{margin:12px 16px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 13px;border:1.5px solid var(--line);border-left:4px solid var(--gate);border-radius:10px;background:var(--panel)}
  .govbar .glbl{font-weight:800;font-size:12.5px}
  .govbar .gitem{font-size:12px;color:var(--muted)}
  .govbar .gitem b{color:var(--gate);font:800 13px var(--mono)}
  /* outline */
  .outline{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,440px);gap:0;align-items:start}
  .outcol{padding:8px 16px 60px;min-width:0}
  .outdet{position:sticky;top:var(--toph,56px);align-self:start;border-left:1px solid var(--line);background:var(--panel);max-height:calc(100vh - var(--toph,56px));overflow:auto}
  .outdetinner{padding:16px}
  @media(max-width:880px){.outline{grid-template-columns:1fr}.outdet{position:static;max-height:none;border-left:none;border-top:1px solid var(--line)}}
  .ph{margin:0 0 12px;padding:14px 0 6px;border-top:2px solid var(--sc,var(--line));scroll-margin-top:calc(var(--toph,56px) + 12px)}
  .ph:first-child{border-top:none}
  .phhd{display:flex;align-items:center;gap:10px;position:sticky;top:var(--toph,56px);background:var(--bg);padding:6px 0;z-index:2;cursor:pointer;border-radius:8px}
  .phhd:hover{background:var(--chip)}.phhd.sel{box-shadow:inset 0 0 0 2px var(--sc,var(--accent))}
  .phhd .n{min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--sc,var(--accent));color:#fff;font:800 11px var(--mono);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .phhd .nm{font-weight:800;font-size:15px;letter-spacing:-.01em;flex:1}
  .phhd .ct{font:800 12px var(--mono);color:var(--muted);background:var(--chip);border-radius:999px;padding:2px 10px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 2px 8px}
  .chip{font:600 11px var(--mono);border-radius:6px;padding:3px 8px;cursor:pointer;white-space:nowrap;border:1px solid transparent}
  .chip.gov{background:rgba(178,59,46,.1);color:var(--gate);border-color:rgba(178,59,46,.32)}
  .chip.proc{background:rgba(47,91,208,.1);color:var(--proc);border-color:rgba(47,91,208,.3)}
  .chip.role{background:var(--chip);color:var(--chip-ink)}
  .chip.auto{background:rgba(184,116,42,.12);color:var(--dec);border-color:rgba(184,116,42,.3)}
  .chip:hover{filter:brightness(.97);text-decoration:underline}
  .phdesc{font-size:12.5px;color:var(--muted);margin:0 2px 11px;line-height:1.5}
  .grp{margin-bottom:10px}
  .grphd{display:flex;align-items:center;gap:8px;font:800 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:8px 2px 7px}
  .grphd .gc{background:var(--chip);border-radius:999px;padding:1px 8px}
  .rec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;background:var(--panel);cursor:pointer;border-left:3px solid var(--lc,var(--line))}
  .rec:hover{border-color:var(--accent)}.rec.sel{box-shadow:0 0 0 2px var(--accent-bg);border-color:var(--accent)}
  .rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rl{font-weight:700;font-size:13.5px;flex:1;letter-spacing:-.01em;min-width:120px}
  .tag{font:600 10px var(--mono);border-radius:5px;padding:1px 6px;white-space:nowrap;background:var(--chip);color:var(--chip-ink)}
  .tag.proc{background:rgba(47,91,208,.12);color:var(--proc)}
  .tag.task{background:rgba(124,58,237,.12);color:var(--task)}
  .tag.dec{background:rgba(184,116,42,.12);color:var(--dec)}
  .tag.own{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .tag.raci{background:rgba(178,59,46,.12);color:var(--gate)}
  .tag.auto{background:rgba(184,116,42,.12);color:var(--dec)}
  .tag.build{background:rgba(15,123,90,.14);color:var(--build)}
  .tag.buy{background:rgba(47,91,208,.14);color:var(--buy)}
  .tag.borrow{background:rgba(184,116,42,.14);color:var(--borrow)}
  .tag.bot{background:rgba(154,59,143,.14);color:var(--bot)}
  .ra{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
  .srcrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .empty{color:var(--muted);font-size:13px;padding:14px;text-align:center}
  /* detail */
  .dhd{font-size:16px;font-weight:800;letter-spacing:-.01em;margin:2px 0 3px}
  .dmeta{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .ddef{font-size:13px;line-height:1.55;margin:0 0 14px;padding:10px 12px;background:var(--panel2);border-radius:9px;border:1px solid var(--line2)}
  .sec{font:800 10.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 7px}
  table.attr{width:100%;border-collapse:collapse;font-size:12.5px}
  table.attr td{padding:5px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
  table.attr td.k{color:var(--muted);width:42%;font-weight:600}
  table.attr td.v{color:var(--ink);font-weight:600}
  .lnk{display:flex;align-items:center;gap:7px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--panel)}
  .lnk:hover{border-color:var(--accent);background:var(--panel2)}
  .lnk .verb{font:700 10px var(--mono);color:var(--accent-ink);background:var(--accent-bg);border-radius:5px;padding:1px 6px;white-space:nowrap}
  .lnk .verb.in{color:var(--muted);background:var(--chip)}
  .lnk .lt{font-size:12.5px;font-weight:700;flex:1}
  .lnk .ls{font:600 9.5px var(--mono);color:var(--muted)}
  /* status */
  .status{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .status .box{max-width:620px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px 24px}
  .status h3{margin:0 0 4px;font-size:16px}.status p{margin:0 0 12px;color:var(--muted);font-size:13px}
  .diag{font:12px/1.55 var(--mono);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;max-height:300px;overflow:auto;white-space:pre-wrap;color:var(--ink)}
  .diag .ok{color:var(--ok)}.diag .bad{color:var(--warn)}.diag .warn{color:#b8742a}.diag .dim{color:var(--muted)}
  .verdict{margin-top:12px;font-size:13px;padding:11px 13px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
  .verdict.bad{border-color:var(--warn);color:var(--warn)}.verdict.ok{border-color:var(--ok);color:var(--ok)}
  #tokenBox{margin-top:12px}#tokenBox input{width:100%;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:9px 12px;font:inherit;font-size:13px}
  .statusBtns{display:flex;gap:8px;margin-top:12px}
  .statusBtns button{border:1.5px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:8px 15px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .statusBtns button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
</style>
</head>
<body>
  <div class="top">
    <div>
      <div class="ttl">Work &amp; Decision Architecture <span class="badge" id="ver">v1.0.0</span> <span class="tnt" id="tntBadge" style="display:none"></span></div>
      <div class="sub">How work is structured, decided and allocated across humans &amp; agents · live from the CA&amp;I ontology</div>
    </div>
    <div class="viewtog" id="viewtog">
      <button data-view="wu" class="on">By work unit</button>
      <button data-view="decision">By decision</button>
      <button data-view="meta">Metamodel</button>
    </div>
    <div class="search">
      <input id="q" type="text" placeholder="Search…" autocomplete="off">
      <div class="results" id="results"></div>
    </div>
  </div>
  <div class="loopwrap" id="loopwrap"><div class="loop" id="loop"></div></div>
  <div class="govbar" id="govbar"></div>
  <div id="app"></div>

  <div class="status" id="status"><div class="box">
    <h3 id="statusTitle">Loading…</h3>
    <p id="statusMsg">Connecting to the private repository…</p>
    <pre id="diagLog" class="diag" aria-live="polite"></pre>
    <p id="verdict" class="verdict" style="display:none"></p>
    <div id="tokenBox" style="display:none">
      <input id="tokenIn" type="password" placeholder="Paste your fine-grained PAT (Contents: Read)">
      <div class="statusBtns"><button id="tokenSave">Connect &amp; load</button></div>
    </div>
    <div class="statusBtns" id="diagBtns" style="display:none">
      <button id="retryBtn">Retry</button>
      <button id="copyBtn" class="ghost">Copy diagnostics</button>
      <button id="tokenToggle" class="ghost">Change token</button>
    </div>
  </div></div>

<script>
document.getElementById('ver').textContent='v'+document.querySelector('meta[name="version"]').content;
function syncTopVar(){ const t=document.querySelector('.top'); if(t)document.documentElement.style.setProperty('--toph',Math.round(t.getBoundingClientRect().height)+'px'); }
syncTopVar(); window.addEventListener('resize',syncTopVar);
if(window.ResizeObserver){ const ro=new ResizeObserver(syncTopVar); const tb=document.querySelector('.top'); if(tb)ro.observe(tb); }
const QS=new URLSearchParams(location.search);
const TOKEN_KEY=QS.get('tokenKey')||'mdaReadiness.ghpat';
const SRC=QS.get('data')||((document.querySelector('meta[name="ontology-src"]')||{}).content||'');
const TSRC=QS.get('tenant')||((document.querySelector('meta[name="tenant-src"]')||{}).content||'');
function getToken(){try{return localStorage.getItem(TOKEN_KEY)||'';}catch(e){return'';}}
function resolveSrc(base){ if(!base)return null; if(base.indexOf('gh:')===0){ var r=base.slice(3),ref='main',at=r.lastIndexOf('@');if(at>0){ref=r.slice(at+1);r=r.slice(0,at);}
    var a=r.split('/'),ow=a.shift(),rp=a.shift(),pa=a.join('/'); return {gh:true,owner:ow,repo:rp,ref:ref,path:pa}; }
  return {gh:false,base:base.replace(/\/$/,'')}; }
const SRCINFO=resolveSrc(SRC), TSRCINFO=resolveSrc(TSRC);
function urlFor(info,file){ if(info.gh){ return 'https://api.github.com/repos/'+info.owner+'/'+info.repo+'/contents/'+info.path+'/'+file+'?ref='+encodeURIComponent(info.ref); } return info.base+'/'+file; }
function ghHeaders(raw){ var tk=getToken(), h={'Accept':raw?'application/vnd.github.raw':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; if(tk)h['Authorization']='Bearer '+tk; return h; }
async function probe(url,opts){ var out={url:url,ok:false,status:0,threw:false,error:'',body:'',json:null};
  try{ var r=await fetch(url,opts); out.status=r.status; out.ok=r.ok; var txt=await r.text(); out.body=txt; try{out.json=JSON.parse(txt);}catch(e){} }
  catch(e){ out.threw=true; out.error=(e&&e.message)||String(e); } return out; }

// ---------- model ----------
const M={ent:new Map(),type:new Map(),rtype:new Map(),facet:new Map(),out:new Map(),inc:new Map()};
function buildModel(ds){
  (ds.entityTypes.items).forEach(t=>M.type.set(t.id,t));
  (ds.relationshipTypes.items).forEach(t=>M.rtype.set(t.id,t));
  ((ds.facets&&ds.facets.items)||[]).forEach(f=>M.facet.set(f.id,f));
  (ds.entities.items).forEach(e=>{M.ent.set(e.id,e);M.out.set(e.id,[]);M.inc.set(e.id,[]);});
  (ds.relationships.items).forEach(r=>{ if(M.out.has(r.sourceEntityId))M.out.get(r.sourceEntityId).push(r); if(M.inc.has(r.targetEntityId))M.inc.get(r.targetEntityId).push(r); });
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const WA_FACET='facet:work-architecture';
const hasFacet=(e,f)=>e&&Array.isArray(e.facetIds)&&e.facetIds.indexOf(f)>=0;
const MEMBER=()=>[...M.ent.values()].filter(e=>hasFacet(e,WA_FACET));
const isTenant=e=>e&&e.attributes&&e.attributes.tenant!=null;
const labelOf=id=>{const e=M.ent.get(id);return (e&&e.preferredLabel)||id;};
const typeLabel=tid=>{const t=M.type.get(tid);return t?t.label:(tid||'').replace(/^type:/,'');};
const rtypeLabel=rid=>{const t=M.rtype.get(rid);return (t&&t.label)||(rid||'').replace(/^rel:/,'').replace(/-/g,' ');};
const rtypeInverse=rid=>{const t=M.rtype.get(rid);return (t&&(t.inverseLabel||t.label))||(rid||'').replace(/^rel:/,'').replace(/-/g,' ');};
const outOf=(id,rel)=>(M.out.get(id)||[]).filter(r=>!rel||r.relationshipTypeId===rel);
const incOf=(id,rel)=>(M.inc.get(id)||[]).filter(r=>!rel||r.relationshipTypeId===rel);
const outEnt=(id,rel)=>outOf(id,rel).map(r=>M.ent.get(r.targetEntityId)).filter(Boolean);
const incEnt=(id,rel)=>incOf(id,rel).map(r=>M.ent.get(r.sourceEntityId)).filter(Boolean);
const ofType=t=>[...M.ent.values()].filter(e=>e.entityTypeId==='type:'+t);
const tenantOf=t=>ofType(t).filter(isTenant);
const byWda=(a,b)=>String((a.attributes||{}).wdaId||a.id).localeCompare(String((b.attributes||{}).wdaId||b.id),undefined,{numeric:true});

// the 7 spine stages
const STAGE=[
  ['business-process','Business Process','--proc'],
  ['work-unit','Work Unit','--wu'],
  ['work-task','Task','--task'],
  ['decision','Decision','--dec'],
  ['workforce-demand','Workforce Demand','--dem'],
  ['composition-scenario','Composition','--comp'],
  ['ha-allocation','Allocation','--alloc']
];

const S={view:'wu',rec:null,tenant:null};

// decision governance helpers (all take an entity)
const decInputs=d=>outEnt(d.id,'rel:needs-input');
const decControls=d=>outEnt(d.id,'rel:controlled-by');
const decEvidence=d=>outEnt(d.id,'rel:evidenced-by');
const decAuthority=d=>outOf(d.id,'rel:decided-by').map(r=>({role:M.ent.get(r.targetEntityId),q:r.qualifiers||{}})).filter(x=>x.role);
// work-unit helpers (all take an entity)
const wuProcess=wu=>outEnt(wu.id,'rel:realises').filter(e=>e.entityTypeId==='type:business-process')[0]||null;
const wuTasks=wu=>outEnt(wu.id,'rel:decomposes').sort(byWda);
const wuDecisions=wu=>{const set=new Map(); outEnt(wu.id,'rel:invokes').forEach(d=>set.set(d.id,d));
  wuTasks(wu).forEach(t=>outEnt(t.id,'rel:invokes').forEach(d=>set.set(d.id,d))); return [...set.values()].sort(byWda);};
const wuRole=wu=>incEnt(wu.id,'rel:accountable-for')[0]||null;
const wuDemand=wu=>incEnt(wu.id,'rel:demand-for')[0]||null;
const wuAllocs=wu=>incEnt(wu.id,'rel:allocates');
const taskOwner=t=>outEnt(t.id,'rel:owned-by')[0]||null;
const demandComps=dm=>incEnt(dm.id,'rel:sources-demand');
const allocRole=al=>outEnt(al.id,'rel:allocates-to')[0]||null;
const allocAutonomy=al=>outEnt(al.id,'rel:at-autonomy')[0]||null;
const allocComp=al=>outEnt(al.id,'rel:selects-composition')[0]||null;
const srcClass=opt=>{const s=((opt&&opt.attributes&&opt.attributes.sourceOption)||'').toLowerCase();return /build/.test(s)?'build':/buy/.test(s)?'buy':/borrow/.test(s)?'borrow':/bot/.test(s)?'bot':'';};

// ---------- cards ----------
function recCard(e,extra){
  const sel=e.id===S.rec; const lc=({'type:business-process':'--proc','type:work-unit':'--wu','type:work-task':'--task','type:decision':'--dec','type:workforce-demand':'--dem','type:composition-scenario':'--comp','type:ha-allocation':'--alloc'})[e.entityTypeId]||'--line';
  return '<div class="rec'+(sel?' sel':'')+'" style="--lc:var('+lc+')" data-rec="'+esc(e.id)+'">'+
    '<div class="rh"><span class="rl">'+esc(e.preferredLabel)+'</span>'+(extra||'')+'</div>'+
    (e.definition?'<div class="ra">'+esc(e.definition)+'</div>':'')+'</div>';
}
function taskCard(t){
  const own=taskOwner(t); const nd=outEnt(t.id,'rel:invokes').length;
  const x=(own?'<span class="tag own">'+esc(own.preferredLabel)+'</span>':'')+(nd?'<span class="tag dec">'+nd+' decision'+(nd===1?'':'s')+'</span>':'');
  return recCard(t,x);
}
function decCard(d){
  const au=decAuthority(d); const a=au.find(x=>/^A/i.test(x.q.raci||''))||au[0];
  const ctl=decControls(d).length, ev=decEvidence(d).length;
  const logic=(d.attributes||{}).decisionLogicType||(d.attributes||{}).decisionType;
  const x=(logic?'<span class="tag">'+esc(logic)+'</span>':'')+
    (a?'<span class="tag raci">'+esc((a.q.raci?a.q.raci+' · ':'')+a.role.preferredLabel)+'</span>':'')+
    (ctl?'<span class="tag">'+ctl+' control'+(ctl===1?'':'s')+'</span>':'')+
    (ev?'<span class="tag">'+ev+' evidence</span>':'');
  return recCard(d,x);
}

// ---------- By work unit ----------
function wuSection(wu){
  const proc=wuProcess(wu), role=wuRole(wu), tasks=wuTasks(wu), decs=wuDecisions(wu);
  const dm=wuDemand(wu), allocs=wuAllocs(wu);
  let chips='';
  if(proc) chips+='<span class="chip proc" data-rec="'+esc(proc.id)+'" title="Realises business process">▸ '+esc(proc.preferredLabel)+'</span>';
  if(role) chips+='<span class="chip role" data-rec="'+esc(role.id)+'" title="Accountable role">◆ '+esc(role.preferredLabel)+'</span>';
  const auto=allocs.map(allocAutonomy).filter(Boolean)[0];
  if(auto) chips+='<span class="chip auto" data-rec="'+esc(auto.id)+'" title="Autonomy ceiling">⚙ '+esc(auto.preferredLabel)+'</span>';
  let body='';
  if(tasks.length) body+='<div class="grp"><div class="grphd"><span>Tasks</span><span class="gc">'+tasks.length+'</span></div>'+tasks.map(taskCard).join('')+'</div>';
  if(decs.length) body+='<div class="grp"><div class="grphd"><span>Decisions</span><span class="gc">'+decs.length+'</span></div>'+decs.map(decCard).join('')+'</div>';
  // sourcing & allocation
  let src='';
  if(dm){ const comps=demandComps(dm);
    src+='<div class="grp"><div class="grphd"><span>Sourcing &amp; allocation</span><span class="gc">'+(comps.length+allocs.length)+'</span></div>';
    src+=recCard(dm,'<span class="tag">demand</span>');
    if(comps.length){ const order={build:0,buy:1,borrow:2,bot:3};
      const row=comps.sort((a,b)=>(order[srcClass(a)]??9)-(order[srcClass(b)]??9)).map(c=>{const cl=srcClass(c)||'';const nm=(c.attributes||{}).sourceOption||c.preferredLabel;
        return '<span class="tag '+cl+'" data-rec="'+esc(c.id)+'" style="cursor:pointer">'+esc(nm)+'</span>';}).join('');
      src+='<div class="srcrow">'+row+'</div>'; }
    allocs.forEach(al=>{const r=allocRole(al),au=allocAutonomy(al),cp=allocComp(al);const a=al.attributes||{};
      const x=(a.performerType?'<span class="tag">'+esc(a.performerType)+'</span>':'')+(cp?'<span class="tag '+(srcClass(cp)||'')+'">'+esc((cp.attributes||{}).sourceOption||cp.preferredLabel)+'</span>':'')+(r?'<span class="tag own">'+esc(r.preferredLabel)+'</span>':'')+(au?'<span class="tag auto">'+esc(au.preferredLabel)+'</span>':'');
      src+=recCard(al,x);});
    src+='</div>';
  } else if(allocs.length){ src='<div class="grp"><div class="grphd"><span>Allocation</span><span class="gc">'+allocs.length+'</span></div>'+allocs.map(al=>recCard(al,'')).join('')+'</div>'; }
  body+=src;
  const a=wu.attributes||{};
  return '<div class="ph" id="ph-'+esc(wu.id)+'" style="--sc:var(--wu)">'+
    '<div class="phhd'+(wu.id===S.rec?' sel':'')+'" data-rec="'+esc(wu.id)+'" title="Open this work unit"><span class="n">WU</span><span class="nm">'+esc(wu.preferredLabel)+'</span><span class="ct">'+(tasks.length+decs.length)+'</span></div>'+
    (chips?'<div class="chips">'+chips+'</div>':'')+
    (wu.definition?'<div class="phdesc">'+esc(wu.definition)+'</div>':'')+body+'</div>';
}

}

// ---------- detail ----------
function renderDetail(id){
  if(!id) return '<div class="empty">Select anything — a work unit, task, decision, demand, composition option or allocation — to see its detail and how it connects.</div>';
  const e=M.ent.get(id); if(!e) return '<div class="empty">Not found.</div>';
  const a=e.attributes||{};
  let h='<div class="dhd">'+esc(e.preferredLabel)+'</div>';
  h+='<div class="dmeta">'+esc(typeLabel(e.entityTypeId))+(isTenant(e)?' · <b>Modelware example</b>':' · metamodel')+'</div>';
  if(e.definition) h+='<div class="ddef">'+esc(e.definition)+'</div>';
  const HIDE={tenant:1,layer:1,wdaId:1}; const keys=Object.keys(a).filter(k=>!HIDE[k]&&String(a[k]).trim()!=='');
  if(keys.length){ h+='<div class="sec">Attributes</div><table class="attr">'+keys.map(k=>'<tr><td class="k">'+esc(humanKey(k))+'</td><td class="v">'+esc(String(a[k]))+'</td></tr>').join('')+'</table>'; }
  const links=[];
  outOf(id).forEach(r=>{ if(M.ent.get(r.targetEntityId)) links.push({dir:'out',verb:rtypeLabel(r.relationshipTypeId),to:r.targetEntityId,q:r.qualifiers}); });
  incOf(id).forEach(r=>{ if(M.ent.get(r.sourceEntityId)) links.push({dir:'in',verb:rtypeInverse(r.relationshipTypeId),to:r.sourceEntityId,q:r.qualifiers}); });
  if(links.length){ h+='<div class="sec">Connections</div>'+links.map(l=>{const te=M.ent.get(l.to);const ql=l.q?(' '+Object.values(l.q).filter(Boolean).join(' · ')):'';
    return '<div class="lnk" data-rec="'+esc(l.to)+'"><span class="verb'+(l.dir==='in'?' in':'')+'">'+(l.dir==='in'?'← ':'→ ')+esc(l.verb)+'</span><span class="lt">'+esc(te.preferredLabel)+esc(ql)+'</span><span class="ls">'+esc(typeLabel(te.entityTypeId))+'</span></div>';
  }).join(''); }
  return h;
}
function humanKey(k){return k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()).replace(/\bId\b/,'ID').replace(/Raci/i,'RACI');}

// ---------- boot / connection diagnostics ----------
(function(){
  const st=document.getElementById('status'), msg=document.getElementById('statusMsg'),
        title=document.getElementById('statusTitle'), diag=document.getElementById('diagLog'),
        verdict=document.getElementById('verdict'), tokenBox=document.getElementById('tokenBox'),
        diagBtns=document.getElementById('diagBtns');
  const esc2=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  function log(html){ diag.innerHTML += html+'\n'; diag.scrollTop=diag.scrollHeight; }
  function line(label,cls,detail){ log('<span class="'+(cls||'dim')+'">'+esc2(label)+'</span>'+(detail?'  <span class="dim">'+esc2(detail)+'</span>':'')); }
  function setVerdict(text,cls){ verdict.textContent=text; verdict.className='verdict '+(cls||''); verdict.style.display='block'; }
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function fetchData(info,f){ let p; for(let at=0;at<3;at++){ p=await probe(urlFor(info,f),{headers:info.gh?ghHeaders(true):undefined,cache:'no-store'});
      if(!p.threw&&p.ok&&p.json!=null)return p; if(p.threw||p.status>=500||p.status===0){ if(at<2){ line('   … '+f+' — '+(p.threw?('network: '+p.error):('HTTP '+p.status))+', retrying ('+(at+1)+'/2)','warn'); await sleep(500*(at+1)); continue; } } break; } return p; }
  async function go(){
    diag.innerHTML=''; verdict.style.display='none'; tokenBox.style.display='none'; diagBtns.style.display='none';
    title.textContent='Connecting…'; msg.textContent='Running connection diagnostics against GitHub.';
    const tk=getToken();
    if(!SRCINFO.gh){ line('Source  : '+SRCINFO.base+' (plain URL, no token)','dim'); }
    else{ line('Scheme  : gh:  (GitHub Contents API)','dim'); line('Repo    : '+SRCINFO.owner+'/'+SRCINFO.repo+' @ '+SRCINFO.ref,'dim'); line('Path    : '+SRCINFO.path,'dim');
      line('Token   : '+(tk?('present ('+tk.length+' chars)'):'(none stored)'), tk?'ok':'warn'); }
    log('');
    if(SRCINFO.gh){
      line('① Reach api.github.com …','dim','GET /zen');
      const net=await probe('https://api.github.com/zen',{cache:'no-store'});
      if(net.threw){ line('   ✗ network error — '+net.error,'bad'); setVerdict('Cannot reach api.github.com — a blocker, firewall or proxy is in the way.','bad'); return finish(false); }
      line('   ✓ reachable — HTTP '+net.status,'ok');
      line('② Repo visibility …','dim','GET /repos/'+SRCINFO.owner+'/'+SRCINFO.repo);
      const repo=await probe('https://api.github.com/repos/'+SRCINFO.owner+'/'+SRCINFO.repo,{headers:ghHeaders(false),cache:'no-store'});
      if(repo.status===401){ line('   ✗ HTTP 401 — token rejected','bad'); setVerdict('GitHub rejected the token (401). Paste a current fine-grained PAT with Contents: Read on '+SRCINFO.owner+'/'+SRCINFO.repo+'.','bad'); return finish(false,true); }
      if(repo.status===404){ line('   ✗ HTTP 404 — repo not visible','bad'); setVerdict('The repo is not visible (404). The PAT needs Contents: Read on this repo.','bad'); return finish(false,true); }
      if(!repo.ok){ line('   ✗ HTTP '+repo.status,'bad'); setVerdict('Unexpected response checking the repo: HTTP '+repo.status+'.','bad'); return finish(false,true); }
      line('   ✓ repo visible — HTTP '+repo.status,'ok');
    }
    log(''); line((SRCINFO.gh?'③':'①')+' Fetch ontology …','dim');
    const ONTO=['index.json','entity-types.json','relationship-types.json','facets.json','entities.json','relationships.json'];
    const CRITICAL={'entity-types.json':1,'relationship-types.json':1,'entities.json':1,'relationships.json':1};
    const data={}; let failed=null;
    for(const f of ONTO){ const p=await fetchData(SRCINFO,f);
      const why=p.threw?('network error: '+p.error):(!p.ok?('HTTP '+p.status):(p.json==null?'not valid JSON':null));
      if(why){ if(CRITICAL[f]){ line('   ✗ '+f+' — '+why,'bad'); failed=failed||(f+': '+why); } else { line('   ⚠ '+f+' — '+why+' · skipped','warn'); } continue; }
      const n=(p.json.count!=null?p.json.count:(Array.isArray(p.json.items)?p.json.items.length:'?'));
      line('   ✓ '+f+' — HTTP '+p.status+'  ('+n+' items)','ok'); data[f]=p.json; }
    if(failed){ setVerdict('A core ontology dataset failed to load — '+failed+'.','bad'); return finish(false); }
    // tenant overlay (non-critical)
    let tEnt=[], tRel=[], tName=null;
    if(TSRCINFO){ log(''); line((SRCINFO.gh?'④':'②')+' Fetch Modelware tenant overlay …','dim');
      const idxP=await fetchData(TSRCINFO,'index.json');
      if(idxP&&idxP.ok&&idxP.json){ tName=idxP.json.label||idxP.json.tenant||null; }
      const te=await fetchData(TSRCINFO,'entities.json'); const tr=await fetchData(TSRCINFO,'relationships.json');
      if(te&&te.ok&&te.json&&Array.isArray(te.json.items)&&tr&&tr.ok&&tr.json&&Array.isArray(tr.json.items)){
        tEnt=te.json.items; tRel=tr.json.items;
        line('   ✓ tenant '+(tName||'Modelware')+' — '+tEnt.length+' entities, '+tRel.length+' relationships','ok');
      } else { line('   ⚠ tenant overlay not loaded — metamodel only','warn'); }
    }
    try{
      const ents={items:(data['entities.json'].items||[]).concat(tEnt)};
      const rels={items:(data['relationships.json'].items||[]).concat(tRel)};
      buildModel({ entityTypes:data['entity-types.json'], relationshipTypes:data['relationship-types.json'], facets:data['facets.json'], entities:ents, relationships:rels});
      const idx=data['index.json']||{}; const mem=MEMBER().length; const tt=tenantOf('work-unit').length;
      line('',''); line('✓ Loaded ontology v'+(idx.version||'?')+'  —  '+mem+' work-architecture records'+(tEnt.length?(' · '+tEnt.length+' tenant instances'):''),'ok');
      if(!M.ent.get('e:wa:workunit')){ setVerdict('Ontology loaded, but the Work & Decision Architecture metamodel is missing (e:wa:workunit not found). Deploy ontology v0.20.0 or later.','bad'); return finish(false); }
      if(tName){ const tb=document.getElementById('tntBadge'); tb.textContent=tName; tb.style.display=''; S.tenant=tName; }
      if(!tt){ S.view='meta'; [...document.querySelectorAll('#viewtog button')].forEach(x=>x.classList.toggle('on',x.dataset.view==='meta')); }
      setVerdict('Connected. Rendering…','ok');
      setTimeout(()=>{ st.style.display='none'; renderAll(); },200);
    }catch(e){ line('   ✗ build error: '+((e&&e.message)||e),'bad'); setVerdict('Data loaded but failed to build the model: '+((e&&e.message)||e),'bad'); return finish(false); }
  }
  function finish(okFlag,showToken){ title.textContent=okFlag?'Connected':'Not connected'; msg.innerHTML=okFlag?'':'The viewer could not load. The trace above shows where it stopped.'; diagBtns.style.display='flex'; if(showToken) tokenBox.style.display='block'; }
  document.getElementById('tokenSave').addEventListener('click',()=>{const t=document.getElementById('tokenIn').value.trim();if(t){try{localStorage.setItem(TOKEN_KEY,t);}catch(e){}}go();});
  document.getElementById('retryBtn').addEventListener('click',go);
  document.getElementById('tokenToggle').addEventListener('click',()=>{ tokenBox.style.display = tokenBox.style.display==='none'?'block':'none'; });
  document.getElementById('copyBtn').addEventListener('click',()=>{ const t=diag.textContent+'\n'+(verdict.style.display!=='none'?('VERDICT: '+verdict.textContent):''); try{navigator.clipboard.writeText(t);document.getElementById('copyBtn').textContent='Copied';setTimeout(()=>document.getElementById('copyBtn').textContent='Copy diagnostics',1200);}catch(e){} });
  go();
})();
</script>
</body>
</html>
