<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="version" content="1.0.2">
<meta name="updated" content="2026-10-28 06:18 SAST">
<title>Business Glossary Viewer</title>
<style>
  :root{
    --bg:#f6f4ef;--surface:#fffdf9;--surface-2:#efece4;--line:#ddd7cb;
    --fg:#211f1b;--fg-soft:#5a564d;--fg-faint:#8a847a;--accent:#1f6f6b;--accent-soft:#dff0ec;
    --dom:#4a5a7a;--dom-soft:#dde2ec;--syn:#9a4f1b;--syn-soft:#f0e0d1;--warn:#9a6a1b;--warn-soft:#f0e5cf;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--disp:"Fraunces",Georgia,serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#16151a;--surface:#1f1e24;--surface-2:#27262d;--line:#36343d;--fg:#eceaf2;--fg-soft:#b4b0bd;--fg-faint:#827e8c;--accent:#58b8b0;--accent-soft:#15302e;
    --dom:#9fb2d8;--dom-soft:#20273a;--syn:#d79156;--syn-soft:#3a2a1b;--warn:#d6a24e;--warn-soft:#352b17;color-scheme:dark;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;font-size:15px}
  .wrap{max-width:1000px;margin:0 auto;padding:0 18px}
  h1,h2,h3{font-family:var(--disp);font-weight:560;line-height:1.15;margin:0}
  code{font-family:var(--mono);font-size:.84em;background:var(--surface-2);padding:.08em .4em;border-radius:4px}
  a{color:var(--accent)}
  header{padding:28px 0 16px;border-bottom:1px solid var(--line)}
  header .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  header h1{font-size:clamp(1.5rem,4vw,2.1rem)}
  header .files{font-family:var(--mono);font-size:.78rem;color:var(--fg-faint);margin-top:6px}
  header .ver{font-family:var(--mono);font-size:.72rem;color:var(--fg-faint);margin-top:4px}
  .tiles{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:18px 0}
  .tiles .t{background:var(--surface);padding:11px 16px;flex:1;min-width:92px}
  .tiles .t .n{font-family:var(--disp);font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1}
  .tiles .t .l{font-size:.72rem;color:var(--fg-soft);margin-top:2px}
  nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:4px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
  nav button{font:inherit;font-size:.86rem;background:transparent;border:1px solid transparent;color:var(--fg-soft);padding:7px 13px;border-radius:8px;cursor:pointer}
  nav button:hover{background:var(--surface-2)}
  nav button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);font-weight:600}
  main{padding:22px 0 80px}
  .panel{display:none}.panel.on{display:block}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 14px}
  .card h3{font-size:1.05rem}
  .muted{color:var(--fg-soft)}.small{font-size:.84rem}
  table{border-collapse:collapse;width:100%;font-size:.86rem}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-faint);font-weight:600}
  td.n,th.n{font-variant-numeric:tabular-nums}
  pre{font-family:var(--mono);font-size:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;max-height:70vh}
  .banner{border-radius:10px;padding:12px 15px;margin:0 0 14px;font-size:.88rem;background:var(--warn-soft);color:var(--warn)}
  .pill{display:inline-block;font-family:var(--mono);font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
  .pill.dom{background:var(--dom-soft);color:var(--dom)}.pill.syn{background:var(--syn-soft);color:var(--syn)}.pill.st{background:var(--accent-soft);color:var(--accent)}
  .bar{display:flex;align-items:center;gap:9px;margin:2px 0}
  .bar .lab{min-width:160px;font-size:.82rem}
  .bar .track{flex:1;height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent)}
  .bar .v{font-family:var(--mono);font-size:.76rem;color:var(--fg-faint);min-width:28px;text-align:right}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
  .toolbar input[type=search],.toolbar select{font:inherit;font-size:.84rem;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
  .toolbar input[type=search]{min-width:220px}
  .toolbar label{font-size:.78rem;color:var(--fg-soft);display:flex;align-items:center;gap:6px}
  .toolbar .sp{margin-left:auto;font-family:var(--mono);font-size:.76rem;color:var(--fg-faint)}
  .term{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;margin:0 0 10px}
  .term .th{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .term .tt{font-family:var(--disp);font-size:1.2rem}
  .term .acr{font-family:var(--mono);font-size:.78rem;color:var(--fg-faint)}
  .term .def{margin:6px 0 8px}
  .rels{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .rels .lbl{font-size:.72rem;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.04em}
  .tlink{font-family:var(--body);font-size:.82rem;color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,transparent);cursor:pointer}
  .tlink:hover{border-bottom-color:var(--accent)}
  .xlaunch{font-family:var(--mono);font-size:.68rem;color:var(--accent);text-decoration:none;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:999px;padding:1px 8px;margin-left:5px}
  .xlaunch:hover{background:var(--accent-soft)}
  .meta{font-size:.78rem;color:var(--fg-soft);margin-top:7px;display:flex;gap:12px;flex-wrap:wrap}
  .empty{color:var(--fg-faint);font-style:italic;padding:8px 0}
  .flash{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="eyebrow" id="kind">business glossary</div>
  <h1 id="title">Business Glossary Viewer</h1>
  <div class="files" id="files"></div>
  <div class="ver" id="ver"></div>
</div></header>
<div class="wrap">
  <div class="tiles" id="tiles"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
const DATA = /*__DATA__*/null;
function __run__(DATA){
const $=(s,r=document)=>r.querySelector(s);
function el(t,a,...kids){const n=document.createElement(t);for(const k in (a||{})){if(k==="class")n.className=a[k];else if(k==="html")n.innerHTML=a[k];else if(k.startsWith("on"))n.addEventListener(k.slice(2),a[k]);else if(a[k]!=null)n.setAttribute(k,a[k]);}for(const c of kids){if(c==null)continue;n.append(c.nodeType?c:document.createTextNode(c));}return n;}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const D=DATA||{counts:{},terms:[],domains:[],statuses:[],warnings:[]};
const T=D.terms||[], byId={}; T.forEach(t=>byId[t.id]=t);
const LINKS=D.links||{};
const slug=s=>String(s==null?"":s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const ANCH={catalog:"dataset",lineage:"node",dictionary:"dataset"};
const lab=id=>(byId[id]||{}).term||id;

$("#title").textContent=D.title||"Business Glossary Viewer";
$("#kind").textContent="business glossary · "+(D.sourceKind||"generic");
$("#files").textContent=(D.inputs||[]).length?("from "+(D.inputs||[]).join("  ·  ")):"";
const VER=((document.querySelector('meta[name="version"]')||{}).content)||"";
const UPD=((document.querySelector('meta[name="updated"]')||{}).content)||"";
$("#ver").textContent=(VER?("v"+VER):"")+(UPD?((VER?"  ·  ":"")+"built "+UPD):"");

const C=D.counts||{};
[["terms","Terms"],["domains","Domains"],["relationships","Relationships"],["synonyms","Synonyms"]]
 .filter(([k])=>k==="terms"||(C[k]||0)>0).forEach(([k,l])=>$("#tiles").append(el("div",{class:"t"},el("div",{class:"n"},String(C[k]||0)),el("div",{class:"l"},l))));

const panels=[];
function addPanel(id,label,build){panels.push({id,label,build});}
function termLink(id){const a=el("a",{class:"tlink"},lab(id));a.addEventListener("click",ev=>{ev.preventDefault();gotoTerm(id);});return a;}
function relRow(label,ids){if(!ids||!ids.length)return null;const r=el("div",{class:"rels"},el("span",{class:"lbl"},label));ids.forEach((id,i)=>{if(byId[id]){if(i)r.append(" ");r.append(termLink(id));}});return r.childNodes.length>1?r:null;}

function termCard(t){
  const c=el("div",{class:"term",id:"term-"+slug(t.term)});
  const th=el("div",{class:"th"},el("span",{class:"tt"},t.term));
  if(t.acronym) th.append(el("span",{class:"acr"},t.acronym));
  if(t.domain) th.append(el("span",{class:"pill dom"},t.domain));
  if(t.status) th.append(el("span",{class:"pill st"},t.status));
  // dataset launch links
  if(t.dataset){const sl=slug(t.dataset);["catalog","lineage","dictionary"].forEach(k=>{if(LINKS[k])th.append(el("a",{class:"xlaunch",target:"_blank",rel:"noopener",href:LINKS[k]+"#"+ANCH[k]+"="+sl,title:t.dataset+" in "+k},k));});}
  c.append(th);
  if(t.definition) c.append(el("div",{class:"def"},t.definition));
  if((t.synonyms||[]).length){const r=el("div",{class:"rels"},el("span",{class:"lbl"},"also known as"));t.synonyms.forEach(s=>r.append(el("span",{class:"pill syn"},s)));c.append(r);}
  const rb=relRow("broader",t.broader); if(rb)c.append(rb);
  const rn=relRow("narrower",t.narrower); if(rn)c.append(rn);
  const rr=relRow("related",t.related); if(rr)c.append(rr);
  const meta=[]; if(t.steward)meta.push("steward: "+t.steward); if(t.source)meta.push("source: "+t.source); if(t.dataset)meta.push("applies to: "+t.dataset);
  if(meta.length)c.append(el("div",{class:"meta"},...meta.map(m=>el("span",{},m))));
  return c;
}

// ---------- Terms
addPanel("terms","Terms",p=>{
  const doms=[...new Set(T.map(t=>t.domain).filter(Boolean))].sort();
  const sts=[...new Set(T.map(t=>t.status).filter(Boolean))].sort();
  const selD=el("select",{},el("option",{value:""},"all domains"),...doms.map(x=>el("option",{value:x},x)));
  const selS=el("select",{},el("option",{value:""},"all statuses"),...sts.map(x=>el("option",{value:x},x)));
  const search=el("input",{type:"search",placeholder:"search term / definition / synonym…"});const info=el("div",{class:"sp"});
  p.append(el("div",{class:"toolbar"},(doms.length?el("label",{},"domain",selD):null),(sts.length?el("label",{},"status",selS):null),search,info));
  const holder=el("div",{});
  function render(){const q=search.value.toLowerCase(),fd=selD.value,fs=selS.value;
    const fr=T.filter(t=>(!fd||t.domain===fd)&&(!fs||t.status===fs)&&(!q||(t.term+" "+t.definition+" "+(t.synonyms||[]).join(" ")).toLowerCase().includes(q)));
    holder.innerHTML=""; fr.forEach(t=>holder.append(termCard(t)));
    if(!fr.length)holder.append(el("div",{class:"empty"},"No terms match."));
    info.textContent=fr.length+" of "+T.length+" terms";}
  [selD,selS].forEach(s=>s.addEventListener("change",render)); search.addEventListener("input",render);
  p.append(holder); render();
  p._focusTerm=sl=>{search.value="";selD.value="";selS.value="";render();const c=holder.querySelector("#term-"+CSSescape(sl));if(c){c.scrollIntoView({behavior:"smooth",block:"center"});c.classList.add("flash");setTimeout(()=>c.classList.remove("flash"),1600);}};
});
function CSSescape(s){return (window.CSS&&CSS.escape)?CSS.escape(s):String(s).replace(/[^a-zA-Z0-9_-]/g,"\\$&");}

// ---------- Overview
addPanel("overview","Overview",p=>{
  if((D.warnings||[]).length) p.append(el("div",{class:"banner"},el("b",{},"Check: "),D.warnings.join("  ")));
  const barBlock=(title,rows)=>{const c=el("div",{class:"card"},el("h3",{},title));if(!rows.length){c.append(el("div",{class:"empty"},"none"));return c;}
    const max=Math.max(...rows.map(r=>r.count),1);
    rows.slice(0,16).forEach(r=>c.append(el("div",{class:"bar"},el("div",{class:"lab"},r.name),el("div",{class:"track"},el("div",{class:"fill",style:`width:${Math.round(100*r.count/max)}%`})),el("div",{class:"v"},String(r.count)))));
    return c;};
  if((D.domains||[]).length) p.append(barBlock("Terms by domain",D.domains));
  if((D.statuses||[]).length) p.append(barBlock("Terms by status",D.statuses));
  if(!(D.domains||[]).length&&!(D.statuses||[]).length) p.append(el("div",{class:"small muted"},"Flat glossary — see the Terms tab."));
});

// ---------- Domains
if((D.domains||[]).length) addPanel("domains","By domain",p=>{
  D.domains.forEach(d=>{const ff=T.filter(t=>t.domain===d.name);
    const c=el("div",{class:"card"},el("h3",{},d.name+"  "),el("span",{class:"small muted"},d.count+" term(s)"));
    const ul=el("div",{style:"margin-top:8px"});
    ff.forEach(t=>ul.append(el("div",{style:"margin:3px 0"},termLink(t.id),t.definition?el("span",{class:"small muted"}," — "+t.definition.slice(0,120)):null)));
    c.append(ul); p.append(c);});
});

// ---------- Raw
addPanel("raw","Glossary JSON",p=>{p.append(el("pre",{},JSON.stringify(D,null,2)));});

const nav=$("#nav"),main=$("#main");
panels.forEach((pn,i)=>{const b=el("button",{role:"tab","aria-selected":i===0?"true":"false",onclick:()=>select(i)},pn.label);pn._btn=b;nav.append(b);const d=el("div",{class:"panel"+(i===0?" on":""),id:"panel-"+pn.id});pn._div=d;main.append(d);pn._built=false;});
function select(i){panels.forEach((pn,j)=>{pn._btn.setAttribute("aria-selected",j===i?"true":"false");pn._div.classList.toggle("on",j===i);});const pn=panels[i];if(!pn._built){pn.build(pn._div);pn._built=true;}}
select(0);
function gotoTerm(id){const t=byId[id];if(!t)return;const i=panels.findIndex(p=>p.id==="terms");select(i);const pn=panels[i];setTimeout(()=>pn._div._focusTerm&&pn._div._focusTerm(slug(t.term)),40);}
function fromHash(){const m=/(?:^|&)term=([^&]+)/.exec((location.hash||"").replace(/^#/,""));if(!m)return;const sl=decodeURIComponent(m[1]);const hit=T.find(t=>slug(t.term)===sl)||byId[sl];if(hit)gotoTerm(hit.id);}
window.addEventListener("hashchange",fromHash); fromHash();
} /* __run__ */
(function(){
var TRACE=[],t0=Date.now();
function log(){var a=[].slice.call(arguments).map(String);TRACE.push('['+(Date.now()-t0)+'ms] '+a.join(' '));try{console.log.apply(console,['[5W1H loader]'].concat(a));}catch(e){}refresh();}
function tkey(){try{return (new URLSearchParams(location.search).get('tokenKey'))||'mdaReadiness.ghpat';}catch(e){return 'mdaReadiness.ghpat';}}
function tok(){try{return localStorage.getItem(tkey())||'';}catch(e){return '';}}
function tokInfo(tk){if(!tk)return 'ABSENT (no token in this browser at '+location.origin+')';var kind=tk.indexOf('github_pat_')===0?'fine-grained (github_pat_)':(tk.indexOf('ghp_')===0?'classic (ghp_)':'unknown prefix');return 'present · '+kind+' · length '+tk.length;}
function panel(){var d=document.getElementById('__diag');if(!d){d=document.createElement('details');d.id='__diag';d.style.cssText='margin:10px 20px;max-width:980px;border:1px solid #d8d3c8;border-radius:8px;background:#f3f1ec;padding:6px 10px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#4a4a44';var s=document.createElement('summary');s.textContent='Loader diagnostics';s.style.cssText='cursor:pointer;font-weight:700;color:#1f6f6b';d.appendChild(s);var pre=document.createElement('pre');pre.id='__diagpre';pre.style.cssText='white-space:pre-wrap;word-break:break-all;margin:8px 0 2px';d.appendChild(pre);var h=document.querySelector('header');if(h&&h.parentNode)h.parentNode.insertBefore(d,h.nextSibling);else document.body.insertBefore(d,document.body.firstChild);}return d;}
function refresh(){var pre=document.getElementById('__diagpre');if(pre)pre.textContent=TRACE.join('\n');}
function banner(html){var b=document.getElementById('__loaderr');if(!b){b=document.createElement('div');b.id='__loaderr';b.style.cssText='margin:14px 20px;padding:12px 15px;border:1px solid #c0573c;border-radius:10px;background:#fbeee7;color:#7c2e18;font:14px/1.55 system-ui,-apple-system,sans-serif;max-width:980px';var h=document.querySelector('header');if(h&&h.parentNode)h.parentNode.insertBefore(b,h.nextSibling);else document.body.insertBefore(b,document.body.firstChild);}b.innerHTML=html+' <a href="#" style="color:#1f6f6b" onclick="var d=document.getElementById(\'__diag\');if(d)d.open=true;return false;">Show loader diagnostics</a>';panel().open=true;refresh();}
function ld(src){
  var meta=null,url;
  if(src.indexOf('gh:')===0){
    var r=src.slice(3),ref='main',at=r.lastIndexOf('@');if(at>0){ref=r.slice(at+1);r=r.slice(0,at);}
    var a=r.split('/'),ow=a.shift(),rp=a.shift(),pa=a.join('/'),tk=tok();
    meta={owner:ow,repo:rp,path:pa,ref:ref};
    log('scheme = gh:');log('owner =',ow);log('repo =',rp);log('ref =',ref);log('path =',pa);
    log('tokenKey =',tkey());log('token =',tokInfo(tk));
    url='https://api.github.com/repos/'+ow+'/'+rp+'/contents/'+pa+'?ref='+encodeURIComponent(ref);
    var h={'Accept':'application/vnd.github.raw','X-GitHub-Api-Version':'2022-11-28'};if(tk)h['Authorization']='Bearer '+tk;
    log('GET',url);log('Accept = application/vnd.github.raw');log('Authorization =',tk?'Bearer <token present>':'(none sent)');
    return fetch(url,{headers:h,cache:'no-store'}).then(function(resp){resp.__meta=meta;resp.__url=url;return resp;});
  }
  url=src;log('scheme = plain http');log('GET',url);
  return fetch(url,{cache:'no-store'}).then(function(resp){resp.__url=url;return resp;});
}
var p=new URLSearchParams(location.search),src=p.get('data')||((document.querySelector('meta[name="data-src"]')||{}).content||'');
panel();
log('page =',location.href);
log('data source from',p.get('data')?'?data= parameter':'meta[data-src] tag');
log('data source =',src||'(none)');
if(!src){log('no data source set; rendering embedded sample DATA');__run__(DATA);}
else{
  ld(src).then(function(r){
    log('HTTP',r.status,r.statusText||'');
    try{['x-ratelimit-remaining','x-ratelimit-limit','x-ratelimit-reset','x-accepted-github-permissions','content-type'].forEach(function(k){var v=r.headers.get(k);if(v!=null)log(k,'=',k==='x-ratelimit-reset'?(v+' ('+new Date(v*1000).toISOString()+')'):v);});}catch(e){}
    if(!r.ok){return r.text().then(function(body){var e=new Error('HTTP '+r.status+' '+(r.statusText||''));e.resp=r;e.body=body;throw e;});}
    return r.text().then(function(txt){log('body bytes =',txt.length);var j;try{j=JSON.parse(txt);}catch(pe){var e=new Error('JSON parse failed: '+pe.message);e.parseBody=txt;throw e;}return j;});
  }).then(function(j){log('JSON parsed OK; rendering');__run__(j);}).catch(function(e){
    __run__(DATA);
    log('FAILED:',String((e&&e.message)||e));
    var gm='';if(e&&e.body){log('GitHub response body:',String(e.body).slice(0,700));try{gm=(JSON.parse(e.body).message)||'';}catch(_){}}
    if(e&&e.parseBody)log('raw body (first 300):',String(e.parseBody).slice(0,300));
    var vb=document.getElementById('ver');if(vb)vb.textContent+='  ·  sample data ('+String((e&&e.message)||e)+')';
    var m=(e&&e.resp&&e.resp.__meta)||null,st=(e&&e.resp&&e.resp.status)||0,tk=tok();
    if(m&&!tk){banner('<b>No GitHub token in this browser.</b> Open the <b>MDA console</b> here (same site), click <b>&#9729; GitHub</b>, Save &amp; connect a token that can read <code>'+m.repo+'</code>, then reload.');}
    else if(m&&st===404){banner('<b>GitHub 404 for <code>'+m.path+'</code></b> on <code>'+m.owner+'/'+m.repo+'@'+m.ref+'</code>'+(gm?(' &mdash; GitHub says: <i>'+gm+'</i>'):'')+'. A token IS present, so this means the token cannot read this file (its permissions, or the path/branch/repo).');}
    else if(m&&(st===401||st===403)){banner('<b>GitHub '+st+'</b>'+(gm?(' &mdash; <i>'+gm+'</i>'):'')+'. Token rejected or rate-limited.');}
    else if(m){banner('<b>Could not reach GitHub</b> ('+String((e&&e.message)||e)+').');}
    else{banner('<b>Could not load the data file</b> ('+String((e&&e.message)||e)+'). If opened as a local file, serve over http instead.');}
  });
}
})();
</script>
</body>
</html>
