<style>
  :root{
    --bg:#f6f4ef;--surface:#fffdf9;--surface-2:#efece4;--line:#ddd7cb;
    --fg:#211f1b;--fg-soft:#5a564d;--fg-faint:#8a847a;
    --accent:#1f6f6b;--accent-soft:#dff0ec;
    --theme:#4a5a7a;--theme-soft:#dde2ec;--cls:#9a4f1b;--cls-soft:#f0e0d1;--warn:#9a3030;--warn-soft:#f3dada;--kind:#1f6feb;--kind-soft:#e3edfd;
    --onfile:#1a7f5a;--onfile-soft:rgba(26,127,90,.16);--mand:#9a6a12;--mand-soft:rgba(214,153,30,.20);--cap:#888;--cap-soft:rgba(128,128,128,.16);
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --disp:"Fraunces",Georgia,serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#16151a;--surface:#1f1e24;--surface-2:#27262d;--line:#36343d;
    --fg:#eceaf2;--fg-soft:#b4b0bd;--fg-faint:#827e8c;
    --accent:#58b8b0;--accent-soft:#15302e;
    --theme:#9fb2d8;--theme-soft:#20273a;--cls:#d79156;--cls-soft:#3a2a1b;--warn:#e88;--warn-soft:#3a1f1f;--kind:#7fb0ff;--kind-soft:#16233b;
    --onfile:#58b88c;--onfile-soft:rgba(88,184,140,.18);--mand:#d79a4a;--mand-soft:rgba(215,154,74,.20);--cap:#999;--cap-soft:rgba(150,150,150,.16);
    color-scheme:dark;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;font-size:15px}
  .wrap{max-width:1100px;margin:0 auto;padding:0 18px}
  h1,h2,h3{font-family:var(--disp);font-weight:560;line-height:1.15;margin:0}
  code,.id{font-family:var(--mono);font-size:.84em;background:var(--surface-2);padding:.08em .4em;border-radius:4px}
  a{color:var(--accent)}
  header{padding:28px 0 16px;border-bottom:1px solid var(--line)}
  header .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  header h1{font-size:clamp(1.5rem,4vw,2.1rem)}
  header .files{font-family:var(--mono);font-size:.78rem;color:var(--fg-faint);margin-top:6px}
  header .ver{font-family:var(--mono);font-size:.72rem;color:var(--fg-faint);margin-top:4px}
  .tiles{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:18px 0}
  .tiles .t{background:var(--surface);padding:11px 16px;flex:1;min-width:92px}
  .tiles .t .n{font-family:var(--disp);font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1}
  .tiles .t .l{font-size:.72rem;color:var(--fg-soft);margin-top:2px}
  nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:4px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
  nav button{font:inherit;font-size:.86rem;background:transparent;border:1px solid transparent;color:var(--fg-soft);padding:7px 13px;border-radius:8px;cursor:pointer}
  nav button:hover{background:var(--surface-2)}
  nav button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);font-weight:600}
  main{padding:22px 0 80px}
  .panel{display:none}.panel.on{display:block}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 14px}
  .card h3{font-size:1.1rem}
  .muted{color:var(--fg-soft)}.small{font-size:.84rem}
  .pill{display:inline-block;font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin:1px 2px}
  .st{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .st.onfile{background:var(--onfile-soft);color:var(--onfile)}
  .st.mandated{background:var(--mand-soft);color:var(--mand)}
  .st.tocapture{background:var(--cap-soft);color:var(--cap)}
  table{border-collapse:collapse;width:100%;font-size:.86rem}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-faint);font-weight:600}
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  details{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;background:var(--surface)}
  details>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:"\25B8";color:var(--fg-faint);transition:transform .15s}
  details[open]>summary::before{transform:rotate(90deg)}
  details .inner{padding:0 16px 16px}
  .filters{position:sticky;top:48px;z-index:4;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .filters label{font-size:.78rem;color:var(--fg-soft);display:flex;align-items:center;gap:6px}
  .filters select,.filters input[type=search]{font:inherit;font-size:.84rem;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
  .filters .count{margin-left:auto;font-family:var(--mono);font-size:.76rem;color:var(--fg-faint)}
  .empty{color:var(--fg-faint);font-style:italic;padding:8px 0}
  .formtbl td{border:1px solid var(--line);height:30px}
  .formtbl th{border:1px solid var(--line);background:var(--surface-2)}
  .btn{font:inherit;font-size:.8rem;background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:8px;padding:5px 11px;cursor:pointer}
  .need{font-size:.78rem;color:var(--fg-soft);margin:4px 0 8px}
  @media print{
    nav,.filters,.tiles,header .ver,.btn,.noprint{display:none!important}
    .panel{display:block!important}
    .card{break-inside:avoid;border:1px solid #999}
    body{font-size:12px}
  }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="eyebrow">Digital Zambia Acceleration · ZM-SZ-466193-CS-QBS</div>
  <h1>MDA Readiness — Capture Register</h1>
  <div class="files">What each institution must produce to close the metadata-readiness gaps, grounded in the Consultant Data Pack.</div>
  <div class="ver" id="ver"></div>
</div></header>
<div class="wrap">
  <div class="tiles" id="tiles"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
const DATA = /*__DATA__*/null;
const DATA_SCHEMA = 2;

(function(){try{
 var NEED=DATA_SCHEMA, mv=((document.querySelector('meta[name="version"]')||{}).content)||'';
 var have=(DATA&&DATA.schemaVersion), appHave=(DATA&&DATA.appVersion), msgs=[];
 if(DATA){
  if(have==null) msgs.push('The loaded data has no schema version. Regenerate it with the current generator.');
  else if(have>NEED) msgs.push('The data is schema v'+have+', newer than this viewer (schema v'+NEED+'). Update and redeploy the viewer.');

  w.style.cssText='margin:0;padding:10px 14px;background:#fdecea;color:#8a1c12;border-bottom:1px solid #f3b4ae;font:13px/1.45 -apple-system,Segoe UI,Roboto,sans-serif';
  w.innerHTML='<b>Version check.</b> '+msgs.join(' ')+' <button type="button" style="margin-left:8px;font:inherit;cursor:pointer;border:1px solid #c9453b;background:transparent;color:#8a1c12;border-radius:6px;padding:1px 8px">Dismiss</button>';
  w.querySelector('button').onclick=function(){w.remove();};
  if(document.body) document.body.insertBefore(w,document.body.firstChild);}

// ---- helpers ----
var $=function(s){return document.querySelector(s);};
function el(t,a,h){var e=document.createElement(t);if(a)for(var k in a){if(k==='class')e.className=a[k];else e.setAttribute(k,a[k]);}if(h!=null){if(h.nodeType)e.appendChild(h);else e.innerHTML=h;}return e;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

try{var mv=(document.querySelector('meta[name="version"]')||{}).content||'';var up=(document.querySelector('meta[name="updated"]')||{}).content||'';$('#ver').textContent='v'+mv+(up?('  ·  built '+up):'');}catch(e){}

// ---- capture-template field definitions (one per DMO artifact type) ----
var TEMPLATES={
 "DMO-01":{title:"Classification Record",fields:["Asset","Classification level (1-4)","Label held as metadata (Y/N)","Harm basis","Personal / sensitive flags","Classified by","Date","Next review"]},
 "DMO-02":{title:"Data Protection / DPC Record",fields:["Asset","DPC registration ref","DPO / contact","Lawful basis","DPIA ref (if high-risk)","Breach procedure ref","Date"]},
 "DMO-03":{title:"Retention Schedule",fields:["Asset","Retention basis (legal / business)","Retention period","Disposal trigger","Disposal method","Legal reference","Owner","Date"]},
 "DMO-04":{title:"Data-Sharing Basis Record",fields:["Flow (from → to)","Sharing basis","Agreement / MoU ref","Interoperability pattern","Objection handling","Date"]},
 "DMO-05":{title:"Metadata / Schema & Reference-Data Record",fields:["Asset","Schema / data dictionary location","Code list referenced","Version","Standard applied","Steward","Date"]},
 "DMO-06":{title:"Ownership & Stewardship Record",fields:["Asset","Owner","Steward","Custodian","Reachable contact","Date"]},
 "DMO-07":{title:"Statutory-Register Record",fields:["Register","Statutory status","Legal citation","Authoritative source","Date"]},
 "DMO-08":{title:"Identifier & Master-Data Record",fields:["Identifier","Uniqueness rule","Format validation","Crosswalk / match checked (Y/N)","Date"]},
 "DMO-10":{title:"Provenance Record",fields:["Asset","Origin","Destination(s)","Transformation","Timestamp captured","Date"]},
 "DMO-11":{title:"Data Residency / Hosting Record",fields:["Asset","Hosting location (in-country Y/N)","Critical-information category","Legal basis","Date"]}
};

// ---- derive gaps from the catalog ----
var ITEMS=[];           // one per not-on-file requirement
var ONFILE=0, DSWITH={}, ENTS={};
(DATA.datasets||[]).forEach(function(d){
  var pc=d.policyCompliance; if(!pc) return;
  var ent=pc.datasetEntityName||pc.datasetEntity||'?';
  (pc.controls||[]).forEach(function(c){
    if(c.status==='on-file'){ONFILE++;return;}
    ENTS[ent]=1; DSWITH[d.id]=1;
    ITEMS.push({entity:ent,dataset:(d.title||d.id),datasetId:d.id,code:c.code,requirement:c.requirement,
      dmoId:c.dmoId,dmoName:c.dmoName,statute:c.statute,clause:c.clause,status:c.status});
  });
});
var ENTLIST=Object.keys(ENTS).sort();
var DMOSET={}; ITEMS.forEach(function(i){if(i.dmoId)DMOSET[i.dmoId]={id:i.dmoId,name:i.dmoName};});
var DMOLIST=Object.keys(DMOSET).sort();

// ---- tiles ----
(function(){
  var tdefs=[[ITEMS.length,"Capture items"],[ENTLIST.length,"Entities"],[Object.keys(DSWITH).length,"Datasets with gaps"],[DMOLIST.length,"Artifact types"],[ONFILE,"On file"]];
  var tl=$('#tiles'); tdefs.forEach(function(t){tl.append(el('div',{class:'t'},'<div class="n">'+t[0]+'</div><div class="l">'+t[1]+'</div>'));});
})();

// ---- panels ----
var panels=[], active=null;
function addPanel(id,label,build){panels.push({id:id,label:label,build:build});}
function select(id){active=id;
  document.querySelectorAll('#nav button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.p===id?'true':'false');});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('on',p.id==='panel-'+id);});
}

// ===== Gap Register =====
addPanel("register","Gap Register",function(p){
  var bar=el('div',{class:'filters'});
  var selE=el('select',{}); selE.append(el('option',{value:''},'All entities')); ENTLIST.forEach(function(e){selE.append(el('option',{value:e},e));});
  var selD=el('select',{}); selD.append(el('option',{value:''},'All artifact types')); DMOLIST.forEach(function(d){selD.append(el('option',{value:d},d+' · '+DMOSET[d].name));});
  var search=el('input',{type:'search',placeholder:'search requirement / dataset…'});
  var lE=el('label',{},'Entity '); lE.append(selE);
  var lD=el('label',{},'Artifact '); lD.append(selD);
  var lS=el('label',{},'Find '); lS.append(search);
  var cnt=el('span',{class:'count'});
  bar.innerHTML=''; bar.append(lE,lD,lS,cnt);
  p.append(bar);
  var host=el('div',{}); p.append(host);
  function render(){
    var fe=selE.value, fd=selD.value, q=search.value.toLowerCase();
    var rows=ITEMS.filter(function(i){return (!fe||i.entity===fe)&&(!fd||i.dmoId===fd)&&(!q||((i.requirement+' '+i.dataset).toLowerCase().indexOf(q)>=0));});
    cnt.textContent=rows.length+' of '+ITEMS.length+' items';
    host.innerHTML='';
    // group by entity
    var byE={}; rows.forEach(function(r){(byE[r.entity]=byE[r.entity]||[]).push(r);});
    if(!rows.length){host.append(el('div',{class:'empty'},'No items match.'));return;}
    Object.keys(byE).sort().forEach(function(ent){
      var list=byE[ent];
      var det=el('details',{open:'open'});
      var sm=el('summary',{},esc(ent)+' <span class="muted small">'+list.length+' to capture</span>');
      det.append(sm);
      var inner=el('div',{class:'inner'});
      var tb=el('table',{},'<thead><tr><th>Requirement</th><th>Dataset</th><th>Artifact type (DMO)</th><th>Binding basis</th><th>Status</th></tr></thead>');
      var body=el('tbody',{});
      list.forEach(function(r){
        var basis=r.statute?(esc(r.statute)+(r.clause?(' '+esc(r.clause)):'')):(r.clause||'—');
        var scl=r.status==='on-file'?'onfile':(r.status==='mandated'?'mandated':'tocapture');
        var slab=r.status==='on-file'?'On file':(r.status==='mandated'?'Mandated':'To capture');
        body.append(el('tr',{},
          '<td><b>'+esc(r.requirement)+'</b><div class="small muted">'+esc(r.code)+'</div></td>'+
          '<td>'+esc(r.dataset)+'</td>'+
          '<td>'+esc(r.dmoId||'')+'<div class="small muted">'+esc(r.dmoName||'')+'</div></td>'+
          '<td class="small">'+basis+'</td>'+
          '<td><span class="st '+scl+'">'+slab+'</span></td>'));
      });
      tb.append(body); inner.append(el('div',{class:'scroll'},tb));
      det.append(inner); host.append(det);
    });
  }
  selE.onchange=selD.onchange=render; search.oninput=render; render();
});

// ===== Capture Templates =====
addPanel("templates","Capture Templates",function(p){
  p.append(el('p',{class:'small muted'},'A blank form for each artifact type an institution must produce. One pre-named row per dataset that still needs it — print the card and fill it in, or use it as the field spec for a system record. Mandating clauses are listed on each form.'));
  DMOLIST.forEach(function(dmo){
    var tpl=TEMPLATES[dmo]||{title:DMOSET[dmo].name,fields:["Asset","Value","Owner","Date"]};
    var items=ITEMS.filter(function(i){return i.dmoId===dmo;});
    // datasets needing this, with entity
    var need={}; items.forEach(function(i){need[i.datasetId]={ds:i.dataset,ent:i.entity};});
    var needList=Object.keys(need).map(function(k){return need[k];});
    // mandating clauses (distinct statute+clause)
    var cl={}; items.forEach(function(i){if(i.statute)cl[i.statute+(i.clause?(' '+i.clause):'')]=1;});
    var card=el('div',{class:'card'});
    card.append(el('div',{style:'display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px'},
      '<h3>'+esc(tpl.title)+' <span class="muted small">'+esc(dmo)+' · '+esc(DMOSET[dmo].name)+'</span></h3>'+
      '<button class="btn noprint" onclick="window.print()">Print</button>'));
    card.append(el('div',{class:'need'},'Needed by '+needList.length+' dataset'+(needList.length===1?'':'s')+' across '+Object.keys(needList.reduce(function(a,x){a[x.ent]=1;return a;},{})).length+' entit'+(Object.keys(needList.reduce(function(a,x){a[x.ent]=1;return a;},{})).length===1?'y':'ies')+'.'));
    if(Object.keys(cl).length) card.append(el('div',{class:'small muted',style:'margin-bottom:8px'},'Mandated by: '+Object.keys(cl).map(esc).join('; ')+'.'));
    var tb=el('table',{class:'formtbl'});
    var hr='<thead><tr>'+tpl.fields.map(function(f){return '<th>'+esc(f)+'</th>';}).join('')+'</tr></thead>';
    tb.innerHTML=hr;
    var body=el('tbody',{});
    needList.forEach(function(n){
      var tds=tpl.fields.map(function(f,ix){
        if(ix===0) return '<td>'+esc(n.ds)+'<div class="small muted">'+esc(n.ent)+'</div></td>';
        return '<td></td>';
      }).join('');
      body.append(el('tr',{},tds));
    });
    // a couple of spare blank rows
    for(var k=0;k<2;k++){ body.append(el('tr',{}, tpl.fields.map(function(){return '<td></td>';}).join('')) ); }
    tb.append(body); card.append(el('div',{class:'scroll'},tb));
    p.append(card);
  });
});

// ===== About =====
addPanel("about","Method",function(p){
  var c=el('div',{class:'card'});
  c.innerHTML='<h3>How this register is built</h3>'+
   '<p class="small">Each dataset in the MDA Data Catalog carries its applicable metadata requirements. Every requirement is given one of three states, grounded in the Consultant Data Pack (76 documents across 12 institutions):</p>'+
   '<p class="small"><span class="st onfile">On file</span> an institution’s own operational document evidences the artifact (a quote is shown in the catalog). '+
   '<span class="st mandated">Mandated</span> a binding Act / SI / Rules / Standard requires it, but no artifact is on file yet. '+
   '<span class="st tocapture">To capture</span> no binding instrument requires it (discretionary / best practice).</p>'+
   '<p class="small">This register lists every requirement that is <b>not</b> on file — the capture backlog — and, under Capture Templates, a blank form for each artifact type so each institution can produce and return the missing record. NRC and PACRA show a full backlog because no operational documents were supplied for them in the data pack.</p>'+
   '<p class="small muted">Source: MDA Data Catalog (policyCompliance), grounded against zambia_opmodel.json document_register. Classification levels are proposed pending the official e-Gov scheme.</p>';
  p.append(c);
});

// ---- mount ----
var nav=$('#nav'), mainEl=$('#main');
panels.forEach(function(pn){
  var b=el('button',{},esc(pn.label)); b.dataset.p=pn.id; b.onclick=function(){select(pn.id);};
  nav.append(b);
  var pe=el('div',{class:'panel',id:'panel-'+pn.id});
  pn.build(pe); mainEl.append(pe);
});
select(panels[0].id);
} /* __run__ */
(function(){function ld(s){if(s.indexOf('gh:')===0){var r=s.slice(3),ref='main',at=r.lastIndexOf('@');if(at>0){ref=r.slice(at+1);r=r.slice(0,at);}var a=r.split('/'),ow=a.shift(),rp=a.shift(),pa=a.join('/'),tk='';try{tk=localStorage.getItem((new URLSearchParams(location.search).get('tokenKey'))||'mdaReadiness.ghpat')||'';}catch(e){}var h={'Accept':'application/vnd.github.raw','X-GitHub-Api-Version':'2022-11-28'};if(tk)h['Authorization']='Bearer '+tk;return fetch('https://api.github.com/repos/'+ow+'/'+rp+'/contents/'+pa+'?ref='+encodeURIComponent(ref),{headers:h,cache:'no-store'});}return fetch(s,{cache:'no-store'});}var p=new URLSearchParams(location.search),src=p.get('data')||((document.querySelector('meta[name="data-src"]')||{}).content||'');if(src){ld(src).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();}).then(function(j){__run__(j);}).catch(function(e){__run__(DATA);var b=document.getElementById('ver');if(b)b.textContent+='  ·  embedded ('+String((e&&e.message)||e)+')';});}else{__run__(DATA);}})();
</script>
</body>
</html>
