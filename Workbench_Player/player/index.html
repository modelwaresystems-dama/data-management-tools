<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workbench Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  html,body{height:100%;margin:0;}
  :root{
    --bg:#0E1524;--surface:#16213A;--surface2:#1D2B49;--line:#28375A;--line2:#334670;
    --ink:#EAF1FF;--muted:#9DB0D2;--faint:#6C7EA3;
    --accent:#2FD4C0;--accent-ink:#7DEFE2;--gold:#E9BC58;
    --a:#E4572E;--b:#2E86E4;--c:#E0A82E;--d:#17A673;--good:#2ED47A;--bad:#F0685E;
    --quiz:#2E86E4;--cards:#E0A82E;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  body{background:radial-gradient(1000px 600px at 70% -10%,#17233d,var(--bg) 55%),var(--bg);color:var(--ink);overflow:hidden;}
  .app{height:100%;display:flex;flex-direction:column;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;}
  .disp{font-family:"Sora","Hanken Grotesk",sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .bar{display:flex;align-items:center;gap:14px;padding:12px clamp(14px,3vw,24px);border-bottom:1px solid var(--line);flex:none;}
  .brand{display:flex;align-items:center;gap:10px;font-family:"Sora",sans-serif;font-weight:700;font-size:15px;}
  .brand .mk{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#1c8f83);display:grid;place-items:center;color:#04211d;font-weight:800;font-size:14px;}
  .spacer{flex:1;}
  .seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;}
  .seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:7px 13px;border-radius:8px;}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#04211d;}
  .seg button:disabled{opacity:.35;cursor:not-allowed;}
  .sessbtn{border:1px solid var(--line2);background:var(--surface2);color:var(--ink);font-weight:600;font-size:13px;padding:8px 14px;border-radius:10px;display:flex;align-items:center;gap:8px;}
  .sessbtn .n{background:var(--gold);color:#241a00;border-radius:999px;font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px;}
  .sessbtn.empty .n{background:var(--line2);color:var(--faint);}
  .prog{height:4px;background:var(--surface);flex:none;}
  .prog .in{height:100%;background:var(--accent);width:0;transition:width .3s;}
  .wrap{flex:1;min-height:0;display:grid;place-items:center;padding:clamp(14px,3vw,26px);}
  .stagew{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;}
  h1.t{font-family:"Sora",sans-serif;font-size:20px;margin:0 0 2px;}
  .meta{color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:12px;margin-bottom:16px;}

  /* ---------- LIBRARY ---------- */
  .libwrap{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:960px;margin:0 auto;padding:clamp(14px,2.5vw,22px);gap:14px;}
  .libhead{display:flex;align-items:center;gap:12px;flex:none;flex-wrap:wrap;}
  .libhead h1{font-family:"Sora",sans-serif;font-size:clamp(20px,3vw,26px);margin:0;}
  .libhead .sub{color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:12px;}
  .search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;}
  .search input{flex:1;border:0;background:transparent;color:var(--ink);font-size:14px;outline:none;font-family:inherit;}
  .search svg{flex:none;color:var(--faint);}
  .filters{display:flex;gap:8px;flex:none;}
  .chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:600;font-size:12.5px;padding:7px 13px;border-radius:999px;}
  .chip[aria-pressed="true"]{background:var(--accent);color:#04211d;border-color:var(--accent);}
  .liblist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:20px;padding-right:4px;}
  .grp{display:flex;flex-direction:column;gap:9px;}
  .grphdr{font-family:"Sora",sans-serif;font-weight:700;font-size:14px;margin:0;color:var(--accent-ink);display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;padding:2px 0;cursor:pointer;}
  .grphdr:hover{color:#a6f5ea;}
  .grphdr .car{font-size:10px;color:var(--faint);transition:transform .18s;flex:none;}
  .grphdr.collapsed .car{transform:rotate(-90deg);}
  .grphdr .ct{color:var(--faint);font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:11px;}
  .grpbody{display:flex;flex-direction:column;gap:9px;}
  .grpbody.hide{display:none;}
  .libtools{display:flex;gap:8px;flex:none;}
  .libtools button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:600;font-size:12px;padding:7px 11px;border-radius:8px;}
  .libtools button:hover{border-color:var(--line2);color:var(--ink);}
  .row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 16px;transition:border-color .15s;}
  .row:hover{border-color:var(--line2);}
  .row.sel{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--surface));}
  .badge{flex:none;font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:5px 9px;border-radius:7px;}
  .badge.quiz{background:color-mix(in srgb,var(--quiz) 22%,transparent);color:#9cc4f5;}
  .badge.cards{background:color-mix(in srgb,var(--cards) 22%,transparent);color:#f0d38a;}
  .rowmain{flex:1;min-width:0;}
  .rowmain .nm{font-weight:700;font-size:15px;font-family:"Sora",sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rowmain .dt{color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:11.5px;margin-top:2px;}
  .rowact{display:flex;gap:8px;flex:none;}
  .mini{border:1px solid var(--line2);background:var(--surface2);color:var(--ink);font-weight:600;font-size:13px;padding:8px 14px;border-radius:9px;}
  .mini.play{background:var(--accent);color:#04211d;border-color:var(--accent);}
  .mini.add{min-width:78px;}
  .mini.added{background:var(--gold);color:#241a00;border-color:var(--gold);}
  .empty-lib{flex:1;display:grid;place-items:center;color:var(--faint);text-align:center;font-family:"IBM Plex Mono",monospace;}

  /* ---------- SESSION DRAWER ---------- */
  .scrim{position:fixed;inset:0;background:rgba(4,10,22,.55);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;}
  .scrim.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,94vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-14px 0 40px rgba(0,0,0,.45);z-index:41;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;}
  .drawer.open{transform:none;}
  .dh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);flex:none;}
  .dh h2{font-family:"Sora",sans-serif;font-size:16px;margin:0;flex:1;}
  .dh .x{border:0;background:var(--surface2);color:var(--muted);width:30px;height:30px;border-radius:8px;font-size:16px;}
  .dbody{flex:1;min-height:0;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;}
  .fld{display:flex;flex-direction:column;gap:5px;}
  .fld label{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);}
  .fld input{background:var(--surface2);border:1px solid var(--line2);color:var(--ink);border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;}
  .fld .hint{color:var(--faint);font-size:11.5px;}
  .selitem{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line2);border-radius:11px;padding:10px 12px;}
  .selitem .ord{font-family:"IBM Plex Mono",monospace;color:var(--faint);font-size:12px;width:20px;text-align:center;flex:none;}
  .selitem .info{flex:1;min-width:0;}
  .selitem .info .nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .selitem .info .tp{color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;}
  .selitem .wt{width:52px;flex:none;background:var(--surface);border:1px solid var(--line2);color:var(--ink);border-radius:7px;padding:6px;font-size:13px;text-align:center;font-family:"IBM Plex Mono",monospace;}
  .selitem .mv{display:flex;flex-direction:column;gap:2px;flex:none;}
  .selitem .mv button,.selitem .rm{border:1px solid var(--line2);background:var(--surface);color:var(--muted);border-radius:6px;width:26px;height:18px;font-size:11px;line-height:1;display:grid;place-items:center;padding:0;}
  .selitem .rm{height:38px;width:30px;font-size:15px;color:var(--bad);}
  .df{padding:14px 18px;border-top:1px solid var(--line);flex:none;display:flex;flex-direction:column;gap:10px;}
  .df .stat{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);}
  .df .stat b{color:var(--accent-ink);}
  .drow{display:flex;gap:10px;}
  .empty-sess{color:var(--faint);text-align:center;font-family:"IBM Plex Mono",monospace;font-size:13px;padding:30px 10px;line-height:1.6;}

  /* quiz */
  .backrow{display:flex;align-items:center;margin-bottom:6px;flex:none;}
  .backbtn{border:1px solid var(--line2);background:var(--surface2);color:var(--muted);font-weight:600;font-size:13px;padding:7px 13px;border-radius:9px;}
  .qn{font-family:"IBM Plex Mono",monospace;color:var(--faint);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
  .qtext{font-family:"Sora",sans-serif;font-weight:700;font-size:clamp(20px,3.4vw,28px);line-height:1.25;margin:0 0 20px;text-wrap:balance;}
  .opts{display:flex;flex-direction:column;gap:12px;}
  .opt{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:16px;text-align:left;transition:border-color .15s,background .15s;}
  .opt:hover:not(:disabled){border-color:var(--line2);}
  .opt .gl{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;color:#04211d;flex:none;}
  .opt.a .gl{background:var(--a);color:#fff}.opt.b .gl{background:var(--b);color:#fff}.opt.c .gl{background:var(--c);color:#04211d}.opt.d .gl{background:var(--d);color:#fff}
  .opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface));}
  .opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface));}
  .opt:disabled{cursor:default;}
  .opt .rmark{margin-left:auto;font-weight:800;}
  .why{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:14px 16px;color:#FFFFFF;font-size:15px;line-height:1.6;}
  .why b{color:var(--accent-ink);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:5px;}
  .why .ctx{color:var(--accent-ink);font-style:italic;margin:0 0 10px;}
  .why .wrow{display:flex;gap:10px;align-items:flex-start;margin-top:9px;}
  .why .wrow .mk{flex:none;font-weight:800;line-height:1.5;}
  .why .wrow .mk{font-size:15px;}
  .why .wrow.ok .mk{color:var(--good);}
  .why .wrow.no .mk{color:var(--bad);}
  .why .wrow b{display:inline;color:#fff;font-weight:700;}
  .why .wrow.no{color:#C9D6EE;}
  .why .wsep{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:15px 0 2px;}
  .navrow{display:flex;align-items:center;gap:12px;margin-top:20px;}
  .btn{border:1px solid var(--line2);background:var(--surface2);color:var(--ink);font-weight:600;font-size:14px;padding:11px 20px;border-radius:11px;}
  .btn.primary{background:var(--accent);color:#04211d;border-color:var(--accent);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .scorepill{margin-left:auto;font-family:"IBM Plex Mono",monospace;color:var(--accent-ink);font-weight:700;}

  /* results */
  .result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;}
  .result .big{font-family:"Sora",sans-serif;font-size:clamp(30px,7vw,52px);font-weight:800;}
  .result .lbl{color:var(--muted);}
  .ring{position:relative;width:160px;height:160px;}
  .ring svg{transform:rotate(-90deg);}
  .ring .c{position:absolute;inset:0;display:grid;place-items:center;font-family:"Sora",sans-serif;font-weight:800;font-size:34px;}

  /* flashcards */
  .fc{flex:1;display:flex;flex-direction:column;min-height:0;}
  .cardbox{flex:1;display:grid;place-items:center;min-height:0;perspective:1200px;}
  .card3d{width:100%;max-width:560px;height:min(340px,60vh);position:relative;transform-style:preserve-3d;transition:transform .5s;cursor:pointer;}
  .card3d.flip{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;text-align:center;}
  .face .kicker{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);position:absolute;top:16px;left:20px;}
  .face .term{font-family:"Sora",sans-serif;font-weight:700;font-size:clamp(22px,4vw,30px);}
  .face.back{transform:rotateY(180deg);background:var(--surface2);}
  .face.back .term{font-size:clamp(16px,2.6vw,20px);font-weight:500;color:var(--ink);line-height:1.5;}
  .fc-nav{display:flex;align-items:center;gap:12px;margin-top:18px;flex:none;}
  .flip-hint{color:var(--faint);font-size:13px;text-align:center;margin-top:10px;flex:none;}

  .center{flex:1;display:grid;place-items:center;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;max-width:460px;}
  .card h1{font-family:"Sora",sans-serif;margin:0 0 8px;}.card p{color:var(--muted);}
  @media (max-width:520px){.navrow{flex-wrap:wrap}.row{flex-wrap:wrap}.rowact{width:100%;justify-content:flex-end}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand"><span class="mk">ds</span> Workbench Player</div>
    <span class="spacer"></span>
    <div class="seg" id="modeSeg" role="tablist" aria-label="View">
      <button id="m-lib" aria-pressed="true">Library</button>
      <button id="m-quiz" aria-pressed="false" disabled>Quiz</button>
      <button id="m-cards" aria-pressed="false" disabled>Flashcards</button>
    </div>
    <button class="sessbtn empty" id="sessOpen">Training Session <span class="n" id="sessN">0</span></button>
  </div>
  <div class="prog"><div class="in" id="prog"></div></div>
  <div id="stage"></div>
</div>

<!-- Session drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Training Session builder">
  <div class="dh"><h2>Training Session</h2><button class="x" id="sessClose" aria-label="Close">✕</button></div>
  <div class="dbody" id="dbody"></div>
  <div class="df">
    <div class="stat"><span>Quizzes / Flashcards</span><b id="statMix">0 / 0</b></div>
    <div class="stat"><span>Scored questions</span><b id="statQ">0</b></div>
    <div class="drow">
      <button class="btn" id="sessClear" style="flex:1">Clear</button>
      <button class="btn primary" id="sessDownload" style="flex:2">Download session file</button>
    </div>
  </div>
</aside>

<script src="../app-config.js"></script>
<script src="../version.js"></script>
<script>
/* ============ Workbench Player ============
   Library view (indexed from manifest.json on the private backend) +
   self-test Quiz / Flashcards player + Training Session builder.
   Assets & manifest come from the PRIVATE backend (app-config.js).
   Workbench "Play" deep-link still works via ?quiz= / ?cards=.
========================================================= */
const U=new URLSearchParams(location.search);
const C=window.APP_CONFIG||{};
const SESS_KEY="wbp-session-draft-v1";

async function fetchAsset(pathRel, devFallback){
  if(C.assetApi){
    const u=C.assetApi+(C.assetApi.includes("?")?"&":"?")+"path="+encodeURIComponent(pathRel);
    const r=await fetch(u,{cache:"no-store"}); if(!r.ok) throw new Error("asset backend "+r.status); return await r.json();
  }
  return await (await fetch(devFallback,{cache:"no-store"})).json();
}

const OPTS=[{k:"a",gl:"A"},{k:"b",gl:"B"},{k:"c",gl:"C"},{k:"d",gl:"D"}];
const stage=document.getElementById("stage");
let view="lib";                       // lib | quiz | cards
let MANIFEST=null, ASSETS=[];
let libSearch="", libFilter="all";    // all | quiz | flashcards
let libCollapsed=new Set();           // collapsed notebook groups
let curAsset=null;                    // {path,title,type,...} being played
let QUIZ=null, CARDS=null, QUIZ_SRC="";
let qi=0, chosen=null, score=0, answers=[];
let ci=0, flipped=false;

/* selection for the Training Session */
let SESSION=loadSession();
function loadSession(){ try{ const s=JSON.parse(localStorage.getItem(SESS_KEY)); if(s&&Array.isArray(s.items)) return s; }catch(e){} return {title:"", items:[]}; }
function saveSession(){ try{ localStorage.setItem(SESS_KEY, JSON.stringify(SESSION)); }catch(e){} paintSessBtn(); }

function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function setProg(f){document.getElementById("prog").style.width=(Math.max(0,Math.min(1,f))*100)+"%";}
function cleanText(s){ if(s==null)return""; s=String(s);
  s=s.replace(/\\text\{([^}]*)\}/g,"$1").replace(/\$([^$]*)\$/g,"$1");
  s=s.replace(/\\%/g,"%").replace(/\\_/g,"_").replace(/\\&/g,"&").replace(/\\\$/g,"$").replace(/\\#/g,"#");
  s=s.replace(/\\\\/g," ").replace(/[{}]/g,"").replace(/\s+/g," ").trim(); return s; }
function normalizeQuiz(raw){
  if(!raw||!raw.questions||!raw.questions.length) return raw;
  const nlm = raw.questions[0].answerOptions!=null;
  if(!nlm) return raw;
  return { title:raw.title||"Quiz", category:raw.category||"",
    questions: raw.questions.map(q=>{ const o=q.answerOptions||[]; let c=o.findIndex(x=>x.isCorrect); if(c<0)c=0;
      return { q:cleanText(q.question), options:o.map(x=>cleanText(x.text)), correct:c,
               why:cleanText((o[c]&&o[c].rationale)||q.hint||""), rats:o.map(x=>cleanText(x.rationale||"")), context:cleanText(q.context||""), hint:cleanText(q.hint||"") }; }) };
}
/* Randomise option order per question so the correct answer isn't always in the same slot.
   Self-paced player reshuffles each attempt. */
function shuffleQuiz(quiz){
  if(!quiz||!quiz.questions) return quiz;
  const nQ=quiz.questions.length; let prev=-1; const used={};
  quiz.questions.forEach(q=>{
    if(!q.options||q.options.length<2){ return; }
    const k=q.options.length, cap=Math.ceil(nQ/k);
    let cand=[]; for(let s=0;s<k;s++) if(s!==prev && (used[s]||0)<cap) cand.push(s);
    if(!cand.length){ for(let s=0;s<k;s++) if(s!==prev) cand.push(s); }
    if(!cand.length){ for(let s=0;s<k;s++) cand.push(s); }
    const target=cand[Math.floor(Math.random()*cand.length)];
    used[target]=(used[target]||0)+1; prev=target;
    const others=q.options.map((_,i)=>i).filter(i=>i!==q.correct);
    for(let i=others.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [others[i],others[j]]=[others[j],others[i]]; }
    const order=new Array(k); order[target]=q.correct;
    let oi=0; for(let s=0;s<k;s++){ if(s!==target) order[s]=others[oi++]; }
    q.options=order.map(i=>q.options[i]); q.correct=target;
  });
  return quiz;
}

/* ---------- mode segment ---------- */
document.getElementById("m-lib").onclick=()=>{ view="lib"; syncSeg(); renderLibrary(); };
document.getElementById("m-quiz").onclick=()=>{ if(!QUIZ) return; view="quiz"; syncSeg(); render(); };
document.getElementById("m-cards").onclick=()=>{ if(!CARDS||!CARDS.cards) return; view="cards"; syncSeg(); render(); };
function syncSeg(){
  document.getElementById("m-lib").setAttribute("aria-pressed",view==="lib");
  document.getElementById("m-quiz").setAttribute("aria-pressed",view==="quiz");
  document.getElementById("m-cards").setAttribute("aria-pressed",view==="cards");
  document.getElementById("m-quiz").disabled = !QUIZ;
  document.getElementById("m-cards").disabled = !(CARDS&&CARDS.cards);
  if(view==="lib") setProg(0);
}

/* ================= LIBRARY ================= */
async function loadManifest(){
  try{ MANIFEST=await fetchAsset("manifest.json","../manifest.sample.json"); ASSETS=MANIFEST.assets||MANIFEST.quizzes||[]; }
  catch(e){ MANIFEST={error:e.message}; ASSETS=[]; }
  renderLibrary();
}
function inSession(path){ return SESSION.items.some(i=>i.path===path); }
function renderLibrary(){
  setProg(0);
  if(MANIFEST&&MANIFEST.error){
    stage.innerHTML=`<div class="wrap"><div class="stagew"><div class="center"><div class="card"><h1>Couldn't load the library</h1><p>${esc(MANIFEST.error)}</p><p style="color:var(--faint);font-size:13px">Check that <code>manifest.json</code> exists in the private data store.</p></div></div></div></div>`;
    return;
  }
  const q=libSearch.trim().toLowerCase();
  let list=ASSETS.filter(a=>{
    if(libFilter!=="all" && (a.type||"quiz")!==libFilter) return false;
    if(!q) return true;
    return (a.title||"").toLowerCase().includes(q) || (a.topic||"").toLowerCase().includes(q);
  });
  const topics=[]; const byTopic={};
  list.forEach(a=>{ const t=a.topic||"Uncategorised"; if(!byTopic[t]){byTopic[t]=[];topics.push(t);} byTopic[t].push(a); });
  const totQ=ASSETS.filter(a=>(a.type||"quiz")==="quiz").length;
  const totC=ASSETS.filter(a=>a.type==="flashcards").length;

  let groups = topics.map(t=>{
    const collapsed=libCollapsed.has(t);
    const rows=byTopic[t].map(a=>{
      const type=a.type||"quiz", sel=inSession(type==="quiz"||type==="flashcards"?a.path:a.path);
      const unit=type==="flashcards"?"cards":"questions";
      return `<div class="row ${sel?'sel':''}" data-path="${esc(a.path)}">
        <span class="badge ${type==='flashcards'?'cards':'quiz'}">${type==='flashcards'?'Cards':'Quiz'}</span>
        <div class="rowmain"><div class="nm">${esc(a.title)}</div><div class="dt">${a.count||0} ${unit}</div></div>
        <div class="rowact">
          <button class="mini play" data-act="play">Play</button>
          <button class="mini add ${sel?'added':''}" data-act="add">${sel?'✓ Added':'+ Session'}</button>
        </div>
      </div>`;
    }).join("");
    return `<div class="grp">
      <button class="grphdr ${collapsed?'collapsed':''}" data-topic="${esc(t)}" type="button"><span class="car">▼</span>${esc(t)}<span class="ct">${byTopic[t].length} item${byTopic[t].length!==1?'s':''}</span></button>
      <div class="grpbody ${collapsed?'hide':''}" data-body="${esc(t)}">${rows}</div>
    </div>`;
  }).join("");

  if(!list.length) groups=`<div class="empty-lib">No assets match "${esc(libSearch)}".</div>`;

  stage.innerHTML=`<div class="libwrap">
    <div class="libhead">
      <h1>Library</h1>
      <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="libq" placeholder="Search quizzes & flashcards…" value="${esc(libSearch)}"></div>
      <div class="filters">
        <button class="chip" data-f="all" aria-pressed="${libFilter==='all'}">All</button>
        <button class="chip" data-f="quiz" aria-pressed="${libFilter==='quiz'}">Quizzes ${totQ}</button>
        <button class="chip" data-f="flashcards" aria-pressed="${libFilter==='flashcards'}">Cards ${totC}</button>
      </div>
      <div class="libtools">
        <button id="expandAll" type="button">Expand all</button>
        <button id="collapseAll" type="button">Collapse all</button>
      </div>
    </div>
    <div class="liblist">${groups}</div>
  </div>`;

  const ea=document.getElementById("expandAll"), ca=document.getElementById("collapseAll");
  if(ea)ea.onclick=()=>{ libCollapsed.clear(); renderLibrary(); };
  if(ca)ca.onclick=()=>{ topics.forEach(t=>libCollapsed.add(t)); renderLibrary(); };
  stage.querySelectorAll(".grphdr").forEach(h=>h.onclick=()=>{
    const t=h.dataset.topic;
    if(libCollapsed.has(t))libCollapsed.delete(t); else libCollapsed.add(t);
    h.classList.toggle("collapsed");
    const body=stage.querySelector(`.grpbody[data-body="${CSS.escape(t)}"]`);
    if(body)body.classList.toggle("hide");
  });

  const qbox=document.getElementById("libq");
  qbox.oninput=()=>{ libSearch=qbox.value; const pos=qbox.selectionStart; renderLibrary(); const nb=document.getElementById("libq"); if(nb){nb.focus(); try{nb.setSelectionRange(pos,pos);}catch(e){}} };
  stage.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ libFilter=c.dataset.f; renderLibrary(); });
  stage.querySelectorAll(".row").forEach(r=>{
    const path=r.dataset.path, a=ASSETS.find(x=>x.path===path);
    r.querySelector('[data-act="play"]').onclick=()=>playAsset(a);
    r.querySelector('[data-act="add"]').onclick=()=>{ toggleSession(a); renderLibrary(); };
  });
}

/* ---------- play a chosen asset ---------- */
async function playAsset(a){
  curAsset=a; QUIZ=null; CARDS=null; qi=0;chosen=null;score=0;answers=[]; ci=0;flipped=false;
  const type=a.type||"quiz";
  stage.innerHTML=`<div class="wrap"><div class="stagew"><div class="center"><div class="card"><h1>Loading…</h1><p>${esc(a.title)}</p></div></div></div></div>`;
  try{
    if(type==="flashcards"){ CARDS=await fetchAsset(a.path,"flashcards.sample.json"); view="cards"; }
    else { QUIZ=shuffleQuiz(normalizeQuiz(await fetchAsset(a.path,"../live/quiz.sample.json"))); QUIZ_SRC=a.path; view="quiz"; }
  }catch(e){ if(type==="flashcards")CARDS={error:e.message}; else QUIZ={error:e.message}; }
  syncSeg(); render();
}

/* deep-link (?quiz= / ?cards=) still supported */
async function deepLink(){
  const qp=U.get("quiz"), cp=U.get("cards");
  if(!qp&&!cp) return false;
  if(qp){ try{QUIZ=shuffleQuiz(normalizeQuiz(await fetchAsset(qp,"../live/quiz.sample.json")));QUIZ_SRC=qp;}catch(e){QUIZ={error:e.message};} }
  if(cp){ try{CARDS=await fetchAsset(cp,"flashcards.sample.json");}catch(e){CARDS=null;} }
  curAsset={title:(QUIZ&&QUIZ.title)||"Asset"};
  view=(U.get("mode")==="cards"||(cp&&!qp))?"cards":"quiz"; syncSeg(); render(); return true;
}

function render(){
  if(view==="lib"){ renderLibrary(); return; }
  if(view==="quiz")renderQuiz(); else renderCards();
}
function backBar(){ return `<div class="backrow"><button class="backbtn" id="back">← Library</button></div>`; }
function wireBack(){ const b=document.getElementById("back"); if(b)b.onclick=()=>{ view="lib"; syncSeg(); renderLibrary(); }; }

/* ---------- QUIZ ---------- */
function whyHTML(q){
  const rats=q.rats||[];
  const ctx=q.context?`<div class="ctx">${esc(q.context)}</div>`:"";
  const cr=rats[q.correct]||q.why||"";
  const correct=`<div class="wrow ok"><span class="mk">\u2713</span><div><b>${esc(q.options[q.correct])}</b>${cr?` \u2014 ${esc(cr)}`:""}</div></div>`;
  let wrong="";
  q.options.forEach((o,i)=>{ if(i===q.correct||!rats[i])return; wrong+=`<div class="wrow no"><span class="mk">\u2717</span><div><b>${esc(o)}</b> \u2014 ${esc(rats[i])}</div></div>`; });
  return `<div class="why"><b>Explanation</b>${ctx}${correct}${wrong?`<div class="wsep">Why the other answers are wrong</div>${wrong}`:""}</div>`;
}
function renderQuiz(){
  if(!QUIZ||QUIZ.error){ stage.innerHTML=`<div class="wrap"><div class="stagew">${backBar()}<div class="center"><div class="card"><h1>Couldn't load quiz</h1><p>${esc(QUIZ&&QUIZ.error||"Missing quiz JSON")} (${esc(QUIZ_SRC)})</p></div></div></div></div>`; wireBack(); return; }
  const N=QUIZ.questions.length;
  if(qi>=N){ setProg(1); return renderResult(); }
  setProg(qi/N);
  const q=QUIZ.questions[qi];
  const answered=chosen!=null;
  const opts=q.options.map((o,i)=>{
    const M=OPTS[i]||{k:"a",gl:String.fromCharCode(65+(i%26))};
    let cls="opt "+M.k, mark="";
    if(answered){ if(i===q.correct){cls+=" correct";mark='<span class="rmark" style="color:var(--good)">✓</span>';} else if(i===chosen){cls+=" wrong";mark='<span class="rmark" style="color:var(--bad)">✗</span>';} }
    return `<button class="${cls}" data-i="${i}" ${answered?"disabled":""}><span class="gl">${M.gl}</span>${esc(o)}${mark}</button>`;
  }).join("");
  stage.innerHTML=`<div class="wrap"><div class="stagew">
    ${backBar()}
    <h1 class="t disp">${esc(QUIZ.title||"Quiz")}</h1>
    <div class="meta">${esc(QUIZ.category||(curAsset&&curAsset.topic)||"")}</div>
    <div class="qn">Question ${qi+1} of ${N}</div>
    <div class="qtext disp">${esc(q.q)}</div>
    <div class="opts">${opts}</div>
    ${answered?whyHTML(q):""}
    <div class="navrow">
      <button class="btn primary" id="next" ${answered?"":"disabled"}>${qi>=N-1?"See score":"Next →"}</button>
      <span class="scorepill">${score} / ${N}</span>
    </div>
  </div></div>`;
  wireBack();
  if(!answered){ stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ chosen=parseInt(b.dataset.i,10); if(chosen===q.correct)score++; answers.push({qi,pick:chosen,ok:chosen===q.correct}); render(); }); }
  const nx=document.getElementById("next"); if(nx)nx.onclick=()=>{ qi++; chosen=null; render(); };
}
function renderResult(){
  const N=QUIZ.questions.length, pct=Math.round(score/N*100), R=70,CC=2*Math.PI*R,off=CC*(1-score/N);
  let tier= pct>=80?"Master pass":pct>=60?"Practitioner":pct>=40?"Associate":"Keep going";
  stage.innerHTML=`<div class="wrap"><div class="stagew">${backBar()}<div class="result">
    <div class="ring"><svg width="160" height="160"><circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${CC.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><span class="c">${pct}%</span></div>
    <div class="big disp">${score} / ${N}</div>
    <div class="lbl">${tier}</div>
    <div class="navrow" style="justify-content:center"><button class="btn primary" id="again">Try again</button><button class="btn" id="tolib">← Back to Library</button></div>
  </div></div></div>`;
  wireBack();
  document.getElementById("again").onclick=()=>{ shuffleQuiz(QUIZ); qi=0;chosen=null;score=0;answers=[];render(); };
  document.getElementById("tolib").onclick=()=>{ view="lib"; syncSeg(); renderLibrary(); };
}

/* ---------- FLASHCARDS ---------- */
function renderCards(){
  if(!CARDS||!CARDS.cards){ stage.innerHTML=`<div class="wrap"><div class="stagew">${backBar()}<div class="center"><div class="card"><h1>No flashcards</h1><p>${esc(CARDS&&CARDS.error||"This asset has no cards.")}</p></div></div></div></div>`; wireBack(); return; }
  const N=CARDS.cards.length; setProg((ci+1)/N);
  const c=CARDS.cards[ci];
  stage.innerHTML=`<div class="wrap"><div class="stagew">
    ${backBar()}
    <h1 class="t disp">${esc(CARDS.title||"Flashcards")}</h1>
    <div class="meta">Card ${ci+1} of ${N} · ${esc(CARDS.category||(curAsset&&curAsset.topic)||"")}</div>
    <div class="fc">
      <div class="cardbox"><div class="card3d ${flipped?'flip':''}" id="c3d">
        <div class="face front"><span class="kicker">Term</span><div class="term disp">${esc(c.front)}</div></div>
        <div class="face back"><span class="kicker">Definition</span><div class="term">${esc(c.back)}</div></div>
      </div></div>
      <div class="flip-hint">Tap the card to flip</div>
      <div class="fc-nav">
        <button class="btn" id="prev" ${ci===0?"disabled":""}>← Prev</button>
        <button class="btn primary" id="flip">${flipped?"Show term":"Reveal definition"}</button>
        <button class="btn" id="nextc" ${ci>=N-1?"disabled":""}>Next →</button>
      </div>
    </div>
  </div></div>`;
  wireBack();
  document.getElementById("c3d").onclick=()=>{flipped=!flipped;render();};
  document.getElementById("flip").onclick=(e)=>{e.stopPropagation();flipped=!flipped;render();};
  document.getElementById("prev").onclick=()=>{if(ci>0){ci--;flipped=false;render();}};
  document.getElementById("nextc").onclick=()=>{if(ci<N-1){ci++;flipped=false;render();}};
}

/* ================= SESSION DRAWER ================= */
function toggleSession(a){
  const i=SESSION.items.findIndex(x=>x.path===a.path);
  if(i>=0) SESSION.items.splice(i,1);
  else SESSION.items.push({path:a.path,title:a.title,type:a.type||"quiz",topic:a.topic||"",count:a.count||0,weight:1});
  saveSession();
  if(drawer.classList.contains("open")) renderDrawer();
}
function paintSessBtn(){
  const n=SESSION.items.length;
  document.getElementById("sessN").textContent=n;
  document.getElementById("sessOpen").classList.toggle("empty",n===0);
}
const drawer=document.getElementById("drawer"), scrim=document.getElementById("scrim");
function openDrawer(){ drawer.classList.add("open"); scrim.classList.add("open"); renderDrawer(); }
function closeDrawer(){ drawer.classList.remove("open"); scrim.classList.remove("open"); }
document.getElementById("sessOpen").onclick=openDrawer;
document.getElementById("sessClose").onclick=closeDrawer;
scrim.onclick=closeDrawer;

function renderDrawer(){
  const body=document.getElementById("dbody");
  const items=SESSION.items;
  const nQ=items.filter(i=>i.type==="quiz").length, nC=items.filter(i=>i.type==="flashcards").length;
  const scoredQ=items.filter(i=>i.type==="quiz").reduce((s,i)=>s+(i.count||0),0);
  document.getElementById("statMix").textContent=`${nQ} / ${nC}`;
  document.getElementById("statQ").textContent=scoredQ;

  let inner=`<div class="fld"><label>Session name</label><input id="sessTitle" placeholder="e.g. AI Governance — Day 1" value="${esc(SESSION.title||"")}"><div class="hint">Quizzes are scored (game points, summed across the session). Flashcards are revision rounds — not scored.</div></div>`;

  if(!items.length){
    inner+=`<div class="empty-sess">No elements yet.<br>Go to the Library and tap <b>+ Session</b> on the quizzes and flashcards you want to chain together.</div>`;
  } else {
    inner+=items.map((it,idx)=>`
      <div class="selitem" data-idx="${idx}">
        <span class="ord">${idx+1}</span>
        <span class="badge ${it.type==='flashcards'?'cards':'quiz'}">${it.type==='flashcards'?'Cards':'Quiz'}</span>
        <div class="info"><div class="nm">${esc(it.title)}</div><div class="tp">${esc(it.topic||'')} · ${it.count||0} ${it.type==='flashcards'?'cards':'q'}</div></div>
        ${it.type==="quiz"?`<input class="wt" type="number" min="1" max="10" step="1" value="${it.weight||1}" title="Score weight">`:``}
        <div class="mv"><button data-mv="up" ${idx===0?'disabled':''}>▲</button><button data-mv="down" ${idx===items.length-1?'disabled':''}>▼</button></div>
        <button class="rm" title="Remove">✕</button>
      </div>`).join("");
  }
  body.innerHTML=inner;

  const tt=document.getElementById("sessTitle");
  if(tt) tt.oninput=()=>{ SESSION.title=tt.value; saveSession(); };
  body.querySelectorAll(".selitem").forEach(el=>{
    const idx=+el.dataset.idx;
    const up=el.querySelector('[data-mv="up"]'), dn=el.querySelector('[data-mv="down"]');
    if(up)up.onclick=()=>{ if(idx>0){ [SESSION.items[idx-1],SESSION.items[idx]]=[SESSION.items[idx],SESSION.items[idx-1]]; saveSession(); renderDrawer(); } };
    if(dn)dn.onclick=()=>{ if(idx<SESSION.items.length-1){ [SESSION.items[idx+1],SESSION.items[idx]]=[SESSION.items[idx],SESSION.items[idx+1]]; saveSession(); renderDrawer(); } };
    el.querySelector(".rm").onclick=()=>{ SESSION.items.splice(idx,1); saveSession(); renderDrawer(); if(view==="lib")renderLibrary(); };
    const wt=el.querySelector(".wt");
    if(wt)wt.onchange=()=>{ SESSION.items[idx].weight=Math.max(1,Math.min(10,parseInt(wt.value||"1",10))); saveSession(); };
  });
}
document.getElementById("sessClear").onclick=()=>{
  if(!SESSION.items.length) return;
  if(confirm("Clear all elements from this training session?")){ SESSION.items=[]; SESSION.title=""; saveSession(); renderDrawer(); if(view==="lib")renderLibrary(); }
};
document.getElementById("sessDownload").onclick=()=>{
  if(!SESSION.items.length){ alert("Add at least one quiz or flashcard set first."); return; }
  const title=(SESSION.title||"Training Session").trim();
  const id=title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+Date.now().toString(36);
  const out={
    id, title,
    created:new Date().toISOString(),
    scoring:"points",
    questionSeconds:(C.questionSeconds||20),
    items:SESSION.items.map(i=>({path:i.path,title:i.title,type:i.type,weight:i.type==="quiz"?(i.weight||1):0,count:i.count||0}))
  };
  const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=id+".session.json"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

/* ================= BOOT ================= */
(async function boot(){
  paintSessBtn(); syncSeg();
  if(await deepLink()) return;   // Workbench "Play" deep link
  await loadManifest();          // otherwise land on the Library
})();
</script>
</body>
</html>
