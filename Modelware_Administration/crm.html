<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Follow-up CRM</title>
<meta name="crm-build" content="6275d67050d2" data-built="21 Aug 2026" data-version="1.17.2">
<meta name="description" content="Show what needs follow-up today.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Follow-up CRM — visual system (C13)
   Light, cool paper. Colour is reserved for state, never decoration.
   Band three receives no colour at all: absence is drawn as absence.
   ============================================================ */
:root{
  --ground:#F7F8FA;
  --surface:#FFFFFF;
  --ink:#16202C;
  --muted:#66707D;
  --line:#E3E7EC;
  --accent:#155E9C;
  --accent-soft:#EAF1F8;
  --overdue:#B23A32;
  --overdue-soft:#FBEDEC;
  --void:#F1F3F6;          /* hatched absence ground */
  --ok:#2F6B4F;
  --warn:#8A6212;
  --radius:6px;
  --row:48px;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --shadow:0 12px 40px rgba(22,32,44,.16), 0 2px 6px rgba(22,32,44,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
.sidebar{
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
.brand .tag{
  margin-top:3px;font-family:var(--mono);font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted)
}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:1px}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;padding:8px 10px;border-radius:var(--radius);
  cursor:pointer;color:var(--ink);font-size:13.5px
}
.nav button:hover{background:var(--ground)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .key{
  margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted);
  border:1px solid var(--line);border-radius:3px;padding:0 4px
}
.nav button[aria-current="page"] .key{border-color:#C9DBEC}
.nav .count{
  margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--overdue);font-weight:600
}
.sidebar .foot{margin-top:auto;padding:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.ws-chip{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;
  letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:99px;
  border:1px solid var(--line);background:var(--ground)
}
.ws-chip.demo{color:var(--warn);border-color:#EADFC4;background:#FCF7EC}
.ws-chip.team{color:var(--accent);border-color:#C9DBEC;background:var(--accent-soft)}
.sync-dot{width:6px;height:6px;border-radius:99px;background:var(--muted);flex:none}
.sync-dot.ok{background:var(--ok)} .sync-dot.pending{background:var(--warn)} .sync-dot.err{background:var(--overdue)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(247,248,250,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:12px 22px;flex-wrap:wrap
}
.topbar h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.015em}
.topbar .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.spacer{margin-left:auto}
.content{padding:22px;max-width:1180px;width:100%}

/* ---------- controls ---------- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.seg button{
  border:0;background:none;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--muted)
}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);
  padding:6px 11px;cursor:pointer;font-size:13px
}
.btn:hover{border-color:#C9D2DB;background:#FCFDFE}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn.primary:hover{background:#12538B}
.btn.quiet{border-color:transparent;background:none;color:var(--muted)}
.btn.quiet:hover{background:var(--ground);color:var(--ink)}
.btn.danger{color:var(--overdue);border-color:#EBD3D1}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:3px 8px;font-size:12px}
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{
  border:1px solid var(--line);border-radius:var(--radius);padding:6px 9px;background:var(--surface);width:100%
}
input:focus,select:focus,textarea:focus,button:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent);outline-offset:1px
}
label.fld{display:block;margin-bottom:10px}
label.fld > span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
label.fld.chk{display:flex;align-items:center;gap:7px}
label.fld.chk > span{margin:0;font-size:13px;color:var(--fg)}
label.fld.chk > input{width:auto;margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- bands ---------- */
.band{margin-bottom:22px}
.band-head{
  display:flex;align-items:baseline;gap:9px;margin-bottom:8px;
  font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)
}
.band-head .n{font-weight:600;color:var(--ink)}
.band-overdue .band-head .n{color:var(--overdue)}
.band-list{display:flex;flex-direction:column;gap:6px}

.item{
  display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:9px 12px;min-height:var(--row);cursor:pointer
}
.item:hover{border-color:#C9D2DB}
.item.sel{outline:2px solid var(--accent);outline-offset:-1px}
.item .bar{width:3px;align-self:stretch;border-radius:2px;background:transparent;flex:none;margin:-9px 0 -9px -12px}
.band-overdue .item .bar{background:var(--overdue)}
.band-today .item .bar{background:var(--accent)}
.item .body{min-width:0;flex:1}
.item .t1{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t1 .co{color:var(--muted);font-weight:400}
.item .t2{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2 .late{color:var(--overdue);font-weight:500}
.item .acts{display:flex;gap:5px;flex:none}
.item .acts .btn{visibility:hidden}
.item:hover .acts .btn,.item.sel .acts .btn,.item:focus-within .acts .btn{visibility:visible}
@media (hover:none){.item .acts .btn{visibility:visible}}
/* band three is the one place the action IS the point — never hide it */
.band-none .item .acts .btn{visibility:visible}

/* band three: absence drawn as absence — no fill, no colour */
.band-none .void{
  border:1.5px dashed #CFD6DE;border-radius:var(--radius);padding:10px;background:transparent
}
.band-none .item{
  background:transparent;border:1px dashed #CFD6DE;
}
.band-none .item:hover{border-color:#AEB8C3}
.band-none .item .bar{background:transparent}
.hatch{
  height:16px;border-radius:3px;margin-top:4px;
  background-image:repeating-linear-gradient(135deg,#DDE2E8 0 1px,transparent 1px 7px);
  border:1px solid var(--void)
}
.band-none .item .t1{color:var(--ink)}
.band-none .item .t2{color:var(--muted)}

/* ---------- chips ---------- */
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{
  font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:99px;padding:1px 7px;color:var(--muted);
  background:var(--surface);white-space:nowrap;cursor:help
}
.chip.hot{color:var(--overdue);border-color:#EBD3D1;background:var(--overdue-soft)}
.chip.warn{color:var(--warn);border-color:#EADFC4;background:#FCF7EC}
.chip.plain{cursor:default}
.chip.owner{
  display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;
  border-radius:99px;background:var(--accent-soft);border-color:#C9DBEC;color:var(--accent);
  font-size:9.5px;font-weight:600;letter-spacing:0;cursor:default
}
.chip.filter{cursor:pointer}
.chip.filter[aria-pressed="true"]{background:var(--accent-soft);border-color:#C9DBEC;color:var(--accent)}

/* ---------- empty / notes ---------- */
.empty{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
  padding:20px;color:var(--muted)
}
.empty strong{color:var(--ink);font-weight:600}
.note{font-size:12px;color:var(--muted);margin-top:6px}

/* ---------- popover ---------- */
.pop{
  /* above the slide-over panel (71) — popovers are commonly opened FROM it */
  position:fixed;z-index:78;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;width:280px;
  overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain
}
.pop h4{margin:0 0 8px;font-size:12px;font-family:var(--mono);letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);font-weight:500}
.pop .quick{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.pop .quick .btn{flex:1;min-width:56px;text-align:center}
/* the interaction kinds are words of very different lengths — sizing them
   equally clipped "WhatsApp". Let them size to their own label and wrap. */
.pop .quick.kinds .btn{flex:0 0 auto;min-width:0;padding:5px 10px}
.pop .kbd{font-family:var(--mono);font-size:10px;color:var(--muted)}
.picker{margin:8px 0 4px;max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius)}
.pick{display:flex;gap:9px;align-items:center;padding:7px 10px;cursor:pointer;
  border-bottom:1px solid var(--line)}
.pick:last-child{border-bottom:0}
.pick:hover{background:var(--ground)}
.pick.on{background:var(--accent-soft)}
.pick .p1{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .p2{font-family:var(--mono);font-size:11px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the commit action stays reachable however tall the form gets */
.pop-foot{
  display:flex;gap:6px;justify-content:flex-end;margin-top:10px;
  position:sticky;bottom:-12px;background:var(--surface);
  padding:10px 0 12px;border-top:1px solid var(--line)
}

/* ---------- slide-over ---------- */
.scrim{position:fixed;inset:0;background:rgba(22,32,44,.28);z-index:70}
.panel{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);
  border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:71;
  display:flex;flex-direction:column;animation:slide .18s ease-out
}
@keyframes slide{from{transform:translateX(18px);opacity:.6}to{transform:none;opacity:1}}
.panel header{padding:16px 18px;border-bottom:1px solid var(--line)}
.panel .scroll{overflow:auto;padding:16px 18px;flex:1}
.panel h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.panel .cohead{font-size:12.5px;color:var(--muted)}
.sec{margin-bottom:20px}
.sec > h4{
  margin:0 0 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);font-weight:500
}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:0;padding:0;border-left:1px solid var(--line);margin-left:5px}
.tl li{position:relative;padding:0 0 14px 16px}
.tl li::before{
  content:"";position:absolute;left:-4px;top:5px;width:7px;height:7px;border-radius:99px;
  background:var(--surface);border:1.5px solid #C2CAD3
}
.tl .when{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tl .what{font-size:13px}
.fu{
  border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;margin-bottom:6px;
  display:flex;gap:10px;align-items:center
}
.fu.od{border-color:#EBD3D1;background:var(--overdue-soft)}
.fu .body{flex:1;min-width:0}
.fu .t2{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* ---------- pipeline ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:transparent;display:flex;flex-direction:column;min-width:0}
.col > .h{
  display:flex;align-items:baseline;gap:8px;padding:0 2px 8px;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)
}
.col > .h .n{color:var(--ink);font-weight:600}
.col .drop{display:flex;flex-direction:column;gap:8px;min-height:80px;border-radius:var(--radius);padding:2px}
.col .drop.over{background:var(--accent-soft);outline:1.5px dashed #9DBBD6}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 11px;cursor:pointer
}
.card:hover{border-color:#C9D2DB}
.card.dragging{opacity:.45}
.card .co{font-size:11.5px;color:var(--muted)}
.card .nm{font-size:13.5px;font-weight:500;margin-top:1px}
.card .val{font-family:var(--mono);font-size:12px;margin-top:4px}
.card .next{
  font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;
  padding-top:6px;border-top:1px solid var(--line);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.card .next.od{color:var(--overdue)}
.card .next.none{
  color:var(--muted);border-top:1px dashed #CFD6DE;
  background-image:repeating-linear-gradient(135deg,#E8ECF1 0 1px,transparent 1px 7px)
}
.card .foot{display:flex;align-items:center;gap:5px;margin-top:8px;flex-wrap:wrap}

/* ---------- tables ---------- */
table.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.tbl th{
  text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line)
}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#FCFDFE}
.tbl td.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}

/* ---------- week ---------- */
.halves{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.pane > h3{margin:0 0 3px;font-size:14.5px;font-weight:600}
.pane > .sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:14px}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat .lab{font-size:13px}
.stat .v{font-family:var(--mono);font-size:15px;font-weight:600}
.stat .v.hot{color:var(--overdue)}
.trust{
  margin-top:12px;padding:10px 12px;border:1px dashed #CFD6DE;border-radius:var(--radius);
  font-size:12.5px;color:var(--muted)
}
.trust strong{color:var(--ink)}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- search ---------- */
.searchwrap{position:fixed;inset:0;z-index:80;background:rgba(22,32,44,.28);display:flex;justify-content:center;padding-top:12vh}
.searchbox{width:min(560px,92vw);height:max-content;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.searchbox input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:13px 15px;font-size:15px}
.searchbox input:focus{outline:none}
.results{max-height:52vh;overflow:auto}
.results .r{padding:9px 15px;cursor:pointer;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.results .r:last-child{border-bottom:0}
.results .r[aria-selected="true"]{background:var(--accent-soft)}
.results .r .k{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}

/* ---------- toast ---------- */
/* Toasts float above everything but must never intercept a click meant for the
   control underneath — only their own Undo button is interactive. */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:90;
  display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{
  background:var(--ink);color:#fff;border-radius:var(--radius);padding:8px 14px;font-size:13px;
  box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;max-width:90vw;
  pointer-events:none
}
.toast button{background:none;border:0;color:#9FC6EA;cursor:pointer;font-size:12.5px;
  text-decoration:underline;pointer-events:auto}
.toast.err{background:var(--overdue)}

/* ---------- the one animation (C13) ---------- */
@keyframes collapse{
  to{opacity:0;transform:translateX(14px);max-height:0;min-height:0;
     padding-top:0;padding-bottom:0;margin-bottom:-6px;border-width:0}
}
.item.done{animation:collapse .26s ease-in forwards;overflow:hidden;pointer-events:none}
@media (prefers-reduced-motion:reduce){
  .item.done{animation-duration:.01ms}
  .panel{animation:none}
}

/* ---------- mobile floor ---------- */
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{
    position:static;height:auto;flex-direction:row;align-items:center;gap:4px;
    overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:0 8px
  }
  .brand{border:0;padding:10px 8px 10px 10px;flex:none}
  .brand .tag{display:none}
  .nav{flex-direction:row;padding:8px 0;gap:2px}
  .nav .key{display:none}
  .sidebar .foot{display:none}
  .content{padding:14px}
  .topbar{padding:10px 14px}
  .halves{grid-template-columns:1fr}
  .item .acts .btn{visibility:visible}
  .row2{grid-template-columns:1fr}
  /* a rep in a car park needs the whole task, not an ellipsis */
  .item .t1,.item .t2{white-space:normal;overflow:visible}
  .toasts{left:0;right:0;transform:none;padding:0 12px;align-items:stretch}
  .toast{max-width:none}
}
@media (max-width:520px){
  .brand{display:none}
  .nav{width:100%;justify-content:space-between}
  .nav button{padding:8px 6px;font-size:13px}
}
.buildline{
  margin-top:9px;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;
  color:var(--muted);opacity:.75;cursor:help
}
.diag{margin:12px 0;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);overflow:hidden}
.dstep{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.dstep:last-child{border-bottom:0}
.dmark{font-family:var(--mono);font-weight:600;flex:none;width:14px;text-align:center}
.dstep.ok .dmark{color:var(--ok)}
.dstep.warn .dmark{color:var(--warn)}
.dstep.fail .dmark{color:var(--overdue)}
.dstep.fail{background:var(--overdue-soft)}
.dstep.warn{background:#FCF7EC}
.dlabel{font-weight:500}
.dstep.fail .dlabel{color:var(--overdue)}
.ddetail{color:var(--muted);font-size:12.6px;margin-top:2px;line-height:1.5}
.storage-banner{
  margin:10px 12px 0;padding:10px 11px;border-radius:var(--radius);
  border:1px solid #EBD3D1;background:var(--overdue-soft);font-size:12px;color:var(--ink)
}
.storage-banner .sb-title{font-weight:600;color:var(--overdue);margin-bottom:3px}
.storage-banner .sb-body{color:var(--muted);line-height:1.45}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hide{display:none !important}
</style>
</head>
<body>
<div id="root" class="app"></div>
<div id="layers"></div>
<div class="toasts" id="toasts"></div>

<!-- ============================================================
     CORE — pure logic, no DOM. The node regression harness in
     tests/harness.js extracts THIS script by id and executes it,
     so the tests run against exactly the code that ships.
     ============================================================ -->
<script id="crm-core">
(function (root) {
"use strict";

/* ---------------- dates: day-grained ISO strings, no times ---------------- */

function pad(n){ return n < 10 ? "0" + n : "" + n; }

function toISO(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }

function todayISO(now){ return toISO(now ? new Date(now) : new Date()); }

function parseISO(iso){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||""));
  if (!m) return null;
  return Date.UTC(+m[1], +m[2]-1, +m[3]);
}
function fromUTC(ms){
  var d = new Date(ms);
  return d.getUTCFullYear() + "-" + pad(d.getUTCMonth()+1) + "-" + pad(d.getUTCDate());
}
function addDays(iso, n){
  var t = parseISO(iso); if (t === null) return null;
  return fromUTC(t + n*86400000);
}
function daysBetween(a, b){           // b - a, in whole days
  var x = parseISO(a), y = parseISO(b);
  if (x === null || y === null) return null;
  return Math.round((y - x) / 86400000);
}
function dow(iso){                    // 0 Sun .. 6 Sat
  var t = parseISO(iso); if (t === null) return null;
  return new Date(t).getUTCDay();
}
function isWeekend(iso){ var d = dow(iso); return d === 0 || d === 6; }
function skipWeekend(iso){
  var d = dow(iso);
  if (d === 6) return addDays(iso, 2);
  if (d === 0) return addDays(iso, 1);
  return iso;
}
/* Quick-defer buttons skip weekends (C6). Typed dates do not. */
function deferBy(fromISO, n){ return skipWeekend(addDays(fromISO, n)); }

function startOfWeek(iso){            // Monday
  var d = dow(iso);
  return addDays(iso, d === 0 ? -6 : 1 - d);
}
function monthKey(iso){ return String(iso||"").slice(0,7); }

var MONTHS = ["january","february","march","april","may","june",
              "july","august","september","october","november","december"];
var DAYS   = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];

/* Natural shorthand: fri · +7 · 3 sep · tomorrow · 2026-09-03 · 03/09/2026 (day-first, ZA) */
function parseDateInput(str, today){
  var s = String(str == null ? "" : str).trim().toLowerCase();
  if (!s) return null;
  today = today || todayISO();

  if (s === "today" || s === "tod") return today;
  if (s === "tomorrow" || s === "tom" || s === "tmr") return addDays(today, 1);
  if (s === "yesterday") return addDays(today, -1);
  if (s === "next week") return addDays(today, 7);
  if (s === "next month") return addDays(today, 30);

  var m;
  if ((m = /^([+-])\s*(\d{1,3})\s*d?$/.exec(s)))                  // +7, -3, +14d
    return addDays(today, (m[1] === "-" ? -1 : 1) * (+m[2]));
  if ((m = /^(\d{1,3})\s*d$/.exec(s))) return addDays(today, +m[1]); // 7d

  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return parseISO(s) === null ? null : s;

  // weekday name -> next strictly-future occurrence
  for (var i = 0; i < DAYS.length; i++){
    if (s === DAYS[i] || s === DAYS[i].slice(0,3)){
      var cur = dow(today), delta = (i - cur + 7) % 7;
      return addDays(today, delta === 0 ? 7 : delta);
    }
  }

  function monthIndex(w){
    for (var j = 0; j < MONTHS.length; j++)
      if (MONTHS[j] === w || MONTHS[j].slice(0,3) === w.slice(0,3) && w.length >= 3) return j;
    return -1;
  }
  // "3 sep" / "3 september 2027" / "sep 3"
  if ((m = /^(\d{1,2})\s+([a-z]{3,9})\.?(?:\s+(\d{4}))?$/.exec(s)) ||
      (m = /^([a-z]{3,9})\.?\s+(\d{1,2})(?:\s+(\d{4}))?$/.exec(s) ) && (m = [m[0], m[2], m[1], m[3]])){
    var mi = monthIndex(m[2]), day = +m[1];
    if (mi >= 0 && day >= 1 && day <= 31){
      var yr = m[3] ? +m[3] : +today.slice(0,4);
      var cand = yr + "-" + pad(mi+1) + "-" + pad(day);
      if (!m[3] && parseISO(cand) < parseISO(today)) cand = (yr+1) + "-" + pad(mi+1) + "-" + pad(day);
      return cand;
    }
  }
  // day-first slashes: 03/09 or 03/09/2026 or 3-9-2026
  if ((m = /^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/.exec(s))){
    var dd = +m[1], mm = +m[2];
    if (dd >= 1 && dd <= 31 && mm >= 1 && mm <= 12){
      var y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : +today.slice(0,4);
      var c2 = y + "-" + pad(mm) + "-" + pad(dd);
      if (!m[3] && parseISO(c2) < parseISO(today)) c2 = (y+1) + "-" + pad(mm) + "-" + pad(dd);
      return c2;
    }
  }
  // bare day-of-month -> next occurrence of that day
  if ((m = /^(\d{1,2})$/.exec(s))){
    var d0 = +m[1];
    if (d0 >= 1 && d0 <= 31){
      var yy = +today.slice(0,4), mo = +today.slice(5,7);
      var c3 = yy + "-" + pad(mo) + "-" + pad(d0);
      if (parseISO(c3) === null || parseISO(c3) < parseISO(today)){
        mo += 1; if (mo > 12){ mo = 1; yy += 1; }
        c3 = yy + "-" + pad(mo) + "-" + pad(d0);
      }
      return parseISO(c3) === null ? null : c3;
    }
  }
  return null;
}

/* ---------------- formatting ---------------- */

var CUR = { ZAR:{ sym:"R",  code:"ZAR" }, USD:{ sym:"$", code:"USD" },
            EUR:{ sym:"€", code:"EUR" }, GBP:{ sym:"£", code:"GBP" } };

function fmtMoney(v, cur){
  if (v == null || v === "" || isNaN(v)) return "—";
  var c = CUR[cur] || { sym: (cur || "") + " " };
  var n = Math.round(+v);
  var s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "\u202f");
  return (n < 0 ? "-" : "") + c.sym + "\u00a0" + s;
}
function fmtDay(iso){
  var t = parseISO(iso); if (t === null) return "—";
  var d = new Date(t);
  return d.getUTCDate() + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()];
}
function fmtDayYear(iso){
  var t = parseISO(iso); if (t === null) return "—";
  return fmtDay(iso) + " " + new Date(t).getUTCFullYear();
}
function fmtFull(iso){
  var t = parseISO(iso); if (t === null) return "—";
  var d = new Date(t);
  return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getUTCDay()] + " " + fmtDayYear(iso);
}
function fmtMonth(key){
  var m = /^(\d{4})-(\d{2})$/.exec(String(key||""));
  if (!m) return "No close date";
  return ["January","February","March","April","May","June","July",
          "August","September","October","November","December"][+m[2]-1] + " " + m[1];
}
function relDays(fromISO, toISO_){
  var n = daysBetween(fromISO, toISO_);
  if (n === null) return "";
  if (n === 0) return "today";
  if (n === 1) return "tomorrow";
  if (n === -1) return "1 day late";
  if (n < 0) return (-n) + " days late";
  return "in " + n + " days";
}

/* ---------------- ids ---------------- */

var _seq = 0;
function uid(prefix, now){
  _seq = (_seq + 1) % 100000;
  var t = (now == null ? Date.now() : now).toString(36);
  var r = Math.random().toString(36).slice(2, 7);
  return prefix + "_" + t + _seq.toString(36) + r;
}

/* ---------------- fold: events -> state ---------------- */

function sortEvents(events){
  return events.slice().sort(function (a, b){
    if (a.ts < b.ts) return -1;
    if (a.ts > b.ts) return 1;
    if ((a.seq|0) !== (b.seq|0)) return (a.seq|0) - (b.seq|0);
    return String(a.id) < String(b.id) ? -1 : String(a.id) > String(b.id) ? 1 : 0;
  });
}

function assign(target, src, keys){
  if (!src) return target;
  for (var i = 0; i < keys.length; i++){
    var k = keys[i];
    if (Object.prototype.hasOwnProperty.call(src, k) && src[k] !== undefined) target[k] = src[k];
  }
  return target;
}

/* contactId is the deal's PARTY — who the deal is actually with. It matters
   most for private buyers, where the "company" is only a filing bucket and the
   person is the customer. See dealParty(). */
var DEAL_FIELDS = ["companyId","name","owner","stage","value","currency",
                   "expectedCloseDate","notes","contactId","commissionRate",
                   "partnerCompanyId","commissionable"];

/* Money is rounded to cents on the way IN, once, so nothing downstream has to
   wonder whether 0.1 + 0.2 has crept into a balance. */
function money(v){
  if (v == null || v === "") return 0;
  var n = +String(v).replace(/[^0-9.\-]/g, "");
  return isFinite(n) ? Math.round(n * 100) / 100 : 0;
}

function foldEvents(events){
  var st = { companies:{}, contacts:{}, deals:{}, followups:{}, interactions:{},
             invoices:{}, payments:{},
             clients:{}, lastTs:null, eventCount:0 };
  var ordered = sortEvents(events || []);

  for (var i = 0; i < ordered.length; i++){
    var e = ordered[i]; if (!e || !e.type) continue;
    var p = e.payload || {};
    st.lastTs = e.ts; st.eventCount++;

    switch (e.type){

      case "company.created":
        st.companies[p.companyId] = { id:p.companyId, name:p.name || "(unnamed)",
          domain:p.domain || "", notes:p.notes || "",
          /* A holder is a filing bucket, not a customer — "Individual" is the
             one everybody needs. Deals inside it belong to the PERSON, so the
             app shows the contact's name wherever it would show a company's. */
          isHolder: !!p.isHolder,
          /* A partner is somebody we reach customers THROUGH: a reseller, a JV,
             a consultancy that owns the account. They are a real company with a
             real relationship, so they are not a flag on a deal — but the
             pipeline must not read as though the partner were the buyer. */
          isPartner: !!p.isPartner,
          createdAt:e.ts };
        break;
      case "company.updated":
        if (st.companies[p.companyId])
          assign(st.companies[p.companyId], p, ["name","domain","notes","isHolder","isPartner"]);
        break;
      /* Two records for one customer is not a fact about the business, it is a
         data-entry accident — so this folds one into the other rather than
         deleting anything.

         Only a MARK is set here; the re-pointing happens in one pass at the end.
         That is what makes it undoable: nothing has been rewritten yet, so
         company.unmerged is a clean cancellation rather than a guess at which
         deals came from where. */
      case "company.merged":
        if (st.companies[p.fromId] && st.companies[p.intoId] && p.fromId !== p.intoId)
          st.companies[p.fromId].mergedInto = p.intoId;
        break;
      case "company.unmerged":
        if (st.companies[p.fromId]) st.companies[p.fromId].mergedInto = null;
        break;

      case "contact.created":
        st.contacts[p.contactId] = { id:p.contactId, companyId:p.companyId || null,
          name:p.name || "(unnamed)", email:p.email || "", phone:p.phone || "",
          role:p.role || "", createdAt:e.ts };
        break;
      case "contact.updated":
        if (st.contacts[p.contactId]) assign(st.contacts[p.contactId], p, ["companyId","name","email","phone","role"]);
        break;

      case "deal.created":
        st.deals[p.dealId] = {
          id:p.dealId, companyId:p.companyId || null, name:p.name || "(unnamed)",
          owner:p.owner || e.actor, stage:p.stage || "lead",
          value:(p.value == null || p.value === "") ? null : +p.value,
          currency:p.currency || "ZAR",
          contactId:p.contactId || null,
          expectedCloseDate:p.expectedCloseDate || null,
          notes:p.notes || "",
          /* Some work reaches the customer through somebody else: a reseller, a
             JV partner, a consultancy that owns the relationship. The deal still
             belongs to the END CUSTOMER — that is whose name has to appear in
             the pipeline — but the people on the thread work for the partner.
             So the partner is a second company on the deal, not a substitute
             for the first, and partner contacts stay filed under their own
             employer where they belong. */
          partnerCompanyId:p.partnerCompanyId || null,
          /* Not every deal pays commission. A deal the director carries himself
             has no earner, and pretending it does would put money in somebody's
             column that nobody is owed. Default true so nothing existing moves. */
          commissionable: p.commissionable === false ? false : true,
          /* Per deal, by ruling. Rates differ by what is being sold, so there is
             no sensible per-person default to inherit. */
          commissionRate: p.commissionRate == null || p.commissionRate === "" ? null : +p.commissionRate,
          status:"open", outcome:null, closedAt:null, lossReason:"",
          createdAt:e.ts, createdDay:String(e.ts).slice(0,10),
          stageSince:String(e.ts).slice(0,10),
          declinedNextStepAt:null
        };
        break;
      case "deal.updated":
        if (st.deals[p.dealId]) assign(st.deals[p.dealId], p, DEAL_FIELDS);
        break;
      case "deal.stage_changed":
        if (st.deals[p.dealId]){
          st.deals[p.dealId].stage = p.to;
          st.deals[p.dealId].stageSince = String(e.ts).slice(0,10);
        }
        break;
      case "deal.closed":
        if (st.deals[p.dealId]){
          var dl = st.deals[p.dealId];
          dl.status = "closed"; dl.outcome = p.outcome === "won" ? "won" : "lost";
          dl.closedAt = String(e.ts).slice(0,10); dl.lossReason = p.reason || "";
        }
        break;
      case "deal.reopened":
        if (st.deals[p.dealId]){
          st.deals[p.dealId].status = "open";
          st.deals[p.dealId].outcome = null; st.deals[p.dealId].closedAt = null;
        }
        break;

      /* Deleting is NOT losing. A lost deal is a business outcome and belongs in
         the win rate, the forecast history and the week retro. A duplicate typed
         in twice is not an outcome — it is a typo, and filing it as a loss would
         quietly libel the pipeline. So this is its own event.

         The log stays append-only: this is a tombstone, not an erasure. The
         event is still on disk, and `deal.restored` puts the deal back. What it
         buys is that every consumer downstream — bands, forecast, coverage,
         flags, export, search — sees a smaller st.deals and needs no change. */
      case "deal.deleted":
        if (st.deals[p.dealId]){
          st.deals[p.dealId].deleted = true;
          st.deals[p.dealId].deletedAt = String(e.ts).slice(0,10);
          st.deals[p.dealId].deletedBy = e.actor;
          st.deals[p.dealId].deleteReason = p.reason || "";
        }
        break;
      case "deal.restored":
        if (st.deals[p.dealId]){
          st.deals[p.dealId].deleted = false;
          st.deals[p.dealId].deletedAt = null;
          st.deals[p.dealId].deleteReason = "";
        }
        break;

      /* ---- settlement (C20) ----
         Selling stops at Won. Getting paid is a different lifecycle with its own
         clock, and it is the one that decides whether anybody earns anything —
         so it is tracked ALONGSIDE the stage, never as more stages. Folding
         payment into the pipeline would put a signed deal back into the weighted
         forecast and quietly corrupt the win rate.

         One deal carries MANY invoices: MetLife wants two proformas off one
         deal, MCB settled two invoices against one PO. Amounts are held as
         `net` (excluding VAT), `passThrough` (the books and exam coupons inside
         that net, which are somebody else's revenue) and `vat`. The customer
         owes net + vat; commission is earned on net − passThrough. */
      case "invoice.raised":
        st.invoices[p.invoiceId] = {
          id:p.invoiceId, dealId:p.dealId, number:p.number || "",
          issuedOn:p.issuedOn || String(e.ts).slice(0,10),
          dueDate:p.dueDate || null,
          currency:p.currency || "ZAR",
          net:money(p.net), passThrough:money(p.passThrough), vat:money(p.vat),
          note:p.note || "", status:"open", cancelReason:"",
          raisedBy:e.actor, ts:e.ts
        };
        break;
      case "invoice.updated":
        if (st.invoices[p.invoiceId]){
          assign(st.invoices[p.invoiceId], p,
                 ["number","issuedOn","dueDate","currency","note"]);
          ["net","passThrough","vat"].forEach(function (k){
            if (p[k] !== undefined) st.invoices[p.invoiceId][k] = money(p[k]);
          });
        }
        break;
      case "invoice.cancelled":
        if (st.invoices[p.invoiceId]){
          st.invoices[p.invoiceId].status = "cancelled";
          st.invoices[p.invoiceId].cancelReason = p.reason || "";
        }
        break;
      case "payment.received":
        st.payments[p.paymentId] = {
          id:p.paymentId, invoiceId:p.invoiceId,
          receivedOn:p.receivedOn || String(e.ts).slice(0,10),
          amount:money(p.amount), reference:p.reference || "",
          actor:e.actor, ts:e.ts
        };
        break;
      case "payment.removed":                    // keyed in wrong — not a refund
        if (st.payments[p.paymentId]) delete st.payments[p.paymentId];
        break;

      case "interaction.logged":
        st.interactions[p.interactionId] = {
          id:p.interactionId, subjectType:p.subjectType, subjectId:p.subjectId,
          kind:p.kind || "note", occurredAt:p.occurredAt || String(e.ts).slice(0,10),
          summary:p.summary || "", contactId:p.contactId || null,
          actor:e.actor, ts:e.ts
        };
        break;
      case "interaction.deleted":
        delete st.interactions[p.interactionId];
        break;

      case "followup.created":
        st.followups[p.followupId] = {
          id:p.followupId, subjectType:p.subjectType || "deal", subjectId:p.subjectId,
          owner:p.owner || e.actor, dueDate:p.dueDate, originalDue:p.dueDate,
          what:p.what || "Follow up", status:"open",
          pushCount:0, completedAt:null, cancelReason:"",
          createdAt:e.ts, createdDay:String(e.ts).slice(0,10)
        };
        if (p.subjectType === "deal" && st.deals[p.subjectId]) st.deals[p.subjectId].declinedNextStepAt = null;
        break;
      case "followup.rescheduled":
        if (st.followups[p.followupId]){
          var fu = st.followups[p.followupId];
          fu.dueDate = p.to;
          fu.pushCount++;
          fu.lastPushedAt = String(e.ts).slice(0,10);
        }
        break;
      case "followup.updated":
        if (st.followups[p.followupId]) assign(st.followups[p.followupId], p, ["what","owner","dueDate"]);
        break;
      case "followup.completed":
        if (st.followups[p.followupId]){
          st.followups[p.followupId].status = "done";
          st.followups[p.followupId].completedAt = p.completedAt || String(e.ts).slice(0,10);
        }
        break;
      case "followup.cancelled":
        if (st.followups[p.followupId]){
          st.followups[p.followupId].status = "cancelled";
          st.followups[p.followupId].cancelReason = p.reason || "";
          st.followups[p.followupId].completedAt = String(e.ts).slice(0,10);
        }
        break;
      case "followup.declined":                        // C8 "No next step yet"
        if (p.subjectType === "deal" && st.deals[p.subjectId])
          st.deals[p.subjectId].declinedNextStepAt = String(e.ts).slice(0,10);
        break;

      /* Which build each person is actually running. One event per person per
         deploy — not per load — so it costs almost nothing and answers
         "is everyone on the same version?" from anyone's screen. */
      case "client.build":
        st.clients[e.actor] = { user:e.actor, build:p.build || "", version:p.version || "",
                                builtAt:p.builtAt || "", seenAt:e.ts };
        break;

      default: break;                                   // unknown types ignored, never fatal
    }
  }

  /* Sweep the tombstones. Done once, here, rather than filtered at each of the
     dozen places that read st.deals — because the one that gets forgotten is
     the one that resurrects a deleted deal in the forecast six weeks later.
     A deleted deal's follow-ups go with it, or Today keeps chasing a ghost. */
  /* Resolve merged companies. Chains (A→B, B→C) are followed to the end, and a
     cycle is broken rather than hung on — a wrong answer beats a frozen tab. */
  st.mergedCompanies = {};
  var mergeTarget = function (id){
    var seen = {}, cur = id;
    while (st.companies[cur] && st.companies[cur].mergedInto && !seen[cur]){
      seen[cur] = true; cur = st.companies[cur].mergedInto;
    }
    return cur;
  };
  /* A→B→A would sweep BOTH records away and orphan every deal on them, which
     is far worse than the duplicate it was trying to fix. Break the cycle by
     abandoning the merges that form it; two visible companies is a problem
     someone can see and fix. */
  Object.keys(st.companies).forEach(function (k){
    if (!st.companies[k].mergedInto) return;
    var seen = {}, cur = k;
    while (st.companies[cur] && st.companies[cur].mergedInto){
      if (seen[cur]){ st.companies[k].mergedInto = null; return; }
      seen[cur] = true; cur = st.companies[cur].mergedInto;
    }
  });
  var anyMerge = Object.keys(st.companies).some(function (k){ return !!st.companies[k].mergedInto; });
  if (anyMerge){
    /* Remember where things lived before the merge. Folding a one-person
       "company" into the Individual holder is the common case, and the deal
       must keep pointing at that person or the pipeline card goes back to
       saying "Individual" for everybody. */
    var origCo = {};
    Object.keys(st.contacts).forEach(function (k){ origCo[k] = st.contacts[k].companyId; });

    Object.keys(st.deals).forEach(function (k){
      var d = st.deals[k];
      if (!d.companyId) return;
      var was = d.companyId, now = mergeTarget(was);
      d.companyId = now;
      if (was !== now && !d.contactId && st.companies[now] && st.companies[now].isHolder){
        var from = Object.keys(st.contacts).filter(function (c){ return origCo[c] === was; });
        if (from.length === 1) d.contactId = from[0];
      }
    });
    Object.keys(st.contacts).forEach(function (k){
      var c = st.contacts[k];
      if (c.companyId) c.companyId = mergeTarget(c.companyId);
    });
    Object.keys(st.companies).forEach(function (k){
      if (!st.companies[k].mergedInto) return;
      st.mergedCompanies[k] = st.companies[k];
      delete st.companies[k];
    });
  }

  st.deletedDeals = {};
  Object.keys(st.deals).forEach(function (k){
    if (!st.deals[k].deleted) return;
    st.deletedDeals[k] = st.deals[k];
    delete st.deals[k];
  });
  if (Object.keys(st.deletedDeals).length){
    Object.keys(st.followups).forEach(function (k){
      var f = st.followups[k];
      if (f.subjectType === "deal" && st.deletedDeals[f.subjectId]) delete st.followups[k];
    });
    Object.keys(st.interactions).forEach(function (k){
      var x = st.interactions[k];
      if (x.subjectType === "deal" && st.deletedDeals[x.subjectId]) delete st.interactions[k];
    });
  }
  return st;
}

/* ---------------- derived views (computed, never stored) ---------------- */

function openFollowups(st){
  var out = [];
  for (var k in st.followups){ var f = st.followups[k]; if (f.status === "open") out.push(f); }
  return out;
}
function followupsFor(st, subjectId){
  var out = [];
  for (var k in st.followups) if (st.followups[k].subjectId === subjectId) out.push(st.followups[k]);
  return out.sort(function(a,b){ return a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : 0; });
}
function openFollowupsFor(st, subjectId){
  return followupsFor(st, subjectId).filter(function(f){ return f.status === "open"; });
}
function interactionsFor(st, subjectId){
  var out = [];
  for (var k in st.interactions) if (st.interactions[k].subjectId === subjectId) out.push(st.interactions[k]);
  return out.sort(function(a,b){
    if (a.occurredAt !== b.occurredAt) return a.occurredAt < b.occurredAt ? 1 : -1;
    return a.ts < b.ts ? 1 : -1;
  });
}
/* Everything ever logged against a company, across all of its deals, newest
   first. Interactions hang off DEALS — which is right, a conversation is about
   something — but it means the account view was only ever one deal's slice.
   Where several people at one customer are in play (Gowri on the invoice, Nitin
   on the India training) nobody could see the account as a whole. */
function interactionsForCompany(st, companyId){
  var mine = {}, via = {};
  Object.keys(st.deals).forEach(function (k){
    if (st.deals[k].companyId === companyId) mine[k] = st.deals[k];
    /* A partner's own page has to show the work it brought in, or the only
       record of a reseller relationship is scattered across other companies'
       deals and the partner looks like it has gone quiet when it has not. */
    else if (st.deals[k].partnerCompanyId === companyId){ mine[k] = st.deals[k]; via[k] = true; }
  });
  var out = [];
  Object.keys(st.interactions).forEach(function (k){
    var x = st.interactions[k];
    if (x.subjectType !== "deal" || !mine[x.subjectId]) return;
    out.push({ ix:x, deal:mine[x.subjectId], asPartner: !!via[x.subjectId],
               contact: x.contactId ? st.contacts[x.contactId] : null });
  });
  return out.sort(function (a, b){
    if (a.ix.occurredAt !== b.ix.occurredAt) return a.ix.occurredAt < b.ix.occurredAt ? 1 : -1;
    return a.ix.ts < b.ix.ts ? 1 : -1;
  });
}

/* When email was last brought in, and how far it reached.

   Two different facts, and the gap between them is the useful one. "Brought in
   at 08:44" says the job ran; "covers mail to 21 Aug" says how current the CRM
   actually is. A run that pulled nothing still ran, and a run that pulled
   plenty can still be a week behind the inbox.

   Derived, not stored: interactions imported from mail carry an id derived from
   the message id (ix_mail_…), so the log already knows this and every past
   import counts without anybody having recorded a marker at the time. */
function mailWatermark(st){
  var out = { ran:null, coversTo:null, count:0, lastRunCount:0 };
  var runs = {};
  Object.keys(st.interactions || {}).forEach(function (k){
    if (k.indexOf("ix_mail_") !== 0) return;
    var x = st.interactions[k];
    out.count++;
    if (!out.ran || String(x.ts) > out.ran) out.ran = String(x.ts);
    if (!out.coversTo || x.occurredAt > out.coversTo) out.coversTo = x.occurredAt;
    var day = String(x.ts).slice(0, 16);            // same minute = same import
    runs[day] = (runs[day] || 0) + 1;
  });
  if (out.ran) out.lastRunCount = runs[String(out.ran).slice(0, 16)] || 0;
  return out;
}

function lastContact(st, dealId){
  var ix = interactionsFor(st, dealId);
  return ix.length ? ix[0].occurredAt : null;
}
function openDeals(st){
  var out = [];
  for (var k in st.deals) if (st.deals[k].status === "open") out.push(st.deals[k]);
  return out;
}
/* Who a deal is WITH, as it should be read on screen.

   The CRM files everything under a company, which is right for a company and
   wrong for a private buyer — a person is not an organisation, and a card
   reading "Individual" for six different people is useless. So a company can be
   marked a holder: a filing bucket. Deals inside one are labelled by their
   contact, and everything downstream — pipeline cards, the deal panel, search,
   the CSV export — goes through here so they cannot disagree. */
function dealParty(st, deal){
  if (!deal) return { name:"", isIndividual:false, companyName:"" };
  var co = st.companies[deal.companyId];
  var coName = co ? co.name : "";
  if (co && co.isHolder){
    var ct = deal.contactId ? st.contacts[deal.contactId] : null;
    if (!ct){
      /* fall back to the only contact filed in the bucket for this deal, if the
         deal never had one pinned — better a name than the bucket's label */
      var here = Object.keys(st.contacts).map(function (k){ return st.contacts[k]; })
        .filter(function (c){ return c.companyId === deal.companyId; });
      if (here.length === 1) ct = here[0];
    }
    if (ct) return { name:ct.name, isIndividual:true, companyName:coName, contact:ct };
  }
  return { name:coName, isIndividual:false, companyName:coName };
}

function subjectLabel(st, type, id){
  if (type === "deal"){
    var d = st.deals[id]; if (!d) return "(deleted deal)";
    return { company:dealParty(st, d).name, title:d.name, deal:d };
  }
  if (type === "company"){
    var co = st.companies[id];
    return { company:(co ? co.name : "(deleted company)"), title:"", deal:null };
  }
  var ct = st.contacts[id];
  var pc = ct && st.companies[ct.companyId];
  return { company:(pc ? pc.name : ""), title:(ct ? ct.name : "(deleted contact)"), deal:null };
}

/* ---------------- flags (C11 + C14a) ---------------- */

var FLAG_RULES = {
  "Never contacted":  "The deal exists but no interaction has ever been logged against it.",
  "No next step":     "The deal is open and has no open follow-up.",
  "Overdue":          "An open follow-up on this deal was due before today.",
  "Pushed 3+":        "A follow-up on this deal has been rescheduled at or above the configured push threshold.",
  "Silent 30d":       "No interaction has been logged on this deal within the configured silent window.",
  "Stalled":          "The deal has sat in the same stage beyond the configured stalled window.",
  "Close date passed":"The deal is open but its expected close date is in the past.",
  "Not invoiced":     "The deal was won but no invoice has been raised against it.",
  "Payment overdue":  "An invoice on this deal is past its due date with money still outstanding.",
  "No due date":      "An invoice with money outstanding has no due date, so nothing can call it late."
};
var FLAG_TONE = {
  "Never contacted":"warn", "No next step":"warn", "Overdue":"hot",
  "Pushed 3+":"warn", "Silent 30d":"warn", "Stalled":"warn", "Close date passed":"hot",
  "Not invoiced":"hot", "Payment overdue":"hot", "No due date":"warn"
};
function flagRule(name, cfg){
  var t = (cfg && cfg.thresholds) || {};
  switch(name){
    case "Pushed 3+":  return "Rescheduled " + (t.pushedCount||3) + " or more times.";
    case "Silent 30d": return "No interaction logged in " + (t.silentDays||30) + " days.";
    case "Stalled":    return "Same stage for " + (t.stalledDays||45) + "+ days.";
    default: return FLAG_RULES[name] || "";
  }
}
function flagLabel(name, cfg){
  var t = (cfg && cfg.thresholds) || {};
  if (name === "Pushed 3+")  return "Pushed " + (t.pushedCount||3) + "+";
  if (name === "Silent 30d") return "Silent " + (t.silentDays||30) + "d";
  return name;
}

function computeFlags(st, cfg, today){
  today = today || todayISO();
  var t = (cfg && cfg.thresholds) || {};
  var pushedN = t.pushedCount == null ? 3 : t.pushedCount;
  var silentN = t.silentDays  == null ? 30 : t.silentDays;
  var stallN  = t.stalledDays == null ? 45 : t.stalledDays;
  var byDeal = {};

  openDeals(st).forEach(function (d){
    var f = [];
    var ix = interactionsFor(st, d.id);
    var ofs = openFollowupsFor(st, d.id);

    if (ix.length === 0) f.push("Never contacted");
    if (ofs.length === 0) f.push("No next step");
    if (ofs.some(function(x){ return daysBetween(today, x.dueDate) < 0; })) f.push("Overdue");
    if (ofs.some(function(x){ return x.pushCount >= pushedN; })) f.push("Pushed 3+");
    if (ix.length > 0 && daysBetween(ix[0].occurredAt, today) >= silentN) f.push("Silent 30d");
    if (d.stageSince && daysBetween(d.stageSince, today) >= stallN) f.push("Stalled");
    if (d.expectedCloseDate && daysBetween(today, d.expectedCloseDate) < 0) f.push("Close date passed");

    byDeal[d.id] = f;
  });

  /* Settlement flags run over CLOSED-WON deals too — which the loop above
     deliberately skips, because a won deal has left the pipeline. It has not
     left the business: unpaid is exactly the state nobody notices, and it is
     the one that decides whether anyone gets paid. */
  Object.keys(st.deals).forEach(function (k){
    var d = st.deals[k];
    var invs = invoicesFor(st, d.id);
    var f = byDeal[d.id] || [];
    var won = d.status === "closed" && d.outcome === "won";

    if (won && !invs.length) f.push("Not invoiced");
    invs.forEach(function (inv){
      var s = invoiceState(st, inv);
      if (s.cancelled || s.balance <= 0) return;
      if (inv.dueDate && daysBetween(today, inv.dueDate) < 0){
        if (f.indexOf("Payment overdue") < 0) f.push("Payment overdue");
      } else if (!inv.dueDate){
        if (f.indexOf("No due date") < 0) f.push("No due date");
      }
    });
    if (f.length) byDeal[d.id] = f;
  });
  return byDeal;
}

/* ---------------- settlement, derived (C20) ----------------
   Every number here is computed from the events, never stored. The rules, all
   of them rulings rather than guesses:

     the customer owes   net + vat
     commission base     net − passThrough      (books and exam coupons are
                                                 somebody else's revenue)
     commission earned   ONLY once the invoice is settled in full — a part
                         payment earns nothing, by ruling
     currencies          never converted, never summed across (C16)
*/
function invoiceState(st, inv){
  var gross = round2(inv.net + inv.vat);
  var paid = 0;
  Object.keys(st.payments).forEach(function (k){
    if (st.payments[k].invoiceId === inv.id) paid += st.payments[k].amount; });
  paid = round2(paid);
  var balance = round2(gross - paid);
  var cancelled = inv.status === "cancelled";
  /* Settled means the balance is gone. A cent over is still settled — customers
     round, and a deal that can never be marked paid is worse than a cent. */
  var settled = !cancelled && gross > 0 && balance <= 0;
  return { invoice:inv, gross:gross, paid:paid, balance: cancelled ? 0 : balance,
           settled:settled, cancelled:cancelled,
           commissionBase: round2(inv.net - inv.passThrough) };
}

function invoicesFor(st, dealId){
  return Object.keys(st.invoices).map(function (k){ return st.invoices[k]; })
    .filter(function (i){ return i.dealId === dealId; })
    .sort(function (a,b){ return a.issuedOn < b.issuedOn ? 1 : a.issuedOn > b.issuedOn ? -1 : (a.id < b.id ? 1 : -1); });
}
function paymentsFor(st, invoiceId){
  return Object.keys(st.payments).map(function (k){ return st.payments[k]; })
    .filter(function (p){ return p.invoiceId === invoiceId; })
    .sort(function (a,b){ return a.receivedOn < b.receivedOn ? 1 : -1; });
}

/* What one deal is worth in cash, per currency, and what its owner has earned. */
function dealMoney(st, deal){
  /* A deal that earns nobody commission has no rate, whatever is stored on it —
     and the two states must stay distinguishable downstream, because "nobody is
     paid on this" and "somebody forgot to set the rate" want opposite responses
     from a human. */
  var noComm = deal.commissionable === false;
  var rate = noComm ? null : deal.commissionRate;
  var out = { invoiced:{}, paid:{}, outstanding:{}, overdue:{},
              commissionEarned:{}, commissionPending:{},
              rate:rate, owner:deal.owner, invoices:[],
              noCommission:noComm, hasRate: rate != null };
  invoicesFor(st, deal.id).forEach(function (inv){
    var s = invoiceState(st, inv);
    out.invoices.push(s);
    if (s.cancelled) return;
    var c = inv.currency || "ZAR";
    out.invoiced[c]    = round2((out.invoiced[c]    || 0) + s.gross);
    out.paid[c]        = round2((out.paid[c]        || 0) + s.paid);
    out.outstanding[c] = round2((out.outstanding[c] || 0) + s.balance);
    if (rate != null){
      var earned = round2(s.commissionBase * rate);
      if (s.settled) out.commissionEarned[c] = round2((out.commissionEarned[c] || 0) + earned);
      else           out.commissionPending[c] = round2((out.commissionPending[c] || 0) + earned);
    }
  });
  return out;
}

/* The whole book: what is owed, what is late, and what each person has earned.
   `asOf` decides late, so a retro can ask the question about a past date. */
function moneyBook(st, cfg, today, opts){
  today = today || todayISO();
  opts = opts || {};
  var scope = opts.scope === "team" ? "team" : "mine";
  var me = opts.user;
  var book = { invoiced:{}, paid:{}, outstanding:{}, overdue:{},
               earnedByUser:{}, pendingByUser:{}, overdueInvoices:[],
               undated:[], uninvoicedWon:[] };
  var add = function (bag, cur, amt){ bag[cur] = round2((bag[cur] || 0) + amt); };

  Object.keys(st.deals).forEach(function (k){
    var d = st.deals[k];
    if (scope !== "team" && d.owner !== me) return;
    var m = dealMoney(st, d);
    var invs = invoicesFor(st, d.id);

    if (d.status === "closed" && d.outcome === "won" && !invs.length)
      book.uninvoicedWon.push(d);

    m.invoices.forEach(function (s){
      if (s.cancelled) return;
      var c = s.invoice.currency || "ZAR";
      add(book.invoiced, c, s.gross);
      add(book.paid, c, s.paid);
      add(book.outstanding, c, s.balance);
      if (!s.invoice.dueDate && s.balance > 0) book.undated.push({ state:s, deal:d });
      if (s.invoice.dueDate && s.balance > 0 && daysBetween(today, s.invoice.dueDate) < 0){
        add(book.overdue, c, s.balance);
        book.overdueInvoices.push({ state:s, deal:d,
          daysLate: -daysBetween(today, s.invoice.dueDate) });
      }
      if (d.commissionRate != null && d.commissionable !== false){
        var earned = round2(s.commissionBase * d.commissionRate);
        var bag = s.settled ? book.earnedByUser : book.pendingByUser;
        bag[d.owner] = bag[d.owner] || {};
        bag[d.owner][c] = round2((bag[d.owner][c] || 0) + earned);
      }
    });
  });
  book.overdueInvoices.sort(function (a,b){ return b.daysLate - a.daysLate; });
  return book;
}

function round2(n){ return Math.round((+n || 0) * 100) / 100; }

/* ---------------- the three bands (C5) ---------------- */

function bands(st, cfg, today, opts){
  today = today || todayISO();
  opts = opts || {};
  var scope = opts.scope === "team" ? "team" : "mine";
  var me = opts.user;
  var mine = function (owner){ return scope === "team" || owner === me; };

  var overdue = [], dueToday = [], noNextStep = [];

  openFollowups(st).forEach(function (f){
    // a follow-up on a closed deal is inert: closing releases the invariant (C7)
    if (f.subjectType === "deal"){
      var d = st.deals[f.subjectId];
      if (!d || d.status !== "open") return;
    }
    if (!mine(f.owner)) return;
    var delta = daysBetween(today, f.dueDate);
    if (delta === null) return;
    if (delta < 0) overdue.push(f);
    else if (delta === 0) dueToday.push(f);
  });

  openDeals(st).forEach(function (d){
    if (!mine(d.owner)) return;
    if (openFollowupsFor(st, d.id).length === 0) noNextStep.push(d);
  });

  overdue.sort(function (a,b){
    if (a.dueDate !== b.dueDate) return a.dueDate < b.dueDate ? -1 : 1;
    return b.pushCount - a.pushCount;
  });
  dueToday.sort(function (a,b){ return a.createdAt < b.createdAt ? -1 : 1; });
  noNextStep.sort(function (a,b){                 // quietest account first
    var la = lastContact(st, a.id), lb = lastContact(st, b.id);
    if (la === lb) return a.name < b.name ? -1 : 1;
    if (!la) return -1; if (!lb) return 1;
    return la < lb ? -1 : 1;
  });

  return { overdue:overdue, dueToday:dueToday, noNextStep:noNextStep,
           total: overdue.length + dueToday.length + noNextStep.length };
}

/* Coverage line for the empty state — a statement of coverage, not a celebration. */
function coverage(st, cfg, today, opts){
  var b = bands(st, cfg, today, opts);
  var scope = (opts && opts.scope) === "team" ? "team" : "mine";
  var me = opts && opts.user;
  var ds = openDeals(st).filter(function(d){ return scope === "team" || d.owner === me; });
  return { openDeals: ds.length, withNextStep: ds.length - b.noNextStep.length, bands: b };
}

/* ---------------- forecast (C14a) — never converts currencies (C16) ---------------- */

function stageProb(cfg, stageId){
  var s = ((cfg && cfg.stages) || []).filter(function(x){ return x.id === stageId; })[0];
  return s && s.probability != null ? s.probability : 0;
}
function stageLabel(cfg, stageId){
  var s = ((cfg && cfg.stages) || []).filter(function(x){ return x.id === stageId; })[0];
  return s ? s.label : stageId;
}

function forecast(st, cfg, today, opts){
  today = today || todayISO();
  opts = opts || {};
  var scope = opts.scope === "team" ? "team" : "mine";
  var me = opts.user;
  var byCur = {};

  openDeals(st).forEach(function (d){
    if (scope !== "team" && d.owner !== me) return;
    if (d.value == null || isNaN(d.value)) return;
    var cur = d.currency || "ZAR";
    var b = byCur[cur] || (byCur[cur] = { currency:cur, gross:0, weighted:0, count:0,
                                          atRiskWeighted:0, atRiskCount:0, months:{} });
    var w = d.value * stageProb(cfg, d.stage);
    b.gross += d.value; b.weighted += w; b.count++;
    var passed = d.expectedCloseDate && daysBetween(today, d.expectedCloseDate) < 0;
    var noDate = !d.expectedCloseDate;
    if (passed || noDate){ b.atRiskWeighted += w; b.atRiskCount++; }
    var mk = d.expectedCloseDate ? monthKey(d.expectedCloseDate) : "none";
    var mm = b.months[mk] || (b.months[mk] = { key:mk, gross:0, weighted:0, count:0,
                                               passed:0, deals:[] });
    mm.gross += d.value; mm.weighted += w; mm.count++; mm.deals.push(d);
    if (passed || noDate) mm.passed++;
  });

  return Object.keys(byCur).sort().map(function (c){
    var b = byCur[c];
    b.monthList = Object.keys(b.months).sort(function(a,z){
      if (a === "none") return 1; if (z === "none") return -1;
      return a < z ? -1 : 1;
    }).map(function(k){ return b.months[k]; });
    b.atRiskPct = b.weighted > 0 ? Math.round(100 * b.atRiskWeighted / b.weighted) : 0;
    return b;
  });
}

/* ---------------- weekly retrospective (C14a) ---------------- */

function weekRetro(events, st, cfg, from, to, opts){
  opts = opts || {};
  var scope = opts.scope === "team" ? "team" : "mine";
  var me = opts.user;
  var inRange = function (iso){ return iso && iso >= from && iso <= to; };
  var mineFu = function (fid){
    var f = st.followups[fid];
    return f && (scope === "team" || f.owner === me);
  };

  var completed = 0, cancelled = 0, pushes = 0, pushedIds = {}, logged = 0, created = 0,
      won = 0, lost = 0, wonValue = {}, declined = 0;

  (events||[]).forEach(function (e){
    var day = String(e.ts).slice(0,10);
    if (!inRange(day)) return;
    var p = e.payload || {};
    if (scope !== "team" && e.actor !== me && e.type.indexOf("followup.") === 0 && !mineFu(p.followupId)) return;
    switch (e.type){
      case "followup.completed": if (mineFu(p.followupId)) completed++; break;
      case "followup.cancelled": if (mineFu(p.followupId)) cancelled++; break;
      case "followup.rescheduled":
        if (mineFu(p.followupId)){ pushes++; pushedIds[p.followupId] = true; } break;
      case "followup.created": if (mineFu(p.followupId)) created++; break;
      case "followup.declined": declined++; break;
      /* st.interactions has already had deleted deals swept out of it, so
         checking membership there is what keeps a deleted duplicate from
         inflating "conversations logged" in the retro. */
      case "interaction.logged":
        if ((scope === "team" || e.actor === me) && st.interactions[p.interactionId]) logged++;
        break;
      case "deal.closed": {
        var d = st.deals[p.dealId];
        if (d && (scope === "team" || d.owner === me)){
          if (p.outcome === "won"){ won++;
            if (d.value) wonValue[d.currency||"ZAR"] = (wonValue[d.currency||"ZAR"]||0) + d.value;
          } else lost++;
        }
        break;
      }
    }
  });

  // What was due in the window, and what is still open from it
  var dueInWindow = 0, stillOpenFromWindow = 0;
  for (var k in st.followups){
    var f = st.followups[k];
    if (scope !== "team" && f.owner !== me) continue;
    if (f.subjectType === "deal"){
      var dd = st.deals[f.subjectId]; if (!dd) continue;
    }
    var ref = f.status === "open" ? f.dueDate : (f.completedAt || f.dueDate);
    if (f.status === "open" && inRange(f.dueDate)) { dueInWindow++; }
    else if (f.status !== "open" && inRange(ref)) { dueInWindow++; }
    if (f.status === "open" && f.dueDate <= to && f.originalDue && inRange(f.originalDue)) stillOpenFromWindow++;
  }

  return { from:from, to:to, completed:completed, cancelled:cancelled, pushes:pushes,
           pushedItems:Object.keys(pushedIds).length, logged:logged, created:created,
           won:won, lost:lost, wonValue:wonValue, declined:declined,
           dueInWindow:dueInWindow, stillOpenFromWindow:stillOpenFromWindow };
}

/* ---------------- CSV ---------------- */

function csvEscape(v){
  var s = v == null ? "" : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(rows){
  return rows.map(function (r){ return r.map(csvEscape).join(","); }).join("\r\n");
}
function parseCSV(text){
  var rows = [], row = [], cur = "", q = false, i = 0;
  text = String(text || "").replace(/^﻿/, "");
  while (i < text.length){
    var ch = text[i];
    if (q){
      if (ch === '"'){
        if (text[i+1] === '"'){ cur += '"'; i += 2; continue; }
        q = false; i++; continue;
      }
      cur += ch; i++; continue;
    }
    if (ch === '"'){ q = true; i++; continue; }
    if (ch === ','){ row.push(cur); cur = ""; i++; continue; }
    if (ch === '\r'){ i++; continue; }
    if (ch === '\n'){ row.push(cur); rows.push(row); row = []; cur = ""; i++; continue; }
    cur += ch; i++;
  }
  if (cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function (r){ return r.length && !(r.length === 1 && r[0].trim() === ""); });
}

var IMPORT_ALIASES = {
  company:["company","company name","account","organisation","organization","customer","client"],
  dealName:["deal","deal name","opportunity","opportunity name","title"],
  stage:["stage","status","pipeline stage"],
  value:["value","amount","deal value","size","revenue"],
  currency:["currency","ccy"],
  expectedCloseDate:["expected close","expected close date","close date","closing date","close"],
  owner:["owner","rep","salesperson","assigned to","account manager"],
  contactName:["contact","contact name","primary contact"],
  contactEmail:["email","contact email","e-mail"],
  contactPhone:["phone","telephone","mobile","contact phone"],
  nextStep:["next step","next action","follow up","follow-up"],
  nextStepDue:["next step due","follow up date","follow-up date","due","due date"],
  notes:["notes","note","comment","comments"]
};
function mapHeaders(header){
  var idx = {};
  header.forEach(function (h, i){
    var key = String(h||"").trim().toLowerCase();
    for (var field in IMPORT_ALIASES)
      if (IMPORT_ALIASES[field].indexOf(key) >= 0 && idx[field] == null) idx[field] = i;
  });
  return idx;
}

/* Build bulk-create events from a CSV. Pure: caller decides whether to commit. */
function importCSV(text, cfg, ctx){
  ctx = ctx || {};
  var actor = ctx.actor || "howard";
  var today = ctx.today || todayISO();
  var nowTs = ctx.ts || (new Date().toISOString());
  var stages = (cfg && cfg.stages) || [];
  var stageIds = stages.map(function(s){ return s.id; });
  var byLabel = {}; stages.forEach(function(s){ byLabel[String(s.label).toLowerCase()] = s.id; });

  var rows = parseCSV(text);
  if (rows.length < 2) return { events:[], summary:{ companies:0, contacts:0, deals:0, followups:0, rows:0 }, errors:["No data rows found."] };

  var idx = mapHeaders(rows[0]);
  var errors = [];
  if (idx.company == null && idx.dealName == null)
    errors.push("Could not find a company or deal column. Expected a header like 'Company' or 'Deal'.");

  var events = [], seq = 0, companies = {}, contacts = {}, made = { companies:0, contacts:0, deals:0, followups:0 };
  /* Reuse what the CRM already holds. Without this the import is blind to the
     existing pipeline, so a sheet mentioning a company that is already there
     silently creates a SECOND company of the same name — and nothing shows it
     until the Companies screen lists the same name twice. */
  var existing = ctx.existing;
  if (existing){
    Object.keys(existing.companies || {}).forEach(function (k){
      var c = existing.companies[k];
      if (c && c.name) companies[String(c.name).trim().toLowerCase()] = c.id;
    });
    Object.keys(existing.contacts || {}).forEach(function (k){
      var c = existing.contacts[k];
      if (!c) return;
      if (c.email) contacts[String(c.email).trim().toLowerCase()] = c.id;
      else if (c.name) contacts[String(c.name).trim().toLowerCase()] = c.id;
    });
  }
  function ev(type, payload){
    events.push({ id:uid("ev"), ts:nowTs, seq:seq++, actor:actor, type:type, payload:payload });
  }
  var get = function (r, f){ return idx[f] == null ? "" : String(r[idx[f]] == null ? "" : r[idx[f]]).trim(); };

  for (var i = 1; i < rows.length; i++){
    var r = rows[i];
    var coName = get(r, "company") || get(r, "dealName") || "";
    if (!coName) continue;
    var coId = companies[coName.toLowerCase()];
    if (!coId){
      coId = uid("co"); companies[coName.toLowerCase()] = coId; made.companies++;
      ev("company.created", { companyId:coId, name:coName });
    }
    var ctName = get(r, "contactName"), ctEmail = get(r, "contactEmail");
    var ctId = null;
    if (ctName || ctEmail){
      var ckey = (ctEmail || ctName).toLowerCase();
      ctId = contacts[ckey];
      if (!ctId){
        ctId = uid("ct"); contacts[ckey] = ctId; made.contacts++;
        ev("contact.created", { contactId:ctId, companyId:coId, name:ctName || ctEmail,
                                email:ctEmail, phone:get(r,"contactPhone") });
      }
    }
    var rawStage = get(r, "stage").toLowerCase();
    var stage = stageIds.indexOf(rawStage) >= 0 ? rawStage : (byLabel[rawStage] || stageIds[0] || "lead");
    var rawVal = get(r, "value").replace(/[^\d.\-]/g, "");
    var val = rawVal === "" ? null : +rawVal;
    var cur = (get(r, "currency") || (cfg && cfg.defaultCurrency) || "ZAR").toUpperCase();
    var close = parseDateInput(get(r, "expectedCloseDate"), today);
    var owner = get(r, "owner") || actor;
    var dealId = uid("dl"); made.deals++;
    ev("deal.created", { dealId:dealId, companyId:coId, name:get(r,"dealName") || coName,
        owner:owner, stage:stage, value:val, currency:cur, expectedCloseDate:close,
        notes:get(r,"notes") });

    var what = get(r, "nextStep");
    var due  = parseDateInput(get(r, "nextStepDue"), today);
    if (what || due){
      made.followups++;
      ev("followup.created", { followupId:uid("fu"), subjectType:"deal", subjectId:dealId,
          owner:owner, dueDate: due || deferBy(today, 7), what: what || "Follow up" });
    }
  }
  return { events:events, summary:{ companies:made.companies, contacts:made.contacts,
           deals:made.deals, followups:made.followups, rows:rows.length - 1 }, errors:errors };
}

/* ---------------- import a triage batch (C18) ----------------
   The email-triage skill produces a batch of already-approved one-line
   summaries. It normally appends them straight to events/<user>.jsonl from a
   clone of the repo — but that needs a token, and the person holding the token
   is the person sitting in front of this app, not the machine that read the
   mail. So the app accepts the same file.

   Deals are matched by id when the batch carries one, and otherwise by company
   plus deal name, because a name is the only handle you have when the ids live
   in a browser you cannot read. Nothing is invented: a row that matches no deal
   is REPORTED, never turned into a new deal. Creating deals is a decision, and
   a deal with no first next step is born into band three anyway.

   The summary guards from the skill are re-applied here rather than trusted,
   because this file arrives over the same untrusted path as any other download. */
var TRIAGE_FURNITURE = /(^|\s)>|^\s*On .{0,80}\bwrote:|(^|\n)\s*From:\s/i;

function triageNorm(s){ return String(s == null ? "" : s).trim().toLowerCase(); }

function checkTriageSummary(s){
  if (typeof s !== "string" || !s.trim()) return "summary is missing";
  if (s.length > 200) return "summary is " + s.length + " characters — the limit is 200";
  if (/[\r\n]/.test(s)) return "summary runs onto a second line";
  if (TRIAGE_FURNITURE.test(s)) return "summary carries quoted-reply text (“>”, “On … wrote:” or “From:”)";
  return null;
}

/* A small, stable, synchronous hash. Only ever used to make an id repeatable so
   that importing the same batch twice is a no-op — never for anything that has
   to resist an adversary. */
function triageHash(s){
  var h1 = 0x811c9dc5, h2 = 0x01000193 ^ 0x9e3779b9;
  for (var i = 0; i < s.length; i++){
    var c = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
    h2 = Math.imul(h2 + c + 0x6d2b79f5, 0x85ebca6b) >>> 0;
  }
  return ("00000000" + h1.toString(16)).slice(-8) + ("00000000" + h2.toString(16)).slice(-8);
}

/* LinkedIn is its own channel, not a "note". Where a deal came in through
   LinkedIn and the conversation stayed there, filing it as a note loses the
   one fact that explains why nothing is in the mailbox. */
var TRIAGE_KINDS = { call:1, whatsapp:1, linkedin:1, email:1, meeting:1, note:1 };

function userIds(cfg){
  return ((cfg && cfg.users) || []).map(function (u){ return u.id; });
}
/* Who can OWN a deal. A deal belongs to the person who will carry it and be
   paid on it — never to whoever happened to file it. Marking people
   `"sales": true` in config.json is what lets the app refuse a deal filed to
   the wrong person instead of quietly defaulting it to the operator.

   An empty list means the config has not declared any, and everything falls
   back to the old behaviour rather than blocking a team that never opted in. */
function userName_(cfg, id){
  var u = ((cfg && cfg.users) || []).filter(function (x){ return x.id === id; })[0];
  return u ? u.name : id;
}
function salesUsers(cfg){
  return ((cfg && cfg.users) || []).filter(function (u){ return !!u.sales; })
    .map(function (u){ return u.id; });
}
/* Accept a person written as an id, a name, initials or an email — the batch is
   written by a human reading email signatures, not by something holding the
   roster. Returns the canonical id, or null if there is no such person. */
function resolveUser(cfg, who){
  var q = triageNorm(who);
  if (!q) return null;
  var us = (cfg && cfg.users) || [];
  for (var i = 0; i < us.length; i++){
    var u = us[i];
    if (triageNorm(u.id) === q || triageNorm(u.name) === q ||
        triageNorm(u.initials) === q || triageNorm(u.email) === q) return u.id;
  }
  /* first name, when unambiguous */
  var hits = us.filter(function (u){
    return triageNorm(String(u.name || "").split(/\s+/)[0]) === q; });
  return hits.length === 1 ? hits[0].id : null;
}

function importTriage(text, st, cfg, ctx){
  ctx = ctx || {};
  var today = ctx.today || todayISO();
  var actor = ctx.actor || "howard";
  var out = { events:[], rows:[], unmatched:[], revisions:[], dealChanges:[], errors:[],
              summary:{ rows:0, logged:0, followups:0, unmatched:0, duplicates:0,
                        revised:0, contacts:0, dealChanges:0 } };
  /* our own side, so colleagues on a thread never become customer contacts */
  var ourEmails = {};
  ((cfg && cfg.users) || []).forEach(function (u){
    if (u.email) ourEmails[triageNorm(u.email)] = true; });
  (ctx.ourEmails || []).forEach(function (e){ ourEmails[triageNorm(e)] = true; });
  var ctByEmail = {};
  Object.keys(st.contacts || {}).forEach(function (k){
    if (st.contacts[k].email) ctByEmail[triageNorm(st.contacts[k].email)] = k; });

  var batch;
  try { batch = JSON.parse(text); }
  catch (e){ out.errors.push("That is not a valid JSON file: " + (e.message || e)); return out; }
  if (!Array.isArray(batch)) batch = [batch];
  out.summary.rows = batch.length;

  /* what the app already holds, so a second import changes nothing */
  var seenIx = {};
  Object.keys(st.interactions || {}).forEach(function (k){ seenIx[k] = st.interactions[k]; });

  /* deal lookup: by id, and by "company ␟ deal" */
  var byId = {}, byName = {};
  Object.keys(st.deals).forEach(function (k){
    var d = st.deals[k];
    byId[d.id] = d;
    var co = st.companies[d.companyId];
    byName[triageNorm(co ? co.name : "") + "␟" + triageNorm(d.name)] = d;

    /* A private buyer's deal is filed under a holder company, so
       "Individual ␟ CDMP course" is the literal key — useless for matching,
       because the batch says "Steven Snyman". Index the PERSON as well.

       Index the deal's own contact regardless of whether anyone has ticked
       "holds individuals" on the company. Matching a real deal must not depend
       on a flag somebody has to remember to set: without this, a deal sitting
       plainly under Individual came back as "no deal yet" and was offered for
       creation a second time. */
    var party = dealParty(st, d);
    if (party.isIndividual)
      byName[triageNorm(party.name) + "␟" + triageNorm(d.name)] = d;
    var own = d.contactId ? st.contacts[d.contactId] : null;
    if (own){
      if (own.name)  byName[triageNorm(own.name) + "␟" + triageNorm(d.name)] = d;
      if (own.email) byName[triageNorm(own.email) + "␟" + triageNorm(d.name)] = d;
    }
    /* The partner side of a partner-led deal. Gary mails about SBSA from
       masterdata.co.za and signs as MasterData; the batch will say either. If
       only the customer's name is indexed, every partner thread comes back
       unmatched and gets offered as a brand-new deal — which is how you end up
       with the same opportunity filed twice under two different companies. */
    if (d.partnerCompanyId){
      var pco = st.companies[d.partnerCompanyId];
      if (pco && pco.name) byName[triageNorm(pco.name) + "␟" + triageNorm(d.name)] = d;
      Object.keys(st.contacts).forEach(function (ck){
        var pc = st.contacts[ck];
        if (pc.companyId !== d.partnerCompanyId) return;
        if (pc.name)  byName[triageNorm(pc.name)  + "␟" + triageNorm(d.name)] = d;
        if (pc.email) byName[triageNorm(pc.email) + "␟" + triageNorm(d.name)] = d;
      });
    }

    /* …and any contact filed alongside it in a holder company, since a person
       bucket has no company name worth matching on. */
    if (co && co.isHolder){
      Object.keys(st.contacts).forEach(function (ck){
        var c = st.contacts[ck];
        if (c.companyId !== co.id) return;
        if (c.name  && byName[triageNorm(c.name)  + "␟" + triageNorm(d.name)] === undefined && d.contactId === c.id)
          byName[triageNorm(c.name) + "␟" + triageNorm(d.name)] = d;
      });
    }
  });

  batch.forEach(function (r, i){
    var where = "row " + (i + 1) + (r && r.summary ? " (“" + String(r.summary).slice(0, 40) + "…”)" : "");
    if (!r || typeof r !== "object"){ out.errors.push(where + ": not an object."); return; }

    var bad = checkTriageSummary(r.summary);
    if (bad){ out.errors.push(where + ": " + bad + ". Nothing from this row was imported."); return; }

    var kind = triageNorm(r.kind) || "email";
    if (!TRIAGE_KINDS[kind]){
      /* Listed from the table itself, so adding a channel never leaves the
         error message quietly recommending the old set. */
      out.errors.push(where + ": “" + r.kind + "” is not a kind. Use " +
        Object.keys(TRIAGE_KINDS).join(", ") + ".");
      return;
    }
